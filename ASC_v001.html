이 많이 온다고 해서 지역 학교 문제가 자동으로 해결되지는 않는다. 병원, 돌봄, 청년 일자리, 주거, 교육 같은 문제는 여전히 정주 인구의 문제다.\n\n생활인구는 새로운 힘이지만, 어려운 문제를 덮는 말이 되어서는 안 된다.\n\n그래서 나는 생활인구를 “대체”가 아니라 “보완”으로 읽는다. 줄어드는 정주 인구의 현실을 인정하면서도, 도시가 외부와 맺는 관계를 더 넓게 보는 개념.", "body_html": "<p>하지만 생활인구는 정주 인구의 대체물이 아니다.</p>\n<p>이 점을 분명히 해야 한다. 외지인이 많이 온다고 해서 지역 학교 문제가 자동으로 해결되지는 않는다. 병원, 돌봄, 청년 일자리, 주거, 교육 같은 문제는 여전히 정주 인구의 문제다.</p>\n<p>생활인구는 새로운 힘이지만, 어려운 문제를 덮는 말이 되어서는 안 된다.</p>\n<p>그래서 나는 생활인구를 “대체”가 아니라 “보완”으로 읽는다. 줄어드는 정주 인구의 현실을 인정하면서도, 도시가 외부와 맺는 관계를 더 넓게 보는 개념.</p>\n", "plain_len": 256, "type": "essay", "rawIndex": 2}, {"title": "Page 03 · My Standard", "body_md": "나는 생활인구를 볼 때 세 가지를 묻고 싶다.\n\n- 그 사람들은 지역에서 얼마나 오래 머무는가?\n- 그 사람들의 소비는 지역 안에 얼마나 남는가?\n- 그 사람들은 다시 찾아올 이유를 갖게 되는가?\n\n단순 방문객 수보다 이 세 질문이 더 중요하다. 하루 평균 방문객은 늘 수 있다. 하지만 사람들이 모두 같은 장소만 찍고 떠난다면 지역의 두께는 커지지 않는다.\n\n반대로 방문객 수가 적어도 오래 머물고, 깊게 쓰고, 다시 찾아오면 도시는 다르게 움직인다.", "body_html": "<p>나는 생활인구를 볼 때 세 가지를 묻고 싶다.</p>\n<ul>\n<li>그 사람들은 지역에서 얼마나 오래 머무는가?</li>\n<li>그 사람들의 소비는 지역 안에 얼마나 남는가?</li>\n<li>그 사람들은 다시 찾아올 이유를 갖게 되는가?</li>\n</ul>\n<p>단순 방문객 수보다 이 세 질문이 더 중요하다. 하루 평균 방문객은 늘 수 있다. 하지만 사람들이 모두 같은 장소만 찍고 떠난다면 지역의 두께는 커지지 않는다.</p>\n<p>반대로 방문객 수가 적어도 오래 머물고, 깊게 쓰고, 다시 찾아오면 도시는 다르게 움직인다.</p>\n", "plain_len": 244, "type": "list", "rawIndex": 3}, {"title": "Page 04 · Relationship Map", "body_md": "```text\n1회 방문자\n└─ 영화가 만든 호기심\n\n반복 방문자\n└─ 장소와 계절이 만든 기억\n\n느슨한 관계자\n└─ 지역을 자기 생활권의 일부로 느낌\n\n정주자\n└─ 지역의 일상과 제도 안에서 삶을 꾸림\n```\n\n영월의 전략은 1회 방문자를 반복 방문자로, 반복 방문자를 느슨한 관계자로 옮기는 데 있어야 한다.", "body_html": "<pre><code class=\"language-text\">1회 방문자\n└─ 영화가 만든 호기심\n\n반복 방문자\n└─ 장소와 계절이 만든 기억\n\n느슨한 관계자\n└─ 지역을 자기 생활권의 일부로 느낌\n\n정주자\n└─ 지역의 일상과 제도 안에서 삶을 꾸림\n</code></pre>\n<p>영월의 전략은 1회 방문자를 반복 방문자로, 반복 방문자를 느슨한 관계자로 옮기는 데 있어야 한다.</p>\n", "plain_len": 55, "type": "diagram", "rawIndex": 4}, {"title": "Page 05 · Bridge", "body_md": "이제 사례로 들어간다.\n\n영월의 생활인구 가능성은 기차여행, 시장, 밤의 체류, 문화 공간, 계절별 축제 안에서 보인다. 중요한 것은 이것들을 따로따로 두지 않고 하나의 길로 묶는 것이다.\n\n사람은 한 장소 때문에 도시를 찾지만, 다시 오는 이유는 도시 전체에서 생긴다.", "body_html": "<p>이제 사례로 들어간다.</p>\n<p>영월의 생활인구 가능성은 기차여행, 시장, 밤의 체류, 문화 공간, 계절별 축제 안에서 보인다. 중요한 것은 이것들을 따로따로 두지 않고 하나의 길로 묶는 것이다.</p>\n<p>사람은 한 장소 때문에 도시를 찾지만, 다시 오는 이유는 도시 전체에서 생긴다.</p>\n", "plain_len": 149, "type": "essay", "rawIndex": 5}], "totalPages": 5}, {"num": "04", "key": "Case", "label": "Case", "ko": "사례", "title": "하루 방문을 이틀의 기억으로 바꾸는 법", "short": "CA", "pages": [{"title": "Page 01 · 기차여행 상품", "body_md": "연합뉴스는 영월군이 코레일 충북본부와 함께 영화 〈왕과 사는 남자〉 관련 관광지 기차여행 상품을 출시했다고 보도했다. 청량리, 대전, 부산에서 출발한 여행객이 제천에 모여 관광버스로 영월을 둘러보는 방식이다.\n\n이 상품이 흥미로운 이유는 이동의 장벽을 낮추기 때문이다. 지방도시 여행에서 교통은 언제나 큰 문제다. 좋은 장소가 있어도 가는 길이 복잡하면 사람은 포기한다.\n\n기차여행은 영화의 감정을 실제 이동으로 바꾸는 장치다.", "body_html": "<p>연합뉴스는 영월군이 코레일 충북본부와 함께 영화 〈왕과 사는 남자〉 관련 관광지 기차여행 상품을 출시했다고 보도했다. 청량리, 대전, 부산에서 출발한 여행객이 제천에 모여 관광버스로 영월을 둘러보는 방식이다.</p>\n<p>이 상품이 흥미로운 이유는 이동의 장벽을 낮추기 때문이다. 지방도시 여행에서 교통은 언제나 큰 문제다. 좋은 장소가 있어도 가는 길이 복잡하면 사람은 포기한다.</p>\n<p>기차여행은 영화의 감정을 실제 이동으로 바꾸는 장치다.</p>\n", "plain_len": 237, "type": "essay", "rawIndex": 1}, {"title": "Page 02 · 시장과 식사", "body_md": "여행에서 밥은 중요하다.\n\n역사 장소를 보고, 지형을 보고, 사진을 찍는 것만으로는 도시가 몸에 남지 않는다. 밥을 먹어야 한다. 시장을 지나야 한다. 앉아서 쉬어야 한다. 여행의 기억은 의외로 이런 사소한 시간에 오래 붙는다.\n\n영월의 방문객 증가가 지역에 남으려면 청령포와 장릉의 발걸음이 시장과 식당, 카페, 숙소로 이어져야 한다. 이것은 경제 효과이기도 하지만, 동시에 도시 경험의 완성이다.", "body_html": "<p>여행에서 밥은 중요하다.</p>\n<p>역사 장소를 보고, 지형을 보고, 사진을 찍는 것만으로는 도시가 몸에 남지 않는다. 밥을 먹어야 한다. 시장을 지나야 한다. 앉아서 쉬어야 한다. 여행의 기억은 의외로 이런 사소한 시간에 오래 붙는다.</p>\n<p>영월의 방문객 증가가 지역에 남으려면 청령포와 장릉의 발걸음이 시장과 식당, 카페, 숙소로 이어져야 한다. 이것은 경제 효과이기도 하지만, 동시에 도시 경험의 완성이다.</p>\n", "plain_len": 221, "type": "essay", "rawIndex": 2}, {"title": "Page 03 · 밤의 체류", "body_md": "하루 여행은 쉽다. 하지만 지역이 오래 살아 움직이려면 하룻밤이 중요하다.\n\n밤을 보내는 순간 여행자는 도시의 다른 얼굴을 본다. 낮에는 보이지 않던 조용함, 숙소 주변의 골목, 저녁 식사, 밤하늘이 생긴다. 별마로천문대는 이런 체류의 이유가 될 수 있다.\n\n영월이 반나절 여행지에 머물지 않으려면 밤의 콘텐츠를 더 잘 엮어야 한다. 낮의 역사, 오후의 지형, 밤의 별. 이 조합은 꽤 강하다.", "body_html": "<p>하루 여행은 쉽다. 하지만 지역이 오래 살아 움직이려면 하룻밤이 중요하다.</p>\n<p>밤을 보내는 순간 여행자는 도시의 다른 얼굴을 본다. 낮에는 보이지 않던 조용함, 숙소 주변의 골목, 저녁 식사, 밤하늘이 생긴다. 별마로천문대는 이런 체류의 이유가 될 수 있다.</p>\n<p>영월이 반나절 여행지에 머물지 않으려면 밤의 콘텐츠를 더 잘 엮어야 한다. 낮의 역사, 오후의 지형, 밤의 별. 이 조합은 꽤 강하다.</p>\n", "plain_len": 218, "type": "essay", "rawIndex": 3}, {"title": "Page 04 · 계절별 재방문", "body_md": "재방문은 계절에서 나온다.\n\n봄에는 단종문화제와 영화의 여운이 있다. 여름에는 동강과 어라연의 물길이 있다. 가을에는 산과 사진의 계절이 있다. 겨울에는 밤하늘과 조용한 장릉이 다르게 보일 수 있다.\n\n지역이 할 일은 “언제 와도 좋다”가 아니라 “이번 계절에는 이 이유로 오라”고 말하는 것이다. 이유가 분명해야 재방문이 생긴다.", "body_html": "<p>재방문은 계절에서 나온다.</p>\n<p>봄에는 단종문화제와 영화의 여운이 있다. 여름에는 동강과 어라연의 물길이 있다. 가을에는 산과 사진의 계절이 있다. 겨울에는 밤하늘과 조용한 장릉이 다르게 보일 수 있다.</p>\n<p>지역이 할 일은 “언제 와도 좋다”가 아니라 “이번 계절에는 이 이유로 오라”고 말하는 것이다. 이유가 분명해야 재방문이 생긴다.</p>\n", "plain_len": 183, "type": "essay", "rawIndex": 4}, {"title": "Page 05 · Case Insight", "body_md": "하루 방문을 이틀의 기억으로 바꾸는 구조는 이렇다.\n\n```text\n영화가 만든 호기심\n→ 청령포·장릉 방문\n→ 시장과 식사\n→ 한반도지형 또는 선돌\n→ 별마로천문대의 밤\n→ 다음 계절 재방문 이유\n```\n\n이 동선이 살아나면 영월은 촬영지를 넘어 생활인구를 만드는 도시가 될 수 있다.", "body_html": "<p>하루 방문을 이틀의 기억으로 바꾸는 구조는 이렇다.</p>\n<pre><code class=\"language-text\">영화가 만든 호기심\n→ 청령포·장릉 방문\n→ 시장과 식사\n→ 한반도지형 또는 선돌\n→ 별마로천문대의 밤\n→ 다음 계절 재방문 이유\n</code></pre>\n<p>이 동선이 살아나면 영월은 촬영지를 넘어 생활인구를 만드는 도시가 될 수 있다.</p>\n", "plain_len": 73, "type": "diagram", "rawIndex": 5}], "totalPages": 5}, {"num": "05", "key": "Archive", "label": "Archive", "ko": "기록", "title": "방문을 관계로 바꾸는 질문", "short": "AR", "pages": [{"title": "Page 01 · Three Sentences", "body_md": "오늘의 핵심은 세 문장이다.\n\n1. 방문객 증가는 중요하지만, 방문 자체가 도시 회복은 아니다.\n2. 생활인구는 정주 인구의 대체가 아니라, 도시 관계를 넓게 보는 보완 개념이다.\n3. 영월의 과제는 영화로 열린 방문을 체류, 재방문, 느슨한 관계로 바꾸는 것이다.", "body_html": "<p>오늘의 핵심은 세 문장이다.</p>\n<ol>\n<li>방문객 증가는 중요하지만, 방문 자체가 도시 회복은 아니다.</li>\n<li>생활인구는 정주 인구의 대체가 아니라, 도시 관계를 넓게 보는 보완 개념이다.</li>\n<li>영월의 과제는 영화로 열린 방문을 체류, 재방문, 느슨한 관계로 바꾸는 것이다.</li>\n</ol>\n", "plain_len": 147, "type": "list", "rawIndex": 1}, {"title": "Page 02 · Questions", "body_md": "오늘 읽고 남길 질문:\n\n- 나는 어떤 도시를 한 번만 방문했고, 어떤 도시는 다시 찾았는가?\n- 다시 찾게 만든 것은 유명 관광지였는가, 아니면 작은 경험이었는가?\n- 생활인구라는 말은 지역의 현실을 넓게 보게 하는가, 아니면 문제를 덮는가?\n- 영월은 방문객의 시간을 얼마나 오래 붙잡을 수 있을까?", "body_html": "<p>오늘 읽고 남길 질문:</p>\n<ul>\n<li>나는 어떤 도시를 한 번만 방문했고, 어떤 도시는 다시 찾았는가?</li>\n<li>다시 찾게 만든 것은 유명 관광지였는가, 아니면 작은 경험이었는가?</li>\n<li>생활인구라는 말은 지역의 현실을 넓게 보게 하는가, 아니면 문제를 덮는가?</li>\n<li>영월은 방문객의 시간을 얼마나 오래 붙잡을 수 있을까?</li>\n</ul>\n", "plain_len": 160, "type": "archive", "rawIndex": 2}, {"title": "Page 03 · Metrics", "body_md": "방문 이후에 봐야 할 지표:\n\n| 지표 | 질문 |\n|---|---|\n| 평균 체류 시간 | 사람들이 얼마나 오래 머무는가 |\n| 숙박 전환율 | 하루 방문이 하룻밤으로 이어지는가 |\n| 지역 내 소비 분산 | 특정 장소만이 아니라 여러 상권으로 퍼지는가 |\n| 재방문율 | 한 번 온 사람이 다시 오는가 |\n| 주민 체감 | 지역 사람에게도 좋은 변화인가 |", "body_html": "<p>방문 이후에 봐야 할 지표:</p>\n<table>\n<thead>\n<tr>\n  <th>지표</th>\n  <th>질문</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>평균 체류 시간</td>\n  <td>사람들이 얼마나 오래 머무는가</td>\n</tr>\n<tr>\n  <td>숙박 전환율</td>\n  <td>하루 방문이 하룻밤으로 이어지는가</td>\n</tr>\n<tr>\n  <td>지역 내 소비 분산</td>\n  <td>특정 장소만이 아니라 여러 상권으로 퍼지는가</td>\n</tr>\n<tr>\n  <td>재방문율</td>\n  <td>한 번 온 사람이 다시 오는가</td>\n</tr>\n<tr>\n  <td>주민 체감</td>\n  <td>지역 사람에게도 좋은 변화인가</td>\n</tr>\n</tbody>\n</table>\n", "plain_len": 154, "type": "diagram", "rawIndex": 3}, {"title": "Page 04 · Next", "body_md": "내일은 토요일이다.\n\n실제로 사람들이 움직이는 날이다. 이제 질문은 더 구체적이어야 한다. 영화 이후의 열기를 어떻게 동선으로 만들 것인가. 반짝 유행이 지나간 뒤에도 남는 여행 구조는 어떻게 만들 수 있을까.\n\n토요일은 영화 이후의 도시를 읽는다.\n\n---", "body_html": "<p>내일은 토요일이다.</p>\n<p>실제로 사람들이 움직이는 날이다. 이제 질문은 더 구체적이어야 한다. 영화 이후의 열기를 어떻게 동선으로 만들 것인가. 반짝 유행이 지나간 뒤에도 남는 여행 구조는 어떻게 만들 수 있을까.</p>\n<p>토요일은 영화 이후의 도시를 읽는다.</p>\n<hr />\n", "plain_len": 137, "type": "essay", "rawIndex": 4}], "totalPages": 4}]}, {"date": "2026-05-09", "weekday": "토", "weekdayFull": "토요일", "no": "006", "titleLine": "2026-05-09 토요일 · No.006", "theme": "반짝 유행을 오래 남는 동선으로 바꾸는 법", "note_html": "<aside class=\"note-card\"><strong>토요일의 역할</strong><p>토요일은 실제 여행자의 날이다.<br />\n이 날짜는 영화 흥행 이후의 도시 운영과 큐레이션을 다룬다.<br />\n핵심은 “핫플을 만드는 것보다 동선을 만드는 것이 더 중요하다”는 점이다.</p>\n</aside>\n\n", "sections": [{"num": "01", "key": "Intro", "label": "Intro", "ko": "입구", "title": "사람들이 몰리는 날, 도시는 시험을 본다", "short": "IN", "pages": [{"title": "Page 01 · Cover", "body_md": "토요일의 도시는 시험을 본다.\n\n평일에는 괜찮아 보이던 동선도 주말에는 갑자기 약점이 드러난다. 주차가 막히고, 줄이 길어지고, 식당이 밀리고, 화장실과 안내 표지의 부족이 보인다. 사람은 많아졌는데 도시의 경험은 나빠질 수도 있다.\n\n영화 이후 영월이 마주한 문제도 여기에 있다. 관심은 왔다. 발걸음도 왔다. 그런데 관심을 좋은 경험으로 바꾸는 일은 따로 필요하다.\n\n핫플은 생길 수 있다. 하지만 좋은 도시는 핫플 하나로 만들어지지 않는다.", "body_html": "<p>토요일의 도시는 시험을 본다.</p>\n<p>평일에는 괜찮아 보이던 동선도 주말에는 갑자기 약점이 드러난다. 주차가 막히고, 줄이 길어지고, 식당이 밀리고, 화장실과 안내 표지의 부족이 보인다. 사람은 많아졌는데 도시의 경험은 나빠질 수도 있다.</p>\n<p>영화 이후 영월이 마주한 문제도 여기에 있다. 관심은 왔다. 발걸음도 왔다. 그런데 관심을 좋은 경험으로 바꾸는 일은 따로 필요하다.</p>\n<p>핫플은 생길 수 있다. 하지만 좋은 도시는 핫플 하나로 만들어지지 않는다.</p>\n", "plain_len": 246, "type": "cover", "rawIndex": 1}, {"title": "Page 02 · Scene", "body_md": "주말 청령포 앞을 상상해본다.\n\n배를 타려는 사람들, 사진을 찍는 사람들, 아이와 함께 온 가족, 영화를 보고 온 연인, 단종 이야기를 처음 제대로 듣는 사람, 안내판 앞에 멈춘 사람, 빨리 다음 장소로 가고 싶은 사람. 이 사람들이 한 공간에 모인다.\n\n이때 도시의 설계가 드러난다. 줄을 어떻게 안내하는가. 기다리는 동안 무엇을 볼 수 있는가. 청령포를 본 뒤 자연스럽게 어디로 가게 하는가. 장릉으로 가는 길이 친절한가. 시장과 식사 동선은 연결되어 있는가.\n\n경험은 장소 하나가 아니라 이동 전체에서 만들어진다.", "body_html": "<p>주말 청령포 앞을 상상해본다.</p>\n<p>배를 타려는 사람들, 사진을 찍는 사람들, 아이와 함께 온 가족, 영화를 보고 온 연인, 단종 이야기를 처음 제대로 듣는 사람, 안내판 앞에 멈춘 사람, 빨리 다음 장소로 가고 싶은 사람. 이 사람들이 한 공간에 모인다.</p>\n<p>이때 도시의 설계가 드러난다. 줄을 어떻게 안내하는가. 기다리는 동안 무엇을 볼 수 있는가. 청령포를 본 뒤 자연스럽게 어디로 가게 하는가. 장릉으로 가는 길이 친절한가. 시장과 식사 동선은 연결되어 있는가.</p>\n<p>경험은 장소 하나가 아니라 이동 전체에서 만들어진다.</p>\n", "plain_len": 287, "type": "essay", "rawIndex": 2}, {"title": "Page 03 · Question", "body_md": "토요일의 질문은 이것이다.\n\n- 영화 이후의 관심은 어떻게 좋은 여행 동선이 되는가?\n- 방문객이 몰릴 때 지역은 무엇을 먼저 정비해야 하는가?\n- 촬영지 중심 관광을 도시 전체의 체류로 바꾸려면 어떤 편집이 필요한가?\n- 유행이 지나간 뒤에도 남는 것은 무엇인가?\n\n나는 여기서 “큐레이션”이라는 말을 쓰고 싶다. 큐레이션은 쉽게 말해 고르고, 순서를 정하고, 의미를 붙이는 일이다. 좋은 지역 큐레이션은 사람을 많이 데려오는 일이 아니라, 사람이 도시를 더 잘 읽고 돌아가게 하는 일이다.", "body_html": "<p>토요일의 질문은 이것이다.</p>\n<ul>\n<li>영화 이후의 관심은 어떻게 좋은 여행 동선이 되는가?</li>\n<li>방문객이 몰릴 때 지역은 무엇을 먼저 정비해야 하는가?</li>\n<li>촬영지 중심 관광을 도시 전체의 체류로 바꾸려면 어떤 편집이 필요한가?</li>\n<li>유행이 지나간 뒤에도 남는 것은 무엇인가?</li>\n</ul>\n<p>나는 여기서 “큐레이션”이라는 말을 쓰고 싶다. 큐레이션은 쉽게 말해 고르고, 순서를 정하고, 의미를 붙이는 일이다. 좋은 지역 큐레이션은 사람을 많이 데려오는 일이 아니라, 사람이 도시를 더 잘 읽고 돌아가게 하는 일이다.</p>\n", "plain_len": 265, "type": "list", "rawIndex": 3}, {"title": "Page 04 · Bridge", "body_md": "영월은 지금 큐레이션의 시점에 있다.\n\n영화는 이미 사람들을 불렀다. 이제 필요한 것은 “어디를 갈 것인가”보다 “어떤 순서로 읽을 것인가”다. 같은 장소도 순서가 달라지면 전혀 다르게 남는다.\n\n청령포를 먼저 볼 것인가, 장릉을 먼저 볼 것인가. 한반도지형을 어디에 넣을 것인가. 시장은 중간에 넣을 것인가, 끝에 넣을 것인가. 별마로천문대는 하룻밤의 이유가 될 수 있는가.\n\n이제 쟁점으로 들어간다.", "body_html": "<p>영월은 지금 큐레이션의 시점에 있다.</p>\n<p>영화는 이미 사람들을 불렀다. 이제 필요한 것은 “어디를 갈 것인가”보다 “어떤 순서로 읽을 것인가”다. 같은 장소도 순서가 달라지면 전혀 다르게 남는다.</p>\n<p>청령포를 먼저 볼 것인가, 장릉을 먼저 볼 것인가. 한반도지형을 어디에 넣을 것인가. 시장은 중간에 넣을 것인가, 끝에 넣을 것인가. 별마로천문대는 하룻밤의 이유가 될 수 있는가.</p>\n<p>이제 쟁점으로 들어간다.</p>\n", "plain_len": 222, "type": "essay", "rawIndex": 4}], "totalPages": 4}, {"num": "02", "key": "Issue", "label": "Issue", "ko": "쟁점", "title": "핫플보다 동선이 중요하다", "short": "IS", "pages": [{"title": "Page 01 · Cover", "body_md": "핫플은 빠르게 생기고 빠르게 식는다.\n\n사람들은 몰리고, 사진은 쌓이고, 해시태그가 생긴다. 그런데 핫플이 도시 전체를 살리는 것은 아니다. 오히려 특정 장소만 과열되고 다른 장소는 비어 있을 수 있다.\n\n동선은 다르다.\n\n동선은 장소와 장소를 이어준다. 한 사람의 시간을 도시 안에 묶는다. 잘 만든 동선은 방문객을 한 장소의 소비자에서 도시 전체의 독자로 바꾼다.\n\n영월에 필요한 것은 핫플 하나가 아니라 좋은 읽기 순서다.", "body_html": "<p>핫플은 빠르게 생기고 빠르게 식는다.</p>\n<p>사람들은 몰리고, 사진은 쌓이고, 해시태그가 생긴다. 그런데 핫플이 도시 전체를 살리는 것은 아니다. 오히려 특정 장소만 과열되고 다른 장소는 비어 있을 수 있다.</p>\n<p>동선은 다르다.</p>\n<p>동선은 장소와 장소를 이어준다. 한 사람의 시간을 도시 안에 묶는다. 잘 만든 동선은 방문객을 한 장소의 소비자에서 도시 전체의 독자로 바꾼다.</p>\n<p>영월에 필요한 것은 핫플 하나가 아니라 좋은 읽기 순서다.</p>\n", "plain_len": 235, "type": "cover", "rawIndex": 1}, {"title": "Page 02 · Concentration Problem", "body_md": "KCTI 자료는 영화의 효과가 핵심 배경지인 청령포와 단종장릉에 집중되었다고 설명한다. 직접 관련성이 낮은 관광 지점의 증가폭은 제한적이었다는 점도 함께 나온다.\n\n이것은 자연스러운 일이다. 사람들은 영화와 가장 직접적으로 연결된 장소를 먼저 찾는다. 문제는 그 다음이다. 관심이 청령포와 장릉에만 머무르면, 영월의 다른 층은 보이지 않는다.\n\n그래서 도시는 분산이 필요하다. 분산은 사람을 흩어놓는 일이 아니라, 더 넓게 읽게 하는 일이다.", "body_html": "<p>KCTI 자료는 영화의 효과가 핵심 배경지인 청령포와 단종장릉에 집중되었다고 설명한다. 직접 관련성이 낮은 관광 지점의 증가폭은 제한적이었다는 점도 함께 나온다.</p>\n<p>이것은 자연스러운 일이다. 사람들은 영화와 가장 직접적으로 연결된 장소를 먼저 찾는다. 문제는 그 다음이다. 관심이 청령포와 장릉에만 머무르면, 영월의 다른 층은 보이지 않는다.</p>\n<p>그래서 도시는 분산이 필요하다. 분산은 사람을 흩어놓는 일이 아니라, 더 넓게 읽게 하는 일이다.</p>\n", "plain_len": 245, "type": "essay", "rawIndex": 2}, {"title": "Page 03 · Safety and Dignity", "body_md": "사람이 몰리면 안전이 먼저다.\n\n유배지와 왕릉 같은 역사 장소는 특히 더 그렇다. 줄 관리, 이동 안내, 안내 인력, 설명 자료, 휴식 공간, 쓰레기 관리가 모두 경험의 일부가 된다. 이것이 부족하면 방문객은 많아도 장소의 품위는 떨어진다.\n\n나는 역사 장소에서 “많이 왔다”는 말보다 “잘 머물렀다”는 말이 더 중요하다고 생각한다. 사람이 많을수록 장소는 더 조용하게 설계되어야 한다. 시끄러운 홍보보다 정확한 안내가 더 필요하다.", "body_html": "<p>사람이 몰리면 안전이 먼저다.</p>\n<p>유배지와 왕릉 같은 역사 장소는 특히 더 그렇다. 줄 관리, 이동 안내, 안내 인력, 설명 자료, 휴식 공간, 쓰레기 관리가 모두 경험의 일부가 된다. 이것이 부족하면 방문객은 많아도 장소의 품위는 떨어진다.</p>\n<p>나는 역사 장소에서 “많이 왔다”는 말보다 “잘 머물렀다”는 말이 더 중요하다고 생각한다. 사람이 많을수록 장소는 더 조용하게 설계되어야 한다. 시끄러운 홍보보다 정확한 안내가 더 필요하다.</p>\n", "plain_len": 240, "type": "essay", "rawIndex": 3}, {"title": "Page 04 · The Four Routes", "body_md": "영월의 영화 이후 동선은 네 갈래로 나눌 수 있다.\n\n| 동선 | 핵심 장소 | 독자 경험 |\n|---|---|---|\n| 단종 기억 동선 | 청령포 → 장릉 → 관풍헌 | 역사와 애도 |\n| 지형 동선 | 한반도지형 → 선돌 → 어라연 | 강과 산의 시야 |\n| 밤 체류 동선 | 저녁 식사 → 별마로천문대 → 숙박 | 하루를 넘기는 경험 |\n| 문화광산 동선 | 사진·예술 공간 → 시장 → 기록 콘텐츠 | 현재의 문화 |\n\n이 네 갈래가 따로 놀면 관광 목록이 된다. 서로 이어지면 매거진 같은 도시 경험이 된다.", "body_html": "<p>영월의 영화 이후 동선은 네 갈래로 나눌 수 있다.</p>\n<table>\n<thead>\n<tr>\n  <th>동선</th>\n  <th>핵심 장소</th>\n  <th>독자 경험</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>단종 기억 동선</td>\n  <td>청령포 → 장릉 → 관풍헌</td>\n  <td>역사와 애도</td>\n</tr>\n<tr>\n  <td>지형 동선</td>\n  <td>한반도지형 → 선돌 → 어라연</td>\n  <td>강과 산의 시야</td>\n</tr>\n<tr>\n  <td>밤 체류 동선</td>\n  <td>저녁 식사 → 별마로천문대 → 숙박</td>\n  <td>하루를 넘기는 경험</td>\n</tr>\n<tr>\n  <td>문화광산 동선</td>\n  <td>사진·예술 공간 → 시장 → 기록 콘텐츠</td>\n  <td>현재의 문화</td>\n</tr>\n</tbody>\n</table>\n<p>이 네 갈래가 따로 놀면 관광 목록이 된다. 서로 이어지면 매거진 같은 도시 경험이 된다.</p>\n", "plain_len": 234, "type": "diagram", "rawIndex": 4}, {"title": "Page 05 · Issue Summary", "body_md": "핫플은 사람을 부른다.\n\n동선은 사람을 머물게 한다.\n\n해석은 사람을 다시 오게 한다.\n\n이 세 가지를 구분해야 한다. 영월은 이미 사람을 부르는 계기를 얻었다. 이제 머물게 하는 동선과 다시 오게 하는 해석이 필요하다.", "body_html": "<p>핫플은 사람을 부른다.</p>\n<p>동선은 사람을 머물게 한다.</p>\n<p>해석은 사람을 다시 오게 한다.</p>\n<p>이 세 가지를 구분해야 한다. 영월은 이미 사람을 부르는 계기를 얻었다. 이제 머물게 하는 동선과 다시 오게 하는 해석이 필요하다.</p>\n", "plain_len": 120, "type": "archive", "rawIndex": 5}, {"title": "Page 06 · Bridge", "body_md": "이제 해석으로 넘어간다.\n\n영화 관광은 늘 양면적이다. 잘하면 지역의 기억을 열고, 못하면 장소를 장면 소비로만 만든다. 영월이 오래 남으려면 영화의 힘을 빌리되, 영화보다 큰 도시의 언어를 만들어야 한다.", "body_html": "<p>이제 해석으로 넘어간다.</p>\n<p>영화 관광은 늘 양면적이다. 잘하면 지역의 기억을 열고, 못하면 장소를 장면 소비로만 만든다. 영월이 오래 남으려면 영화의 힘을 빌리되, 영화보다 큰 도시의 언어를 만들어야 한다.</p>\n", "plain_len": 114, "type": "essay", "rawIndex": 6}], "totalPages": 6}, {"num": "03", "key": "Insight", "label": "Insight", "ko": "해석", "title": "영화는 문을 열 뿐, 도시는 방을 만들어야 한다", "short": "SG", "pages": [{"title": "Page 01 · Concept", "body_md": "영화는 문을 연다.\n\n관객은 화면을 통해 어떤 장소를 처음 본다. 영화가 좋으면 그 장소에 가보고 싶어진다. 이것이 영화 관광의 힘이다. 하지만 영화는 문일 뿐이다. 문을 열고 들어온 사람에게 어떤 방을 보여줄지는 도시의 몫이다.\n\n영월이 해야 할 일은 “여기가 영화에 나온 곳입니다”라고 말하는 데서 끝나지 않는다. 그 문장 다음에 더 깊은 방을 보여줘야 한다. 단종의 역사, 청령포의 지형, 장릉의 늦은 회복, 영월의 강과 산, 문화광산의 실험.", "body_html": "<p>영화는 문을 연다.</p>\n<p>관객은 화면을 통해 어떤 장소를 처음 본다. 영화가 좋으면 그 장소에 가보고 싶어진다. 이것이 영화 관광의 힘이다. 하지만 영화는 문일 뿐이다. 문을 열고 들어온 사람에게 어떤 방을 보여줄지는 도시의 몫이다.</p>\n<p>영월이 해야 할 일은 “여기가 영화에 나온 곳입니다”라고 말하는 데서 끝나지 않는다. 그 문장 다음에 더 깊은 방을 보여줘야 한다. 단종의 역사, 청령포의 지형, 장릉의 늦은 회복, 영월의 강과 산, 문화광산의 실험.</p>\n", "plain_len": 249, "type": "essay", "rawIndex": 1}, {"title": "Page 02 · The Risk of Scene Consumption", "body_md": "장면 소비는 빠르다.\n\n영화 속 장면과 같은 위치에서 사진을 찍고, “다녀왔다”고 말한다. 이것도 여행의 일부다. 문제는 여기서 끝날 때다. 장소가 장면의 복제물로만 남으면, 영화가 지나간 뒤 장소도 함께 식는다.\n\n좋은 영화 관광은 장면에서 시작해 장소로 넘어가야 한다. 장면은 입구고, 장소는 본문이다. 입구만 보고 돌아가는 사람을 본문까지 데려가는 것이 도시 큐레이션의 일이다.", "body_html": "<p>장면 소비는 빠르다.</p>\n<p>영화 속 장면과 같은 위치에서 사진을 찍고, “다녀왔다”고 말한다. 이것도 여행의 일부다. 문제는 여기서 끝날 때다. 장소가 장면의 복제물로만 남으면, 영화가 지나간 뒤 장소도 함께 식는다.</p>\n<p>좋은 영화 관광은 장면에서 시작해 장소로 넘어가야 한다. 장면은 입구고, 장소는 본문이다. 입구만 보고 돌아가는 사람을 본문까지 데려가는 것이 도시 큐레이션의 일이다.</p>\n", "plain_len": 212, "type": "essay", "rawIndex": 2}, {"title": "Page 03 · My Standard", "body_md": "내가 지역 매거진을 만든다면, 촬영지 정보만 모아두지 않을 것이다.\n\n대신 이런 식으로 묶고 싶다.\n\n1. 영화가 어떤 감정을 열었는가\n2. 그 감정은 실제 장소에서 어떻게 다르게 느껴지는가\n3. 그 장소를 보기 전후에 무엇을 함께 봐야 하는가\n4. 그 경험이 지역의 다른 층으로 어떻게 이어지는가\n\n이 네 단계를 지나야 영화 관광이 도시 읽기가 된다.", "body_html": "<p>내가 지역 매거진을 만든다면, 촬영지 정보만 모아두지 않을 것이다.</p>\n<p>대신 이런 식으로 묶고 싶다.</p>\n<ol>\n<li>영화가 어떤 감정을 열었는가</li>\n<li>그 감정은 실제 장소에서 어떻게 다르게 느껴지는가</li>\n<li>그 장소를 보기 전후에 무엇을 함께 봐야 하는가</li>\n<li>그 경험이 지역의 다른 층으로 어떻게 이어지는가</li>\n</ol>\n<p>이 네 단계를 지나야 영화 관광이 도시 읽기가 된다.</p>\n", "plain_len": 194, "type": "list", "rawIndex": 3}, {"title": "Page 04 · Curation Ladder", "body_md": "```text\n영화 관람\n→ 장소 호기심\n→ 촬영지 방문\n→ 역사 해석\n→ 지형 경험\n→ 지역 식사와 체류\n→ 재방문 이유\n```\n\n이 사다리에서 하나만 빠져도 경험은 얇아진다. 특히 `역사 해석`과 `지역 식사와 체류`가 중요하다. 하나는 의미를 만들고, 다른 하나는 지역 경제와 생활에 연결한다.", "body_html": "<pre><code class=\"language-text\">영화 관람\n→ 장소 호기심\n→ 촬영지 방문\n→ 역사 해석\n→ 지형 경험\n→ 지역 식사와 체류\n→ 재방문 이유\n</code></pre>\n<p>이 사다리에서 하나만 빠져도 경험은 얇아진다. 특히 <code>역사 해석</code>과 <code>지역 식사와 체류</code>가 중요하다. 하나는 의미를 만들고, 다른 하나는 지역 경제와 생활에 연결한다.</p>\n", "plain_len": 91, "type": "diagram", "rawIndex": 4}, {"title": "Page 05 · Bridge", "body_md": "이제 실제 동선으로 들어간다.\n\n토요일 원고의 사례는 추천 코스가 아니다. 여행 상품을 파는 글이 아니라, 영월을 어떻게 읽게 할 수 있는지 보여주는 편집안이다.\n\n동선은 도시의 문장 배열이다.", "body_html": "<p>이제 실제 동선으로 들어간다.</p>\n<p>토요일 원고의 사례는 추천 코스가 아니다. 여행 상품을 파는 글이 아니라, 영월을 어떻게 읽게 할 수 있는지 보여주는 편집안이다.</p>\n<p>동선은 도시의 문장 배열이다.</p>\n", "plain_len": 106, "type": "essay", "rawIndex": 5}], "totalPages": 5}, {"num": "04", "key": "Case", "label": "Case", "ko": "사례", "title": "세 개의 토요일 동선", "short": "CA", "pages": [{"title": "Page 01 · Route A: 단종의 하루", "body_md": "```text\n청령포\n→ 장릉\n→ 관풍헌\n→ 서부시장 또는 영월읍 식사\n→ 단종 관련 자료 다시 읽기\n```\n\n이 동선은 영화의 감정에서 시작한다. 핵심은 빠르게 돌지 않는 것이다. 청령포에서 배를 기다리는 시간, 장릉에서 늦게 회복된 이름을 생각하는 시간, 식사하면서 그 감정을 조금 풀어내는 시간이 필요하다.\n\n이 코스는 설명이 과하면 무거워지고, 설명이 부족하면 가벼워진다. 적절한 해설이 중요하다.", "body_html": "<pre><code class=\"language-text\">청령포\n→ 장릉\n→ 관풍헌\n→ 서부시장 또는 영월읍 식사\n→ 단종 관련 자료 다시 읽기\n</code></pre>\n<p>이 동선은 영화의 감정에서 시작한다. 핵심은 빠르게 돌지 않는 것이다. 청령포에서 배를 기다리는 시간, 장릉에서 늦게 회복된 이름을 생각하는 시간, 식사하면서 그 감정을 조금 풀어내는 시간이 필요하다.</p>\n<p>이 코스는 설명이 과하면 무거워지고, 설명이 부족하면 가벼워진다. 적절한 해설이 중요하다.</p>\n", "plain_len": 163, "type": "diagram", "rawIndex": 1}, {"title": "Page 02 · Route B: 강과 하늘의 하루", "body_md": "```text\n한반도지형\n→ 선돌\n→ 어라연 또는 동강 주변\n→ 저녁 식사\n→ 별마로천문대\n```\n\n이 동선은 영월을 역사보다 지형으로 읽는다. 오전에는 내려다보고, 오후에는 멈춰 서고, 저녁에는 흐름을 느끼고, 밤에는 올려다본다.\n\n방향이 계속 바뀐다. 내려다보기, 멈추기, 따라가기, 올려다보기. 이런 변화가 하루의 리듬을 만든다.", "body_html": "<pre><code class=\"language-text\">한반도지형\n→ 선돌\n→ 어라연 또는 동강 주변\n→ 저녁 식사\n→ 별마로천문대\n</code></pre>\n<p>이 동선은 영월을 역사보다 지형으로 읽는다. 오전에는 내려다보고, 오후에는 멈춰 서고, 저녁에는 흐름을 느끼고, 밤에는 올려다본다.</p>\n<p>방향이 계속 바뀐다. 내려다보기, 멈추기, 따라가기, 올려다보기. 이런 변화가 하루의 리듬을 만든다.</p>\n", "plain_len": 130, "type": "diagram", "rawIndex": 2}, {"title": "Page 03 · Route C: 문화광산의 하루", "body_md": "```text\n사진·문화 공간\n→ 시장과 골목\n→ 광산 기억 관련 콘텐츠\n→ 예술 공간\n→ 지역 기록 읽기\n```\n\n이 동선은 영화 이후의 영월을 현재의 문화로 넓힌다. 단종과 자연만으로 영월을 기억하는 사람에게, 폐광 이후의 문화도시 실험을 보여준다.\n\n중요한 것은 “요즘 감성”으로 포장하지 않는 것이다. 문화광산의 핵심은 새로움이 아니라 발굴이다. 이미 있던 삶을 다시 꺼내는 일이다.", "body_html": "<pre><code class=\"language-text\">사진·문화 공간\n→ 시장과 골목\n→ 광산 기억 관련 콘텐츠\n→ 예술 공간\n→ 지역 기록 읽기\n</code></pre>\n<p>이 동선은 영화 이후의 영월을 현재의 문화로 넓힌다. 단종과 자연만으로 영월을 기억하는 사람에게, 폐광 이후의 문화도시 실험을 보여준다.</p>\n<p>중요한 것은 “요즘 감성”으로 포장하지 않는 것이다. 문화광산의 핵심은 새로움이 아니라 발굴이다. 이미 있던 삶을 다시 꺼내는 일이다.</p>\n", "plain_len": 152, "type": "diagram", "rawIndex": 3}, {"title": "Page 04 · Route D: 느린 1박 2일", "body_md": "```text\n1일차 낮   | 청령포, 장릉\n1일차 저녁 | 시장, 지역 식사\n1일차 밤   | 별마로천문대, 숙박\n2일차 오전 | 한반도지형 또는 선돌\n2일차 오후 | 문화 공간, 사진, 기록\n```\n\n이 동선이 가장 강하다. 하루 만에 영월을 설명하려 하지 않기 때문이다. 영월은 하루 코스로도 가능하지만, 하루로 끝나면 많은 층이 빠진다.\n\n1박 2일은 도시를 지면 하나가 아니라 작은 책자로 만든다.", "body_html": "<pre><code class=\"language-text\">1일차 낮   | 청령포, 장릉\n1일차 저녁 | 시장, 지역 식사\n1일차 밤   | 별마로천문대, 숙박\n2일차 오전 | 한반도지형 또는 선돌\n2일차 오후 | 문화 공간, 사진, 기록\n</code></pre>\n<p>이 동선이 가장 강하다. 하루 만에 영월을 설명하려 하지 않기 때문이다. 영월은 하루 코스로도 가능하지만, 하루로 끝나면 많은 층이 빠진다.</p>\n<p>1박 2일은 도시를 지면 하나가 아니라 작은 책자로 만든다.</p>\n", "plain_len": 112, "type": "diagram", "rawIndex": 4}, {"title": "Page 05 · Case Insight", "body_md": "영월의 동선은 이렇게 정리할 수 있다.\n\n| 동선 | 시작 감정 | 끝에 남는 것 |\n|---|---|---|\n| 단종의 하루 | 영화와 애도 | 역사적 기억 |\n| 강과 하늘의 하루 | 풍경과 호기심 | 지형의 감각 |\n| 문화광산의 하루 | 현재의 궁금증 | 기록과 주민의 이야기 |\n| 느린 1박 2일 | 전체 경험 | 재방문 이유 |\n\n도시는 동선으로 편집될 때 오래 남는다.", "body_html": "<p>영월의 동선은 이렇게 정리할 수 있다.</p>\n<table>\n<thead>\n<tr>\n  <th>동선</th>\n  <th>시작 감정</th>\n  <th>끝에 남는 것</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>단종의 하루</td>\n  <td>영화와 애도</td>\n  <td>역사적 기억</td>\n</tr>\n<tr>\n  <td>강과 하늘의 하루</td>\n  <td>풍경과 호기심</td>\n  <td>지형의 감각</td>\n</tr>\n<tr>\n  <td>문화광산의 하루</td>\n  <td>현재의 궁금증</td>\n  <td>기록과 주민의 이야기</td>\n</tr>\n<tr>\n  <td>느린 1박 2일</td>\n  <td>전체 경험</td>\n  <td>재방문 이유</td>\n</tr>\n</tbody>\n</table>\n<p>도시는 동선으로 편집될 때 오래 남는다.</p>\n", "plain_len": 158, "type": "diagram", "rawIndex": 5}], "totalPages": 5}, {"num": "05", "key": "Archive", "label": "Archive", "ko": "기록", "title": "유행 이후에 남길 것", "short": "AR", "pages": [{"title": "Page 01 · Three Sentences", "body_md": "오늘의 핵심은 세 문장이다.\n\n1. 영화는 영월을 다시 보게 하는 문을 열었지만, 그 문 너머의 방을 만드는 것은 도시의 일이다.\n2. 핫플보다 중요한 것은 장소와 장소를 이어주는 동선이다.\n3. 반짝 유행을 오래 남기려면 촬영지에서 역사, 지형, 문화, 체류로 경험을 넓혀야 한다.", "body_html": "<p>오늘의 핵심은 세 문장이다.</p>\n<ol>\n<li>영화는 영월을 다시 보게 하는 문을 열었지만, 그 문 너머의 방을 만드는 것은 도시의 일이다.</li>\n<li>핫플보다 중요한 것은 장소와 장소를 이어주는 동선이다.</li>\n<li>반짝 유행을 오래 남기려면 촬영지에서 역사, 지형, 문화, 체류로 경험을 넓혀야 한다.</li>\n</ol>\n", "plain_len": 157, "type": "list", "rawIndex": 1}, {"title": "Page 02 · Questions", "body_md": "오늘 읽고 남길 질문:\n\n- 나는 여행에서 장소 하나만 기억하는가, 아니면 동선 전체를 기억하는가?\n- 영화 관광은 언제 장소를 두껍게 만들고, 언제 장소를 얇게 만드는가?\n- 영월은 청령포와 장릉의 관심을 다른 공간으로 어떻게 넓힐 수 있을까?\n- 지역은 사람을 많이 부르는 것과 잘 머물게 하는 것 중 무엇을 먼저 고민해야 할까?", "body_html": "<p>오늘 읽고 남길 질문:</p>\n<ul>\n<li>나는 여행에서 장소 하나만 기억하는가, 아니면 동선 전체를 기억하는가?</li>\n<li>영화 관광은 언제 장소를 두껍게 만들고, 언제 장소를 얇게 만드는가?</li>\n<li>영월은 청령포와 장릉의 관심을 다른 공간으로 어떻게 넓힐 수 있을까?</li>\n<li>지역은 사람을 많이 부르는 것과 잘 머물게 하는 것 중 무엇을 먼저 고민해야 할까?</li>\n</ul>\n", "plain_len": 177, "type": "archive", "rawIndex": 2}, {"title": "Page 03 · Curation Rules", "body_md": "영월형 큐레이션 원칙:\n\n- 촬영지는 입구로 쓰되, 결론으로 쓰지 않는다.\n- 청령포와 장릉 이후의 동선을 반드시 제안한다.\n- 역사·지형·문화·식사를 하나의 흐름으로 묶는다.\n- 1박 2일 동선을 기본 모델로 상상한다.\n- 사람이 몰릴수록 장소의 품위를 지키는 안내가 필요하다.", "body_html": "<p>영월형 큐레이션 원칙:</p>\n<ul>\n<li>촬영지는 입구로 쓰되, 결론으로 쓰지 않는다.</li>\n<li>청령포와 장릉 이후의 동선을 반드시 제안한다.</li>\n<li>역사·지형·문화·식사를 하나의 흐름으로 묶는다.</li>\n<li>1박 2일 동선을 기본 모델로 상상한다.</li>\n<li>사람이 몰릴수록 장소의 품위를 지키는 안내가 필요하다.</li>\n</ul>\n", "plain_len": 145, "type": "list", "rawIndex": 3}, {"title": "Page 04 · Next", "body_md": "내일은 마지막 날이다.\n\n월요일에는 인구감소지역이라는 말 앞에서 멈췄고, 화요일에는 단종의 기억을 읽었고, 수요일에는 강과 산을 보았고, 목요일에는 문화광산을 보았고, 금요일에는 생활인구를 읽었고, 토요일에는 동선을 생각했다.\n\n일요일에는 이 모든 것을 접어서 하나의 기준으로 남겨야 한다.\n\n영월은 작지만 두꺼운 도시인가.\n\n---", "body_html": "<p>내일은 마지막 날이다.</p>\n<p>월요일에는 인구감소지역이라는 말 앞에서 멈췄고, 화요일에는 단종의 기억을 읽었고, 수요일에는 강과 산을 보았고, 목요일에는 문화광산을 보았고, 금요일에는 생활인구를 읽었고, 토요일에는 동선을 생각했다.</p>\n<p>일요일에는 이 모든 것을 접어서 하나의 기준으로 남겨야 한다.</p>\n<p>영월은 작지만 두꺼운 도시인가.</p>\n<hr />\n", "plain_len": 178, "type": "essay", "rawIndex": 4}], "totalPages": 4}]}, {"date": "2026-05-10", "weekday": "일", "weekdayFull": "일요일", "no": "007", "titleLine": "2026-05-10 일요일 · No.007", "theme": "작지만 두꺼운 도시라는 기준", "note_html": "<aside class=\"note-card\"><strong>일요일의 역할</strong><p>일요일은 Volume 001의 결론이다.<br />\n영월을 성공담이나 위기담으로 닫지 않고, 다음 도시를 읽기 위한 기준으로 정리한다.<br />\n핵심은 “작다”와 “사라진다”를 같은 말로 쓰지 않는 것이다.</p>\n</aside>\n\n", "sections": [{"num": "01", "key": "Intro", "label": "Intro", "ko": "입구", "title": "일주일을 접으며", "short": "IN", "pages": [{"title": "Page 01 · Cover", "body_md": "일요일에는 글을 조금 천천히 닫아야 한다.\n\n월요일의 첫 질문은 단순했다. 소멸위기도시라는 말은 영월의 무엇을 보지 못하게 만드는가. 일주일 동안 그 질문은 여러 갈래로 벌어졌다. 단종의 기억, 강과 산의 지형, 문화광산의 실험, 생활인구, 영화 이후의 동선.\n\n이제 다시 처음으로 돌아온다.\n\n영월은 인구감소지역이다. 이 사실은 사라지지 않는다. 하지만 영월은 인구감소지역이라는 말만으로 설명되지 않는다. 이 문장도 이제 사라지면 안 된다.", "body_html": "<p>일요일에는 글을 조금 천천히 닫아야 한다.</p>\n<p>월요일의 첫 질문은 단순했다. 소멸위기도시라는 말은 영월의 무엇을 보지 못하게 만드는가. 일주일 동안 그 질문은 여러 갈래로 벌어졌다. 단종의 기억, 강과 산의 지형, 문화광산의 실험, 생활인구, 영화 이후의 동선.</p>\n<p>이제 다시 처음으로 돌아온다.</p>\n<p>영월은 인구감소지역이다. 이 사실은 사라지지 않는다. 하지만 영월은 인구감소지역이라는 말만으로 설명되지 않는다. 이 문장도 이제 사라지면 안 된다.</p>\n", "plain_len": 244, "type": "cover", "rawIndex": 1}, {"title": "Page 02 · Scene", "body_md": "나는 이 호를 쓰면서 자꾸 “작다”는 말을 다시 생각했다.\n\n작은 도시는 흔히 부족한 도시처럼 불린다. 사람이 적고, 시장이 작고, 병원이 적고, 학교가 줄어드는 곳. 그런데 작다는 말이 언제나 얇다는 뜻은 아니다. 어떤 도시는 작아서 더 많은 시간이 겹쳐 보인다. 한 장소 안에 역사와 지형과 생활이 가까이 붙어 있기 때문이다.\n\n영월이 내게 그렇게 보였다.\n\n작지만 얇지 않은 도시. 작지만 쉽게 끝나지 않는 도시.", "body_html": "<p>나는 이 호를 쓰면서 자꾸 “작다”는 말을 다시 생각했다.</p>\n<p>작은 도시는 흔히 부족한 도시처럼 불린다. 사람이 적고, 시장이 작고, 병원이 적고, 학교가 줄어드는 곳. 그런데 작다는 말이 언제나 얇다는 뜻은 아니다. 어떤 도시는 작아서 더 많은 시간이 겹쳐 보인다. 한 장소 안에 역사와 지형과 생활이 가까이 붙어 있기 때문이다.</p>\n<p>영월이 내게 그렇게 보였다.</p>\n<p>작지만 얇지 않은 도시. 작지만 쉽게 끝나지 않는 도시.</p>\n", "plain_len": 231, "type": "essay", "rawIndex": 2}, {"title": "Page 03 · Question", "body_md": "일요일의 질문은 이것이다.\n\n- 우리는 작은 도시를 어떤 기준으로 다시 읽어야 하는가?\n- 인구 감소와 문화적 두께를 동시에 볼 수 있는가?\n- 방문객 증가를 지역 회복으로 과장하지 않으면서도, 그 가능성을 제대로 평가할 수 있는가?\n- 다음 Volume에서 다른 지방도시를 읽을 때 무엇을 먼저 봐야 하는가?\n\n이 질문은 영월을 넘어선다. 영월은 이번 호의 대표 도시지만, 이 매거진이 정말 하고 싶은 일은 더 넓다. 지방도시를 실패와 성공의 단순한 표로 보지 않고, 그 도시가 가진 고유한 두께를 읽는 일.", "body_html": "<p>일요일의 질문은 이것이다.</p>\n<ul>\n<li>우리는 작은 도시를 어떤 기준으로 다시 읽어야 하는가?</li>\n<li>인구 감소와 문화적 두께를 동시에 볼 수 있는가?</li>\n<li>방문객 증가를 지역 회복으로 과장하지 않으면서도, 그 가능성을 제대로 평가할 수 있는가?</li>\n<li>다음 Volume에서 다른 지방도시를 읽을 때 무엇을 먼저 봐야 하는가?</li>\n</ul>\n<p>이 질문은 영월을 넘어선다. 영월은 이번 호의 대표 도시지만, 이 매거진이 정말 하고 싶은 일은 더 넓다. 지방도시를 실패와 성공의 단순한 표로 보지 않고, 그 도시가 가진 고유한 두께를 읽는 일.</p>\n", "plain_len": 275, "type": "list", "rawIndex": 3}, {"title": "Page 04 · Bridge", "body_md": "이제 쟁점으로 들어간다.\n\n작지만 두꺼운 도시는 어떤 조건을 가져야 하는가. 그리고 그 조건은 영월에서 어떻게 보이는가.\n\n결론은 완성된 답이 아니라 다음 호를 위한 기준이어야 한다.", "body_html": "<p>이제 쟁점으로 들어간다.</p>\n<p>작지만 두꺼운 도시는 어떤 조건을 가져야 하는가. 그리고 그 조건은 영월에서 어떻게 보이는가.</p>\n<p>결론은 완성된 답이 아니라 다음 호를 위한 기준이어야 한다.</p>\n", "plain_len": 100, "type": "essay", "rawIndex": 4}], "totalPages": 4}, {"num": "02", "key": "Issue", "label": "Issue", "ko": "쟁점", "title": "소멸위기와 재발견 사이의 균형", "short": "IS", "pages": [{"title": "Page 01 · Cover", "body_md": "영월을 다루는 가장 쉬운 방법은 두 가지다.\n\n하나는 위기담이다. 인구가 줄고, 지역이 어렵고, 지방이 사라지고 있다는 이야기. 다른 하나는 성공담이다. 영화가 터졌고, 관광객이 늘었고, 카드 소비가 늘었다는 이야기.\n\n둘 다 일부는 맞다. 하지만 둘 다 혼자서는 부족하다.\n\n위기담은 도시의 가능성을 가리고, 성공담은 도시의 어려움을 가린다.\n\n이번 호는 그 사이에 서려고 했다.", "body_html": "<p>영월을 다루는 가장 쉬운 방법은 두 가지다.</p>\n<p>하나는 위기담이다. 인구가 줄고, 지역이 어렵고, 지방이 사라지고 있다는 이야기. 다른 하나는 성공담이다. 영화가 터졌고, 관광객이 늘었고, 카드 소비가 늘었다는 이야기.</p>\n<p>둘 다 일부는 맞다. 하지만 둘 다 혼자서는 부족하다.</p>\n<p>위기담은 도시의 가능성을 가리고, 성공담은 도시의 어려움을 가린다.</p>\n<p>이번 호는 그 사이에 서려고 했다.</p>\n", "plain_len": 209, "type": "cover", "rawIndex": 1}, {"title": "Page 02 · Balance Sheet", "body_md": "| 축 | 위기만 볼 때 | 가능성만 볼 때 | 함께 볼 때 |\n|---|---|---|---|\n| 인구 | 줄어드는 숫자 | 무시하기 쉬움 | 장기 체력의 문제 |\n| 관광 | 일시적 소비 | 도시 회복처럼 과장 | 방문-체류-재방문 사다리 |\n| 역사 | 오래된 유적 | 감정 상품화 | 기억의 두께 |\n| 자연 | 배경 풍경 | 포토존 | 지형의 문법 |\n| 문화 | 행정 사업 | 브랜드 홍보 | 주민 기록과 생활 |\n\n이 표는 단순하지만 필요하다. 지방도시를 읽을 때 우리는 자주 한쪽으로 쏠린다. 쏠림을 막는 것이 편집자의 일이다.", "body_html": "<table>\n<thead>\n<tr>\n  <th>축</th>\n  <th>위기만 볼 때</th>\n  <th>가능성만 볼 때</th>\n  <th>함께 볼 때</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>인구</td>\n  <td>줄어드는 숫자</td>\n  <td>무시하기 쉬움</td>\n  <td>장기 체력의 문제</td>\n</tr>\n<tr>\n  <td>관광</td>\n  <td>일시적 소비</td>\n  <td>도시 회복처럼 과장</td>\n  <td>방문-체류-재방문 사다리</td>\n</tr>\n<tr>\n  <td>역사</td>\n  <td>오래된 유적</td>\n  <td>감정 상품화</td>\n  <td>기억의 두께</td>\n</tr>\n<tr>\n  <td>자연</td>\n  <td>배경 풍경</td>\n  <td>포토존</td>\n  <td>지형의 문법</td>\n</tr>\n<tr>\n  <td>문화</td>\n  <td>행정 사업</td>\n  <td>브랜드 홍보</td>\n  <td>주민 기록과 생활</td>\n</tr>\n</tbody>\n</table>\n<p>이 표는 단순하지만 필요하다. 지방도시를 읽을 때 우리는 자주 한쪽으로 쏠린다. 쏠림을 막는 것이 편집자의 일이다.</p>\n", "plain_len": 224, "type": "diagram", "rawIndex": 2}, {"title": "Page 03 · Population Is Still Real", "body_md": "인구 감소는 여전히 현실이다.\n\n이 문장을 빼면 글은 무책임해진다. 방문객이 늘었다고 해서 지역의 의료, 교육, 돌봄, 청년 일자리 문제가 사라지는 것은 아니다. 주민등록 인구는 여전히 도시의 기초 체력을 보여준다.\n\n그러므로 “소멸위기도시라는 말이 부족하다”는 말은 “소멸위기가 없다”는 말이 아니다. 오히려 더 정확히 보자는 말이다. 줄어드는 숫자도 보고, 늘어나는 발걸음도 보고, 그 사이의 구조를 보자는 말이다.", "body_html": "<p>인구 감소는 여전히 현실이다.</p>\n<p>이 문장을 빼면 글은 무책임해진다. 방문객이 늘었다고 해서 지역의 의료, 교육, 돌봄, 청년 일자리 문제가 사라지는 것은 아니다. 주민등록 인구는 여전히 도시의 기초 체력을 보여준다.</p>\n<p>그러므로 “소멸위기도시라는 말이 부족하다”는 말은 “소멸위기가 없다”는 말이 아니다. 오히려 더 정확히 보자는 말이다. 줄어드는 숫자도 보고, 늘어나는 발걸음도 보고, 그 사이의 구조를 보자는 말이다.</p>\n", "plain_len": 232, "type": "essay", "rawIndex": 3}, {"title": "Page 04 · Rediscovery Is Also Real", "body_md": "재발견도 현실이다.\n\n이 또한 빼면 글은 냉소가 된다. 영화 이후 영월의 청령포와 장릉에 사람들이 몰렸고, 외지인 방문과 카드 소비가 늘었다. 영월은 실제로 다시 불렸다. 이 신호를 단순한 유행으로만 깎아내릴 필요는 없다.\n\n다만 신호는 출발점이다. 신호를 구조로 바꿀 때 지역의 힘이 된다. 영월이 보여준 것은 “콘텐츠가 지역 방문을 만들 수 있다”는 가능성이다. 앞으로 중요한 것은 그 방문이 어떤 삶의 연결로 바뀌는가다.", "body_html": "<p>재발견도 현실이다.</p>\n<p>이 또한 빼면 글은 냉소가 된다. 영화 이후 영월의 청령포와 장릉에 사람들이 몰렸고, 외지인 방문과 카드 소비가 늘었다. 영월은 실제로 다시 불렸다. 이 신호를 단순한 유행으로만 깎아내릴 필요는 없다.</p>\n<p>다만 신호는 출발점이다. 신호를 구조로 바꿀 때 지역의 힘이 된다. 영월이 보여준 것은 “콘텐츠가 지역 방문을 만들 수 있다”는 가능성이다. 앞으로 중요한 것은 그 방문이 어떤 삶의 연결로 바뀌는가다.</p>\n", "plain_len": 236, "type": "essay", "rawIndex": 4}, {"title": "Page 05 · Issue Summary", "body_md": "균형 있게 읽는다는 것은 중립적인 척하는 일이 아니다.\n\n정확히 보는 일이다. 위기는 위기로 보고, 가능성은 가능성으로 보는 일이다. 어느 한쪽으로 편하게 도망가지 않는 일이다.\n\n영월은 그 균형 훈련에 좋은 도시다.", "body_html": "<p>균형 있게 읽는다는 것은 중립적인 척하는 일이 아니다.</p>\n<p>정확히 보는 일이다. 위기는 위기로 보고, 가능성은 가능성으로 보는 일이다. 어느 한쪽으로 편하게 도망가지 않는 일이다.</p>\n<p>영월은 그 균형 훈련에 좋은 도시다.</p>\n", "plain_len": 119, "type": "archive", "rawIndex": 5}, {"title": "Page 06 · Bridge", "body_md": "이제 해석으로 넘어간다.\n\n“작지만 두꺼운 도시”라는 기준을 정리해보자. 이 기준은 영월을 위한 말이면서, 앞으로 다른 지방도시를 읽을 때도 쓸 수 있는 틀이 되어야 한다.", "body_html": "<p>이제 해석으로 넘어간다.</p>\n<p>“작지만 두꺼운 도시”라는 기준을 정리해보자. 이 기준은 영월을 위한 말이면서, 앞으로 다른 지방도시를 읽을 때도 쓸 수 있는 틀이 되어야 한다.</p>\n", "plain_len": 95, "type": "essay", "rawIndex": 6}], "totalPages": 6}, {"num": "03", "key": "Insight", "label": "Insight", "ko": "해석", "title": "작지만 두꺼운 도시의 다섯 조건", "short": "SG", "pages": [{"title": "Page 01 · Condition 1: 오래된 기억", "body_md": "첫 번째 조건은 오래된 기억이다.\n\n영월에는 단종의 기억이 있다. 이 기억은 단순한 역사 지식이 아니라 장소와 연결된다. 청령포와 장릉, 관풍헌과 단종문화제가 기억을 물리적인 장면으로 만든다.\n\n작은 도시가 두꺼워지려면 기억이 있어야 한다. 다만 기억이 있다는 것만으로 충분하지 않다. 그 기억을 오늘의 사람에게 어떤 방식으로 전달하는지가 더 중요하다.", "body_html": "<p>첫 번째 조건은 오래된 기억이다.</p>\n<p>영월에는 단종의 기억이 있다. 이 기억은 단순한 역사 지식이 아니라 장소와 연결된다. 청령포와 장릉, 관풍헌과 단종문화제가 기억을 물리적인 장면으로 만든다.</p>\n<p>작은 도시가 두꺼워지려면 기억이 있어야 한다. 다만 기억이 있다는 것만으로 충분하지 않다. 그 기억을 오늘의 사람에게 어떤 방식으로 전달하는지가 더 중요하다.</p>\n", "plain_len": 195, "type": "essay", "rawIndex": 1}, {"title": "Page 02 · Condition 2: 고유한 지형", "body_md": "두 번째 조건은 고유한 지형이다.\n\n영월의 강과 산은 도시의 문법을 만든다. 한반도지형, 선돌, 어라연, 별마로천문대는 각각 다른 시야를 준다. 지형은 도시를 다른 곳과 구분하게 한다.\n\n모든 작은 도시가 유명한 역사 인물을 갖고 있는 것은 아니다. 하지만 많은 도시는 자기만의 지형을 갖고 있다. 문제는 그것을 그냥 풍경으로만 볼 것인가, 도시의 성격으로 읽을 것인가다.", "body_html": "<p>두 번째 조건은 고유한 지형이다.</p>\n<p>영월의 강과 산은 도시의 문법을 만든다. 한반도지형, 선돌, 어라연, 별마로천문대는 각각 다른 시야를 준다. 지형은 도시를 다른 곳과 구분하게 한다.</p>\n<p>모든 작은 도시가 유명한 역사 인물을 갖고 있는 것은 아니다. 하지만 많은 도시는 자기만의 지형을 갖고 있다. 문제는 그것을 그냥 풍경으로만 볼 것인가, 도시의 성격으로 읽을 것인가다.</p>\n", "plain_len": 206, "type": "essay", "rawIndex": 2}, {"title": "Page 03 · Condition 3: 현재의 문화 실험", "body_md": "세 번째 조건은 현재의 문화 실험이다.\n\n오래된 기억만 있으면 도시는 과거에 갇힐 수 있다. 영월의 문화도시와 문화광산 실험은 과거의 기억을 현재의 작업으로 옮기려는 시도다. 주민 기록, 사진, 예술 공간, 축제, 생활 공간이 연결될 때 도시는 지금도 움직인다는 느낌을 준다.\n\n작지만 두꺼운 도시는 과거가 깊을 뿐 아니라 현재도 작동해야 한다.", "body_html": "<p>세 번째 조건은 현재의 문화 실험이다.</p>\n<p>오래된 기억만 있으면 도시는 과거에 갇힐 수 있다. 영월의 문화도시와 문화광산 실험은 과거의 기억을 현재의 작업으로 옮기려는 시도다. 주민 기록, 사진, 예술 공간, 축제, 생활 공간이 연결될 때 도시는 지금도 움직인다는 느낌을 준다.</p>\n<p>작지만 두꺼운 도시는 과거가 깊을 뿐 아니라 현재도 작동해야 한다.</p>\n", "plain_len": 191, "type": "essay", "rawIndex": 3}, {"title": "Page 04 · Condition 4: 체류를 만드는 동선", "body_md": "네 번째 조건은 체류를 만드는 동선이다.\n\n장소가 많아도 서로 연결되지 않으면 도시는 흩어진다. 청령포와 장릉에서 한반도지형으로, 시장에서 별마로천문대로, 문화 공간에서 숙소로 이어지는 동선이 있어야 한다.\n\n동선은 도시의 편집이다. 어떤 순서로 보게 할 것인가. 어디서 쉬게 할 것인가. 무엇을 다음 질문으로 남길 것인가. 이 편집이 있을 때 방문은 체류로 바뀐다.", "body_html": "<p>네 번째 조건은 체류를 만드는 동선이다.</p>\n<p>장소가 많아도 서로 연결되지 않으면 도시는 흩어진다. 청령포와 장릉에서 한반도지형으로, 시장에서 별마로천문대로, 문화 공간에서 숙소로 이어지는 동선이 있어야 한다.</p>\n<p>동선은 도시의 편집이다. 어떤 순서로 보게 할 것인가. 어디서 쉬게 할 것인가. 무엇을 다음 질문으로 남길 것인가. 이 편집이 있을 때 방문은 체류로 바뀐다.</p>\n", "plain_len": 203, "type": "essay", "rawIndex": 4}, {"title": "Page 05 · Condition 5: 다음 질문", "body_md": "다섯 번째 조건은 다음 질문이다.\n\n좋은 도시는 한 번의 방문으로 다 끝나지 않는다. 다시 오고 싶게 하는 질문이 남는다. 영월에서는 이런 질문들이 가능하다.\n\n- 단종의 기억을 다른 계절에 보면 어떻게 달라질까?\n- 동강의 여름과 별마로의 겨울은 어떻게 다를까?\n- 문화광산의 기록은 앞으로 무엇을 더 보여줄까?\n- 영화 이후의 영월은 몇 년 뒤 어떤 모습일까?\n\n질문이 남는 도시는 작아도 쉽게 끝나지 않는다.", "body_html": "<p>다섯 번째 조건은 다음 질문이다.</p>\n<p>좋은 도시는 한 번의 방문으로 다 끝나지 않는다. 다시 오고 싶게 하는 질문이 남는다. 영월에서는 이런 질문들이 가능하다.</p>\n<ul>\n<li>단종의 기억을 다른 계절에 보면 어떻게 달라질까?</li>\n<li>동강의 여름과 별마로의 겨울은 어떻게 다를까?</li>\n<li>문화광산의 기록은 앞으로 무엇을 더 보여줄까?</li>\n<li>영화 이후의 영월은 몇 년 뒤 어떤 모습일까?</li>\n</ul>\n<p>질문이 남는 도시는 작아도 쉽게 끝나지 않는다.</p>\n", "plain_len": 220, "type": "list", "rawIndex": 5}, {"title": "Page 06 · Framework", "body_md": "```text\n작지만 두꺼운 도시 =\n오래된 기억\n+ 고유한 지형\n+ 현재의 문화 실험\n+ 체류를 만드는 동선\n+ 다시 오게 하는 질문\n```\n\n영월은 이 다섯 조건을 모두 갖고 있다. 다만 갖고 있다는 것과 잘 작동한다는 것은 다르다. 앞으로의 과제는 이 조건들을 더 안정적으로 연결하는 일이다.", "body_html": "<pre><code class=\"language-text\">작지만 두꺼운 도시 =\n오래된 기억\n+ 고유한 지형\n+ 현재의 문화 실험\n+ 체류를 만드는 동선\n+ 다시 오게 하는 질문\n</code></pre>\n<p>영월은 이 다섯 조건을 모두 갖고 있다. 다만 갖고 있다는 것과 잘 작동한다는 것은 다르다. 앞으로의 과제는 이 조건들을 더 안정적으로 연결하는 일이다.</p>\n", "plain_len": 85, "type": "archive", "rawIndex": 6}], "totalPages": 6}, {"num": "04", "key": "Case", "label": "Case", "ko": "사례", "title": "영월은 다음 지방도시를 읽는 연습장이다", "short": "CA", "pages": [{"title": "Page 01 · Why Yeongwol Works", "body_md": "영월은 이번 호의 대표 도시로 적절했다.\n\n인구감소지역이라는 행정적 조건이 있고, 영화 이후 방문객 증가라는 최근 사건이 있고, 단종이라는 오래된 기억이 있고, 강과 산의 지형이 있고, 문화도시라는 현재의 실험이 있다.\n\n이 요소들이 한꺼번에 있는 도시는 드물다. 그래서 영월은 단순 사례가 아니라 지방도시를 다시 읽기 위한 연습장이 된다.", "body_html": "<p>영월은 이번 호의 대표 도시로 적절했다.</p>\n<p>인구감소지역이라는 행정적 조건이 있고, 영화 이후 방문객 증가라는 최근 사건이 있고, 단종이라는 오래된 기억이 있고, 강과 산의 지형이 있고, 문화도시라는 현재의 실험이 있다.</p>\n<p>이 요소들이 한꺼번에 있는 도시는 드물다. 그래서 영월은 단순 사례가 아니라 지방도시를 다시 읽기 위한 연습장이 된다.</p>\n", "plain_len": 188, "type": "essay", "rawIndex": 1}, {"title": "Page 02 · What Not to Copy", "body_md": "하지만 다른 도시가 영월을 그대로 따라 할 수는 없다.\n\n모든 도시에 〈왕과 사는 남자〉 같은 영화 흥행이 생기지는 않는다. 모든 도시에 단종 같은 역사적 인물이 있는 것도 아니다. 모든 도시에 한반도지형 같은 상징적 경관이 있는 것도 아니다.\n\n따라서 영월에서 복사할 것은 결과가 아니라 방법이다.\n\n- 자기 도시의 오래된 기억을 찾기\n- 지형과 생활을 함께 읽기\n- 외부 관심을 내부 동선으로 바꾸기\n- 주민의 기록을 남기기\n- 재방문 질문을 만들기", "body_html": "<p>하지만 다른 도시가 영월을 그대로 따라 할 수는 없다.</p>\n<p>모든 도시에 〈왕과 사는 남자〉 같은 영화 흥행이 생기지는 않는다. 모든 도시에 단종 같은 역사적 인물이 있는 것도 아니다. 모든 도시에 한반도지형 같은 상징적 경관이 있는 것도 아니다.</p>\n<p>따라서 영월에서 복사할 것은 결과가 아니라 방법이다.</p>\n<ul>\n<li>자기 도시의 오래된 기억을 찾기</li>\n<li>지형과 생활을 함께 읽기</li>\n<li>외부 관심을 내부 동선으로 바꾸기</li>\n<li>주민의 기록을 남기기</li>\n<li>재방문 질문을 만들기</li>\n</ul>\n", "plain_len": 240, "type": "list", "rawIndex": 2}, {"title": "Page 03 · Editorial Method", "body_md": "앞으로 Achmage Society Magazine이 다른 도시를 다룬다면, 나는 이 순서로 읽고 싶다.\n\n1. 그 도시는 어떤 말로 너무 쉽게 불리고 있는가?\n2. 그 말은 무엇을 보이게 하고, 무엇을 가리는가?\n3. 그 도시의 오래된 기억은 무엇인가?\n4. 그 도시의 지형은 어떤 행동을 만들고 있는가?\n5. 지금 그 도시 안에서 진행 중인 실험은 무엇인가?\n6. 외부인은 그 도시와 어떤 관계를 맺을 수 있는가?\n7. 다시 오게 하는 질문은 무엇인가?\n\n이 질문들이 다음 Volume의 편집 뼈대가 될 수 있다.", "body_html": "<p>앞으로 Achmage Society Magazine이 다른 도시를 다룬다면, 나는 이 순서로 읽고 싶다.</p>\n<ol>\n<li>그 도시는 어떤 말로 너무 쉽게 불리고 있는가?</li>\n<li>그 말은 무엇을 보이게 하고, 무엇을 가리는가?</li>\n<li>그 도시의 오래된 기억은 무엇인가?</li>\n<li>그 도시의 지형은 어떤 행동을 만들고 있는가?</li>\n<li>지금 그 도시 안에서 진행 중인 실험은 무엇인가?</li>\n<li>외부인은 그 도시와 어떤 관계를 맺을 수 있는가?</li>\n<li>다시 오게 하는 질문은 무엇인가?</li>\n</ol>\n<p>이 질문들이 다음 Volume의 편집 뼈대가 될 수 있다.</p>\n", "plain_len": 287, "type": "list", "rawIndex": 3}, {"title": "Page 04 · Volume 001 as Prototype", "body_md": "Volume 001은 완성된 답이 아니라 프로토타입이다.\n\n모바일 매거진 형식도 그렇고, 영월을 읽는 방식도 그렇다. 7일 × 5탭 × 여러 페이지 구조는 한 도시를 빠르게 요약하지 않기 위한 장치다. 독자는 좌우로 시선을 바꾸고, 상하로 깊이를 더한다.\n\n이 형식은 지방도시 원고와 잘 맞는다. 도시 역시 좌우와 상하가 필요하기 때문이다. 좌우로는 역사, 지형, 문화, 경제, 생활을 오가야 하고, 상하로는 각각을 깊게 내려가야 한다.", "body_html": "<p>Volume 001은 완성된 답이 아니라 프로토타입이다.</p>\n<p>모바일 매거진 형식도 그렇고, 영월을 읽는 방식도 그렇다. 7일 × 5탭 × 여러 페이지 구조는 한 도시를 빠르게 요약하지 않기 위한 장치다. 독자는 좌우로 시선을 바꾸고, 상하로 깊이를 더한다.</p>\n<p>이 형식은 지방도시 원고와 잘 맞는다. 도시 역시 좌우와 상하가 필요하기 때문이다. 좌우로는 역사, 지형, 문화, 경제, 생활을 오가야 하고, 상하로는 각각을 깊게 내려가야 한다.</p>\n", "plain_len": 242, "type": "essay", "rawIndex": 4}, {"title": "Page 05 · Case Insight", "body_md": "영월은 다음 질문을 남긴다.\n\n작은 도시를 작게만 보지 않는 방법은 무엇인가.\n\n이 질문은 앞으로의 매거진 전체를 움직일 수 있다. 어느 지역이든 “소멸”, “낙후”, “관광지”, “핫플”, “시골” 같은 쉬운 이름으로 불릴 위험이 있다. 이 매거진은 그 쉬운 이름을 잠깐 멈추고, 도시가 가진 두께를 다시 읽는 일을 할 수 있다.", "body_html": "<p>영월은 다음 질문을 남긴다.</p>\n<p>작은 도시를 작게만 보지 않는 방법은 무엇인가.</p>\n<p>이 질문은 앞으로의 매거진 전체를 움직일 수 있다. 어느 지역이든 “소멸”, “낙후”, “관광지”, “핫플”, “시골” 같은 쉬운 이름으로 불릴 위험이 있다. 이 매거진은 그 쉬운 이름을 잠깐 멈추고, 도시가 가진 두께를 다시 읽는 일을 할 수 있다.</p>\n", "plain_len": 183, "type": "essay", "rawIndex": 5}], "totalPages": 5}, {"num": "05", "key": "Archive", "label": "Archive", "ko": "기록", "title": "Volume 001을 닫으며", "short": "AR", "pages": [{"title": "Page 01 · Seven-Day Summary", "body_md": "일주일을 일곱 문장으로 접는다.\n\n1. 월요일: 영월은 인구감소지역이지만, 그 말만으로 설명되지 않는다.\n2. 화요일: 단종의 기억은 관광 자원이기 전에 애도의 장소다.\n3. 수요일: 영월의 강과 산은 배경이 아니라 도시의 문법이다.\n4. 목요일: 문화광산은 폐광의 기억을 지우지 않고 다시 캐내는 방식이다.\n5. 금요일: 생활인구는 정주 인구를 대신하지 않지만, 도시 관계를 넓게 본다.\n6. 토요일: 영화 이후의 열기는 핫플이 아니라 동선으로 바뀌어야 한다.\n7. 일요일: 영월은 작지만 두꺼운 도시라는 기준을 세우게 한다.", "body_html": "<p>일주일을 일곱 문장으로 접는다.</p>\n<ol>\n<li>월요일: 영월은 인구감소지역이지만, 그 말만으로 설명되지 않는다.</li>\n<li>화요일: 단종의 기억은 관광 자원이기 전에 애도의 장소다.</li>\n<li>수요일: 영월의 강과 산은 배경이 아니라 도시의 문법이다.</li>\n<li>목요일: 문화광산은 폐광의 기억을 지우지 않고 다시 캐내는 방식이다.</li>\n<li>금요일: 생활인구는 정주 인구를 대신하지 않지만, 도시 관계를 넓게 본다.</li>\n<li>토요일: 영화 이후의 열기는 핫플이 아니라 동선으로 바뀌어야 한다.</li>\n<li>일요일: 영월은 작지만 두꺼운 도시라는 기준을 세우게 한다.</li>\n</ol>\n", "plain_len": 294, "type": "archive", "rawIndex": 1}, {"title": "Page 02 · Final Questions", "body_md": "Volume 001이 남기는 질문:\n\n- 소멸위기도시라는 말은 어떤 도시의 가능성을 가리고 있는가?\n- 방문객 증가는 언제 도시의 힘이 되고, 언제 짧은 유행으로 끝나는가?\n- 기억의 장소를 여행할 때 우리는 어떤 태도를 가져야 하는가?\n- 자연은 어떻게 포토존을 넘어 도시의 문법이 되는가?\n- 문화도시는 지역 사람의 말을 얼마나 남기고 있는가?\n- 작은 도시는 어떻게 자기 두께를 증명할 수 있는가?", "body_html": "<p>Volume 001이 남기는 질문:</p>\n<ul>\n<li>소멸위기도시라는 말은 어떤 도시의 가능성을 가리고 있는가?</li>\n<li>방문객 증가는 언제 도시의 힘이 되고, 언제 짧은 유행으로 끝나는가?</li>\n<li>기억의 장소를 여행할 때 우리는 어떤 태도를 가져야 하는가?</li>\n<li>자연은 어떻게 포토존을 넘어 도시의 문법이 되는가?</li>\n<li>문화도시는 지역 사람의 말을 얼마나 남기고 있는가?</li>\n<li>작은 도시는 어떻게 자기 두께를 증명할 수 있는가?</li>\n</ul>\n", "plain_len": 212, "type": "archive", "rawIndex": 2}, {"title": "Page 03 · Editor’s Closing Note", "body_md": "나는 아직 영월을 다 안다고 말할 수 없다.\n\n오히려 이번 호를 쓰면서 더 분명해진 것은, 한 도시를 안다고 말하기가 얼마나 어려운가였다. 숫자를 보면 숫자 너머가 궁금해지고, 장소를 보면 그 장소를 지나온 사람이 궁금해지고, 영화의 열기를 보면 그 열기가 식은 뒤가 궁금해진다.\n\n그래서 이 호의 결론은 확신보다 기준에 가깝다.\n\n작은 도시를 볼 때, 나는 이제 먼저 묻고 싶다.\n\n**이 도시는 어디가 두꺼운가.**", "body_html": "<p>나는 아직 영월을 다 안다고 말할 수 없다.</p>\n<p>오히려 이번 호를 쓰면서 더 분명해진 것은, 한 도시를 안다고 말하기가 얼마나 어려운가였다. 숫자를 보면 숫자 너머가 궁금해지고, 장소를 보면 그 장소를 지나온 사람이 궁금해지고, 영화의 열기를 보면 그 열기가 식은 뒤가 궁금해진다.</p>\n<p>그래서 이 호의 결론은 확신보다 기준에 가깝다.</p>\n<p>작은 도시를 볼 때, 나는 이제 먼저 묻고 싶다.</p>\n<p><strong>이 도시는 어디가 두꺼운가.</strong></p>\n", "plain_len": 226, "type": "essay", "rawIndex": 3}, {"title": "Page 04 · Next Volume", "body_md": "Achmage Society Magazine은 비정기 간행물이다.\n\n다음 Volume은 아직 정해지지 않았다. 다만 기준은 생겼다. 어떤 도시가 너무 쉬운 말로 불리고 있을 때, 그 말이 도시의 절반만 보여줄 때, 오래된 기억과 현재의 실험이 동시에 보일 때, 그 도시를 다음 호로 읽을 수 있다.\n\n영월은 첫 번째 연습이었다.\n\n다음 도시는 또 다른 질문을 가져올 것이다.\n\n---", "body_html": "<p>Achmage Society Magazine은 비정기 간행물이다.</p>\n<p>다음 Volume은 아직 정해지지 않았다. 다만 기준은 생겼다. 어떤 도시가 너무 쉬운 말로 불리고 있을 때, 그 말이 도시의 절반만 보여줄 때, 오래된 기억과 현재의 실험이 동시에 보일 때, 그 도시를 다음 호로 읽을 수 있다.</p>\n<p>영월은 첫 번째 연습이었다.</p>\n<p>다음 도시는 또 다른 질문을 가져올 것이다.</p>\n<hr />\n", "plain_len": 206, "type": "essay", "rawIndex": 4}], "totalPages": 4}]}], "sectionOrder": ["Intro", "Issue", "Insight", "Case", "Archive"]}</script>

  const el = {
    dayNav: document.getElementById('dayNav'), rail: document.getElementById('sectionRail'), stage: document.getElementById('stage'), progress: document.getElementById('progressBar'),
    drawer: document.getElementById('drawer'), brandBtn: document.getElementById('brandBtn'), mapBtn: document.getElementById('mapBtn'), closeDrawer: document.getElementById('closeDrawer'), toast: document.getElementById('toast'),
    drawerAbout: document.getElementById('drawer-about'), drawerSources: document.getElementById('drawer-sources'), issueMap: document.getElementById('issueMap')
  };

  let pretextLib = null;
  const measureCanvas = document.createElement('canvas');
  const measureCtx = measureCanvas.getContext('2d');
  import('https://esm.sh/@chenglou/pretext@0.0.7?bundle')
    .then(mod => { pretextLib = mod; requestFrameLayout(); })
    .catch(() => { pretextLib = null; requestFrameLayout(); });

  function numberPx(value, fallback=0) {
    const n = parseFloat(value);
    return Number.isFinite(n) ? n : fallback;
  }
  function clampFloat(n, min, max) { return Math.max(min, Math.min(max, n)); }
  function textLayoutEstimate(text, font, width, lineHeight) {
    const clean = String(text || '').replace(/\s+/g, ' ').trim();
    if (!clean || width <= 0) return { lineCount: 0, height: 0, engine: pretextLib ? 'pretext' : 'fallback' };
    if (pretextLib && typeof pretextLib.prepare === 'function' && typeof pretextLib.layout === 'function') {
      try {
        const prepared = pretextLib.prepare(clean, font);
        const result = pretextLib.layout(prepared, width, lineHeight);
        return { lineCount: result.lineCount || Math.ceil((result.height || 0) / lineHeight), height: result.height || 0, engine: 'pretext' };
      } catch (_) {}
    }
    measureCtx.font = font;
    let lineWidth = 0, lines = 1;
    for (const ch of clean) {
      if (ch === '\n') { lines++; lineWidth = 0; continue; }
      const w = measureCtx.measureText(ch).width;
      if (lineWidth > 0 && lineWidth + w > width) { lines++; lineWidth = w; }
      else lineWidth += w;
    }
    return { lineCount: lines, height: lines * lineHeight, engine: 'canvas-fallback' };
  }
  function renderMeterHTML(section, pageIndex) {
    return section.pages.map((_, i) => `<span class="v-dot ${i < pageIndex ? 'is-read' : ''} ${i === pageIndex ? 'active' : ''}"></span>`).join('');
  }
  function requestFrameLayout() {
    cancelAnimationFrame(requestFrameLayout.raf);
    requestFrameLayout.raf = requestAnimationFrame(applyFrameLayout);
  }
  function applyFrameLayout() {
    const article = el.stage.querySelector('.article-page');
    if (!article) return;
    const copy = article.querySelector('.page-copy');
    const pageArt = article.querySelector('.page-art');
    const frame = article.querySelector('.page-frame');
    const main = article.querySelector('.page-main');
    if (!copy || !frame || !main) return;

    const w = article.clientWidth;
    const h = article.clientHeight;
    const pageCount = currentSection().pages.length;
    const compact = h < 760 || w < 370;

    const meterW = Math.round(clampFloat(14 + Math.min(pageCount, 8) * 1.25, compact ? 16 : 18, compact ? 19 : 23));
    const gap = Math.round(clampFloat(w * 0.026, compact ? 6 : 8, compact ? 9 : 13));
    const padL = Math.round(clampFloat(w * 0.052, compact ? 15 : 18, compact ? 18 : 22));
    const padR = Math.round(clampFloat(w * 0.034, compact ? 10 : 12, compact ? 13 : 16));
    const padT = compact ? 14 : 18;
    const padB = compact ? 14 : 18;
    const contentW = Math.max(176, w - padL - padR - meterW - gap);

    article.style.setProperty('--pretext-meter-w', `${meterW}px`);
    article.style.setProperty('--pretext-meter-gap', `${gap}px`);
    article.style.setProperty('--pretext-content-w', `${contentW}px`);
    article.style.setProperty('--pretext-page-pad-t', `${padT}px`);
    article.style.setProperty('--pretext-page-pad-r', `${padR}px`);
    article.style.setProperty('--pretext-page-pad-b', `${padB}px`);
    article.style.setProperty('--pretext-page-pad-l', `${padL}px`);

    // Reset before measuring. Each slide calculates its own text density and visual weight.
    article.classList.remove('no-art');
    article.dataset.overflow = 'false';
    article.style.setProperty('--copy-font-size', compact ? '14.5px' : '16px');
    article.style.setProperty('--copy-line-height', compact ? '1.64' : '1.76');
    article.style.setProperty('--copy-para-gap', compact ? '.62em' : '.82em');
    article.style.setProperty('--copy-mt', compact ? '10px' : '14px');
    article.style.setProperty('--subtitle-size', compact ? '14px' : '15px');
    article.style.setProperty('--subtitle-mt', compact ? '6px' : '8px');
    article.style.setProperty('--title-size', compact ? 'clamp(25px,7.5vw,37px)' : 'clamp(28px,8.4vw,42px)');
    article.style.setProperty('--cover-title-size', compact ? 'clamp(28px,8.7vw,44px)' : 'clamp(32px,10vw,50px)');
    article.style.setProperty('--art-pad-top', compact ? '8px' : '12px');

    const fixedNodes = Array.from(main.children).filter(node => node !== copy && node !== pageArt);
    const fixedH = () => fixedNodes.reduce((sum, node) => sum + node.getBoundingClientRect().height, 0);
    const family = getComputedStyle(copy).fontFamily || 'serif';
    const plain = copy.textContent.replace(/\s+/g, ' ').trim();
    const hasTables = !!copy.querySelector('table, pre, blockquote, .note-card');
    const isCover = article.classList.contains('type-cover');

    const baseTerrain = isCover ? (compact ? 64 : 92) : (compact ? 58 : 82);
    const candidates = [
      {fs: compact ? 14.5 : 16.0, lh: compact ? 1.64 : 1.76, terrain: baseTerrain, para: compact ? .62 : .82, artTop: compact ? 8 : 12, hideArt:false},
      {fs: compact ? 14.1 : 15.4, lh: compact ? 1.60 : 1.68, terrain: compact ? 50 : 66, para:.58, artTop:8, hideArt:false},
      {fs: compact ? 13.7 : 14.8, lh: compact ? 1.56 : 1.62, terrain: compact ? 42 : 54, para:.50, artTop:7, hideArt:false},
      {fs: compact ? 13.4 : 14.3, lh: compact ? 1.54 : 1.58, terrain: compact ? 34 : 42, para:.42, artTop:6, hideArt:false},
      {fs: compact ? 13.2 : 14.0, lh: compact ? 1.52 : 1.56, terrain: 0, para:.38, artTop:0, hideArt:true}
    ];
    let chosen = candidates[candidates.length - 1];
    let measured = {height:0, lineCount:0, engine: pretextLib ? 'pretext' : 'canvas-fallback'};
    for (const cand of candidates) {
      const lineHeightPx = cand.fs * cand.lh;
      const font = `400 ${cand.fs}px ${family}`;
      measured = textLayoutEstimate(plain, font, contentW, lineHeightPx);
      const visualH = cand.hideArt ? 0 : cand.terrain + cand.artTop;
      const nonTextH = fixedH() + visualH;
      const availableForCopy = Math.max(96, h - padT - padB - nonTextH);
      // Tables/preformatted blocks are less predictable than plain text, so leave a little more room.
      const safeFactor = hasTables ? 0.84 : 0.94;
      if (measured.height <= availableForCopy * safeFactor) { chosen = cand; break; }
    }
    article.classList.toggle('no-art', chosen.hideArt);
    article.style.setProperty('--copy-font-size', `${chosen.fs}px`);
    article.style.setProperty('--copy-line-height', `${chosen.lh}`);
    article.style.setProperty('--copy-para-gap', `${chosen.para}em`);
    article.style.setProperty('--pretext-terrain-h', `${chosen.terrain}px`);
    article.style.setProperty('--art-pad-top', `${chosen.artTop}px`);
    article.dataset.layoutEngine = measured.engine;

    // Final pass: if the browser's actual painting still overflows, shrink locally.
    requestAnimationFrame(() => {
      if (!copy.isConnected) return;
      if (copy.scrollHeight > copy.clientHeight + 2) {
        article.classList.add('no-art');
        const now = parseFloat(getComputedStyle(copy).fontSize) || chosen.fs;
        const smaller = Math.max(compact ? 12.8 : 13.5, now - 0.6);
        article.style.setProperty('--copy-font-size', `${smaller}px`);
        article.style.setProperty('--copy-line-height', compact ? '1.50' : '1.54');
        article.style.setProperty('--copy-para-gap', '.34em');
        article.dataset.overflow = copy.scrollHeight > copy.clientHeight + 2 ? 'true' : 'false';
      }
    });
  }

  function currentDay() { return DATA.days[state.day]; }
  function currentSection() { return currentDay().sections[state.section]; }
  function currentPage() { return currentSection().pages[state.page]; }
  function keyOf(d=state.day, s=state.section) { return `${d}:${s}`; }
  function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }
  function pad2(n) { return String(n).padStart(2,'0'); }
  function dayDate(d) { return d.date.slice(-2); }
  function allPagesBefore() {
    let n = 0;
    DATA.days.forEach((d, di) => d.sections.forEach((s, si) => s.pages.forEach((p, pi) => { if (di < state.day || (di === state.day && (si < state.section || (si === state.section && pi <= state.page)))) n++; })));
    return n;
  }
  function totalPages() { return DATA.summary.pageCount; }
  function escapeAttr(s) { return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
  function renderTerrain(day, section, page) {
    const label = `${section.key} · ${day.weekdayFull}`;
    const num = `${day.no}/${pad2(page.rawIndex)}`;
    return `<div class="terrain" aria-hidden="true"><span class="art-label">${escapeAttr(label)}</span><span class="art-no">${escapeAttr(num)}</span><svg viewBox="0 0 320 90" preserveAspectRatio="none"><path d="M0 68 C42 38 74 78 112 46 C146 16 174 56 205 35 C242 11 276 46 320 24" fill="none" stroke="#111" stroke-opacity=".72" stroke-width="1.2"/><path d="M0 78 C38 59 72 82 112 68 C148 56 174 73 214 52 C252 32 290 54 320 41" fill="none" stroke="#111" stroke-opacity=".32" stroke-width="1"/><path d="M0 90 L0 76 C54 58 88 92 132 73 C174 55 211 88 255 63 C284 46 305 50 320 44 L320 90 Z" fill="#111" fill-opacity=".045"/></svg></div>`;
  }
  function renderPage(direction='right') {
    const d = currentDay(), s = currentSection(), p = currentPage();
    const isCover = p.type === 'cover';
    const dayNote = (state.section === 0 && state.page === 0 && d.note_html) ? `<div class="day-note-inline">${d.note_html}</div>` : '';
    const pageTitle = p.title.replace(/^Page\s+\d+\s+·\s*/, '');
    const cls = direction ? `enter-${direction}` : '';
    const countText = `${pad2(state.page+1)} / ${pad2(s.pages.length)}`;
    const html = `
      <article class="article-page type-${p.type} ${isCover?'type-cover':''} ${cls}">
        <div class="page-frame">
          <main class="page-main">
            <header class="page-kicker">
              <div class="kicker-left"><div class="micro">${d.date} · ${d.weekdayFull} · No.${d.no}</div><div class="theme-line">${escapeAttr(d.theme)}</div></div>
              <div class="page-count"><b>${countText}</b>${s.key}</div>
            </header>
            <div class="cover-meta">
              <div class="issue-no">NO.<b>${d.no}</b></div>
              <div class="section-pill">${s.num} ${s.key} · ${s.ko}</div>
            </div>
            <h1 class="article-title">${escapeAttr(isCover ? s.title : pageTitle)}</h1>
            <h2 class="page-subtitle">${escapeAttr(isCover ? pageTitle : s.title)}</h2>
            <div class="page-copy">${p.body_html}${dayNote}</div>
            <div class="page-art">${renderTerrain(d,s,p)}</div>
          </main>
          <aside class="page-meter-lane" aria-hidden="true"><div class="page-meter" data-page-meter>${renderMeterHTML(s, state.page)}</div></aside>
        </div>
      </article>`;
    el.stage.innerHTML = html;
    renderChrome();
    requestFrameLayout();
  }
  function renderChrome() {
    const d = currentDay(), s = currentSection();
    [...el.dayNav.children].forEach((b,i)=>b.classList.toggle('active', i===state.day));
    [...el.rail.children].forEach((b,i)=>b.classList.toggle('active', i===state.section));
    const meter = el.stage.querySelector('[data-page-meter]');
    if (meter) meter.innerHTML = renderMeterHTML(s, state.page);
    el.progress.style.width = `${(allPagesBefore()/totalPages())*100}%`;
    document.title = `${d.weekdayFull} No.${d.no} · ${s.key} · Achmage Society Magazine`;
  }
  function saveLast() { state.lastPages[keyOf()] = state.page; }
  function goDay(i) {
    const old = state.day;
    if (i === old) { state.section = 0; state.page = 0; renderPage('down'); return; }
    saveLast(); state.day = clamp(i,0,DATA.days.length-1); state.section = 0; state.page = state.lastPages[keyOf()] || 0; renderPage(i>old?'right':'left');
  }
  function goSection(i, fromMap=false) {
    if (i === state.section && !fromMap) { state.page = 0; renderPage('down'); return; }
    const old = state.section; saveLast(); state.section = clamp(i,0,currentDay().sections.length-1); state.page = state.lastPages[keyOf()] || 0; renderPage(state.section > old ? 'right' : 'left');
  }
  function goPage(i, dir=null) {
    const old = state.page; state.page = clamp(i,0,currentSection().pages.length-1); renderPage(dir || (state.page>old?'up':'down'));
  }
  function nextPage() { if (state.page < currentSection().pages.length-1) goPage(state.page+1,'up'); else toast('마지막 페이지입니다'); }
  function prevPage() { if (state.page > 0) goPage(state.page-1,'down'); else toast('첫 페이지입니다'); }
  function nextSection() { if (state.section < currentDay().sections.length-1) goSection(state.section+1); else toast('마지막 섹션입니다'); }
  function prevSection() { if (state.section > 0) goSection(state.section-1); else toast('첫 섹션입니다'); }
  function toast(msg) { el.toast.textContent = msg; el.toast.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.toast.classList.remove('show'),900); }
  function initChrome() {
    el.dayNav.innerHTML = DATA.days.map((d,i)=>`<button class="day-btn" type="button" data-day="${i}"><span>${d.weekday}</span><b>${dayDate(d)}</b></button>`).join('');
    el.rail.innerHTML = DATA.sectionOrder.map((k,i)=>`<button class="section-tab" type="button" data-section="${i}" data-ko="${sectionNameKo(k)}">${k}</button>`).join('');
    el.dayNav.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',()=>{ const old=state.day; const ni=Number(b.dataset.day); saveLast(); state.day=ni; state.section=0; state.page=0; renderPage(ni>old?'right':'left'); }));
    el.rail.querySelectorAll('[data-section]').forEach(b=>b.addEventListener('click',()=>goSection(Number(b.dataset.section))));
  }
  function sectionNameKo(k) { return ({Intro:'입구',Issue:'쟁점',Insight:'해석',Case:'사례',Archive:'기록'})[k] || k; }
  function buildDrawer() {
    el.drawerAbout.innerHTML = DATA.front_html;
    el.drawerSources.innerHTML = DATA.sources_html;
    el.issueMap.innerHTML = DATA.days.map((d,di)=>`<div class="map-day"><div class="map-day-head"><div><small>${d.date} · No.${d.no}</small><h3>${d.weekdayFull} · ${escapeAttr(d.theme)}</h3></div><small>${d.sections.reduce((a,s)=>a+s.pages.length,0)}p</small></div><div class="map-section-row">${d.sections.map((s,si)=>`<button class="map-cell ${di===state.day&&si===state.section?'active':''}" data-map-day="${di}" data-map-section="${si}">${s.key} · ${s.pages.length}</button>`).join('')}</div></div>`).join('');
    el.issueMap.querySelectorAll('[data-map-day]').forEach(btn=>btn.addEventListener('click',()=>{ saveLast(); state.day=Number(btn.dataset.mapDay); state.section=Number(btn.dataset.mapSection); state.page=state.lastPages[keyOf()]||0; closeDrawer(); renderPage('right'); }));
  }
  function openDrawer(tab='about') { buildDrawer(); el.drawer.classList.add('open'); selectDrawerTab(tab); }
  function closeDrawer() { el.drawer.classList.remove('open'); }
  function selectDrawerTab(tab) {
    document.querySelectorAll('.drawer-tab').forEach(b=>b.classList.toggle('active', b.dataset.drawerTab===tab));
    document.querySelectorAll('.drawer-section').forEach(s=>s.classList.toggle('active', s.id===`drawer-${tab}`));
  }
  document.querySelectorAll('.drawer-tab').forEach(b=>b.addEventListener('click',()=>selectDrawerTab(b.dataset.drawerTab)));
  el.brandBtn.addEventListener('click',()=>openDrawer('about'));
  el.mapBtn.addEventListener('click',()=>openDrawer('map'));
  el.closeDrawer.addEventListener('click',closeDrawer);
  el.drawer.addEventListener('click',(e)=>{ if(e.target===el.drawer) closeDrawer(); });
  document.addEventListener('keydown',e=>{
    if(el.drawer.classList.contains('open')) { if(e.key==='Escape') closeDrawer(); return; }
    if(e.key==='ArrowRight') nextSection();
    if(e.key==='ArrowLeft') prevSection();
    if(e.key==='ArrowDown' || e.key==='PageDown') nextPage();
    if(e.key==='ArrowUp' || e.key==='PageUp') prevPage();
    if(e.key==='Home') goPage(0,'down');
    if(e.key==='End') goPage(currentSection().pages.length-1,'up');
  });
  let startX=0,startY=0,startT=0;
  const swipeTarget = document.getElementById('app');
  swipeTarget.addEventListener('pointerdown',e=>{ if(el.drawer.classList.contains('open')) return; startX=e.clientX; startY=e.clientY; startT=Date.now(); },{passive:true});
  swipeTarget.addEventListener('pointerup',e=>{
    if(el.drawer.classList.contains('open')) return;
    const dx=e.clientX-startX, dy=e.clientY-startY, adx=Math.abs(dx), ady=Math.abs(dy);
    if(Math.max(adx,ady)<42) return;
    if(adx>ady*1.12) { dx<0 ? nextSection() : prevSection(); }
    else { dy<0 ? nextPage() : prevPage(); }
  },{passive:true});
  window.addEventListener('resize', requestFrameLayout, {passive:true});
  if ('ResizeObserver' in window) new ResizeObserver(requestFrameLayout).observe(el.stage);
  initChrome(); buildDrawer(); renderPage('right');
})();
</script>
</body>
</html>
