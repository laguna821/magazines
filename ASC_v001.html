<script id="magazine-data" type="application/json">{"summary": {"title": "Achmage Society Magazine", "volume": "Volume 001", "publisher": "Achmage", "concept": "지방도시 특징: 소멸위기도시로 오해하기 쉬운 도시의 재발견", "period": "2026-05-04 ~ 2026-05-10", "leadPlace": "강원특별자치도 영월군", "pageCount": 169, "sectionCount": 35}, "front_html": "<h1>Achmage Society Magazine — Volume 001</h1>\n<h2>지방도시 특징: 소멸위기도시로 오해하기 쉬운 도시의 재발견</h2>\n<ul>\n<li><strong>발행인 겸 총괄 매거진 에디터:</strong> Achmage</li>\n<li><strong>발행 형식:</strong> 비정기 모바일 매거진</li>\n<li><strong>기준 주간:</strong> 2026-05-04 월요일 ~ 2026-05-10 일요일</li>\n<li><strong>대표 도시:</strong> 강원특별자치도 영월군</li>\n<li><strong>핵심 질문:</strong> 소멸위기도시라는 말은 도시의 무엇을 보지 못하게 만드는가?</li>\n<li><strong>읽기 구조:</strong> 좌우는 <code>Intro / Issue / Insight / Case / Archive</code> 이동, 상하는 같은 탭 안의 깊이 읽기</li>\n<li><strong>원고 원칙:</strong> 자료는 정확하게, 문장은 사람의 숨이 남아 있게, 결론은 너무 빨리 닫지 않기</li>\n</ul>\n<aside class=\"note-card\"><strong>문서 사용법</strong><p>이 문서는 HTML에 바로 넣기 위한 <strong>원고 원본(raw text)</strong>이다.<br />\n<code>## 날짜</code>는 하루 단위, <code>#### 탭</code>은 좌우 이동 단위, <code>##### Page</code>는 상하 이동 단위다.<br />\n실제 HTML에서는 <code>Day → Section → Page</code> 순서로 읽으면 된다.</p>\n</aside>\n\n<hr />\n<h2>발행인의 말 · 왜 영월인가</h2>\n<p>월요일 아침, 기사 제목 하나를 오래 붙잡고 있었다. “인구감소지역 영월에 영화 한 편으로 22만 명이 몰렸다”는 식의 문장이었다. 보통이면 숫자부터 봤을 것이다. 22만 명. 카드 소비 172억 원. 청령포와 장릉 입장객 급증. 이런 숫자는 눈에 잘 들어온다. 그런데 이상하게도 내가 멈춘 곳은 숫자보다 앞쪽이었다.</p>\n<p><strong>인구감소지역.</strong></p>\n<p>이 말은 필요하다. 행정은 어떤 지역이 실제로 어려운지 구분해야 하고, 예산은 근거 없이 움직일 수 없다. 영월군도 행정안전부가 지정한 인구감소지역 목록 안에 들어 있다. 그러니 이 말을 없애자는 얘기는 아니다. 다만 나는 이 말이 한 도시를 너무 빨리 결론 내리게 만드는 순간을 경계하고 싶어졌다.</p>\n<p>인구가 줄어드는 도시를 보면 우리는 거의 자동으로 몇 가지 장면을 떠올린다. 닫힌 학교, 비어 있는 집, 오래된 버스정류장, 떠나는 청년, 버티는 노인. 틀린 장면은 아니다. 하지만 그 장면만으로 한 도시를 다 봤다고 말할 수 있을까. 그 도시가 가진 기억, 지형, 밤하늘, 오래된 축제, 다시 찾아오는 사람들의 마음은 어디에 놓아야 할까.</p>\n<p>영월은 이 질문에 잘 맞는 도시였다. 단종의 기억이 있고, 청령포와 장릉이 있고, 동강과 서강의 지형이 있고, 별마로천문대가 있고, 폐광의 시간에서 문화광산의 시간으로 넘어가려는 실험이 있다. 그리고 2026년 봄, 영화 〈왕과 사는 남자〉의 흥행 이후 사람들은 다시 영월을 불렀다.</p>\n<p>이번 Volume 001은 영월을 성공 사례로 포장하지 않는다. “영월이 이제 살아났다”라고 말하지도 않는다. 그런 말은 빠르고, 빠른 말은 대개 얇다. 나는 그보다 느린 질문을 세우고 싶다.</p>\n<blockquote>\n<p><strong>한 도시는 언제 다시 읽히는가.</strong></p>\n</blockquote>\n<p>이 질문으로 7일을 나눈다.</p>\n<hr />\n<h2>전체 편집 지도</h2>\n<table>\n<thead>\n<tr>\n  <th>날짜</th>\n  <th>주제</th>\n  <th>그날의 중심 질문</th>\n  <th>주요 자료 축</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>2026-05-04 월</td>\n  <td>다시 열린 도시</td>\n  <td>영화 한 편은 어떻게 인구감소지역의 이미지를 흔들었나</td>\n  <td>KCTI 방문·소비 변화, 강원일보 5월 4일 보도, 청령포·장릉</td>\n</tr>\n<tr>\n  <td>2026-05-05 화</td>\n  <td>기억의 도시</td>\n  <td>유배와 애도는 어떻게 오늘의 여행 감정이 되는가</td>\n  <td>단종, 청령포, 장릉, 단종문화제</td>\n</tr>\n<tr>\n  <td>2026-05-06 수</td>\n  <td>지형의 도시</td>\n  <td>강과 산은 도시의 성격을 어떻게 만든다</td>\n  <td>영월10경, 한반도지형, 선돌, 어라연, 별마로천문대</td>\n</tr>\n<tr>\n  <td>2026-05-07 목</td>\n  <td>문화광산 도시</td>\n  <td>폐광의 기억은 어떻게 문화의 언어로 바뀌는가</td>\n  <td>2025 올해의 문화도시, 문화광산, 주민 기록</td>\n</tr>\n<tr>\n  <td>2026-05-08 금</td>\n  <td>생활인구 도시</td>\n  <td>주소를 두지 않은 사람도 도시의 힘이 될 수 있는가</td>\n  <td>외지인 방문, 카드 소비, 기차여행 상품, 체류 인구</td>\n</tr>\n<tr>\n  <td>2026-05-09 토</td>\n  <td>영화 이후 도시</td>\n  <td>반짝 유행을 오래 남는 동선으로 바꾸려면 무엇이 필요한가</td>\n  <td>영화 관광, 큐레이션, 안전, 시장, 재방문</td>\n</tr>\n<tr>\n  <td>2026-05-10 일</td>\n  <td>작지만 두꺼운 도시</td>\n  <td>소멸위기라는 말을 넘어 어떤 기준으로 도시를 다시 볼 것인가</td>\n  <td>주간 결론, 평가 기준, 다음 Volume 예고</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2>자료 사용 원칙</h2>\n<aside class=\"note-card\"><strong>자료와 해석을 나누는 규칙</strong><p>자료는 이 원고의 바닥이다. 하지만 자료가 원고의 주인공은 아니다.<br />\n수치는 출처를 남기고, 해석은 발행인의 문장으로 따로 쓴다.<br />\n확인되지 않은 촬영지 정보, 과장된 흥행 효과, 출처 없는 방문객 숫자는 넣지 않는다.</p>\n</aside>\n\n<p>이 원고에서 쓰는 주요 자료는 문서 끝 <code>자료 출처</code>에 모았다. 본문에서는 흐름을 해치지 않기 위해 <code>R-01</code>, <code>R-02</code>처럼 자료 ID로만 표시한다.</p>\n<hr />\n", "sources_html": "<h2>자료 출처</h2>\n<table>\n<thead>\n<tr>\n  <th>ID</th>\n  <th>자료</th>\n  <th>본문에서 사용한 내용</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>R-01</td>\n  <td>행정안전부, 인구감소지역 지정</td>\n  <td>영월군이 인구감소지역 89개 목록 안에 포함된 사실</td>\n</tr>\n<tr>\n  <td>R-02</td>\n  <td>한국문화관광연구원, 2026 KCTI 데이터 포커스 제2호: 영화 〈왕과 사는 남자〉 흥행이 이끈 영월 지역 방문·소비 변화</td>\n  <td>2026년 1분기 영월 외지인 방문, 카드 소비, 핵심 배경지 입장객 증가 관련 자료</td>\n</tr>\n<tr>\n  <td>R-03</td>\n  <td>한국문화관광연구원 보도자료, “천만 영화가 인구감소지역을 흔들었다”</td>\n  <td>1분기 일평균 외지인 방문객 약 1만7천 명, 전년 대비 17% 증가, 약 22만 명 추가 방문, 카드 소비 약 172억 원 등</td>\n</tr>\n<tr>\n  <td>R-04</td>\n  <td>강원일보, 2026-05-04, “인구감소지역 ‘영월’에 영화 한편으로 22만명 몰려…”</td>\n  <td>2026년 5월 4일 기준 대중 보도 정리, 카드 소비·청령포·장릉 수치 확인</td>\n</tr>\n<tr>\n  <td>R-05</td>\n  <td>연합뉴스, 2026-03-08, “영화 ‘왕사남’ 1천100만…영월 청령포·장릉 방문객 11만명 돌파”</td>\n  <td>영화 흥행과 청령포·장릉 방문 증가, 단종 생애, 청령포·장릉 설명</td>\n</tr>\n<tr>\n  <td>R-06</td>\n  <td>연합뉴스, 2026-03-17, “영화 ‘왕사남’ 재조명…영월 관광 기차여행 상품 출시”</td>\n  <td>코레일 연계 영월 관광 기차여행 상품, 주말 운행, 주요 동선</td>\n</tr>\n<tr>\n  <td>R-07</td>\n  <td>영월군 문화관광 공식 홈페이지</td>\n  <td>장릉, 청령포, 별마로천문대 등 관광지 설명</td>\n</tr>\n<tr>\n  <td>R-08</td>\n  <td>영월군 문화관광, 영월10경</td>\n  <td>영월10경 목록</td>\n</tr>\n<tr>\n  <td>R-09</td>\n  <td>영월문화관광재단, “문화도시 영월, 2025 올해의 문화도시 선정”</td>\n  <td>2022년 법정문화도시 지정, 2025 올해의 문화도시 선정, 문화광산도시 배경</td>\n</tr>\n<tr>\n  <td>R-10</td>\n  <td>영월군 문화관광, 단종문화제</td>\n  <td>2026년 제59회 단종문화제 일정, 장소, 주요 행사</td>\n</tr>\n<tr>\n  <td>R-11</td>\n  <td>관련 보도, 영월군 2026년도 지방소멸대응기금 우수지역 선정</td>\n  <td>청년 친화형 활력지구, 봉래산 명소화 등 장기 대응 축 참고</td>\n</tr>\n</tbody>\n</table>\n<hr />\n<h2>링크 목록</h2>\n<ul>\n<li>R-01: https://www.mois.go.kr/frt/sub/a06/b06/populationDecline/screen.do</li>\n<li>R-02: https://www.kcti.re.kr/web/board/boardContentsView.do?board_id=34&amp;contents_id=162c3750dd4844a1b00b9be5e3d16c96&amp;link_g_homepage=F&amp;link_g_submenu_id=89743896af7645e0a6223673c1dfcfd9&amp;link_g_topmenu_id=15f51238586a425981abe0b5f685d43a</li>\n<li>R-03: https://www.kcti.re.kr/web/board/boardContentsView.do?LISTOP=&amp;board_id=17&amp;contents_id=abeacc68bb6d4fa682a8a42b87a89437&amp;email=&amp;emailAes=&amp;miv_pageNo=&amp;miv_pageSize=&amp;mode=W&amp;searchkey=ALL&amp;searchtxt=&amp;secretBoard_yn=&amp;titname=&amp;total_cnt=</li>\n<li>R-04: https://m.kwnews.co.kr/page/view/2026050350112800000</li>\n<li>R-05: https://www.yna.co.kr/view/AKR20260308048600062</li>\n<li>R-06: https://www.yna.co.kr/view/AKR20260317081300062</li>\n<li>R-07: https://www.yw.go.kr/tour/index.do</li>\n<li>R-08: https://www.yw.go.kr/tour/contents.do?ctgry=5&amp;key=559</li>\n<li>R-09: https://www.ywcf.or.kr/notices/2415</li>\n<li>R-10: https://www.yw.go.kr/tour/contents.do?key=575</li>\n<li>R-11: https://www.newsis.com/view/NISX20251204_0003428639</li>\n</ul>\n", "days": [{"date": "2026-05-04", "weekday": "월", "weekdayFull": "월요일", "no": "001", "titleLine": "2026-05-04 월요일 · No.001", "theme": "영화 한 편이 도시를 다시 열었다", "note_html": "<aside class=\"note-card\"><strong>월요일의 역할</strong><p>월요일은 Volume 001의 입구다.<br />\n독자에게 “영월은 정말 사라지는 도시인가, 아니면 우리가 너무 좁게 읽어온 도시인가”라는 질문을 던진다.<br />\n이 날짜는 숫자로 시작하지만, 숫자에 갇히지 않는다.</p>\n</aside>\n\n", "sections": [{"num": "01", "key": "Intro", "label": "Intro", "ko": "입구", "title": "나는 왜 이 제목 앞에서 멈췄나", "short": "IN", "pages": [{"title": "Page 01 · Cover", "body_md": "월요일 아침에 기사 제목 하나를 보고 손이 멈췄다.\n\n“인구감소지역 영월에 영화 한 편으로 22만 명이 몰렸다.”\n\n처음에는 숫자가 눈에 들어왔다. 22만 명이라는 말은 확실히 크다. 그런데 이상하게도 오래 남은 것은 그 숫자가 아니었다. 내가 계속 보고 있던 단어는 앞쪽에 있었다. **인구감소지역.**\n\n그 말은 행정적으로 틀리지 않다. 영월군은 실제로 인구감소지역 목록에 들어 있다. 하지만 그 말을 도시 이름 앞에 붙이는 순간, 도시는 이미 절반쯤 결론 난 것처럼 보인다. 사라지는 곳. 줄어드는 곳. 젊은 사람이 떠나는 곳. 미래가 닫힌 곳.\n\n나는 그 자동 반응이 불편했다.", "body_html": "<p>월요일 아침에 기사 제목 하나를 보고 손이 멈췄다.</p>\n<p>“인구감소지역 영월에 영화 한 편으로 22만 명이 몰렸다.”</p>\n<p>처음에는 숫자가 눈에 들어왔다. 22만 명이라는 말은 확실히 크다. 그런데 이상하게도 오래 남은 것은 그 숫자가 아니었다. 내가 계속 보고 있던 단어는 앞쪽에 있었다. <strong>인구감소지역.</strong></p>\n<p>그 말은 행정적으로 틀리지 않다. 영월군은 실제로 인구감소지역 목록에 들어 있다. 하지만 그 말을 도시 이름 앞에 붙이는 순간, 도시는 이미 절반쯤 결론 난 것처럼 보인다. 사라지는 곳. 줄어드는 곳. 젊은 사람이 떠나는 곳. 미래가 닫힌 곳.</p>\n<p>나는 그 자동 반응이 불편했다.</p>\n", "plain_len": 319, "type": "cover", "rawIndex": 1}, {"title": "Page 02 · Scene", "body_md": "영월을 생각하면 내 머릿속에는 먼저 길이 생긴다.\n\n청령포로 들어가는 배. 장릉 쪽으로 이어지는 낮은 길. 한반도지형 전망대까지 오르는 숨. 별마로천문대 앞의 밤공기. 동강 쪽 물빛. 오래된 시장에서 밥을 먹고 다시 바깥으로 나오는 사람들의 발걸음.\n\n이런 것들은 주민등록 인구표에 잘 잡히지 않는다. 하지만 도시를 실제로 느끼게 하는 것은 대개 이런 것이다. 숫자보다 먼저 몸에 닿는 것. “이곳은 어떤 곳인가”라는 질문에 표보다 먼저 대답하는 장면들.\n\n그래서 나는 영월을 인구감소지역이라는 말로만 부르는 것이 조금 억울하게 느껴졌다. 도시가 억울하다는 표현이 이상할 수 있다. 하지만 어떤 도시는 정말로 말 하나 때문에 억울해진다.", "body_html": "<p>영월을 생각하면 내 머릿속에는 먼저 길이 생긴다.</p>\n<p>청령포로 들어가는 배. 장릉 쪽으로 이어지는 낮은 길. 한반도지형 전망대까지 오르는 숨. 별마로천문대 앞의 밤공기. 동강 쪽 물빛. 오래된 시장에서 밥을 먹고 다시 바깥으로 나오는 사람들의 발걸음.</p>\n<p>이런 것들은 주민등록 인구표에 잘 잡히지 않는다. 하지만 도시를 실제로 느끼게 하는 것은 대개 이런 것이다. 숫자보다 먼저 몸에 닿는 것. “이곳은 어떤 곳인가”라는 질문에 표보다 먼저 대답하는 장면들.</p>\n<p>그래서 나는 영월을 인구감소지역이라는 말로만 부르는 것이 조금 억울하게 느껴졌다. 도시가 억울하다는 표현이 이상할 수 있다. 하지만 어떤 도시는 정말로 말 하나 때문에 억울해진다.</p>\n", "plain_len": 353, "type": "essay", "rawIndex": 2}, {"title": "Page 03 · Opening Question", "body_md": "이번 호의 질문은 여기에서 시작한다.\n\n- 영월은 정말 소멸위기도시인가?\n- 아니면 우리가 한 도시를 너무 얇은 기준으로 읽어온 것인가?\n- 인구가 줄어드는 도시에도 다시 켜지는 문화적 전기가 있는가?\n- 방문객은 도시를 살릴 수 있는가?\n- 아니면 잠깐 지나가는 소비만 남기고 다시 사라지는가?\n\n나는 이 질문들을 한 번에 답하고 싶지 않다. 너무 빠른 답은 보통 도시를 다시 납작하게 만든다.\n\n그래서 Volume 001은 7일 동안 영월을 조금씩 다른 각도에서 읽는다. 오늘은 입구다. 영화와 숫자, 그리고 그 숫자 너머에 있는 오래된 도시의 두께를 함께 본다.", "body_html": "<p>이번 호의 질문은 여기에서 시작한다.</p>\n<ul>\n<li>영월은 정말 소멸위기도시인가?</li>\n<li>아니면 우리가 한 도시를 너무 얇은 기준으로 읽어온 것인가?</li>\n<li>인구가 줄어드는 도시에도 다시 켜지는 문화적 전기가 있는가?</li>\n<li>방문객은 도시를 살릴 수 있는가?</li>\n<li>아니면 잠깐 지나가는 소비만 남기고 다시 사라지는가?</li>\n</ul>\n<p>나는 이 질문들을 한 번에 답하고 싶지 않다. 너무 빠른 답은 보통 도시를 다시 납작하게 만든다.</p>\n<p>그래서 Volume 001은 7일 동안 영월을 조금씩 다른 각도에서 읽는다. 오늘은 입구다. 영화와 숫자, 그리고 그 숫자 너머에 있는 오래된 도시의 두께를 함께 본다.</p>\n", "plain_len": 304, "type": "list", "rawIndex": 3}, {"title": "Page 04 · Bridge", "body_md": "영화 〈왕과 사는 남자〉가 영월을 새로 만든 것은 아니다.\n\n청령포는 원래 거기에 있었다. 장릉도 원래 거기에 있었다. 단종의 이야기도, 영월의 강도, 산도, 밤하늘도 갑자기 생겨난 것이 아니다. 달라진 것은 사람들의 시선이다. 영화는 닫혀 있던 문을 열었고, 사람들은 그 문을 통해 이미 오래 있던 장소를 다시 보게 되었다.\n\n좋은 콘텐츠는 때때로 이렇게 작동한다. 새로운 것을 만드는 것이 아니라, 오래 있던 것을 다시 보이게 한다.\n\n그러면 이제 첫 번째 문제로 들어가야 한다.\n\n숫자는 정말 무엇을 말하고 있는가.", "body_html": "<p>영화 〈왕과 사는 남자〉가 영월을 새로 만든 것은 아니다.</p>\n<p>청령포는 원래 거기에 있었다. 장릉도 원래 거기에 있었다. 단종의 이야기도, 영월의 강도, 산도, 밤하늘도 갑자기 생겨난 것이 아니다. 달라진 것은 사람들의 시선이다. 영화는 닫혀 있던 문을 열었고, 사람들은 그 문을 통해 이미 오래 있던 장소를 다시 보게 되었다.</p>\n<p>좋은 콘텐츠는 때때로 이렇게 작동한다. 새로운 것을 만드는 것이 아니라, 오래 있던 것을 다시 보이게 한다.</p>\n<p>그러면 이제 첫 번째 문제로 들어가야 한다.</p>\n<p>숫자는 정말 무엇을 말하고 있는가.</p>\n", "plain_len": 287, "type": "essay", "rawIndex": 4}], "totalPages": 4}, {"num": "02", "key": "Issue", "label": "Issue", "ko": "쟁점", "title": "숫자는 줄고 발걸음은 늘었다", "short": "IS", "pages": [{"title": "Page 01 · Cover", "body_md": "영월을 둘러싼 첫 번째 긴장은 숫자에서 시작된다.\n\n한쪽에는 줄어드는 주민등록 인구가 있다. 다른 한쪽에는 늘어난 외지인 방문객이 있다. 한쪽은 도시의 장기 체력을 보여주고, 다른 한쪽은 도시가 다시 불릴 수 있는 힘을 보여준다.\n\n문제는 어느 숫자가 더 진짜인가가 아니다.\n\n문제는 두 숫자를 함께 읽을 수 있는가다.", "body_html": "<p>영월을 둘러싼 첫 번째 긴장은 숫자에서 시작된다.</p>\n<p>한쪽에는 줄어드는 주민등록 인구가 있다. 다른 한쪽에는 늘어난 외지인 방문객이 있다. 한쪽은 도시의 장기 체력을 보여주고, 다른 한쪽은 도시가 다시 불릴 수 있는 힘을 보여준다.</p>\n<p>문제는 어느 숫자가 더 진짜인가가 아니다.</p>\n<p>문제는 두 숫자를 함께 읽을 수 있는가다.</p>\n", "plain_len": 175, "type": "cover", "rawIndex": 1}, {"title": "Page 02 · Data Note", "body_md": "한국문화관광연구원의 2026년 데이터 포커스와 관련 보도에 따르면, 영화 〈왕과 사는 남자〉 흥행 이후 2026년 1분기 영월을 찾은 외지인 방문객은 하루 평균 약 1만 7천 명으로 집계되었다. 전년 같은 기간보다 17% 늘었고, 누적 기준으로 약 22만 명의 추가 방문이 발생한 것으로 분석되었다.\n\n영화의 핵심 배경지로 다시 주목받은 청령포와 장릉의 증가폭은 더 뚜렷했다. 보도 자료는 청령포 입장객이 전년 동기 대비 약 640%, 장릉이 약 752% 증가했다고 설명했다. 같은 기간 외지인 카드 소비도 약 172억 원으로 전년보다 13.2% 늘었다.\n\n> [!note] 자료 기준\n> 이 페이지의 수치는 KCTI 데이터 포커스와 2026년 5월 4일 보도를 바탕으로 정리했다. 자세한 링크는 `자료 출처`의 R-02, R-03, R-04를 참고한다.", "body_html": "<p>한국문화관광연구원의 2026년 데이터 포커스와 관련 보도에 따르면, 영화 〈왕과 사는 남자〉 흥행 이후 2026년 1분기 영월을 찾은 외지인 방문객은 하루 평균 약 1만 7천 명으로 집계되었다. 전년 같은 기간보다 17% 늘었고, 누적 기준으로 약 22만 명의 추가 방문이 발생한 것으로 분석되었다.</p>\n<p>영화의 핵심 배경지로 다시 주목받은 청령포와 장릉의 증가폭은 더 뚜렷했다. 보도 자료는 청령포 입장객이 전년 동기 대비 약 640%, 장릉이 약 752% 증가했다고 설명했다. 같은 기간 외지인 카드 소비도 약 172억 원으로 전년보다 13.2% 늘었다.</p>\n<aside class=\"note-card\"><strong>자료 기준</strong><p>이 페이지의 수치는 KCTI 데이터 포커스와 2026년 5월 4일 보도를 바탕으로 정리했다. 자세한 링크는 <code>자료 출처</code>의 R-02, R-03, R-04를 참고한다.</p>\n</aside>\n\n", "plain_len": 413, "type": "essay", "rawIndex": 2}, {"title": "Page 03 · What the Numbers Do Not Say", "body_md": "이 숫자를 보고 “영월이 살아났다”고 말하고 싶을 수도 있다. 하지만 나는 그렇게 빨리 말하고 싶지 않다.\n\n방문객 증가는 중요하다. 카드 소비 증가는 더 중요하다. 사람들의 발걸음이 실제 지역 경제의 일부로 바뀌었다는 뜻이기 때문이다. 하지만 방문객이 늘었다고 해서 곧바로 정주 인구가 늘어나는 것은 아니다. 관광의 열기가 지역의 생활을 바꾸려면 시간이 더 필요하다.\n\n방문은 순간이다. 체류는 하루다. 재방문은 기억이다. 정주는 삶이다.\n\n이 네 단계를 한 문장으로 뭉개면 도시를 잘못 읽게 된다.", "body_html": "<p>이 숫자를 보고 “영월이 살아났다”고 말하고 싶을 수도 있다. 하지만 나는 그렇게 빨리 말하고 싶지 않다.</p>\n<p>방문객 증가는 중요하다. 카드 소비 증가는 더 중요하다. 사람들의 발걸음이 실제 지역 경제의 일부로 바뀌었다는 뜻이기 때문이다. 하지만 방문객이 늘었다고 해서 곧바로 정주 인구가 늘어나는 것은 아니다. 관광의 열기가 지역의 생활을 바꾸려면 시간이 더 필요하다.</p>\n<p>방문은 순간이다. 체류는 하루다. 재방문은 기억이다. 정주는 삶이다.</p>\n<p>이 네 단계를 한 문장으로 뭉개면 도시를 잘못 읽게 된다.</p>\n", "plain_len": 277, "type": "essay", "rawIndex": 3}, {"title": "Page 04 · Tension Map", "body_md": "```text\n주민등록 인구\n└─ 도시의 장기 체력\n\n외지인 방문객\n└─ 도시가 다시 불리는 힘\n\n카드 소비\n└─ 방문이 지역 경제로 바뀌는 정도\n\n체류 시간\n└─ 도시가 풍경에서 경험으로 바뀌는 정도\n\n재방문\n└─ 도시가 기억으로 남는 정도\n```\n\n영월의 현재는 이 다섯 개를 함께 봐야 보인다. 하나만 보면 낙관도 과하고 비관도 과하다.", "body_html": "<pre><code class=\"language-text\">주민등록 인구\n└─ 도시의 장기 체력\n\n외지인 방문객\n└─ 도시가 다시 불리는 힘\n\n카드 소비\n└─ 방문이 지역 경제로 바뀌는 정도\n\n체류 시간\n└─ 도시가 풍경에서 경험으로 바뀌는 정도\n\n재방문\n└─ 도시가 기억으로 남는 정도\n</code></pre>\n<p>영월의 현재는 이 다섯 개를 함께 봐야 보인다. 하나만 보면 낙관도 과하고 비관도 과하다.</p>\n", "plain_len": 50, "type": "diagram", "rawIndex": 4}, {"title": "Page 05 · The Real Issue", "body_md": "진짜 쟁점은 영월이 갑자기 인기 도시가 되었느냐가 아니다.\n\n진짜 쟁점은 **콘텐츠가 도시의 오래된 기억을 다시 호출했을 때, 지역은 그 호출을 얼마나 오래 붙잡을 수 있는가**다.\n\n영화 흥행은 계기다. 계기는 짧다. 도시가 해야 할 일은 계기를 동선으로 바꾸고, 동선을 체류로 바꾸고, 체류를 관계로 바꾸는 것이다. 청령포와 장릉을 보고 돌아가는 하루가 아니라, 영월이라는 도시 전체를 다시 읽는 시간이 되어야 한다.\n\n그러려면 숫자를 자랑하는 것만으로는 부족하다. 숫자가 들어온 길을 읽어야 한다.", "body_html": "<p>진짜 쟁점은 영월이 갑자기 인기 도시가 되었느냐가 아니다.</p>\n<p>진짜 쟁점은 <strong>콘텐츠가 도시의 오래된 기억을 다시 호출했을 때, 지역은 그 호출을 얼마나 오래 붙잡을 수 있는가</strong>다.</p>\n<p>영화 흥행은 계기다. 계기는 짧다. 도시가 해야 할 일은 계기를 동선으로 바꾸고, 동선을 체류로 바꾸고, 체류를 관계로 바꾸는 것이다. 청령포와 장릉을 보고 돌아가는 하루가 아니라, 영월이라는 도시 전체를 다시 읽는 시간이 되어야 한다.</p>\n<p>그러려면 숫자를 자랑하는 것만으로는 부족하다. 숫자가 들어온 길을 읽어야 한다.</p>\n", "plain_len": 275, "type": "essay", "rawIndex": 5}, {"title": "Page 06 · Bridge", "body_md": "소멸위기라는 말은 도시의 위험을 보여준다. 방문객 증가는 도시의 가능성을 보여준다.\n\n둘 중 하나만 잡으면 글은 쉬워진다. 하지만 도시 자체는 쉬워지지 않는다. 영월은 지금 위험과 가능성이 같이 보이는 자리 위에 있다.\n\n내가 흥미로운 것은 바로 그 자리다.\n\n그러니 다음 탭에서는 질문을 바꿔야 한다.\n\n**소멸은 도시의 상태인가, 아니면 우리가 도시를 읽는 방식인가.**", "body_html": "<p>소멸위기라는 말은 도시의 위험을 보여준다. 방문객 증가는 도시의 가능성을 보여준다.</p>\n<p>둘 중 하나만 잡으면 글은 쉬워진다. 하지만 도시 자체는 쉬워지지 않는다. 영월은 지금 위험과 가능성이 같이 보이는 자리 위에 있다.</p>\n<p>내가 흥미로운 것은 바로 그 자리다.</p>\n<p>그러니 다음 탭에서는 질문을 바꿔야 한다.</p>\n<p><strong>소멸은 도시의 상태인가, 아니면 우리가 도시를 읽는 방식인가.</strong></p>\n", "plain_len": 201, "type": "essay", "rawIndex": 6}], "totalPages": 6}, {"num": "03", "key": "Insight", "label": "Insight", "ko": "해석", "title": "소멸은 상태가 아니라 읽는 방식일 수도 있다", "short": "SG", "pages": [{"title": "Page 01 · Concept", "body_md": "소멸이라는 말은 강하다.\n\n너무 강해서 다른 말을 밀어낸다. 도시가 소멸한다고 말하는 순간, 우리는 그 도시를 미래가 닫힌 곳처럼 보기 쉽다. 마치 그곳에 남은 것은 감소율과 고령화율과 빈집뿐인 것처럼.\n\n하지만 실제 도시는 그렇게 단순하지 않다.\n\n어떤 도시는 인구가 줄어도 문화 밀도가 높다. 어떤 도시는 작아도 방문 이유가 분명하다. 어떤 도시는 경제 규모가 작아도 특정한 기억과 지형과 이야기를 갖고 있다.\n\n그래서 “소멸위기도시”라는 말은 출발점일 수는 있지만, 결론이 되어서는 안 된다.", "body_html": "<p>소멸이라는 말은 강하다.</p>\n<p>너무 강해서 다른 말을 밀어낸다. 도시가 소멸한다고 말하는 순간, 우리는 그 도시를 미래가 닫힌 곳처럼 보기 쉽다. 마치 그곳에 남은 것은 감소율과 고령화율과 빈집뿐인 것처럼.</p>\n<p>하지만 실제 도시는 그렇게 단순하지 않다.</p>\n<p>어떤 도시는 인구가 줄어도 문화 밀도가 높다. 어떤 도시는 작아도 방문 이유가 분명하다. 어떤 도시는 경제 규모가 작아도 특정한 기억과 지형과 이야기를 갖고 있다.</p>\n<p>그래서 “소멸위기도시”라는 말은 출발점일 수는 있지만, 결론이 되어서는 안 된다.</p>\n", "plain_len": 274, "type": "essay", "rawIndex": 1}, {"title": "Page 02 · Small but Thick", "body_md": "영월을 다시 읽는 데 필요한 표현은 “작지만 두꺼운 도시”다.\n\n작다는 것은 인구 규모의 문제다. 두껍다는 것은 시간의 문제다. 영월에는 단종의 역사, 청령포의 고립된 지형, 장릉의 복원된 이름, 동강과 서강의 물길, 별마로천문대의 밤, 폐광 이후 문화도시 실험이 겹쳐 있다.\n\n이 겹은 관광 안내 문구만으로는 다 보이지 않는다. 빨리 보고 떠나는 여행으로도 잘 보이지 않는다. 영월은 작아서 빨리 볼 수 있는 도시가 아니라, 작기 때문에 오히려 천천히 읽어야 하는 도시다.\n\n나는 이 차이가 중요하다고 본다.", "body_html": "<p>영월을 다시 읽는 데 필요한 표현은 “작지만 두꺼운 도시”다.</p>\n<p>작다는 것은 인구 규모의 문제다. 두껍다는 것은 시간의 문제다. 영월에는 단종의 역사, 청령포의 고립된 지형, 장릉의 복원된 이름, 동강과 서강의 물길, 별마로천문대의 밤, 폐광 이후 문화도시 실험이 겹쳐 있다.</p>\n<p>이 겹은 관광 안내 문구만으로는 다 보이지 않는다. 빨리 보고 떠나는 여행으로도 잘 보이지 않는다. 영월은 작아서 빨리 볼 수 있는 도시가 아니라, 작기 때문에 오히려 천천히 읽어야 하는 도시다.</p>\n<p>나는 이 차이가 중요하다고 본다.</p>\n", "plain_len": 282, "type": "essay", "rawIndex": 2}, {"title": "Page 03 · Editorial Standard", "body_md": "이 매거진은 영월을 “위기 지역”으로만 다루지 않는다.\n\n그렇다고 “기회의 도시”라고 쉽게 포장하지도 않는다. 둘 다 너무 빠르다. 위기라고만 말하면 지역의 살아 있는 힘이 지워지고, 기회라고만 말하면 지역이 실제로 겪는 어려움이 지워진다.\n\n이번 호의 기준은 그 사이에 있다.\n\n- 인구 감소는 현실이다.\n- 영화 흥행은 계기다.\n- 방문 증가는 신호다.\n- 문화도시 실험은 과정이다.\n- 지속 가능성은 아직 답이 아니다.\n\n이 다섯 문장을 동시에 놓고 보려고 한다.", "body_html": "<p>이 매거진은 영월을 “위기 지역”으로만 다루지 않는다.</p>\n<p>그렇다고 “기회의 도시”라고 쉽게 포장하지도 않는다. 둘 다 너무 빠르다. 위기라고만 말하면 지역의 살아 있는 힘이 지워지고, 기회라고만 말하면 지역이 실제로 겪는 어려움이 지워진다.</p>\n<p>이번 호의 기준은 그 사이에 있다.</p>\n<ul>\n<li>인구 감소는 현실이다.</li>\n<li>영화 흥행은 계기다.</li>\n<li>방문 증가는 신호다.</li>\n<li>문화도시 실험은 과정이다.</li>\n<li>지속 가능성은 아직 답이 아니다.</li>\n</ul>\n<p>이 다섯 문장을 동시에 놓고 보려고 한다.</p>\n", "plain_len": 248, "type": "list", "rawIndex": 3}, {"title": "Page 04 · Slow Reading", "body_md": "나는 지방도시를 볼 때 자꾸 빠른 판단을 하게 된다. 솔직히 말하면, 나도 그런 방식에 익숙하다. 숫자를 보고, 정책 이름을 보고, 유명 관광지를 보고, 대충 알 것 같은 기분이 든다.\n\n그런데 영월 같은 도시는 그 방식으로는 잘 안 읽힌다. 숫자는 현실을 보여주지만 도시의 결을 다 보여주지는 않는다. 관광지는 입구를 보여주지만 일상의 층을 다 보여주지는 않는다. 영화는 감정을 열지만 그 감정이 지역의 삶으로 이어지는지는 따로 봐야 한다.\n\n그러니까 이 호의 일은 어떤 의미에서 느리게 읽기다.\n\n영월을 빨리 설명하지 않기.", "body_html": "<p>나는 지방도시를 볼 때 자꾸 빠른 판단을 하게 된다. 솔직히 말하면, 나도 그런 방식에 익숙하다. 숫자를 보고, 정책 이름을 보고, 유명 관광지를 보고, 대충 알 것 같은 기분이 든다.</p>\n<p>그런데 영월 같은 도시는 그 방식으로는 잘 안 읽힌다. 숫자는 현실을 보여주지만 도시의 결을 다 보여주지는 않는다. 관광지는 입구를 보여주지만 일상의 층을 다 보여주지는 않는다. 영화는 감정을 열지만 그 감정이 지역의 삶으로 이어지는지는 따로 봐야 한다.</p>\n<p>그러니까 이 호의 일은 어떤 의미에서 느리게 읽기다.</p>\n<p>영월을 빨리 설명하지 않기.</p>\n", "plain_len": 292, "type": "essay", "rawIndex": 4}, {"title": "Page 05 · Bridge", "body_md": "소멸위기도시라는 말이 놓친 것은 가능성만이 아니다.\n\n그 말은 장소의 감정도 놓친다. 어떤 도시는 슬픔을 품고 있고, 어떤 도시는 억울함을 품고 있고, 어떤 도시는 늦게 회복된 이름을 품고 있다. 영월의 경우 그 감정의 중심에는 단종이 있다.\n\n그래서 다음 날짜는 기억의 도시로 들어간다.\n\n영월은 어떻게 유배의 장소에서 오늘의 여행지가 되었는가.", "body_html": "<p>소멸위기도시라는 말이 놓친 것은 가능성만이 아니다.</p>\n<p>그 말은 장소의 감정도 놓친다. 어떤 도시는 슬픔을 품고 있고, 어떤 도시는 억울함을 품고 있고, 어떤 도시는 늦게 회복된 이름을 품고 있다. 영월의 경우 그 감정의 중심에는 단종이 있다.</p>\n<p>그래서 다음 날짜는 기억의 도시로 들어간다.</p>\n<p>영월은 어떻게 유배의 장소에서 오늘의 여행지가 되었는가.</p>\n", "plain_len": 191, "type": "essay", "rawIndex": 5}], "totalPages": 5}, {"num": "04", "key": "Case", "label": "Case", "ko": "사례", "title": "청령포와 장릉, 다시 불린 두 장소", "short": "CA", "pages": [{"title": "Page 01 · 청령포", "body_md": "청령포는 아름다운 풍경이지만, 동시에 단절의 지형이다.\n\n삼면이 강으로 둘러싸여 있고, 한쪽은 절벽으로 막혀 있다. 배를 타지 않으면 들어가기 어려운 구조는 여행자에게는 특별한 경험이지만, 단종에게는 닫힌 세계였다. 이 차이를 놓치면 청령포는 그냥 예쁜 관광지가 된다.\n\n영화 이후 청령포가 다시 주목받은 이유는 단순히 화면에 나왔기 때문만은 아니다. 이곳의 지형 자체가 이야기의 감정을 만든다. 물과 절벽은 배경이 아니라 서사의 장치다.", "body_html": "<p>청령포는 아름다운 풍경이지만, 동시에 단절의 지형이다.</p>\n<p>삼면이 강으로 둘러싸여 있고, 한쪽은 절벽으로 막혀 있다. 배를 타지 않으면 들어가기 어려운 구조는 여행자에게는 특별한 경험이지만, 단종에게는 닫힌 세계였다. 이 차이를 놓치면 청령포는 그냥 예쁜 관광지가 된다.</p>\n<p>영화 이후 청령포가 다시 주목받은 이유는 단순히 화면에 나왔기 때문만은 아니다. 이곳의 지형 자체가 이야기의 감정을 만든다. 물과 절벽은 배경이 아니라 서사의 장치다.</p>\n", "plain_len": 243, "type": "essay", "rawIndex": 1}, {"title": "Page 02 · 장릉", "body_md": "장릉은 단종의 무덤이다.\n\n왕릉이라는 말은 권위를 떠올리게 하지만, 장릉의 감정은 조금 다르다. 이곳에는 억울함, 늦은 회복, 오래된 애도가 있다. 그래서 장릉은 승자의 기념비라기보다 뒤늦게 복원된 이름의 장소처럼 읽힌다.\n\n연합뉴스 보도는 단종이 1452년 12세에 왕위에 올랐고, 1457년 영월 관풍헌에서 17세에 죽임을 당했으며, 1698년에 복위되었다고 정리한다. 이런 시간의 간격이 장릉의 감정을 만든다. 죽음은 빨랐고, 회복은 늦었다.", "body_html": "<p>장릉은 단종의 무덤이다.</p>\n<p>왕릉이라는 말은 권위를 떠올리게 하지만, 장릉의 감정은 조금 다르다. 이곳에는 억울함, 늦은 회복, 오래된 애도가 있다. 그래서 장릉은 승자의 기념비라기보다 뒤늦게 복원된 이름의 장소처럼 읽힌다.</p>\n<p>연합뉴스 보도는 단종이 1452년 12세에 왕위에 올랐고, 1457년 영월 관풍헌에서 17세에 죽임을 당했으며, 1698년에 복위되었다고 정리한다. 이런 시간의 간격이 장릉의 감정을 만든다. 죽음은 빨랐고, 회복은 늦었다.</p>\n", "plain_len": 248, "type": "essay", "rawIndex": 2}, {"title": "Page 03 · Two Places, One Line", "body_md": "청령포와 장릉은 서로 떨어진 두 장소지만, 감정적으로는 하나의 선으로 이어진다.\n\n청령포는 갇힌 시간이다. 장릉은 늦게 돌아온 이름이다.\n\n방문객이 청령포에서 배를 타고, 장릉에서 단종의 어진과 능을 마주할 때, 그들은 단순히 두 관광지를 소비하는 것이 아니다. 한 사람의 삶이 장소로 남는 방식을 따라간다. 그 길 위에서 영화의 장면은 역사적 장소와 겹치고, 역사적 장소는 다시 개인의 감정 안으로 들어온다.\n\n이것이 영월의 힘이다. 이야기가 지형을 만나고, 지형이 다시 기억을 붙잡는다.", "body_html": "<p>청령포와 장릉은 서로 떨어진 두 장소지만, 감정적으로는 하나의 선으로 이어진다.</p>\n<p>청령포는 갇힌 시간이다. 장릉은 늦게 돌아온 이름이다.</p>\n<p>방문객이 청령포에서 배를 타고, 장릉에서 단종의 어진과 능을 마주할 때, 그들은 단순히 두 관광지를 소비하는 것이 아니다. 한 사람의 삶이 장소로 남는 방식을 따라간다. 그 길 위에서 영화의 장면은 역사적 장소와 겹치고, 역사적 장소는 다시 개인의 감정 안으로 들어온다.</p>\n<p>이것이 영월의 힘이다. 이야기가 지형을 만나고, 지형이 다시 기억을 붙잡는다.</p>\n", "plain_len": 271, "type": "essay", "rawIndex": 3}, {"title": "Page 04 · Case Insight", "body_md": "좋은 장소는 눈에 보이는 풍경만으로 작동하지 않는다.\n\n그 장소를 둘러싼 이야기, 몸의 이동, 기다림, 침묵, 기억의 겹이 함께 작동할 때 강해진다. 청령포는 배를 타야 들어간다는 물리적 절차 때문에 더 오래 남는다. 장릉은 왕릉이라는 말보다 늦게 복위된 삶의 감정 때문에 더 오래 남는다.\n\n영월의 재발견은 “촬영지 효과”로만 설명할 수 없다. 영화는 문을 열었고, 장소는 그 안에서 자기 두께를 보여주었다.", "body_html": "<p>좋은 장소는 눈에 보이는 풍경만으로 작동하지 않는다.</p>\n<p>그 장소를 둘러싼 이야기, 몸의 이동, 기다림, 침묵, 기억의 겹이 함께 작동할 때 강해진다. 청령포는 배를 타야 들어간다는 물리적 절차 때문에 더 오래 남는다. 장릉은 왕릉이라는 말보다 늦게 복위된 삶의 감정 때문에 더 오래 남는다.</p>\n<p>영월의 재발견은 “촬영지 효과”로만 설명할 수 없다. 영화는 문을 열었고, 장소는 그 안에서 자기 두께를 보여주었다.</p>\n", "plain_len": 227, "type": "essay", "rawIndex": 4}, {"title": "Page 05 · Bridge", "body_md": "월요일의 결론은 조심스럽다.\n\n영월은 줄어드는 숫자와 늘어나는 발걸음 사이에 있다. 이 둘은 서로를 지우지 않는다. 오히려 함께 놓을 때 도시의 현재가 보인다.\n\n내일은 숫자보다 더 오래된 층으로 들어간다.\n\n단종의 기억이다.", "body_html": "<p>월요일의 결론은 조심스럽다.</p>\n<p>영월은 줄어드는 숫자와 늘어나는 발걸음 사이에 있다. 이 둘은 서로를 지우지 않는다. 오히려 함께 놓을 때 도시의 현재가 보인다.</p>\n<p>내일은 숫자보다 더 오래된 층으로 들어간다.</p>\n<p>단종의 기억이다.</p>\n", "plain_len": 123, "type": "essay", "rawIndex": 5}], "totalPages": 5}, {"num": "05", "key": "Archive", "label": "Archive", "ko": "기록", "title": "오늘 남길 질문", "short": "AR", "pages": [{"title": "Page 01 · Three Sentences", "body_md": "오늘의 핵심은 세 문장이다.\n\n1. 영월은 인구감소지역이지만, 그 말만으로 설명되지 않는다.\n2. 영화 〈왕과 사는 남자〉는 영월의 오래된 기억을 다시 호출했다.\n3. 앞으로 중요한 것은 방문객 숫자가 아니라, 방문이 체류와 재방문과 지역의 삶으로 이어지는가다.", "body_html": "<p>오늘의 핵심은 세 문장이다.</p>\n<ol>\n<li>영월은 인구감소지역이지만, 그 말만으로 설명되지 않는다.</li>\n<li>영화 〈왕과 사는 남자〉는 영월의 오래된 기억을 다시 호출했다.</li>\n<li>앞으로 중요한 것은 방문객 숫자가 아니라, 방문이 체류와 재방문과 지역의 삶으로 이어지는가다.</li>\n</ol>\n", "plain_len": 145, "type": "list", "rawIndex": 1}, {"title": "Page 02 · Reader Questions", "body_md": "오늘 읽고 남길 질문:\n\n- 나는 지방도시를 볼 때 어떤 숫자부터 보는가?\n- 인구가 줄어드는 도시를 자동으로 실패한 도시처럼 생각하지는 않았는가?\n- 어떤 장소는 왜 한 번의 영화, 한 번의 이야기 이후 갑자기 다르게 보이는가?\n- 영월의 방문 증가는 일시적 흥행인가, 새로운 도시 읽기의 시작인가?", "body_html": "<p>오늘 읽고 남길 질문:</p>\n<ul>\n<li>나는 지방도시를 볼 때 어떤 숫자부터 보는가?</li>\n<li>인구가 줄어드는 도시를 자동으로 실패한 도시처럼 생각하지는 않았는가?</li>\n<li>어떤 장소는 왜 한 번의 영화, 한 번의 이야기 이후 갑자기 다르게 보이는가?</li>\n<li>영월의 방문 증가는 일시적 흥행인가, 새로운 도시 읽기의 시작인가?</li>\n</ul>\n", "plain_len": 159, "type": "archive", "rawIndex": 2}, {"title": "Page 03 · Terms", "body_md": "| 단어 | 쉬운 뜻 | 이 호에서의 쓰임 |\n|---|---|---|\n| 인구감소지역 | 인구가 줄어 정부가 특별히 살피는 지역 | 영월의 행정적 조건 |\n| 생활인구 | 주소지는 없지만 자주 오가며 지역을 쓰는 사람 | 관광과 체류를 읽는 기준 |\n| 문화도시 | 지역의 문화 자원으로 도시를 바꾸려는 제도 | 영월의 장기 실험 |\n| 장소 기억 | 어떤 장소에 쌓인 개인·공동체의 기억 | 청령포와 장릉을 읽는 핵심 |", "body_html": "<table>\n<thead>\n<tr>\n  <th>단어</th>\n  <th>쉬운 뜻</th>\n  <th>이 호에서의 쓰임</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>인구감소지역</td>\n  <td>인구가 줄어 정부가 특별히 살피는 지역</td>\n  <td>영월의 행정적 조건</td>\n</tr>\n<tr>\n  <td>생활인구</td>\n  <td>주소지는 없지만 자주 오가며 지역을 쓰는 사람</td>\n  <td>관광과 체류를 읽는 기준</td>\n</tr>\n<tr>\n  <td>문화도시</td>\n  <td>지역의 문화 자원으로 도시를 바꾸려는 제도</td>\n  <td>영월의 장기 실험</td>\n</tr>\n<tr>\n  <td>장소 기억</td>\n  <td>어떤 장소에 쌓인 개인·공동체의 기억</td>\n  <td>청령포와 장릉을 읽는 핵심</td>\n</tr>\n</tbody>\n</table>\n", "plain_len": 183, "type": "diagram", "rawIndex": 3}, {"title": "Page 04 · Next", "body_md": "내일은 어린이날이다.\n\n이상하게도 이 날짜에 단종의 이야기를 읽는 일은 더 조심스러워진다. 단종은 왕이었지만, 동시에 너무 어린 사람이었다. 영월의 기억은 왕의 기억이기 전에, 너무 일찍 삶이 끊긴 한 사람의 기억이다.\n\n그 기억은 어떻게 오늘의 여행지가 되었을까.\n\n---", "body_html": "<p>내일은 어린이날이다.</p>\n<p>이상하게도 이 날짜에 단종의 이야기를 읽는 일은 더 조심스러워진다. 단종은 왕이었지만, 동시에 너무 어린 사람이었다. 영월의 기억은 왕의 기억이기 전에, 너무 일찍 삶이 끊긴 한 사람의 기억이다.</p>\n<p>그 기억은 어떻게 오늘의 여행지가 되었을까.</p>\n<hr />\n", "plain_len": 146, "type": "essay", "rawIndex": 4}], "totalPages": 4}]}, {"date": "2026-05-05", "weekday": "화", "weekdayFull": "화요일", "no": "002", "titleLine": "2026-05-05 화요일 · No.002", "theme": "기억의 도시는 어떻게 여행지가 되는가", "note_html": "<aside class=\"note-card\"><strong>화요일의 역할</strong><p>화요일은 단종의 기억을 다룬다.<br />\n어제의 숫자를 오늘의 감정으로 옮긴다.<br />\n핵심은 “슬픈 역사를 어떻게 소비하지 않고 읽을 것인가”다.</p>\n</aside>\n\n", "sections": [{"num": "01", "key": "Intro", "label": "Intro", "ko": "입구", "title": "어린 왕의 도시를 어린이날에 읽는 일", "short": "IN", "pages": [{"title": "Page 01 · Cover", "body_md": "5월 5일에 단종을 생각하는 일은 묘하게 불편하다.\n\n어린이날이라는 이름은 밝다. 놀이공원, 선물, 쉬는 날, 가족 여행 같은 말이 먼저 떠오른다. 그런데 영월의 단종 이야기는 밝은 이름과 잘 맞지 않는다. 단종은 왕으로 기억되지만, 그의 생은 너무 짧았다. 12세에 왕위에 올랐고, 17세에 죽임을 당했다.\n\n나는 이 간격 앞에서 자꾸 멈춘다.\n\n우리는 단종을 “비운의 왕”이라고 부르지만, 그 말은 때때로 너무 정돈되어 있다. 그 안에는 어린 사람이 느꼈을 무서움, 외로움, 억울함이 다 들어가지 않는다.", "body_html": "<p>5월 5일에 단종을 생각하는 일은 묘하게 불편하다.</p>\n<p>어린이날이라는 이름은 밝다. 놀이공원, 선물, 쉬는 날, 가족 여행 같은 말이 먼저 떠오른다. 그런데 영월의 단종 이야기는 밝은 이름과 잘 맞지 않는다. 단종은 왕으로 기억되지만, 그의 생은 너무 짧았다. 12세에 왕위에 올랐고, 17세에 죽임을 당했다.</p>\n<p>나는 이 간격 앞에서 자꾸 멈춘다.</p>\n<p>우리는 단종을 “비운의 왕”이라고 부르지만, 그 말은 때때로 너무 정돈되어 있다. 그 안에는 어린 사람이 느꼈을 무서움, 외로움, 억울함이 다 들어가지 않는다.</p>\n", "plain_len": 281, "type": "cover", "rawIndex": 1}, {"title": "Page 02 · Scene", "body_md": "청령포를 여행지로만 보면 아름답다. 강물이 둘러싸고, 소나무가 있고, 배를 타고 들어가는 절차가 있다. 여행자의 입장에서는 특별하다. 그런데 같은 구조를 단종의 입장에서 보면 전혀 다르다.\n\n배를 타야만 들어갈 수 있는 곳은, 배를 타야만 나올 수 있는 곳이기도 하다. 여행자에게는 낭만이지만 유배된 사람에게는 통제다.\n\n이 차이를 몸으로 한 번 느끼면, 청령포의 풍경은 갑자기 조용해진다.\n\n좋은 역사 여행은 바로 이 순간을 만들어야 한다. 예쁜 풍경을 보여주는 데서 끝나지 않고, 그 풍경이 누군가에게는 어떤 삶의 조건이었는지 느끼게 해야 한다.", "body_html": "<p>청령포를 여행지로만 보면 아름답다. 강물이 둘러싸고, 소나무가 있고, 배를 타고 들어가는 절차가 있다. 여행자의 입장에서는 특별하다. 그런데 같은 구조를 단종의 입장에서 보면 전혀 다르다.</p>\n<p>배를 타야만 들어갈 수 있는 곳은, 배를 타야만 나올 수 있는 곳이기도 하다. 여행자에게는 낭만이지만 유배된 사람에게는 통제다.</p>\n<p>이 차이를 몸으로 한 번 느끼면, 청령포의 풍경은 갑자기 조용해진다.</p>\n<p>좋은 역사 여행은 바로 이 순간을 만들어야 한다. 예쁜 풍경을 보여주는 데서 끝나지 않고, 그 풍경이 누군가에게는 어떤 삶의 조건이었는지 느끼게 해야 한다.</p>\n", "plain_len": 304, "type": "essay", "rawIndex": 2}, {"title": "Page 03 · Question", "body_md": "화요일의 질문은 이것이다.\n\n- 우리는 슬픈 역사를 어떻게 여행하는가?\n- 단종의 이야기는 관광 자원이 되면서 무엇을 얻고 무엇을 잃는가?\n- 방문객의 감정은 지역에 어떤 힘이 될 수 있는가?\n- 애도와 소비는 어떻게 구분되는가?\n\n이 질문은 영월만의 문제가 아니다. 많은 지방도시는 오래된 기억을 관광 자원으로 삼는다. 문제는 그 기억을 얼마나 두껍게 다루느냐다.\n\n역사는 팔 수 있다. 하지만 팔리는 순간 얇아질 수도 있다.", "body_html": "<p>화요일의 질문은 이것이다.</p>\n<ul>\n<li>우리는 슬픈 역사를 어떻게 여행하는가?</li>\n<li>단종의 이야기는 관광 자원이 되면서 무엇을 얻고 무엇을 잃는가?</li>\n<li>방문객의 감정은 지역에 어떤 힘이 될 수 있는가?</li>\n<li>애도와 소비는 어떻게 구분되는가?</li>\n</ul>\n<p>이 질문은 영월만의 문제가 아니다. 많은 지방도시는 오래된 기억을 관광 자원으로 삼는다. 문제는 그 기억을 얼마나 두껍게 다루느냐다.</p>\n<p>역사는 팔 수 있다. 하지만 팔리는 순간 얇아질 수도 있다.</p>\n", "plain_len": 228, "type": "list", "rawIndex": 3}, {"title": "Page 04 · Bridge", "body_md": "영월의 단종 기억은 한 장소에만 있지 않다.\n\n청령포, 장릉, 관풍헌, 단종문화제, 엄흥도의 이야기, 단종 어진, 그리고 사람들이 뒤늦게 붙인 애도의 언어가 함께 얽혀 있다. 이 기억의 묶음은 관광지가 아니라 도시의 감정 구조다.\n\n이제 쟁점으로 들어간다.\n\n기억의 도시는 어떻게 과거를 현재의 발걸음으로 바꾸는가.", "body_html": "<p>영월의 단종 기억은 한 장소에만 있지 않다.</p>\n<p>청령포, 장릉, 관풍헌, 단종문화제, 엄흥도의 이야기, 단종 어진, 그리고 사람들이 뒤늦게 붙인 애도의 언어가 함께 얽혀 있다. 이 기억의 묶음은 관광지가 아니라 도시의 감정 구조다.</p>\n<p>이제 쟁점으로 들어간다.</p>\n<p>기억의 도시는 어떻게 과거를 현재의 발걸음으로 바꾸는가.</p>\n", "plain_len": 173, "type": "essay", "rawIndex": 4}], "totalPages": 4}, {"num": "02", "key": "Issue", "label": "Issue", "ko": "쟁점", "title": "유배의 장소가 여행지가 될 때", "short": "IS", "pages": [{"title": "Page 01 · Cover", "body_md": "유배지는 원래 관광지가 아니었다.\n\n그곳은 누군가의 이동이 멈춘 자리였다. 권력이 한 사람을 멀리 보내고, 말과 관계와 미래를 끊어낸 장소였다. 시간이 지나면서 그 장소는 유적이 되고, 유적은 여행지가 된다.\n\n여기에는 늘 긴장이 있다.\n\n우리는 슬픈 장소를 찾아가면서도 사진을 찍고, 입장권을 사고, 밥을 먹고, 기념품을 본다. 이 행동들이 모두 틀린 것은 아니다. 다만 그 안에서 무엇을 기억하고 무엇을 잊는지가 중요하다.", "body_html": "<p>유배지는 원래 관광지가 아니었다.</p>\n<p>그곳은 누군가의 이동이 멈춘 자리였다. 권력이 한 사람을 멀리 보내고, 말과 관계와 미래를 끊어낸 장소였다. 시간이 지나면서 그 장소는 유적이 되고, 유적은 여행지가 된다.</p>\n<p>여기에는 늘 긴장이 있다.</p>\n<p>우리는 슬픈 장소를 찾아가면서도 사진을 찍고, 입장권을 사고, 밥을 먹고, 기념품을 본다. 이 행동들이 모두 틀린 것은 아니다. 다만 그 안에서 무엇을 기억하고 무엇을 잊는지가 중요하다.</p>\n", "plain_len": 235, "type": "cover", "rawIndex": 1}, {"title": "Page 02 · History Layer", "body_md": "연합뉴스 보도는 단종의 생애를 짧게 정리한다. 1452년 12세에 왕위에 올랐고, 1455년 상왕으로 물러났으며, 1457년 영월 청령포로 유배되었다. 그리고 같은 해 영월 관풍헌에서 17세의 나이로 죽임을 당했다. 사후에는 1698년 숙종 때 복위되었다.\n\n이 숫자들은 짧지만 무겁다. 12세, 17세, 1698년.\n\n어린 나이와 긴 복권의 시간이 나란히 놓인다. 죽음은 너무 빨랐고, 회복은 너무 늦었다. 장릉의 감정은 여기에서 나온다. 단순히 왕의 무덤이 아니라, 늦게 되돌려진 이름의 자리다.\n\n> [!note] 자료 기준\n> 단종 생애와 장릉 관련 기본 정보는 2026년 3월 8일 연합뉴스 보도와 영월군 문화관광 자료를 바탕으로 정리했다. 자료 ID: R-05, R-07.", "body_html": "<p>연합뉴스 보도는 단종의 생애를 짧게 정리한다. 1452년 12세에 왕위에 올랐고, 1455년 상왕으로 물러났으며, 1457년 영월 청령포로 유배되었다. 그리고 같은 해 영월 관풍헌에서 17세의 나이로 죽임을 당했다. 사후에는 1698년 숙종 때 복위되었다.</p>\n<p>이 숫자들은 짧지만 무겁다. 12세, 17세, 1698년.</p>\n<p>어린 나이와 긴 복권의 시간이 나란히 놓인다. 죽음은 너무 빨랐고, 회복은 너무 늦었다. 장릉의 감정은 여기에서 나온다. 단순히 왕의 무덤이 아니라, 늦게 되돌려진 이름의 자리다.</p>\n<aside class=\"note-card\"><strong>자료 기준</strong><p>단종 생애와 장릉 관련 기본 정보는 2026년 3월 8일 연합뉴스 보도와 영월군 문화관광 자료를 바탕으로 정리했다. 자료 ID: R-05, R-07.</p>\n</aside>\n\n", "plain_len": 373, "type": "essay", "rawIndex": 2}, {"title": "Page 03 · Festival Layer", "body_md": "영월의 단종 기억은 유적에만 머물지 않는다. 단종문화제는 이 기억을 매년 축제로 되살린다. 2026년 제59회 단종문화제는 4월 24일부터 26일까지 장릉, 관풍헌, 동강둔치, 청령포 일원에서 열렸다.\n\n축제는 기억을 현재로 끌어오는 방식이다. 단종국장, 단종제향, 칡줄다리기 같은 행사는 단순한 공연이 아니다. 오래된 애도와 공동체 의례를 오늘의 시간 안에 다시 세우는 일이다.\n\n하지만 축제도 조심해야 한다. 의례가 관광 프로그램이 되는 순간, 기억은 살아날 수도 있고 얇아질 수도 있다. 그래서 축제의 성패는 사람이 얼마나 많이 왔는지보다, 그 사람들이 무엇을 느끼고 돌아갔는지에 달려 있다.", "body_html": "<p>영월의 단종 기억은 유적에만 머물지 않는다. 단종문화제는 이 기억을 매년 축제로 되살린다. 2026년 제59회 단종문화제는 4월 24일부터 26일까지 장릉, 관풍헌, 동강둔치, 청령포 일원에서 열렸다.</p>\n<p>축제는 기억을 현재로 끌어오는 방식이다. 단종국장, 단종제향, 칡줄다리기 같은 행사는 단순한 공연이 아니다. 오래된 애도와 공동체 의례를 오늘의 시간 안에 다시 세우는 일이다.</p>\n<p>하지만 축제도 조심해야 한다. 의례가 관광 프로그램이 되는 순간, 기억은 살아날 수도 있고 얇아질 수도 있다. 그래서 축제의 성패는 사람이 얼마나 많이 왔는지보다, 그 사람들이 무엇을 느끼고 돌아갔는지에 달려 있다.</p>\n", "plain_len": 332, "type": "essay", "rawIndex": 3}, {"title": "Page 04 · Emotional Economy", "body_md": "영월의 단종 관광은 감정의 경제다.\n\n여기서 경제라는 말은 돈만 뜻하지 않는다. 사람들이 어떤 감정을 가지고 들어와서, 어떤 감정으로 나가는지까지 포함한다. 영화는 감정을 열었고, 청령포와 장릉은 그 감정을 실제 장소에 붙였다.\n\n이때 지역이 해야 할 일은 감정을 과하게 팔지 않는 것이다. 슬픔을 너무 쉽게 상품화하면, 방문객은 잠깐 울고 떠난다. 반대로 감정을 너무 건조하게 다루면, 장소는 교과서의 한 줄로 돌아간다.\n\n좋은 기억의 도시는 그 중간을 잡아야 한다. 설명은 정확하게, 장면은 조용하게, 감정은 독자가 직접 도착하게.", "body_html": "<p>영월의 단종 관광은 감정의 경제다.</p>\n<p>여기서 경제라는 말은 돈만 뜻하지 않는다. 사람들이 어떤 감정을 가지고 들어와서, 어떤 감정으로 나가는지까지 포함한다. 영화는 감정을 열었고, 청령포와 장릉은 그 감정을 실제 장소에 붙였다.</p>\n<p>이때 지역이 해야 할 일은 감정을 과하게 팔지 않는 것이다. 슬픔을 너무 쉽게 상품화하면, 방문객은 잠깐 울고 떠난다. 반대로 감정을 너무 건조하게 다루면, 장소는 교과서의 한 줄로 돌아간다.</p>\n<p>좋은 기억의 도시는 그 중간을 잡아야 한다. 설명은 정확하게, 장면은 조용하게, 감정은 독자가 직접 도착하게.</p>\n", "plain_len": 296, "type": "essay", "rawIndex": 4}, {"title": "Page 05 · Issue Summary", "body_md": "```text\n유배지\n→ 단절의 장소\n\n유적지\n→ 기억을 보존하는 장소\n\n관광지\n→ 사람들이 다시 찾아오는 장소\n\n축제\n→ 기억을 현재의 몸짓으로 옮기는 장치\n\n도시\n→ 이 모든 층이 겹치는 공간\n```\n\n영월의 단종 기억은 이 다섯 층을 모두 갖고 있다. 그래서 단순한 역사 관광으로는 부족하다.", "body_html": "<pre><code class=\"language-text\">유배지\n→ 단절의 장소\n\n유적지\n→ 기억을 보존하는 장소\n\n관광지\n→ 사람들이 다시 찾아오는 장소\n\n축제\n→ 기억을 현재의 몸짓으로 옮기는 장치\n\n도시\n→ 이 모든 층이 겹치는 공간\n</code></pre>\n<p>영월의 단종 기억은 이 다섯 층을 모두 갖고 있다. 그래서 단순한 역사 관광으로는 부족하다.</p>\n", "plain_len": 51, "type": "archive", "rawIndex": 5}, {"title": "Page 06 · Bridge", "body_md": "이제 해석으로 넘어가야 한다.\n\n영월의 단종 기억을 볼 때 중요한 것은 “슬프다”는 감정 그 자체가 아니다. 중요한 것은 그 슬픔이 오늘의 사람들에게 어떤 질문을 남기는가다.\n\n우리는 왜 오래전 한 사람의 고립을 지금 다시 찾아가는가.", "body_html": "<p>이제 해석으로 넘어가야 한다.</p>\n<p>영월의 단종 기억을 볼 때 중요한 것은 “슬프다”는 감정 그 자체가 아니다. 중요한 것은 그 슬픔이 오늘의 사람들에게 어떤 질문을 남기는가다.</p>\n<p>우리는 왜 오래전 한 사람의 고립을 지금 다시 찾아가는가.</p>\n", "plain_len": 129, "type": "essay", "rawIndex": 6}], "totalPages": 6}, {"num": "03", "key": "Insight", "label": "Insight", "ko": "해석", "title": "애도는 관광이 될 수 있는가", "short": "SG", "pages": [{"title": "Page 01 · Concept", "body_md": "애도와 관광은 서로 어울리지 않는 단어처럼 보인다.\n\n애도는 조용하고, 관광은 움직인다. 애도는 머무르고, 관광은 소비한다. 애도는 한 사람의 죽음 앞에서 말을 줄이는 일이고, 관광은 많은 사람을 불러 모으는 일이다.\n\n하지만 실제 장소에서는 이 둘이 자주 만난다. 전쟁터, 왕릉, 유배지, 오래된 참사의 현장, 사라진 마을. 사람들은 슬픈 장소를 찾아간다. 그곳에서 사진도 찍고, 설명도 읽고, 때로는 밥도 먹는다.\n\n문제는 찾아가는 것 자체가 아니다.\n\n문제는 어떤 태도로 찾아가는가다.", "body_html": "<p>애도와 관광은 서로 어울리지 않는 단어처럼 보인다.</p>\n<p>애도는 조용하고, 관광은 움직인다. 애도는 머무르고, 관광은 소비한다. 애도는 한 사람의 죽음 앞에서 말을 줄이는 일이고, 관광은 많은 사람을 불러 모으는 일이다.</p>\n<p>하지만 실제 장소에서는 이 둘이 자주 만난다. 전쟁터, 왕릉, 유배지, 오래된 참사의 현장, 사라진 마을. 사람들은 슬픈 장소를 찾아간다. 그곳에서 사진도 찍고, 설명도 읽고, 때로는 밥도 먹는다.</p>\n<p>문제는 찾아가는 것 자체가 아니다.</p>\n<p>문제는 어떤 태도로 찾아가는가다.</p>\n", "plain_len": 270, "type": "essay", "rawIndex": 1}, {"title": "Page 02 · Thin Memory vs Thick Memory", "body_md": "얇은 기억은 이야기를 한 문장으로 줄인다.\n\n“어린 왕이 억울하게 죽은 곳.”\n\n이 문장은 틀리지 않지만 충분하지 않다. 충분하지 않은 문장은 사람을 울릴 수는 있어도 오래 생각하게 하지는 못한다.\n\n두꺼운 기억은 질문을 남긴다.\n\n- 그는 왜 그렇게 고립되었는가?\n- 그를 둘러싼 사람들은 무엇을 선택했는가?\n- 권력은 사람의 이동을 어떻게 막는가?\n- 늦은 복권은 무엇을 회복하고 무엇을 회복하지 못하는가?\n- 오늘 우리는 이 장소를 보며 어떤 책임을 느끼는가?\n\n영월이 기억의 도시로 오래 남으려면 얇은 기억을 두꺼운 질문으로 바꿔야 한다.", "body_html": "<p>얇은 기억은 이야기를 한 문장으로 줄인다.</p>\n<p>“어린 왕이 억울하게 죽은 곳.”</p>\n<p>이 문장은 틀리지 않지만 충분하지 않다. 충분하지 않은 문장은 사람을 울릴 수는 있어도 오래 생각하게 하지는 못한다.</p>\n<p>두꺼운 기억은 질문을 남긴다.</p>\n<ul>\n<li>그는 왜 그렇게 고립되었는가?</li>\n<li>그를 둘러싼 사람들은 무엇을 선택했는가?</li>\n<li>권력은 사람의 이동을 어떻게 막는가?</li>\n<li>늦은 복권은 무엇을 회복하고 무엇을 회복하지 못하는가?</li>\n<li>오늘 우리는 이 장소를 보며 어떤 책임을 느끼는가?</li>\n</ul>\n<p>영월이 기억의 도시로 오래 남으려면 얇은 기억을 두꺼운 질문으로 바꿔야 한다.</p>\n", "plain_len": 290, "type": "list", "rawIndex": 2}, {"title": "Page 03 · My Standard", "body_md": "나는 역사 장소를 볼 때 “설명문이 얼마나 많은가”보다 “침묵할 자리가 있는가”를 먼저 본다.\n\n모든 장소가 체험형 콘텐츠가 될 필요는 없다. 모든 장소가 포토존이 될 필요도 없다. 어떤 장소는 사람들이 말없이 서 있을 수 있게 해줘야 한다. 청령포와 장릉은 특히 그렇다.\n\n영화 이후 사람이 몰린다고 해서 그 장소를 더 시끄럽게 만들어야 하는 것은 아니다. 오히려 더 조용히 읽히게 하는 장치가 필요할 수 있다. 이동 동선은 분명하게, 설명은 정확하게, 감정은 과장하지 않게.\n\n나는 이것이 기억의 도시가 지켜야 할 최소한의 품위라고 생각한다.", "body_html": "<p>나는 역사 장소를 볼 때 “설명문이 얼마나 많은가”보다 “침묵할 자리가 있는가”를 먼저 본다.</p>\n<p>모든 장소가 체험형 콘텐츠가 될 필요는 없다. 모든 장소가 포토존이 될 필요도 없다. 어떤 장소는 사람들이 말없이 서 있을 수 있게 해줘야 한다. 청령포와 장릉은 특히 그렇다.</p>\n<p>영화 이후 사람이 몰린다고 해서 그 장소를 더 시끄럽게 만들어야 하는 것은 아니다. 오히려 더 조용히 읽히게 하는 장치가 필요할 수 있다. 이동 동선은 분명하게, 설명은 정확하게, 감정은 과장하지 않게.</p>\n<p>나는 이것이 기억의 도시가 지켜야 할 최소한의 품위라고 생각한다.</p>\n", "plain_len": 302, "type": "essay", "rawIndex": 3}, {"title": "Page 04 · For Children’s Day", "body_md": "5월 5일에 이 글을 놓는 이유는 단순히 날짜가 맞아서가 아니다.\n\n어린이날의 밝은 감정과 단종의 짧은 생은 서로 어긋난다. 그 어긋남이 오히려 질문을 만든다. 우리는 역사 속 어린 사람을 왕이라는 이름으로만 기억하고 있지는 않은가. 권력의 이야기 안에서 그의 나이를 너무 쉽게 지우고 있지는 않은가.\n\n영월의 단종 기억은 왕조사의 한 장면이지만, 동시에 너무 일찍 어른의 폭력 속으로 밀려 들어간 한 사람의 이야기다.\n\n이렇게 읽을 때 청령포는 조금 다르게 보인다.", "body_html": "<p>5월 5일에 이 글을 놓는 이유는 단순히 날짜가 맞아서가 아니다.</p>\n<p>어린이날의 밝은 감정과 단종의 짧은 생은 서로 어긋난다. 그 어긋남이 오히려 질문을 만든다. 우리는 역사 속 어린 사람을 왕이라는 이름으로만 기억하고 있지는 않은가. 권력의 이야기 안에서 그의 나이를 너무 쉽게 지우고 있지는 않은가.</p>\n<p>영월의 단종 기억은 왕조사의 한 장면이지만, 동시에 너무 일찍 어른의 폭력 속으로 밀려 들어간 한 사람의 이야기다.</p>\n<p>이렇게 읽을 때 청령포는 조금 다르게 보인다.</p>\n", "plain_len": 258, "type": "essay", "rawIndex": 4}, {"title": "Page 05 · Bridge", "body_md": "다음은 사례다.\n\n청령포와 장릉은 이미 월요일에도 다루었다. 오늘은 조금 더 천천히 본다. 장소를 관광 코스로만 보지 않고, 감정의 흐름으로 읽어본다.\n\n어디서 고립이 시작되고, 어디서 이름이 돌아오는가.", "body_html": "<p>다음은 사례다.</p>\n<p>청령포와 장릉은 이미 월요일에도 다루었다. 오늘은 조금 더 천천히 본다. 장소를 관광 코스로만 보지 않고, 감정의 흐름으로 읽어본다.</p>\n<p>어디서 고립이 시작되고, 어디서 이름이 돌아오는가.</p>\n", "plain_len": 112, "type": "essay", "rawIndex": 5}], "totalPages": 5}, {"num": "04", "key": "Case", "label": "Case", "ko": "사례", "title": "청령포에서 장릉까지, 감정의 동선", "short": "CA", "pages": [{"title": "Page 01 · Step 1: 배를 기다리는 시간", "body_md": "청령포의 첫 경험은 배를 기다리는 시간이다.\n\n이 대기 시간은 귀찮은 절차가 아니라 장소의 일부다. 배를 타야 들어갈 수 있다는 사실은 청령포의 감정을 만든다. 여행자는 잠깐 기다릴 뿐이지만, 그 기다림 속에서 이곳이 왜 유배지였는지 몸으로 이해하게 된다.\n\n좋은 동선은 이런 감각을 설명보다 먼저 느끼게 한다. “삼면이 강으로 둘러싸였다”는 문장을 읽기 전에, 실제로 강 앞에서 멈추게 하는 것. 이것이 장소가 가진 교육의 방식이다.", "body_html": "<p>청령포의 첫 경험은 배를 기다리는 시간이다.</p>\n<p>이 대기 시간은 귀찮은 절차가 아니라 장소의 일부다. 배를 타야 들어갈 수 있다는 사실은 청령포의 감정을 만든다. 여행자는 잠깐 기다릴 뿐이지만, 그 기다림 속에서 이곳이 왜 유배지였는지 몸으로 이해하게 된다.</p>\n<p>좋은 동선은 이런 감각을 설명보다 먼저 느끼게 한다. “삼면이 강으로 둘러싸였다”는 문장을 읽기 전에, 실제로 강 앞에서 멈추게 하는 것. 이것이 장소가 가진 교육의 방식이다.</p>\n", "plain_len": 241, "type": "essay", "rawIndex": 1}, {"title": "Page 02 · Step 2: 단종어소와 소나무", "body_md": "청령포 안으로 들어가면 단종어소와 소나무의 이미지가 남는다. 특히 엄흥도 소나무와 관음송 같은 이야기는 장소를 더 깊게 만든다. 나무는 말하지 않지만, 사람들은 나무에 의미를 붙인다. 그 의미가 오래 살아남으면 나무는 단순한 자연물이 아니라 기억의 매개가 된다.\n\n여기서 중요한 것은 과장하지 않는 것이다.\n\n나무가 모든 것을 증명하는 것은 아니다. 하지만 사람들은 어떤 장소에서 말 못 하는 것들을 자연물에 맡긴다. 청령포의 소나무들은 그런 방식으로 기억을 붙잡는다.", "body_html": "<p>청령포 안으로 들어가면 단종어소와 소나무의 이미지가 남는다. 특히 엄흥도 소나무와 관음송 같은 이야기는 장소를 더 깊게 만든다. 나무는 말하지 않지만, 사람들은 나무에 의미를 붙인다. 그 의미가 오래 살아남으면 나무는 단순한 자연물이 아니라 기억의 매개가 된다.</p>\n<p>여기서 중요한 것은 과장하지 않는 것이다.</p>\n<p>나무가 모든 것을 증명하는 것은 아니다. 하지만 사람들은 어떤 장소에서 말 못 하는 것들을 자연물에 맡긴다. 청령포의 소나무들은 그런 방식으로 기억을 붙잡는다.</p>\n", "plain_len": 260, "type": "essay", "rawIndex": 2}, {"title": "Page 03 · Step 3: 장릉으로 이동", "body_md": "청령포에서 장릉으로 이동하면 감정의 무게가 달라진다.\n\n청령포가 갇힌 현재라면, 장릉은 뒤늦게 정리된 과거다. 청령포에서는 단종의 생이 멈춰 있는 것처럼 느껴지고, 장릉에서는 그 생을 사람들이 뒤늦게 어떻게 이름 붙였는지가 보인다.\n\n이 동선은 강하다. 유배지에서 무덤으로 가는 길이기 때문이다. 하지만 너무 극적으로 연출하면 오히려 가벼워진다. 이 길은 영화 예고편처럼 보여줄 길이 아니라, 천천히 걸어야 하는 길이다.", "body_html": "<p>청령포에서 장릉으로 이동하면 감정의 무게가 달라진다.</p>\n<p>청령포가 갇힌 현재라면, 장릉은 뒤늦게 정리된 과거다. 청령포에서는 단종의 생이 멈춰 있는 것처럼 느껴지고, 장릉에서는 그 생을 사람들이 뒤늦게 어떻게 이름 붙였는지가 보인다.</p>\n<p>이 동선은 강하다. 유배지에서 무덤으로 가는 길이기 때문이다. 하지만 너무 극적으로 연출하면 오히려 가벼워진다. 이 길은 영화 예고편처럼 보여줄 길이 아니라, 천천히 걸어야 하는 길이다.</p>\n", "plain_len": 233, "type": "essay", "rawIndex": 3}, {"title": "Page 04 · Step 4: 단종문화제", "body_md": "단종문화제는 이 감정을 공동체의 시간으로 옮긴다.\n\n혼자 조용히 유적을 보는 것과, 지역 사람들이 함께 의례와 축제를 만드는 것은 다르다. 축제는 한 도시가 자기 기억을 버리지 않았다는 표시다. 물론 축제는 관광객을 부른다. 하지만 그보다 먼저, 지역이 자기 기억을 해마다 다시 꺼내는 방식이다.\n\n영월이 단종문화제를 오래 이어온 것은 그래서 중요하다. 영화가 오기 전에도 기억은 있었다. 영화는 그 기억을 새로 만든 것이 아니라, 바깥 사람들이 다시 보게 만든 것이다.", "body_html": "<p>단종문화제는 이 감정을 공동체의 시간으로 옮긴다.</p>\n<p>혼자 조용히 유적을 보는 것과, 지역 사람들이 함께 의례와 축제를 만드는 것은 다르다. 축제는 한 도시가 자기 기억을 버리지 않았다는 표시다. 물론 축제는 관광객을 부른다. 하지만 그보다 먼저, 지역이 자기 기억을 해마다 다시 꺼내는 방식이다.</p>\n<p>영월이 단종문화제를 오래 이어온 것은 그래서 중요하다. 영화가 오기 전에도 기억은 있었다. 영화는 그 기억을 새로 만든 것이 아니라, 바깥 사람들이 다시 보게 만든 것이다.</p>\n", "plain_len": 261, "type": "essay", "rawIndex": 4}, {"title": "Page 05 · Case Insight", "body_md": "청령포와 장릉과 단종문화제는 하나의 감정 동선이다.\n\n```text\n고립\n→ 죽음\n→ 늦은 회복\n→ 공동체의 의례\n→ 오늘의 방문\n```\n\n이 동선을 제대로 설계하면 영월은 단순한 촬영지가 아니다. 기억을 배우는 도시가 된다.", "body_html": "<p>청령포와 장릉과 단종문화제는 하나의 감정 동선이다.</p>\n<pre><code class=\"language-text\">고립\n→ 죽음\n→ 늦은 회복\n→ 공동체의 의례\n→ 오늘의 방문\n</code></pre>\n<p>이 동선을 제대로 설계하면 영월은 단순한 촬영지가 아니다. 기억을 배우는 도시가 된다.</p>\n", "plain_len": 77, "type": "diagram", "rawIndex": 5}], "totalPages": 5}, {"num": "05", "key": "Archive", "label": "Archive", "ko": "기록", "title": "기억을 소비하지 않기 위한 질문", "short": "AR", "pages": [{"title": "Page 01 · Three Sentences", "body_md": "오늘의 핵심은 세 문장이다.\n\n1. 청령포는 아름다운 풍경이기 전에 고립의 지형이다.\n2. 장릉은 왕릉이기 전에 늦게 회복된 이름의 자리다.\n3. 영월의 단종 기억은 관광 자원이지만, 동시에 조심스럽게 다뤄야 할 애도의 자산이다.", "body_html": "<p>오늘의 핵심은 세 문장이다.</p>\n<ol>\n<li>청령포는 아름다운 풍경이기 전에 고립의 지형이다.</li>\n<li>장릉은 왕릉이기 전에 늦게 회복된 이름의 자리다.</li>\n<li>영월의 단종 기억은 관광 자원이지만, 동시에 조심스럽게 다뤄야 할 애도의 자산이다.</li>\n</ol>\n", "plain_len": 127, "type": "list", "rawIndex": 1}, {"title": "Page 02 · Questions", "body_md": "오늘 읽고 남길 질문:\n\n- 나는 슬픈 역사 장소를 어떻게 여행해 왔는가?\n- 사진을 찍기 전에 잠깐 멈춘 적이 있는가?\n- 축제는 기억을 살리는가, 아니면 기억을 가볍게 만드는가?\n- 지역은 방문객에게 무엇을 설명해야 하고, 무엇은 침묵으로 남겨야 하는가?", "body_html": "<p>오늘 읽고 남길 질문:</p>\n<ul>\n<li>나는 슬픈 역사 장소를 어떻게 여행해 왔는가?</li>\n<li>사진을 찍기 전에 잠깐 멈춘 적이 있는가?</li>\n<li>축제는 기억을 살리는가, 아니면 기억을 가볍게 만드는가?</li>\n<li>지역은 방문객에게 무엇을 설명해야 하고, 무엇은 침묵으로 남겨야 하는가?</li>\n</ul>\n", "plain_len": 135, "type": "archive", "rawIndex": 2}, {"title": "Page 03 · Small Checklist", "body_md": "기억의 장소를 읽을 때 확인할 것:\n\n- 이 장소는 누구의 고통을 담고 있는가?\n- 그 고통은 지금 어떤 방식으로 설명되고 있는가?\n- 방문객의 동선은 장소의 감정을 존중하는가?\n- 지역 주민은 이 기억을 어떻게 이어가고 있는가?\n- 나는 이 장소를 보고 무엇을 소비했고, 무엇을 배웠는가?", "body_html": "<p>기억의 장소를 읽을 때 확인할 것:</p>\n<ul>\n<li>이 장소는 누구의 고통을 담고 있는가?</li>\n<li>그 고통은 지금 어떤 방식으로 설명되고 있는가?</li>\n<li>방문객의 동선은 장소의 감정을 존중하는가?</li>\n<li>지역 주민은 이 기억을 어떻게 이어가고 있는가?</li>\n<li>나는 이 장소를 보고 무엇을 소비했고, 무엇을 배웠는가?</li>\n</ul>\n", "plain_len": 151, "type": "list", "rawIndex": 3}, {"title": "Page 04 · Next", "body_md": "내일은 기억에서 지형으로 넘어간다.\n\n영월은 단종의 도시이지만, 단종만으로 다 읽히지 않는다. 강이 있고, 산이 있고, 밤하늘이 있다. 어떤 도시는 역사보다 먼저 지형으로 사람을 설득한다.\n\n영월의 지형은 어떤 문장을 쓰고 있을까.\n\n---", "body_html": "<p>내일은 기억에서 지형으로 넘어간다.</p>\n<p>영월은 단종의 도시이지만, 단종만으로 다 읽히지 않는다. 강이 있고, 산이 있고, 밤하늘이 있다. 어떤 도시는 역사보다 먼저 지형으로 사람을 설득한다.</p>\n<p>영월의 지형은 어떤 문장을 쓰고 있을까.</p>\n<hr />\n", "plain_len": 127, "type": "essay", "rawIndex": 4}], "totalPages": 4}]}, {"date": "2026-05-06", "weekday": "수", "weekdayFull": "수요일", "no": "003", "titleLine": "2026-05-06 수요일 · No.003", "theme": "강과 산은 도시의 문장을 어떻게 만든다", "note_html": "<aside class=\"note-card\"><strong>수요일의 역할</strong><p>수요일은 영월의 지형을 읽는다.<br />\n역사와 영화의 감정에서 벗어나, 도시의 물길과 능선, 전망과 밤하늘을 본다.<br />\n핵심은 “지형은 배경이 아니라 도시의 문법이다”라는 관점이다.</p>\n</aside>\n\n", "sections": [{"num": "01", "key": "Intro", "label": "Intro", "ko": "입구", "title": "지도는 숫자보다 먼저 말한다", "short": "IN", "pages": [{"title": "Page 01 · Cover", "body_md": "영월을 지도로 보면 먼저 강이 보인다.\n\n동강과 서강, 굽이치는 물길, 산 사이로 들어간 마을, 길게 휘어진 지형. 인구 표를 보기 전에는 알 수 없는 것들이 지도 위에서 먼저 보인다. 어떤 도시는 숫자로 시작하면 잘못 읽힌다. 지형을 먼저 봐야 하는 도시가 있다.\n\n영월이 그렇다.\n\n나는 영월을 생각할 때 청령포만큼이나 한반도지형을 떠올린다. 전망대에 올라 내려다보는 그 장면은 조금 이상하다. 우리가 아는 지도의 모양이 실제 땅 위에 나타난 것처럼 보인다. 설명보다 먼저 시각이 설득한다.", "body_html": "<p>영월을 지도로 보면 먼저 강이 보인다.</p>\n<p>동강과 서강, 굽이치는 물길, 산 사이로 들어간 마을, 길게 휘어진 지형. 인구 표를 보기 전에는 알 수 없는 것들이 지도 위에서 먼저 보인다. 어떤 도시는 숫자로 시작하면 잘못 읽힌다. 지형을 먼저 봐야 하는 도시가 있다.</p>\n<p>영월이 그렇다.</p>\n<p>나는 영월을 생각할 때 청령포만큼이나 한반도지형을 떠올린다. 전망대에 올라 내려다보는 그 장면은 조금 이상하다. 우리가 아는 지도의 모양이 실제 땅 위에 나타난 것처럼 보인다. 설명보다 먼저 시각이 설득한다.</p>\n", "plain_len": 273, "type": "cover", "rawIndex": 1}, {"title": "Page 02 · Scene", "body_md": "한반도지형 전망대에 오르는 길은 사진 한 장을 위한 길처럼 보일 수 있다. 하지만 그 길의 진짜 의미는 사진을 찍기 전의 숨에 있다.\n\n조금 올라가야 한다. 나무 사이를 지나야 한다. 시야가 열리기 전까지는 왜 이곳이 유명한지 완전히 알 수 없다. 그러다 갑자기 아래가 열린다. 강이 휘어져 있고, 땅이 한반도 모양으로 놓여 있다.\n\n좋은 장소는 대개 이런 식이다. 설명을 먼저 하지 않고, 몸을 조금 움직이게 한 뒤 장면을 준다.", "body_html": "<p>한반도지형 전망대에 오르는 길은 사진 한 장을 위한 길처럼 보일 수 있다. 하지만 그 길의 진짜 의미는 사진을 찍기 전의 숨에 있다.</p>\n<p>조금 올라가야 한다. 나무 사이를 지나야 한다. 시야가 열리기 전까지는 왜 이곳이 유명한지 완전히 알 수 없다. 그러다 갑자기 아래가 열린다. 강이 휘어져 있고, 땅이 한반도 모양으로 놓여 있다.</p>\n<p>좋은 장소는 대개 이런 식이다. 설명을 먼저 하지 않고, 몸을 조금 움직이게 한 뒤 장면을 준다.</p>\n", "plain_len": 239, "type": "essay", "rawIndex": 2}, {"title": "Page 03 · Question", "body_md": "수요일의 질문은 이것이다.\n\n- 강과 산은 도시의 성격을 어떻게 만드는가?\n- 지형은 관광의 배경인가, 아니면 도시를 읽는 첫 문장인가?\n- 한반도지형, 선돌, 어라연, 별마로천문대는 왜 서로 다른 감각을 만드는가?\n- 영월의 자연은 단순한 풍경인가, 아니면 체류를 만드는 힘인가?\n\n영월을 소멸위기도시로만 보면 이 질문들은 잘 안 보인다. 인구 감소는 지형을 설명하지 못한다. 지형은 도시가 줄어드는지 늘어나는지와 다른 시간으로 움직인다.", "body_html": "<p>수요일의 질문은 이것이다.</p>\n<ul>\n<li>강과 산은 도시의 성격을 어떻게 만드는가?</li>\n<li>지형은 관광의 배경인가, 아니면 도시를 읽는 첫 문장인가?</li>\n<li>한반도지형, 선돌, 어라연, 별마로천문대는 왜 서로 다른 감각을 만드는가?</li>\n<li>영월의 자연은 단순한 풍경인가, 아니면 체류를 만드는 힘인가?</li>\n</ul>\n<p>영월을 소멸위기도시로만 보면 이 질문들은 잘 안 보인다. 인구 감소는 지형을 설명하지 못한다. 지형은 도시가 줄어드는지 늘어나는지와 다른 시간으로 움직인다.</p>\n", "plain_len": 236, "type": "list", "rawIndex": 3}, {"title": "Page 04 · Bridge", "body_md": "영월10경 목록을 보면 흥미롭다.\n\n장릉과 청령포 같은 역사 장소가 있고, 별마로천문대와 한반도지형 같은 전망의 장소가 있고, 고씨굴과 선돌, 어라연 같은 지질과 물길의 장소가 있다. 영월은 하나의 테마로 정리하기 어렵다. 역사, 지형, 밤하늘, 동굴, 강이 서로 겹쳐 있다.\n\n이 겹을 잘 다루면 영월은 훨씬 넓어진다.\n\n이제 쟁점으로 들어간다.\n\n자연은 어떻게 관광 자산을 넘어 도시의 성격이 되는가.", "body_html": "<p>영월10경 목록을 보면 흥미롭다.</p>\n<p>장릉과 청령포 같은 역사 장소가 있고, 별마로천문대와 한반도지형 같은 전망의 장소가 있고, 고씨굴과 선돌, 어라연 같은 지질과 물길의 장소가 있다. 영월은 하나의 테마로 정리하기 어렵다. 역사, 지형, 밤하늘, 동굴, 강이 서로 겹쳐 있다.</p>\n<p>이 겹을 잘 다루면 영월은 훨씬 넓어진다.</p>\n<p>이제 쟁점으로 들어간다.</p>\n<p>자연은 어떻게 관광 자산을 넘어 도시의 성격이 되는가.</p>\n", "plain_len": 222, "type": "essay", "rawIndex": 4}], "totalPages": 4}, {"num": "02", "key": "Issue", "label": "Issue", "ko": "쟁점", "title": "자연은 배경이 아니라 체류의 장치다", "short": "IS", "pages": [{"title": "Page 01 · Cover", "body_md": "많은 지역 홍보물에서 자연은 배경처럼 쓰인다.\n\n“아름다운 자연”, “수려한 풍경”, “힐링 여행지” 같은 말들이 이어진다. 틀린 말은 아니다. 하지만 너무 많이 쓰여서 거의 아무 말도 하지 않는 말이 되었다.\n\n영월의 자연은 그렇게 부르기엔 아깝다.\n\n여기서 자연은 배경이 아니다. 강은 이동을 제한하고, 절벽은 고립을 만들고, 전망대는 시야를 바꾸고, 천문대는 낮의 도시를 밤의 도시로 바꾼다. 자연은 도시의 분위기가 아니라 도시의 작동 방식이다.", "body_html": "<p>많은 지역 홍보물에서 자연은 배경처럼 쓰인다.</p>\n<p>“아름다운 자연”, “수려한 풍경”, “힐링 여행지” 같은 말들이 이어진다. 틀린 말은 아니다. 하지만 너무 많이 쓰여서 거의 아무 말도 하지 않는 말이 되었다.</p>\n<p>영월의 자연은 그렇게 부르기엔 아깝다.</p>\n<p>여기서 자연은 배경이 아니다. 강은 이동을 제한하고, 절벽은 고립을 만들고, 전망대는 시야를 바꾸고, 천문대는 낮의 도시를 밤의 도시로 바꾼다. 자연은 도시의 분위기가 아니라 도시의 작동 방식이다.</p>\n", "plain_len": 249, "type": "cover", "rawIndex": 1}, {"title": "Page 02 · Official List", "body_md": "영월군 문화관광 자료는 영월10경을 다음처럼 소개한다.\n\n| 순서 | 장소 |\n|---:|---|\n| 1 | 장릉 |\n| 2 | 청령포 |\n| 3 | 별마로천문대 |\n| 4 | 김삿갓유적지 |\n| 5 | 고씨굴 |\n| 6 | 선돌 |\n| 7 | 어라연 |\n| 8 | 한반도지형 |\n| 9 | 법흥사 |\n| 10 | 요선암·요선정 |\n\n이 목록은 단순한 관광지 나열이 아니다. 영월이 어떤 도시인지 알려주는 작은 지도다. 왕릉과 유배지, 천문대와 동굴, 바위와 강, 사찰과 정자가 한 목록 안에 있다.\n\n> [!note] 자료 기준\n> 영월10경 목록은 영월군 문화관광 공식 자료를 기준으로 정리했다. 자료 ID: R-07, R-08.", "body_html": "<p>영월군 문화관광 자료는 영월10경을 다음처럼 소개한다.</p>\n<table>\n<thead>\n<tr>\n  <th style=\"text-align:right\">순서</th>\n  <th>장소</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td style=\"text-align:right\">1</td>\n  <td>장릉</td>\n</tr>\n<tr>\n  <td style=\"text-align:right\">2</td>\n  <td>청령포</td>\n</tr>\n<tr>\n  <td style=\"text-align:right\">3</td>\n  <td>별마로천문대</td>\n</tr>\n<tr>\n  <td style=\"text-align:right\">4</td>\n  <td>김삿갓유적지</td>\n</tr>\n<tr>\n  <td style=\"text-align:right\">5</td>\n  <td>고씨굴</td>\n</tr>\n<tr>\n  <td style=\"text-align:right\">6</td>\n  <td>선돌</td>\n</tr>\n<tr>\n  <td style=\"text-align:right\">7</td>\n  <td>어라연</td>\n</tr>\n<tr>\n  <td style=\"text-align:right\">8</td>\n  <td>한반도지형</td>\n</tr>\n<tr>\n  <td style=\"text-align:right\">9</td>\n  <td>법흥사</td>\n</tr>\n<tr>\n  <td style=\"text-align:right\">10</td>\n  <td>요선암·요선정</td>\n</tr>\n</tbody>\n</table>\n<p>이 목록은 단순한 관광지 나열이 아니다. 영월이 어떤 도시인지 알려주는 작은 지도다. 왕릉과 유배지, 천문대와 동굴, 바위와 강, 사찰과 정자가 한 목록 안에 있다.</p>\n<aside class=\"note-card\"><strong>자료 기준</strong><p>영월10경 목록은 영월군 문화관광 공식 자료를 기준으로 정리했다. 자료 ID: R-07, R-08.</p>\n</aside>\n\n", "plain_len": 268, "type": "diagram", "rawIndex": 2}, {"title": "Page 03 · The Problem of Passing Through", "body_md": "자연 관광의 약점은 통과형 여행이 되기 쉽다는 것이다.\n\n전망대에서 사진을 찍고, 다음 장소로 이동한다. 바위를 보고, 다시 차에 탄다. 동굴을 보고, 점심을 먹고 떠난다. 이렇게 되면 장소는 남지만 도시는 남지 않는다.\n\n영월의 과제는 자연을 “찍고 가는 장면”이 아니라 “머무는 시간”으로 바꾸는 것이다. 한반도지형을 보고 끝나는 것이 아니라, 그 지형을 만든 강의 흐름을 이해하고, 그 강이 청령포의 고립과 어떻게 이어지는지 느끼고, 밤에는 별마로천문대에서 전혀 다른 영월을 보는 식의 연결이 필요하다.", "body_html": "<p>자연 관광의 약점은 통과형 여행이 되기 쉽다는 것이다.</p>\n<p>전망대에서 사진을 찍고, 다음 장소로 이동한다. 바위를 보고, 다시 차에 탄다. 동굴을 보고, 점심을 먹고 떠난다. 이렇게 되면 장소는 남지만 도시는 남지 않는다.</p>\n<p>영월의 과제는 자연을 “찍고 가는 장면”이 아니라 “머무는 시간”으로 바꾸는 것이다. 한반도지형을 보고 끝나는 것이 아니라, 그 지형을 만든 강의 흐름을 이해하고, 그 강이 청령포의 고립과 어떻게 이어지는지 느끼고, 밤에는 별마로천문대에서 전혀 다른 영월을 보는 식의 연결이 필요하다.</p>\n", "plain_len": 282, "type": "essay", "rawIndex": 3}, {"title": "Page 04 · Day and Night", "body_md": "영월은 낮의 도시와 밤의 도시가 다를 수 있다.\n\n낮에는 장릉, 청령포, 한반도지형, 선돌이 보인다. 밤에는 별마로천문대가 도시의 중심을 바꾼다. 많은 도시는 밤이 되면 관광 동선이 끊긴다. 하지만 천문대는 밤을 빈 시간으로 두지 않는다.\n\n이것은 체류와 관련된다. 사람이 하루 더 머물 이유가 생기려면 밤의 경험이 필요하다. 별마로천문대 같은 장소는 영월의 체류 시간을 늘릴 수 있는 중요한 장치다.\n\n도시는 낮에만 설계되면 얇다.", "body_html": "<p>영월은 낮의 도시와 밤의 도시가 다를 수 있다.</p>\n<p>낮에는 장릉, 청령포, 한반도지형, 선돌이 보인다. 밤에는 별마로천문대가 도시의 중심을 바꾼다. 많은 도시는 밤이 되면 관광 동선이 끊긴다. 하지만 천문대는 밤을 빈 시간으로 두지 않는다.</p>\n<p>이것은 체류와 관련된다. 사람이 하루 더 머물 이유가 생기려면 밤의 경험이 필요하다. 별마로천문대 같은 장소는 영월의 체류 시간을 늘릴 수 있는 중요한 장치다.</p>\n<p>도시는 낮에만 설계되면 얇다.</p>\n", "plain_len": 239, "type": "essay", "rawIndex": 4}, {"title": "Page 05 · Issue Summary", "body_md": "영월의 자연은 세 가지 기능을 한다.\n\n```text\n1. 시야를 바꾼다\n   - 한반도지형, 선돌, 별마로천문대\n\n2. 몸의 이동을 바꾼다\n   - 청령포, 고씨굴, 어라연\n\n3. 체류 시간을 바꾼다\n   - 밤하늘, 강변, 산책 동선\n```\n\n이 세 가지가 연결될 때 자연은 배경이 아니라 도시의 구조가 된다.", "body_html": "<p>영월의 자연은 세 가지 기능을 한다.</p>\n<pre><code class=\"language-text\">1. 시야를 바꾼다\n   - 한반도지형, 선돌, 별마로천문대\n\n2. 몸의 이동을 바꾼다\n   - 청령포, 고씨굴, 어라연\n\n3. 체류 시간을 바꾼다\n   - 밤하늘, 강변, 산책 동선\n</code></pre>\n<p>이 세 가지가 연결될 때 자연은 배경이 아니라 도시의 구조가 된다.</p>\n", "plain_len": 58, "type": "archive", "rawIndex": 5}, {"title": "Page 06 · Bridge", "body_md": "이제 해석으로 넘어간다.\n\n지형은 도시를 설명하는 보조 자료가 아니다. 지형은 도시가 사람에게 말을 거는 방식이다. 영월은 이 점에서 강하다. 하지만 그 강함을 잘 설계하지 않으면, 자연은 또 하나의 포토존 목록으로만 남는다.\n\n영월의 지형을 도시의 문법으로 읽어보자.", "body_html": "<p>이제 해석으로 넘어간다.</p>\n<p>지형은 도시를 설명하는 보조 자료가 아니다. 지형은 도시가 사람에게 말을 거는 방식이다. 영월은 이 점에서 강하다. 하지만 그 강함을 잘 설계하지 않으면, 자연은 또 하나의 포토존 목록으로만 남는다.</p>\n<p>영월의 지형을 도시의 문법으로 읽어보자.</p>\n", "plain_len": 148, "type": "essay", "rawIndex": 6}], "totalPages": 6}, {"num": "03", "key": "Insight", "label": "Insight", "ko": "해석", "title": "지형은 도시의 문법이다", "short": "SG", "pages": [{"title": "Page 01 · Concept", "body_md": "문법은 문장을 가능하게 하는 규칙이다.\n\n도시에도 문법이 있다. 길이 어디로 휘는지, 물이 어디를 막는지, 산이 어디서 시야를 끊는지, 밤이 어디서 깊어지는지. 이런 것들이 도시의 문장을 만든다.\n\n영월의 문법은 강과 산이다. 강은 감정을 만들고, 산은 시야를 만든다. 물길은 장소를 분리하고, 전망은 장소를 다시 연결한다. 청령포의 고립도, 한반도지형의 놀라움도, 별마로천문대의 밤도 모두 이 문법 안에 있다.", "body_html": "<p>문법은 문장을 가능하게 하는 규칙이다.</p>\n<p>도시에도 문법이 있다. 길이 어디로 휘는지, 물이 어디를 막는지, 산이 어디서 시야를 끊는지, 밤이 어디서 깊어지는지. 이런 것들이 도시의 문장을 만든다.</p>\n<p>영월의 문법은 강과 산이다. 강은 감정을 만들고, 산은 시야를 만든다. 물길은 장소를 분리하고, 전망은 장소를 다시 연결한다. 청령포의 고립도, 한반도지형의 놀라움도, 별마로천문대의 밤도 모두 이 문법 안에 있다.</p>\n", "plain_len": 228, "type": "essay", "rawIndex": 1}, {"title": "Page 02 · Against Flat Tourism", "body_md": "납작한 관광은 장소를 목록으로 만든다.\n\n- 청령포 갔다.\n- 장릉 갔다.\n- 한반도지형 갔다.\n- 별마로천문대 갔다.\n\n틀린 여행은 아니다. 하지만 이런 목록은 도시를 기억하게 만들기 어렵다. 도시가 오래 남으려면 장소 사이의 관계가 보여야 한다.\n\n청령포의 강은 단종의 고립을 만들었다. 한반도지형의 강은 시각적 놀라움을 만든다. 어라연의 강은 동강의 생태와 흐름을 보여준다. 같은 강이라도 장소마다 역할이 다르다.\n\n이 차이를 읽는 순간 여행은 조금 두꺼워진다.", "body_html": "<p>납작한 관광은 장소를 목록으로 만든다.</p>\n<ul>\n<li>청령포 갔다.</li>\n<li>장릉 갔다.</li>\n<li>한반도지형 갔다.</li>\n<li>별마로천문대 갔다.</li>\n</ul>\n<p>틀린 여행은 아니다. 하지만 이런 목록은 도시를 기억하게 만들기 어렵다. 도시가 오래 남으려면 장소 사이의 관계가 보여야 한다.</p>\n<p>청령포의 강은 단종의 고립을 만들었다. 한반도지형의 강은 시각적 놀라움을 만든다. 어라연의 강은 동강의 생태와 흐름을 보여준다. 같은 강이라도 장소마다 역할이 다르다.</p>\n<p>이 차이를 읽는 순간 여행은 조금 두꺼워진다.</p>\n", "plain_len": 249, "type": "list", "rawIndex": 2}, {"title": "Page 03 · My Standard", "body_md": "나는 좋은 지역 매거진이 관광지를 추천하는 데서 끝나면 안 된다고 생각한다.\n\n추천은 쉽다. “여기 가세요”라고 말하면 된다. 하지만 매거진은 조금 더 해야 한다. 왜 그 장소가 그 도시의 문장인지, 그 장소를 보고 나면 다음에는 무엇을 봐야 하는지, 어떤 순서로 걸으면 도시가 다르게 읽히는지 제안해야 한다.\n\n영월의 지형을 다룰 때도 마찬가지다. 한반도지형을 “인증샷 명소”로만 쓰면 너무 아깝다. 그곳은 영월이 지형으로 사람을 설득하는 방식의 대표 장면이다.", "body_html": "<p>나는 좋은 지역 매거진이 관광지를 추천하는 데서 끝나면 안 된다고 생각한다.</p>\n<p>추천은 쉽다. “여기 가세요”라고 말하면 된다. 하지만 매거진은 조금 더 해야 한다. 왜 그 장소가 그 도시의 문장인지, 그 장소를 보고 나면 다음에는 무엇을 봐야 하는지, 어떤 순서로 걸으면 도시가 다르게 읽히는지 제안해야 한다.</p>\n<p>영월의 지형을 다룰 때도 마찬가지다. 한반도지형을 “인증샷 명소”로만 쓰면 너무 아깝다. 그곳은 영월이 지형으로 사람을 설득하는 방식의 대표 장면이다.</p>\n", "plain_len": 257, "type": "essay", "rawIndex": 3}, {"title": "Page 04 · Diagram", "body_md": "```text\n강\n├─ 청령포: 고립을 만든다\n├─ 한반도지형: 시야를 만든다\n├─ 어라연: 흐름과 생태를 만든다\n└─ 동강/서강: 도시의 큰 골격을 만든다\n\n산\n├─ 별마로천문대: 밤의 시야를 만든다\n├─ 전망대: 느린 도착을 만든다\n└─ 절벽/바위: 장소의 경계를 만든다\n```\n\n이 도식은 단순하지만 중요하다. 자연은 하나의 단어가 아니다. 자연 안에도 역할이 나뉜다.", "body_html": "<pre><code class=\"language-text\">강\n├─ 청령포: 고립을 만든다\n├─ 한반도지형: 시야를 만든다\n├─ 어라연: 흐름과 생태를 만든다\n└─ 동강/서강: 도시의 큰 골격을 만든다\n\n산\n├─ 별마로천문대: 밤의 시야를 만든다\n├─ 전망대: 느린 도착을 만든다\n└─ 절벽/바위: 장소의 경계를 만든다\n</code></pre>\n<p>이 도식은 단순하지만 중요하다. 자연은 하나의 단어가 아니다. 자연 안에도 역할이 나뉜다.</p>\n", "plain_len": 50, "type": "diagram", "rawIndex": 4}, {"title": "Page 05 · Bridge", "body_md": "이제 사례로 들어간다.\n\n영월의 지형은 네 개의 장면으로 먼저 잡아볼 수 있다. 한반도지형, 선돌, 어라연, 별마로천문대. 이 네 곳은 서로 다른 방식으로 도시의 시야를 바꾼다.\n\n하나는 위에서 내려다보게 하고, 하나는 바위 앞에 멈추게 하고, 하나는 물길을 따라가게 하고, 하나는 밤하늘을 올려다보게 한다.", "body_html": "<p>이제 사례로 들어간다.</p>\n<p>영월의 지형은 네 개의 장면으로 먼저 잡아볼 수 있다. 한반도지형, 선돌, 어라연, 별마로천문대. 이 네 곳은 서로 다른 방식으로 도시의 시야를 바꾼다.</p>\n<p>하나는 위에서 내려다보게 하고, 하나는 바위 앞에 멈추게 하고, 하나는 물길을 따라가게 하고, 하나는 밤하늘을 올려다보게 한다.</p>\n", "plain_len": 170, "type": "essay", "rawIndex": 5}], "totalPages": 5}, {"num": "04", "key": "Case", "label": "Case", "ko": "사례", "title": "네 개의 시야", "short": "CA", "pages": [{"title": "Page 01 · 한반도지형", "body_md": "한반도지형은 너무 유명해서 오히려 가볍게 보이기 쉽다.\n\n“한반도처럼 생겼다”는 설명은 재미있지만, 거기서 끝나면 장소는 사진 한 장으로 줄어든다. 더 중요한 것은 그 모양이 우연한 장식이 아니라 강의 침식과 퇴적이 만든 지형이라는 점이다.\n\n이곳은 자연이 만든 이미지다. 사람은 그 이미지를 보고 의미를 붙인다. 한반도를 닮았다는 말은 과학적 설명이면서 동시에 상징적 해석이다.", "body_html": "<p>한반도지형은 너무 유명해서 오히려 가볍게 보이기 쉽다.</p>\n<p>“한반도처럼 생겼다”는 설명은 재미있지만, 거기서 끝나면 장소는 사진 한 장으로 줄어든다. 더 중요한 것은 그 모양이 우연한 장식이 아니라 강의 침식과 퇴적이 만든 지형이라는 점이다.</p>\n<p>이곳은 자연이 만든 이미지다. 사람은 그 이미지를 보고 의미를 붙인다. 한반도를 닮았다는 말은 과학적 설명이면서 동시에 상징적 해석이다.</p>\n", "plain_len": 210, "type": "essay", "rawIndex": 1}, {"title": "Page 02 · 선돌", "body_md": "선돌은 멈추게 하는 장소다.\n\n바위는 움직이지 않는다. 그래서 사람을 세운다. 선돌 앞에서는 동선이 빠르게 이어지기보다 잠깐 끊긴다. 이런 장소는 여행에서 중요하다. 모든 여행지가 움직임을 요구하면 사람은 금방 지친다. 어떤 장소는 단순히 서 있게 해야 한다.\n\n선돌은 영월의 지형이 수직으로 말을 거는 장면이다. 강이 흐름이라면, 바위는 멈춤이다.", "body_html": "<p>선돌은 멈추게 하는 장소다.</p>\n<p>바위는 움직이지 않는다. 그래서 사람을 세운다. 선돌 앞에서는 동선이 빠르게 이어지기보다 잠깐 끊긴다. 이런 장소는 여행에서 중요하다. 모든 여행지가 움직임을 요구하면 사람은 금방 지친다. 어떤 장소는 단순히 서 있게 해야 한다.</p>\n<p>선돌은 영월의 지형이 수직으로 말을 거는 장면이다. 강이 흐름이라면, 바위는 멈춤이다.</p>\n", "plain_len": 193, "type": "essay", "rawIndex": 2}, {"title": "Page 03 · 어라연", "body_md": "어라연은 흐름의 장소다.\n\n동강의 물길과 절벽, 숲과 생태가 함께 만든 풍경이다. 이곳은 전망대처럼 한 번에 잡히기보다, 따라가며 느끼는 장소에 가깝다. 영월의 자연이 단순히 보는 풍경이 아니라 움직이는 풍경이라는 사실을 보여준다.\n\n어라연을 잘 다루려면 속도를 낮춰야 한다. 빨리 보고 떠나는 방식으로는 이 장소의 힘이 잘 보이지 않는다.", "body_html": "<p>어라연은 흐름의 장소다.</p>\n<p>동강의 물길과 절벽, 숲과 생태가 함께 만든 풍경이다. 이곳은 전망대처럼 한 번에 잡히기보다, 따라가며 느끼는 장소에 가깝다. 영월의 자연이 단순히 보는 풍경이 아니라 움직이는 풍경이라는 사실을 보여준다.</p>\n<p>어라연을 잘 다루려면 속도를 낮춰야 한다. 빨리 보고 떠나는 방식으로는 이 장소의 힘이 잘 보이지 않는다.</p>\n", "plain_len": 188, "type": "essay", "rawIndex": 3}, {"title": "Page 04 · 별마로천문대", "body_md": "별마로천문대는 영월의 시간을 밤으로 확장한다.\n\n낮의 관광은 대개 장소를 보여준다. 밤의 관광은 감각을 바꾼다. 어두워지고, 시야가 멀어지고, 사람은 도시의 불빛보다 하늘을 보게 된다. 별마로천문대가 중요한 이유는 영월을 낮의 자연 관광지만으로 남기지 않기 때문이다.\n\n밤의 경험은 체류를 만든다. 체류는 다시 도시의 경제와 기억을 만든다.", "body_html": "<p>별마로천문대는 영월의 시간을 밤으로 확장한다.</p>\n<p>낮의 관광은 대개 장소를 보여준다. 밤의 관광은 감각을 바꾼다. 어두워지고, 시야가 멀어지고, 사람은 도시의 불빛보다 하늘을 보게 된다. 별마로천문대가 중요한 이유는 영월을 낮의 자연 관광지만으로 남기지 않기 때문이다.</p>\n<p>밤의 경험은 체류를 만든다. 체류는 다시 도시의 경제와 기억을 만든다.</p>\n", "plain_len": 188, "type": "essay", "rawIndex": 4}, {"title": "Page 05 · Case Insight", "body_md": "네 장소는 서로 다른 방향을 만든다.\n\n| 장소 | 몸의 방향 | 남는 감각 |\n|---|---|---|\n| 한반도지형 | 내려다보기 | 놀라움 |\n| 선돌 | 멈춰 서기 | 정지 |\n| 어라연 | 따라가기 | 흐름 |\n| 별마로천문대 | 올려다보기 | 확장 |\n\n이 네 방향을 하나의 동선으로 묶을 수 있다면, 영월의 자연은 단순한 관광 목록이 아니라 도시를 읽는 지도 자체가 된다.", "body_html": "<p>네 장소는 서로 다른 방향을 만든다.</p>\n<table>\n<thead>\n<tr>\n  <th>장소</th>\n  <th>몸의 방향</th>\n  <th>남는 감각</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>한반도지형</td>\n  <td>내려다보기</td>\n  <td>놀라움</td>\n</tr>\n<tr>\n  <td>선돌</td>\n  <td>멈춰 서기</td>\n  <td>정지</td>\n</tr>\n<tr>\n  <td>어라연</td>\n  <td>따라가기</td>\n  <td>흐름</td>\n</tr>\n<tr>\n  <td>별마로천문대</td>\n  <td>올려다보기</td>\n  <td>확장</td>\n</tr>\n</tbody>\n</table>\n<p>이 네 방향을 하나의 동선으로 묶을 수 있다면, 영월의 자연은 단순한 관광 목록이 아니라 도시를 읽는 지도 자체가 된다.</p>\n", "plain_len": 159, "type": "diagram", "rawIndex": 5}], "totalPages": 5}, {"num": "05", "key": "Archive", "label": "Archive", "ko": "기록", "title": "자연을 포토존으로만 쓰지 않기", "short": "AR", "pages": [{"title": "Page 01 · Three Sentences", "body_md": "오늘의 핵심은 세 문장이다.\n\n1. 영월의 자연은 배경이 아니라 도시의 작동 방식이다.\n2. 강과 산은 장소의 감정, 이동, 체류 시간을 바꾼다.\n3. 자연을 오래 남기려면 포토존이 아니라 동선과 해석으로 연결해야 한다.", "body_html": "<p>오늘의 핵심은 세 문장이다.</p>\n<ol>\n<li>영월의 자연은 배경이 아니라 도시의 작동 방식이다.</li>\n<li>강과 산은 장소의 감정, 이동, 체류 시간을 바꾼다.</li>\n<li>자연을 오래 남기려면 포토존이 아니라 동선과 해석으로 연결해야 한다.</li>\n</ol>\n", "plain_len": 122, "type": "list", "rawIndex": 1}, {"title": "Page 02 · Questions", "body_md": "오늘 읽고 남길 질문:\n\n- 나는 자연 관광지를 볼 때 무엇을 먼저 보는가?\n- 사진을 찍고 나면 장소에 대한 생각도 끝나버리지는 않는가?\n- 한 도시의 강과 산은 그 도시의 성격을 어떻게 바꾸는가?\n- 밤의 경험은 체류를 만드는 데 얼마나 중요한가?", "body_html": "<p>오늘 읽고 남길 질문:</p>\n<ul>\n<li>나는 자연 관광지를 볼 때 무엇을 먼저 보는가?</li>\n<li>사진을 찍고 나면 장소에 대한 생각도 끝나버리지는 않는가?</li>\n<li>한 도시의 강과 산은 그 도시의 성격을 어떻게 바꾸는가?</li>\n<li>밤의 경험은 체류를 만드는 데 얼마나 중요한가?</li>\n</ul>\n", "plain_len": 131, "type": "archive", "rawIndex": 2}, {"title": "Page 03 · Route Sketch", "body_md": "영월 지형 읽기 하루 동선 초안:\n\n```text\n오전  | 한반도지형 전망대\n점심  | 영월읍 또는 서부시장\n오후  | 선돌 또는 어라연\n저녁  | 숙소 / 지역 음식\n밤    | 별마로천문대\n```\n\n핵심은 장소를 많이 찍는 것이 아니라, 시야의 방향을 바꾸는 것이다.", "body_html": "<p>영월 지형 읽기 하루 동선 초안:</p>\n<pre><code class=\"language-text\">오전  | 한반도지형 전망대\n점심  | 영월읍 또는 서부시장\n오후  | 선돌 또는 어라연\n저녁  | 숙소 / 지역 음식\n밤    | 별마로천문대\n</code></pre>\n<p>핵심은 장소를 많이 찍는 것이 아니라, 시야의 방향을 바꾸는 것이다.</p>\n", "plain_len": 57, "type": "diagram", "rawIndex": 3}, {"title": "Page 04 · Next", "body_md": "내일은 지형에서 문화로 넘어간다.\n\n영월은 자연만 있는 도시가 아니다. 폐광의 시간이 있고, 그 기억을 문화의 언어로 다시 캐내려는 시도가 있다. 어쩌면 영월에서 가장 흥미로운 표현은 “문화광산”일지도 모른다.\n\n폐광의 도시는 어떻게 문화광산이 되는가.\n\n---", "body_html": "<p>내일은 지형에서 문화로 넘어간다.</p>\n<p>영월은 자연만 있는 도시가 아니다. 폐광의 시간이 있고, 그 기억을 문화의 언어로 다시 캐내려는 시도가 있다. 어쩌면 영월에서 가장 흥미로운 표현은 “문화광산”일지도 모른다.</p>\n<p>폐광의 도시는 어떻게 문화광산이 되는가.</p>\n<hr />\n", "plain_len": 139, "type": "essay", "rawIndex": 4}], "totalPages": 4}]}, {"date": "2026-05-07", "weekday": "목", "weekdayFull": "목요일", "no": "004", "titleLine": "2026-05-07 목요일 · No.004", "theme": "폐광의 기억은 어떻게 문화광산이 되는가", "note_html": "<aside class=\"note-card\"><strong>목요일의 역할</strong><p>목요일은 영월의 문화도시 실험을 다룬다.<br />\n영화 관광의 뜨거운 관심과 별개로, 영월이 이미 진행해 온 느린 문화 사업을 읽는다.<br />\n핵심은 “새로 꾸미기”가 아니라 “이미 있던 삶과 기록을 다시 캐내기”다.</p>\n</aside>\n\n", "sections": [{"num": "01", "key": "Intro", "label": "Intro", "ko": "입구", "title": "광산이라는 단어의 방향을 바꾸는 일", "short": "IN", "pages": [{"title": "Page 01 · Cover", "body_md": "광산이라는 말은 무겁다.\n\n땅속, 석탄, 어둠, 노동, 위험, 쇠락 같은 단어가 따라온다. 폐광이라는 말까지 붙으면 더 그렇다. 지역의 산업이 끝났다는 느낌, 한 시대가 닫혔다는 느낌이 생긴다.\n\n그런데 영월은 이 단어를 조금 다르게 돌려놓았다. 문화광산. 광물을 캐던 곳에서 문화를 캐는 곳으로.\n\n처음에는 말장난처럼 들릴 수도 있다. 하지만 생각해보면 꽤 정확하다. 지역의 문화는 새로 칠해서 만드는 것이 아니라, 이미 쌓여 있던 삶과 기억과 이야기를 다시 캐내는 일에 가깝기 때문이다.", "body_html": "<p>광산이라는 말은 무겁다.</p>\n<p>땅속, 석탄, 어둠, 노동, 위험, 쇠락 같은 단어가 따라온다. 폐광이라는 말까지 붙으면 더 그렇다. 지역의 산업이 끝났다는 느낌, 한 시대가 닫혔다는 느낌이 생긴다.</p>\n<p>그런데 영월은 이 단어를 조금 다르게 돌려놓았다. 문화광산. 광물을 캐던 곳에서 문화를 캐는 곳으로.</p>\n<p>처음에는 말장난처럼 들릴 수도 있다. 하지만 생각해보면 꽤 정확하다. 지역의 문화는 새로 칠해서 만드는 것이 아니라, 이미 쌓여 있던 삶과 기억과 이야기를 다시 캐내는 일에 가깝기 때문이다.</p>\n", "plain_len": 271, "type": "cover", "rawIndex": 1}, {"title": "Page 02 · Scene", "body_md": "도시가 자기를 다시 설명하려고 할 때, 가장 쉬운 방법은 새 건물을 짓는 것이다. 번듯한 이름을 붙이고, 사진 잘 나오는 공간을 만들고, 새로운 브랜드를 붙인다.\n\n하지만 그런 방식은 오래 버티기 어렵다. 겉은 빨리 바뀌지만, 도시의 속살과 연결되지 않으면 금방 비어 보인다.\n\n영월의 문화도시 실험에서 내가 흥미롭게 보는 지점은 “폐광의 기억”을 지우지 않는다는 점이다. 과거를 부끄러운 흔적으로 밀어내기보다, 그 안에서 다시 꺼낼 수 있는 이야기를 찾으려 한다.\n\n도시는 이렇게 해야 조금 진짜가 된다.", "body_html": "<p>도시가 자기를 다시 설명하려고 할 때, 가장 쉬운 방법은 새 건물을 짓는 것이다. 번듯한 이름을 붙이고, 사진 잘 나오는 공간을 만들고, 새로운 브랜드를 붙인다.</p>\n<p>하지만 그런 방식은 오래 버티기 어렵다. 겉은 빨리 바뀌지만, 도시의 속살과 연결되지 않으면 금방 비어 보인다.</p>\n<p>영월의 문화도시 실험에서 내가 흥미롭게 보는 지점은 “폐광의 기억”을 지우지 않는다는 점이다. 과거를 부끄러운 흔적으로 밀어내기보다, 그 안에서 다시 꺼낼 수 있는 이야기를 찾으려 한다.</p>\n<p>도시는 이렇게 해야 조금 진짜가 된다.</p>\n", "plain_len": 280, "type": "essay", "rawIndex": 2}, {"title": "Page 03 · Question", "body_md": "목요일의 질문은 이것이다.\n\n- 폐광의 기억은 도시의 약점인가, 자산인가?\n- 문화도시는 새 공간을 만드는 일인가, 이미 있던 삶을 다시 읽는 일인가?\n- 주민의 기록은 도시 브랜드가 될 수 있는가?\n- 영화 이후의 관심과 문화도시의 느린 실험은 어떻게 만날 수 있는가?\n\n나는 여기서 “문화”라는 말을 조심해서 쓰고 싶다. 문화는 포스터와 축제만이 아니다. 문화는 사람들이 어떤 기억을 공유하고, 무엇을 남기고, 어떤 방식으로 자기 동네를 설명하는가에 더 가깝다.", "body_html": "<p>목요일의 질문은 이것이다.</p>\n<ul>\n<li>폐광의 기억은 도시의 약점인가, 자산인가?</li>\n<li>문화도시는 새 공간을 만드는 일인가, 이미 있던 삶을 다시 읽는 일인가?</li>\n<li>주민의 기록은 도시 브랜드가 될 수 있는가?</li>\n<li>영화 이후의 관심과 문화도시의 느린 실험은 어떻게 만날 수 있는가?</li>\n</ul>\n<p>나는 여기서 “문화”라는 말을 조심해서 쓰고 싶다. 문화는 포스터와 축제만이 아니다. 문화는 사람들이 어떤 기억을 공유하고, 무엇을 남기고, 어떤 방식으로 자기 동네를 설명하는가에 더 가깝다.</p>\n", "plain_len": 250, "type": "list", "rawIndex": 3}, {"title": "Page 04 · Bridge", "body_md": "영월은 2022년 제4차 법정문화도시로 지정되었고, 2025년에는 문체부가 선정하는 올해의 문화도시로 뽑혔다. 영월문화관광재단은 이를 두고 폐광 지역의 한계를 창조적으로 극복하고 주민 주도의 문화 생태계를 만든 성과라고 설명한다.\n\n이제 쟁점은 분명하다.\n\n문화도시라는 이름은 영월을 어떻게 다르게 읽게 하는가.", "body_html": "<p>영월은 2022년 제4차 법정문화도시로 지정되었고, 2025년에는 문체부가 선정하는 올해의 문화도시로 뽑혔다. 영월문화관광재단은 이를 두고 폐광 지역의 한계를 창조적으로 극복하고 주민 주도의 문화 생태계를 만든 성과라고 설명한다.</p>\n<p>이제 쟁점은 분명하다.</p>\n<p>문화도시라는 이름은 영월을 어떻게 다르게 읽게 하는가.</p>\n", "plain_len": 172, "type": "essay", "rawIndex": 4}], "totalPages": 4}, {"num": "02", "key": "Issue", "label": "Issue", "ko": "쟁점", "title": "문화도시는 도시를 예쁘게 꾸미는 일이 아니다", "short": "IS", "pages": [{"title": "Page 01 · Cover", "body_md": "문화도시라는 말은 자칫 예쁜 말이 된다.\n\n그럴듯한 포스터, 축제, 전시, 공간, 굿즈 같은 것이 먼저 떠오른다. 물론 이런 것들도 필요하다. 하지만 문화도시가 단지 도시를 보기 좋게 꾸미는 일이라면 오래 버티기 어렵다.\n\n영월의 경우 문화도시는 더 깊은 질문과 연결된다.\n\n폐광 이후 지역은 자기 시간을 어떻게 설명할 것인가. 떠난 사람과 남은 사람의 기억을 어떻게 기록할 것인가. 산업의 끝을 도시의 끝으로만 읽지 않으려면 무엇을 해야 하는가.", "body_html": "<p>문화도시라는 말은 자칫 예쁜 말이 된다.</p>\n<p>그럴듯한 포스터, 축제, 전시, 공간, 굿즈 같은 것이 먼저 떠오른다. 물론 이런 것들도 필요하다. 하지만 문화도시가 단지 도시를 보기 좋게 꾸미는 일이라면 오래 버티기 어렵다.</p>\n<p>영월의 경우 문화도시는 더 깊은 질문과 연결된다.</p>\n<p>폐광 이후 지역은 자기 시간을 어떻게 설명할 것인가. 떠난 사람과 남은 사람의 기억을 어떻게 기록할 것인가. 산업의 끝을 도시의 끝으로만 읽지 않으려면 무엇을 해야 하는가.</p>\n", "plain_len": 247, "type": "cover", "rawIndex": 1}, {"title": "Page 02 · Cultural City Data", "body_md": "영월문화관광재단은 영월군이 2022년 제4차 법정문화도시로 지정되었고, 2025년 “올해의 문화도시”로 선정되었다고 밝혔다. 특히 “문화광산도시”라는 브랜드 아래 광산문화를 재조명하고, 주민 참여와 기록 사업을 이어온 점이 평가되었다고 설명한다.\n\n이 자료에서 중요한 단어는 두 개다.\n\n**광산문화**와 **주민 주도**.\n\n문화도시가 외부 전문가가 내려와 예쁘게 이름 붙이는 사업이 아니라면, 결국 지역 안에 있던 사람들의 기억과 말이 중심이 되어야 한다.\n\n> [!note] 자료 기준\n> 영월의 법정문화도시 지정, 2025 올해의 문화도시 선정, 문화광산도시 브랜드 관련 내용은 영월문화관광재단 공지와 관련 보도를 기준으로 정리했다. 자료 ID: R-09.", "body_html": "<p>영월문화관광재단은 영월군이 2022년 제4차 법정문화도시로 지정되었고, 2025년 “올해의 문화도시”로 선정되었다고 밝혔다. 특히 “문화광산도시”라는 브랜드 아래 광산문화를 재조명하고, 주민 참여와 기록 사업을 이어온 점이 평가되었다고 설명한다.</p>\n<p>이 자료에서 중요한 단어는 두 개다.</p>\n<p><strong>광산문화</strong>와 <strong>주민 주도</strong>.</p>\n<p>문화도시가 외부 전문가가 내려와 예쁘게 이름 붙이는 사업이 아니라면, 결국 지역 안에 있던 사람들의 기억과 말이 중심이 되어야 한다.</p>\n<aside class=\"note-card\"><strong>자료 기준</strong><p>영월의 법정문화도시 지정, 2025 올해의 문화도시 선정, 문화광산도시 브랜드 관련 내용은 영월문화관광재단 공지와 관련 보도를 기준으로 정리했다. 자료 ID: R-09.</p>\n</aside>\n\n", "plain_len": 355, "type": "essay", "rawIndex": 2}, {"title": "Page 03 · The Risk", "body_md": "문화도시 사업에도 위험은 있다.\n\n첫째, 사업 이름이 실제 삶보다 커질 수 있다. 이름은 멋진데 주민에게 남는 것이 적으면, 문화는 행정 문구가 된다.\n\n둘째, 오래된 기억이 전시용 재료가 될 수 있다. 광산의 노동과 위험과 생활은 무거운 기억이다. 이것을 너무 세련된 브랜드로만 바꾸면, 과거의 질감이 사라진다.\n\n셋째, 관광객을 위한 문화와 주민을 위한 문화가 갈라질 수 있다. 외부인이 보기 좋은 공간은 늘어나는데, 지역 사람이 자기 삶을 말할 자리는 줄어들 수 있다.\n\n문화도시는 이 세 위험을 계속 점검해야 한다.", "body_html": "<p>문화도시 사업에도 위험은 있다.</p>\n<p>첫째, 사업 이름이 실제 삶보다 커질 수 있다. 이름은 멋진데 주민에게 남는 것이 적으면, 문화는 행정 문구가 된다.</p>\n<p>둘째, 오래된 기억이 전시용 재료가 될 수 있다. 광산의 노동과 위험과 생활은 무거운 기억이다. 이것을 너무 세련된 브랜드로만 바꾸면, 과거의 질감이 사라진다.</p>\n<p>셋째, 관광객을 위한 문화와 주민을 위한 문화가 갈라질 수 있다. 외부인이 보기 좋은 공간은 늘어나는데, 지역 사람이 자기 삶을 말할 자리는 줄어들 수 있다.</p>\n<p>문화도시는 이 세 위험을 계속 점검해야 한다.</p>\n", "plain_len": 288, "type": "essay", "rawIndex": 3}, {"title": "Page 04 · What Culture Can Do", "body_md": "그럼에도 문화도시는 필요하다.\n\n문화는 지역을 단번에 살리는 마법이 아니다. 하지만 지역이 자기 자신을 설명하는 방식을 바꿀 수 있다. “우리는 폐광 지역이다”라는 말에서 “우리는 광산의 기억을 문화로 다시 캐내는 도시다”라는 말로 넘어갈 수 있다면, 도시의 자존감은 달라진다.\n\n이 변화는 숫자로 바로 보이지 않을 수 있다. 하지만 사람들이 자기 지역을 부르는 이름이 바뀌면, 그 다음 행동도 조금씩 바뀐다. 기록하고, 모이고, 보여주고, 초대하고, 다시 설명하는 힘이 생긴다.", "body_html": "<p>그럼에도 문화도시는 필요하다.</p>\n<p>문화는 지역을 단번에 살리는 마법이 아니다. 하지만 지역이 자기 자신을 설명하는 방식을 바꿀 수 있다. “우리는 폐광 지역이다”라는 말에서 “우리는 광산의 기억을 문화로 다시 캐내는 도시다”라는 말로 넘어갈 수 있다면, 도시의 자존감은 달라진다.</p>\n<p>이 변화는 숫자로 바로 보이지 않을 수 있다. 하지만 사람들이 자기 지역을 부르는 이름이 바뀌면, 그 다음 행동도 조금씩 바뀐다. 기록하고, 모이고, 보여주고, 초대하고, 다시 설명하는 힘이 생긴다.</p>\n", "plain_len": 266, "type": "essay", "rawIndex": 4}, {"title": "Page 05 · Issue Summary", "body_md": "```text\n폐광\n→ 산업의 끝\n\n광산문화\n→ 끝난 산업 안에 남은 삶의 기억\n\n문화광산\n→ 기억을 다시 캐내는 도시 브랜드\n\n문화도시\n→ 그 과정을 제도와 사업으로 묶는 틀\n```\n\n영월의 문화도시 실험은 이 흐름 위에 있다.", "body_html": "<pre><code class=\"language-text\">폐광\n→ 산업의 끝\n\n광산문화\n→ 끝난 산업 안에 남은 삶의 기억\n\n문화광산\n→ 기억을 다시 캐내는 도시 브랜드\n\n문화도시\n→ 그 과정을 제도와 사업으로 묶는 틀\n</code></pre>\n<p>영월의 문화도시 실험은 이 흐름 위에 있다.</p>\n", "plain_len": 24, "type": "archive", "rawIndex": 5}, {"title": "Page 06 · Bridge", "body_md": "이제 해석으로 넘어간다.\n\n문화광산이라는 표현이 오래 살아남으려면, 그것이 단순한 슬로건이 아니라 실제 편집 방식이 되어야 한다. 무엇을 캐낼 것인가. 누가 캐낼 것인가. 캐낸 이야기를 누구에게 어떻게 돌려줄 것인가.\n\n이 질문들이 중요하다.", "body_html": "<p>이제 해석으로 넘어간다.</p>\n<p>문화광산이라는 표현이 오래 살아남으려면, 그것이 단순한 슬로건이 아니라 실제 편집 방식이 되어야 한다. 무엇을 캐낼 것인가. 누가 캐낼 것인가. 캐낸 이야기를 누구에게 어떻게 돌려줄 것인가.</p>\n<p>이 질문들이 중요하다.</p>\n", "plain_len": 133, "type": "essay", "rawIndex": 6}], "totalPages": 6}, {"num": "03", "key": "Insight", "label": "Insight", "ko": "해석", "title": "지역의 이야기는 발견되는 것이 아니라 발굴된다", "short": "SG", "pages": [{"title": "Page 01 · Concept", "body_md": "지역 이야기는 그냥 발견되지 않는다.\n\n“여기 이런 이야기가 있습니다”라고 말하는 순간 이미 누군가가 보고, 듣고, 기록하고, 골라내고, 다시 놓은 것이다. 그래서 지역 콘텐츠는 발굴에 가깝다. 땅속에 있던 광물을 캐내듯, 사람들의 기억 속에 있던 시간을 조심스럽게 꺼내는 일이다.\n\n이 비유가 영월에서는 특히 잘 맞는다. 광산의 도시가 문화광산을 말할 때, 그것은 단순한 브랜드가 아니라 방법론이 될 수 있다.", "body_html": "<p>지역 이야기는 그냥 발견되지 않는다.</p>\n<p>“여기 이런 이야기가 있습니다”라고 말하는 순간 이미 누군가가 보고, 듣고, 기록하고, 골라내고, 다시 놓은 것이다. 그래서 지역 콘텐츠는 발굴에 가깝다. 땅속에 있던 광물을 캐내듯, 사람들의 기억 속에 있던 시간을 조심스럽게 꺼내는 일이다.</p>\n<p>이 비유가 영월에서는 특히 잘 맞는다. 광산의 도시가 문화광산을 말할 때, 그것은 단순한 브랜드가 아니라 방법론이 될 수 있다.</p>\n", "plain_len": 228, "type": "essay", "rawIndex": 1}, {"title": "Page 02 · Against Decorative Culture", "body_md": "나는 지역문화가 장식이 되는 순간을 경계한다.\n\n예쁜 벽화, 화려한 조명, 사진 잘 나오는 공간. 이런 것들은 나쁠 수 없다. 문제는 그것이 도시의 기억과 연결되지 않을 때다. 맥락 없는 장식은 빠르게 낡는다. 처음에는 새롭지만, 곧 어디서나 볼 수 있는 풍경이 된다.\n\n영월의 강점은 이미 강한 맥락을 갖고 있다는 데 있다. 단종, 강, 산, 광산, 사진, 천문대, 시장. 이 재료들은 새로 만든 것이 아니다. 이미 있었던 것들이다.\n\n문화도시는 이 재료를 새것처럼 포장하는 일이 아니라, 서로 이어 읽는 일이어야 한다.", "body_html": "<p>나는 지역문화가 장식이 되는 순간을 경계한다.</p>\n<p>예쁜 벽화, 화려한 조명, 사진 잘 나오는 공간. 이런 것들은 나쁠 수 없다. 문제는 그것이 도시의 기억과 연결되지 않을 때다. 맥락 없는 장식은 빠르게 낡는다. 처음에는 새롭지만, 곧 어디서나 볼 수 있는 풍경이 된다.</p>\n<p>영월의 강점은 이미 강한 맥락을 갖고 있다는 데 있다. 단종, 강, 산, 광산, 사진, 천문대, 시장. 이 재료들은 새로 만든 것이 아니다. 이미 있었던 것들이다.</p>\n<p>문화도시는 이 재료를 새것처럼 포장하는 일이 아니라, 서로 이어 읽는 일이어야 한다.</p>\n", "plain_len": 289, "type": "essay", "rawIndex": 2}, {"title": "Page 03 · My Standard", "body_md": "나는 좋은 지역문화 사업을 볼 때 세 가지를 묻는다.\n\n1. 이 사업은 지역 사람이 자기 이야기를 말할 자리를 늘리는가?\n2. 이 사업은 외부인에게 보기 좋은 장면만 만들고 끝나지 않는가?\n3. 이 사업은 시간이 지나도 다시 꺼내볼 기록을 남기는가?\n\n영월의 문화광산 실험도 이 기준으로 봐야 한다. 올해의 문화도시 선정은 좋은 신호다. 하지만 선정 자체가 결론은 아니다. 진짜 중요한 것은 그 이후다. 주민의 말이 계속 쌓이는가. 지역 안에서 쓰이는 문화가 되는가. 관광객이 떠난 뒤에도 남는 것이 있는가.", "body_html": "<p>나는 좋은 지역문화 사업을 볼 때 세 가지를 묻는다.</p>\n<ol>\n<li>이 사업은 지역 사람이 자기 이야기를 말할 자리를 늘리는가?</li>\n<li>이 사업은 외부인에게 보기 좋은 장면만 만들고 끝나지 않는가?</li>\n<li>이 사업은 시간이 지나도 다시 꺼내볼 기록을 남기는가?</li>\n</ol>\n<p>영월의 문화광산 실험도 이 기준으로 봐야 한다. 올해의 문화도시 선정은 좋은 신호다. 하지만 선정 자체가 결론은 아니다. 진짜 중요한 것은 그 이후다. 주민의 말이 계속 쌓이는가. 지역 안에서 쓰이는 문화가 되는가. 관광객이 떠난 뒤에도 남는 것이 있는가.</p>\n", "plain_len": 282, "type": "list", "rawIndex": 3}, {"title": "Page 04 · Culture as Archive", "body_md": "문화도시는 결국 아카이브와 닮아 있다.\n\n아카이브는 자료를 창고에 넣어두는 일이 아니다. 어떤 자료를 남길지, 어떤 순서로 보여줄지, 누가 다시 읽을 수 있게 할지 정하는 일이다. 도시도 마찬가지다. 모든 기억이 자동으로 남지는 않는다. 남기기로 한 기억만 남는다.\n\n영월이 문화광산을 말한다면, 그것은 도시 전체를 하나의 살아 있는 아카이브로 만들겠다는 뜻일 수 있다.\n\n이 관점에서 보면 문화도시는 관광보다 느리지만 더 깊다.", "body_html": "<p>문화도시는 결국 아카이브와 닮아 있다.</p>\n<p>아카이브는 자료를 창고에 넣어두는 일이 아니다. 어떤 자료를 남길지, 어떤 순서로 보여줄지, 누가 다시 읽을 수 있게 할지 정하는 일이다. 도시도 마찬가지다. 모든 기억이 자동으로 남지는 않는다. 남기기로 한 기억만 남는다.</p>\n<p>영월이 문화광산을 말한다면, 그것은 도시 전체를 하나의 살아 있는 아카이브로 만들겠다는 뜻일 수 있다.</p>\n<p>이 관점에서 보면 문화도시는 관광보다 느리지만 더 깊다.</p>\n", "plain_len": 237, "type": "essay", "rawIndex": 4}, {"title": "Page 05 · Bridge", "body_md": "이제 사례로 들어간다.\n\n영월의 문화 자산은 하나의 공간에 모여 있지 않다. 사진, 광산 기억, 예술 공간, 주민 기록, 축제, 시장이 흩어져 있다. 이 흩어짐을 어떻게 연결하느냐가 중요하다.\n\n문화광산은 장소 하나가 아니라 편집 방식이다.", "body_html": "<p>이제 사례로 들어간다.</p>\n<p>영월의 문화 자산은 하나의 공간에 모여 있지 않다. 사진, 광산 기억, 예술 공간, 주민 기록, 축제, 시장이 흩어져 있다. 이 흩어짐을 어떻게 연결하느냐가 중요하다.</p>\n<p>문화광산은 장소 하나가 아니라 편집 방식이다.</p>\n", "plain_len": 132, "type": "essay", "rawIndex": 5}], "totalPages": 5}, {"num": "04", "key": "Case", "label": "Case", "ko": "사례", "title": "문화광산을 이루는 장면들", "short": "CA", "pages": [{"title": "Page 01 · 주민 기록", "body_md": "영월문화관광재단 자료는 광산문화를 재조명하고 기록물을 출간한 점을 성과로 언급한다. 나는 이 대목이 중요하다고 본다.\n\n기록은 느리다. 사람을 만나야 하고, 말을 들어야 하고, 오래된 사진과 문서를 다시 봐야 한다. 홍보물보다 덜 화려하지만, 시간이 지나면 기록이 도시의 진짜 자산이 된다.\n\n폐광의 기억은 누군가의 노동 기억이고, 가족 기억이고, 동네 기억이다. 이것을 행사의 소재로만 쓰지 않고 기록으로 남기는 일은 도시의 언어를 두껍게 만든다.", "body_html": "<p>영월문화관광재단 자료는 광산문화를 재조명하고 기록물을 출간한 점을 성과로 언급한다. 나는 이 대목이 중요하다고 본다.</p>\n<p>기록은 느리다. 사람을 만나야 하고, 말을 들어야 하고, 오래된 사진과 문서를 다시 봐야 한다. 홍보물보다 덜 화려하지만, 시간이 지나면 기록이 도시의 진짜 자산이 된다.</p>\n<p>폐광의 기억은 누군가의 노동 기억이고, 가족 기억이고, 동네 기억이다. 이것을 행사의 소재로만 쓰지 않고 기록으로 남기는 일은 도시의 언어를 두껍게 만든다.</p>\n", "plain_len": 249, "type": "essay", "rawIndex": 1}, {"title": "Page 02 · 동강사진박물관", "body_md": "영월에는 사진이라는 축도 있다.\n\n동강사진박물관과 동강국제사진제의 축적은 영월을 단순한 자연 관광지로만 두지 않는다. 사진은 장소를 보는 방식 자체를 바꾼다. 어떤 장면을 남길지, 어떤 시선으로 기록할지, 무엇을 프레임 밖에 둘지 묻게 한다.\n\n영월의 매거진을 만든다면 사진의 언어는 꼭 필요하다. 영월은 사진을 찍기 좋은 곳이 아니라, 사진을 통해 장소의 기억을 다시 묻게 하는 도시가 될 수 있다.", "body_html": "<p>영월에는 사진이라는 축도 있다.</p>\n<p>동강사진박물관과 동강국제사진제의 축적은 영월을 단순한 자연 관광지로만 두지 않는다. 사진은 장소를 보는 방식 자체를 바꾼다. 어떤 장면을 남길지, 어떤 시선으로 기록할지, 무엇을 프레임 밖에 둘지 묻게 한다.</p>\n<p>영월의 매거진을 만든다면 사진의 언어는 꼭 필요하다. 영월은 사진을 찍기 좋은 곳이 아니라, 사진을 통해 장소의 기억을 다시 묻게 하는 도시가 될 수 있다.</p>\n", "plain_len": 222, "type": "essay", "rawIndex": 2}, {"title": "Page 03 · 젊은달와이파크와 예술 공간", "body_md": "젊은달와이파크 같은 공간은 영월의 다른 얼굴을 보여준다.\n\n역사와 자연만으로 영월을 설명하면 도시가 너무 오래된 쪽으로만 보일 수 있다. 예술 공간은 현재의 감각을 붙인다. 다만 중요한 것은 균형이다. 예술 공간이 지역과 무관한 독립된 포토존으로만 소비되면 약해진다. 지역의 지형, 기억, 이동 동선과 연결될 때 더 오래 남는다.\n\n젊은 감각은 필요하다. 하지만 젊은 감각만으로 도시는 버티지 못한다. 오래된 기억과 새 감각이 같이 있어야 한다.", "body_html": "<p>젊은달와이파크 같은 공간은 영월의 다른 얼굴을 보여준다.</p>\n<p>역사와 자연만으로 영월을 설명하면 도시가 너무 오래된 쪽으로만 보일 수 있다. 예술 공간은 현재의 감각을 붙인다. 다만 중요한 것은 균형이다. 예술 공간이 지역과 무관한 독립된 포토존으로만 소비되면 약해진다. 지역의 지형, 기억, 이동 동선과 연결될 때 더 오래 남는다.</p>\n<p>젊은 감각은 필요하다. 하지만 젊은 감각만으로 도시는 버티지 못한다. 오래된 기억과 새 감각이 같이 있어야 한다.</p>\n", "plain_len": 247, "type": "essay", "rawIndex": 3}, {"title": "Page 04 · 시장과 생활 공간", "body_md": "문화는 박물관과 전시장에만 있지 않다.\n\n시장, 밥집, 버스정류장, 숙소, 주민이 실제로 오가는 길에도 있다. 관광객이 청령포와 장릉만 보고 떠난다면 영월의 문화는 반쪽만 보인다. 시장에서 밥을 먹고, 지역 사람이 쓰는 길을 지나고, 밤에 숙소로 돌아가는 시간까지 있어야 도시가 입체적으로 남는다.\n\n문화도시의 힘은 이 일상 공간을 얼마나 잘 보이게 하느냐에도 달려 있다.", "body_html": "<p>문화는 박물관과 전시장에만 있지 않다.</p>\n<p>시장, 밥집, 버스정류장, 숙소, 주민이 실제로 오가는 길에도 있다. 관광객이 청령포와 장릉만 보고 떠난다면 영월의 문화는 반쪽만 보인다. 시장에서 밥을 먹고, 지역 사람이 쓰는 길을 지나고, 밤에 숙소로 돌아가는 시간까지 있어야 도시가 입체적으로 남는다.</p>\n<p>문화도시의 힘은 이 일상 공간을 얼마나 잘 보이게 하느냐에도 달려 있다.</p>\n", "plain_len": 206, "type": "essay", "rawIndex": 4}, {"title": "Page 05 · Case Insight", "body_md": "영월의 문화광산은 네 층으로 볼 수 있다.\n\n| 층 | 내용 | 역할 |\n|---|---|---|\n| 기억 | 광산, 단종, 오래된 마을 이야기 | 도시의 시간 |\n| 기록 | 주민 구술, 사진, 출판물 | 도시의 증거 |\n| 공간 | 박물관, 예술 공간, 축제장 | 도시의 장면 |\n| 생활 | 시장, 음식, 숙소, 골목 | 도시의 현재 |\n\n이 네 층이 이어질 때, 문화도시는 행정 사업을 넘어 도시의 읽기 방식이 된다.", "body_html": "<p>영월의 문화광산은 네 층으로 볼 수 있다.</p>\n<table>\n<thead>\n<tr>\n  <th>층</th>\n  <th>내용</th>\n  <th>역할</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n  <td>기억</td>\n  <td>광산, 단종, 오래된 마을 이야기</td>\n  <td>도시의 시간</td>\n</tr>\n<tr>\n  <td>기록</td>\n  <td>주민 구술, 사진, 출판물</td>\n  <td>도시의 증거</td>\n</tr>\n<tr>\n  <td>공간</td>\n  <td>박물관, 예술 공간, 축제장</td>\n  <td>도시의 장면</td>\n</tr>\n<tr>\n  <td>생활</td>\n  <td>시장, 음식, 숙소, 골목</td>\n  <td>도시의 현재</td>\n</tr>\n</tbody>\n</table>\n<p>이 네 층이 이어질 때, 문화도시는 행정 사업을 넘어 도시의 읽기 방식이 된다.</p>\n", "plain_len": 181, "type": "diagram", "rawIndex": 5}], "totalPages": 5}, {"num": "05", "key": "Archive", "label": "Archive", "ko": "기록", "title": "문화광산을 계속 작동하게 하는 질문", "short": "AR", "pages": [{"title": "Page 01 · Three Sentences", "body_md": "오늘의 핵심은 세 문장이다.\n\n1. 문화도시는 도시를 예쁘게 꾸미는 일이 아니라, 도시가 자기 이야기를 다시 말하게 하는 일이다.\n2. 영월의 “문화광산”은 폐광의 기억을 지우지 않고 다른 방향으로 읽으려는 시도다.\n3. 이 실험이 오래가려면 주민의 말, 기록, 생활 공간이 계속 중심에 있어야 한다.", "body_html": "<p>오늘의 핵심은 세 문장이다.</p>\n<ol>\n<li>문화도시는 도시를 예쁘게 꾸미는 일이 아니라, 도시가 자기 이야기를 다시 말하게 하는 일이다.</li>\n<li>영월의 “문화광산”은 폐광의 기억을 지우지 않고 다른 방향으로 읽으려는 시도다.</li>\n<li>이 실험이 오래가려면 주민의 말, 기록, 생활 공간이 계속 중심에 있어야 한다.</li>\n</ol>\n", "plain_len": 167, "type": "list", "rawIndex": 1}, {"title": "Page 02 · Questions", "body_md": "오늘 읽고 남길 질문:\n\n- 문화도시라는 이름은 실제 주민의 삶과 얼마나 연결되어 있는가?\n- 폐광의 기억은 브랜드가 되었을 때 무엇을 얻고 무엇을 잃는가?\n- 관광객에게 보여주는 문화와 지역 사람이 쓰는 문화는 같은가?\n- 영월의 문화광산은 어떤 기록을 더 남겨야 하는가?", "body_html": "<p>오늘 읽고 남길 질문:</p>\n<ul>\n<li>문화도시라는 이름은 실제 주민의 삶과 얼마나 연결되어 있는가?</li>\n<li>폐광의 기억은 브랜드가 되었을 때 무엇을 얻고 무엇을 잃는가?</li>\n<li>관광객에게 보여주는 문화와 지역 사람이 쓰는 문화는 같은가?</li>\n<li>영월의 문화광산은 어떤 기록을 더 남겨야 하는가?</li>\n</ul>\n", "plain_len": 144, "type": "archive", "rawIndex": 2}, {"title": "Page 03 · Editorial Checklist", "body_md": "문화광산형 콘텐츠를 만들 때 확인할 것:\n\n- 새로 만든 것보다 이미 있던 것을 먼저 본다.\n- 공간보다 사람의 말을 먼저 찾는다.\n- 예쁜 장면보다 남겨야 할 기록을 먼저 묻는다.\n- 관광객 동선과 주민 생활 동선이 어디서 만나는지 본다.\n- 사업 이름보다 사업 이후에 남는 것을 본다.", "body_html": "<p>문화광산형 콘텐츠를 만들 때 확인할 것:</p>\n<ul>\n<li>새로 만든 것보다 이미 있던 것을 먼저 본다.</li>\n<li>공간보다 사람의 말을 먼저 찾는다.</li>\n<li>예쁜 장면보다 남겨야 할 기록을 먼저 묻는다.</li>\n<li>관광객 동선과 주민 생활 동선이 어디서 만나는지 본다.</li>\n<li>사업 이름보다 사업 이후에 남는 것을 본다.</li>\n</ul>\n", "plain_len": 150, "type": "list", "rawIndex": 3}, {"title": "Page 04 · Next", "body_md": "내일은 생활인구로 넘어간다.\n\n문화가 도시의 언어를 바꾼다면, 생활인구는 도시의 숫자를 다시 보게 만든다. 주소를 둔 사람만 도시의 사람이 아니다. 자주 오고, 오래 머물고, 돈과 시간을 쓰고, 다시 찾아오는 사람도 도시의 일부가 될 수 있다.\n\n하지만 그 말은 어디까지 가능할까.\n\n---", "body_html": "<p>내일은 생활인구로 넘어간다.</p>\n<p>문화가 도시의 언어를 바꾼다면, 생활인구는 도시의 숫자를 다시 보게 만든다. 주소를 둔 사람만 도시의 사람이 아니다. 자주 오고, 오래 머물고, 돈과 시간을 쓰고, 다시 찾아오는 사람도 도시의 일부가 될 수 있다.</p>\n<p>하지만 그 말은 어디까지 가능할까.</p>\n<hr />\n", "plain_len": 155, "type": "essay", "rawIndex": 4}], "totalPages": 4}]}, {"date": "2026-05-08", "weekday": "금", "weekdayFull": "금요일", "no": "005", "titleLine": "2026-05-08 금요일 · No.005", "theme": "주소 밖의 사람들도 도시를 움직일 수 있는가", "note_html": "<aside class=\"note-card\"><strong>금요일의 역할</strong><p>금요일은 생활인구와 체류를 다룬다.<br />\n방문객 증가와 카드 소비를 다시 보되, 그것을 곧바로 정주 회복으로 과장하지 않는다.<br />\n핵심은 “방문 → 체류 → 재방문 → 관계”의 사다리다.</p>\n</aside>\n\n", "sections": [{"num": "01", "key": "Intro", "label": "Intro", "ko": "입구", "title": "주소는 없지만 흔적은 남기는 사람들", "short": "IN", "pages": [{"title": "Page 01 · Cover", "body_md": "도시를 생각할 때 우리는 자주 주소를 먼저 본다.\n\n이곳에 사는 사람이 몇 명인가. 몇 명이 떠났는가. 몇 명이 태어났는가. 행정은 이 숫자를 필요로 한다. 주민등록 인구는 도시의 기본 체력을 보여준다.\n\n하지만 여행자가 늘어나는 도시를 볼 때는 다른 숫자도 필요하다. 주소는 없지만 자주 오는 사람, 하루만 머물렀지만 밥을 먹고 시장에 들른 사람, 영화 때문에 왔다가 다시 오고 싶어진 사람, 어느 순간 그 도시를 자기 기억 안에 넣은 사람.\n\n이 사람들은 주민은 아니다. 하지만 완전히 바깥 사람도 아니다.", "body_html": "<p>도시를 생각할 때 우리는 자주 주소를 먼저 본다.</p>\n<p>이곳에 사는 사람이 몇 명인가. 몇 명이 떠났는가. 몇 명이 태어났는가. 행정은 이 숫자를 필요로 한다. 주민등록 인구는 도시의 기본 체력을 보여준다.</p>\n<p>하지만 여행자가 늘어나는 도시를 볼 때는 다른 숫자도 필요하다. 주소는 없지만 자주 오는 사람, 하루만 머물렀지만 밥을 먹고 시장에 들른 사람, 영화 때문에 왔다가 다시 오고 싶어진 사람, 어느 순간 그 도시를 자기 기억 안에 넣은 사람.</p>\n<p>이 사람들은 주민은 아니다. 하지만 완전히 바깥 사람도 아니다.</p>\n", "plain_len": 282, "type": "cover", "rawIndex": 1}, {"title": "Page 02 · Scene", "body_md": "금요일에는 이상하게 이동의 감각이 커진다.\n\n주말을 앞둔 사람들은 어디론가 가고 싶어진다. 기차표를 검색하고, 숙소를 보고, 식당을 저장한다. 영화 한 편을 보고 “저기 가볼까”라고 말하는 순간, 도시는 화면 밖으로 나온다.\n\n영월 관광 기차여행 상품이 출시되었다는 보도는 그래서 흥미롭다. 영화가 감정을 열고, 코레일과 영월군이 이동 경로를 만들고, 사람들은 청량리나 대전이나 부산에서 출발해 제천을 거쳐 영월로 들어간다.\n\n콘텐츠가 이동이 되는 순간이다.", "body_html": "<p>금요일에는 이상하게 이동의 감각이 커진다.</p>\n<p>주말을 앞둔 사람들은 어디론가 가고 싶어진다. 기차표를 검색하고, 숙소를 보고, 식당을 저장한다. 영화 한 편을 보고 “저기 가볼까”라고 말하는 순간, 도시는 화면 밖으로 나온다.</p>\n<p>영월 관광 기차여행 상품이 출시되었다는 보도는 그래서 흥미롭다. 영화가 감정을 열고, 코레일과 영월군이 이동 경로를 만들고, 사람들은 청량리나 대전이나 부산에서 출발해 제천을 거쳐 영월로 들어간다.</p>\n<p>콘텐츠가 이동이 되는 순간이다.</p>\n", "plain_len": 253, "type": "essay", "rawIndex": 2}, {"title": "Page 03 · Question", "body_md": "금요일의 질문은 이것이다.\n\n- 주소를 두지 않은 사람도 도시의 힘이 될 수 있는가?\n- 방문객의 소비는 지역의 실제 생활과 어떻게 연결되는가?\n- 하루 여행은 어떻게 체류로 바뀌는가?\n- 생활인구라는 말은 지역을 살리는 새로운 기준인가, 아니면 부족한 정주 인구를 덮는 말인가?\n\n나는 생활인구라는 말을 좋아하면서도 조심한다. 이 말은 지방도시를 더 넓게 볼 수 있게 해준다. 동시에 너무 편리하게 쓰이면 정주 인구 감소라는 어려운 문제를 가릴 수도 있다.", "body_html": "<p>금요일의 질문은 이것이다.</p>\n<ul>\n<li>주소를 두지 않은 사람도 도시의 힘이 될 수 있는가?</li>\n<li>방문객의 소비는 지역의 실제 생활과 어떻게 연결되는가?</li>\n<li>하루 여행은 어떻게 체류로 바뀌는가?</li>\n<li>생활인구라는 말은 지역을 살리는 새로운 기준인가, 아니면 부족한 정주 인구를 덮는 말인가?</li>\n</ul>\n<p>나는 생활인구라는 말을 좋아하면서도 조심한다. 이 말은 지방도시를 더 넓게 볼 수 있게 해준다. 동시에 너무 편리하게 쓰이면 정주 인구 감소라는 어려운 문제를 가릴 수도 있다.</p>\n", "plain_len": 246, "type": "list", "rawIndex": 3}, {"title": "Page 04 · Bridge", "body_md": "영월은 지금 이 질문의 좋은 사례다.\n\n2026년 1분기 방문객과 카드 소비가 늘었다. 영화 관련 관광 상품도 나왔다. 청령포와 장릉의 발걸음도 크게 늘었다. 하지만 이 모든 것이 곧바로 도시 회복을 뜻하지는 않는다.\n\n중요한 것은 다음 단계다.\n\n방문객이 영월에서 시간을 더 쓰고, 장소를 더 넓게 보고, 다시 오고, 지역의 생활과 느슨하게 연결될 수 있는가.", "body_html": "<p>영월은 지금 이 질문의 좋은 사례다.</p>\n<p>2026년 1분기 방문객과 카드 소비가 늘었다. 영화 관련 관광 상품도 나왔다. 청령포와 장릉의 발걸음도 크게 늘었다. 하지만 이 모든 것이 곧바로 도시 회복을 뜻하지는 않는다.</p>\n<p>중요한 것은 다음 단계다.</p>\n<p>방문객이 영월에서 시간을 더 쓰고, 장소를 더 넓게 보고, 다시 오고, 지역의 생활과 느슨하게 연결될 수 있는가.</p>\n", "plain_len": 199, "type": "essay", "rawIndex": 4}], "totalPages": 4}, {"num": "02", "key": "Issue", "label": "Issue", "ko": "쟁점", "title": "방문은 시작이고 체류는 다른 문제다", "short": "IS", "pages": [{"title": "Page 01 · Cover", "body_md": "방문객 수는 도시를 들뜨게 만든다.\n\n많이 왔다는 말은 힘이 있다. 기사가 되고, 행정의 성과가 되고, 상권의 기대가 된다. 하지만 방문객 수는 언제나 첫 번째 숫자일 뿐이다.\n\n그 다음 숫자가 더 어렵다.\n\n얼마나 머물렀는가. 어디서 돈을 썼는가. 무엇을 보고 떠났는가. 다시 올 마음이 생겼는가. 지역 사람에게 피해를 주지는 않았는가. 특정 장소에만 사람이 몰리고 다른 곳은 그대로 비어 있지는 않은가.\n\n방문은 시작이고, 체류는 다른 문제다.", "body_html": "<p>방문객 수는 도시를 들뜨게 만든다.</p>\n<p>많이 왔다는 말은 힘이 있다. 기사가 되고, 행정의 성과가 되고, 상권의 기대가 된다. 하지만 방문객 수는 언제나 첫 번째 숫자일 뿐이다.</p>\n<p>그 다음 숫자가 더 어렵다.</p>\n<p>얼마나 머물렀는가. 어디서 돈을 썼는가. 무엇을 보고 떠났는가. 다시 올 마음이 생겼는가. 지역 사람에게 피해를 주지는 않았는가. 특정 장소에만 사람이 몰리고 다른 곳은 그대로 비어 있지는 않은가.</p>\n<p>방문은 시작이고, 체류는 다른 문제다.</p>\n", "plain_len": 246, "type": "cover", "rawIndex": 1}, {"title": "Page 02 · Data Revisited", "body_md": "KCTI와 관련 보도에 따르면 2026년 1분기 영월의 외지인 카드 소비는 약 172억 원으로 전년 동기 대비 13.2% 증가했다. 개봉 전 4주 동안 감소하던 소비가 개봉 후 4주 동안 증가로 돌아섰다는 점도 중요하게 제시되었다.\n\n이 수치가 흥미로운 이유는 단지 돈이 늘어서가 아니다. 영화가 실제 이동과 소비를 만들었다는 점 때문이다. 사람들은 영화를 보고 끝내지 않았다. 장소로 이동했고, 돈과 시간을 썼다.\n\n> [!note] 자료 기준\n> 외지인 방문객, 카드 소비, 개봉 전후 소비 변화는 KCTI 데이터 포커스와 보도자료를 기준으로 정리했다. 자료 ID: R-02, R-03, R-04.", "body_html": "<p>KCTI와 관련 보도에 따르면 2026년 1분기 영월의 외지인 카드 소비는 약 172억 원으로 전년 동기 대비 13.2% 증가했다. 개봉 전 4주 동안 감소하던 소비가 개봉 후 4주 동안 증가로 돌아섰다는 점도 중요하게 제시되었다.</p>\n<p>이 수치가 흥미로운 이유는 단지 돈이 늘어서가 아니다. 영화가 실제 이동과 소비를 만들었다는 점 때문이다. 사람들은 영화를 보고 끝내지 않았다. 장소로 이동했고, 돈과 시간을 썼다.</p>\n<aside class=\"note-card\"><strong>자료 기준</strong><p>외지인 방문객, 카드 소비, 개봉 전후 소비 변화는 KCTI 데이터 포커스와 보도자료를 기준으로 정리했다. 자료 ID: R-02, R-03, R-04.</p>\n</aside>\n\n", "plain_len": 328, "type": "essay", "rawIndex": 2}, {"title": "Page 03 · Visitor Ladder", "body_md": "```text\n관심\n→ 검색\n→ 방문\n→ 소비\n→ 체류\n→ 재방문\n→ 관계\n```\n\n대부분의 지역 관광은 `방문`과 `소비`에서 멈춘다. 여기까지도 어렵다. 하지만 지역의 장기적인 힘은 그 다음에서 나온다.\n\n체류가 생기면 숙소와 밤의 동선이 중요해진다. 재방문이 생기면 계절별 콘텐츠가 필요해진다. 관계가 생기면 사람은 그 도시를 단순 여행지가 아니라 자기 삶의 느슨한 일부로 느낀다.\n\n영월의 과제는 이 사다리를 얼마나 길게 만들 수 있느냐에 있다.", "body_html": "<pre><code class=\"language-text\">관심\n→ 검색\n→ 방문\n→ 소비\n→ 체류\n→ 재방문\n→ 관계\n</code></pre>\n<p>대부분의 지역 관광은 <code>방문</code>과 <code>소비</code>에서 멈춘다. 여기까지도 어렵다. 하지만 지역의 장기적인 힘은 그 다음에서 나온다.</p>\n<p>체류가 생기면 숙소와 밤의 동선이 중요해진다. 재방문이 생기면 계절별 콘텐츠가 필요해진다. 관계가 생기면 사람은 그 도시를 단순 여행지가 아니라 자기 삶의 느슨한 일부로 느낀다.</p>\n<p>영월의 과제는 이 사다리를 얼마나 길게 만들 수 있느냐에 있다.</p>\n", "plain_len": 202, "type": "diagram", "rawIndex": 3}, {"title": "Page 04 · The Risk of Short Heat", "body_md": "짧은 열기는 지역을 지치게 할 수도 있다.\n\n사람이 갑자기 몰리면 안전 문제가 생긴다. 주차와 교통, 대기줄, 쓰레기, 특정 상권 쏠림이 발생할 수 있다. 장소는 유명해졌지만 지역 사람의 일상은 불편해질 수도 있다.\n\n또 하나의 문제는 유행이 지나간 뒤다. 영화의 열기가 식으면 방문객이 줄어들 수 있다. 이때 지역에 남는 것이 없다면, 도시는 잠깐 반짝인 기억만 갖게 된다.\n\n그래서 방문객 증가를 볼 때는 기쁨과 동시에 질문이 필요하다.", "body_html": "<p>짧은 열기는 지역을 지치게 할 수도 있다.</p>\n<p>사람이 갑자기 몰리면 안전 문제가 생긴다. 주차와 교통, 대기줄, 쓰레기, 특정 상권 쏠림이 발생할 수 있다. 장소는 유명해졌지만 지역 사람의 일상은 불편해질 수도 있다.</p>\n<p>또 하나의 문제는 유행이 지나간 뒤다. 영화의 열기가 식으면 방문객이 줄어들 수 있다. 이때 지역에 남는 것이 없다면, 도시는 잠깐 반짝인 기억만 갖게 된다.</p>\n<p>그래서 방문객 증가를 볼 때는 기쁨과 동시에 질문이 필요하다.</p>\n", "plain_len": 243, "type": "essay", "rawIndex": 4}, {"title": "Page 05 · What to Build", "body_md": "영월이 방문을 체류로 바꾸려면 세 가지가 필요하다.\n\n1. **넓은 동선**  \n   청령포와 장릉에 몰린 관심을 한반도지형, 시장, 별마로천문대, 문화 공간으로 분산해야 한다.\n\n2. **느린 해석**  \n   영화 촬영지 안내만으로 끝내지 말고 단종 기억, 지형, 문화광산을 함께 읽게 해야 한다.\n\n3. **반복 이유**  \n   봄의 단종, 여름의 동강, 가을의 산과 사진, 겨울의 별처럼 계절별 재방문 이유가 필요하다.", "body_html": "<p>영월이 방문을 체류로 바꾸려면 세 가지가 필요하다.</p>\n<ol>\n<li><p><strong>넓은 동선</strong><br />\n청령포와 장릉에 몰린 관심을 한반도지형, 시장, 별마로천문대, 문화 공간으로 분산해야 한다.</p>\n</li>\n<li><p><strong>느린 해석</strong><br />\n영화 촬영지 안내만으로 끝내지 말고 단종 기억, 지형, 문화광산을 함께 읽게 해야 한다.</p>\n</li>\n<li><p><strong>반복 이유</strong><br />\n봄의 단종, 여름의 동강, 가을의 산과 사진, 겨울의 별처럼 계절별 재방문 이유가 필요하다.</p>\n</li>\n</ol>\n", "plain_len": 209, "type": "list", "rawIndex": 5}, {"title": "Page 06 · Bridge", "body_md": "생활인구는 도시를 구원하는 마법의 말이 아니다.\n\n하지만 지방도시를 주민등록 인구 하나로만 읽지 않게 해주는 중요한 말이다. 주소를 둔 사람과 주소 밖의 사람이 함께 도시의 시간을 만든다. 이 둘을 서로 경쟁시키지 않고 연결할 수 있을 때, 영월의 가능성은 더 현실적으로 보인다.\n\n이제 이 말을 조금 더 깊게 해석해보자.", "body_html": "<p>생활인구는 도시를 구원하는 마법의 말이 아니다.</p>\n<p>하지만 지방도시를 주민등록 인구 하나로만 읽지 않게 해주는 중요한 말이다. 주소를 둔 사람과 주소 밖의 사람이 함께 도시의 시간을 만든다. 이 둘을 서로 경쟁시키지 않고 연결할 수 있을 때, 영월의 가능성은 더 현실적으로 보인다.</p>\n<p>이제 이 말을 조금 더 깊게 해석해보자.</p>\n", "plain_len": 178, "type": "essay", "rawIndex": 6}], "totalPages": 6}, {"num": "03", "key": "Insight", "label": "Insight", "ko": "해석", "title": "생활인구는 관계의 깊이를 묻는 말이다", "short": "SG", "pages": [{"title": "Page 01 · Concept", "body_md": "생활인구는 쉽게 말해 “주소지는 없지만 그 지역과 생활 관계를 맺는 사람들”이다.\n\n자주 방문하는 사람, 일 때문에 오가는 사람, 주말마다 머무는 사람, 여행을 반복하는 사람, 지역에 소비와 시간을 남기는 사람. 이 사람들은 주민등록표에는 잡히지 않지만, 지역의 실제 흐름에는 영향을 준다.\n\n이 개념은 지방도시를 조금 더 현실적으로 보게 해준다. 사람들은 이제 한 곳에만 살지 않는다. 일, 여행, 가족, 취향, 배움 때문에 여러 지역을 오간다. 도시는 이 흐름을 읽어야 한다.", "body_html": "<p>생활인구는 쉽게 말해 “주소지는 없지만 그 지역과 생활 관계를 맺는 사람들”이다.</p>\n<p>자주 방문하는 사람, 일 때문에 오가는 사람, 주말마다 머무는 사람, 여행을 반복하는 사람, 지역에 소비와 시간을 남기는 사람. 이 사람들은 주민등록표에는 잡히지 않지만, 지역의 실제 흐름에는 영향을 준다.</p>\n<p>이 개념은 지방도시를 조금 더 현실적으로 보게 해준다. 사람들은 이제 한 곳에만 살지 않는다. 일, 여행, 가족, 취향, 배움 때문에 여러 지역을 오간다. 도시는 이 흐름을 읽어야 한다.</p>\n", "plain_len": 266, "type": "essay", "rawIndex": 1}, {"title": "Page 02 · But Not a Substitute", "body_md": "하지만 생활인구는 정주 인구의 대체물이 아니다.\n\n이 점을 분명히 해야 한다. 외지인
