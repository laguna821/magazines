<script id="magazine-data" type="application/json">{"summary": {"title": "Achmage Society Magazine", "volume": "Volume 004", "publisher": "Achmage", "concept": "오얏꽃과 길동무", "period": "2026-05-26 ~ 2026-06-01", "leadPlace": "SUNO 크리에이티브 아키텍쳐링 — 한 주의 두 앨범", "pageCount": 175, "sectionCount": 35}, "front_html": "<h2>오얏꽃과 길동무</h2><p>### SUNO 크리에이티브 아키텍쳐링 — 한 주에 발매한 두 앨범</p>\n<p>발행: <strong>2026-06-02</strong> (화) 기간: 2026-05-26(월) ~ 06-01(일)</p>\n<p>---</p>", "sources_html": "<section class=\"sources\"><h2>Sources</h2><p>### 안창현 본인 자산</p>\n<ul><li><strong>오얏꽃 사계 (李花四季) · Achmage's Joseon Jazz Vol.1</strong> — <a href=\"https://laguna821.github.io/Suno_albums/ihwa-sagye/\" target=\"_blank\" rel=\"noopener\">laguna821.github.io/Suno_albums/ihwa-sagye/</a></li><li><strong>나를 꽃이라 부르지 마오 (玄) · Achmage's Joseon Jazz Vol.2</strong> — <a href=\"https://laguna821.github.io/Suno_albums/kkot-bureuji-mao/\" target=\"_blank\" rel=\"noopener\">laguna821.github.io/Suno_albums/kkot-bureuji-mao/</a></li><li><strong>SUNO 활용법 특강 1부</strong> — <a href=\"https://youtu.be/67ZIWNanF4U\" target=\"_blank\" rel=\"noopener\">youtu.be/67ZIWNanF4U</a></li><li><strong>SUNO 활용법 특강 2부</strong> — <a href=\"https://youtu.be/WHs8mIwBlJc\" target=\"_blank\" rel=\"noopener\">youtu.be/WHs8mIwBlJc</a></li><li><strong>SUNO 활용법 특강 3부</strong> — <a href=\"https://youtu.be/o8xf1AbSk8M\" target=\"_blank\" rel=\"noopener\">youtu.be/o8xf1AbSk8M</a></li></ul>\n<p>### 도구</p>\n<ul><li>Suno 5.5 (<a href=\"https://suno.com/\" target=\"_blank\" rel=\"noopener\">suno.com</a>) — 음원 생성</li><li>Claude Skills (joseon-jazz-album skill, 본인 제작) — 콘셉트 → 곡명 → 가사 → 사이트 오케스트레이션</li><li>GitHub Pages — 사이트 호스팅</li></ul>\n<p>### 사실관계 출처 (KILLING POINT 5필드)</p>\n<table><thead><tr><th>ID</th><th>사실</th><th>매체 / 저자</th><th>날짜</th><th>인용</th></tr></thead><tbody><tr><td><strong>R-J01</strong></td><td>현계옥 — 1896년 밀양, 17세 대구기생, 1920년 상하이 의열단 가입, 1932년 외몽골 행적 불명</td><td>한국민족문화대백과사전 항목 E0081152 (한국학중앙연구원)</td><td>백과사전 표제 항목</td><td>\"여성으로서는 유일하게 의열단에 가입\"</td></tr><tr><td><strong>R-J02</strong></td><td>코리안재즈밴드 1928년 3월 결성, 9인조 (백명곤·홍난파·이철), 1928년 4월 첫 공연, 1932년 봄 활동 종료</td><td>한국경제 / 이준희 대중문화 평론가</td><td>2026-03-17</td><td>\"한국 최초 재즈밴드 '코리안재즈밴드' 결성 — 1928년 3월경\"</td></tr><tr><td><strong>R-J03</strong></td><td>일제강점기 재즈 — 1920년대 유입 → 1940년 적성국 음악 금지령 단절, 3단계 (생성기·발전기·쇠퇴기)</td><td>남예지, 「대중음악」 vol.33 (한국대중음악학회)</td><td>2024</td><td>pp.135-177</td></tr><tr><td><strong>R-J04</strong></td><td>\"100년 전, 조선 재즈 밴드가 있었다\" — 남예지 출연 영상</td><td>남예지 유튜브 채널</td><td>(5/30 19:42 더배러 단톡 인용)</td><td><a href=\"https://www.youtube.com/watch?v=iUp0ioXzHiY\" target=\"_blank\" rel=\"noopener\">youtu.be/iUp0ioXzHiY</a></td></tr><tr><td><strong>R-J05</strong></td><td>1929년 11월 복혜숙 첫 조선인 재즈송 녹음, 1930년 1월 발매</td><td>한국경제 / 이준희</td><td>2026-03-17</td><td>\"복혜숙(영화배우)이 일본 악단 반주로 종로 행진곡 등 4곡 녹음\"</td></tr><tr><td><strong>R-J06</strong></td><td>현계옥 핵심 대사 원형</td><td>영화 〈밀정〉 '연계순'(한지민) 모델</td><td>—</td><td>\"나를 애인으로 혹은 한 여자로만 보지 말고 같은 동지로 생각해 달라\"</td></tr></tbody></table></section>", "days": [{"date": "2026-05-26", "weekday": "월", "weekdayFull": "월요일", "no": "001", "titleLine": "어느 토요일 저녁의 발화", "theme": "어느 토요일 저녁의 발화", "note_html": "", "sections": [{"num": "01", "key": "intro", "label": "INTRO", "ko": "도입", "title": "한 주의 시작점", "short": "한 주의 시작점", "pages": [{"title": "토요일 저녁 5시 35분", "body_md": "토요일 저녁이었다. 시계가 다섯 시 삼십오 분을 가리키고 있었다. 평범한 한 주말의 한 저녁이 다른 한 저녁이 된 시점이다. 더배러 단톡에 한 줄의 링크를 던지기 직전, 나는 한 사이트를 한 번 더 새로고침해서 확인했다. 사이트는 정상이었다. 15곡이 다 거기 있었다.", "body_html": "<p>토요일 저녁이었다. 시계가 다섯 시 삼십오 분을 가리키고 있었다. 평범한 한 주말의 한 저녁이 다른 한 저녁이 된 시점이다. 더배러 단톡에 한 줄의 링크를 던지기 직전, 나는 한 사이트를 한 번 더 새로고침해서 확인했다. 사이트는 정상이었다. 15곡이 다 거기 있었다.</p>", "plain_len": 111, "type": "page", "rawIndex": 1}, {"title": "단톡에 던진 한 줄", "body_md": "> *[ACH_안창현] [오후 5:35] https://laguna821.github.io/Suno_albums/ihwa-sagye/*\n\n링크를 던지고 한 줄을 더 적었다.\n\n> *[ACH_안창현] [오후 5:36] 조선 재즈 앨범 발매 스킬스를 클로드 스킬스로 만들어서 앨범 15곡 생성 + 웹사이트 제작 및 업로드까지 했습니다*", "body_html": "<blockquote><p><em>[ACH_안창현] [오후 5:35] https://laguna821.github.io/Suno_albums/ihwa-sagye/</em></p></blockquote>\n<p>링크를 던지고 한 줄을 더 적었다.</p>\n<blockquote><p><em>[ACH_안창현] [오후 5:36] 조선 재즈 앨범 발매 스킬스를 클로드 스킬스로 만들어서 앨범 15곡 생성 + 웹사이트 제작 및 업로드까지 했습니다</em></p></blockquote>", "plain_len": 152, "type": "page", "rawIndex": 2}, {"title": "\"쉬시면서 주말 잘 보내세요\"", "body_md": "세 번째 줄은 한 인사였다.\n\n> *[ACH_안창현] [오후 5:36] 쉬시면서 주말 잘 보내세요~*\n\n이게 그날 저녁의 한 장면이었다. 한 손에는 앨범 한 장, 다른 한 손에는 단톡에 던지는 인사. 별 일 아닌 한 줄이었다. 그러나 같은 날 밤이 끝나기 전에 두 번째 앨범이 또 한 사이트로 올라가게 될 줄은 그 분에는 몰랐다.", "body_html": "<p>세 번째 줄은 한 인사였다.</p>\n<blockquote><p><em>[ACH_안창현] [오후 5:36] 쉬시면서 주말 잘 보내세요~</em></p></blockquote>\n<p>이게 그날 저녁의 한 장면이었다. 한 손에는 앨범 한 장, 다른 한 손에는 단톡에 던지는 인사. 별 일 아닌 한 줄이었다. 그러나 같은 날 밤이 끝나기 전에 두 번째 앨범이 또 한 사이트로 올라가게 될 줄은 그 분에는 몰랐다.</p>", "plain_len": 131, "type": "page", "rawIndex": 3}, {"title": "그 한 줄에 도달한 며칠", "body_md": "며칠 전부터 [Suno 5.5](https://suno.com/)에 손을 대보고 있었다. 텍스트를 입력하면 음악이 나온다. 가사를 입력하면 노래가 나온다. 결과는 놀랍다. 누구나 첫 번째 시도에서 한 곡을 뽑을 수 있다.\n\n그러나 곡 하나를 만드는 것 자체는 — 솔직히 — 그렇게 흥미롭지 않았다. 흥미로운 건 다른 자리에 있었다.", "body_html": "<p>며칠 전부터 <a href=\"https://suno.com/\" target=\"_blank\" rel=\"noopener\">Suno 5.5</a>에 손을 대보고 있었다. 텍스트를 입력하면 음악이 나온다. 가사를 입력하면 노래가 나온다. 결과는 놀랍다. 누구나 첫 번째 시도에서 한 곡을 뽑을 수 있다.</p>\n<p>그러나 곡 하나를 만드는 것 자체는 — 솔직히 — 그렇게 흥미롭지 않았다. 흥미로운 건 다른 자리에 있었다.</p>", "plain_len": 142, "type": "page", "rawIndex": 4}, {"title": "한 주의 한 질문", "body_md": "매거진 4호의 한 주가 한 질문 위에 서 있다.\n\n> *\"곡 한 곡 만드는 자동화가 아니라, 한 콘셉트로 묶인 15곡 + 사이트 한 개가 한 흐름으로 나오는 것은 가능한가?\"*\n\n이 한 질문에 한 주 동안 손을 대본 결과가 이 매거진이다. 답은 단톡에 두 번 던진 링크에 이미 들어 있다. 그 답을 풀어낸 한 주를 이제 시작한다.", "body_html": "<p>매거진 4호의 한 주가 한 질문 위에 서 있다.</p>\n<blockquote><p><em>\"곡 한 곡 만드는 자동화가 아니라, 한 콘셉트로 묶인 15곡 + 사이트 한 개가 한 흐름으로 나오는 것은 가능한가?\"</em></p></blockquote>\n<p>이 한 질문에 한 주 동안 손을 대본 결과가 이 매거진이다. 답은 단톡에 두 번 던진 링크에 이미 들어 있다. 그 답을 풀어낸 한 주를 이제 시작한다.</p>", "plain_len": 127, "type": "page", "rawIndex": 5}], "totalPages": 5}, {"num": "02", "key": "issue", "label": "ISSUE", "ko": "쟁점", "title": "노래 단위 자동화는 왜 흥미롭지 않은가", "short": "노래 단위 자동화는 왜 흥미롭지 않은가", "pages": [{"title": "Suno에 가사 한 줄을 던지는 일", "body_md": "Suno에 들어가서 가사 한 줄을 던지면 한 곡이 나온다. 입력은 단순하다. 장르 한 단어, 분위기 한 단어, 가사 한 문단. 결과는 1분짜리 한 곡. 누구나 한 번 해보고 놀란다.", "body_html": "<p>Suno에 들어가서 가사 한 줄을 던지면 한 곡이 나온다. 입력은 단순하다. 장르 한 단어, 분위기 한 단어, 가사 한 문단. 결과는 1분짜리 한 곡. 누구나 한 번 해보고 놀란다.</p>", "plain_len": 73, "type": "page", "rawIndex": 1}, {"title": "결과는 놀랍다 — 그러나 다음 날에는?", "body_md": "문제는 그 다음 날이다. 다음 날 같은 곡을 다시 듣지 않는다. 한 번 듣고 끝났기 때문이다. 그 곡은 한 만남의 한 결과지 한 작품이 아니다. 한 결과는 한 번의 즐거움이지만 한 작품은 다른 한 자리를 차지한다.", "body_html": "<p>문제는 그 다음 날이다. 다음 날 같은 곡을 다시 듣지 않는다. 한 번 듣고 끝났기 때문이다. 그 곡은 한 만남의 한 결과지 한 작품이 아니다. 한 결과는 한 번의 즐거움이지만 한 작품은 다른 한 자리를 차지한다.</p>", "plain_len": 84, "type": "page", "rawIndex": 2}, {"title": "한 곡짜리 자동화의 한계", "body_md": "한 곡짜리 자동화의 한계가 거기 있다. 자동화의 단위와 결과의 무게가 같지 않다. 한 곡 자동화는 한 번의 결과, 한 번의 들음, 한 번의 놀라움으로 끝난다. 한 번이 한 번을 넘어가지 못한다.", "body_html": "<p>한 곡짜리 자동화의 한계가 거기 있다. 자동화의 단위와 결과의 무게가 같지 않다. 한 곡 자동화는 한 번의 결과, 한 번의 들음, 한 번의 놀라움으로 끝난다. 한 번이 한 번을 넘어가지 못한다.</p>", "plain_len": 78, "type": "page", "rawIndex": 3}, {"title": "다섯 곡까지의 같은 한계", "body_md": "다섯 곡까지도 같은 한계가 있다. 다섯 곡을 같은 방식으로 만들 수 있다. 그러나 다섯 곡을 차례로 들어도 — 다섯 번의 한 번씩일 뿐이다. 다섯 곡 사이에 한 줄로 묶일 것이 없으면, 다섯 곡은 한 EP가 되지 않는다.", "body_html": "<p>다섯 곡까지도 같은 한계가 있다. 다섯 곡을 같은 방식으로 만들 수 있다. 그러나 다섯 곡을 차례로 들어도 — 다섯 번의 한 번씩일 뿐이다. 다섯 곡 사이에 한 줄로 묶일 것이 없으면, 다섯 곡은 한 EP가 되지 않는다.</p>", "plain_len": 87, "type": "page", "rawIndex": 4}, {"title": "그 다음의 한 발자국", "body_md": "그래서 한 발자국이 필요했다. 한 곡 자동화가 아니라 한 앨범 자동화. 한 번의 결과가 아니라 한 세계관. 그 다음의 한 발자국에 손을 대보기로 한 게 그 한 주의 한 시작이었다.", "body_html": "<p>그래서 한 발자국이 필요했다. 한 곡 자동화가 아니라 한 앨범 자동화. 한 번의 결과가 아니라 한 세계관. 그 다음의 한 발자국에 손을 대보기로 한 게 그 한 주의 한 시작이었다.</p>", "plain_len": 71, "type": "page", "rawIndex": 5}], "totalPages": 5}, {"num": "03", "key": "insight", "label": "INSIGHT", "ko": "통찰", "title": "한 곡과 한 앨범 사이", "short": "한 곡과 한 앨범 사이", "pages": [{"title": "한 곡 = 한 들음의 즐거움", "body_md": "한 곡은 한 들음으로 끝나는 단위다. 한 번 듣는다. 좋다. 한 번 더 듣는다. 좋다. 며칠이 지나면 잊는다. 그게 한 곡의 결이다. 잊혀도 별 일 아니다 — 다시 만들면 되니까.", "body_html": "<p>한 곡은 한 들음으로 끝나는 단위다. 한 번 듣는다. 좋다. 한 번 더 듣는다. 좋다. 며칠이 지나면 잊는다. 그게 한 곡의 결이다. 잊혀도 별 일 아니다 — 다시 만들면 되니까.</p>", "plain_len": 71, "type": "page", "rawIndex": 1}, {"title": "한 앨범 = 한 세계관", "body_md": "한 앨범은 다르다. 한 앨범은 한 세계관이 한 시간 동안 한 사람 옆에 있는 일이다. 한 트랙이 다음 트랙으로 넘어가는 사이에 한 호흡이 있다. 그 호흡이 한 분위기의 한 두께를 만든다.", "body_html": "<p>한 앨범은 다르다. 한 앨범은 한 세계관이 한 시간 동안 한 사람 옆에 있는 일이다. 한 트랙이 다음 트랙으로 넘어가는 사이에 한 호흡이 있다. 그 호흡이 한 분위기의 한 두께를 만든다.</p>", "plain_len": 74, "type": "page", "rawIndex": 2}, {"title": "한 세계관이 한 한 시간을 만든다", "body_md": "한 세계관은 한 시간을 만든다. 출근길의 한 시간, 산책의 한 시간, 잠들기 전의 한 시간. 그 한 시간 동안 한 사람의 한 자리가 그 한 앨범의 한 자리로 바뀐다. 한 곡짜리 자동화로는 만들 수 없는 한 시간이다.", "body_html": "<p>한 세계관은 한 시간을 만든다. 출근길의 한 시간, 산책의 한 시간, 잠들기 전의 한 시간. 그 한 시간 동안 한 사람의 한 자리가 그 한 앨범의 한 자리로 바뀐다. 한 곡짜리 자동화로는 만들 수 없는 한 시간이다.</p>", "plain_len": 84, "type": "page", "rawIndex": 3}, {"title": "한 한 시간이 일주일이 된다", "body_md": "한 시간이 일주일이 된다. 한 앨범을 한 주 동안 다시 듣는다. 그 한 주가 한 달이 된다. 그 한 달이 한 분기가 된다. 한 앨범이 한 사람의 한 분기를 함께 한다. 한 곡 자동화로는 절대 도달하지 못하는 거리다.", "body_html": "<p>한 시간이 일주일이 된다. 한 앨범을 한 주 동안 다시 듣는다. 그 한 주가 한 달이 된다. 그 한 달이 한 분기가 된다. 한 앨범이 한 사람의 한 분기를 함께 한다. 한 곡 자동화로는 절대 도달하지 못하는 거리다.</p>", "plain_len": 83, "type": "page", "rawIndex": 4}, {"title": "곡 하나가 아니라 그 곡이 살아갈 세계", "body_md": "그러니까 곡 하나를 만드는 게 아니다. 그 곡이 살아갈 한 세계를 만드는 일이다. 그게 한 곡 자동화와 한 앨범 자동화 사이의 한 발자국이고, 그 한 발자국이 한 주의 한 매거진을 만들어냈다.", "body_html": "<p>그러니까 곡 하나를 만드는 게 아니다. 그 곡이 살아갈 한 세계를 만드는 일이다. 그게 한 곡 자동화와 한 앨범 자동화 사이의 한 발자국이고, 그 한 발자국이 한 주의 한 매거진을 만들어냈다.</p>", "plain_len": 77, "type": "page", "rawIndex": 5}], "totalPages": 5}, {"num": "04", "key": "case", "label": "CASE", "ko": "사례", "title": "Suno 5.5 첫 손길 / 며칠간의 실험", "short": "Suno 5.5 첫 손길 / 며칠간의 실험", "pages": [{"title": "5월 26일 월요일 — Suno 첫 가입", "body_md": "월요일 저녁에 처음 Suno에 가입했다. 첫 곡을 만들어봤다. 결과는 놀랍게 좋았다. 두 번째 곡도 만들어봤다. 좋았다. 세 번째까지 갔다. 다 좋았다.", "body_html": "<p>월요일 저녁에 처음 Suno에 가입했다. 첫 곡을 만들어봤다. 결과는 놀랍게 좋았다. 두 번째 곡도 만들어봤다. 좋았다. 세 번째까지 갔다. 다 좋았다.</p>", "plain_len": 65, "type": "page", "rawIndex": 1}, {"title": "5월 27~28일 — 첫 곡들의 흩어짐", "body_md": "화요일과 수요일에 곡을 다섯 곡쯤 더 만들어봤다. 각 곡은 좋았는데, 다 들으면 한 자리에 모이지 않았다. 한 곡은 1930년대 분위기, 다른 곡은 2025년 분위기, 또 다른 곡은 1970년대 분위기 — 같은 사람이 만든 같은 도구의 결과인데도 한 묶음이 안 됐다.", "body_html": "<p>화요일과 수요일에 곡을 다섯 곡쯤 더 만들어봤다. 각 곡은 좋았는데, 다 들으면 한 자리에 모이지 않았다. 한 곡은 1930년대 분위기, 다른 곡은 2025년 분위기, 또 다른 곡은 1970년대 분위기 — 같은 사람이 만든 같은 도구의 결과인데도 한 묶음이 안 됐다.</p>", "plain_len": 110, "type": "page", "rawIndex": 2}, {"title": "콘셉트 없는 자동화의 결과", "body_md": "콘셉트 없이 만든 다섯 곡의 풍경이 그랬다. 다섯 번의 한 번씩. 다섯 번의 즐거움. 그러나 다섯 번이 모여서 한 한 시간이 되지는 않았다. 자동화의 단위가 한 곡인 게 거기 드러났다.", "body_html": "<p>콘셉트 없이 만든 다섯 곡의 풍경이 그랬다. 다섯 번의 한 번씩. 다섯 번의 즐거움. 그러나 다섯 번이 모여서 한 한 시간이 되지는 않았다. 자동화의 단위가 한 곡인 게 거기 드러났다.</p>", "plain_len": 74, "type": "page", "rawIndex": 3}, {"title": "콘셉트가 있어야 한 한 깨달음", "body_md": "목요일 저녁에 한 가지가 명료해졌다. 콘셉트가 먼저 있어야 곡이 흐른다. 다섯 곡을 만든 다음에 \"이것은 한 앨범이다\"라고 선언한다고 앨범이 되지는 않는다. 콘셉트가 먼저, 곡이 다음, 그 다음에 앨범이 된다.", "body_html": "<p>목요일 저녁에 한 가지가 명료해졌다. 콘셉트가 먼저 있어야 곡이 흐른다. 다섯 곡을 만든 다음에 \"이것은 한 앨범이다\"라고 선언한다고 앨범이 되지는 않는다. 콘셉트가 먼저, 곡이 다음, 그 다음에 앨범이 된다.</p>", "plain_len": 89, "type": "page", "rawIndex": 4}, {"title": "결심한 한 가지", "body_md": "그래서 결심한 한 가지가 있었다. 콘셉트 한 줄을 먼저 잡자. 그 한 줄에서 15곡을 뽑자. 15곡을 한 사이트에 묶자. 한 흐름으로 굴러가게 하자. 그 결심이 토요일 저녁의 한 사이트로 끝났다.", "body_html": "<p>그래서 결심한 한 가지가 있었다. 콘셉트 한 줄을 먼저 잡자. 그 한 줄에서 15곡을 뽑자. 15곡을 한 사이트에 묶자. 한 흐름으로 굴러가게 하자. 그 결심이 토요일 저녁의 한 사이트로 끝났다.</p>", "plain_len": 80, "type": "page", "rawIndex": 5}], "totalPages": 5}, {"num": "05", "key": "archive", "label": "ARCHIVE", "ko": "자료", "title": "토요일 0시 47분, 옵시디언 노트의 시작", "short": "토요일 0시 47분, 옵시디언 노트의 시작", "pages": [{"title": "그 노트의 제목 한 줄", "body_md": "토요일 저녁에 첫 앨범이 사이트에 올라간 다음 — 같은 날 밤이 끝나기 전에 두 번째 앨범도 올라갔다. 다음 날 일요일 새벽 0시 47분, 옵시디언을 열었다. 새 노트를 만들고 제목을 적었다.\n\n> *\"오얏꽃과 길동무 — 한 주에 한 앨범, 사실은 두 앨범\"*", "body_html": "<p>토요일 저녁에 첫 앨범이 사이트에 올라간 다음 — 같은 날 밤이 끝나기 전에 두 번째 앨범도 올라갔다. 다음 날 일요일 새벽 0시 47분, 옵시디언을 열었다. 새 노트를 만들고 제목을 적었다.</p>\n<blockquote><p><em>\"오얏꽃과 길동무 — 한 주에 한 앨범, 사실은 두 앨범\"</em></p></blockquote>", "plain_len": 104, "type": "page", "rawIndex": 1}, {"title": "그 노트 안의 한 시간", "body_md": "노트 안에 한 시간 동안 한 줄씩 적었다. 어떤 한 줄은 자동화 메서드에 대한 것이었다. 어떤 한 줄은 콘셉트 두께에 대한 것이었다. 어떤 한 줄은 5월 30일 토요일에 한 동료가 던진 한 문장에 대한 것이었다. 다 쓰고 나니 한 시간 십칠 분이 흘러 있었다.", "body_html": "<p>노트 안에 한 시간 동안 한 줄씩 적었다. 어떤 한 줄은 자동화 메서드에 대한 것이었다. 어떤 한 줄은 콘셉트 두께에 대한 것이었다. 어떤 한 줄은 5월 30일 토요일에 한 동료가 던진 한 문장에 대한 것이었다. 다 쓰고 나니 한 시간 십칠 분이 흘러 있었다.</p>", "plain_len": 102, "type": "page", "rawIndex": 2}, {"title": "한 시간이 한 매거진이 된다", "body_md": "한 시간의 한 노트가 한 매거진의 한 발화점이 된다. 그 노트의 한 줄 한 줄이 이 매거진의 한 페이지 한 페이지로 풀어진다. 한 주가 끝나고 한 주가 시작될 때 — 그 사이의 한 시간이 한 매거진의 자리다.", "body_html": "<p>한 시간의 한 노트가 한 매거진의 한 발화점이 된다. 그 노트의 한 줄 한 줄이 이 매거진의 한 페이지 한 페이지로 풀어진다. 한 주가 끝나고 한 주가 시작될 때 — 그 사이의 한 시간이 한 매거진의 자리다.</p>", "plain_len": 80, "type": "page", "rawIndex": 3}, {"title": "그 매거진이 이 매거진이다", "body_md": "이 매거진이 그 노트의 풀이다. 4호. Vol. 4. 한 주의 두 앨범에 대한 매거진. 노트 한 시간이 매거진 한 주가 되는 자리다.", "body_html": "<p>이 매거진이 그 노트의 풀이다. 4호. Vol. 4. 한 주의 두 앨범에 대한 매거진. 노트 한 시간이 매거진 한 주가 되는 자리다.</p>", "plain_len": 53, "type": "page", "rawIndex": 4}, {"title": "한 주의 한 매거진", "body_md": "한 주에 한 작품을 만드는 메서드가 한 주에 한 매거진을 만드는 메서드와 만나는 자리에 이 한 주가 있다. 다음 페이지부터 그 한 주의 두 번째 날이 시작된다.\n\n---", "body_html": "<p>한 주에 한 작품을 만드는 메서드가 한 주에 한 매거진을 만드는 메서드와 만나는 자리에 이 한 주가 있다. 다음 페이지부터 그 한 주의 두 번째 날이 시작된다.</p>\n<p>---</p>", "plain_len": 66, "type": "page", "rawIndex": 5}], "totalPages": 5}]}, {"date": "2026-05-27", "weekday": "화", "weekdayFull": "화요일", "no": "002", "titleLine": "1930년대 경성이라는 가상 좌표", "theme": "1930년대 경성이라는 가상 좌표", "note_html": "", "sections": [{"num": "06", "key": "intro", "label": "INTRO", "ko": "도입", "title": "콘셉트가 필요한 이유", "short": "콘셉트가 필요한 이유", "pages": [{"title": "콘셉트 없는 곡 다섯 곡의 풍경", "body_md": "콘셉트 없이 만든 다섯 곡은 다섯 개의 흩어진 풍경이었다. 한 풍경이 옆 풍경과 한 자리에 서지 않는다. 한 곡을 들으면 한 곡으로 끝나고, 다음 곡을 들으면 다른 한 곡으로 시작한다. 묶이는 자리가 없다.", "body_html": "<p>콘셉트 없이 만든 다섯 곡은 다섯 개의 흩어진 풍경이었다. 한 풍경이 옆 풍경과 한 자리에 서지 않는다. 한 곡을 들으면 한 곡으로 끝나고, 다음 곡을 들으면 다른 한 곡으로 시작한다. 묶이는 자리가 없다.</p>", "plain_len": 83, "type": "page", "rawIndex": 1}, {"title": "너무 일반적인 콘셉트의 예", "body_md": "콘셉트를 잡되 너무 일반적이면 곡이 흐릿해진다. \"사랑 노래 15곡\" — 이런 콘셉트는 콘셉트가 아니다. 어떤 사랑인지 모르기 때문에 곡들이 다 다른 사랑을 노래한다. 결국 다섯 곡짜리 자동화의 같은 풍경으로 돌아간다.", "body_html": "<p>콘셉트를 잡되 너무 일반적이면 곡이 흐릿해진다. \"사랑 노래 15곡\" — 이런 콘셉트는 콘셉트가 아니다. 어떤 사랑인지 모르기 때문에 곡들이 다 다른 사랑을 노래한다. 결국 다섯 곡짜리 자동화의 같은 풍경으로 돌아간다.</p>", "plain_len": 93, "type": "page", "rawIndex": 2}, {"title": "너무 좁은 콘셉트의 예", "body_md": "반대로 너무 좁으면 15곡이 펼쳐지지 않는다. \"2025년 5월 18일 광화문의 비 오는 오후에 한 사람이 우산을 잃은 한 순간에 대한 노래 15곡\" — 한 곡은 가능하지만 15곡은 안 된다. 한 모티브의 두께가 다섯 페이지를 넘어가지 못한다.", "body_html": "<p>반대로 너무 좁으면 15곡이 펼쳐지지 않는다. \"2025년 5월 18일 광화문의 비 오는 오후에 한 사람이 우산을 잃은 한 순간에 대한 노래 15곡\" — 한 곡은 가능하지만 15곡은 안 된다. 한 모티브의 두께가 다섯 페이지를 넘어가지 못한다.</p>", "plain_len": 101, "type": "page", "rawIndex": 3}, {"title": "그 사이의 한 좌표", "body_md": "그 사이의 어딘가에 한 좌표가 있어야 한다. 한 시대 + 한 공간 + 한 무대 — 이 세 가지가 모이면 한 콘셉트의 좌표가 된다. 너무 일반적이지 않고, 너무 좁지 않고, 15곡이 펼쳐질 두께가 있는 자리.", "body_html": "<p>그 사이의 어딘가에 한 좌표가 있어야 한다. 한 시대 + 한 공간 + 한 무대 — 이 세 가지가 모이면 한 콘셉트의 좌표가 된다. 너무 일반적이지 않고, 너무 좁지 않고, 15곡이 펼쳐질 두께가 있는 자리.</p>", "plain_len": 81, "type": "page", "rawIndex": 4}, {"title": "1930년대 경성이라는 한 좌표", "body_md": "그 사이의 한 좌표가 1930년대 경성 재즈 카바레였다. 한 시대 (1930년대) + 한 공간 (경성) + 한 무대 (재즈 카바레). 세 가지가 한 줄로 묶이면서 한 좌표가 정해졌다. 그 좌표 위에 한 여가수를 세우면 한 앨범이 나오고, 다른 한 사람을 세우면 다른 앨범이 나온다.", "body_html": "<p>그 사이의 한 좌표가 1930년대 경성 재즈 카바레였다. 한 시대 (1930년대) + 한 공간 (경성) + 한 무대 (재즈 카바레). 세 가지가 한 줄로 묶이면서 한 좌표가 정해졌다. 그 좌표 위에 한 여가수를 세우면 한 앨범이 나오고, 다른 한 사람을 세우면 다른 앨범이 나온다.</p>", "plain_len": 114, "type": "page", "rawIndex": 5}], "totalPages": 5}, {"num": "07", "key": "issue", "label": "ISSUE", "ko": "쟁점", "title": "식민지의 말이 두 갈래로 갈렸던 이유", "short": "식민지의 말이 두 갈래로 갈렸던 이유", "pages": [{"title": "식민지의 무대 위 한 노래", "body_md": "식민지 시대의 한 무대 위에서 한 노래가 한 노래로 끝나지 않는다. 한 노래는 한 자리에서 두 갈래로 흘러간다. 부르는 사람은 한 갈래를 알지만 듣는 사람은 다른 한 갈래를 듣는다. 같은 가사가 다른 의미로 흘러가는 한 자리다.", "body_html": "<p>식민지 시대의 한 무대 위에서 한 노래가 한 노래로 끝나지 않는다. 한 노래는 한 자리에서 두 갈래로 흘러간다. 부르는 사람은 한 갈래를 알지만 듣는 사람은 다른 한 갈래를 듣는다. 같은 가사가 다른 의미로 흘러가는 한 자리다.</p>", "plain_len": 92, "type": "page", "rawIndex": 1}, {"title": "같은 자리에 앉은 두 청자", "body_md": "카바레의 한 자리에 일본인 순사가 앉아 있었다. 다른 한 자리에 대한제국을 기억하는 한 사람이 앉아 있었다. 같은 한 곡이 무대 위에서 흘렀다. 순사는 술집의 한 이별가로 들었다. 그 옆에 앉은 사람은 한 망국가로 들었다. 같은 곡, 같은 가수, 다른 두 곡.", "body_html": "<p>카바레의 한 자리에 일본인 순사가 앉아 있었다. 다른 한 자리에 대한제국을 기억하는 한 사람이 앉아 있었다. 같은 한 곡이 무대 위에서 흘렀다. 순사는 술집의 한 이별가로 들었다. 그 옆에 앉은 사람은 한 망국가로 들었다. 같은 곡, 같은 가수, 다른 두 곡.</p>", "plain_len": 105, "type": "page", "rawIndex": 2}, {"title": "부르는 사람은 두 갈래를 다 안다", "body_md": "무대 위에서 부르는 사람만이 두 갈래를 다 안다. 그녀는 자신이 부르는 한 가사가 한 사람에게는 한 이별가로, 다른 한 사람에게는 한 망국가로 가는 것을 안다. 그녀가 그 두 갈래를 의도해서 부르는 게 한 식민지 시대의 한 노래의 한 본질이다.", "body_html": "<p>무대 위에서 부르는 사람만이 두 갈래를 다 안다. 그녀는 자신이 부르는 한 가사가 한 사람에게는 한 이별가로, 다른 한 사람에게는 한 망국가로 가는 것을 안다. 그녀가 그 두 갈래를 의도해서 부르는 게 한 식민지 시대의 한 노래의 한 본질이다.</p>", "plain_len": 98, "type": "page", "rawIndex": 3}, {"title": "듣는 사람이 둘이면 곡은 두 곡이 된다", "body_md": "이게 한 식민지 시대의 한 음악의 결이다. 같은 가사, 같은 곡조, 같은 가수 — 그러나 듣는 사람이 두 사람이면 곡은 두 곡이 된다. 한 곡짜리 자동화로는 절대 만들 수 없는 한 두께가 그 두 갈래에 있다.", "body_html": "<p>이게 한 식민지 시대의 한 음악의 결이다. 같은 가사, 같은 곡조, 같은 가수 — 그러나 듣는 사람이 두 사람이면 곡은 두 곡이 된다. 한 곡짜리 자동화로는 절대 만들 수 없는 한 두께가 그 두 갈래에 있다.</p>", "plain_len": 81, "type": "page", "rawIndex": 4}, {"title": "두 갈래는 시대의 강요였다", "body_md": "그 두 갈래는 가수의 선택이 아니라 시대의 강요였다. 직접적으로 한 망국가를 부를 수는 없었다. 부르면 무대가 끝났다. 그래서 한 사랑 노래의 한 가사 안에 한 망국의 한 결을 숨겼다. 시대가 강요한 두 갈래가 그 시대의 한 음악을 두껍게 만들었다.", "body_html": "<p>그 두 갈래는 가수의 선택이 아니라 시대의 강요였다. 직접적으로 한 망국가를 부를 수는 없었다. 부르면 무대가 끝났다. 그래서 한 사랑 노래의 한 가사 안에 한 망국의 한 결을 숨겼다. 시대가 강요한 두 갈래가 그 시대의 한 음악을 두껍게 만들었다.</p>", "plain_len": 101, "type": "page", "rawIndex": 5}], "totalPages": 5}, {"num": "08", "key": "insight", "label": "INSIGHT", "ko": "통찰", "title": "사랑가와 망국가의 layered 디자인", "short": "사랑가와 망국가의 layered 디자인", "pages": [{"title": "가사: 정치 용어 없이 사랑 용어로", "body_md": "오얏꽃 사계의 한 디자인 원칙이 거기서 나왔다. 가사의 단어를 정치 용어로 잡지 않는다. 잡으면 무대가 끝난다. 사랑 용어로 잡되 — 그 사랑 용어가 두 갈래로 흐르도록 설계한다. 표층은 사랑, 심층은 다른 한 자리.", "body_html": "<p>오얏꽃 사계의 한 디자인 원칙이 거기서 나왔다. 가사의 단어를 정치 용어로 잡지 않는다. 잡으면 무대가 끝난다. 사랑 용어로 잡되 — 그 사랑 용어가 두 갈래로 흐르도록 설계한다. 표층은 사랑, 심층은 다른 한 자리.</p>", "plain_len": 89, "type": "page", "rawIndex": 1}, {"title": "그 사랑 용어가 두 갈래로 흐르도록", "body_md": "다섯 단어를 골랐다. 님 · 오얏꽃 · 붉은 실 푸른 실 · 등불 · 향. 이 다섯 단어가 한 곡 안에서 두 갈래로 흐른다. 한 갈래는 한 사람의 사랑이다. 다른 한 갈래는 한 나라의 잃음이다. 부르는 사람은 두 갈래를 다 알고, 듣는 사람은 한 갈래만 안다.", "body_html": "<p>다섯 단어를 골랐다. 님 · 오얏꽃 · 붉은 실 푸른 실 · 등불 · 향. 이 다섯 단어가 한 곡 안에서 두 갈래로 흐른다. 한 갈래는 한 사람의 사랑이다. 다른 한 갈래는 한 나라의 잃음이다. 부르는 사람은 두 갈래를 다 알고, 듣는 사람은 한 갈래만 안다.</p>", "plain_len": 100, "type": "page", "rawIndex": 2}, {"title": "악기: 서양 악기의 표층", "body_md": "악기 편성도 두 갈래로 설계했다. 서양 악기 — 피아노, 트럼펫, 클라리넷, 브러시드 드럼 — 가 카바레 무대의 표층을 책임진다. 1930년대 경성의 한 카바레가 어떻게 들렸을 법한지, 그 분위기의 표층을 한 번에 잡아준다.", "body_html": "<p>악기 편성도 두 갈래로 설계했다. 서양 악기 — 피아노, 트럼펫, 클라리넷, 브러시드 드럼 — 가 카바레 무대의 표층을 책임진다. 1930년대 경성의 한 카바레가 어떻게 들렸을 법한지, 그 분위기의 표층을 한 번에 잡아준다.</p>", "plain_len": 94, "type": "page", "rawIndex": 3}, {"title": "한국 악기의 그 아래 정체성", "body_md": "한국 전통 악기 — 가야금, 해금, 대금 — 가 그 표층 아래 한 정체성을 책임진다. 가야금 한 음, 해금 한 활, 대금 한 호흡이 한 줄 들어오면 그 사랑 노래의 한 갈래가 다른 갈래로 빠진다. 표층과 심층이 한 곡 안에서 한 자리씩 잡는다.", "body_html": "<p>한국 전통 악기 — 가야금, 해금, 대금 — 가 그 표층 아래 한 정체성을 책임진다. 가야금 한 음, 해금 한 활, 대금 한 호흡이 한 줄 들어오면 그 사랑 노래의 한 갈래가 다른 갈래로 빠진다. 표층과 심층이 한 곡 안에서 한 자리씩 잡는다.</p>", "plain_len": 94, "type": "page", "rawIndex": 4}, {"title": "두 갈래 layering", "body_md": "두 앨범의 사이트에 한 문장이 함께 박혀 있다.\n\n> *\"서양 악기는 무대 위 표층을, 한국 악기는 그 아래 은닉된 정체성을 연주합니다.\"*\n\n이 한 문장이 두 앨범의 한 정신이다. 가사 두 갈래 + 악기 두 갈래 = 한 곡 안의 layered 디자인.", "body_html": "<p>두 앨범의 사이트에 한 문장이 함께 박혀 있다.</p>\n<blockquote><p><em>\"서양 악기는 무대 위 표층을, 한국 악기는 그 아래 은닉된 정체성을 연주합니다.\"</em></p></blockquote>\n<p>이 한 문장이 두 앨범의 한 정신이다. 가사 두 갈래 + 악기 두 갈래 = 한 곡 안의 layered 디자인.</p>", "plain_len": 99, "type": "page", "rawIndex": 5}], "totalPages": 5}, {"num": "09", "key": "case", "label": "CASE", "ko": "사례", "title": "오얏꽃 사계의 한 정신 문장", "short": "오얏꽃 사계의 한 정신 문장", "pages": [{"title": "콘셉트 두께가 한 줄로 묶이는 자리", "body_md": "콘셉트의 두께는 한 줄로 묶이는 자리가 있어야 한다. 그 한 줄이 없으면 다섯 곡쯤에서 흐릿해진다. 일곱 곡쯤 가면 작가도 헷갈리기 시작한다. 15곡을 채우려면 — 한 줄로 묶이는 정신 문장이 처음부터 잡혀 있어야 한다.", "body_html": "<p>콘셉트의 두께는 한 줄로 묶이는 자리가 있어야 한다. 그 한 줄이 없으면 다섯 곡쯤에서 흐릿해진다. 일곱 곡쯤 가면 작가도 헷갈리기 시작한다. 15곡을 채우려면 — 한 줄로 묶이는 정신 문장이 처음부터 잡혀 있어야 한다.</p>", "plain_len": 91, "type": "page", "rawIndex": 1}, {"title": "\"순사는 술집의 이별가로 듣고...\"", "body_md": "오얏꽃 사계의 한 정신 문장은 이것이었다.\n\n> *\"순사는 술집의 이별가로 듣고, 대한제국을 기억하는 이들은 망국가로 듣는다.\"*\n\n이 한 줄이 15곡 전체의 정신이다. 곡 한 곡을 쓰다가 막히면 이 한 줄로 돌아오면 된다.", "body_html": "<p>오얏꽃 사계의 한 정신 문장은 이것이었다.</p>\n<blockquote><p><em>\"순사는 술집의 이별가로 듣고, 대한제국을 기억하는 이들은 망국가로 듣는다.\"</em></p></blockquote>\n<p>이 한 줄이 15곡 전체의 정신이다. 곡 한 곡을 쓰다가 막히면 이 한 줄로 돌아오면 된다.</p>", "plain_len": 92, "type": "page", "rawIndex": 2}, {"title": "그 한 줄이 15곡 전체의 정신", "body_md": "매 곡의 가사를 다듬을 때 — 두 갈래의 한 갈래가 너무 명백해지면 — 이 한 줄을 다시 본다. 두 청자가 다 보는 자리에 한 단어가 서 있어야 한다. 한 단어가 너무 사랑에 치우치거나 너무 망국에 치우치면 — 그 한 단어를 다시 다듬는다.", "body_html": "<p>매 곡의 가사를 다듬을 때 — 두 갈래의 한 갈래가 너무 명백해지면 — 이 한 줄을 다시 본다. 두 청자가 다 보는 자리에 한 단어가 서 있어야 한다. 한 단어가 너무 사랑에 치우치거나 너무 망국에 치우치면 — 그 한 단어를 다시 다듬는다.</p>", "plain_len": 93, "type": "page", "rawIndex": 3}, {"title": "그 한 줄이 없으면 5곡쯤에서 흐릿해진다", "body_md": "이런 한 줄을 처음부터 잡지 않으면 — 한 곡 두 곡까지는 가능하지만 다섯 곡쯤 가면 콘셉트가 흐릿해진다. 일곱 곡쯤 가면 작가가 한 곡이 어디서 왔는지를 잊어버린다. 정신 문장은 작가의 기억이 아니라 콘셉트의 무게다.", "body_html": "<p>이런 한 줄을 처음부터 잡지 않으면 — 한 곡 두 곡까지는 가능하지만 다섯 곡쯤 가면 콘셉트가 흐릿해진다. 일곱 곡쯤 가면 작가가 한 곡이 어디서 왔는지를 잊어버린다. 정신 문장은 작가의 기억이 아니라 콘셉트의 무게다.</p>", "plain_len": 90, "type": "page", "rawIndex": 4}, {"title": "정신 문장 = 콘셉트의 무게", "body_md": "정신 문장이 한 콘셉트의 무게다. 한 줄짜리 문장에 한 앨범의 모든 무게가 실린다. 가벼운 정신 문장으로는 가벼운 앨범이 나온다. 두꺼운 정신 문장으로는 두꺼운 앨범이 나온다. 자동화의 단위가 한 앨범이 되는 자리는 정신 문장의 자리다.", "body_html": "<p>정신 문장이 한 콘셉트의 무게다. 한 줄짜리 문장에 한 앨범의 모든 무게가 실린다. 가벼운 정신 문장으로는 가벼운 앨범이 나온다. 두꺼운 정신 문장으로는 두꺼운 앨범이 나온다. 자동화의 단위가 한 앨범이 되는 자리는 정신 문장의 자리다.</p>", "plain_len": 99, "type": "page", "rawIndex": 5}], "totalPages": 5}, {"num": "10", "key": "archive", "label": "ARCHIVE", "ko": "자료", "title": "다섯 단어 세트", "short": "다섯 단어 세트", "pages": [{"title": "님 — 사랑하는 한 사람 ↔ 한 임금", "body_md": "첫 번째 단어 — 님. 한 사랑가 안에서 님은 사랑하는 한 사람이다. 같은 가사 안에서 님은 한 임금이기도 하다. 잃어버린 한 임금. 한 왕조의 한 마지막. 같은 글자가 두 자리를 잡는다.", "body_html": "<p>첫 번째 단어 — 님. 한 사랑가 안에서 님은 사랑하는 한 사람이다. 같은 가사 안에서 님은 한 임금이기도 하다. 잃어버린 한 임금. 한 왕조의 한 마지막. 같은 글자가 두 자리를 잡는다.</p>", "plain_len": 75, "type": "page", "rawIndex": 1}, {"title": "오얏꽃 — 그리운 꽃 ↔ 이씨 왕조의 상징", "body_md": "두 번째 단어 — 오얏꽃. 한자로 李花. 이씨 왕조의 한 상징이다. 한 사랑 노래 안에서 오얏꽃은 그리운 한 꽃이다. 한 망국가 안에서 오얏꽃은 한 왕조의 마지막 한 꽃이다. 오얏꽃이 진다는 한 줄이 두 갈래로 흐른다.", "body_html": "<p>두 번째 단어 — 오얏꽃. 한자로 李花. 이씨 왕조의 한 상징이다. 한 사랑 노래 안에서 오얏꽃은 그리운 한 꽃이다. 한 망국가 안에서 오얏꽃은 한 왕조의 마지막 한 꽃이다. 오얏꽃이 진다는 한 줄이 두 갈래로 흐른다.</p>", "plain_len": 88, "type": "page", "rawIndex": 2}, {"title": "붉은 실 푸른 실 — 매듭 ↔ 태극의 빛", "body_md": "세 번째 단어 — 붉은 실 푸른 실. 사랑가 안에서 한 매듭의 두 끈이다. 망국가 안에서 한 태극의 한 붉음과 한 푸름이다. 그 두 끈이 끊어진다는 한 줄이 한 사랑의 한 끝이면서 한 나라의 한 끝이다.", "body_html": "<p>세 번째 단어 — 붉은 실 푸른 실. 사랑가 안에서 한 매듭의 두 끈이다. 망국가 안에서 한 태극의 한 붉음과 한 푸름이다. 그 두 끈이 끊어진다는 한 줄이 한 사랑의 한 끝이면서 한 나라의 한 끝이다.</p>", "plain_len": 78, "type": "page", "rawIndex": 3}, {"title": "등불 / 향 — 가게의 등불 ↔ 남의 권력 아래", "body_md": "네 번째 단어 — 등불. 카바레의 한 등불이다. 동시에 남의 권력 아래의 한 밤이다. 다섯 번째 단어 — 향. 한 사람의 한 잔향이다. 동시에 한 시대의 한 잔향이다. 두 갈래가 늘 같은 한 단어 안에 같이 있다.", "body_html": "<p>네 번째 단어 — 등불. 카바레의 한 등불이다. 동시에 남의 권력 아래의 한 밤이다. 다섯 번째 단어 — 향. 한 사람의 한 잔향이다. 동시에 한 시대의 한 잔향이다. 두 갈래가 늘 같은 한 단어 안에 같이 있다.</p>", "plain_len": 83, "type": "page", "rawIndex": 4}, {"title": "다섯 단어가 모이면 한 콘셉트", "body_md": "다섯 단어가 모이면 한 콘셉트가 된다. 각 단어가 두 갈래로 흐르고, 다섯 단어가 한 곡 안에서 다 등장하고, 그 한 곡이 다른 한 곡으로 한 호흡 넘어가는 자리에 — 한 앨범이 한 자리에 모인다. 다섯 단어 세트가 그 한 자리의 한 토대다.\n\n---", "body_html": "<p>다섯 단어가 모이면 한 콘셉트가 된다. 각 단어가 두 갈래로 흐르고, 다섯 단어가 한 곡 안에서 다 등장하고, 그 한 곡이 다른 한 곡으로 한 호흡 넘어가는 자리에 — 한 앨범이 한 자리에 모인다. 다섯 단어 세트가 그 한 자리의 한 토대다.</p>\n<p>---</p>", "plain_len": 97, "type": "page", "rawIndex": 5}], "totalPages": 5}]}, {"date": "2026-05-28", "weekday": "수", "weekdayFull": "수요일", "no": "003", "titleLine": "SUNO 크리에이티브 아키텍쳐링이라는 명명", "theme": "SUNO 크리에이티브 아키텍쳐링이라는 명명", "note_html": "", "sections": [{"num": "11", "key": "intro", "label": "INTRO", "ko": "도입", "title": "SUNO 활용법 특강 3부작", "short": "SUNO 활용법 특강 3부작", "pages": [{"title": "몇 개월 전 내 채널의 한 시리즈", "body_md": "몇 개월 전 본인 채널에 한 시리즈를 올렸다. 제목은 \"SUNO 활용법 특강\". 1부, 2부, 3부. 한 영상의 길이는 길지 않았다. 그러나 세 영상이 한 자리에 모이면 한 메서드가 된다. 그 메서드의 한 이름이 이번 매거진의 한 기둥이다.", "body_html": "<p>몇 개월 전 본인 채널에 한 시리즈를 올렸다. 제목은 \"SUNO 활용법 특강\". 1부, 2부, 3부. 한 영상의 길이는 길지 않았다. 그러나 세 영상이 한 자리에 모이면 한 메서드가 된다. 그 메서드의 한 이름이 이번 매거진의 한 기둥이다.</p>", "plain_len": 98, "type": "page", "rawIndex": 1}, {"title": "1부에서 던진 한 문장", "body_md": "1부에서 던진 한 문장이 있다.\n\n> *\"SUNO를 곡 만드는 장난감으로 쓰지 마라. 한 콘셉트의 한 세계관을 만드는 도구로 써라.\"*\n\n장난감과 도구의 차이가 한 메서드의 시작점이다. 장난감으로 쓰면 한 곡짜리 결과. 도구로 쓰면 한 앨범짜리 결과.", "body_html": "<p>1부에서 던진 한 문장이 있다.</p>\n<blockquote><p><em>\"SUNO를 곡 만드는 장난감으로 쓰지 마라. 한 콘셉트의 한 세계관을 만드는 도구로 써라.\"</em></p></blockquote>\n<p>장난감과 도구의 차이가 한 메서드의 시작점이다. 장난감으로 쓰면 한 곡짜리 결과. 도구로 쓰면 한 앨범짜리 결과.</p>", "plain_len": 104, "type": "page", "rawIndex": 2}, {"title": "2부에서 풀어낸 한 메서드", "body_md": "2부에서 풀어낸 메서드는 한 입력의 두께에 대한 것이었다. 가사 한 줄, 장르 한 단어로 곡을 만들면 한 결과. 그러나 한 시대 + 한 공간 + 한 인물 + 한 정신 문장 + 한 단어 세트 + 한 악기 layering — 여섯 가지를 한 입력에 묶으면 다른 한 결과가 나온다.", "body_html": "<p>2부에서 풀어낸 메서드는 한 입력의 두께에 대한 것이었다. 가사 한 줄, 장르 한 단어로 곡을 만들면 한 결과. 그러나 한 시대 + 한 공간 + 한 인물 + 한 정신 문장 + 한 단어 세트 + 한 악기 layering — 여섯 가지를 한 입력에 묶으면 다른 한 결과가 나온다.</p>", "plain_len": 106, "type": "page", "rawIndex": 3}, {"title": "3부에서 도달한 한 결론", "body_md": "3부의 한 결론은 이것이었다. 한 도구의 한 한계는 그 도구의 한계가 아니라 입력의 한계다. 같은 Suno 5.5에 다른 입력을 던지면 다른 결과가 나온다. 입력이 두꺼우면 출력이 두꺼워진다. 입력이 가벼우면 출력이 가벼워진다.", "body_html": "<p>3부의 한 결론은 이것이었다. 한 도구의 한 한계는 그 도구의 한계가 아니라 입력의 한계다. 같은 Suno 5.5에 다른 입력을 던지면 다른 결과가 나온다. 입력이 두꺼우면 출력이 두꺼워진다. 입력이 가벼우면 출력이 가벼워진다.</p>", "plain_len": 97, "type": "page", "rawIndex": 4}, {"title": "3부작의 한 줄 요약", "body_md": "세 영상을 한 줄로 요약하면 이것이다.\n\n> *\"장난감이 아니라 도구. 가벼운 입력이 아니라 두꺼운 입력. 한 곡이 아니라 한 세계관.\"*\n\n이 한 줄이 이번 한 주의 한 두 앨범으로 결실을 봤다.", "body_html": "<p>세 영상을 한 줄로 요약하면 이것이다.</p>\n<blockquote><p><em>\"장난감이 아니라 도구. 가벼운 입력이 아니라 두꺼운 입력. 한 곡이 아니라 한 세계관.\"</em></p></blockquote>\n<p>이 한 줄이 이번 한 주의 한 두 앨범으로 결실을 봤다.</p>", "plain_len": 78, "type": "page", "rawIndex": 5}], "totalPages": 5}, {"num": "12", "key": "issue", "label": "ISSUE", "ko": "쟁점", "title": "노래 단위 vs 앨범 단위 — 메서드 차원의 차이", "short": "노래 단위 vs 앨범 단위 — 메서드 차원의 차이", "pages": [{"title": "노래 단위 자동화의 입력 두께", "body_md": "노래 단위 자동화의 입력 두께는 얇다. 가사 한 줄, 장르 한 단어, 분위기 한 단어. 입력 글자 수가 백 자를 넘기 어렵다. 그 백 자에 한 곡의 모든 정보가 들어가야 하니까.", "body_html": "<p>노래 단위 자동화의 입력 두께는 얇다. 가사 한 줄, 장르 한 단어, 분위기 한 단어. 입력 글자 수가 백 자를 넘기 어렵다. 그 백 자에 한 곡의 모든 정보가 들어가야 하니까.</p>", "plain_len": 69, "type": "page", "rawIndex": 1}, {"title": "앨범 단위 자동화의 입력 두께", "body_md": "앨범 단위 자동화의 입력 두께는 두껍다. 한 시대 + 한 공간 + 한 인물 + 한 정신 문장 + 한 단어 세트 + 한 악기 layering. 입력 글자 수가 천 자를 넘긴다. 그 천 자에 15곡의 토대가 다 들어 있다.", "body_html": "<p>앨범 단위 자동화의 입력 두께는 두껍다. 한 시대 + 한 공간 + 한 인물 + 한 정신 문장 + 한 단어 세트 + 한 악기 layering. 입력 글자 수가 천 자를 넘긴다. 그 천 자에 15곡의 토대가 다 들어 있다.</p>", "plain_len": 83, "type": "page", "rawIndex": 2}, {"title": "여섯 가지 입력 요소", "body_md": "여섯 가지를 한 입력에 묶는다.\n1. 한 시대 — 1930년대 경성.\n2. 한 공간 — 재즈 카바레.\n3. 한 인물 — 한 여가수.\n4. 한 정신 문장 — \"순사는 술집의 이별가로 듣고, 대한제국을 기억하는 이들은 망국가로 듣는다.\"\n5. 한 단어 세트 — 님 · 오얏꽃 · 붉은 실 푸른 실 · 등불 · 향.\n6. 한 악기 layering — 서양 악기(표층) + 한국 악기(심층).", "body_html": "<p>여섯 가지를 한 입력에 묶는다. 1. 한 시대 — 1930년대 경성. 2. 한 공간 — 재즈 카바레. 3. 한 인물 — 한 여가수. 4. 한 정신 문장 — \"순사는 술집의 이별가로 듣고, 대한제국을 기억하는 이들은 망국가로 듣는다.\" 5. 한 단어 세트 — 님 · 오얏꽃 · 붉은 실 푸른 실 · 등불 · 향. 6. 한 악기 layering — 서양 악기(표층) + 한국 악기(심층).</p>", "plain_len": 152, "type": "page", "rawIndex": 3}, {"title": "여섯 가지가 모이면 한 입력이 된다", "body_md": "여섯 가지가 모이면 한 입력이 된다. 한 자리에 모이는 게 한 콘셉트의 두께다. 모이지 않으면 — 그게 가벼운 입력이고, 가벼운 입력에서는 한 곡짜리 결과만 나온다. 모이면 — 그게 두꺼운 입력이고, 두꺼운 입력에서는 한 앨범짜리 결과가 나온다.", "body_html": "<p>여섯 가지가 모이면 한 입력이 된다. 한 자리에 모이는 게 한 콘셉트의 두께다. 모이지 않으면 — 그게 가벼운 입력이고, 가벼운 입력에서는 한 곡짜리 결과만 나온다. 모이면 — 그게 두꺼운 입력이고, 두꺼운 입력에서는 한 앨범짜리 결과가 나온다.</p>", "plain_len": 102, "type": "page", "rawIndex": 4}, {"title": "입력이 두꺼우면 출력이 두꺼워진 0에서 지고, Track 15에서 다시 핀다. 한 왕조의 한 봄, 한 왕조의 한 망국, 한 왕조의 한 회생. 세 자리가 한 앨범의 한 시간선이다.</p>", "plain_len": 90, "type": "page", "rawIndex": 1}, {"title": "붉은 실 푸른 실 — 05 맺음 · 11 끊김", "body_md": "두 번째 모티프 — 붉은 실 푸른 실. Track 05에서 맺어지고, Track 11에서 끊어진다. 한 매듭이 한 자리에 묶이고, 한 매듭이 한 자리에서 풀린다. 같은 한 끈의 두 자리.", "body_html": "<p>두 번째 모티프 — 붉은 실 푸른 실. Track 05에서 맺어지고, Track 11에서 끊어진다. 한 매듭이 한 자리에 묶이고, 한 매듭이 한 자리에서 풀린다. 같은 한 끈의 두 자리.</p>", "plain_len": 76, "type": "page", "rawIndex": 2}, {"title": "강물 / 언 강 — 07 잎 짐 · 13 풀림", "body_md": "세 번째 모티프 — 강물. Track 07에서 가을 강가의 잎이 진다. Track 13에서 초봄 언 강이 풀린다. 한 강이 한 계절의 한 흐름을 다 안고 간다. 잎이 져도 강은 흐르고, 강이 얼어도 다시 풀린다.", "body_html": "<p>세 번째 모티프 — 강물. Track 07에서 가을 강가의 잎이 진다. Track 13에서 초봄 언 강이 풀린다. 한 강이 한 계절의 한 흐름을 다 안고 간다. 잎이 져도 강은 흐르고, 강이 얼어도 다시 풀린다.</p>", "plain_len": 85, "type": "page", "rawIndex": 3}, {"title": "향 — 09 · 14", "body_md": "네 번째 모티프 — 향. Track 09 가을 깊은 밤의 향. Track 14 봄밤의 향. 두 향이 한 앨범의 한 쪽과 다른 한 쪽에 같이 박혀 있다. 향만은 시간이 지나도 남는다.", "body_html": "<p>네 번째 모티프 — 향. Track 09 가을 깊은 밤의 향. Track 14 봄밤의 향. 두 향이 한 앨범의 한 쪽과 다른 한 쪽에 같이 박혀 있다. 향만은 시간이 지나도 남는다.</p>", "plain_len": 71, "type": "page", "rawIndex": 4}, {"title": "다섯 모티프가 한 곡 안에서 두 갈래로 흐른다", "body_md": "다섯 모티프 — 오얏꽃 · 붉은 실 푸른 실 · 강물 / 언 강 · 향 · 제비. 각 모티프가 한 곡 안에서 두 갈래로 흐른다. 한 갈래는 한 사랑의 결, 다른 한 갈래는 한 나라의 결. 다섯 모티프가 한 자리에 모이면 — 그 한 자리가 한 앨범의 한 두께다.\n\n---", "body_html": "<p>다섯 모티프 — 오얏꽃 · 붉은 실 푸른 실 · 강물 / 언 강 · 향 · 제비. 각 모티프가 한 곡 안에서 두 갈래로 흐른다. 한 갈래는 한 사랑의 결, 다른 한 갈래는 한 나라의 결. 다섯 모티프가 한 자리에 모이면 — 그 한 자리가 한 앨범의 한 두께다.</p>\n<p>---</p>", "plain_len": 99, "type": "page", "rawIndex": 5}], "totalPages": 5}]}, {"date": "2026-05-30", "weekday": "금", "weekdayFull": "금요일", "no": "005", "titleLine": "나를 꽃이라 부르지 마오 (玄)", "theme": "나를 꽃이라 부르지 마오 (玄)", "note_html": "", "sections": [{"num": "21", "key": "intro", "label": "INTRO", "ko": "도입", "title": "Vol.2 표지 — 다른 한 사람의 다른 한 무대", "short": "Vol.2 표지 — 다른 한 사람의 다른 한 무대", "pages": [{"title": "Vol.2 — 같은 날 6시간 5분 사이", "body_md": "> [화면 인용]\n>\n> **나를 꽃이라 부르지 마오 · 玄**\n> Achmage's Joseon Jazz Vol.2\n> © 2026 Achmage\n> 사이트: [laguna821.github.io/Suno_albums/kkot-bureuji-mao/](https://laguna821.github.io/Suno_albums/kkot-bureuji-mao/)\n\n같은 날 6시간 5분 사이에 두 번째 앨범. Vol.2의 한자 표기는 玄. 검다. 깊다. 한 사람의 한 이름이 그 한 글자로 끝난다.", "body_html": "<blockquote><p>[화면 인용]</p>\n<p><strong>나를 꽃이라 부르지 마오 · 玄</strong> Achmage's Joseon Jazz Vol.2 © 2026 Achmage 사이트: <a href=\"https://laguna821.github.io/Suno_albums/kkot-bureuji-mao/\" target=\"_blank\" rel=\"noopener\">laguna821.github.io/Suno_albums/kkot-bureuji-mao/</a></p></blockquote>\n<p>같은 날 6시간 5분 사이에 두 번째 앨범. Vol.2의 한자 표기는 玄. 검다. 깊다. 한 사람의 한 이름이 그 한 글자로 끝난다.</p>", "plain_len": 231, "type": "page", "rawIndex": 1}, {"title": "다른 한 사람의 다른 한 무대", "body_md": "Vol.1의 한 여가수는 가공의 인물이었다. 한 카바레의 한 무대에 서 있는 한 추상적 인물. Vol.2는 다르다. 한 실존 인물 위에 한 앨범을 세웠다. 가공의 한 자리가 한 실재의 한 자리로 옮겨간 자리다.", "body_html": "<p>Vol.1의 한 여가수는 가공의 인물이었다. 한 카바레의 한 무대에 서 있는 한 추상적 인물. Vol.2는 다르다. 한 실존 인물 위에 한 앨범을 세웠다. 가공의 한 자리가 한 실재의 한 자리로 옮겨간 자리다.</p>", "plain_len": 86, "type": "page", "rawIndex": 2}, {"title": "한 한자 — 玄", "body_md": "한자 玄. 검다, 깊다, 신비롭다. 한 사람의 성에 들어 있는 한 글자. 한 앨범의 한 표지에 그 한 글자만 박혔다. 다른 정보 없이도 — 그 한 글자가 한 사람을 가리킨다.", "body_html": "<p>한자 玄. 검다, 깊다, 신비롭다. 한 사람의 성에 들어 있는 한 글자. 한 앨범의 한 표지에 그 한 글자만 박혔다. 다른 정보 없이도 — 그 한 글자가 한 사람을 가리킨다.</p>", "plain_len": 68, "type": "page", "rawIndex": 3}, {"title": "\"오인당하는 자의 고독 — 한 예인이자 의열단원의 일생\"", "body_md": "앨범의 한 부제. 한 사람이 한 시대에 한 자리에서 다른 한 자리로 늘 오인당했다는 한 사실. 한 무대 위의 한 기생, 한 신문의 한 미인, 한 의열단의 홍일점 — 다 다른 사람들이 그녀를 부른 이름이지 그녀가 자기를 부른 이름이 아니다.", "body_html": "<p>앨범의 한 부제. 한 사람이 한 시대에 한 자리에서 다른 한 자리로 늘 오인당했다는 한 사실. 한 무대 위의 한 기생, 한 신문의 한 미인, 한 의열단의 홍일점 — 다 다른 사람들이 그녀를 부른 이름이지 그녀가 자기를 부른 이름이 아니다.</p>", "plain_len": 94, "type": "page", "rawIndex": 4}, {"title": "Achmage's Joseon Jazz Vol.2", "body_md": "Vol.1과 같은 장르 명명이다. Joseon Jazz. 그러나 한 인물 + 한 시대 + 한 운명이 다르다. Vol.1이 가공의 한 여가수가 무대 위의 한 사랑을 부르는 앨범이라면, Vol.2는 한 실존 인물이 한 무대 뒤의 한 다른 정체성을 부르는 앨범이다.", "body_html": "<p>Vol.1과 같은 장르 명명이다. Joseon Jazz. 그러나 한 인물 + 한 시대 + 한 운명이 다르다. Vol.1이 가공의 한 여가수가 무대 위의 한 사랑을 부르는 앨범이라면, Vol.2는 한 실존 인물이 한 무대 뒤의 한 다른 정체성을 부르는 앨범이다.</p>", "plain_len": 108, "type": "page", "rawIndex": 5}], "totalPages": 5}, {"num": "22", "key": "issue", "label": "ISSUE", "ko": "쟁점", "title": "현계옥(玄桂玉) — 1896 밀양에서 1932 외몽골까지", "short": "현계옥(玄桂玉) — 1896 밀양에서 1932 외몽골까지", "pages": [{"title": "1896년 밀양, 17세 대구기생", "body_md": "[한국민족문화대백과사전](https://encykorea.aks.ac.kr/Article/E0081152)의 한 항목을 따라가본다. 1896년 추정, 경상남도 밀양 출생. 이명 현인권(玄仁權). 17세 때 대구기생조합 소속 예기로 활동을 시작했다. 한 사람의 한 인생의 한 시작점이다.", "body_html": "<p><a href=\"https://encykorea.aks.ac.kr/Article/E0081152\" target=\"_blank\" rel=\"noopener\">한국민족문화대백과사전</a>의 한 항목을 따라가본다. 1896년 추정, 경상남도 밀양 출생. 이명 현인권(玄仁權). 17세 때 대구기생조합 소속 예기로 활동을 시작했다. 한 사람의 한 인생의 한 시작점이다.</p>", "plain_len": 136, "type": "page", "rawIndex": 1}, {"title": "1913년 현정건과의 만남", "body_md": "1913년, 17세 즈음, 현계옥이 한 손님을 만났다. 이름은 현정건(玄鼎健). 한 독립운동가였다. 같은 玄을 성으로 가진 두 사람. 그 한 만남이 한 사람의 한 인생을 다른 한 자리로 옮겼다.", "body_html": "<p>1913년, 17세 즈음, 현계옥이 한 손님을 만났다. 이름은 현정건(玄鼎健). 한 독립운동가였다. 같은 玄을 성으로 가진 두 사람. 그 한 만남이 한 사람의 한 인생을 다른 한 자리로 옮겼다.</p>", "plain_len": 81, "type": "page", "rawIndex": 2}, {"title": "1920년 상하이, 의열단 가입", "body_md": "1919년 현정건이 독립운동 자금 조달을 위해 밀입국한다. 현계옥이 그와 해후하고 한 결심을 한다. 그해 서울을 떠나 지린에서 현정건과 합류, 1920년 상하이 도착. 그곳에서 의열단에 가입한다. 백과사전의 한 줄 — *\"여성으로서는 유일하게.\"*", "body_html": "<p>1919년 현정건이 독립운동 자금 조달을 위해 밀입국한다. 현계옥이 그와 해후하고 한 결심을 한다. 그해 서울을 떠나 지린에서 현정건과 합류, 1920년 상하이 도착. 그곳에서 의열단에 가입한다. 백과사전의 한 줄 — <em>\"여성으로서는 유일하게.\"</em></p>", "plain_len": 108, "type": "page", "rawIndex": 3}, {"title": "폭탄 제조와 운반", "body_md": "상하이에서 그녀가 한 일은 한 기생의 일이 아니었다. 폭탄 투척법과 육혈포 쏘는 방법을 배웠다. 거사용 폭탄의 제조와 운반을 도왔다. 1920년대 상하이의 한 골목에서 — 한 한국 여성이 한 폭탄을 손에 들고 있는 한 풍경.", "body_html": "<p>상하이에서 그녀가 한 일은 한 기생의 일이 아니었다. 폭탄 투척법과 육혈포 쏘는 방법을 배웠다. 거사용 폭탄의 제조와 운반을 도왔다. 1920년대 상하이의 한 골목에서 — 한 한국 여성이 한 폭탄을 손에 들고 있는 한 풍경.</p>", "plain_len": 92, "type": "page", "rawIndex": 4}, {"title": "1932년 외몽골, 행적 불명", "body_md": "1925년 청년동맹회 지원. 1926년 『여자해방』 잡지 발간 참여. 1928년 현정건 체포. 1931년 모스크바. 1932년 현정건 고문 후유증 사망. 그 후 외몽골로 갔다는 기록이 마지막이다. 그 이후의 행적은 — 불명이다.", "body_html": "<p>1925년 청년동맹회 지원. 1926년 『여자해방』 잡지 발간 참여. 1928년 현정건 체포. 1931년 모스크바. 1932년 현정건 고문 후유증 사망. 그 후 외몽골로 갔다는 기록이 마지막이다. 그 이후의 행적은 — 불명이다.</p>", "plain_len": 99, "type": "page", "rawIndex": 5}], "totalPages": 5}, {"num": "23", "key": "insight", "label": "INSIGHT", "ko": "통찰", "title": "1930년대 경성 가상 ↔ 1920년대 상하이 실재 — 시대 옮김", "short": "1930년대 경성 가상 ↔ 1920년대 상하이 실재 — 시대 옮김", "pages": [{"title": "앨범의 한 가상 시대", "body_md": "이 앨범의 한 가상 배경은 1930년대 경성 재즈 카바레다. Vol.1과 같은 좌표. 한 여가수가 한 카바레 무대에 서 있다는 한 가상의 한 그림.", "body_html": "<p>이 앨범의 한 가상 배경은 1930년대 경성 재즈 카바레다. Vol.1과 같은 좌표. 한 여가수가 한 카바레 무대에 서 있다는 한 가상의 한 그림.</p>", "plain_len": 60, "type": "page", "rawIndex": 1}, {"title": "현계옥의 한 실재 시대", "body_md": "그러나 현계옥의 한 실재 시대는 그 좌표가 아니다. 1896년 밀양에서 1932년 외몽골까지의 한 시간선 — 그 중심은 1920년대 상하이다. 1928년 코리안재즈밴드가 결성된 자리는 경성이지만 — 그 시점에 현계옥은 이미 상하이에서 8년째 다른 일을 하고 있었다.", "body_html": "<p>그러나 현계옥의 한 실재 시대는 그 좌표가 아니다. 1896년 밀양에서 1932년 외몽골까지의 한 시간선 — 그 중심은 1920년대 상하이다. 1928년 코리안재즈밴드가 결성된 자리는 경성이지만 — 그 시점에 현계옥은 이미 상하이에서 8년째 다른 일을 하고 있었다.</p>", "plain_len": 114, "type": "page", "rawIndex": 2}, {"title": "두 시대의 한 옮김", "body_md": "그래서 이 앨범의 한 자리는 한 옮김이다. 1920년대 상하이의 한 의열단원을 1930년대 경성 가상 카바레의 한 무대 위로 옮겼다. 실재의 한 자리에서 가상의 한 자리로의 옮김. 정직하게 적어두는 자리다.", "body_html": "<p>그래서 이 앨범의 한 자리는 한 옮김이다. 1920년대 상하이의 한 의열단원을 1930년대 경성 가상 카바레의 한 무대 위로 옮겼다. 실재의 한 자리에서 가상의 한 자리로의 옮김. 정직하게 적어두는 자리다.</p>", "plain_len": 87, "type": "page", "rawIndex": 3}, {"title": "가상의 한 자리가 한 진짜 결을 짚는 이유", "body_md": "그럼에도 그 한 가상이 한 진짜 결을 짚는다. 한 사람이 한 무대 위에서 한 얼굴로 보이는 동안 다른 한 얼굴로 살았다는 한 사실. 그 한 사실은 1920년 상하이에서도, 1930년대 경성 가상 카바레에서도, 똑같이 한 진짜다. 시대가 옮겨져도 한 사람의 한 두 얼굴은 같다.", "body_html": "<p>그럼에도 그 한 가상이 한 진짜 결을 짚는다. 한 사람이 한 무대 위에서 한 얼굴로 보이는 동안 다른 한 얼굴로 살았다는 한 사실. 그 한 사실은 1920년 상하이에서도, 1930년대 경성 가상 카바레에서도, 똑같이 한 진짜다. 시대가 옮겨져도 한 사람의 한 두 얼굴은 같다.</p>", "plain_len": 112, "type": "page", "rawIndex": 4}, {"title": "두 시대가 한 자리에 모이는 자리", "body_md": "한 앨범의 한 자리는 두 시대가 한 자리에 모이는 자리다. 1920년대 상하이의 한 실재 + 1930년대 경성 가상 = 한 무대 위의 한 사람. 그 한 사람은 한 시대의 한 사람이 아니라 — 두 시대의 한 사람이다.", "body_html": "<p>한 앨범의 한 자리는 두 시대가 한 자리에 모이는 자리다. 1920년대 상하이의 한 실재 + 1930년대 경성 가상 = 한 무대 위의 한 사람. 그 한 사람은 한 시대의 한 사람이 아니라 — 두 시대의 한 사람이다.</p>", "plain_len": 84, "type": "page", "rawIndex": 5}], "totalPages": 5}, {"num": "24", "key": "case", "label": "CASE", "ko": "사례", "title": "절정 선언 — \"나를 꽃이라 부르지 마오, 길동무라 불러주오\"", "short": "절정 선언 — \"나를 꽃이라 부르지 마오, 길동무라 불러주오\"", "pages": [{"title": "Track 10 \"길동무라 불러주오\" — 앨범의 정점", "body_md": "15곡 중에서 Track 10 \"길동무라 불러주오\"가 한 앨범의 한 정점이다. ballad 60, mood 절규(절제). 화자는 그녀, 청자는 그이. 장면은 한 재회의 밤. 가사의 한 절정에서 한 줄이 박힌다.", "body_html": "<p>15곡 중에서 Track 10 \"길동무라 불러주오\"가 한 앨범의 한 정점이다. ballad 60, mood 절규(절제). 화자는 그녀, 청자는 그이. 장면은 한 재회의 밤. 가사의 한 절정에서 한 줄이 박힌다.</p>", "plain_len": 90, "type": "page", "rawIndex": 1}, {"title": "\"나를 애인으로 혹은 한 여자로만 보지 말고 같은 동지로 생각해 달라\"", "body_md": "이 한 줄의 한 원형은 현계옥의 한 핵심 대사로 전해진다.\n\n> *\"나를 애인으로 혹은 한 여자로만 보지 말고 같은 동지로 생각해 달라.\"*\n\n이 한 줄이 Track 10의 한 심장이다. 앨범의 한 정신 문장이기도 하다.", "body_html": "<p>이 한 줄의 한 원형은 현계옥의 한 핵심 대사로 전해진다.</p>\n<blockquote><p><em>\"나를 애인으로 혹은 한 여자로만 보지 말고 같은 동지로 생각해 달라.\"</em></p></blockquote>\n<p>이 한 줄이 Track 10의 한 심장이다. 앨범의 한 정신 문장이기도 하다.</p>", "plain_len": 88, "type": "page", "rawIndex": 2}, {"title": "\"나를 꽃이라 부르지 마오, 길동무라 불러주오\"", "body_md": "가사로 옮긴 한 줄은 이것이다.\n\n> ***\"나를 꽃이라 부르지 마오, 길동무라 불러주오.\"***\n\n이 한 줄이 이 앨범의 한 이름이기도 하다. 꽃은 한 무대 위의 한 표층. 길동무는 한 길을 같이 걷는 한 사람. 한 자리가 아니라 한 방향.", "body_html": "<p>가사로 옮긴 한 줄은 이것이다.</p>\n<blockquote><p><strong><em>\"나를 꽃이라 부르지 마오, 길동무라 불러주오.\"</strong></em></p></blockquote>\n<p>이 한 줄이 이 앨범의 한 이름이기도 하다. 꽃은 한 무대 위의 한 표층. 길동무는 한 길을 같이 걷는 한 사람. 한 자리가 아니라 한 방향.</p>", "plain_len": 96, "type": "page", "rawIndex": 3}, {"title": "이 한 줄을 부르는 자리", "body_md": "이 한 줄을 부른 사람도, 듣는 사람도, 한 곡이 끝난 다음에는 한 자리에 앉아 있지 않는다. 한 방향을 본다. 그게 한 정점의 한 정점인 이유다. 한 가수의 한 자리가 한 청자의 한 자리로 옮겨가는 한 분.", "body_html": "<p>이 한 줄을 부른 사람도, 듣는 사람도, 한 곡이 끝난 다음에는 한 자리에 앉아 있지 않는다. 한 방향을 본다. 그게 한 정점의 한 정점인 이유다. 한 가수의 한 자리가 한 청자의 한 자리로 옮겨가는 한 분.</p>", "plain_len": 81, "type": "page", "rawIndex": 4}, {"title": "Track 10이 끝나면 Track 11이 시작된다", "body_md": "Track 10 \"길동무라 불러주오\"가 끝나면 Track 11 \"가야금 속\"이 시작된다. 거사의 밤. 가야금 속에 한 폭탄이 들어 있다. 한 선언이 한 거사로 흐르는 자리. 한 무대의 한 가수가 한 의열단의 한 단원으로 옮겨가는 한 분.", "body_html": "<p>Track 10 \"길동무라 불러주오\"가 끝나면 Track 11 \"가야금 속\"이 시작된다. 거사의 밤. 가야금 속에 한 폭탄이 들어 있다. 한 선언이 한 거사로 흐르는 자리. 한 무대의 한 가수가 한 의열단의 한 단원으로 옮겨가는 한 분.</p>", "plain_len": 98, "type": "page", "rawIndex": 5}], "totalPages": 5}, {"num": "25", "key": "archive", "label": "ARCHIVE", "ko": "자료", "title": "현계옥 모티프 사전 — 비련의 꽃이 아니라 길동무", "short": "현계옥 모티프 사전 — 비련의 꽃이 아니라 길동무", "pages": [{"title": "꽃 · 고운 이 · 홍일점 — 세상이 멋대로 부여한 가짜 나", "body_md": "첫 번째 모티프 — 꽃. 그리고 그 동의어들 — 고운 이, 홍일점. 한 시대가 그녀를 부르는 한 이름. 미인, 기생, 의열단의 홍일점. 다 다른 사람이 그녀에게 붙인 한 이름이지 그녀가 자기에게 붙인 한 이름이 아니다.", "body_html": "<p>첫 번째 모티프 — 꽃. 그리고 그 동의어들 — 고운 이, 홍일점. 한 시대가 그녀를 부르는 한 이름. 미인, 기생, 의열단의 홍일점. 다 다른 사람이 그녀에게 붙인 한 이름이지 그녀가 자기에게 붙인 한 이름이 아니다.</p>", "plain_len": 88, "type": "page", "rawIndex": 1}, {"title": "길동무 · 동무 — 동지의 안전 치환", "body_md": "두 번째 모티프 — 길동무. \"동지\"라는 한 직접 단어는 1930년대 경성 무대에서 부를 수 없었다. 그래서 길동무로 안전 치환했다. 한 길을 같이 걷는 한 사람. 한 길벗이 한 동지로 옮겨가는 한 단어 자리다.", "body_html": "<p>두 번째 모티프 — 길동무. \"동지\"라는 한 직접 단어는 1930년대 경성 무대에서 부를 수 없었다. 그래서 길동무로 안전 치환했다. 한 길을 같이 걷는 한 사람. 한 길벗이 한 동지로 옮겨가는 한 단어 자리다.</p>", "plain_len": 86, "type": "page", "rawIndex": 2}, {"title": "사내 옷 · 두 겹 저고리 — 세상 시선을 벗는 자유", "body_md": "세 번째 모티프 — 사내 옷. Track 08 \"사내 옷을 입고\"에서 남장의 한 변장이 등장한다. 천진에서 상해로 가는 한 길. 한 여성이 한 사내의 옷을 입고 — 세상 시선을 벗는 한 자유를 얻는다.", "body_html": "<p>세 번째 모티프 — 사내 옷. Track 08 \"사내 옷을 입고\"에서 남장의 한 변장이 등장한다. 천진에서 상해로 가는 한 길. 한 여성이 한 사내의 옷을 입고 — 세상 시선을 벗는 한 자유를 얻는다.</p>", "plain_len": 80, "type": "page", "rawIndex": 3}, {"title": "가야금 속 — 품은 결심", "body_md": "네 번째 모티프 — 가야금 속. Track 11 \"가야금 속\"에 한 폭탄이 들어 있다. 한 악기 속의 한 빈 곳에 한 거사가 들어 있다. 한 무대 위의 한 악기가 한 무대 뒤의 한 도구로 옮겨가는 한 자리.", "body_html": "<p>네 번째 모티프 — 가야금 <script>
(() => {

  const state = { day: 0, section: 0, page: 0, lastPages: {} };
  const el = {

    drawerAbout: document.getElementById('drawer-about'), drawerSources: document.getElementById('drawer-sources'), issueMap: document.getElementById('issueMap')
  };

  let pretextLib = null;
  const measureCanvas = document.createElement('canvas');
  const measureCtx = measureCanvas.getContext('2d');
  import('https://esm.sh/@chenglou/pretext@0.0.7?bundle')
    .then(mod => { pretextLib = mod; requestFrameLayout(); })
    .catch(() => { pretextLib = null; requestFrameLayout(); });

  function numberPx(value, fallback=0) {
    const n = parseFloat(value);
    return Number.isFinite(n) ? n : fallback;
  }
  function clampFloat(n, min, max) { return Math.max(min, Math.min(max, n)); }
  function textLayoutEstimate(text, font, width, lineHeight) {
    const clean = String(text || '').replace(/\s+/g, ' ').trim();
    if (!clean || width <= 0) return { lineCount: 0, height: 0, engine: pretextLib ? 'pretext' : 'fallback' };
    if (pretextLib && typeof pretextLib.prepare === 'function' && typeof pretextLib.layout === 'function') {
      try {
        const prepared = pretextLib.prepare(clean, font);
        const result = pretextLib.layout(prepared, width, lineHeight);
        return { lineCount: result.lineCount || Math.ceil((result.height || 0) / lineHeight), height: result.height || 0, engine: 'pretext' };
      } catch (_) {}
    }
    measureCtx.font = font;
    let lineWidth = 0, lines = 1;
    for (const ch of clean) {
      if (ch === '\n') { lines++; lineWidth = 0; continue; }
      const w = measureCtx.measureText(ch).width;
      if (lineWidth > 0 && lineWidth + w > width) { lines++; lineWidth = w; }
      else lineWidth += w;
    }
    return { lineCount: lines, height: lines * lineHeight, engine: 'canvas-fallback' };
  }
  function renderMeterHTML(section, pageIndex) {
    return section.pages.map((_, i) => `<span class="v-dot ${i < pageIndex ? 'is-read' : ''} ${i === pageIndex ? 'active' : ''}"></span>`).join('');
  }
  function requestFrameLayout() {
    cancelAnimationFrame(requestFrameLayout.raf);
    requestFrameLayout.raf = requestAnimationFrame(applyFrameLayout);
  }
  function applyFrameLayout() {
    const article = el.stage.querySelector('.article-page');
    if (!article) return;
    const copy = article.querySelector('.page-copy');
    const pageArt = article.querySelector('.page-art');
    const frame = article.querySelector('.page-frame');
    const main = article.querySelector('.page-main');
    if (!copy || !frame || !main) return;

    const w = article.clientWidth;
    const h = article.clientHeight;
    const pageCount = currentSection().pages.length;
    const compact = h < 760 || w < 370;

    const meterW = Math.round(clampFloat(14 + Math.min(pageCount, 8) * 1.25, compact ? 16 : 18, compact ? 19 : 23));
    const gap = Math.round(clampFloat(w * 0.026, compact ? 6 : 8, compact ? 9 : 13));
    const padL = Math.round(clampFloat(w * 0.052, compact ? 15 : 18, compact ? 18 : 22));
    const padR = Math.round(clampFloat(w * 0.034, compact ? 10 : 12, compact ? 13 : 16));
    const padT = compact ? 14 : 18;
    const padB = compact ? 14 : 18;
    const contentW = Math.max(176, w - padL - padR - meterW - gap);

    article.style.setProperty('--pretext-meter-w', `${meterW}px`);
    article.style.setProperty('--pretext-meter-gap', `${gap}px`);
    article.style.setProperty('--pretext-content-w', `${contentW}px`);
    article.style.setProperty('--pretext-page-pad-t', `${padT}px`);
    article.style.setProperty('--pretext-page-pad-r', `${padR}px`);
    article.style.setProperty('--pretext-page-pad-b', `${padB}px`);
    article.style.setProperty('--pretext-page-pad-l', `${padL}px`);

    // Reset before measuring. Each slide calculates its own text density and visual weight.
    article.classList.remove('no-art');
    article.dataset.overflow = 'false';
    article.style.setProperty('--copy-font-size', compact ? '14.5px' : '16px');
    article.style.setProperty('--copy-line-height', compact ? '1.64' : '1.76');
    article.style.setProperty('--copy-para-gap', compact ? '.62em' : '.82em');
    article.style.setProperty('--copy-mt', compact ? '10px' : '14px');
    article.style.setProperty('--subtitle-size', compact ? '14px' : '15px');
    article.style.setProperty('--subtitle-mt', compact ? '6px' : '8px');
    article.style.setProperty('--title-size', compact ? 'clamp(25px,7.5vw,37px)' : 'clamp(28px,8.4vw,42px)');
    article.style.setProperty('--cover-title-size', compact ? 'clamp(28px,8.7vw,44px)' : 'clamp(32px,10vw,50px)');
    article.style.setProperty('--art-pad-top', compact ? '8px' : '12px');

    const fixedNodes = Array.from(main.children).filter(node => node !== copy && node !== pageArt);
    const fixedH = () => fixedNodes.reduce((sum, node) => sum + node.getBoundingClientRect().height, 0);
    const family = getComputedStyle(copy).fontFamily || 'serif';
    const plain = copy.textContent.replace(/\s+/g, ' ').trim();
    const hasTables = !!copy.querySelector('table, pre, blockquote, .note-card');
    const isCover = article.classList.contains('type-cover');

    const baseTerrain = isCover ? (compact ? 64 : 92) : (compact ? 58 : 82);
    const candidates = [
      {fs: compact ? 14.5 : 16.0, lh: compact ? 1.64 : 1.76, terrain: baseTerrain, para: compact ? .62 : .82, artTop: compact ? 8 : 12, hideArt:false},
      {fs: compact ? 14.1 : 15.4, lh: compact ? 1.60 : 1.68, terrain: compact ? 50 : 66, para:.58, artTop:8, hideArt:false},
      {fs: compact ? 13.7 : 14.8, lh: compact ? 1.56 : 1.62, terrain: compact ? 42 : 54, para:.50, artTop:7, hideArt:false},
      {fs: compact ? 13.4 : 14.3, lh: compact ? 1.54 : 1.58, terrain: compact ? 34 : 42, para:.42, artTop:6, hideArt:false},
      {fs: compact ? 13.2 : 14.0, lh: compact ? 1.52 : 1.56, terrain: 0, para:.38, artTop:0, hideArt:true}
    ];
    let chosen = candidates[candidates.length - 1];
    let measured = {height:0, lineCount:0, engine: pretextLib ? 'pretext' : 'canvas-fallback'};
    for (const cand of candidates) {
      const lineHeightPx = cand.fs * cand.lh;
      const font = `400 ${cand.fs}px ${family}`;
      measured = textLayoutEstimate(plain, font, contentW, lineHeightPx);
      const visualH = cand.hideArt ? 0 : cand.terrain + cand.artTop;
      const nonTextH = fixedH() + visualH;
      const availableForCopy = Math.max(96, h - padT - padB - nonTextH);
      // Tables/preformatted blocks are less predictable than plain text, so leave a little more room.
      const safeFactor = hasTables ? 0.84 : 0.94;
      if (measured.height <= availableForCopy * safeFactor) { chosen = cand; break; }
    }
    article.classList.toggle('no-art', chosen.hideArt);
    article.style.setProperty('--copy-font-size', `${chosen.fs}px`);
    article.style.setProperty('--copy-line-height', `${chosen.lh}`);
    article.style.setProperty('--copy-para-gap', `${chosen.para}em`);
    article.style.setProperty('--pretext-terrain-h', `${chosen.terrain}px`);
    article.style.setProperty('--art-pad-top', `${chosen.artTop}px`);
    article.dataset.layoutEngine = measured.engine;

    // Final pass: if the browser's actual painting still overflows, shrink locally.
    requestAnimationFrame(() => {
      if (!copy.isConnected) return;
      if (copy.scrollHeight > copy.clientHeight + 2) {
        article.classList.add('no-art');
        const now = parseFloat(getComputedStyle(copy).fontSize) || chosen.fs;
        const smaller = Math.max(compact ? 12.8 : 13.5, now - 0.6);
        article.style.setProperty('--copy-font-size', `${smaller}px`);
        article.style.setProperty('--copy-line-height', compact ? '1.50' : '1.54');
        article.style.setProperty('--copy-para-gap', '.34em');
        article.dataset.overflow = copy.scrollHeight > copy.clientHeight + 2 ? 'true' : 'false';
      }
    });
  }

  function currentDay() { return DATA.days[state.day]; }
  function currentSection() { return currentDay().sections[state.section]; }
  function currentPage() { return currentSection().pages[state.page]; }
  function keyOf(d=state.day, s=state.section) { return `${d}:${s}`; }
  function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }
  function pad2(n) { return String(n).padStart(2,'0'); }
  function dayDate(d) { return d.date.slice(-2); }
  function allPagesBefore() {
    let n = 0;
    DATA.days.forEach((d, di) => d.sections.forEach((s, si) => s.pages.forEach((p, pi) => { if (di < state.day || (di === state.day && (si < state.section || (si === state.section && pi <= state.page)))) n++; })));
    return n;
  }
  function totalPages() { return DATA.summary.pageCount; }
  function escapeAttr(s) { return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
  function renderTerrain(day, section, page) {
    const label = `${section.key} · ${day.weekdayFull}`;
    const num = `${day.no}/${pad2(page.rawIndex)}`;
    return `<div class="terrain" aria-hidden="true"><span class="art-label">${escapeAttr(label)}</span><span class="art-no">${escapeAttr(num)}</span><svg viewBox="0 0 320 90" preserveAspectRatio="none"><path d="M0 68 C42 38 74 78 112 46 C146 16 174 56 205 35 C242 11 276 46 320 24" fill="none" stroke="#111" stroke-opacity=".72" stroke-width="1.2"/><path d="M0 78 C38 59 72 82 112 68 C148 56 174 73 214 52 C252 32 290 54 320 41" fill="none" stroke="#111" stroke-opacity=".32" stroke-width="1"/><path d="M0 90 L0 76 C54 58 88 92 132 73 C174 55 211 88 255 63 C284 46 305 50 320 44 L320 90 Z" fill="#111" fill-opacity=".045"/></svg></div>`;
  }
  function renderPage(direction='right') {
    const d = currentDay(), s = currentSection(), p = currentPage();
    const isCover = p.type === 'cover';
    const dayNote = (state.section === 0 && state.page === 0 && d.note_html) ? `<div class="day-note-inline">${d.note_html}</div>` : '';
    const pageTitle = p.title.replace(/^Page\s+\d+\s+·\s*/, '');
    const cls = direction ? `enter-${direction}` : '';
    const countText = `${pad2(state.page+1)} / ${pad2(s.pages.length)}`;
    const html = `
      <article class="article-page type-${p.type} ${isCover?'type-cover':''} ${cls}">
        <div class="page-frame">
          <main class="page-main">
            <header class="page-kicker">
              <div class="kicker-left"><div class="micro">${d.date} · ${d.weekdayFull} · No.${d.no}</div><div class="theme-line">${escapeAttr(d.theme)}</div></div>
              <div class="page-count"><b>${countText}</b>${s.key}</div>
            </header>
            <div class="cover-meta">
              <div class="issue-no">NO.<b>${d.no}</b></div>
              <div class="section-pill">${s.num} ${s.key} · ${s.ko}</div>
            </div>
            <h1 class="article-title">${escapeAttr(isCover ? s.title : pageTitle)}</h1>
            <h2 class="page-subtitle">${escapeAttr(isCover ? pageTitle : s.title)}</h2>
            <div class="page-copy">${p.body_html}${dayNote}</div>
            <div class="page-art">${renderTerrain(d,s,p)}</div>
          </main>
          <aside class="page-meter-lane" aria-hidden="true"><div class="page-meter" data-page-meter>${renderMeterHTML(s, state.page)}</div></aside>
        </div>
      </article>`;
    el.stage.innerHTML = html;
    renderChrome();
    requestFrameLayout();
  }
  function renderChrome() {
    const d = currentDay(), s = currentSection();
    [...el.dayNav.children].forEach((b,i)=>b.classList.toggle('active', i===state.day));
    [...el.rail.children].forEach((b,i)=>b.classList.toggle('active', i===state.section));
    const meter = el.stage.querySelector('[data-page-meter]');
    if (meter) meter.innerHTML = renderMeterHTML(s, state.page);
    el.progress.style.width = `${(allPagesBefore()/totalPages())*100}%`;
    document.title = `${d.weekdayFull} No.${d.no} · ${s.key} · Achmage Society Magazine`;
  }
  function saveLast() { state.lastPages[keyOf()] = state.page; }
  function goDay(i) {
    const old = state.day;
    if (i === old) { state.section = 0; state.page = 0; renderPage('down'); return; }
    saveLast(); state.day = clamp(i,0,DATA.days.length-1); state.section = 0; state.page = state.lastPages[keyOf()] || 0; renderPage(i>old?'right':'left');
  }
  function goSection(i, fromMap=false) {
    if (i === state.section && !fromMap) { state.page = 0; renderPage('down'); return; }
    const old = state.section; saveLast(); state.section = clamp(i,0,currentDay().sections.length-1); state.page = state.lastPages[keyOf()] || 0; renderPage(state.section > old ? 'right' : 'left');
  }
  function goPage(i, dir=null) {
    const old = state.page; state.page = clamp(i,0,currentSection().pages.length-1); renderPage(dir || (state.page>old?'up':'down'));
  }
  function nextPage() { if (state.page < currentSection().pages.length-1) goPage(state.page+1,'up'); else toast('마지막 페이지입니다'); }
  function prevPage() { if (state.page > 0) goPage(state.page-1,'down'); else toast('첫 페이지입니다'); }
  function nextSection() { if (state.section < currentDay().sections.length-1) goSection(state.section+1); else toast('마지막 섹션입니다'); }
  function prevSection() { if (state.section > 0) goSection(state.section-1); else toast('첫 섹션입니다'); }
  function toast(msg) { el.toast.textContent = msg; el.toast.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.toast.classList.remove('show'),900); }
  function initChrome() {
    el.dayNav.innerHTML = DATA.days.map((d,i)=>`<button class="day-btn" type="button" data-day="${i}"><span>${d.weekday}</span><b>${dayDate(d)}</b></button>`).join('');
    el.rail.innerHTML = DATA.sectionOrder.map((k,i)=>`<button class="section-tab" type="button" data-section="${i}" data-ko="${sectionNameKo(k)}">${k}</button>`).join('');
    el.dayNav.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',()=>{ const old=state.day; const ni=Number(b.dataset.day); saveLast(); state.day=ni; state.section=0; state.page=0; renderPage(ni>old?'right':'left'); }));
    el.rail.querySelectorAll('[data-section]').forEach(b=>b.addEventListener('click',()=>goSection(Number(b.dataset.section))));
  }
  function sectionNameKo(k) { return ({Intro:'입구',Issue:'쟁점',Insight:'해석',Case:'사례',Archive:'기록'})[k] || k; }
  function buildDrawer() {
    el.drawerAbout.innerHTML = DATA.front_html;
    el.drawerSources.innerHTML = DATA.sources_html;
    el.issueMap.innerHTML = DATA.days.map((d,di)=>`<div class="map-day"><div class="map-day-head"><div><small>${d.date} · No.${d.no}</small><h3>${d.weekdayFull} · ${escapeAttr(d.theme)}</h3></div><small>${d.sections.reduce((a,s)=>a+s.pages.length,0)}p</small></div><div class="map-section-row">${d.sections.map((s,si)=>`<button class="map-cell ${di===state.day&&si===state.section?'active':''}" data-map-day="${di}" data-map-section="${si}">${s.key} · ${s.pages.length}</button>`).join('')}</div></div>`).join('');
    el.issueMap.querySelectorAll('[data-map-day]').forEach(btn=>btn.addEventListener('click',()=>{ saveLast(); state.day=Number(btn.dataset.mapDay); state.section=Number(btn.dataset.mapSection); state.page=state.lastPages[keyOf()]||0; closeDrawer(); renderPage('right'); }));
  }
  function openDrawer(tab='about') { buildDrawer(); el.drawer.classList.add('open'); selectDrawerTab(tab); }
  function closeDrawer() { el.drawer.classList.remove('open'); }
  function selectDrawerTab(tab) {
    document.querySelectorAll('.drawer-tab').forEach(b=>b.classList.toggle('active', b.dataset.drawerTab===tab));
    document.querySelectorAll('.drawer-section').forEach(s=>s.classList.toggle('active', s.id===`drawer-${tab}`));
  }
  document.querySelectorAll('.drawer-tab').forEach(b=>b.addEventListener('click',()=>selectDrawerTab(b.dataset.drawerTab)));
  el.brandBtn.addEventListener('click',()=>openDrawer('about'));
  el.mapBtn.addEventListener('click',()=>openDrawer('map'));
  el.closeDrawer.addEventListener('click',closeDrawer);
  el.drawer.addEventListener('click',(e)=>{ if(e.target===el.drawer) closeDrawer(); });
  document.addEventListener('keydown',e=>{
    if(el.drawer.classList.contains('open')) { if(e.key==='Escape') closeDrawer(); return; }
    if(e.key==='ArrowRight') nextSection();
    if(e.key==='ArrowLeft') prevSection();
    if(e.key==='ArrowDown' || e.key==='PageDown') nextPage();
    if(e.key==='ArrowUp' || e.key==='PageUp') prevPage();
    if(e.key==='Home') goPage(0,'down');
    if(e.key==='End') goPage(currentSection().pages.length-1,'up');
  });
  const swipeTarget = document.getElementById('app');
  let lastSwipeT = 0;
  function processSwipe(dx, dy) {
    if(el.drawer.classList.contains('open')) return;
    const now = Date.now();
    if(now - lastSwipeT < 220) return;
    const adx = Math.abs(dx), ady = Math.abs(dy);
    if(Math.max(adx,ady) < 42) return;
    lastSwipeT = now;
    if(adx > ady*1.25) { dx<0 ? nextSection() : prevSection(); }
    else { dy<0 ? nextPage() : prevPage(); }
  }
  let pStartX=0, pStartY=0;
  swipeTarget.addEventListener('pointerdown',e=>{ pStartX=e.clientX; pStartY=e.clientY; },{passive:true});
  swipeTarget.addEventListener('pointerup',e=>{ processSwipe(e.clientX-pStartX, e.clientY-pStartY); },{passive:true});
  let tStartX=0, tStartY=0;
  swipeTarget.addEventListener('touchstart',e=>{ const t=e.touches[0]; if(!t) return; tStartX=t.clientX; tStartY=t.clientY; },{passive:true});
  swipeTarget.addEventListener('touchend',e=>{ const t=e.changedTouches[0]; if(!t) return; processSwipe(t.clientX-tStartX, t.clientY-tStartY); },{passive:true});
  function showOnboardingToast() {
    try { if(localStorage.getItem('asc-shell-onboarded') === '1') return; } catch(_) {}
    el.toast.textContent = '↕ 페이지  ·  ↔ 섹션';
    el.toast.classList.add('show');
    setTimeout(()=>el.toast.classList.remove('show'), 5000);
    try { localStorage.setItem('asc-shell-onboarded', '1'); } catch(_) {}
  }
  window.addEventListener('resize', requestFrameLayout, {passive:true});
  if ('ResizeObserver' in window) new ResizeObserver(requestFrameLayout).observe(el.stage);
  initChrome(); buildDrawer(); renderPage('right'); showOnboardingToast();
})();
</script>
