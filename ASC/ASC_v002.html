<script id="magazine-data" type="application/json">{"summary": {"title": "Achmage Society Magazine", "volume": "Volume 002", "publisher": "Achmage", "concept": "주류 시장을 넘보는 비주류의 역습", "period": "2026-05-11 ~ 2026-05-17", "leadPlace": "서울특별시 성동구 성수동", "pageCount": 161, "sectionCount": 35}, "front_html": "<p>나는 원래 수제맥주 광이었다. 그 중에서도 New England Double IPA. 6도에서 7도 사이의 도수, 고도수는 7~8도까지 가는 것들. 잔에 따르면 불투명한 오렌지색이고, 입에 닿으면 처음에는 달달한 주스 같다가 곧 진한 홉의 쓴맛이 따라오는 그런 술. 소맥보다 훨씬 강하면서도 하이볼보다 세련된 달콤씁쓸함이 있다. 하이볼의 인위적인 탄산과 위스키가 섞인 맛과는 결이 다르다.</p>\n<p>NE DIPA 를 여전히 좋아한다. 다만 2년 전에 결혼을 했고, 예전처럼 무작정 들이부을 수는 없게 됐다. 신나게 마시다 필름이 끊기거나 다음 날 숙취에 크게 힘들어하며 낭패를 본 경험이 몇 번 있었다. 그래서 “여전히 좋아하기는 하지만, 이제는 나이가 들었고, 매일 홈트를 1217일째 이어오고 있고 1년에 1200km 가까이 달리며 건강을 관리하고 있으니, 그래, 마실 때 기분은 좋지만 취하도록 마셔봐야 뭐 하나. 나이 들면 점차 줄여야지” 라는 톤으로 한 두 잔으로 줄여왔다.</p>\n<p>그러던 어느 날 홈플러스에서 ‘카스 0.0’ 을 봤다. 첫 인상은 회의적이었다. “원본 카스도 해외 독일식 라거나 미국식 IPA 라인업에 비하면 맥주 마니아 사이에서 ‘오줌맛 맥주’ 라는 평까지 듣는 국내 맥주인데. 그 무알콜 버전이라니. 기껏해야 맥주맛 탄산수겠지.” 기대를 내려놓고 마셔봤다. 차갑게 냉장고에 하루 정도 두었다가 꺼낸 한 모금. 그런데 의외였다. 원본 알콜 카스와 별로 큰 차이를 못 느낄 정도로 맥주에 가까웠다.</p>\n<p>이번 호의 질문은 거기서 시작한다.</p>\n<p>술이 줄어드는 시장에서, 무엇이 새로 그려지고 있는가. <strong>주류(主流)</strong> 라는 한자어가 두 뜻을 가진 우연 — 술과 메인스트림 — 이 한꺼번에 흔들리는 시간을 어떻게 읽어야 하는가. 한 사람의 매대 앞 의외성 한 모금이 어떻게 한 사회의 곡선이 되는가. 더 나아가, 내가 좋아하던 NE DIPA 의 그 진한 풍미가 알콜 없이도 구현되는 날이 온다면, 그리고 AI 의 힘을 빌어 ‘취한 기분’ 만 깔끔하게 흉내내면서도 숙취가 없고 마음먹으면 즉시 깰 수 있는 새로운 물질이 등장하는 날이 온다면, 그 시장은 어떻게 바뀔 것인가.</p>\n<p>Vol001 (영월) 은 한 도시를 7일로 천천히 읽었다. Vol002 는 한 사회 현상을 7일로 천천히 읽는다. 결론을 빨리 내지 않는 원칙은 같다. “대체다” 라고 단정하지도 않고, “유행이다” 라고 결론짓지도 않는다. 그 사이의 자리에서 본다.</p>\n<blockquote><p><strong>한 잔이라는 단위는 어떻게 흔들리는가.</strong></p></blockquote>\n<p>이 질문으로 7일을 나눈다. 월요일은 현상, 화요일은 기술, 수요일은 문화, 목요일은 업태, 금요일은 해외, 토요일은 논쟁, 일요일은 결론. 결론이라고 했지만, Vol001 마지막 날의 톤대로 — 답이 아니라 다음 질문으로 닫는다.</p>\n<p>---</p>", "sources_html": "<blockquote><p>본 호에서 인용된 모든 자료의 출처 리스트. 본문에서 <code>R-01</code> ~ <code>R-42</code> 식으로 표시.</p></blockquote>\n<p><strong>T1 — 1차 공식 통계 (5)</strong></p>\n<ul><li><strong>R-01</strong> 국세청 주세 신고현황 2024 — [공공데이터 ections": [{"num": "01", "key": "Intro", "label": "Intro", "ko": "입구", "short": "IN", "title": "매대 앞의 한 캔", "pages": [{"title": "Page 01 · Cover", "type": "cover", "rawIndex": 1, "body_md": "“오줌맛 카스의 제로 버전?”\n\n홈플러스 음료 매대 앞에서 카스 0.0 캔 한 줄을 처음 봤을 때 든 첫 인상이다. 기대를 거의 안 했다. 그런데 그 캔이 카트에 들어간 어느 날부터, 한 사회의 한 곡선과 한 사람의 한 모금이 같은 자리에 놓이게 됐다.", "body_html": "<p>“오줌맛 카스의 제로 버전?”</p>\n<p>홈플러스 음료 매대 앞에서 카스 0.0 캔 한 줄을 처음 봤을 때 든 첫 인상이다. 기대를 거의 안 했다. 그런데 그 캔이 카트에 들어간 어느 날부터, 한 사회의 한 곡선과 한 사람의 한 모금이 같은 자리에 놓이게 됐다.</p>", "plain_len": 140}, {"title": "Page 02 · Scene", "type": "essay", "rawIndex": 2, "body_md": "나는 NE DIPA 광이었다. 정확히는 New England Double IPA. 6도에서 8도까지의 도수에, 잔에 따르면 불투명한 오렌지색이고, 입에 닿으면 처음에는 달달한 주스 같다가 곧 진한 홉의 쓴맛이 입안을 채우는 그런 술. 소맥보다 훨씬 강하면서도 하이볼보다 세련된 달콤씁쓸함이 있다. 한국에 정식 수입되는 NE DIPA 라인업을 거의 다 한 번씩은 마셔봤다고 해도 큰 과장이 아닐 것이다.\n\n그런 내가 홈플러스 음료 매대에서 카스 0.0 캔 한 줄을 본 것이다. 처음에는 그냥 지나쳤다. “원본 카스도 맥주 마니아 사이에서 ‘오줌맛’ 이라는 평을 받는 국내 라거인데. 그 무알콜 버전이라니. 기껏해야 맥주맛 탄산수겠지.”\n\n그런데 다음 번 장보기에서 한 번 더 보였고, 그 다음 번에는 무심코 카트에 넣어버렸다. 호기심이 회의보다 약간 더 컸을 뿐이다.", "body_html": "<p>나는 NE DIPA 광이었다. 정확히는 New England Double IPA. 6도에서 8도까지의 도수에, 잔에 따르면 불투명한 오렌지색이고, 입에 닿으면 처음에는 달달한 주스 같다가 곧 진한 홉의 쓴맛이 입안을 채우는 그런 술. 소맥보다 훨씬 강하면서도 하이볼보다 세련된 달콤씁쓸함이 있다. 한국에 정식 수입되는 NE DIPA 라인업을 거의 다 한 번씩은 마셔봤다고 해도 큰 과장이 아닐 것이다.</p>\n<p>그런 내가 홈플러스 음료 매대에서 카스 0.0 캔 한 줄을 본 것이다. 처음에는 그냥 지나쳤다. “원본 카스도 맥주 마니아 사이에서 ‘오줌맛’ 이라는 평을 받는 국내 라거인데. 그 무알콜 버전이라니. 기껏해야 맥주맛 탄산수겠지.”</p>\n<p>그런데 다음 번 장보기에서 한 번 더 보였고, 그 다음 번에는 무심코 카트에 넣어버렸다. 호기심이 회의보다 약간 더 컸을 뿐이다.</p>", "plain_len": 426}, {"title": "Page 03 · First Sip", "type": "essay", "rawIndex": 3, "body_md": "집에 와서 냉장고에 넣어두고 하루 정도 잊고 있었다. 그 다음 날 저녁에 차갑게 식은 카스 0.0 을 꺼냈다. 잔에 따랐다. 일반 카스와 거의 같은 색, 거의 같은 거품. 그리고 첫 모금.\n\n“어, 이거 뭐지?”\n\n생각보다 맥주에 가까웠다. 일반 알콜 카스와 비교해서 별로 큰 차이를 느끼지 못할 정도로. 맥주맛 탄산수가 아니라 그냥 맥주에 가까운 한 잔이었다.\n\n이 한 모금이 작은 사건이 아닌가 싶었다. 한 사람의 미각이 “괜찮네” 라고 한 번 결정한 무알콜 캔은, 그 다음번 장보기에서 자연스럽게 다시 카트에 들어간다. 그 자연스러움이 한 동네에서 수만 명에게 동시에 일어나면, 그것이 바로 매대의 곡선이 된다.", "body_html": "<p>집에 와서 냉장고에 넣어두고 하루 정도 잊고 있었다. 그 다음 날 저녁에 차갑게 식은 카스 0.0 을 꺼냈다. 잔에 따랐다. 일반 카스와 거의 같은 색, 거의 같은 거품. 그리고 첫 모금.</p>\n<p>“어, 이거 뭐지?”</p>\n<p>생각보다 맥주에 가까웠다. 일반 알콜 카스와 비교해서 별로 큰 차이를 느끼지 못할 정도로. 맥주맛 탄산수가 아니라 그냥 맥주에 가까운 한 잔이었다.</p>\n<p>이 한 모금이 작은 사건이 아닌가 싶었다. 한 사람의 미각이 “괜찮네” 라고 한 번 결정한 무알콜 캔은, 그 다음번 장보기에서 자연스럽게 다시 카트에 들어간다. 그 자연스러움이 한 동네에서 수만 명에게 동시에 일어나면, 그것이 바로 매대의 곡선이 된다.</p>", "plain_len": 342}, {"title": "Page 04 · Bridge", "type": "essay", "rawIndex": 4, "body_md": "그 다음부터 마트 매대를 다르게 보게 됐다.\n\n이전에는 보이지 않던 자리가 보이기 시작했다. 일반 맥주 옆에 자리 잡은 무알콜 칸. 카스 0.0 옆에 하이트 제로 0.00 이 있고, 그 옆에 클라우드 클리어가 있고, 칭따오 논알콜릭이 있다. 한 칸이었던 것이 두 칸이 되고 있었다. 같은 시기에 일반 맥주 매대는 면적이 줄지는 않았지만, 신제품 회전이 느려진 인상이었다.\n\n같은 무렵에 두 개의 다른 기사를 봤다. 하나는 “법원, 어메이징브루잉 회생절차 폐지 결정… 파산 수순.” 성수동의 한 양조장이 문을 닫는다는 소식이다. 다른 하나는 “국세청 주류 출고량, 2년 연속 감소.” 한 나라의 술이 줄어든다는 통계다.\n\n매대에서 본 변화와 두 기사가 같은 이야기를 다르게 하고 있었다. 거리의 단면과 산업의 단면, 그리고 한 사람의 한 모금이 같은 방향을 가리키고 있었다.\n\n다음 탭으로 간다. 그 두 곡선이 어디에서 만나는지부터 본다.", "body_html": "<p>그 다음부터 마트 매대를 다르게 보게 됐다.</p>\n<p>이전에는 보이지 않던 자리가 보이기 시작했다. 일반 맥주 옆에 자리 잡은 무알콜 칸. 카스 0.0 옆에 하이트 제로 0.00 이 있고, 그 옆에 클라우드 클리어가 있고, 칭따오 논알콜릭이 있다. 한 칸이었던 것이 두 칸이 되고 있었다. 같은 시기에 일반 맥주 매대는 면적이 줄지는 않았지만, 신제품 회전이 느려진 인상이었다.</p>\n<p>같은 무렵에 두 개의 다른 기사를 봤다. 하나는 “법원, 어메이징브루잉 회생절차 폐지 결정… 파산 수순.” 성수동의 한 양조장이 문을 닫는다는 소식이다. 다른 하나는 “국세청 주류 출고량, 2년 연속 감소.” 한 나라의 술이 줄어든다는 통계다.</p>\n<p>매대에서 본 변화와 두 기사가 같은 이야기를 다르게 하고 있었다. 거리의 단면과 산업의 단면, 그리고 한 사람의 한 모금이 같은 방향을 가리키고 있었다.</p>\n<p>다음 탭으로 간다. 그 두 곡선이 어디에서 만나는지부터 본다.</p>", "plain_len": 464}], "totalPages": 4}, {"num": "02", "key": "Issue", "label": "Issue", "ko": "쟁점", "short": "IS", "title": "줄어드는 술, 자라나는 0.0", "pages": [{"title": "Page 01 · Cover", "type": "cover", "rawIndex": 1, "body_md": "두 곡선이 만나는 지점.\n\n한쪽 그래프는 내려가고, 다른 쪽 그래프는 올라간다. 같은 시기에 같은 시장 안에서. 처음 본 사람은 우연이라고 말할 수 있다. 오래 본 사람은 우연이 아닐 수도 있다고 말한다.\n\n지금부터 본다.", "body_html": "<p>두 곡선이 만나는 지점.</p>\n<p>한쪽 그래프는 내려가고, 다른 쪽 그래프는 올라간다. 같은 시기에 같은 시장 안에서. 처음 본 사람은 우연이라고 말할 수 있다. 오래 본 사람은 우연이 아닐 수도 있다고 말한다.</p>\n<p>지금부터 본다.</p>", "plain_len": 122}, {"title": "Page 02 · Data — 출고량", "type": "data", "rawIndex": 2, "body_md": "국세청이 매년 내는 주세 신고 자료가 있다. 그 자료에 따르면 국내 전체 주류 출고량은 2022년 326.86만 킬로리터에서 2023년 323.70만 킬로리터로 줄었고, 2024년에는 315.14만 킬로리터까지 떨어졌다. 2년 연속 감소이고, 두 번째 해의 감소폭은 첫 해보다 컸다. 전년 대비 2.7% 줄었다 (R-01).\n\n킬로리터라는 단위는 직관적이지 않지만 의미는 분명하다. 한 사회가 마시는 술의 총량이 두 해 연속으로 적어졌다. 인구가 비슷한 상황에서 총량이 줄었다는 것은, 1인당 평균이 줄었다는 뜻이다.\n\n이 그래프 하나만 보면 단순한 결론을 내고 싶어진다. 한국 사람들이 술을 덜 마시기 시작했다, 라고. 그러나 단순한 결론은 보통 절반만 맞다.", "body_html": "<p>국세청이 매년 내는 주세 신고 자료가 있다. 그 자료에 따르면 국내 전체 주류 출고량은 2022년 326.86만 킬로리터에서 2023년 323.70만 킬로리터로 줄었고, 2024년에는 315.14만 킬로리터까지 떨어졌다. 2년 연속 감소이고, 두 번째 해의 감소폭은 첫 해보다 컸다. 전년 대비 2.7% 줄었다 (R-01).</p>\n<p>킬로리터라는 단위는 직관적이지 않지만 의미는 분명하다. 한 사회가 마시는 술의 총량이 두 해 연속으로 적어졌다. 인구가 비슷한 상황에서 총량이 줄었다는 것은, 1인당 평균이 줄었다는 뜻이다.</p>\n<p>이 그래프 하나만 보면 단순한 결론을 내고 싶어진다. 한국 사람들이 술을 덜 마시기 시작했다, 라고. 그러나 단순한 결론은 보통 절반만 맞다.</p>", "plain_len": 368}, {"title": "Page 03 · Data — 무알콜", "type": "data", "rawIndex": 3, "body_md": "같은 시기에 다른 그래프가 있다.\n\n국내 무알콜·비알콜 맥주 시장 규모는 2021년 약 415억 원에서 2024년 약 704억 원으로 늘었고, 2027년에는 946억 원에 이를 것으로 예상된다는 추정이 있다 (R-07). 다른 추정은 더 큰 수를 본다. 2021년 약 200억 원에서 2025년 약 2,000억 원, 즉 10배까지 본다 (R-09). 두 추정의 차이는 무엇을 무알콜로 셀 것인가의 정의 차이에서 온다. 보수치로 잡아도 3년 만에 70% 가까이 성장이다.\n\n매년 두 자릿수 성장은 일반 식품 카테고리에서 드문 일이다. 무알콜이 흐름이 아니라 자리 잡은 카테고리가 되어가고 있다는 신호다.", "body_html": "<p>같은 시기에 다른 그래프가 있다.</p>\n<p>국내 무알콜·비알콜 맥주 시장 규모는 2021년 약 415억 원에서 2024년 약 704억 원으로 늘었고, 2027년에는 946억 원에 이를 것으로 예상된다는 추정이 있다 (R-07). 다른 추정은 더 큰 수를 본다. 2021년 약 200억 원에서 2025년 약 2,000억 원, 즉 10배까지 본다 (R-09). 두 추정의 차이는 무엇을 무알콜로 셀 것인가의 정의 차이에서 온다. 보수치로 잡아도 3년 만에 70% 가까이 성장이다.</p>\n<p>매년 두 자릿수 성장은 일반 식품 카테고리에서 드문 일이다. 무알콜이 흐름이 아니라 자리 잡은 카테고리가 되어가고 있다는 신호다.</p>", "plain_len": 334}, {"title": "Page 04 · Data — 편의점", "type": "data", "rawIndex": 4, "body_md": "세 번째 그래프는 더 작은 단위에서 온다.\n\n2025년 1분기 편의점 3사의 대학가 주류 매출이 일제히 줄었다. CU에서는 맥주 5.5%, 소주 4.1%. 세븐일레븐에서는 소주 3%, 맥주 5%. GS25에서는 소주 2.3% (R-12). 같은 매장 비교이고 같은 분기 비교다. 3사 모두 감소이고, 모두 대학가 근처다.\n\n대학가는 한 사회의 음주 습관이 만들어지는 자리 중 하나다. 그 자리에서 술이 빠지면, 그 빠진 자리는 시간이 지나 다른 자리로 이동한다. 지금 이 그래프는 5년 뒤 그래프의 미리 보기일 수도 있다.", "body_html": "<p>세 번째 그래프는 더 작은 단위에서 온다.</p>\n<p>2025년 1분기 편의점 3사의 대학가 주류 매출이 일제히 줄었다. CU에서는 맥주 5.5%, 소주 4.1%. 세븐일레븐에서는 소주 3%, 맥주 5%. GS25에서는 소주 2.3% (R-12). 같은 매장 비교이고 같은 분기 비교다. 3사 모두 감소이고, 모두 대학가 근처다.</p>\n<p>대학가는 한 사회의 음주 습관이 만들어지는 자리 중 하나다. 그 자리에서 술이 빠지면, 그 빠진 자리는 시간이 지나 다른 자리로 이동한다. 지금 이 그래프는 5년 뒤 그래프의 미리 보기일 수도 있다.</p>", "plain_len": 290}, {"title": "Page 05 · Reading", "type": "essay", "rawIndex": 5, "body_md": "세 그래프를 같이 놓고 본다. 출고량은 떨어진다. 무알콜은 자란다. 편의점 대학가 주류는 줄어든다.\n\n이 셋이 한 화면에 있을 때 답은 “술이 무알콜로 대체되고 있다”가 아니다. 무알콜 시장은 자라지만, 그 절대 규모는 아직 1조 원이 안 된다. 같은 시기에 줄어든 출고량의 무게는 그보다 훨씬 크다. 대체로 설명하기에는 비율이 맞지 않는다.\n\n내가 보는 것은 다른 그림이다. 두 곡선이 만나는 자리는 우연이 아니다. 무엇이 무엇을 대체하는 게 아니라, 둘 다 같은 변화의 두 얼굴이다. 한쪽에서는 술 자체가 빠지고, 다른 쪽에서는 술의 자리에 다른 잔이 들어온다. 줄어드는 부분이 모두 무알콜로 가는 게 아니다. 대부분은 그냥 비어 있다. 그 비어 있는 자리가 무엇으로 채워지는가가 이번 호의 다음 탭에서부터 본격적으로 던지는 질문이다.", "body_html": "<p>세 그래프를 같이 놓고 본다. 출고량은 떨어진다. 무알콜은 자란다. 편의점 대학가 주류는 줄어든다.</p>\n<p>이 셋이 한 화면에 있을 때 답은 “술이 무알콜로 대체되고 있다”가 아니다. 무알콜 시장은 자라지만, 그 절대 규모는 아직 1조 원이 안 된다. 같은 시기에 줄어든 출고량의 무게는 그보다 훨씬 크다. 대체로 설명하기에는 비율이 맞지 않는다.</p>\n<p>내가 보는 것은 다른 그림이다. 두 곡선이 만나는 자리는 우연이 아니다. 무엇이 무엇을 대체하는 게 아니라, 둘 다 같은 변화의 두 얼굴이다. 한쪽에서는 술 자체가 빠지고, 다른 쪽에서는 술의 자리에 다른 잔이 들어온다. 줄어드는 부분이 모두 무알콜로 가는 게 아니다. 대부분은 그냥 비어 있다. 그 비어 있는 자리가 무엇으로 채워지는가가 이번 호의 다음 탭에서부터 본격적으로 던지는 질문이다.</p>", "plain_len": 411}], "totalPages": 5}, {"num": "03", "key": "Insight", "label": "Insight", "ko": "통찰", "short": "IT", "title": "주류(主流)가 비주류가 되는 시간", "pages": [{"title": "Page 01 · Cover", "type": "cover", "rawIndex": 1, "body_md": "카테고리 이름의 반전.\n\n‘주류’ 라는 말은 한자어다. 두 뜻을 같이 갖고 있다. 술이라는 뜻과 메인스트림이라는 뜻. 한국어가 이 둘을 한 단어로 묶은 것은 우연이지만, 그 우연이 지금 이 순간에 의미를 더한다.", "body_html": "<p>카테고리 이름의 반전.</p>\n<p>‘주류’ 라는 말은 한자어다. 두 뜻을 같이 갖고 있다. 술이라는 뜻과 메인스트림이라는 뜻. 한국어가 이 둘을 한 단어로 묶은 것은 우연이지만, 그 우연이 지금 이 순간에 의미를 더한다.</p>", "plain_len": 117}, {"title": "Page 02 · Concept 1", "type": "essay", "rawIndex": 2, "body_md": "‘주류(酒類) 시장’ 이라는 말은 오랫동안 자명했다. 술을 다루는 시장. 그 시장의 안에서는 맥주가 가장 컸고, 소주가 그 다음이었고, 위스키와 와인이 그 뒤를 따랐다. 카테고리의 이름과 카테고리의 안쪽이 한 방향을 보고 있었다.\n\n‘주류(主流)’ 의 뜻은 메인스트림이다. 이 단어가 술 시장 이름과 같다는 사실은 한자 문화권의 작은 우연일 뿐이라고 생각했다. 그런데 같은 매대 안에서 술의 비중이 줄어들기 시작하면, 두 뜻 사이의 거리가 가까워진다. 메인스트림이었던 술이 메인스트림이 아닐 수도 있다. 두 ‘주류’ 의 뜻이 한 단어 안에서 부딪힌다.\n\n이 충돌은 단어 놀이가 아니다. 매대 한 칸의 정치가 단어 안에서 먼저 일어난다.", "body_html": "<p>‘주류(酒類) 시장’ 이라는 말은 오랫동안 자명했다. 술을 다루는 시장. 그 시장의 안에서는 맥주가 가장 컸고, 소주가 그 다음이었고, 위스키와 와인이 그 뒤를 따랐다. 카테고리의 이름과 카테고리의 안쪽이 한 방향을 보고 있었다.</p>\n<p>‘주류(主流)’ 의 뜻은 메인스트림이다. 이 단어가 술 시장 이름과 같다는 사실은 한자 문화권의 작은 우연일 뿐이라고 생각했다. 그런데 같은 매대 안에서 술의 비중이 줄어들기 시작하면, 두 뜻 사이의 거리가 가까워진다. 메인스트림이었던 술이 메인스트림이 아닐 수도 있다. 두 ‘주류’ 의 뜻이 한 단어 안에서 부딪힌다.</p>\n<p>이 충돌은 단어 놀이가 아니다. 매대 한 칸의 정치가 단어 안에서 먼저 일어난다.</p>", "plain_len": 353}, {"title": "Page 03 · Concept 2", "type": "essay", "rawIndex": 3, "body_md": "카테고리 이름이 흔들린다는 것은 무엇인가.\n\n매대를 예로 들어 보자. 편의점 음료 매대의 칸 순서는 오랫동안 일정했다. 맥주, 소주, 와인, 무알콜, 기타. 1번 칸이 가장 크고, 4번 칸은 한두 줄. 그 비율은 시장 점유율의 충실한 반영이었다.\n\n요즘 매대에 가보면 4번 칸의 자리가 조금씩 넓어지고 있다. 카스 0.0 한 줄이었던 곳이 두 줄이 되고, 클라우드 클리어가 들어오고, 하이트 제로가 옆에 붙는다. 1번 칸이 줄어든 만큼 4번 칸이 늘어난 것은 아니다. 1번 칸의 줄어든 자리는 대부분 빈자리가 되거나 다른 음료 (탄산수, 콤부차) 로 채워진다. 4번 칸은 자기 면적을 조금씩 확장한다.\n\n이런 매대 변화는 통계보다 먼저 시작된다. 발주 담당자의 직감이 분기 데이터보다 앞선다.", "body_html": "<p>카테고리 이름이 흔들린다는 것은 무엇인가.</p>\n<p>매대를 예로 들어 보자. 편의점 음료 매대의 칸 순서는 오랫동안 일정했다. 맥주, 소주, 와인, 무알콜, 기타. 1번 칸이 가장 크고, 4번 칸은 한두 줄. 그 비율은 시장 점유율의 충실한 반영이었다.</p>\n<p>요즘 매대에 가보면 4번 칸의 자리가 조금씩 넓어지고 있다. 카스 0.0 한 줄이었던 곳이 두 줄이 되고, 클라우드 클리어가 들어오고, 하이트 제로가 옆에 붙는다. 1번 칸이 줄어든 만큼 4번 칸이 늘어난 것은 아니다. 1번 칸의 줄어든 자리는 대부분 빈자리가 되거나 다른 음료 (탄산수, 콤부차) 로 채워진다. 4번 칸은 자기 면적을 조금씩 확장한다.</p>\n<p>이런 매대 변화는 통계보다 먼저 시작된다. 발주 담당자의 직감이 분기 데이터보다 앞선다.</p>", "plain_len": 384}, {"title": "Page 04 · Diagram", "type": "diagram", "rawIndex": 4, "body_md": "한국 주류 카테고리의 자리바꿈을 도식으로 그리면 다음과 같다.\n\n```text\n  맥주 ↓↓\n  소주 ↓↓\n  무알콜 ↑↑\n  위스키 ↑ (프리미엄화)\n  와인 → (회복)\n  하이볼 ↑ (신규)\n```\n\n화살표 두 개는 두 자릿수 변동, 한 개는 한 자릿수 변동, 옆 화살표는 보합이다. 무알콜과 하이볼이 같은 ↑↑ 표시를 받는다. 그러나 두 변화의 의미는 다르다. 하이볼은 카테고리 내부에서의 자리 이동이다. 무알콜은 카테고리 자체의 경계를 흔든다.\n\n이 도식은 단순하지만, 단순함 안에 한 사회의 음주 지도가 들어 있다.", "body_html": "<p>한국 주류 카테고리의 자리바꿈을 도식으로 그리면 다음과 같다.</p>\n<pre>  맥주 ↓↓\n  소주 ↓↓\n  무알콜 ↑↑\n  위스키 ↑ (프리미엄화)\n  와인 → (회복)\n  하이볼 ↑ (신규)</pre>\n<p>화살표 두 개는 두 자릿수 변동, 한 개는 한 자릿수 변동, 옆 화살표는 보합이다. 무알콜과 하이볼이 같은 ↑↑ 표시를 받는다. 그러나 두 변화의 의미는 다르다. 하이볼은 카테고리 내부에서의 자리 이동이다. 무알콜은 카테고리 자체의 경계를 흔든다.</p>\n<p>이 도식은 단순하지만, 단순함 안에 한 사회의 음주 지도가 들어 있다.</p>", "plain_len": 279}, {"title": "Page 05 · Reading", "type": "essay", "rawIndex": 5, "body_md": "‘비주류’ 라는 말도 같이 흔들린다.\n\n원래 비주류는 변두리를 뜻했다. 무알콜은 오랫동안 비주류였다. 임산부, 운전자, 술을 못 마시는 사람의 카테고리. 의무적으로 한 칸은 비워두지만 거기서 매출이 나오지는 않는 자리.\n\n그런데 그 자리에 있던 카테고리가 자라고, 메인스트림이었던 카테고리가 흔들리면, 비주류와 주류의 위치가 바뀐다. 매대는 그 변화를 가장 먼저 안다. 매대보다 빠른 것은 발주 담당자이고, 발주 담당자보다 빠른 것은 단골의 한마디다.\n\n“오늘은 0.0 있어요?”\n\n이 한 줄에서 시작해서, 결국 카테고리 이름이 바뀐다.", "body_html": "<p>‘비주류’ 라는 말도 같이 흔들린다.</p>\n<p>원래 비주류는 변두리를 뜻했다. 무알콜은 오랫동안 비주류였다. 임산부, 운전자, 술을 못 마시는 사람의 카테고리. 의무적으로 한 칸은 비워두지만 거기서 매출이 나오지는 않는 자리.</p>\n<p>그런데 그 자리에 있던 카테고리가 자라고, 메인스트림이었던 카테고리가 흔들리면, 비주류와 주류의 위치가 바뀐다. 매대는 그 변화를 가장 먼저 안다. 매대보다 빠른 것은 발주 담당자이고, 발주 담당자보다 빠른 것은 단골의 한마디다.</p>\n<p>“오늘은 0.0 있어요?”</p>\n<p>이 한 줄에서 시작해서, 결국 카테고리 이름이 바뀐다.</p>", "plain_len": 296}], "totalPages": 5}, {"num": "04", "key": "Case", "label": "Case", "ko": "사례", "short": "CS", "title": "편의점 4번째 칸의 변화", "pages": [{"title": "Page 01 · Cover", "type": "cover", "rawIndex": 1, "body_md": "진열대가 먼저 말한다.\n\n브랜드 세 개를 본다. 한국 무알콜 맥주 매대를 만든 카스 0.0, 표기 게임의 끝까지 간 하이트 제로 0.00, 가장 늦게 들어와서 가장 멀리 보는 클라우드 클리어. 같은 카테고리 안의 세 브랜드가 서로 다른 각도로 시장을 본다.", "body_html": "<p>진열대가 먼저 말한다.</p>\n<p>브랜드 세 개를 본다. 한국 무알콜 맥주 매대를 만든 카스 0.0, 표기 게임의 끝까지 간 하이트 제로 0.00, 가장 늦게 들어와서 가장 멀리 보는 클라우드 클리어. 같은 카테고리 안의 세 브랜드가 서로 다른 각도로 시장을 본다.</p>", "plain_len": 142}, {"title": "Page 02 · Brand 1", "type": "essay", "rawIndex": 2, "body_md": "카스 0.0은 오비맥주가 만든다. 출시 시점만 보면 한국 무알콜 맥주의 본격 시대를 연 브랜드 중 하나다. 알코올 함량은 0.05% 미만이다 (R-32). 식약처 기준으로는 무알콜이 아니라 비알콜에 가깝다.\n\n이 브랜드의 자리는 한국 시장의 한 단면을 보여준다. ‘맥주의 옆자리’ 에서 시작했다. 카스라는 압도적인 1번 칸 옆에 작은 칸으로. 카스를 마시지 못하는 사람을 위한 옵션이라는 출발점. 카스 0.0의 마케팅 메시지가 오랫동안 “취하지 않는 카스” 였던 것은 이 출발점을 그대로 보여준다.\n\n이 출발점은 한국 시장의 가능성이자 한계다. 무알콜이 ‘본 카테고리의 대체재’ 로 인식되는 한, 본 카테고리가 줄어들면 같이 줄어든다. 그러나 본 카테고리에서 독립하려면 시간이 필요하다.", "body_html": "<p>카스 0.0은 오비맥주가 만든다. 출시 시점만 보면 한국 무알콜 맥주의 본격 시대를 연 브랜드 중 하나다. 알코올 함량은 0.05% 미만이다 (R-32). 식약처 기준으로는 무알콜이 아니라 비알콜에 가깝다.</p>\n<p>이 브랜드의 자리는 한국 시장의 한 단면을 보여준다. ‘맥주의 옆자리’ 에서 시작했다. 카스라는 압도적인 1번 칸 옆에 작은 칸으로. 카스를 마시지 못하는 사람을 위한 옵션이라는 출발점. 카스 0.0의 마케팅 메시지가 오랫동안 “취하지 않는 카스” 였던 것은 이 출발점을 그대로 보여준다.</p>\n<p>이 출발점은 한국 시장의 가능성이자 한계다. 무알콜이 ‘본 카테고리의 대체재’ 로 인식되는 한, 본 카테고리가 줄어들면 같이 줄어든다. 그러나 본 카테고리에서 독립하려면 시간이 필요하다.</p>", "plain_len": 382}, {"title": "Page 03 · Brand 2", "type": "essay", "rawIndex": 3, "body_md": "하이트 제로 0.00은 하이트진로음료가 만든다. 표기에 0이 두 개 붙어 있다. 식약처 기준의 ‘무알콜’ 기준 (0.00%) 을 충실히 따른 표기다 (R-33).\n\n이 두 개의 0은 단순한 숫자가 아니다. 한국 무알콜 시장에서 가장 먼저 ‘진짜 0’ 을 시각화한 시도였다. 0.05% 와 0.00% 의 차이는 한 자릿수 작은 숫자이지만, 라벨에서는 두 글자의 차이로 보인다. 그 두 글자는 어떤 소비자에게는 의미 있는 차이다. 임산부, 회복기 환자, 운전자에게.\n\n하이트 제로의 자리는 ‘완전 0’ 카테고리의 첫 번째다. 첫 번째에 자리 잡으면 카테고리 이름 자체와 동의어가 된다. 한국에서 “진짜 무알콜” 을 검색하면 이 브랜드가 가장 먼저 나오는 이유다.", "body_html": "<p>하이트 제로 0.00은 하이트진로음료가 만든다. 표기에 0이 두 개 붙어 있다. 식약처 기준의 ‘무알콜’ 기준 (0.00%) 을 충실히 따른 표기다 (R-33).</p>\n<p>이 두 개의 0은 단순한 숫자가 아니다. 한국 무알콜 시장에서 가장 먼저 ‘진짜 0’ 을 시각화한 시도였다. 0.05% 와 0.00% 의 차이는 한 자릿수 작은 숫자이지만, 라벨에서는 두 글자의 차이로 보인다. 그 두 글자는 어떤 소비자에게는 의미 있는 차이다. 임산부, 회복기 환자, 운전자에게.</p>\n<p>하이트 제로의 자리는 ‘완전 0’ 카테고리의 첫 번째다. 첫 번째에 자리 잡으면 카테고리 이름 자체와 동의어가 된다. 한국에서 “진짜 무알콜” 을 검색하면 이 브랜드가 가장 먼저 나오는 이유다.</p>", "plain_len": 366}, {"title": "Page 04 · Brand 3", "type": "essay", "rawIndex": 4, "body_md": "클라우드 클리어와 클라우드 논알콜릭은 롯데칠성음료가 만든다. 한국 무알콜 시장의 후발주자다 (R-34).\n\n후발주자라는 사실이 단점만은 아니다. 앞선 두 브랜드의 자리를 보고 들어왔기 때문에 빈 자리를 고를 수 있다. 클라우드 라인이 잡은 자리는 ‘맥주의 대체재가 아니라 자체 카테고리’ 라는 포지션이다. 마케팅에서 일반 클라우드 맥주와의 연결 고리를 강하게 강조하지 않는다. ‘맥주를 못 마시는 사람의 선택’ 이 아니라 ‘이 음료 자체를 마시는 사람의 선택’ 으로 포지셔닝한다.\n\n이 차이는 미세하지만 중요하다. 첫 번째와 두 번째 브랜드가 본 시장의 그림자 안에서 자라야 했다면, 세 번째 브랜드는 본 시장의 그림자 바깥에서 자리를 만들려고 한다. 그것이 성공하면, 무알콜은 비로소 ‘대체재’ 가 아니라 ‘독립 카테고리’ 가 된다.", "body_html": "<p>클라우드 클리어와 클라우드 논알콜릭은 롯데칠성음료가 만든다. 한국 무알콜 시장의 후발주자다 (R-34).</p>\n<p>후발주자라는 사실이 단점만은 아니다. 앞선 두 브랜드의 자리를 보고 들어왔기 때문에 빈 자리를 고를 수 있다. 클라우드 라인이 잡은 자리는 ‘맥주의 대체재가 아니라 자체 카테고리’ 라는 포지션이다. 마케팅에서 일반 클라우드 맥주와의 연결 고리를 강하게 강조하지 않는다. ‘맥주를 못 마시는 사람의 선택’ 이 아니라 ‘이 음료 자체를 마시는 사람의 선택’ 으로 포지셔닝한다.</p>\n<p>이 차이는 미세하지만 중요하다. 첫 번째와 두 번째 브랜드가 본 시장의 그림자 안에서 자라야 했다면, 세 번째 브랜드는 본 시장의 그림자 바깥에서 자리를 만들려고 한다. 그것이 성공하면, 무알콜은 비로소 ‘대체재’ 가 아니라 ‘독립 카테고리’ 가 된다.</p>", "plain_len": 409}, {"title": "Page 05 · Reading", "type": "essay", "rawIndex": 5, "body_md": "세 브랜드를 옆에 놓고 보면 한 카테고리의 진화 단계가 보인다.\n\n1단계는 ‘맥주를 흉내내는 것’ 이다. 본 카테고리의 그림자 안에서 자리를 빌린다.\n2단계는 ‘맥주의 진짜 부재’ 다. 0.00이라는 표기를 통해 본 카테고리와의 경계를 분명히 한다.\n3단계는 ‘맥주 외부의 카테고리’ 다. 본 카테고리를 참조하지 않고 자체 정체성을 만든다.\n\n지금 한국 무알콜 시장의 세 브랜드는 1단계와 3단계 사이의 어딘가에 있다. 세 단계가 동시에 한 매대에 있다는 사실 자체가 흥미롭다. 어느 단계가 결국 시장을 가져가는가는 아직 결정되지 않았다.\n\n매대는 그 결정의 첫 신호를 보여주는 자리다. 4번째 칸이 커지면 카테고리는 자라고 있는 것이고, 4번째 칸 안에서 어떤 브랜드가 가장 넓은 자리를 차지하는가가 진화 단계를 가른다.\n\n매대를 자주 본다. 4번째 칸의 변화에 익숙해진다. 그것이 카테고리의 미래를 미리 보는 가장 싼 방법이다.", "body_html": "<p>세 브랜드를 옆에 놓고 보면 한 카테고리의 진화 단계가 보인다.</p>\n<p>1단계는 ‘맥주를 흉내내는 것’ 이다. 본 카테고리의 그림자 안에서 자리를 빌린다. 2단계는 ‘맥주의 진짜 부재’ 다. 0.00이라는 표기를 통해 본 카테고리와의 경계를 분명히 한다. 3단계는 ‘맥주 외부의 카테고리’ 다. 본 카테고리를 참조하지 않고 자체 정체성을 만든다.</p>\n<p>지금 한국 무알콜 시장의 세 브랜드는 1단계와 3단계 사이의 어딘가에 있다. 세 단계가 동시에 한 매대에 있다는 사실 자체가 흥미롭다. 어느 단계가 결국 시장을 가져가는가는 아직 결정되지 않았다.</p>\n<p>매대는 그 결정의 첫 신호를 보여주는 자리다. 4번째 칸이 커지면 카테고리는 자라고 있는 것이고, 4번째 칸 안에서 어떤 브랜드가 가장 넓은 자리를 차지하는가가 진화 단계를 가른다.</p>\n<p>매대를 자주 본다. 4번째 칸의 변화에 익숙해진다. 그것이 카테고리의 미래를 미리 보는 가장 싼 방법이다.</p>", "plain_len": 461}], "totalPages": 5}, {"num": "05", "key": "Archive", "label": "Archive", "ko": "아카이브", "short": "AR", "title": "한 주를 여는 세 문장", "pages": [{"title": "Page 01 · Summary", "type": "archive", "rawIndex": 1, "body_md": "월요일을 세 문장으로 접는다.\n\n첫째, 술은 줄어든다. 국세청 출고량은 2년 연속 감소했고, 편의점 대학가 매출도 같이 줄었다. 이 변화는 단기 트렌드가 아니라 구조적 신호의 가능성이 더 크다.\n\n둘째, 0.0은 자라난다. 그러나 그 자람의 절대 규모는 아직 작다. 무알콜 시장은 1조 원에 못 미친다. 줄어든 자리의 무게는 그보다 훨씬 크다. 빈 자리는 다른 음료로, 또는 그냥 빈 자리로 남는다.\n\n셋째, 카테고리 이름이 흔들린다. 주류와 비주류의 위치가 미세하게 바뀐다. 매대는 그 변화를 통계보다 먼저 안다.", "body_html": "<p>월요일을 세 문장으로 접는다.</p>\n<p>첫째, 술은 줄어든다. 국세청 출고량은 2년 연속 감소했고, 편의점 대학가 매출도 같이 줄었다. 이 변화는 단기 트렌드가 아니라 구조적 신호의 가능성이 더 크다.</p>\n<p>둘째, 0.0은 자라난다. 그러나 그 자람의 절대 규모는 아직 작다. 무알콜 시장은 1조 원에 못 미친다. 줄어든 자리의 무게는 그보다 훨씬 크다. 빈 자리는 다른 음료로, 또는 그냥 빈 자리로 남는다.</p>\n<p>셋째, 카테고리 이름이 흔들린다. 주류와 비주류의 위치가 미세하게 바뀐다. 매대는 그 변화를 통계보다 먼저 안다.</p>", "plain_len": 285}, {"title": "Page 02 · Questions", "type": "archive", "rawIndex": 2, "body_md": "이번 주 6일이 답하려는 6개 질문을 미리 적는다.\n\n화요일. 무알콜은 ‘취한 기분’ 의 어디까지 흉내낼 수 있는가. 알코올 없이 그 감각을 재현하는 기술은 어디까지 왔는가.\n\n수요일. 술을 줄이는 사람들은 자리도 줄이는가, 아니면 자리는 남기고 잔만 비우는가. 소버 큐리어스라는 단어가 가리키는 실천의 모양은 무엇인가.\n\n목요일. 어메이징브루잉의 퇴장은 한 회사의 일인가, 한 시대의 신호인가. 살아남은 술집들의 공통점은 무엇인가.\n\n금요일. 일본, 미국, 영국은 5년에서 15년 먼저 같은 변화를 겪었다. 그들이 발견한 길과 잘못 든 길은 무엇인가.\n\n토요일. 이 모든 변화는 진짜 대체인가, 일시적 유행인가. 반대편 데이터는 무엇을 말하는가.\n\n일요일. 한 주를 정리하면서, 우리는 ‘한 잔’ 이라는 단위가 어떻게 흔들리는지를 본다. 그 다음에는 무엇이 오는가.", "body_html": "<p>이번 주 6일이 답하려는 6개 질문을 미리 적는다.</p>\n<p>화요일. 무알콜은 ‘취한 기분’ 의 어디까지 흉내낼 수 있는가. 알코올 없이 그 감각을 재현하는 기술은 어디까지 왔는가.</p>\n<p>수요일. 술을 줄이는 사람들은 자리도 줄이는가, 아니면 자리는 남기고 잔만 비우는가. 소버 큐리어스라는 단어가 가리키는 실천의 모양은 무엇인가.</p>\n<p>목요일. 어메이징브루잉의 퇴장은 한 회사의 일인가, 한 시대의 신호인가. 살아남은 술집들의 공통점은 무엇인가.</p>\n<p>금요일. 일본, 미국, 영국은 5년에서 15년 먼저 같은 변화를 겪었다. 그들이 발견한 길과 잘못 든 길은 무엇인가.</p>\n<p>토요일. 이 모든 변화는 진짜 대체인가, 일시적 유행인가. 반대편 데이터는 무엇을 말하는가.</p>\n<p>일요일. 한 주를 정리하면서, 우리는 ‘한 잔’ 이라는 단위가 어떻게 흔들리는지를 본다. 그 다음에는 무엇이 오는가.</p>", "plain_len": 423}, {"title": "Page 03 · Vocabulary", "type": "archive", "rawIndex": 3, "body_md": "이번 호에서 자주 쓸 용어 4개를 짧게 정리한다.\n\n**소버 큐리어스 (Sober Curious).** 술을 안 마시는 것 (sober) 에 호기심 (curious) 을 갖는다는 뜻. 완전 금주가 아니라 ‘의식적으로 술을 다루는’ 선택을 뜻한다. 2018년 영국에서 책 제목으로 처음 쓰였고, 한국에서는 2024년 이후 본격적으로 통용되기 시작했다.\n\n**비알콜 (Non-alcoholic).** 알코올 1% 미만이지만 완전 0은 아닌 음료. 식약처 기준으로는 “알코올 1% 미만 함유” 표시 의무가 있다. 보통 ‘0.0’ 으로 표기된다 (R-02).\n\n**무알콜 (Alcohol-free).** 알코올 0% 음료. ‘0.00’ 으로 표기된다 (R-02). 하이트 제로 0.00, 클라우드 클리어 등이 여기 속한다.\n\n**헬시 플레저 (Healthy Pleasure).** 즐겁게 건강을 챙긴다는 뜻. 2026년 한국 식음료 시장의 핵심 키워드 중 하나로 자리 잡았다 (R-12).", "body_html": "<p>이번 호에서 자주 쓸 용어 4개를 짧게 정리한다.</p>\n<p><strong>소버 큐리어스 (Sober Curious).</strong> 술을 안 마시는 것 (sober) 에 호기심 (curious) 을 갖는다는 뜻. 완전 금주가 아니라 ‘의식적으로 술을 다루는’ 선택을 뜻한다. 2018년 영국에서 책 제목으로 처음 쓰였고, 한국에서는 2024년 이후 본격적으로 통용되기 시작했다.</p>\n<p><strong>비알콜 (Non-alcoholic).</strong> 알코올 1% 미만이지만 완전 0은 아닌 음료. 식약처 기준으로는 “알코올 1% 미만 함유” 표시 의무가 있다. 보통 ‘0.0’ 으로 표기된다 (R-02).</p>\n<p><strong>무알콜 (Alcohol-free).</strong> 알코올 0% 음료. ‘0.00’ 으로 표기된다 (R-02). 하이트 제로 0.00, 클라우드 클리어 등이 여기 속한다.</p>\n<p><strong>헬시 플레저 (Healthy Pleasure).</strong> 즐겁게 건강을 챙긴다는 뜻. 2026년 한국 식음료 시장의 핵심 키워드 중 하나로 자리 잡았다 (R-12).</p>", "plain_len": 473}, {"title": "Page 04 · Bridge", "type": "archive", "rawIndex": 4, "body_md": "다음 날은 기술의 자리로 간다.\n\n월요일에 본 두 곡선의 만남이 가능했던 한 가지 이유는, 무알콜이 더 이상 ‘맛없는 대체재’ 가 아니게 되었기 때문이다. 그 변화의 뒤에는 양조 기술의 진화가 있다. 그러나 기술이 가능하게 한 것은 어디까지인가. 그리고 가능하지 못한 것은 무엇인가.\n\n화요일은 그 경계를 본다.\n\n---", "body_html": "<p>다음 날은 기술의 자리로 간다.</p>\n<p>월요일에 본 두 곡선의 만남이 가능했던 한 가지 이유는, 무알콜이 더 이상 ‘맛없는 대체재’ 가 아니게 되었기 때문이다. 그 변화의 뒤에는 양조 기술의 진화가 있다. 그러나 기술이 가능하게 한 것은 어디까지인가. 그리고 가능하지 못한 것은 무엇인가.</p>\n<p>화요일은 그 경계를 본다.</p>\n<p>---</p>", "plain_len": 176}], "totalPages": 4}]}, {"date": "2026-05-12", "weekday": "화", "weekdayFull": "화요일", "no": "002-02", "titleLine": "무알콜이 흉내내는 '취한 기분'의 과학", "theme": "무알콜이 흉내내는 '취한 기분'의 과학", "note_html": "<aside class=\"note-card\"><strong>Note</strong><p>화요일의 역할 화요일은 Vol002 의 유일한 ‘과학’ 날이다. 신기술 자랑이 아니라, 한 친구가 던진 질문 — “이거 진짜 취하는 느낌이 나?” — 을 정직하게 받아 안는다. GABA 메커니즘은 실재하고, 흉내내는 음료도 이미 있다. 다만 ‘0.1초만에 깨는 신물질’ 은 아직 없다. 그 사실을 분명히 한다.</p></aside>", "sections": [{"num": "01", "key": "Intro", "label": "Intro", "ko": "입구", "short": "IN", "title": "빠진 것은 무엇인가", "pages": [{"title": "Page 01 · Cover", "type": "cover", "rawIndex": 1, "body_md": "빠진 것은 무엇인가.\n\n무알콜 맥주를 처음 마셨을 때 “뭔가 빠졌다” 는 느낌의 정체는 정확히 무엇인가. 맛인가, 감각인가, 의식인가. 셋 다 빠져 있다면, 셋 다 흉내낼 수 있는가.\n\n오늘은 그 질문을 분리해서 본다.", "body_html": "<p>빠진 것은 무엇인가.</p>\n<p>무알콜 맥주를 처음 마셨을 때 “뭔가 빠졌다” 는 느낌의 정체는 정확히 무엇인가. 맛인가, 감각인가, 의식인가. 셋 다 빠져 있다면, 셋 다 흉내낼 수 있는가.</p>\n<p>오늘은 그 질문을 분리해서 본다.</p>", "plain_len": 120}, {"title": "Page 02 · Scene", "type": "essay", "rawIndex": 2, "body_md": "NE DIPA 의 그 묵직한 입을 가진 내가 카스 0.0 첫 한 모금에서 느낀 의외성은 두 단계로 왔다.\n\n첫 모금에 든 생각은 “생각보다 맥주 맛이다.” 두 번째 모금에 든 생각은 약간 달랐다. “그런데 뭔가 빠졌다.” 그 ‘뭔가’ 가 정확히 무엇인지는 그 자리에서 답하지 못했다. 입에서 느껴지는 맛은 거의 같았다. 거품도 비슷했고, 색도 비슷했고, 잔도 같았다. 그런데 무언가 비어 있는 자리가 있었다.\n\n며칠 동안 그 ‘비어 있음’ 의 정체를 생각했다. 답이 늦게 왔다. 빠진 것은 맛이 아니었다. NE DIPA 의 진한 쓴맛도, 일반 카스의 깔끔한 마감도 아니었다. 빠진 것은 어떤 기대였다. 한 잔을 다 마셔도 아무 일이 일어나지 않는다는 기대. 한 시간 뒤에 가벼워지지도 않고, 두 시간 뒤에 살짝 흐려지지도 않을 것이라는 확신.\n\n빠진 것은 약속이었다.", "body_html": "<p>NE DIPA 의 그 묵직한 입을 가진 내가 카스 0.0 첫 한 모금에서 느낀 의외성은 두 단계로 왔다.</p>\n<p>첫 모금에 든 생각은 “생각보다 맥주 맛이다.” 두 번째 모금에 든 생각은 약간 달랐다. “그런데 뭔가 빠졌다.” 그 ‘뭔가’ 가 정확히 무엇인지는 그 자리에서 답하지 못했다. 입에서 느껴지는 맛은 거의 같았다. 거품도 비슷했고, 색도 비슷했고, 잔도 같았다. 그런데 무언가 비어 있는 자리가 있었다.</p>\n<p>며칠 동안 그 ‘비어 있음’ 의 정체를 생각했다. 답이 늦게 왔다. 빠진 것은 맛이 아니었다. NE DIPA 의 진한 쓴맛도, 일반 카스의 깔끔한 마감도 아니었다. 빠진 것은 어떤 기대였다. 한 잔을 다 마셔도 아무 일이 일어나지 않는다는 기대. 한 시간 뒤에 가벼워지지도 않고, 두 시간 뒤에 살짝 흐려지지도 않을 것이라는 확신.</p>\n<p>빠진 것은 약속이었다.</p>", "plain_len": 426}, {"title": "Page 03 · Layers", "type": "essay", "rawIndex": 3, "body_md": "술이 사람에게 주는 것을 세 층으로 나눠 본다.\n\n첫 번째 층은 **맛** 이다. 보리, 홉, 효모가 만드는 풍미. 이 층은 가장 표면적이고, 가장 흉내내기 쉽다.\n\n두 번째 층은 **감각** 이다. 잔의 무게, 거품의 시각, 식도를 따라 내려가는 차가움, 위장에 닿는 자극. 이 층도 흉내낼 수 있다. 잔과 온도와 탄산을 잘 설계하면.\n\n세 번째 층은 **의식** 이다. 알코올이 GABA-A 수용체에 결합하면서 만드는 진정, 이완, 사회적 억제의 해제. 이 층은 약속의 층이다. 한 모금이 어떤 변화로 이어질지 미리 알기 때문에 생기는 기대.\n\n세 층을 분리해서 보면, 무알콜이 흉내내는 영역과 흉내내지 못하는 영역이 명확해진다.", "body_html": "<p>술이 사람에게 주는 것을 세 층으로 나눠 본다.</p>\n<p>첫 번째 층은 <strong>맛</strong> 이다. 보리, 홉, 효모가 만드는 풍미. 이 층은 가장 표면적이고, 가장 흉내내기 쉽다.</p>\n<p>두 번째 층은 <strong>감각</strong> 이다. 잔의 무게, 거품의 시각, 식도를 따라 내려가는 차가움, 위장에 닿는 자극. 이 층도 흉내낼 수 있다. 잔과 온도와 탄산을 잘 설계하면.</p>\n<p>세 번째 층은 <strong>의식</strong> 이다. 알코올이 GABA-A 수용체에 결합하면서 만드는 진정, 이완, 사회적 억제의 해제. 이 층은 약속의 층이다. 한 모금이 어떤 변화로 이어질지 미리 알기 때문에 생기는 기대.</p>\n<p>세 층을 분리해서 보면, 무알콜이 흉내내는 영역과 흉내내지 못하는 영역이 명확해진다.</p>", "plain_len": 338}, {"title": "Page 04 · Bridge", "type": "essay", "rawIndex": 4, "body_md": "이 세 층을 분리해서 보면, 무알콜이 흉내내는 자리와 흉내내지 못하는 자리가 명확해진다.\n\n지금까지 무알콜 산업은 첫 번째와 두 번째 층까지를 잘 다뤄왔다. 맛은 일반 맥주의 80~90% 까지 따라잡았다는 평가가 일반적이다. 감각은 잔과 거품과 온도로 거의 동일하게 만들 수 있다.\n\n문제는 세 번째 층이다. 알코올이 만드는 그 약속 — 한 모금 뒤에 올 변화에 대한 확신 — 을 알코올 없이 만들 수 있는가. 다음 탭에서 이 질문에 들어간다.", "body_html": "<p>이 세 층을 분리해서 보면, 무알콜이 흉내내는 자리와 흉내내지 못하는 자리가 명확해진다.</p>\n<p>지금까지 무알콜 산업은 첫 번째와 두 번째 층까지를 잘 다뤄왔다. 맛은 일반 맥주의 80~90% 까지 따라잡았다는 평가가 일반적이다. 감각은 잔과 거품과 온도로 거의 동일하게 만들 수 있다.</p>\n<p>문제는 세 번째 층이다. 알코올이 만드는 그 약속 — 한 모금 뒤에 올 변화에 대한 확신 — 을 알코올 없이 만들 수 있는가. 다음 탭에서 이 질문에 들어간다.</p>", "plain_len": 246}], "totalPages": 4}, {"num": "02", "key": "Issue", "label": "Issue", "ko": "쟁점", "short": "IS", "title": "0.05%의 미묘함", "pages": [{"title": "Page 01 · Cover", "type": "cover", "rawIndex": 1, "body_md": "라벨이 정의하는 것.\n\n0.00 과 0.0 사이에는 한 자리의 차이가 있다. 그 한 자리에서 카테고리가 갈리고, 표시가 갈리고, 마케팅이 갈리고, 어떤 사람에게는 선택이 갈린다.\n\n오늘 첫 번째로 보는 것은 그 한 자리의 무게다.", "body_html": "<p>라벨이 정의하는 것.</p>\n<p>0.00 과 0.0 사이에는 한 자리의 차이가 있다. 그 한 자리에서 카테고리가 갈리고, 표시가 갈리고, 마케팅이 갈리고, 어떤 사람에게는 선택이 갈린다.</p>\n<p>오늘 첫 번째로 보는 것은 그 한 자리의 무게다.</p>", "plain_len": 126}, {"title": "Page 02 · Standard", "type": "data", "rawIndex": 2, "body_md": "식약처는 음료의 알코올 함량 표시에 두 개의 카테고리를 둔다.\n\n알코올 함량이 0% 면 ‘무알콜 (Alcohol Free)’ 로 표시할 수 있다. 라벨에는 보통 ‘0.00’ 으로 적는다. 소수점 둘째 자리까지 0임을 명시하는 것이다.\n\n알코올 함량이 1% 미만이면 ‘비알콜 (Non-Alcoholic)’ 로 표시한다. 라벨에는 ‘0.0’ 으로 적는다. 1% 미만이지만 알코올이 함유된 경우, 최소 포장 단위에 “알코올 1% 미만 함유” 라는 내용을 표시할 의무가 있다 (R-02). 소비자의 알 권리를 보장하기 위해서다.\n\n이 두 카테고리는 ‘있다’ 와 ‘없다’ 사이가 아니다. ‘아주 조금 있다’ 와 ‘완전히 없다’ 사이다.", "body_html": "<p>식약처는 음료의 알코올 함량 표시에 두 개의 카테고리를 둔다.</p>\n<p>알코올 함량이 0% 면 ‘무알콜 (Alcohol Free)’ 로 표시할 수 있다. 라벨에는 보통 ‘0.00’ 으로 적는다. 소수점 둘째 자리까지 0임을 명시하는 것이다.</p>\n<p>알코올 함량이 1% 미만이면 ‘비알콜 (Non-Alcoholic)’ 로 표시한다. 라벨에는 ‘0.0’ 으로 적는다. 1% 미만이지만 알코올이 함유된 경우, 최소 포장 단위에 “알코올 1% 미만 함유” 라는 내용을 표시할 의무가 있다 (R-02). 소비자의 알 권리를 보장하기 위해서다.</p>\n<p>이 두 카테고리는 ‘있다’ 와 ‘없다’ 사이가 아니다. ‘아주 조금 있다’ 와 ‘완전히 없다’ 사이다.</p>", "plain_len": 347}, {"title": "Page 03 · Reality", "type": "data", "rawIndex": 3, "body_md": "한국 시장의 주요 무알콜·비알콜 맥주 4종을 실측한 결과가 있다. 하이트 제로 0.00, 클라우드 클리어는 알코올이 전혀 들어 있지 않다. 카스 0.0, 칭따오 논알콜릭은 0.05% 미만의 알코올이 함유되어 있다 (R-02 관련 보도).\n\n0.05% 가 어떤 양인지 감을 잡기 어렵다. 일반 맥주 (알코올 약 4.5%) 의 약 1/90 수준이다. 1잔을 마셔도 사실상 운전이나 행동에 영향이 없는 양이다. 그러나 “0% 가 아니다” 는 사실은 어떤 소비자에게는 의미를 가진다. 임산부, 회복기 환자, 종교적 이유로 알코올을 완전히 금하는 사람.\n\n이 0.05% 의 미묘함이 한국 시장에서 ‘카스 0.0’ 과 ‘하이트 제로 0.00’ 의 표기 게임을 만들었다.", "body_html": "<p>한국 시장의 주요 무알콜·비알콜 맥주 4종을 실측한 결과가 있다. 하이트 제로 0.00, 클라우드 클리어는 알코올이 전혀 들어 있지 않다. 카스 0.0, 칭따오 논알콜릭은 0.05% 미만의 알코올이 함유되어 있다 (R-02 관련 보도).</p>\n<p>0.05% 가 어떤 양인지 감을 잡기 어렵다. 일반 맥주 (알코올 약 4.5%) 의 약 1/90 수준이다. 1잔을 마셔도 사실상 운전이나 행동에 영향이 없는 양이다. 그러나 “0% 가 아니다” 는 사실은 어떤 소비자에게는 의미를 가진다. 임산부, 회복기 환자, 종교적 이유로 알코올을 완전히 금하는 사람.</p>\n<p>이 0.05% 의 미묘함이 한국 시장에서 ‘카스 0.0’ 과 ‘하이트 제로 0.00’ 의 표기 게임을 만들었다.</p>", "plain_len": 366}, {"title": "Page 04 · Reading", "type": "essay", "rawIndex": 4, "body_md": "라벨에 적힌 한 글자의 차이가 시장의 카테고리를 가른다.\n\n이 차이는 외국 시장에서도 비슷하게 작동한다. 미국에서는 알코올 0.5% 이하를 ‘non-alcoholic’ 으로 표시할 수 있다. 한국보다 기준이 다소 느슨하다. 일본은 0.00% 와 0.5% 카테고리를 분리해서 신설하는 식으로 표기를 더 세분화했다. 같은 ‘무알콜’ 이 나라마다 다르게 정의된다.\n\n이 차이가 의미하는 것은, ‘무알콜’ 이라는 단어 자체가 아직 안정되지 않은 카테고리라는 사실이다. 산업이 성숙해질수록 표기는 더 세분화되고, 소비자의 선택지는 더 늘어난다. 한국 시장은 지금 그 세분화의 첫 단계에 있다.", "body_html": "<p>라벨에 적힌 한 글자의 차이가 시장의 카테고리를 가른다.</p>\n<p>이 차이는 외국 시장에서도 비슷하게 작동한다. 미국에서는 알코올 0.5% 이하를 ‘non-alcoholic’ 으로 표시할 수 있다. 한국보다 기준이 다소 느슨하다. 일본은 0.00% 와 0.5% 카테고리를 분리해서 신설하는 식으로 표기를 더 세분화했다. 같은 ‘무알콜’ 이 나라마다 다르게 정의된다.</p>\n<p>이 차이가 의미하는 것은, ‘무알콜’ 이라는 단어 자체가 아직 안정되지 않은 카테고리라는 사실이다. 산업이 성숙해질수록 표기는 더 세분화되고, 소비자의 선택지는 더 늘어난다. 한국 시장은 지금 그 세분화의 첫 단계에 있다.</p>", "plain_len": 324}], "totalPages": 4}, {"num": "03", "key": "Insight", "label": "Insight", "ko": "통찰", "short": "IT", "title": "잔이 절반은 한다", "pages": [{"title": "Page 01 · Cover", "type": "cover", "rawIndex": 1, "body_md": "잔이 절반은 한다.\n\n알코올이 ‘취한 기분’ 의 전부를 만든다는 가정은 사실 정확하지 않다. 절반쯤은 잔이, 거품이, 향이, 자리가 만든다. 그 절반은 무알콜로도 만들 수 있다.\n\n오늘 가장 중요한 한 줄이다.", "body_html": "<p>잔이 절반은 한다.</p>\n<p>알코올이 ‘취한 기분’ 의 전부를 만든다는 가정은 사실 정확하지 않다. 절반쯤은 잔이, 거품이, 향이, 자리가 만든다. 그 절반은 무알콜로도 만들 수 있다.</p>\n<p>오늘 가장 중요한 한 줄이다.</p>", "plain_len": 115}, {"title": "Page 02 · Concept", "type": "essay", "rawIndex": 2, "body_md": "취기를 만드는 요소를 5개로 분리해 본다.\n\n첫째, 알코올의 GABA-A 수용체 작용. 진짜 약리학적 변화다. 무알콜로는 흉내낼 수 없다.\n\n둘째, 잔의 촉각. 무게, 손에 닿는 면, 입술에 닿는 두께. 이건 잔 자체로 결정된다. 무알콜도 같은 잔에 마시면 같은 촉각이다.\n\n셋째, 거품의 시각. 보리 맥주의 흰 거품, 흑맥주의 갈색 거품. 시각적 만족은 양조에서 만들 수 있고, 무알콜도 동일하게 만들 수 있다.\n\n넷째, 향과 맛. 보리, 홉, 효모. 양조 기술로 거의 일반 맥주에 근접할 수 있다.\n\n다섯째, 사회적 자리. 친구들과 같이, 늦은 저녁에, 안주와 함께. 자리는 잔 안에 있지 않고 잔 바깥에 있다. 무알콜이든 일반 맥주든 동일하게 작동한다.\n\n5개 중 1개만 알코올 고유다. 나머지 4개는 무알콜이 흉내낼 수 있다. 절반 이상이다.", "body_html": "<p>취기를 만드는 요소를 5개로 분리해 본다.</p>\n<p>첫째, 알코올의 GABA-A 수용체 작용. 진짜 약리학적 변화다. 무알콜로는 흉내낼 수 없다.</p>\n<p>둘째, 잔의 촉각. 무게, 손에 닿는 면, 입술에 닿는 두께. 이건 잔 자체로 결정된다. 무알콜도 같은 잔에 마시면 같은 촉각이다.</p>\n<p>셋째, 거품의 시각. 보리 맥주의 흰 거품, 흑맥주의 갈색 거품. 시각적 만족은 양조에서 만들 수 있고, 무알콜도 동일하게 만들 수 있다.</p>\n<p>넷째, 향과 맛. 보리, 홉, 효모. 양조 기술로 거의 일반 맥주에 근접할 수 있다.</p>\n<p>다섯째, 사회적 자리. 친구들과 같이, 늦은 저녁에, 안주와 함께. 자리는 잔 안에 있지 않고 잔 바깥에 있다. 무알콜이든 일반 맥주든 동일하게 작동한다.</p>\n<p>5개 중 1개만 알코올 고유다. 나머지 4개는 무알콜이 흉내낼 수 있다. 절반 이상이다.</p>", "plain_len": 413}, {"title": "Page 03 · Diagram", "type": "diagram", "rawIndex": 3, "body_md": "이 5개를 도식으로 그리면 다음과 같다.\n\n```text\n취한 기분의 구성 5요소\n\n[1] GABA 작용  ━━━━━ 알코올 고유 (흉내 불가)\n[2] 잔의 촉각  ━━━━━ 잔 의존 (무알콜 동일)\n[3] 거품 시각  ━━━━━ 양조 가능 (무알콜 동일)\n[4] 향과 맛    ━━━━━ 양조 가능 (무알콜 약 85%)\n[5] 사회적 자리 ━━━━━ 자리 의존 (무알콜 동일)\n\n알코올 고유 / 흉내 가능 = 1 / 4\n```\n\n5개 중 4개는 흉내가 가능하다. 그래서 무알콜은 ‘비어 있다’ 는 느낌이 들지만, 그 비어 있음의 크기는 생각보다 작다. 5분의 1 정도다.", "body_html": "<p>이 5개를 도식으로 그리면 다음과 같다.</p>\n<pre>취한 기분의 구성 5요소\n\n[1] GABA 작용  ━━━━━ 알코올 고유 (흉내 불가)\n[2] 잔의 촉각  ━━━━━ 잔 의존 (무알콜 동일)\n[3] 거품 시각  ━━━━━ 양조 가능 (무알콜 동일)\n[4] 향과 맛    ━━━━━ 양조 가능 (무알콜 약 85%)\n[5] 사회적 자리 ━━━━━ 자리 의존 (무알콜 동일)\n\n알코올 고유 / 흉내 가능 = 1 / 4</pre>\n<p>5개 중 4개는 흉내가 가능하다. 그래서 무알콜은 ‘비어 있다’ 는 느낌이 들지만, 그 비어 있음의 크기는 생각보다 작다. 5분의 1 정도다.</p>", "plain_len": 306}, {"title": "Page 04 · Mechanism", "type": "essay", "rawIndex": 4, "body_md": "5요소 중 첫 번째 — GABA-A 수용체 작용 — 만 짧게 풀어 본다.\n\n알코올은 직접적인 GABA 가 아니다. 그러나 뇌의 GABA-A 수용체에 결합해서 GABA 의 작용을 강화하는 ‘간접 작용제 (agonist)’ 다. GABA-A 수용체는 뇌 시냅스의 약 40% 에 분포한다. 알코올이 이 수용체에 결합하면 염소 이온 (Cl⁻) 의 세포 내 유입이 증가하고, 그 결과 신경 활동이 억제된다. 이 억제가 바로 우리가 ‘취한 기분’ 으로 경험하는 진정, 이완, 사회적 억제의 해제다 (R-37).\n\n이 메커니즘은 알코올의 고유 능력이다. 알코올이 아닌 다른 분자로 GABA-A 수용체를 작동시키려는 시도가 없는 것은 아니지만, 약리학적으로 알코올과 같은 강도로, 같은 속도로, 같은 회복 곡선으로 작동하는 ‘대체 분자’ 는 아직 없다. 화 Archive 에서 자세히 다룰 Sentia Spirits 가 그 시도 중 하나다.", "body_html": "<p>5요소 중 첫 번째 — GABA-A 수용체 작용 — 만 짧게 풀어 본다.</p>\n<p>알코올은 직접적인 GABA 가 아니다. 그러나 뇌의 GABA-A 수용체에 결합해서 GABA 의 작용을 강화하는 ‘간접 작용제 (agonist)’ 다. GABA-A 수용체는 뇌 시냅스의 약 40% 에 분포한다. 알코올이 이 수용체에 결합하면 염소 이온 (Cl⁻) 의 세포 내 유입이 증가하고, 그 결과 신경 활동이 억제된다. 이 억제가 바로 우리가 ‘취한 기분’ 으로 경험하는 진정, 이완, 사회적 억제의 해제다 (R-37).</p>\n<p>이 메커니즘은 알코올의 고유 능력이다. 알코올이 아닌 다른 분자로 GABA-A 수용체를 작동시키려는 시도가 없는 것은 아니지만, 약리학적으로 알코올과 같은 강도로, 같은 속도로, 같은 회복 곡선으로 작동하는 ‘대체 분자’ 는 아직 없다. 화 Archive 에서 자세히 다룰 Sentia Spirits 가 그 시도 중 하나다.</p>", "plain_len": 460}, {"title": "Page 05 · Reading", "type": "essay", "rawIndex": 5, "body_md": "5요소 중 4요소가 흉내 가능하다는 사실은 무알콜 산업의 가능성과 한계를 동시에 보여준다.\n\n가능성. 잔, 거품, 향, 자리를 잘 설계하면 무알콜은 일반 맥주의 80% 이상 까지 ‘취한 기분’ 을 흉내낼 수 있다. 이 80% 가 충분한 사람들이 늘어나면, 시장은 카테고리로 자란다.\n\n한계. 마지막 20% — GABA 작용 — 는 무알콜이 절대 흉내내지 못한다. 이 20% 가 결정적인 사람에게는 무알콜은 영원히 ‘대체재’ 다. 본 술의 자리를 완전히 가져갈 수 없다.\n\n지금 시장에서 일어나는 일은, 80% 가 충분한 사람의 수가 늘어나고 있다는 사실이다. 절대적인 ‘대체’ 가 아니라, 80% 로 만족하는 자리의 점진적 확대. 그것이 한국 무알콜 시장이 매년 두 자릿수로 자라는 이유다.", "body_html": "<p>5요소 중 4요소가 흉내 가능하다는 사실은 무알콜 산업의 가능성과 한계를 동시에 보여준다.</p>\n<p>가능성. 잔, 거품, 향, 자리를 잘 설계하면 무알콜은 일반 맥주의 80% 이상 까지 ‘취한 기분’ 을 흉내낼 수 있다. 이 80% 가 충분한 사람들이 늘어나면, 시장은 카테고리로 자란다.</p>\n<p>한계. 마지막 20% — GABA 작용 — 는 무알콜이 절대 흉내내지 못한다. 이 20% 가 결정적인 사람에게는 무알콜은 영원히 ‘대체재’ 다. 본 술의 자리를 완전히 가져갈 수 없다.</p>\n<p>지금 시장에서 일어나는 일은, 80% 가 충분한 사람의 수가 늘어나고 있다는 사실이다. 절대적인 ‘대체’ 가 아니라, 80% 로 만족하는 자리의 점진적 확대. 그것이 한국 무알콜 시장이 매년 두 자릿수로 자라는 이유다.</p>", "plain_len": 383}], "totalPages": 5}, {"num": "04", "key": "Case", "label": "Case", "ko": "사례", "short": "CS", "title": "알코올만 빼는 기술", "pages": [{"title": "Page 01 · Cover", "type": "cover", "rawIndex": 1, "body_md": "향은 어떻게 남기나.\n\n일반 맥주에서 알코올만 빼는 기술은 한 가지가 아니다. 적어도 세 가지의 다른 길이 있고, 한국 3사와 글로벌 선두 (Athletic, Heineken 0.0) 가 서로 다른 길을 선택했다.", "body_html": "<p>향은 어떻게 남기나.</p>\n<p>일반 맥주에서 알코올만 빼는 기술은 한 가지가 아니다. 적어도 세 가지의 다른 길이 있고, 한국 3사와 글로벌 선두 (Athletic, Heineken 0.0) 가 서로 다른 길을 선택했다.</p>", "plain_len": 118}, {"title": "Page 02 · Tech 1", "type": "essay", "rawIndex": 2, "body_md": "첫 번째 길은 **제한 발효 (Limited Fermentation)** 다.\n\n원리는 단순하다. 효모가 당을 알코올로 바꾸는 과정 (발효) 자체를 처음부터 제한한다. 발효 온도를 낮추거나, 효모 종류를 알코올 생산 능력이 약한 종으로 선택하거나, 발효 시간을 짧게 끊는다. 결과는 알코올이 거의 생기지 않은 ‘맥주맛 음료’ 다.\n\n이 방법의 장점은 단순함이다. 별도의 알코올 제거 공정이 필요 없다. 한 번의 발효로 무알콜 음료가 나온다. 단점은 풍미다. 일반 맥주의 풍미는 발효 과정에서 만들어지는 부산물 (에스테르, 알데하이드, 황 화합물) 에서 나온다. 발효를 제한하면 이 부산물도 줄어든다. 결과적으로 맛이 평면적으로 느껴진다.\n\n국내 일부 무알콜 맥주가 이 방식을 쓴다 (R-40 관련 특허).", "body_html": "<p>첫 번째 길은 <strong>제한 발효 (Limited Fermentation)</strong> 다.</p>\n<p>원리는 단순하다. 효모가 당을 알코올로 바꾸는 과정 (발효) 자체를 처음부터 제한한다. 발효 온도를 낮추거나, 효모 종류를 알코올 생산 능력이 약한 종으로 선택하거나, 발효 시간을 짧게 끊는다. 결과는 알코올이 거의 생기지 않은 ‘맥주맛 음료’ 다.</p>\n<p>이 방법의 장점은 단순함이다. 별도의 알코올 제거 공정이 필요 없다. 한 번의 발효로 무알콜 음료가 나온다. 단점은 풍미다. 일반 맥주의 풍미는 발효 과정에서 만들어지는 부산물 (에스테르, 알데하이드, 황 화합물) 에서 나온다. 발효를 제한하면 이 부산물도 줄어든다. 결과적으로 맛이 평면적으로 느껴진다.</p>\n<p>국내 일부 무알콜 맥주가 이 방식을 쓴다 (R-40 관련 특허).</p>", "plain_len": 387}, {"title": "Page 03 · Tech 2", "type": "essay", "rawIndex": 3, "body_md": "두 번째 길은 **진공 증류·역삼투압** 이다.\n\n원리는 일반 맥주를 먼저 만들고, 알코올만 분리해서 빼는 것이다. 진공 증류는 낮은 온도에서 알코올을 끓여 분리한다. 끓는점을 낮추기 위해 진공 환경을 사용한다. 역삼투압은 멤브레인 (반투막) 을 사용해 알코올 분자를 걸러낸다.\n\n이 방법의 장점은 풍미 보존이다. 일반 맥주의 발효 부산물이 그대로 남는다. 결과 음료는 일반 맥주에 매우 가까운 풍미를 가진다. 단점은 비용과 공정 복잡도다. 알코올 제거 공정 한 단계가 추가되고, 그 과정에서 향 분자 일부도 같이 손실된다. 손실된 향을 다시 채우기 위해 별도의 향 회수 공정 (aroma recovery) 이 필요하다.\n\nAthletic Brewing 같은 미국 NA-only 브랜드가 이 방식의 변형을 사용한다. 풍미 면에서 1세대 무알콜 (제한 발효) 과의 차이가 크다.", "body_html": "<p>두 번째 길은 <strong>진공 증류·역삼투압</strong> 이다.</p>\n<p>원리는 일반 맥주를 먼저 만들고, 알코올만 분리해서 빼는 것이다. 진공 증류는 낮은 온도에서 알코올을 끓여 분리한다. 끓는점을 낮추기 위해 진공 환경을 사용한다. 역삼투압은 멤브레인 (반투막) 을 사용해 알코올 분자를 걸러낸다.</p>\n<p>이 방법의 장점은 풍미 보존이다. 일반 맥주의 발효 부산물이 그대로 남는다. 결과 음료는 일반 맥주에 매우 가까운 풍미를 가진다. 단점은 비용과 공정 복잡도다. 알코올 제거 공정 한 단계가 추가되고, 그 과정에서 향 분자 일부도 같이 손실된다. 손실된 향을 다시 채우기 위해 별도의 향 회수 공정 (aroma recovery) 이 필요하다.</p>\n<p>Athletic Brewing 같은 미국 NA-only 브랜드가 이 방식의 변형을 사용한다. 풍미 면에서 1세대 무알콜 (제한 발효) 과의 차이가 크다.</p>", "plain_len": 427}, {"title": "Page 04 · Tech 3", "type": "essay", "rawIndex": 4, "body_md": "세 번째 길은 **non-Saccharomyces 효모 선택** 이다.\n\n일반 맥주는 사카로마이세스 (Saccharomyces) 속의 효모로 발효한다. 이 효모들은 당을 효율적으로 알코올로 바꾸는 능력이 강하다. non-Saccharomyces 효모는 알코올 생산 능력은 약하지만, 향 분자는 풍부하게 만들 수 있다.\n\n이 효모를 사용하면 알코올은 자연스럽게 적게 생기고, 향은 풍부하게 남는다. 제한 발효와 비슷한 효과이지만, 풍미는 더 풍부하다. 단점은 효모 선택과 발효 제어가 까다롭다. 발효 안정성이 낮아 양산이 어렵다.\n\n이 방식은 아직 산업 표준은 아니지만, 크래프트 NA 브랜드와 연구 단계에서 활발히 시도된다. 한국에서도 일부 수제 양조장이 실험적으로 시도하고 있다.", "body_html": "<p>세 번째 길은 <strong>non-Saccharomyces 효모 선택</strong> 이다.</p>\n<p>일반 맥주는 사카로마이세스 (Saccharomyces) 속의 효모로 발효한다. 이 효모들은 당을 효율적으로 알코올로 바꾸는 능력이 강하다. non-Saccharomyces 효모는 알코올 생산 능력은 약하지만, 향 분자는 풍부하게 만들 수 있다.</p>\n<p>이 효모를 사용하면 알코올은 자연스럽게 적게 생기고, 향은 풍부하게 남는다. 제한 발효와 비슷한 효과이지만, 풍미는 더 풍부하다. 단점은 효모 선택과 발효 제어가 까다롭다. 발효 안정성이 낮아 양산이 어렵다.</p>\n<p>이 방식은 아직 산업 표준은 아니지만, 크래프트 NA 브랜드와 연구 단계에서 활발히 시도된다. 한국에서도 일부 수제 양조장이 실험적으로 시도하고 있다.</p>", "plain_len": 374}, {"title": "Page 05 · Reading", "type": "essay", "rawIndex": 5, "body_md": "세 가지 길은 같은 목표 (알코올 빼기) 에 도달하는 다른 방법이다. 어느 하나가 정답이 아니라, 어떤 시장에 어떤 가격대로 들어가느냐에 따라 선택이 달라진다.\n\n대량 생산, 가격 경쟁, 슈퍼마켓 매대를 목표로 하면 제한 발효가 맞다. 한국 3사의 1세대 무알콜이 대부분 이 방식이다.\n\n프리미엄 시장, 풍미 중심, NA 전용 브랜드를 목표로 하면 진공 증류나 효모 선택이 맞다. Athletic Brewing 의 빠른 성장은 이 두 번째 길을 잘 선택한 결과다.\n\n한국 시장은 지금 첫 번째 길로 시작했고, 두 번째 길로 옮겨가는 중간에 있다. 첫 번째 길의 무알콜만 마셔본 사람이 “무알콜은 맛없다” 는 결론을 가지고 있다면, 두 번째 길의 무알콜은 다른 경험을 줄 수 있다.\n\n기술의 세대 차이가 시장의 인식 차이를 결정한다. 5년 전 무알콜과 지금의 무알콜은 다른 음료다.", "body_html": "<p>세 가지 길은 같은 목표 (알코올 빼기) 에 도달하는 다른 방법이다. 어느 하나가 정답이 아니라, 어떤 시장에 어떤 가격대로 들어가느냐에 따라 선택이 달라진다.</p>\n<p>대량 생산, 가격 경쟁, 슈퍼마켓 매대를 목표로 하면 제한 발효가 맞다. 한국 3사의 1세대 무알콜이 대부분 이 방식이다.</p>\n<p>프리미엄 시장, 풍미 중심, NA 전용 브랜드를 목표로 하면 진공 증류나 효모 선택이 맞다. Athletic Brewing 의 빠른 성장은 이 두 번째 길을 잘 선택한 결과다.</p>\n<p>한국 시장은 지금 첫 번째 길로 시작했고, 두 번째 길로 옮겨가는 중간에 있다. 첫 번째 길의 무알콜만 마셔본 사람이 “무알콜은 맛없다” 는 결론을 가지고 있다면, 두 번째 길의 무알콜은 다른 경험을 줄 수 있다.</p>\n<p>기술의 세대 차이가 시장의 인식 차이를 결정한다. 5년 전 무알콜과 지금의 무알콜은 다른 음료다.</p>", "plain_len": 432}], "totalPages": 5}, {"num": "05", "key": "Archive", "label": "Archive", "ko": "아카이브", "short": "AR", "title": "환상의 한계", "pages": [{"title": "Page 01 · Reality Check", "type": "archive", "rawIndex": 1, "body_md": "“0.1초 만에 켜고 끄는 신물질.”\n\n며칠 전 친구가 던진 농담이다. 알코올 없이 취한 기분만 만들고, 깨고 싶을 때 즉시 깨는 신물질이 개발될 수 있냐는 질문이다. 농담이지만 진지하게 답하면, 답은 분명하다.\n\n**그런 신물질은 아직 없다.** 개발 중인 시도는 있지만, 약리학적으로 ‘0.1초 만에 켜고 끄는’ 수준은 현재 공개된 어떤 기술에서도 가능하지 않다.\n\n이 사실을 분명히 하는 것이 화요일의 가장 중요한 한 줄이다.", "body_html": "<p>“0.1초 만에 켜고 끄는 신물질.”</p>\n<p>며칠 전 친구가 던진 농담이다. 알코올 없이 취한 기분만 만들고, 깨고 싶을 때 즉시 깨는 신물질이 개발될 수 있냐는 질문이다. 농담이지만 진지하게 답하면, 답은 분명하다.</p>\n<p><strong>그런 신물질은 아직 없다.</strong> 개발 중인 시도는 있지만, 약리학적으로 ‘0.1초 만에 켜고 끄는’ 수준은 현재 공개된 어떤 기술에서도 가능하지 않다.</p>\n<p>이 사실을 분명히 하는 것이 화요일의 가장 중요한 한 줄이다.</p>", "plain_len": 234}, {"title": "Page 02 · Sentia", "type": "archive", "rawIndex": 2, "body_md": "다만, ‘완전히 없음’ 은 아니다. 런던의 한 스타트업이 비슷한 시도를 하고 있다.\n\n**Sentia Spirits.** GABA 수용체에 작용하는 천연 성분 (글리신, 카모마일, 마그놀리아 추출물 등) 을 조합한 무알콜 음료다. 알코올이 아니지만 비슷한 진정·이완 효과를 노린다. 영국 의학 교수 데이비드 너트 (David Nutt) 가 공동 창립자다. 그는 영국 정부의 마약·알코올 정책 자문위원 출신으로, 알코올의 약리학에 대한 권위자다.\n\nBBC Science Focus 기자가 직접 시음하고 쓴 리뷰는 정직하다. “효과는 미묘하다. 거의 플라세보가 아닌가 의심될 만큼 미묘하다. 그러나 무언가는 있다. 편안하고 만족스러운 느낌이 든다 (R-38).”\n\n미묘하다. 거의 플라세보다. 그러나 무언가는 있다. 이 세 문장이 지금 ‘취한 기분만 주는 음료’ 의 최첨단 위치를 가장 정확하게 묘사한다.", "body_html": "<p>다만, ‘완전히 없음’ 은 아니다. 런던의 한 스타트업이 비슷한 시도를 하고 있다.</p>\n<p><strong>Sentia Spirits.</strong> GABA 수용체에 작용하는 천연 성분 (글리신, 카모마일, 마그놀리아 추출물 등) 을 조합한 무알콜 음료다. 알코올이 아니지만 비슷한 진정·이완 효과를 노린다. 영국 의학 교수 데이비드 너트 (David Nutt) 가 공동 창립자다. 그는 영국 정부의 마약·알코올 정책 자문위원 출신으로, 알코올의 약리학에 대한 권위자다.</p>\n<p>BBC Science Focus 기자가 직접 시음하고 쓴 리뷰는 정직하다. “효과는 미묘하다. 거의 플라세보가 아닌가 의심될 만큼 미묘하다. 그러나 무언가는 있다. 편안하고 만족스러운 느낌이 든다 (R-38).”</p>\n<p>미묘하다. 거의 플라세보다. 그러나 무언가는 있다. 이 세 문장이 지금 ‘취한 기분만 주는 음료’ 의 최첨단 위치를 가장 정확하게 묘사한다.</p>", "plain_len": 441}, {"title": "Page 03 · Summary", "type": "archive", "rawIndex": 3, "body_md": "화요일을 세 문장으로 접는다.\n\n첫째, 감각은 분리 가능하다. ‘취한 기분’ 은 한 덩어리가 아니라 5개 요소의 합이다. GABA 작용, 잔의 촉각, 거품 시각, 향과 맛, 사회적 자리.\n\n둘째, 기술은 5요소 중 4요소까지 흉내낼 수 있다. 잔, 거품, 향, 자리. 80% 까지의 흉내가 가능하다.\n\n셋째, 마지막 20% — GABA 작용 — 의 흉내는 아직 미묘한 수준이다. Sentia Spirits 같은 시도가 있지만, 알코올과 같은 강도로, 같은 속도로 작동하지 않는다.", "body_html": "<p>화요일을 세 문장으로 접는다.</p>\n<p>첫째, 감각은 분리 가능하다. ‘취한 기분’ 은 한 덩어리가 아니라 5개 요소의 합이다. GABA 작용, 잔의 촉각, 거품 시각, 향과 맛, 사회적 자리.</p>\n<p>둘째, 기술은 5요소 중 4요소까지 흉내낼 수 있다. 잔, 거품, 향, 자리. 80% 까지의 흉내가 가능하다.</p>\n<p>셋째, 마지막 20% — GABA 작용 — 의 흉내는 아직 미묘한 수준이다. Sentia Spirits 같은 시도가 있지만, 알코올과 같은 강도로, 같은 속도로 작동하지 않는다.</p>", "plain_len": 265}, {"title": "Page 04 · Bridge", "type": "archive", "rawIndex": 4, "body_md": "다음 날은 사람들의 자리로 간다.\n\n기술이 흉내내지 못하는 20% 의 영역에서 사람들은 어떻게 살아가는가. 그 20% 를 포기하는 사람도 있고, 그 20% 가 결정적인 사람도 있다. 같은 모임 안에서 두 사람이 다른 선택을 한다.\n\n수요일은 그 선택들의 모양을 본다.\n\n---", "body_html": "<p>다음 날은 사람들의 자리로 간다.</p>\n<p>기술이 흉내내지 못하는 20% 의 영역에서 사람들은 어떻게 살아가는가. 그 20% 를 포기하는 사람도 있고, 그 20% 가 결정적인 사람도 있다. 같은 모임 안에서 두 사람이 다른 선택을 한다.</p>\n<p>수요일은 그 선택들의 모양을 본다.</p>\n<p>---</p>", "plain_len": 151}], "totalPages": 4}]}, {"date": "2026-05-13", "weekday": "수", "weekdayFull": "수요일", "no": "002-03", "titleLine": "술 줄이고 모임은 남기는 사람들", "theme": "술 줄이고 모임은 남기는 사람들", "note_html": "<aside class=\"note-card\"><strong>Note</strong><p>수요일의 역할 수요일은 Vol002 의 ‘사람’ 날이다. 시장과 기술이 가능하게 한 것을 사람들은 실제로 어떻게 살아가는지를 본다. 소버 큐리어스 (Sober Curious) 가 단순한 절주가 아니라 ‘술자리의 새 문법’ 임을 본다. 그러나 그 문법이 완전히 균일한 것은 아니다.</p></aside>", "sections": [{"num": "01", "key": "Intro", "label": "Intro", "ko": "입구", "short": "IN", "title": "회식의 새 문법", "pages": [{"title": "Page 01 · Cover", "type": "cover", "rawIndex": 1, "body_md": "회식의 새 문법.\n\n자리는 지키고 잔은 비운다. 한 줄로 적으면 단순하지만, 그 한 줄을 가능하게 만든 여러 변화들이 있다. 오늘은 그 변화들이 어떻게 한 사람의 평일 저녁을 다시 설계하는지 본다.", "body_html": "<p>회식의 새 문법.</p>\n<p>자리는 지키고 잔은 비운다. 한 줄로 적으면 단순하지만, 그 한 줄을 가능하게 만든 여러 변화들이 있다. 오늘은 그 변화들이 어떻게 한 사람의 평일 저녁을 다시 설계하는지 본다.</p>", "plain_len": 109}, {"title": "Page 02 · Scene", "type": "essay", "rawIndex": 2, "body_md": "2년 전 결혼을 한 뒤로 음주의 모양이 바뀌었다.\n\n이전에는 NE DIPA 한 잔이 두 잔이 되고 두 잔이 네 잔이 되는 저녁이 많았다. 결혼 이후로는 그런 저녁이 거의 사라졌다. 아내가 못 마시게 한 게 아니다. 다음 날의 일상을 그대로 가져가고 싶다는 자기 결정이 먼저였다.\n\n같은 시기에 매일 홈트를 시작했다. 지금 1217일째 매일 이어지고 있다. 1년에 1200km 가까이 달린다. 운동이 자리잡을수록 술의 다음 날을 의식하게 됐다. “마실 때 기분은 좋지만 취하도록 마셔봐야 뭐 하나.” 이 한 줄이 점점 자리잡았다.\n\n그런 자기 디자인 안에 카스 0.0 이 들어왔다. 회식 자리에서 강요로 마시기 시작한 게 아니다. 마트에서 우연히 본 캔 하나에서 시작해서, 한 모금의 의외성을 거쳐, 어느 새 냉장고에 한 두 캔이 늘 있는 자리가 됐다. 회식의 새 문법이 사회 전체에 자리잡기 전에, 한 사람의 새 문법은 먼저 와 있다.", "body_html": "<p>2년 전 결혼을 한 뒤로 음주의 모양이 바뀌었다.</p>\n<p>이전에는 NE DIPA 한 잔이 두 잔이 되고 두 잔이 네 잔이 되는 저녁이 많았다. 결혼 이후로는 그런 저녁이 거의 사라졌다. 아내가 못 마시게 한 게 아니다. 다음 날의 일상을 그대로 가져가고 싶다는 자기 결정이 먼저였다.</p>\n<p>같은 시기에 매일 홈트를 시작했다. 지금 1217일째 매일 이어지고 있다. 1년에 1200km 가까이 달린다. 운동이 자리잡을수록 술의 다음 날을 의식하게 됐다. “마실 때 기분은 좋지만 취하도록 마셔봐야 뭐 하나.” 이 한 줄이 점점 자리잡았다.</p>\n<p>그런 자기 디자인 안에 카스 0.0 이 들어왔다. 회식 자리에서 강요로 마시기 시작한 게 아니다. 마트에서 우연히 본 캔 하나에서 시작해서, 한 모금의 의외성을 거쳐, 어느 새 냉장고에 한 두 캔이 늘 있는 자리가 됐다. 회식의 새 문법이 사회 전체에 자리잡기 전에, 한 사람의 새 문법은 먼저 와 있다.</p>", "plain_len": 464}, {"title": "Page 03 · Phrase", "type": "essay", "rawIndex": 3, "body_md": "“회식은 가지만 술은 안 마셔.”\n\n이 문장은 20대 사이에서 빠르게 자리잡은 새 문법이다 (R-11). 핵심은 두 절의 결합이다. 회식이라는 자리는 거부하지 않는다. 그러나 술이라는 도구는 선택적으로 다룬다. 자리와 도구를 분리해서 다루는 것이 새 문법의 핵심이다.\n\n이전 세대의 문법은 자리와 도구가 한 덩어리였다. 회식에 갔으면 술을 마시고, 술을 안 마실 거면 회식에 안 갔다. 자리를 지키면서 도구를 거부하는 옵션이 잘 보이지 않았다. 보였다고 해도 그 옵션을 선택했을 때 자리가 어색해졌다.\n\n새 문법은 그 어색함을 줄였다. 어떻게 줄였는지가 다음 페이지의 질문이다.", "body_html": "<p>“회식은 가지만 술은 안 마셔.”</p>\n<p>이 문장은 20대 사이에서 빠르게 자리잡은 새 문법이다 (R-11). 핵심은 두 절의 결합이다. 회식이라는 자리는 거부하지 않는다. 그러나 술이라는 도구는 선택적으로 다룬다. 자리와 도구를 분리해서 다루는 것이 새 문법의 핵심이다.</p>\n<p>이전 세대의 문법은 자리와 도구가 한 덩어리였다. 회식에 갔으면 술을 마시고, 술을 안 마실 거면 회식에 안 갔다. 자리를 지키면서 도구를 거부하는 옵션이 잘 보이지 않았다. 보였다고 해도 그 옵션을 선택했을 때 자리가 어색해졌다.</p>\n<p>새 문법은 그 어색함을 줄였다. 어떻게 줄였는지가 다음 페이지의 질문이다.</p>", "plain_len": 320}, {"title": "Page 04 · Bridge", "type": "essay", "rawIndex": 4, "body_md": "자리와 도구를 분리하는 새 문법이 가능했던 이유는, 그 선택을 한 사람의 수가 임계점을 넘었기 때문이다. 혼자 선택하면 어색하지만, 둘셋이 선택하면 자연스러워진다.\n\n그 임계점이 어느 정도 넘었는지를 데이터로 확인해보자.", "body_html": "<p>자리와 도구를 분리하는 새 문법이 가능했던 이유는, 그 선택을 한 사람의 수가 임계점을 넘었기 때문이다. 혼자 선택하면 어색하지만, 둘셋이 선택하면 자연스러워진다.</p>\n<p>그 임계점이 어느 정도 넘었는지를 데이터로 확인해보자.</p>", "plain_len": 122}], "totalPages": 4}, {"num": "02", "key": "Issue", "label": "Issue", "ko": "쟁점", "short": "IS", "title": "술이 줄어드는 세대", "pages": [{"title": "Page 01 · Cover", "type": "cover", "rawIndex": 1, "body_md": "수치로 보는 변화. 그러나 단순하지 않다.\n\n전체 음주율을 보면 한 방향으로 움직이는 것처럼 보인다. 그러나 세대별로 쪼개면 다른 그림이 나온다. 같은 시기에 같은 세대 안에서 줄어드는 흐름과 늘어나는 흐름이 동시에 보인다.\n\n오늘 가장 중요한 그래프다.", "body_html": "<p>수치로 보는 변화. 그러나 단순하지 않다.</p>\n<p>전체 음주율을 보면 한 방향으로 움직이는 것처럼 보인다. 그러나 세대별로 쪼개면 다른 그림이 나온다. 같은 시기에 같은 세대 안에서 줄어드는 흐름과 늘어나는 흐름이 동시에 보인다.</p>\n<p>오늘 가장 중요한 그래프다.</p>", "plain_len": 140}, {"title": "Page 02 · Trend", "type": "data", "rawIndex": 2, "body_md": "질병관리청 (KDCA) 의 국민건강영양조사 2023년 결과를 본다.\n\n전체 고위험음주율은 13.8% 다. 전년 (14.0%) 보다 소폭 감소했다. 남자 고위험음주율은 21.3% 에서 19.9% 로 1.4 퍼센트포인트 줄었고, 여자는 7.0% 에서 7.7% 로 0.7 퍼센트포인트 늘었다 (R-03).\n\n한 줄로 요약하면 “남자는 줄고 여자는 늘었다.” 그러나 이 요약도 정확하지 않다. 같은 데이터를 세대별로 쪼개면 또 다른 그림이 보인다.", "body_html": "<p>질병관리청 (KDCA) 의 국민건강영양조사 2023년 결과를 본다.</p>\n<p>전체 고위험음주율은 13.8% 다. 전년 (14.0%) 보다 소폭 감소했다. 남자 고위험음주율은 21.3% 에서 19.9% 로 1.4 퍼센트포인트 줄었고, 여자는 7.0% 에서 7.7% 로 0.7 퍼센트포인트 늘었다 (R-03).</p>\n<p>한 줄로 요약하면 “남자는 줄고 여자는 늘었다.” 그러나 이 요약도 정확하지 않다. 같은 데이터를 세대별로 쪼개면 또 다른 그림이 보인다.</p>", "plain_len": 244}, {"title": "Page 03 · Paradox", "type": "essay", "rawIndex": 3, "body_md": "같은 조사에서 세대별로 본다.\n\n30대 남자는 흡연, 음주, 신체활동 비실천이 다소 개선되었다고 보고되었다. 우리가 일반적으로 떠올리는 ‘직장인 회식 문화’ 의 대표 세대다. 이 세대에서 술이 줄고 있다는 것은 회식 문화 자체의 변화를 보여준다.\n\n20대는 다르다. 20대 남녀 모두 음주가 증가했다. 특히 여자 20대의 월간폭음률은 43.0% 로 다른 연령에 비해 가장 높았다 (R-03). 폭음률 (binge drinking rate) 은 한 자리에서 많이 마시는 빈도를 의미한다.\n\n이 두 데이터를 같이 놓으면 흥미로운 그림이 나온다. 30대 회식 자리에서는 술이 줄어들지만, 20대의 한 자리에서는 폭음이 늘어난다. ‘소버 큐리어스’ 와 ‘폭음’ 이 같은 사회 안에서 동시에 자라고 있다.", "body_html": "<p>같은 조사에서 세대별로 본다.</p>\n<p>30대 남자는 흡연, 음주, 신체활동 비실천이 다소 개선되었다고 보고되었다. 우리가 일반적으로 떠올리는 ‘직장인 회식 문화’ 의 대표 세대다. 이 세대에서 술이 줄고 있다는 것은 회식 문화 자체의 변화를 보여준다.</p>\n<p>20대는 다르다. 20대 남녀 모두 음주가 증가했다. 특히 여자 20대의 월간폭음률은 43.0% 로 다른 연령에 비해 가장 높았다 (R-03). 폭음률 (binge drinking rate) 은 한 자리에서 많이 마시는 빈도를 의미한다.</p>\n<p>이 두 데이터를 같이 놓으면 흥미로운 그림이 나온다. 30대 회식 자리에서는 술이 줄어들지만, 20대의 한 자리에서는 폭음이 늘어난다. ‘소버 큐리어스’ 와 ‘폭음’ 이 같은 사회 안에서 동시에 자라고 있다.</p>", "plain_len": 386}, {"title": "Page 04 · Trend Search", "type": "data", "rawIndex": 4, "body_md": "세 번째 그래프는 다른 자료에서 온다.\n\n썸트렌드의 AI 브리핑은 2026년 2월 절주·금주 언급이 전월 대비 36% 급증했다고 보고했다. 같은 기간 무알콜·논알콜 음료 언급은 6개월 누적 10만 9천 건을 넘었다 (R-09). 검색량은 통계가 아니라 신호다. 검색량의 증가는 행동의 증가보다 6개월에서 1년 정도 앞선다.\n\n이 신호는 KDCA 데이터와는 다른 방향을 가리킨다. KDCA 는 20대 음주가 늘었다고 한다. 썸트렌드는 절주 관심이 폭증했다고 한다. 둘은 모순이 아니다. 같은 세대 안에서 한쪽은 폭음을 하고, 다른 쪽은 절주를 한다. 양극화의 신호일 수 있다.", "body_html": "<p>세 번째 그래프는 다른 자료에서 온다.</p>\n<p>썸트렌드의 AI 브리핑은 2026년 2월 절주·금주 언급이 전월 대비 36% 급증했다고 보고했다. 같은 기간 무알콜·논알콜 음료 언급은 6개월 누적 10만 9천 건을 넘었다 (R-09). 검색량은 통계가 아니라 신호다. 검색량의 증가는 행동의 증가보다 6개월에서 1년 정도 앞선다.</p>\n<p>이 신호는 KDCA 데이터와는 다른 방향을 가리킨다. KDCA 는 20대 음주가 늘었다고 한다. 썸트렌드는 절주 관심이 폭증했다고 한다. 둘은 모순이 아니다. 같은 세대 안에서 한쪽은 폭음을 하고, 다른 쪽은 절주를 한다. 양극화의 신호일 수 있다.</p>", "plain_len": 319}, {"title": "Page 05 · Reading", "type": "essay", "rawIndex": 5, "body_md": "‘감소’ 와 ‘관리’ 는 다르다.\n\n전체 음주량이 줄어드는 것과, 사람들이 음주를 의식적으로 다루는 것은 다른 차원의 변화다. 어떤 사람은 음주를 줄이고, 어떤 사람은 음주를 의식적으로 늘리고, 어떤 사람은 그대로 마시면서 무알콜 옵션을 같이 가진다.\n\n이번 호의 가설은 이렇다. 한국에서 일어나고 있는 변화는 ‘술이 줄어드는 변화’ 라기보다 ‘술을 의식적으로 다루는 변화’ 다. 줄어드는 것도 결과이지만, 더 본질적인 변화는 잔과의 관계가 더 의식적이 되고 있다는 사실이다. 그 의식적인 다룸은 어떤 사람에게는 ‘0잔의 선택’ 으로, 어떤 사람에게는 ‘0.0의 선택’ 으로, 어떤 사람에게는 ‘여전히 마시지만 양은 조절’ 로 나타난다.", "body_html": "<p>‘감소’ 와 ‘관리’ 는 다르다.</p>\n<p>전체 음주량이 줄어드는 것과, 사람들이 음주를 의식적으로 다루는 것은 다른 차원의 변화다. 어떤 사람은 음주를 줄이고, 어떤 사람은 음주를 의식적으로 늘리고, 어떤 사람은 그대로 마시면서 무알콜 옵션을 같이 가진다.</p>\n<p>이번 호의 가설은 이렇다. 한국에서 일어나고 있는 변화는 ‘술이 줄어드는 변화’ 라기보다 ‘술을 의식적으로 다루는 변화’ 다. 줄어드는 것도 결과이지만, 더 본질적인 변화는 잔과의 관계가 더 의식적이 되고 있다는 사실이다. 그 의식적인 다룸은 어떤 사람에게는 ‘0잔의 선택’ 으로, 어떤 사람에게는 ‘0.0의 선택’ 으로, 어떤 사람에게는 ‘여전히 마시지만 양은 조절’ 로 나타난다.</p>", "plain_len": 354}], "totalPages": 5}, {"num": "03", "key": "Insight", "label": "Insight", "ko": "통찰", "short": "IT", "title": "절제는 새 취향이 된다", "pages": [{"title": "Page 01 · Cover", "type": "cover", "rawIndex": 1, "body_md": "0잔의 자기효능감.\n\n절제가 윤리에서 미학으로 옮겨가고 있다. ‘마시면 안 되는 것’ 에서 ‘마시지 않는 것을 잘 다루는 것’ 으로. 이 변화의 의미를 본다.", "body_html": "<p>0잔의 자기효능감.</p>\n<p>절제가 윤리에서 미학으로 옮겨가고 있다. ‘마시면 안 되는 것’ 에서 ‘마시지 않는 것을 잘 다루는 것’ 으로. 이 변화의 의미를 본다.</p>", "plain_len": 87}, {"title": "Page 02 · Concept", "type": "essay", "rawIndex": 2, "body_md": "소버 큐리어스는 금주가 아니다.\n\n금주 (abstinence) 는 윤리적·종교적·의료적 이유로 술을 완전히 끊는 것이다. 알코올 중독자의 회복 과정, 종교적 금기, 임신과 수유 같은 상황. 금주의 출발점은 ‘마시면 안 되는 이유’ 다.\n\n소버 큐리어스는 다르다. 출발점은 ‘마시지 않을 수도 있다는 호기심’ 이다. 한 잔을 거르면 어떤 느낌인지, 한 모임을 술 없이 보내면 어떻게 다른지, 한 달을 술 없이 보내면 일상이 어떻게 바뀌는지. 호기심에서 시작해서, 그 호기심이 라이프스타일로 자리잡는 과정이 소버 큐리어스다.\n\n‘마시면 안 되는’ 과 ‘마시지 않을 수도 있는’ 의 차이는 윤리와 선택의 차이다. 윤리는 무겁지만 선택은 가볍다. 가벼움이 더 많은 사람을 끌어들인다.", "body_html": "<p>소버 큐리어스는 금주가 아니다.</p>\n<p>금주 (abstinence) 는 윤리적·종교적·의료적 이유로 술을 완전히 끊는 것이다. 알코올 중독자의 회복 과정, 종교적 금기, 임신과 수유 같은 상황. 금주의 출발점은 ‘마시면 안 되는 이유’ 다.</p>\n<p>소버 큐리어스는 다르다. 출발점은 ‘마시지 않을 수도 있다는 호기심’ 이다. 한 잔을 거르면 어떤 느낌인지, 한 모임을 술 없이 보내면 어떻게 다른지, 한 달을 술 없이 보내면 일상이 어떻게 바뀌는지. 호기심에서 시작해서, 그 호기심이 라이프스타일로 자리잡는 과정이 소버 큐리어스다.</p>\n<p>‘마시면 안 되는’ 과 ‘마시지 않을 수도 있는’ 의 차이는 윤리와 선택의 차이다. 윤리는 무겁지만 선택은 가볍다. 가벼움이 더 많은 사람을 끌어들인다.</p>", "plain_len": 375}, {"title": "Page 03 · Healthy Pleasure", "type": "essay", "rawIndex": 3, "body_md": "소버 큐리어스의 한국 버전 키워드는 ‘헬시 플레저 (Healthy Pleasure)’ 다.\n\n이 단어를 풀어 보면 ‘건강 (Healthy)’ 과 ‘즐거움 (Pleasure)’ 의 결합이다. 이전 세대의 건강 담론은 즐거움과 대립되는 자리에 있었다. 술은 즐겁지만 건강에 안 좋다, 야식은 맛있지만 살이 찐다, 운동은 힘들지만 건강에는 좋다. 즐거움과 건강이 한쪽씩 양보하면서 균형을 잡았다.\n\n헬시 플레저의 출발점은 다르다. 즐거움과 건강이 같이 가는 옵션이 있을 수 있다는 가정. 무알콜 맥주는 그 가정의 가장 명확한 예시다. 맥주의 즐거움 (5요소 중 4요소) 을 가지면서 건강 부담 (알코올, 칼로리) 을 줄인다. 이전이라면 “맥주를 줄여야 한다” 였던 자리에 “무알콜로 옮긴다” 가 들어선다.\n\n내 경우가 그렇다. 매일 홈트 1217일과 NE DIPA 사랑이 동시에 가능하려면 어떤 종류의 자기 디자인이 필요했다. 헬시 플레저는 그 디자인에 윤리적 부담을 덜어준 단어였다. ‘맥주를 마시는 것’ 과 ‘건강을 챙기는 것’ 이 양자택일이 아니라 같이 가는 자리가 있을 수 있다는 사실이, 한 사람의 음주 습관을 천천히 바꿨다.\n\n이 옮김의 윤리적 무게가 가볍다. 그래서 더 자연스럽다 (R-12).", "body_html": "<p>소버 큐리어스의 한국 버전 키워드는 ‘헬시 플레저 (Healthy Pleasure)’ 다.</p>\n<p>이 단어를 풀어 보면 ‘건강 (Healthy)’ 과 ‘즐거움 (Pleasure)’ 의 결합이다. 이전 세대의 건강 담론은 즐거움과 대립되는 자리에 있었다. 술은 즐겁지만 건강에 안 좋다, 야식은 맛있지만 살이 찐다, 운동은 힘들지만 건강에는 좋다. 즐거움과 건강이 한쪽씩 양보하면서 균형을 잡았다.</p>\n<p>헬시 플레저의 출발점은 다르다. 즐거움과 건강이 같이 가는 옵션이 있을 수 있다는 가정. 무알콜 맥주는 그 가정의 가장 명확한 예시다. 맥주의 즐거움 (5요소 중 4요소) 을 가지면서 건강 부담 (알코올, 칼로리) 을 줄인다. 이전이라면 “맥주를 줄여야 한다” 였던 자리에 “무알콜로 옮긴다” 가 들어선다.</p>\n<p>내 경우가 그렇다. 매일 홈트 1217일과 NE DIPA 사랑이 동시에 가능하려면 어떤 종류의 자기 디자인이 필요했다. 헬시 플레저는 그 디자인에 윤리적 부담을 덜어준 단어였다. ‘맥주를 마시는 것’ 과 ‘건강을 챙기는 것’ 이 양자택일이 아니라 같이 가는 자리가 있을 수 있다는 사실이, 한 사람의 음주 습관을 천천히 바꿨다.</p>\n<p>이 옮김의 윤리적 무게가 가볍다. 그래서 더 자연스럽다 (R-12).</p>", "plain_len": 612}, {"title": "Page 04 · Identity", "type": "essay", "rawIndex": 4, "body_md": "0잔을 선택하는 것이 정체성의 한 줄이 되었다.\n\n‘오늘 안 마실래’ 라는 한마디가 더 이상 변명이나 양해가 필요한 발화가 아니다. 그 자체로 한 사람의 취향과 가치관을 보여주는 한 줄이다. ‘이 영화 좋아해’ 와 같은 자리에 있다.\n\n이 변화는 작아 보이지만 깊다. 한 사회에서 어떤 행동이 ‘설명이 필요한 행동’ 에서 ‘설명이 필요 없는 행동’ 으로 옮겨가는 순간, 그 행동은 문화의 일부가 된다. 한국에서 ‘술 안 마시는 모임’ 이 설명 없이 통과되기 시작한 것은, 이 변화가 임계점을 넘었다는 신호다.\n\n자기효능감 (self-efficacy) 이라는 심리학 용어가 있다. ‘내가 어떤 행동을 통제할 수 있다는 믿음’ 이다. 술을 조절할 수 있다는 자기효능감은 한 사람의 삶의 통제감을 강화한다. 그 통제감이 정체성의 일부가 된다.", "body_html": "<p>0잔을 선택하는 것이 정체성의 한 줄이 되었다.</p>\n<p>‘오늘 안 마실래’ 라는 한마디가 더 이상 변명이나 양해가 필요한 발화가 아니다. 그 자체로 한 사람의 취향과 가치관을 보여주는 한 줄이다. ‘이 영화 좋아해’ 와 같은 자리에 있다.</p>\n<p>이 변화는 작아 보이지만 깊다. 한 사회에서 어떤 행동이 ‘설명이 필요한 행동’ 에서 ‘설명이 필요 없는 행동’ 으로 옮겨가는 순간, 그 행동은 문화의 일부가 된다. 한국에서 ‘술 안 마시는 모임’ 이 설명 없이 통과되기 시작한 것은, 이 변화가 임계점을 넘었다는 신호다.</p>\n<p>자기효능감 (self-efficacy) 이라는 심리학 용어가 있다. ‘내가 어떤 행동을 통제할 수 있다는 믿음’ 이다. 술을 조절할 수 있다는 자기효능감은 한 사람의 삶의 통제감을 강화한다. 그 통제감이 정체성의 일부가 된다.</p>", "plain_len": 409}, {"title": "Page 05 · Reading", "type": "essay", "rawIndex": 5, "body_md": "‘마시지 않음’ 이 정체성의 한 줄이 되는 사회는, ‘마시는 것’ 이 의무가 아닌 사회다.\n\n이 두 문장은 같은 변화의 두 얼굴이다. 한쪽이 없으면 다른 쪽도 없다. 술을 안 마시는 것이 자연스러워지려면, 술을 마시는 것이 의무가 아니어야 한다.\n\n한국 회식 문화의 오랜 특징은 ‘마시는 것의 반의무화’ 였다. 직급, 관계, 상황에 따라 마시는 것이 반쯤 강제되었다. 그 반강제가 풀리고 있다는 사실은, 회식 문화 자체가 다른 모양으로 바뀌고 있다는 신호다.\n\n이 변화의 속도는 세대별로 다르다. 30대 남자 회식에서는 빠르게, 20대 또래 모임에서는 양극화로, 40대 이상 자리에서는 천천히. 그러나 방향은 한 방향이다. 마시는 것이 의무에서 선택으로 옮겨가고 있다.", "body_html": "<p>‘마시지 않음’ 이 정체성의 한 줄이 되는 사회는, ‘마시는 것’ 이 의무가 아닌 사회다.</p>\n<p>이 두 문장은 같은 변화의 두 얼굴이다. 한쪽이 없으면 다른 쪽도 없다. 술을 안 마시는 것이 자연스러워지려면, 술을 마시는 것이 의무가 아니어야 한다.</p>\n<p>한국 회식 문화의 오랜 특징은 ‘마시는 것의 반의무화’ 였다. 직급, 관계, 상황에 따라 마시는 것이 반쯤 강제되었다. 그 반강제가 풀리고 있다는 사실은, 회식 문화 자체가 다른 모양으로 바뀌고 있다는 신호다.</p>\n<p>이 변화의 속도는 세대별로 다르다. 30대 남자 회식에서는 빠르게, 20대 또래 모임에서는 양극화로, 40대 이상 자리에서는 천천히. 그러나 방향은 한 방향이다. 마시는 것이 의무에서 선택으로 옮겨가고 있다.</p>", "plain_len": 371}], "totalPages": 5}, {"num": "04", "key": "Case", "label": "Case", "ko": "사례", "short": "CS", "title": "술 없는 자리의 평일 저녁", "pages": [{"title": "Page 01 · Cover", "type": "cover", "rawIndex": 1, "body_md": "무엇이 남았나.\n\n술 없는 바의 평일 저녁은 어떤 풍경인가. 자리는 비어 있는가, 다른 무엇으로 채워져 있는가. 채워진 무엇은 술의 자리를 대체하는가, 다른 자리를 만드는가.\n\n세 종류의 자리를 차례로 본다.", "body_html": "<p>무엇이 남았나.</p>\n<p>술 없는 바의 평일 저녁은 어떤 풍경인가. 자리는 비어 있는가, 다른 무엇으로 채워져 있는가. 채워진 무엇은 술의 자리를 대체하는가, 다른 자리를 만드는가.</p>\n<p>세 종류의 자리를 차례로 본다.</p>", "plain_len": 114}, {"title": "Page 02 · Place 1", "type": "essay", "rawIndex": 2, "body_md": "강남구청역 일대에서 무알콜 와인 바가 등장하고 있다.\n\n‘B3713’ 같은 곳은 무알콜 와인 전문 라이츠 (Leitz) 의 ‘아인스츠바이 (Eins-Zwei) 제로’ 같은 제품을 메인 메뉴로 둔다. 일반 와인 바와 같은 분위기 (낮은 조명, 음악, 잔의 무게) 를 유지하면서 와인 자체만 무알콜로 바꾼다. 손님이 받는 경험은 일반 와인 바와 95% 동일하다. 차이는 잔의 내용물뿐이다.\n\n이런 곳이 의미하는 것은, 무알콜이 ‘대체재’ 가 아니라 ‘자체 카테고리’ 가 될 수 있다는 가능성이다. 와인 바의 본질이 와인이 아니라 ‘와인 바의 분위기’ 라면, 와인이 무알콜로 바뀌어도 본질은 유지된다. 손님은 ‘일반 와인 바의 무알콜 버전’ 을 마시러 오는 게 아니라, ‘무알콜 와인 바’ 라는 별도의 자리를 경험하러 온다.", "body_html": "<p>강남구청역 일대에서 무알콜 와인 바가 등장하고 있다.</p>\n<p>‘B3713’ 같은 곳은 무알콜 와인 전문 라이츠 (Leitz) 의 ‘아인스츠바이 (Eins-Zwei) 제로’ 같은 제품을 메인 메뉴로 둔다. 일반 와인 바와 같은 분위기 (낮은 조명, 음악, 잔의 무게) 를 유지하면서 와인 자체만 무알콜로 바꾼다. 손님이 받는 경험은 일반 와인 바와 95% 동일하다. 차이는 잔의 내용물뿐이다.</p>\n<p>이런 곳이 의미하는 것은, 무알콜이 ‘대체재’ 가 아니라 ‘자체 카테고리’ 가 될 수 있다는 가능성이다. 와인 바의 본질이 와인이 아니라 ‘와인 바의 분위기’ 라면, 와인이 무알콜로 바뀌어도 본질은 유지된다. 손님은 ‘일반 와인 바의 무알콜 버전’ 을 마시러 오는 게 아니라, ‘무알콜 와인 바’ 라는 별도의 자리를 경험하러 온다.</p>", "plain_len": 400}, {"title": "Page 03 · Place 2", "type": "essay", "rawIndex": 3, "body_md": "목테일 (Mocktail) 이 흉내내는 칵테일에서 독립 카테고리로 자라고 있다.\n\n목테일은 흉내낸다 (Mock) + 칵테일 (Cocktail) 의 합성어다. 알코올이 없는 칵테일을 뜻한다. 이전 세대의 목테일은 ‘알코올을 못 마시는 사람을 위한 옵션’ 이었다. 임산부용, 운전자용, 어린이용. 메뉴판의 한 줄에 작게 적혀 있었다.\n\n지금의 목테일은 다르다. 독립 메뉴판, 독립 가격대, 독립 마케팅을 가진다. 일부 바에서는 목테일 메뉴가 칵테일 메뉴보다 많다. 가격은 비슷하거나 약간 더 비싸기도 하다. 향신료, 허브, 콜드프레스 주스, 시럽의 조합으로 칵테일 못지않은 복잡한 풍미를 만든다.\n\n이 변화는 ‘대체재’ 에서 ‘독립 카테고리’ 로의 전형적인 진화다. 카테고리 진화의 결정적 신호는 가격이 떨어지지 않고 올라간다는 것이다. 대체재의 가격은 본 카테고리보다 싸야 하지만, 독립 카테고리는 자체 가격을 가질 수 있다.", "body_html": "<p>목테일 (Mocktail) 이 흉내내는 칵테일에서 독립 카테고리로 자라고 있다.</p>\n<p>목테일은 흉내낸다 (Mock) + 칵테일 (Cocktail) 의 합성어다. 알코올이 없는 칵테일을 뜻한다. 이전 세대의 목테일은 ‘알코올을 못 마시는 사람을 위한 옵션’ 이었다. 임산부용, 운전자용, 어린이용. 메뉴판의 한 줄에 작게 적혀 있었다.</p>\n<p>지금의 목테일은 다르다. 독립 메뉴판, 독립 가격대, 독립 마케팅을 가진다. 일부 바에서는 목테일 메뉴가 칵테일 메뉴보다 많다. 가격은 비슷하거나 약간 더 비싸기도 하다. 향신료, 허브, 콜드프레스 주스, 시럽의 조합으로 칵테일 못지않은 복잡한 풍미를 만든다.</p>\n<p>이 변화는 ‘대체재’ 에서 ‘독립 카테고리’ 로의 전형적인 진화다. 카테고리 진화의 결정적 신호는 가격이 떨어지지 않고 올라간다는 것이다. 대체재의 가격은 본 카테고리보다 싸야 하지만, 독립 카테고리는 자체 가격을 가질 수 있다.</p>", "plain_len": 458}, {"title": "Page 04 · Channel", "type": "essay", "rawIndex": 4, "body_md": "채널이 다변화되고 있다.\n\n내가 직접 체험한 채널은 네이버 쇼핑이다. 카스 신제품 ‘카스 올제로 (0.000)’ 를 오비맥주 공식 페이지에서 주문했더니, 춘천에 사는데도 다음 날 집 앞에 도착했다. 500ml 캔 10개에 13,500원. 캔 당 1,350원이다. 일반 맥주가 같은 용량에서 2,500~3,000원을 받는 것과 비교하면 절반 가격이다. 성분표에는 알콜뿐 아니라 당류와 탄수화물까지 모두 0g 미만으로 표기되어 야간에도 부담이 적다. 나무위키의 무알코올 맥주 항목을 찾아보고 알게 된 사실은, 무알콜 맥주가 식약처 분류상 ‘음료’ 이기 때문에 주세와 교육세가 부과되지 않는다는 것이다. 그 면세 구조가 이 가성비의 원천이었다.\n\n온라인 구독 박스. 무알콜 와인, 무알콜 맥주, 목테일 키트를 매월 큐레이션해서 보내주는 서비스도 한국에서 일부 스타트업이 시도하고 있다.\n\n레스토랑 페어링 메뉴. 코스 요리에 무알콜 음료 페어링을 옵션으로 추가하는 곳이 늘고 있다. 와인 페어링과 같은 자리에, 같은 가격대로.\n\n카페용 NA 칵테일. 일반 카페가 저녁 시간대에 무알콜 칵테일을 메뉴에 추가한다. 카페와 바의 경계가 흐려지는 자리에 NA 가 들어선다.\n\n이 채널 다변화는 무알콜이 한 카테고리 안에서 자라는 게 아니라, 여러 카테고리의 경계로 흘러들어가고 있다는 신호다. 매대 한 칸이 아니라 매대 여러 칸의 변화. 카테고리 전체의 재편.", "body_html": "<p>채널이 다변화되고 있다.</p>\n<p>내가 직접 체험한 채널은 네이버 쇼핑이다. 카스 신제품 ‘카스 올제로 (0.000)’ 를 오비맥주 공식 페이지에서 주문했더니, 춘천에 사는데도 다음 날 집 앞에 도착했다. 500ml 캔 10개에 13,500원. 캔 당 1,350원이다. 일반 맥주가 같은 용량에서 2,500~3,000원을 받는 것과 비교하면 절반 가격이다. 성분표에는 알콜뿐 아니라 당류와 탄수화물까지 모두 0g 미만으로 표기되어 야간에도 부담이 적다. 나무위키의 무알코올 맥주 항목을 찾아보고 알게 된 사실은, 무알콜 맥주가 식약처 분류상 ‘음료’ 이기 때문에 주세와 교육세가 부과되지 않는다는 것이다. 그 면세 구조가 이 가성비의 원천이었다.</p>\n<p>온라인 구독 박스. 무알콜 와인, 무알콜 맥주, 목테일 키트를 매월 큐레이션해서 보내주는 서비스도 한국에서 일부 스타트업이 시도하고 있다.</p>\n<p>레스토랑 페어링 메뉴. 코스 요리에 무알콜 음료 페어링을 옵션으로 추가하는 곳이 늘고 있다. 와인 페어링과 같은 자리에, 같은 가격대로.</p>\n<p>카페용 NA 칵테일. 일반 카페가 저녁 시간대에 무알콜 칵테일을 메뉴에 추가한다. 카페와 바의 경계가 흐려지는 자리에 NA 가 들어선다.</p>\n<p>이 채널 다변화는 무알콜이 한 카테고리 안에서 자라는 게 아니라, 여러 카테고리의 경계로 흘러들어가고 있다는 신호다. 매대 한 칸이 아니라 매대 여러 칸의 변화. 카테고리 전체의 재편.</p>", "plain_len": 692}, {"title": "Page 05 · Reading", "type": "essay", "rawIndex": 5, "body_md": "자리는 남고, 잔의 내용만 바뀐다.\n\n이 한 줄이 술집의 정의가 흔들리는 첫 신호다. 술집의 본질이 ‘술을 파는 곳’ 이라면, 술이 빠지면 술집이 아니다. 술집의 본질이 ‘자리를 파는 곳’ 이라면, 술이 빠져도 술집은 술집이다. 한국 술집 시장은 지금 그 정의의 변화 한가운데 있다.\n\n이 변화는 다음 날 (목요일) 에 더 깊이 들어가야 할 주제다. 어메이징브루잉의 퇴장이 의미하는 것은, 술집의 정의가 바뀌는 속도를 한 회사가 따라잡지 못했을 때 일어나는 일이다. 다음 탭에서 본다.", "body_html": "<p>자리는 남고, 잔의 내용만 바뀐다.</p>\n<p>이 한 줄이 술집의 정의가 흔들리는 첫 신호다. 술집의 본질이 ‘술을 파는 곳’ 이라면, 술이 빠지면 술집이 아니다. 술집의 본질이 ‘자리를 파는 곳’ 이라면, 술이 빠져도 술집은 술집이다. 한국 술집 시장은 지금 그 정의의 변화 한가운데 있다.</p>\n<p>이 변화는 다음 날 (목요일) 에 더 깊이 들어가야 할 주제다. 어메이징브루잉의 퇴장이 의미하는 것은, 술집의 정의가 바뀌는 속도를 한 회사가 따라잡지 못했을 때 일어나는 일이다. 다음 탭에서 본다.</p>", "plain_len": 269}], "totalPages": 5}, {"num": "05", "key": "Archive", "label": "Archive", "ko": "아카이브", "short": "AR", "title": "새 자리의 규칙", "pages": [{"title": "Page 01 · Manual", "type": "archive", "rawIndex": 1, "body_md": "얼마 전 아내와 집에서 카스 올제로 두 캔을 사이좋게 나눠 마시면서 한 얘기가 있다.\n\n옛날 회식 풍경을 상상해 봤다. 1990년대, 2000년대 부장 자리. 새로 들어온 신입사원이 “저는 술 못 마셔서요” 라며 콜라나 사이다를 시킨다. 회식 자리 전체가 200ml 소맥잔에 황금색 액체로 통일된 와중에, 한 자리만 검은색 콜라잔이나 투명한 사이다잔이 자리잡는다. 부장이 “자, 다 같이 건배!” 를 외치며 잔을 들 때 그 시각적 통일성이 깨진다. 부장이 그 자리를 보고 미세하게 불편한 표정을 짓는다.\n\n오랫동안 이 불편함이 “신입사원을 굴복시키고 싶은 권위” 의 문제라고 생각해왔다. 그런데 카스 올제로 한 캔이 손에 들어오고 나서 다른 해석이 생겼다. 그 불편함의 정체는 권위가 아니라 시각적 통일성의 붕괴 아니었을까. 한 자리의 분위기를 만드는 작은 시각적 합의 — 모두가 같은 잔에 같은 색 액체를 들고 있다는 형식적 통일 — 이 한 사람의 다른 잔 하나에 깨진다. 부장이 싫었던 것은 ‘안 마시는 사람’ 이 아니라 ‘건배사의 시각적 UX 통일성을 해치는 잔’ 이었을 가능성.\n\n만약 그 신입사원이 콜라가 아니라 카스 0.0 을 시켰다면 어땠을까. 같은 황금색 액체, 같은 거품, 같은 잔. 부장이 멀리서 건배를 외치며 슥 훑어봐도 구분이 불가능하다. “음, 그래 뭐…” 하는 톤으로 통과되고, “그래 그래, 억지로 마시지 말게” 라는 톤으로 부장의 가오도 살아남는다. 회식의 새 문법을 가능하게 한 것은 의식의 변화만이 아니다. 잔의 시각적 통일성을 회복시킨 무알콜 제품의 등장도 함께였다.\n\n호스트의 새 매뉴얼은 이 가설 위에서 4가지로 정리된다.\n\n1. 메뉴판에 무알콜 옵션을 먼저 제시한다. ‘맥주는 뭐로?’ 가 아니라 ‘오늘 마실 거 있어?’ 로 시작한다.\n\n2. 한 사람이 안 마신다고 해도 후속 질문을 하지 않는다. ‘왜?’ 라는 한 글자를 줄인다.\n\n3. 시각적 통일성을 의식한다. 콜라보다 같은 잔의 무알콜 맥주가 자리의 형식적 합의를 덜 깬다.\n\n4. 모임의 정의를 ‘술자리’ 가 아니라 ‘만남’ 으로 둔다. 자리의 이름이 도구를 결정한다.\n\n이 4가지는 새 매뉴얼이지만, 실은 오래된 식사 자리의 매너에 가깝다. 술이 빠진 만찬 자리는 사실 인류의 더 오래된 모임 형태였다.", "body_html": "<p>얼마 전 아내와 집에서 카스 올제로 두 캔을 사이좋게 나눠 마시면서 한 얘기가 있다.</p>\n<p>옛날 회식 풍경을 상상해 봤다. 1990년대, 2000년대 부장 자리. 새로 들어온 신입사원이 “저는 술 못 마셔서요” 라며 콜라나 사이다를 시킨다. 회식 자리 전체가 200ml 소맥잔에 황금색 액체로 통일된 와중에, 한 자리만 검은색 콜라잔이나 투명한 사이다잔이 자리잡는다. 부장이 “자, 다 같이 건배!” 를 외치며 잔을 들 때 그 시각적 통일성이 깨진다. 부장이 그 자리를 보고 미세하게 불편한 표정을 짓는다.</p>\n<p>오랫동안 이 불편함이 “신입사원을 굴복시키고 싶은 권위” 의 문제라고 생각해왔다. 그런데 카스 올제로 한 캔이 손에 들어오고 나서 다른 해석이 생겼다. 그 불편함의 정체는 권위가 아니라 시각적 통일성의 붕괴 아니었을까. 한 자리의 분위기를 만드는 작은 시각적 합의 — 모두가 같은 잔에 같은 색 액체를 들고 있다는 형식적 통일 — 이 한 사람의 다른 잔 하나에 깨진다. 부장이 싫었던 것은 ‘안 마시는 사람’ 이 아니라 ‘건배사의 시각적 UX 통일성을 해치는 잔’ 이었을 가능성.</p>\n<p>만약 그 신입사원이 콜라가 아니라 카스 0.0 을 시켰다면 어땠을까. 같은 황금색 액체, 같은 거품, 같은 잔. 부장이 멀리서 건배를 외치며 슥 훑어봐도 구분이 불가능하다. “음, 그래 뭐…” 하는 톤으로 통과되고, “그래 그래, 억지로 마시지 말게” 라는 톤으로 부장의 가오도 살아남는다. 회식의 새 문법을 가능하게 한 것은 의식의 변화만이 아니다. 잔의 시각적 통일성을 회복시킨 무알콜 제품의 등장도 함께였다.</p>\n<p>호스트의 새 매뉴얼은 이 가설 위에서 4가지로 정리된다.</p>\n<ol><li>메뉴판에 무알콜 옵션을 먼저 제시한다. ‘맥주는 뭐로?’ 가 아니라 ‘오늘 마실 거 있어?’ 로 시작한다.</li></ol>\n<ol><li>한 사람이 안 마신다고 해도 후속 질문을 하지 않는다. ‘왜?’ 라는 한 글자를 줄인다.</li></ol>\n<ol><li>시각적 통일성을 의식한다. 콜라보다 같은 잔의 무알콜 맥주가 자리의 형식적 합의를 덜 깬다.</li></ol>\n<ol><li>모임의 정의를 ‘술자리’ 가 아니라 ‘만남’ 으로 둔다. 자리의 이름이 도구를 결정한다.</li></ol>\n<p>이 4가지는 새 매뉴얼이지만, 실은 오래된 식사 자리의 매너에 가깝다. 술이 빠진 만찬 자리는 사실 인류의 더 오래된 모임 형태였다.</p>", "plain_len": 1100}, {"title": "Page 02 · Quote", "type": "archive", "rawIndex": 2, "body_md": "고대신문은 2025년에 “술잔 내려놓은 2030, 낡은 골목에 지갑 연다” 라는 제목의 기사를 실었다 (R-42). 부제는 회식이 줄고 골목 식당의 평일 매출이 늘고 있다는 내용이었다.\n\n이 두 줄 안에 한 변화가 들어 있다. 술을 줄이는 변화는 ‘지출 자체가 줄어드는 변화’ 가 아니다. 지출의 방향이 옮겨가는 변화다. 회식의 술값에서 평일 골목 식당의 음식값으로, 한 자리의 큰 비용에서 여러 자리의 작은 비용으로, 알코올의 만족에서 음식과 분위기의 만족으로.\n\n이 흐름은 통계로는 잘 안 잡힌다. 회식 매출 감소는 큰 그래프로 잡히지만, 골목 식당의 평일 매출 증가는 분산되어 있어서 큰 그래프로 모이지 않는다. 그러나 거리에서 느낄 수는 있다. 평일 저녁 동네 식당의 분위기가 5년 전과 다르다.", "body_html": "<p>고대신문은 2025년에 “술잔 내려놓은 2030, 낡은 골목에 지갑 연다” 라는 제목의 기사를 실었다 (R-42). 부제는 회식이 줄고 골목 식당의 평일 매출이 늘고 있다는 내용이었다.</p>\n<p>이 두 줄 안에 한 변화가 들어 있다. 술을 줄이는 변화는 ‘지출 자체가 줄어드는 변화’ 가 아니다. 지출의 방향이 옮겨가는 변화다. 회식의 술값에서 평일 골목 식당의 음식값으로, 한 자리의 큰 비용에서 여러 자리의 작은 비용으로, 알코올의 만족에서 음식과 분위기의 만족으로.</p>\n<p>이 흐름은 통계로는 잘 안 잡힌다. 회식 매출 감소는 큰 그래프로 잡히지만, 골목 식당의 평일 매출 증가는 분산되어 있어서 큰 그래프로 모이지 않는다. 그러나 거리에서 느낄 수는 있다. 평일 저녁 동네 식당의 분위기가 5년 전과 다르다.</p>", "plain_len": 391}, {"title": "Page 03 · Summary", "type": "archive", "rawIndex": 3, "body_md": "수요일을 세 문장으로 접는다.\n\n첫째, 폭음과 절주가 같은 세대 안에서 공존한다. 양극화의 신호다. 단순한 ‘술이 줄어든다’ 가 아니라 ‘술을 의식적으로 다룬다’ 의 가설.\n\n둘째, 절제가 윤리에서 미학으로 옮겨갔다. ‘마시면 안 되는 것’ 이 아니라 ‘마시지 않는 것을 잘 다루는 것’.\n\n셋째, 자리의 정의가 바뀌고 있다. 술집의 본질이 ‘술’ 인가 ‘자리’ 인가의 질문이 다음 날의 주제다.", "body_html": "<p>수요일을 세 문장으로 접는다.</p>\n<p>첫째, 폭음과 절주가 같은 세대 안에서 공존한다. 양극화의 신호다. 단순한 ‘술이 줄어든다’ 가 아니라 ‘술을 의식적으로 다룬다’ 의 가설.</p>\n<p>둘째, 절제가 윤리에서 미학으로 옮겨갔다. ‘마시면 안 되는 것’ 이 아니라 ‘마시지 않는 것을 잘 다루는 것’.</p>\n<p>셋째, 자리의 정의가 바뀌고 있다. 술집의 본질이 ‘술’ 인가 ‘자리’ 인가의 질문이 다음 날의 주제다.</p>", "plain_len": 218}, {"title": "Page 04 · Bridge", "type": "archive", "rawIndex": 4, "body_md": "다음 날은 업태의 자리로 간다.\n\n자리의 정의가 바뀌면 술집의 정의도 바뀐다. 그 정의 변화를 따라잡지 못한 회사가 무엇을 잃었는지, 그 변화를 잘 읽은 가게가 무엇으로 살아남았는지를 본다. 어메이징브루잉의 퇴장이 한 회사의 일이 아닌 이유가 거기에 있다.\n\n목요일은 무겁다. 그러나 무거움 안에 다음 시대의 신호가 있다.\n\n---", "body_html": "<p>다음 날은 업태의 자리로 간다.</p>\n<p>자리의 정의가 바뀌면 술집의 정의도 바뀐다. 그 정의 변화를 따라잡지 못한 회사가 무엇을 잃었는지, 그 변화를 잘 읽은 가게가 무엇으로 살아남았는지를 본다. 어메이징브루잉의 퇴장이 한 회사의 일이 아닌 이유가 거기에 있다.</p>\n<p>목요일은 무겁다. 그러나 무거움 안에 다음 시대의 신호가 있다.</p>\n<p>---</p>", "plain_len": 182}], "totalPages": 4}]}, {"date": "2026-05-14", "weekday": "목", "weekdayFull": "목요일", "no": "002-04", "titleLine": "어메이징브루잉 이후, 술집의 다음", "theme": "어메이징브루잉 이후, 술집의 다음", "note_html": "<aside class=\"note-card\"><strong>Note</strong><p>목요일의 역할 목요일은 Vol002 의 가장 무거운 날이다. 한 양조장의 퇴장이 단지 한 회사의 일이 아닌 이유. 세븐브로이·제주맥주·어메이징브루잉 — 수제맥주 1세대의 도미노. 그 옆에서 다음 시대의 술집이 어떤 좌표를 잡고 있는지.</p></aside>", "sections": [{"num": "01", "key": "Intro", "label": "Intro", "ko": "입구", "short": "IN", "title": "성수에서 사라진 간판들", "pages": [{"title": "Page 01 · Cover", "type": "cover", "rawIndex": 1, "body_md": "성수에서 사라진 간판들.\n\n한 동네의 1년 사이에 바뀐 간판들을 세어 본다. 그 숫자가 한 양조장의 파산보다 큰 이야기를 한다.", "body_html": "<p>성수에서 사라진 간판들.</p>\n<p>한 동네의 1년 사이에 바뀐 간판들을 세어 본다. 그 숫자가 한 양조장의 파산보다 큰 이야기를 한다.</p>", "plain_len": 70}, {"title": "Page 02 · Scene", "type": "essay", "rawIndex": 2, "body_md": "NE DIPA 광이었던 시절에 자주 들렀던 가게들이 있다.\n\n성수동 연무장길의 작은 양조장, 서울숲 쪽의 탭하우스, 한남동 골목의 크래프트 비어 바. 한 시즌에 한 번씩 들렀다. 새 IPA 가 출시되면 시음 메뉴를 시키고, 어떤 효모 라인을 썼는지 묻고, 다음 시즌 신제품 일정을 들었다. 새로 나온 더블 IPA 의 IBU (쓴맛 단위) 가 얼마인지를 확인하는 그런 종류의 대화들.\n\n이번 봄에 다시 가봤을 때, 자주 들르던 가게 중 절반은 다른 간판으로 바뀌어 있었다. 같은 자리에 다른 가게가 들어선 게 아니라, 같은 자리에 더 큰 브랜드가 들어와 있었다. 작은 양조장 자리에 무신사 매장. 탭하우스 자리에 디올 팝업. 크래프트 비어 바 자리에 젠틀몬스터 쇼룸. 한 동네의 입자가 거칠어지고 있었다.\n\n이 변화는 어메이징브루잉 한 회사만의 문제가 아니다. 같은 거리 위의 여러 가게가 같은 시기에 같은 변화를 겪었다.", "body_html": "<p>NE DIPA 광이었던 시절에 자주 들렀던 가게들이 있다.</p>\n<p>성수동 연무장길의 작은 양조장, 서울숲 쪽의 탭하우스, 한남동 골목의 크래프트 비어 바. 한 시즌에 한 번씩 들렀다. 새 IPA 가 출시되면 시음 메뉴를 시키고, 어떤 효모 라인을 썼는지 묻고, 다음 시즌 신제품 일정을 들었다. 새로 나온 더블 IPA 의 IBU (쓴맛 단위) 가 얼마인지를 확인하는 그런 종류의 대화들.</p>\n<p>이번 봄에 다시 가봤을 때, 자주 들르던 가게 중 절반은 다른 간판으로 바뀌어 있었다. 같은 자리에 다른 가게가 들어선 게 아니라, 같은 자리에 더 큰 브랜드가 들어와 있었다. 작은 양조장 자리에 무신사 매장. 탭하우스 자리에 디올 팝업. 크래프트 비어 바 자리에 젠틀몬스터 쇼룸. 한 동네의 입자가 거칠어지고 있었다.</p>\n<p>이 변화는 어메이징브루잉 한 회사만의 문제가 아니다. 같은 거리 위의 여러 가게가 같은 시기에 같은 변화를 겪었다.</p>", "plain_len": 456}, {"title": "Page 03 · Gentrification", "type": "essay", "rawIndex": 3, "body_md": "성수동의 임대가격지수 상승률은 2025년 1분기에 109.1% 였다. 전국 1위였다. 압구정과 용산을 제쳤다. 같은 분기에 권리금 20억 원에 달하는 매장이 등장했다는 보도도 있다 (R-41).\n\n109.1% 라는 숫자는 단순 비교가 아니다. 한 분기에 임대료가 2배 가까이 뛰었다는 뜻이다. 이 속도를 따라잡을 수 있는 자영업은 거의 없다. 매출이 그만큼 늘어야 하지만, 회식 문화가 줄어들고 술 시장이 위축되는 시기에 매출이 두 배가 되기는 어렵다.\n\n이 두 곡선 — 임대료의 폭등과 매출의 정체 — 가 만나는 자리에서 가게는 닫힌다. 닫힌 자리에는 그 임대료를 감당할 수 있는 큰 브랜드가 들어선다. 동네의 입자가 거칠어지는 메커니즘이다.", "body_html": "<p>성수동의 임대가격지수 상승률은 2025년 1분기에 109.1% 였다. 전국 1위였다. 압구정과 용산을 제쳤다. 같은 분기에 권리금 20억 원에 달하는 매장이 등장했다는 보도도 있다 (R-41).</p>\n<p>109.1% 라는 숫자는 단순 비교가 아니다. 한 분기에 임대료가 2배 가까이 뛰었다는 뜻이다. 이 속도를 따라잡을 수 있는 자영업은 거의 없다. 매출이 그만큼 늘어야 하지만, 회식 문화가 줄어들고 술 시장이 위축되는 시기에 매출이 두 배가 되기는 어렵다.</p>\n<p>이 두 곡선 — 임대료의 폭등과 매출의 정체 — 가 만나는 자리에서 가게는 닫힌다. 닫힌 자리에는 그 임대료를 감당할 수 있는 큰 브랜드가 들어선다. 동네의 입자가 거칠어지는 메커니즘이다.</p>", "plain_len": 358}, {"title": "Page 04 · Replacement", "type": "essay", "rawIndex": 4, "body_md": "성수동 연무장길의 변화는 한 줄로 압축된다. 로컬 자영업의 자리에 대기업·대형 브랜드가 들어왔다.\n\n무신사. 젠틀몬스터. 디올. 한국 패션·뷰티의 대형 브랜드들. 이들이 한 동네에 동시에 진입한 것은 우연이 아니다. 한 동네가 ‘힙’ 하다는 평판을 쌓는 데 5~10년이 걸리고, 그 평판이 임계점을 넘으면 대형 브랜드의 진입이 시작된다. 진입한 대형 브랜드는 동네의 평판을 활용하고, 동시에 동네의 입자를 자기 쪽으로 끌어당긴다.\n\n그 결과 ‘한국의 브루클린’ 이라는 별명을 만든 독특한 로컬 상점들은 사라지고, 표준화된 대기업 매장으로 동네가 채워진다. 5년 뒤의 성수동은 지금의 성수동과 같은 동네가 아닐 가능성이 크다.", "body_html": "<p>성수동 연무장길의 변화는 한 줄로 압축된다. 로컬 자영업의 자리에 대기업·대형 브랜드가 들어왔다.</p>\n<p>무신사. 젠틀몬스터. 디올. 한국 패션·뷰티의 대형 브랜드들. 이들이 한 동네에 동시에 진입한 것은 우연이 아니다. 한 동네가 ‘힙’ 하다는 평판을 쌓는 데 5~10년이 걸리고, 그 평판이 임계점을 넘으면 대형 브랜드의 진입이 시작된다. 진입한 대형 브랜드는 동네의 평판을 활용하고, 동시에 동네의 입자를 자기 쪽으로 끌어당긴다.</p>\n<p>그 결과 ‘한국의 브루클린’ 이라는 별명을 만든 독특한 로컬 상점들은 사라지고, 표준화된 대기업 매장으로 동네가 채워진다. 5년 뒤의 성수동은 지금의 성수동과 같은 동네가 아닐 가능성이 크다.</p>", "plain_len": 347}, {"title": "Page 05 · Bridge", "type": "essay", "rawIndex": 5, "body_md": "그 변화의 한가운데 어메이징브루잉이 있었다.\n\n성수동 본점 양조장. 한국 수제맥주의 1세대 아이콘 중 하나. 110억 원의 VC 투자. 그러나 이번에 회생절차가 폐지되고 파산 수순으로 들어갔다. 다음 탭에서 이 사건의 timeline 을 본다. 그 timeline 자체가 수제맥주 1세대 전체의 timeline 이기도 하다.", "body_html": "<p>그 변화의 한가운데 어메이징브루잉이 있었다.</p>\n<p>성수동 본점 양조장. 한국 수제맥주의 1세대 아이콘 중 하나. 110억 원의 VC 투자. 그러나 이번에 회생절차가 폐지되고 파산 수순으로 들어갔다. 다음 탭에서 이 사건의 timeline 을 본다. 그 timeline 자체가 수제맥주 1세대 전체의 timeline 이기도 하다.</p>", "plain_len": 180}], "totalPages": 5}, {"num": "02", "key": "Issue", "label": "Issue", "ko": "쟁점", "short": "IS", "title": "한 양조장의 퇴장", "pages": [{"title": "Page 01 · Cover", "type": "cover", "rawIndex": 1, "body_md": "사건의 무게를 재다.\n\n어메이징브루잉컴퍼니의 timeline 을 한 페이지씩 본다. 그 timeline 안에 한 시대의 끝이 들어 있다.", "body_html": "<p>사건의 무게를 재다.</p>\n<p>어메이징브루잉컴퍼니의 timeline 을 한 페이지씩 본다. 그 timeline 안에 한 시대의 끝이 들어 있다.</p>", "plain_len": 75}, {"title": "Page 02 · Timeline 1", "type": "data", "rawIndex": 2, "body_md": "2016년 창업. 서울 성수동에 본점 양조장을 열었다. 서울숲 수제라거, 첫사랑 맥주 같은 시그니처 제품으로 한국 수제맥주 시장의 1세대 아이콘 중 하나로 자리잡았다.\n\n벤처캐피털 (VC) 로부터 110억 원 규모의 투자를 받았다. 한국 수제맥주 회사 중에서 가장 큰 투자 라운드 중 하나였다. 그 돈으로 공장을 증설했다. 매대 확장, 편의점 입점, 대량 생산 체제로의 전환. 1세대 수제맥주의 전형적인 성장 경로였다.\n\n그러나 그 경로의 끝에 재정 건전성의 악화가 있었다. 2024년 말 누적 결손금은 140억 원에 달했다 (R-17, R-19). 110억 받아서 140억 손해. 단순 계산으로도 자본금이 거의 다 소진된 상태였다.", "body_html": "<p>2016년 창업. 서울 성수동에 본점 양조장을 열었다. 서울숲 수제라거, 첫사랑 맥주 같은 시그니처 제품으로 한국 수제맥주 시장의 1세대 아이콘 중 하나로 자리잡았다.</p>\n<p>벤처캐피털 (VC) 로부터 110억 원 규모의 투자를 받았다. 한국 수제맥주 회사 중에서 가장 큰 투자 라운드 중 하나였다. 그 돈으로 공장을 증설했다. 매대 확장, 편의점 입점, 대량 생산 체제로의 전환. 1세대 수제맥주의 전형적인 성장 경로였다.</p>\n<p>그러나 그 경로의 끝에 재정 건전성의 악화가 있었다. 2024년 말 누적 결손금은 140억 원에 달했다 (R-17, R-19). 110억 받아서 140억 손해. 단순 계산으로도 자본금이 거의 다 소진된 상태였다.</p>", "plain_len": 352}, {"title": "Page 03 · Timeline 2", "type": "data", "rawIndex": 3, "body_md": "2025년 8월 13일. 서울회생법원 회생15부가 어메이징브루잉컴퍼니에 대한 기업회생 절차 개시를 결정했다 (R-17).\n\n회생 절차는 파산의 직전 단계가 아니다. ‘회사를 살리기 위한’ 절차다. 채권자들의 채무를 일부 탕감하거나 변제 일정을 조정해서 회사가 다시 정상화될 수 있게 돕는 법적 프로세스다. 회사 자체는 운영을 계속한다.\n\n회생 개시 직후, 회사의 소송대리인은 ‘인가 전 M&A’ 라는 카드를 꺼냈다. 회생계획안이 인가되기 전에 새 인수자를 찾아서 그 인수자가 회사를 살리는 방식이다. 주간사를 선정하고, 공개 경쟁입찰 공고를 냈다. 그러나 인수 협상은 진전이 없었다 (R-18). 110억의 투자가 50억 대로 추락한 회사를 인수할 만한 곳이 없었다 (R-19).", "body_html": "<p>2025년 8월 13일. 서울회생법원 회생15부가 어메이징브루잉컴퍼니에 대한 기업회생 절차 개시를 결정했다 (R-17).</p>\n<p>회생 절차는 파산의 직전 단계가 아니다. ‘회사를 살리기 위한’ 절차다. 채권자들의 채무를 일부 탕감하거나 변제 일정을 조정해서 회사가 다시 정상화될 수 있게 돕는 법적 프로세스다. 회사 자체는 운영을 계속한다.</p>\n<p>회생 개시 직후, 회사의 소송대리인은 ‘인가 전 M&amp;A’ 라는 카드를 꺼냈다. 회생계획안이 인가되기 전에 새 인수자를 찾아서 그 인수자가 회사를 살리는 방식이다. 주간사를 선정하고, 공개 경쟁입찰 공고를 냈다. 그러나 인수 협상은 진전이 없었다 (R-18). 110억의 투자가 50억 대로 추락한 회사를 인수할 만한 곳이 없었다 (R-19).</p>", "plain_len": 378}, {"title": "Page 04 · Timeline 3", "type": "data", "rawIndex": 4, "body_md": "2026년 1월 27일. 법원이 회생절차 폐지 결정을 내렸다 (R-16).\n\n회생계획안을 회사가 제출하지 못했기 때문이다. 인수자가 없으면 회생계획안을 만들 수 없고, 회생계획안이 없으면 회생 절차를 계속할 수 없다. 회생 폐지는 사실상 파산의 출발점이다. 이후 파산 절차가 진행된다.\n\n이 시점이 2026년 1월 27일이다. 같은 날 한국의 다른 곳에서는 무알콜 시장이 매년 두 자릿수로 자라고 있었다. 두 변화는 무관해 보이지만, 사실 같은 시장의 두 면이다. 한쪽에서 수제맥주 1세대가 무너지는 동안, 다른 쪽에서 무알콜이 자리를 잡았다.", "body_html": "<p>2026년 1월 27일. 법원이 회생절차 폐지 결정을 내렸다 (R-16).</p>\n<p>회생계획안을 회사가 제출하지 못했기 때문이다. 인수자가 없으면 회생계획안을 만들 수 없고, 회생계획안이 없으면 회생 절차를 계속할 수 없다. 회생 폐지는 사실상 파산의 출발점이다. 이후 파산 절차가 진행된다.</p>\n<p>이 시점이 2026년 1월 27일이다. 같은 날 한국의 다른 곳에서는 무알콜 시장이 매년 두 자릿수로 자라고 있었다. 두 변화는 무관해 보이지만, 사실 같은 시장의 두 면이다. 한쪽에서 수제맥주 1세대가 무너지는 동안, 다른 쪽에서 무알콜이 자리를 잡았다.</p>", "plain_len": 302}, {"title": "Page 05 · Pattern", "type": "essay", "rawIndex": 5, "body_md": "어메이징브루잉 한 회사의 사건이 아니다. 패턴이다.\n\n세븐브로이맥주. 곰표 밀맥주 (대한제분 협업) 으로 6,000만 캔을 팔며 한국 수제맥주 붐을 주도했다. 2024년 1월 코넥스 시장에 상장했다. 그러나 2023년 3월 대한제분이 상표권 계약 만료 후 협업 파트너를 제주맥주로 바꾼 뒤 실적이 적자로 전환했다. 2024년 매출 84억 원 (-32.3%), 영업손실 91억 원. 2025년 8월 21일 한국거래소가 상장폐지를 결정했다 (R-20). 코넥스 입성 1년 7개월 만이었다.\n\n제주맥주 (한울앤제주). 2015년 설립, 2021년 특례 상장. 한 번도 흑자를 낸 적이 없다. 누적 영업손실 268억 원. 2024년 3월 자동차 수리업체 더블에이치엠에 매각되었고, 11월 전자부품회사 한울반도체로 경영권이 다시 넘어갔다. 2025년 사명을 ‘한울앤제주’ 로 바꿨다 (R-13).\n\n세 회사의 timeline 을 옆에 놓고 본다. 다른 회사들이지만 같은 패턴이다. VC 투자, 공장 증설, 매대 의존, 매출 정체, 적자 누적, 매각·회생·파산. 1세대 수제맥주의 ‘성장 → 위기’ 의 표준 경로다.", "body_html": "<p>어메이징브루잉 한 회사의 사건이 아니다. 패턴이다.</p>\n<p>세븐브로이맥주. 곰표 밀맥주 (대한제분 협업) 으로 6,000만 캔을 팔며 한국 수제맥주 붐을 주도했다. 2024년 1월 코넥스 시장에 상장했다. 그러나 2023년 3월 대한제분이 상표권 계약 만료 후 협업 파트너를 제주맥주로 바꾼 뒤 실적이 적자로 전환했다. 2024년 매출 84억 원 (-32.3%), 영업손실 91억 원. 2025년 8월 21일 한국거래소가 상장폐지를 결정했다 (R-20). 코넥스 입성 1년 7개월 만이었다.</p>\n<p>제주맥주 (한울앤제주). 2015년 설립, 2021년 특례 상장. 한 번도 흑자를 낸 적이 없다. 누적 영업손실 268억 원. 2024년 3월 자동차 수리업체 더블에이치엠에 매각되었고, 11월 전자부품회사 한울반도체로 경영권이 다시 넘어갔다. 2025년 사명을 ‘한울앤제주’ 로 바꿨다 (R-13).</p>\n<p>세 회사의 timeline 을 옆에 놓고 본다. 다른 회사들이지만 같은 패턴이다. VC 투자, 공장 증설, 매대 의존, 매출 정체, 적자 누적, 매각·회생·파산. 1세대 수제맥주의 ‘성장 → 위기’ 의 표준 경로다.</p>", "plain_len": 559}, {"title": "Page 06 · Market", "type": "essay", "rawIndex": 6, "body_md": "한국 수제맥주 시장 전체 규모를 본다. 2013년 9억 3,000만 원에서 시작해서 2021년 1,520억 원까지 자랐다. 8년 만에 약 163배의 성장이었다.\n\n그리고 2023년 752억 원. 2년 만에 반토막 (R-15).\n\n이 그래프가 어메이징브루잉, 세븐브로이, 제주맥주의 timeline 의 거시적 배경이다. 한 시장이 2년 만에 반토막이 나면, 그 안에 있던 회사들의 대부분은 살아남기 어렵다. 누가 살아남느냐는 다른 종류의 게임이다.", "body_html": "<p>한국 수제맥주 시장 전체 규모를 본다. 2013년 9억 3,000만 원에서 시작해서 2021년 1,520억 원까지 자랐다. 8년 만에 약 163배의 성장이었다.</p>\n<p>그리고 2023년 752억 원. 2년 만에 반토막 (R-15).</p>\n<p>이 그래프가 어메이징브루잉, 세븐브로이, 제주맥주의 timeline 의 거시적 배경이다. 한 시장이 2년 만에 반토막이 나면, 그 안에 있던 회사들의 대부분은 살아남기 어렵다. 누가 살아남느냐는 다른 종류의 게임이다.</p>", "plain_len": 247}], "totalPages": 6}, {"num": "03", "key": "Insight", "label": "Insight", "ko": "통찰", "short": "IT", "title": "술집은 술을 파는 곳이 아니다", "pages": [{"title": "Page 01 · Cover", "type": "cover", "rawIndex": 1, "body_md": "다시 묻는 업태의 정의.\n\n술집은 술을 파는 곳인가, 자리를 파는 곳인가. 이 질문은 단어 놀이가 아니다. 답에 따라 살아남는 가게와 사라지는 가게가 갈린다.", "body_html": "<p>다시 묻는 업태의 정의.</p>\n<p>술집은 술을 파는 곳인가, 자리를 파는 곳인가. 이 질문은 단어 놀이가 아니다. 답에 따라 살아남는 가게와 사라지는 가게가 갈린다.</p>", "plain_len": 87}, {"title": "Page 02 · Definition", "type": "essay", "rawIndex": 2, "body_md": "‘업태 (業態)’ 라는 한자어는 회색지대를 갖고 있다.\n\n법적으로 한국의 음식점업은 일반음식점, 휴게음식점, 단란주점, 유흥주점 등으로 나뉜다. 술을 파는 자격 (주류면허) 의 유무로 1차 분류된다. 그러나 실제 영업에서는 이 분류가 흐려진다. 일반음식점에서 와인을 판매하기도 하고, 카페에서 저녁에 무알콜 칵테일을 내기도 한다. ‘일반음식점’ 인데 실질적으로는 ‘바’ 처럼 운영되는 곳이 늘어나고 있다.\n\n이 회색지대가 의미하는 것은, 업태의 정의가 법적 분류가 아니라 ‘손님이 인지하는 정체성’ 으로 옮겨가고 있다는 사실이다. 손님이 이 가게를 ‘술집’ 이라고 인지하면 술집이고, ‘식당’ 이라고 인지하면 식당이다. 그 인지가 법적 분류보다 빠르게 변한다.", "body_html": "<p>‘업태 (業態)’ 라는 한자어는 회색지대를 갖고 있다.</p>\n<p>법적으로 한국의 음식점업은 일반음식점, 휴게음식점, 단란주점, 유흥주점 등으로 나뉜다. 술을 파는 자격 (주류면허) 의 유무로 1차 분류된다. 그러나 실제 영업에서는 이 분류가 흐려진다. 일반음식점에서 와인을 판매하기도 하고, 카페에서 저녁에 무알콜 칵테일을 내기도 한다. ‘일반음식점’ 인데 실질적으로는 ‘바’ 처럼 운영되는 곳이 늘어나고 있다.</p>\n<p>이 회색지대가 의미하는 것은, 업태의 정의가 법적 분류가 아니라 ‘손님이 인지하는 정체성’ 으로 옮겨가고 있다는 사실이다. 손님이 이 가게를 ‘술집’ 이라고 인지하면 술집이고, ‘식당’ 이라고 인지하면 식당이다. 그 인지가 법적 분류보다 빠르게 변한다.</p>", "plain_len": 367}, {"title": "Page 03 · Question", "type": "essay", "rawIndex": 3, "body_md": "술집이 알코올을 빼면 술집인가, 다른 무엇인가.\n\n이 질문에 두 답이 가능하다.\n\n첫 번째 답. 술집의 본질은 알코올이므로, 알코올이 빠지면 더 이상 술집이 아니다. 다른 무엇 — 카페, 라운지, 다이닝 바 — 으로 이름을 바꿔야 한다.\n\n두 번째 답. 술집의 본질은 자리이므로, 알코올이 빠져도 그 자리의 형식이 유지되면 술집이다. 잔의 내용물은 부차적이다.\n\n지금 한국 시장에서 살아남는 가게들은 두 번째 답을 선택한 곳이 많다. 알코올 메뉴를 줄이지만 자리의 형식은 유지한다. 잔, 조명, 음악, 시간대, 안주의 구성 — 이 모든 형식적 요소가 그대로 있다. 손님은 ‘술집의 자리’ 를 경험하면서 잔의 내용만 의식적으로 다룰 수 있다.", "body_html": "<p>술집이 알코올을 빼면 술집인가, 다른 무엇인가.</p>\n<p>이 질문에 두 답이 가능하다.</p>\n<p>첫 번째 답. 술집의 본질은 알코올이므로, 알코올이 빠지면 더 이상 술집이 아니다. 다른 무엇 — 카페, 라운지, 다이닝 바 — 으로 이름을 바꿔야 한다.</p>\n<p>두 번째 답. 술집의 본질은 자리이므로, 알코올이 빠져도 그 자리의 형식이 유지되면 술집이다. 잔의 내용물은 부차적이다.</p>\n<p>지금 한국 시장에서 살아남는 가게들은 두 번째 답을 선택한 곳이 많다. 알코올 메뉴를 줄이지만 자리의 형식은 유지한다. 잔, 조명, 음악, 시간대, 안주의 구성 — 이 모든 형식적 요소가 그대로 있다. 손님은 ‘술집의 자리’ 를 경험하면서 잔의 내용만 의식적으로 다룰 수 있다.</p>", "plain_len": 354}, {"title": "Page 04 · Reframe", "type": "essay", "rawIndex": 4, "body_md": "‘알코올’ 이 아니라 ‘자리’ 가 본질이라면, 매대보다 의자가 먼저다.\n\n이 한 줄이 어메이징브루잉이 놓친 것의 정확한 묘사다. 1세대 수제맥주는 매대 (편의점, 마트) 에 집중했다. 매대는 빠른 성장에 유리한 채널이다. 매대의 한 칸을 차지하면 즉시 수만 명의 잠재 고객에게 도달한다. VC 투자를 받은 회사가 매대 확장에 집중한 것은 합리적인 선택이었다.\n\n그러나 매대는 ‘자리’ 가 아니다. 매대에서 산 캔을 어디서 마시는지는 회사가 통제할 수 없다. 손님이 그 캔을 집에서 혼자 마시면, 그 캔은 외로운 잔이 된다. 외로운 잔은 사회적 의미가 약하다. 매대 의존 모델은 ‘잔의 외로움’ 이 늘어나는 시점에 위기를 맞는다.\n\n자리 (가게) 는 다르다. 손님이 가게의 잔을 마시면, 그 잔은 자리와 결합한다. 자리의 분위기, 같이 온 사람, 그날의 시간이 잔과 함께 기억된다. 자리 의존 모델은 잔의 사회적 의미를 직접 만든다.", "body_html": "<p>‘알코올’ 이 아니라 ‘자리’ 가 본질이라면, 매대보다 의자가 먼저다.</p>\n<p>이 한 줄이 어메이징브루잉이 놓친 것의 정확한 묘사다. 1세대 수제맥주는 매대 (편의점, 마트) 에 집중했다. 매대는 빠른 성장에 유리한 채널이다. 매대의 한 칸을 차지하면 즉시 수만 명의 잠재 고객에게 도달한다. VC 투자를 받은 회사가 매대 확장에 집중한 것은 합리적인 선택이었다.</p>\n<p>그러나 매대는 ‘자리’ 가 아니다. 매대에서 산 캔을 어디서 마시는지는 회사가 통제할 수 없다. 손님이 그 캔을 집에서 혼자 마시면, 그 캔은 외로운 잔이 된다. 외로운 잔은 사회적 의미가 약하다. 매대 의존 모델은 ‘잔의 외로움’ 이 늘어나는 시점에 위기를 맞는다.</p>\n<p>자리 (가게) 는 다르다. 손님이 가게의 잔을 마시면, 그 잔은 자리와 결합한다. 자리의 분위기, 같이 온 사람, 그날의 시간이 잔과 함께 기억된다. 자리 의존 모델은 잔의 사회적 의미를 직접 만든다.</p>", "plain_len": 462}, {"title": "Page 05 · Reading", "type": "essay", "rawIndex": 5, "body_md": "1세대 수제맥주가 놓친 것은 결국 ‘자리’ 였다.\n\n매대에 갇혀서 자리를 만들지 못했다. 양조장 본점은 있었지만, 본점은 한 곳에서만 작동한다. 매대의 캔이 전국에 깔리는 동안, 자리의 경험은 본점 한 곳에 고립되었다. 손님은 어메이징브루잉의 캔을 어디서나 살 수 있었지만, 어메이징브루잉의 자리는 성수에 가야만 경험할 수 있었다.\n\n그 비대칭이 위기의 씨앗이었다. 매대가 줄어들 때 (편의점 매출 -5%) 회사는 흔들렸고, 본점의 자리만으로는 그 흔들림을 받쳐줄 수 없었다.\n\n‘다음 술집’ 의 좌표는 그 반대 방향이다. 매대보다 자리. 광역보다 동네. 캔보다 잔. 1세대가 놓친 것을 의식적으로 잡는 방향. 그 좌표를 다음 탭에서 본다.", "body_html": "<p>1세대 수제맥주가 놓친 것은 결국 ‘자리’ 였다.</p>\n<p>매대에 갇혀서 자리를 만들지 못했다. 양조장 본점은 있었지만, 본점은 한 곳에서만 작동한다. 매대의 캔이 전국에 깔리는 동안, 자리의 경험은 본점 한 곳에 고립되었다. 손님은 어메이징브루잉의 캔을 어디서나 살 수 있었지만, 어메이징브루잉의 자리는 성수에 가야만 경험할 수 있었다.</p>\n<p>그 비대칭이 위기의 씨앗이었다. 매대가 줄어들 때 (편의점 매출 -5%) 회사는 흔들렸고, 본점의 자리만으로는 그 흔들림을 받쳐줄 수 없었다.</p>\n<p>‘다음 술집’ 의 좌표는 그 반대 방향이다. 매대보다 자리. 광역보다 동네. 캔보다 잔. 1세대가 놓친 것을 의식적으로 잡는 방향. 그 좌표를 다음 탭에서 본다.</p>", "plain_len": 355}], "totalPages": 5}, {"num": "04", "key": "Case", "label": "Case", "ko": "사례", "short": "CS", "title": "살아남은 가게의 공통점", "pages": [{"title": "Page 01 · Cover", "type": "cover", "rawIndex": 1, "body_md": "메뉴판이 절반 바뀐 바.\n\n수제맥주 시장이 반토막 나는 동안, 살아남은 가게들이 있다. 그들의 공통점을 한 줄로 적으면 ‘메뉴판이 절반 바뀐 바’ 다. 이 한 줄이 다음 세대의 좌표다.", "body_html": "<p>메뉴판이 절반 바뀐 바.</p>\n<p>수제맥주 시장이 반토막 나는 동안, 살아남은 가게들이 있다. 그들의 공통점을 한 줄로 적으면 ‘메뉴판이 절반 바뀐 바’ 다. 이 한 줄이 다음 세대의 좌표다.</p>", "plain_len": 102}, {"title": "Page 02 · Gate", "type": "essay", "rawIndex": 2, "body_md": "NA 메뉴 비율 30% 이상. 새 가설이다.\n\n살아남은 가게들을 관찰하면 공통점이 보인다. 메뉴판의 절반에 가까운 비중을 무알콜·저알콜 옵션에 할애한다. 일반 맥주, 와인, 칵테일은 여전히 있지만, 같은 비중으로 무알콜 맥주, 무알콜 와인, 목테일, 콤부차, 콜드프레스 주스가 있다.\n\n이 30% 라는 비율은 정확한 기준이 아니다. 직관적 가설이다. 그러나 30% 미만의 가게는 ‘NA 옵션이 있는 일반 술집’ 으로 인지되고, 30% 이상의 가게는 ‘NA 선택의 자유가 있는 자리’ 로 인지된다. 인지의 차이가 손님의 재방문 빈도를 결정한다. 30% 의 임계점은 그 인지를 가르는 자리다.", "body_html": "<p>NA 메뉴 비율 30% 이상. 새 가설이다.</p>\n<p>살아남은 가게들을 관찰하면 공통점이 보인다. 메뉴판의 절반에 가까운 비중을 무알콜·저알콜 옵션에 할애한다. 일반 맥주, 와인, 칵테일은 여전히 있지만, 같은 비중으로 무알콜 맥주, 무알콜 와인, 목테일, 콤부차, 콜드프레스 주스가 있다.</p>\n<p>이 30% 라는 비율은 정확한 기준이 아니다. 직관적 가설이다. 그러나 30% 미만의 가게는 ‘NA 옵션이 있는 일반 술집’ 으로 인지되고, 30% 이상의 가게는 ‘NA 선택의 자유가 있는 자리’ 로 인지된다. 인지의 차이가 손님의 재방문 빈도를 결정한다. 30% 의 임계점은 그 인지를 가르는 자리다.</p>", "plain_len": 327}, {"title": "Page 03 · Case 1", "type": "essay", "rawIndex": 3, "body_md": "강남구청역의 무알콜 와인 바.\n\n라이츠 (Leitz) 의 아인스츠바이 (Eins-Zwei) 제로 같은 무알콜 와인을 메인 메뉴로 둔 곳이다. 일반 와인 바와 같은 분위기 — 낮은 조명, 와인 잔의 무게, 클래식 음악 — 를 유지하면서 와인 자체만 무알콜로 바꾼다.\n\n손님이 받는 경험은 일반 와인 바와 거의 같다. 차이는 잔의 내용물뿐이다. 그러나 그 한 가지 차이가 손님의 자기 결정권을 만든다. 와인 바의 분위기를 즐기되, 잔의 결과 (취기, 다음 날의 컨디션, 칼로리) 는 통제할 수 있다.\n\n이런 곳의 평일 저녁이 의외로 비어 있지 않다. 회식 후 2차로 들르는 사람, 운전해야 하는 사람, 단순히 와인 바의 분위기만 원하는 사람이 모인다. 자기 결정권의 자리가 만들어지면 손님은 온다.", "body_html": "<p>강남구청역의 무알콜 와인 바.</p>\n<p>라이츠 (Leitz) 의 아인스츠바이 (Eins-Zwei) 제로 같은 무알콜 와인을 메인 메뉴로 둔 곳이다. 일반 와인 바와 같은 분위기 — 낮은 조명, 와인 잔의 무게, 클래식 음악 — 를 유지하면서 와인 자체만 무알콜로 바꾼다.</p>\n<p>손님이 받는 경험은 일반 와인 바와 거의 같다. 차이는 잔의 내용물뿐이다. 그러나 그 한 가지 차이가 손님의 자기 결정권을 만든다. 와인 바의 분위기를 즐기되, 잔의 결과 (취기, 다음 날의 컨디션, 칼로리) 는 통제할 수 있다.</p>\n<p>이런 곳의 평일 저녁이 의외로 비어 있지 않다. 회식 후 2차로 들르는 사람, 운전해야 하는 사람, 단순히 와인 바의 분위기만 원하는 사람이 모인다. 자기 결정권의 자리가 만들어지면 손님은 온다.</p>", "plain_len": 385}, {"title": "Page 04 · Case 2", "type": "essay", "rawIndex": 4, "body_md": "안주 중심 재편.\n\n또 다른 살아남은 모델이다. 술을 보조로 두고 음식을 주인공으로 만드는 가게. 일반음식점 면허로 운영되지만 술도 같이 판다. 메뉴판의 첫 페이지가 안주가 아니라 음식이다. 코스 메뉴가 있고, 페어링 추천이 있다.\n\n이 모델은 회식이 줄어드는 시기에 강하다. 회식 자리가 아닌 평일 저녁의 ‘좋은 식사’ 자리를 노린다. 술은 그 식사를 보완하는 옵션이고, 술이 없어도 식사 자체로 충분히 만족스럽다. 손님은 ‘술을 마시러’ 오는 게 아니라 ‘좋은 식사를 하러’ 온다.\n\n매출 구조가 술 의존에서 음식 의존으로 바뀐다. 술 매출이 줄어들어도 음식 매출이 안정되면 가게는 흔들리지 않는다. 1세대 술집들이 흔들린 것은 매출의 70~80% 가 술이었기 때문이다. 다음 세대는 그 비율을 절반 이하로 떨어뜨린다.", "body_html": "<p>안주 중심 재편.</p>\n<p>또 다른 살아남은 모델이다. 술을 보조로 두고 음식을 주인공으로 만드는 가게. 일반음식점 면허로 운영되지만 술도 같이 판다. 메뉴판의 첫 페이지가 안주가 아니라 음식이다. 코스 메뉴가 있고, 페어링 추천이 있다.</p>\n<p>이 모델은 회식이 줄어드는 시기에 강하다. 회식 자리가 아닌 평일 저녁의 ‘좋은 식사’ 자리를 노린다. 술은 그 식사를 보완하는 옵션이고, 술이 없어도 식사 자체로 충분히 만족스럽다. 손님은 ‘술을 마시러’ 오는 게 아니라 ‘좋은 식사를 하러’ 온다.</p>\n<p>매출 구조가 술 의존에서 음식 의존으로 바뀐다. 술 매출이 줄어들어도 음식 매출이 안정되면 가게는 흔들리지 않는다. 1세대 술집들이 흔들린 것은 매출의 70~80% 가 술이었기 때문이다. 다음 세대는 그 비율을 절반 이하로 떨어뜨린다.</p>", "plain_len": 401}, {"title": "Page 05 · Case 3", "type": "essay", "rawIndex": 5, "body_md": "페어링 강조.\n\n세 번째 모델. NA 음료와 코스 요리의 매칭을 의식적으로 큐레이션하는 곳이다. ‘이 음식에는 이 무알콜 와인’, ‘이 디저트에는 이 콤부차’. 와인 페어링과 같은 자리에 NA 페어링이 들어선다.\n\n이 모델의 매력은 ‘선택의 큐레이션’ 이다. 손님이 메뉴판을 직접 분석해서 고를 필요 없이, 가게가 그 매칭을 책임진다. 와인 소믈리에의 자리에 NA 큐레이터가 들어선다. 이 큐레이터의 전문성이 가게의 차별화 포인트가 된다.\n\n서울 일부 파인다이닝에서 NA 페어링 코스가 와인 페어링과 같은 가격대로 제공되고 있다. ‘대체재이므로 더 싸야 한다’ 가 아니라 ‘다른 큐레이션이므로 같은 가격’ 의 포지셔닝이다. 이것이 NA 가 ‘대체재’ 에서 ‘독립 카테고리’ 로 옮겨가는 가격 신호다.", "body_html": "<p>페어링 강조.</p>\n<p>세 번째 모델. NA 음료와 코스 요리의 매칭을 의식적으로 큐레이션하는 곳이다. ‘이 음식에는 이 무알콜 와인’, ‘이 디저트에는 이 콤부차’. 와인 페어링과 같은 자리에 NA 페어링이 들어선다.</p>\n<p>이 모델의 매력은 ‘선택의 큐레이션’ 이다. 손님이 메뉴판을 직접 분석해서 고를 필요 없이, 가게가 그 매칭을 책임진다. 와인 소믈리에의 자리에 NA 큐레이터가 들어선다. 이 큐레이터의 전문성이 가게의 차별화 포인트가 된다.</p>\n<p>서울 일부 파인다이닝에서 NA 페어링 코스가 와인 페어링과 같은 가격대로 제공되고 있다. ‘대체재이므로 더 싸야 한다’ 가 아니라 ‘다른 큐레이션이므로 같은 가격’ 의 포지셔닝이다. 이것이 NA 가 ‘대체재’ 에서 ‘독립 카테고리’ 로 옮겨가는 가격 신호다.</p>", "plain_len": 388}, {"title": "Page 06 · Reading", "type": "essay", "rawIndex": 6, "body_md": "세 모델의 공통점은 한 줄이다. 알코올 마진을 포기하고 자리·시간·경험에 가치를 옮긴 가게가 살아남았다.\n\n알코올 마진은 음식보다 높다. 한 잔 5천 원의 술과 한 접시 5천 원의 음식은 다른 마진 구조다. 술 의존 모델은 이 마진의 크기로 운영된다. 그 마진이 줄어드는 시기에 음식·자리로 가치를 옮기는 것은 매출의 절대량을 유지하기 위한 어려운 선택이다.\n\n그러나 어려운 선택을 빨리 한 가게가 살아남았다. 어메이징브루잉이 매대 의존 모델로 광역 성장을 노리는 동안, 동네의 작은 바들은 자리 의존 모델로 천천히 자기 손님을 만들었다. 큰 회사가 빨리 성장하다 빨리 흔들리는 동안, 작은 가게는 느리게 성장하면서 흔들림에 강한 자리를 만들었다.\n\n이 비대칭이 ‘다음 술집’ 의 좌표다. 큰 회사의 시대가 끝났다는 게 아니라, 큰 회사도 자리의 가치를 모르면 살아남기 어렵다는 사실이다.", "body_html": "<p>세 모델의 공통점은 한 줄이다. 알코올 마진을 포기하고 자리·시간·경험에 가치를 옮긴 가게가 살아남았다.</p>\n<p>알코올 마진은 음식보다 높다. 한 잔 5천 원의 술과 한 접시 5천 원의 음식은 다른 마진 구조다. 술 의존 모델은 이 마진의 크기로 운영된다. 그 마진이 줄어드는 시기에 음식·자리로 가치를 옮기는 것은 매출의 절대량을 유지하기 위한 어려운 선택이다.</p>\n<p>그러나 어려운 선택을 빨리 한 가게가 살아남았다. 어메이징브루잉이 매대 의존 모델로 광역 성장을 노리는 동안, 동네의 작은 바들은 자리 의존 모델로 천천히 자기 손님을 만들었다. 큰 회사가 빨리 성장하다 빨리 흔들리는 동안, 작은 가게는 느리게 성장하면서 흔들림에 강한 자리를 만들었다.</p>\n<p>이 비대칭이 ‘다음 술집’ 의 좌표다. 큰 회사의 시대가 끝났다는 게 아니라, 큰 회사도 자리의 가치를 모르면 살아남기 어렵다는 사실이다.</p>", "plain_len": 438}], "totalPages": 6}, {"num": "05", "key": "Archive", "label": "Archive", "ko": "아카이브", "short": "AR", "title": "다음 술집의 좌표", "pages": [{"title": "Page 01 · Checklist", "type": "archive", "rawIndex": 1, "body_md": "업태 전환 체크리스트.\n\n네 가지 축으로 점검한다.\n\n1. NA 메뉴 비율. 30% 미만이면 ‘NA 옵션이 있는 술집’, 30% 이상이면 ‘NA 선택의 자유가 있는 자리’.\n\n2. 음식 비중. 매출 50% 이상이 음식에서 나오면 술 매출 감소에 강하다.\n\n3. 페어링·큐레이션. 가게가 직접 매칭을 책임지면 ‘대체재’ 가 아닌 ‘독립 카테고리’ 의 가격을 받을 수 있다.\n\n4. 자리 디자인. 잔, 조명, 음악, 시간대의 일관성. 자리의 형식이 알코올 없이도 작동하는가.\n\n이 네 축이 모두 ✅ 인 가게는 다음 시대에도 살아남는다. 1~2개만 ✅ 인 가게는 위기를 받지만 적응 가능하다. 0개인 가게는 1세대 술집의 운명을 따라간다.", "body_html": "<p>업태 전환 체크리스트.</p>\n<p>네 가지 축으로 점검한다.</p>\n<ol><li>NA 메뉴 비율. 30% 미만이면 ‘NA 옵션이 있는 술집’, 30% 이상이면 ‘NA 선택의 자유가 있는 자리’.</li></ol>\n<ol><li>음식 비중. 매출 50% 이상이 음식에서 나오면 술 매출 감소에 강하다.</li></ol>\n<ol><li>페어링·큐레이션. 가게가 직접 매칭을 책임지면 ‘대체재’ 가 아닌 ‘독립 카테고리’ 의 가격을 받을 수 있다.</li></ol>\n<ol><li>자리 디자인. 잔, 조명, 음악, 시간대의 일관성. 자리의 형식이 알코올 없이도 작동하는가.</li></ol>\n<p>이 네 축이 모두 ✅ 인 가게는 다음 시대에도 살아남는다. 1~2개만 ✅ 인 가게는 위기를 받지만 적응 가능하다. 0개인 가게는 1세대 술집의 운명을 따라간다.</p>", "plain_len": 336}, {"title": "Page 02 · Diagram", "type": "diagram", "rawIndex": 2, "body_md": "술집을 4분면으로 그리면 다음과 같다.\n\n```text\n                     자리 위주 (Place-centric)\n                              ↑\n                              │\n        고가 (Premium) ────┼──── 저가 (Budget)\n                              │\n                              ↓\n                     술 위주 (Drink-centric)\n```\n\n1세대 수제맥주가 차지했던 자리는 우하단 (술 위주 · 저가, 매대 모델) 이다. 어메이징브루잉 같은 회사가 시도한 본점은 좌하단 (술 위주 · 고가) 이었다.\n\n다음 시대의 술집이 자리잡는 곳은 좌상단 (자리 위주 · 고가, NA 와인 바 모델) 이거나 우상단 (자리 위주 · 저가, 안주 중심 골목 식당 모델) 이다. 두 좌표 모두 ‘자리 위주’ 라는 공통점을 가진다.", "body_html": "<p>술집을 4분면으로 그리면 다음과 같다.</p>\n<pre>                     자리 위주 (Place-centric)\n                              ↑\n
