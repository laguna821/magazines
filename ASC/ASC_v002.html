                            │\n        고가 (Premium) ────┼──── 저가 (Budget)\n                              │\n                              ↓\n                     술 위주 (Drink-centric)</pre>\n<p>1세대 수제맥주가 차지했던 자리는 우하단 (술 위주 · 저가, 매대 모델) 이다. 어메이징브루잉 같은 회사가 시도한 본점은 좌하단 (술 위주 · 고가) 이었다.</p>\n<p>다음 시대의 술집이 자리잡는 곳은 좌상단 (자리 위주 · 고가, NA 와인 바 모델) 이거나 우상단 (자리 위주 · 저가, 안주 중심 골목 식당 모델) 이다. 두 좌표 모두 ‘자리 위주’ 라는 공통점을 가진다.</p>", "plain_len": 485}, {"title": "Page 03 · Summary", "type": "archive", "rawIndex": 3, "body_md": "목요일을 세 문장으로 접는다.\n\n첫째, 1세대 수제맥주의 도미노. 어메이징브루잉, 세븐브로이, 제주맥주의 timeline 은 다른 회사들이지만 같은 패턴이다. 한국 수제맥주 시장은 2년 만에 반토막 났다.\n\n둘째, 술집의 정의가 재구성되고 있다. ‘술을 파는 곳’ 이 아니라 ‘자리를 파는 곳’ 으로. 매대보다 자리, 캔보다 잔이 본질이다.\n\n셋째, 살아남은 가게들의 공통점은 알코올 마진을 포기하고 자리·시간·경험에 가치를 옮긴 것이다. 4축 체크리스트 — NA 비율 30%+, 음식 비중 50%+, 페어링·큐레이션, 자리 디자인 — 가 다음 세대의 좌표다.", "body_html": "<p>목요일을 세 문장으로 접는다.</p>\n<p>첫째, 1세대 수제맥주의 도미노. 어메이징브루잉, 세븐브로이, 제주맥주의 timeline 은 다른 회사들이지만 같은 패턴이다. 한국 수제맥주 시장은 2년 만에 반토막 났다.</p>\n<p>둘째, 술집의 정의가 재구성되고 있다. ‘술을 파는 곳’ 이 아니라 ‘자리를 파는 곳’ 으로. 매대보다 자리, 캔보다 잔이 본질이다.</p>\n<p>셋째, 살아남은 가게들의 공통점은 알코올 마진을 포기하고 자리·시간·경험에 가치를 옮긴 것이다. 4축 체크리스트 — NA 비율 30%+, 음식 비중 50%+, 페어링·큐레이션, 자리 디자인 — 가 다음 세대의 좌표다.</p>", "plain_len": 310}, {"title": "Page 04 · Bridge", "type": "archive", "rawIndex": 4, "body_md": "다음 날은 해외의 자리로 간다.\n\n한국이 지금 겪는 변화는 새로운 것이 아니다. 일본은 15년 먼저, 미국과 영국은 5~10년 먼저 같은 변화를 겪었다. 그들이 발견한 길과 잘못 든 길을 본다. 결론은 ‘따라가자’ 가 아니다. 세 나라가 서로 다른 길을 갔다는 사실 자체가 메시지다.\n\n금요일은 거울의 날이다.\n\n---", "body_html": "<p>다음 날은 해외의 자리로 간다.</p>\n<p>한국이 지금 겪는 변화는 새로운 것이 아니다. 일본은 15년 먼저, 미국과 영국은 5~10년 먼저 같은 변화를 겪었다. 그들이 발견한 길과 잘못 든 길을 본다. 결론은 ‘따라가자’ 가 아니다. 세 나라가 서로 다른 길을 갔다는 사실 자체가 메시지다.</p>\n<p>금요일은 거울의 날이다.</p>\n<p>---</p>", "plain_len": 175}], "totalPages": 4}]}, {"date": "2026-05-15", "weekday": "금", "weekdayFull": "금요일", "no": "002-05", "titleLine": "일·미·영 NA 시장 — 5년 먼저 도착한 풍경", "theme": "일·미·영 NA 시장 — 5년 먼저 도착한 풍경", "note_html": "<aside class=\"note-card\"><strong>Note</strong><p>금요일의 역할 금요일은 Vol002 의 ‘거울’ 날이다. 한국이 지금 겪는 것을 다른 나라들은 5~15년 먼저 겪었다. 그들의 길은 한국과 같지 않다. 같지 않은 세 길을 옆에 놓는 것이 이번 호의 작업이다.</p></aside>", "sections": [{"num": "01", "key": "Intro", "label": "Intro", "ko": "입구", "short": "IN", "title": "5년 먼저 도착한 거리", "pages": [{"title": "Page 01 · Cover", "type": "cover", "rawIndex": 1, "body_md": "그곳의 평일 저녁.\n\n도쿄, 뉴욕, 런던의 평일 저녁은 한국의 평일 저녁과 어떻게 다른가. 그 차이가 5년 후 한국의 풍경일 수 있다.", "body_html": "<p>그곳의 평일 저녁.</p>\n<p>도쿄, 뉴욕, 런던의 평일 저녁은 한국의 평일 저녁과 어떻게 다른가. 그 차이가 5년 후 한국의 풍경일 수 있다.</p>", "plain_len": 74}, {"title": "Page 02 · Tokyo", "type": "essay", "rawIndex": 2, "body_md": "도쿄의 편의점에 들어가면 무알콜 맥주의 자리가 일반 맥주와 같은 크기로 있다.\n\nAsahi Dry Zero, Kirin Free, Suntory All-Free. 일본 3대 맥주 회사의 무알콜 라인업이 각자 한 칸씩 차지한다. 같은 매대의 같은 단에. 한국에서는 일반 맥주 칸의 1/5 정도 자리에 무알콜이 있다면, 일본은 1/2 가까이가 무알콜이다.\n\n이 자리의 비율은 시간의 결과다. Kirin Free 가 2009년에 출시된 후 15년이 지났다. 15년 동안 무알콜이 천천히 자기 자리를 키워왔다. 한국은 그 15년의 출발점에 가까이 있다.", "body_html": "<p>도쿄의 편의점에 들어가면 무알콜 맥주의 자리가 일반 맥주와 같은 크기로 있다.</p>\n<p>Asahi Dry Zero, Kirin Free, Suntory All-Free. 일본 3대 맥주 회사의 무알콜 라인업이 각자 한 칸씩 차지한다. 같은 매대의 같은 단에. 한국에서는 일반 맥주 칸의 1/5 정도 자리에 무알콜이 있다면, 일본은 1/2 가까이가 무알콜이다.</p>\n<p>이 자리의 비율은 시간의 결과다. Kirin Free 가 2009년에 출시된 후 15년이 지났다. 15년 동안 무알콜이 천천히 자기 자리를 키워왔다. 한국은 그 15년의 출발점에 가까이 있다.</p>", "plain_len": 303}, {"title": "Page 03 · NewYork", "type": "essay", "rawIndex": 3, "body_md": "뉴욕 브루클린의 Athletic Brewing 탭하우스.\n\n이 탭하우스의 평일 저녁은 평범하다. 일반 맥주 탭하우스와 같은 분위기, 같은 손님층, 같은 시간대. 차이는 모든 탭이 무알콜이라는 것뿐이다. 손님들은 자기가 ‘무알콜 탭하우스’ 에 왔다는 것을 의식하지 않는다. 그냥 ‘동네 탭하우스’ 에 왔을 뿐이다.\n\n이 ‘평범함’ 이 Athletic Brewing 의 성공의 핵심이다. NA-only 가 특별한 카테고리가 아니라 평범한 일상이 되었을 때, 비로소 NA 는 대체재에서 독립 카테고리로 옮겨간다. 미국이 그 단계에 먼저 도달했다.", "body_html": "<p>뉴욕 브루클린의 Athletic Brewing 탭하우스.</p>\n<p>이 탭하우스의 평일 저녁은 평범하다. 일반 맥주 탭하우스와 같은 분위기, 같은 손님층, 같은 시간대. 차이는 모든 탭이 무알콜이라는 것뿐이다. 손님들은 자기가 ‘무알콜 탭하우스’ 에 왔다는 것을 의식하지 않는다. 그냥 ‘동네 탭하우스’ 에 왔을 뿐이다.</p>\n<p>이 ‘평범함’ 이 Athletic Brewing 의 성공의 핵심이다. NA-only 가 특별한 카테고리가 아니라 평범한 일상이 되었을 때, 비로소 NA 는 대체재에서 독립 카테고리로 옮겨간다. 미국이 그 단계에 먼저 도달했다.</p>", "plain_len": 300}, {"title": "Page 04 · London", "type": "essay", "rawIndex": 4, "body_md": "런던의 Club Soda. 영국 최초의 NA 전용 바다.\n\n이 바의 특별함은 ‘술을 안 파는 바’ 라는 점이다. 라이센스는 음식점이지만 분위기는 바의 분위기다. 칵테일 메뉴가 있고, 와인 메뉴가 있다. 그러나 모두 무알콜이다. 손님들은 영국의 Dry January 캠페인 (1월 한 달 금주) 의 14년차 베테랑들이거나, 알코올과 거리를 두기로 한 사람들이다.\n\n영국 Dry January 2026 참여자는 17.5 million 명이다 (R-30). 영국 성인의 32%. 거의 3명 중 1명이 1월 한 달 금주에 참여한다. 14년차의 캠페인이 만든 인프라가 Club Soda 같은 가게의 기반이 된다. 캠페인이 가게의 시장을 만들었다.", "body_html": "<p>런던의 Club Soda. 영국 최초의 NA 전용 바다.</p>\n<p>이 바의 특별함은 ‘술을 안 파는 바’ 라는 점이다. 라이센스는 음식점이지만 분위기는 바의 분위기다. 칵테일 메뉴가 있고, 와인 메뉴가 있다. 그러나 모두 무알콜이다. 손님들은 영국의 Dry January 캠페인 (1월 한 달 금주) 의 14년차 베테랑들이거나, 알코올과 거리를 두기로 한 사람들이다.</p>\n<p>영국 Dry January 2026 참여자는 17.5 million 명이다 (R-30). 영국 성인의 32%. 거의 3명 중 1명이 1월 한 달 금주에 참여한다. 14년차의 캠페인이 만든 인프라가 Club Soda 같은 가게의 기반이 된다. 캠페인이 가게의 시장을 만들었다.</p>", "plain_len": 354}], "totalPages": 4}, {"num": "02", "key": "Issue", "label": "Issue", "ko": "쟁점", "short": "IS", "title": "13B 달러 시장의 곡선", "pages": [{"title": "Page 01 · Cover", "type": "cover", "rawIndex": 1, "body_md": "어디가 가장 빠르게 자라나.\n\n글로벌 NA market 의 형상을 본다. 어느 나라가, 어느 카테고리가, 어떤 속도로 자라고 있는가.", "body_html": "<p>어디가 가장 빠르게 자라나.</p>\n<p>글로벌 NA market 의 형상을 본다. 어느 나라가, 어느 카테고리가, 어떤 속도로 자라고 있는가.</p>", "plain_len": 73}, {"title": "Page 02 · Total", "type": "essay", "rawIndex": 2, "body_md": "GMI Insights 의 추정. 글로벌 무알콜 맥주 시장은 2025년 $24 billion 규모로 평가되었다. 2026년부터 2035년까지 CAGR (연평균 성장률) 7.8% 가 예상된다 (R-25).\n\n7.8% 라는 숫자는 일반 식음료 시장의 표준 성장률 (2~3%) 의 3배 가까이다. 매년 7.8% 씩 자라면 9년 후에 시장 규모가 2배가 된다. 2035년에는 $48 billion 규모가 된다는 의미다. 지금의 글로벌 와인 시장의 약 1/8 규모다.\n\n이 절대 규모는 일반 맥주 시장 (글로벌 약 $700B) 의 약 3.4% 다. 작은 비율이지만 성장률이 빠르다.", "body_html": "<p>GMI Insights 의 추정. 글로벌 무알콜 맥주 시장은 2025년 $24 billion 규모로 평가되었다. 2026년부터 2035년까지 CAGR (연평균 성장률) 7.8% 가 예상된다 (R-25).</p>\n<p>7.8% 라는 숫자는 일반 식음료 시장의 표준 성장률 (2~3%) 의 3배 가까이다. 매년 7.8% 씩 자라면 9년 후에 시장 규모가 2배가 된다. 2035년에는 $48 billion 규모가 된다는 의미다. 지금의 글로벌 와인 시장의 약 1/8 규모다.</p>\n<p>이 절대 규모는 일반 맥주 시장 (글로벌 약 $700B) 의 약 3.4% 다. 작은 비율이지만 성장률이 빠르다.</p>", "plain_len": 318}, {"title": "Page 03 · Heineken", "type": "essay", "rawIndex": 3, "body_md": "Heineken 의 자체 추정은 약간 다르다. 0.0 beer 카테고리만 보면 글로벌 시장 규모가 $13.7 billion 이라고 본다. 전체 맥주 시장의 1.7% 다 (R-26).\n\n같은 카테고리에 대해 두 추정 (24B vs 13.7B) 이 다른 이유는 ‘무알콜’ 의 정의 차이다. GMI 는 0.5% 이하까지 포함하고, Heineken 은 0.05% 이하만 본다. 정의가 좁아지면 시장 규모가 작아진다. 어느 추정이 ‘맞다’ 가 아니라, 어느 정의를 쓰느냐의 문제다.\n\nHeineken 은 같은 카테고리가 2030년에 $38.66 billion 규모로 자랄 것으로 본다. 10.2% CAGR 의 추정이다. 이 추정대로면 한국 시장이 글로벌의 1% 만 차지해도 약 $0.4B (약 5,000억 원) 규모가 된다.", "body_html": "<p>Heineken 의 자체 추정은 약간 다르다. 0.0 beer 카테고리만 보면 글로벌 시장 규모가 $13.7 billion 이라고 본다. 전체 맥주 시장의 1.7% 다 (R-26).</p>\n<p>같은 카테고리에 대해 두 추정 (24B vs 13.7B) 이 다른 이유는 ‘무알콜’ 의 정의 차이다. GMI 는 0.5% 이하까지 포함하고, Heineken 은 0.05% 이하만 본다. 정의가 좁아지면 시장 규모가 작아진다. 어느 추정이 ‘맞다’ 가 아니라, 어느 정의를 쓰느냐의 문제다.</p>\n<p>Heineken 은 같은 카테고리가 2030년에 $38.66 billion 규모로 자랄 것으로 본다. 10.2% CAGR 의 추정이다. 이 추정대로면 한국 시장이 글로벌의 1% 만 차지해도 약 $0.4B (약 5,000억 원) 규모가 된다.</p>", "plain_len": 398}, {"title": "Page 04 · IWSR", "type": "essay", "rawIndex": 4, "body_md": "IWSR 의 글로벌 전망. 2025년 무알콜 전체 (맥주, 와인, RTD, 스피릿츠) 가 +9% 성장했다. 2024년부터 2029년까지 36% 의 volume 성장이 예상된다. 2029년에는 18 billion servings 의 무알콜 음료가 전 세계에서 소비된다는 추정이다 (R-21, R-22, R-23).\n\n18 billion servings 라는 숫자를 풀면, 전 세계 인구 80억 명이 1인당 평균 2.25 servings 의 무알콜을 마신다는 뜻이다. 한국 인구로 환산하면 1인당 약 12 servings, 즉 12잔. 1년에 12번 무알콜을 마시는 사회. 지금 한국은 그보다 적다. 5년 후에는 그 정도 까지 자랄 수 있다.", "body_html": "<p>IWSR 의 글로벌 전망. 2025년 무알콜 전체 (맥주, 와인, RTD, 스피릿츠) 가 +9% 성장했다. 2024년부터 2029년까지 36% 의 volume 성장이 예상된다. 2029년에는 18 billion servings 의 무알콜 음료가 전 세계에서 소비된다는 추정이다 (R-21, R-22, R-23).</p>\n<p>18 billion servings 라는 숫자를 풀면, 전 세계 인구 80억 명이 1인당 평균 2.25 servings 의 무알콜을 마신다는 뜻이다. 한국 인구로 환산하면 1인당 약 12 servings, 즉 12잔. 1년에 12번 무알콜을 마시는 사회. 지금 한국은 그보다 적다. 5년 후에는 그 정도 까지 자랄 수 있다.</p>", "plain_len": 356}, {"title": "Page 05 · UK", "type": "essay", "rawIndex": 5, "body_md": "영국 Dry January 2026. 17.5 million 명 참여 (R-30).\n\n이 숫자가 시장에 미치는 영향이 직접적이다. 1월 한 달 동안 17.5M 명이 NA 음료를 평소보다 많이 산다. 매출이 1월에 집중되고, 그 집중이 카테고리 인지도를 끌어올린다. 1월의 NA 매출이 다른 달의 매출도 끌어올리는 후광 효과 (halo effect) 가 있다.\n\n영국의 NA 시장이 빠르게 자란 것은 Dry January 캠페인의 무게가 크다. 14년의 누적이 인프라가 되었다. 한국에는 Dry January 같은 캠페인 인프라가 아직 없다. 정부 보건 의제와 결합한 캠페인이 시장의 가속기가 될 수 있다는 사실은 영국이 보여준다.", "body_html": "<p>영국 Dry January 2026. 17.5 million 명 참여 (R-30).</p>\n<p>이 숫자가 시장에 미치는 영향이 직접적이다. 1월 한 달 동안 17.5M 명이 NA 음료를 평소보다 많이 산다. 매출이 1월에 집중되고, 그 집중이 카테고리 인지도를 끌어올린다. 1월의 NA 매출이 다른 달의 매출도 끌어올리는 후광 효과 (halo effect) 가 있다.</p>\n<p>영국의 NA 시장이 빠르게 자란 것은 Dry January 캠페인의 무게가 크다. 14년의 누적이 인프라가 되었다. 한국에는 Dry January 같은 캠페인 인프라가 아직 없다. 정부 보건 의제와 결합한 캠페인이 시장의 가속기가 될 수 있다는 사실은 영국이 보여준다.</p>", "plain_len": 350}], "totalPages": 5}, {"num": "03", "key": "Insight", "label": "Insight", "ko": "통찰", "short": "IT", "title": "세 나라, 세 가지 길", "pages": [{"title": "Page 01 · Cover", "type": "cover", "rawIndex": 1, "body_md": "한국은 어디에 가까운가.\n\n일본, 미국, 영국이 같은 변화에 도달하는 길이 모두 다르다. 한국은 그 중 어느 길을 따라가고 있나. 따라간다면 어디까지인가.", "body_html": "<p>한국은 어디에 가까운가.</p>\n<p>일본, 미국, 영국이 같은 변화에 도달하는 길이 모두 다르다. 한국은 그 중 어느 길을 따라가고 있나. 따라간다면 어디까지인가.</p>", "plain_len": 85}, {"title": "Page 02 · Japan Path", "type": "essay", "rawIndex": 2, "body_md": "일본의 길은 **기업 주도** 다.\n\nKirin Free 가 2009년에, Suntory All-Free 가 2010년에 출시되었다. 일본 3대 맥주 회사 (Asahi, Kirin, Suntory) 가 무알콜 라인업을 자체 개발하고 자체 매대에 깔았다. 정부는 음주 권고를 통해 보조 역할만 했다. 시장의 주도권은 회사들에게 있었다.\n\n이 길의 장점은 시장의 안정성이다. 큰 회사들이 카테고리를 책임지면 카테고리 자체가 안정된다. 단점은 속도다. 큰 회사들의 의사결정은 느리다. 15년이 걸려서 지금의 자리에 도달했다.\n\n일본에는 NA-only 신규 브랜드가 거의 없다. 미국의 Athletic Brewing 같은 회사가 일본에는 없다. 큰 회사들이 카테고리를 점유하고 있어서 신규 진입의 여지가 적다. 일본은 0.5% 카테고리를 신설하는 등 카테고리 자체를 세분화하면서 천천히 자란다.", "body_html": "<p>일본의 길은 <strong>기업 주도</strong> 다.</p>\n<p>Kirin Free 가 2009년에, Suntory All-Free 가 2010년에 출시되었다. 일본 3대 맥주 회사 (Asahi, Kirin, Suntory) 가 무알콜 라인업을 자체 개발하고 자체 매대에 깔았다. 정부는 음주 권고를 통해 보조 역할만 했다. 시장의 주도권은 회사들에게 있었다.</p>\n<p>이 길의 장점은 시장의 안정성이다. 큰 회사들이 카테고리를 책임지면 카테고리 자체가 안정된다. 단점은 속도다. 큰 회사들의 의사결정은 느리다. 15년이 걸려서 지금의 자리에 도달했다.</p>\n<p>일본에는 NA-only 신규 브랜드가 거의 없다. 미국의 Athletic Brewing 같은 회사가 일본에는 없다. 큰 회사들이 카테고리를 점유하고 있어서 신규 진입의 여지가 적다. 일본은 0.5% 카테고리를 신설하는 등 카테고리 자체를 세분화하면서 천천히 자란다.</p>", "plain_len": 433}, {"title": "Page 03 · US Path", "type": "essay", "rawIndex": 3, "body_md": "미국의 길은 **운동 주도** 다.\n\nAthletic Brewing 같은 NA-only 신규 브랜드가 시장을 견인한다. 큰 회사들 (Anheuser-Busch, Constellation Brands) 도 NA 라인업을 갖고 있지만, 시장의 분위기를 만드는 것은 신규 브랜드들이다. Dry January, Sober October, Sober Curious 같은 캠페인과 결합하면서 ‘운동’ 의 모양을 띤다.\n\n이 길의 장점은 속도와 혁신이다. 신규 브랜드들이 자체 정체성과 자체 마케팅으로 빠르게 시장을 만든다. 단점은 변동성이다. 운동 주도 시장은 운동의 열기에 따라 흔들린다. 캠페인이 약해지면 시장도 약해질 수 있다.", "body_html": "<p>미국의 길은 <strong>운동 주도</strong> 다.</p>\n<p>Athletic Brewing 같은 NA-only 신규 브랜드가 시장을 견인한다. 큰 회사들 (Anheuser-Busch, Constellation Brands) 도 NA 라인업을 갖고 있지만, 시장의 분위기를 만드는 것은 신규 브랜드들이다. Dry January, Sober October, Sober Curious 같은 캠페인과 결합하면서 ‘운동’ 의 모양을 띤다.</p>\n<p>이 길의 장점은 속도와 혁신이다. 신규 브랜드들이 자체 정체성과 자체 마케팅으로 빠르게 시장을 만든다. 단점은 변동성이다. 운동 주도 시장은 운동의 열기에 따라 흔들린다. 캠페인이 약해지면 시장도 약해질 수 있다.</p>", "plain_len": 342}, {"title": "Page 04 · UK Path", "type": "essay", "rawIndex": 4, "body_md": "영국의 길은 **캠페인 주도** 다.\n\nAlcohol Change UK 라는 NGO 가 2013년부터 Dry January 캠페인을 운영해왔다. 14년 누적의 캠페인이 시장의 인프라가 되었다. 정부 보건의제와도 결합되어 있어서 정책의 무게가 캠페인을 지탱한다.\n\n이 길의 장점은 안정성과 사회적 정당성이다. NA 가 단순한 시장 트렌드가 아니라 ‘보건 의제’ 의 일부로 인지된다. 단점은 산업의 약함이다. NA-only 신규 브랜드가 영국에는 미국만큼 많지 않다. 시장은 자라지만 산업의 형태는 약하다.", "body_html": "<p>영국의 길은 <strong>캠페인 주도</strong> 다.</p>\n<p>Alcohol Change UK 라는 NGO 가 2013년부터 Dry January 캠페인을 운영해왔다. 14년 누적의 캠페인이 시장의 인프라가 되었다. 정부 보건의제와도 결합되어 있어서 정책의 무게가 캠페인을 지탱한다.</p>\n<p>이 길의 장점은 안정성과 사회적 정당성이다. NA 가 단순한 시장 트렌드가 아니라 ‘보건 의제’ 의 일부로 인지된다. 단점은 산업의 약함이다. NA-only 신규 브랜드가 영국에는 미국만큼 많지 않다. 시장은 자라지만 산업의 형태는 약하다.</p>", "plain_len": 275}, {"title": "Page 05 · Korea Position", "type": "essay", "rawIndex": 5, "body_md": "한국은 어디에 가까운가.\n\n가장 가까운 것은 일본 모델이다. 오비맥주, 하이트진로, 롯데칠성 — 큰 회사들이 NA 라인업을 만들었다. 시장 주도권이 이 회사들에게 있다. 이 점에서 한국은 일본의 15년 전과 비슷하다.\n\n그러나 한국에는 일본에 없는 요소가 있다. 어메이징브루잉, 세븐브로이 같은 1세대 수제맥주의 도전이 있었다. (실패했지만.) 미국식 신규 브랜드의 시도가 있었다는 점에서, 한국은 일본보다 미국에 가까운 변동성을 가질 수 있다.\n\n캠페인 인프라는 약하다. 한국에는 Dry January 같은 캠페인이 없다. 정부 보건 의제와 NA 산업이 직접 결합되지 않았다. 영국 모델은 아직 한국에 도착하지 않았다.\n\n한국 시장은 ‘일본 모델의 기반 + 미국 모델의 변동성 + 영국 모델의 부재’ 라는 독특한 조합이다. 그 조합이 어떤 길을 만들지는 아직 결정되지 않았다.", "body_html": "<p>한국은 어디에 가까운가.</p>\n<p>가장 가까운 것은 일본 모델이다. 오비맥주, 하이트진로, 롯데칠성 — 큰 회사들이 NA 라인업을 만들었다. 시장 주도권이 이 회사들에게 있다. 이 점에서 한국은 일본의 15년 전과 비슷하다.</p>\n<p>그러나 한국에는 일본에 없는 요소가 있다. 어메이징브루잉, 세븐브로이 같은 1세대 수제맥주의 도전이 있었다. (실패했지만.) 미국식 신규 브랜드의 시도가 있었다는 점에서, 한국은 일본보다 미국에 가까운 변동성을 가질 수 있다.</p>\n<p>캠페인 인프라는 약하다. 한국에는 Dry January 같은 캠페인이 없다. 정부 보건 의제와 NA 산업이 직접 결합되지 않았다. 영국 모델은 아직 한국에 도착하지 않았다.</p>\n<p>한국 시장은 ‘일본 모델의 기반 + 미국 모델의 변동성 + 영국 모델의 부재’ 라는 독특한 조합이다. 그 조합이 어떤 길을 만들지는 아직 결정되지 않았다.</p>", "plain_len": 431}], "totalPages": 5}, {"num": "04", "key": "Case", "label": "Case", "ko": "사례", "short": "CS", "title": "세 곳의 영업 풍경", "pages": [{"title": "Page 01 · Cover", "type": "cover", "rawIndex": 1, "body_md": "자세히 보면 다른 얼굴.\n\n같은 ‘무알콜 맥주’ 카테고리 안에서도, 회사별로 영업 풍경이 다르다. 5개 회사를 차례로 본다.", "body_html": "<p>자세히 보면 다른 얼굴.</p>\n<p>같은 ‘무알콜 맥주’ 카테고리 안에서도, 회사별로 영업 풍경이 다르다. 5개 회사를 차례로 본다.</p>", "plain_len": 68}, {"title": "Page 02 · Asahi", "type": "essay", "rawIndex": 2, "body_md": "**Asahi Dry Zero.** 일본 NA #1.\n\nAsahi 의 일반 맥주 시그니처 ‘Super Dry’ 의 ‘드라이 (dry, 깔끔한 마감)’ 컨셉을 NA 로 가져왔다. 이 ‘브랜드 컨셉의 연속성’ 이 핵심 전략이다. 손님이 일반 Super Dry 의 그 드라이한 마감을 좋아한다면, Dry Zero 도 좋아할 가능성이 높다. 한 사람의 같은 취향을 두 카테고리 (알코올 / 무알콜) 에서 모두 만족시킨다 (R-35).\n\n이 전략의 강점은 진입장벽이다. 다른 회사가 이 자리를 차지하려면 ‘Super Dry 만큼 유명한 일반 맥주’ 를 먼저 만들어야 한다. 한국으로 치면 ‘카스의 카스 0.0’ 와 같은 구조다.", "body_html": "<p><strong>Asahi Dry Zero.</strong> 일본 NA #1.</p>\n<p>Asahi 의 일반 맥주 시그니처 ‘Super Dry’ 의 ‘드라이 (dry, 깔끔한 마감)’ 컨셉을 NA 로 가져왔다. 이 ‘브랜드 컨셉의 연속성’ 이 핵심 전략이다. 손님이 일반 Super Dry 의 그 드라이한 마감을 좋아한다면, Dry Zero 도 좋아할 가능성이 높다. 한 사람의 같은 취향을 두 카테고리 (알코올 / 무알콜) 에서 모두 만족시킨다 (R-35).</p>\n<p>이 전략의 강점은 진입장벽이다. 다른 회사가 이 자리를 차지하려면 ‘Super Dry 만큼 유명한 일반 맥주’ 를 먼저 만들어야 한다. 한국으로 치면 ‘카스의 카스 0.0’ 와 같은 구조다.</p>", "plain_len": 340}, {"title": "Page 03 · Athletic", "type": "essay", "rawIndex": 3, "body_md": "**Athletic Brewing.** US NA craft #1.\n\n미국 NA craft beer 시장에서 52% 점유, 글로벌 NA beer market 의 12.8% 를 차지한다 (R-28, R-29). 다음 100개 NA craft 브랜드를 다 합친 것보다 매출이 크다.\n\n생산 capacity 가 2025년 기준 연 1.2 million barrels. 일반 맥주 회사로 환산하면 중견 craft 양조장 수준이다. 향후 10년 5배 성장을 목표로 하고 있다.\n\nAthletic 의 전략은 ‘NA-only’ 다. 일반 맥주를 만들지 않는다. 무알콜만 만든다. 이 ‘선택과 집중’ 이 카테고리의 정체성을 만든다. 손님은 Athletic 을 마실 때 ‘무알콜을 마신다’ 가 아니라 ‘Athletic 을 마신다’ 라고 인지한다. 브랜드가 카테고리와 동의어가 되었다.", "body_html": "<p><strong>Athletic Brewing.</strong> US NA craft #1.</p>\n<p>미국 NA craft beer 시장에서 52% 점유, 글로벌 NA beer market 의 12.8% 를 차지한다 (R-28, R-29). 다음 100개 NA craft 브랜드를 다 합친 것보다 매출이 크다.</p>\n<p>생산 capacity 가 2025년 기준 연 1.2 million barrels. 일반 맥주 회사로 환산하면 중견 craft 양조장 수준이다. 향후 10년 5배 성장을 목표로 하고 있다.</p>\n<p>Athletic 의 전략은 ‘NA-only’ 다. 일반 맥주를 만들지 않는다. 무알콜만 만든다. 이 ‘선택과 집중’ 이 카테고리의 정체성을 만든다. 손님은 Athletic 을 마실 때 ‘무알콜을 마신다’ 가 아니라 ‘Athletic 을 마신다’ 라고 인지한다. 브랜드가 카테고리와 동의어가 되었다.</p>", "plain_len": 422}, {"title": "Page 04 · Athletic Innovation", "type": "essay", "rawIndex": 4, "body_md": "Athletic 의 2026년 신제품들은 카테고리의 다음 단계를 보여준다.\n\nAthletic Lite Lime & Salt — 무알콜 라이트 맥주의 라인 확장.\nMoscow Mule NA — 무알콜 칵테일.\nPaloma NA — 또 다른 무알콜 칵테일.\n\n이 세 신제품의 공통점은 ‘맥주를 넘어선다’ 는 것이다. NA-only 브랜드가 NA-only 회사로 자라면서, 맥주뿐만 아니라 칵테일까지 영역을 확장한다. 카테고리의 정의가 ‘무알콜 맥주’ 에서 ‘무알콜 알코올 음료 전체’ 로 넓어진다.\n\n한국 시장은 아직 이 단계에 도달하지 못했다. 한국 3사 (오비, 하이트, 롯데칠성) 의 NA 라인업은 모두 맥주 중심이다. 칵테일까지 확장한 한국 NA 브랜드는 아직 없다.\n\n해외 NA 의 다양성을 직접 확인해보고 싶어서 캐나다 브랜드 Sober Carpenter 를 네이버에서 주문해봤다. 첫 인상은 솔직히 “아직 멀었다” 였다. 보리차 탄산수에 가까운 맛이랄까. 맥주도 아니고 보리차도 아닌 애매한 자리. 한국 카스 올제로 보다도 미각 완성도가 떨어졌다. 해외 NA 가 전부 미국 Athletic 수준은 아니라는 사실을 직접 확인한 자리다. 같은 카테고리 안에서도 완성도의 격차가 크다. 한국 무알콜이 ‘맛없다’ 는 인상은 옛 세대 제품 때문일 뿐, 지금의 한국 1세대 무알콜은 이미 일부 해외 브랜드를 앞선다.", "body_html": "<p>Athletic 의 2026년 신제품들은 카테고리의 다음 단계를 보여준다.</p>\n<p>Athletic Lite Lime &amp; Salt — 무알콜 라이트 맥주의 라인 확장. Moscow Mule NA — 무알콜 칵테일. Paloma NA — 또 다른 무알콜 칵테일.</p>\n<p>이 세 신제품의 공통점은 ‘맥주를 넘어선다’ 는 것이다. NA-only 브랜드가 NA-only 회사로 자라면서, 맥주뿐만 아니라 칵테일까지 영역을 확장한다. 카테고리의 정의가 ‘무알콜 맥주’ 에서 ‘무알콜 알코올 음료 전체’ 로 넓어진다.</p>\n<p>한국 시장은 아직 이 단계에 도달하지 못했다. 한국 3사 (오비, 하이트, 롯데칠성) 의 NA 라인업은 모두 맥주 중심이다. 칵테일까지 확장한 한국 NA 브랜드는 아직 없다.</p>\n<p>해외 NA 의 다양성을 직접 확인해보고 싶어서 캐나다 브랜드 Sober Carpenter 를 네이버에서 주문해봤다. 첫 인상은 솔직히 “아직 멀었다” 였다. 보리차 탄산수에 가까운 맛이랄까. 맥주도 아니고 보리차도 아닌 애매한 자리. 한국 카스 올제로 보다도 미각 완성도가 떨어졌다. 해외 NA 가 전부 미국 Athletic 수준은 아니라는 사실을 직접 확인한 자리다. 같은 카테고리 안에서도 완성도의 격차가 크다. 한국 무알콜이 ‘맛없다’ 는 인상은 옛 세대 제품 때문일 뿐, 지금의 한국 1세대 무알콜은 이미 일부 해외 브랜드를 앞선다.</p>", "plain_len": 675}, {"title": "Page 05 · ClubSoda", "type": "essay", "rawIndex": 5, "body_md": "**Club Soda London.** 영국 NA 전용 바.\n\n이 바의 가치 제안은 음료가 아니라 ‘경험’ 이다. ‘술을 안 마시는 자기 자신을 위한 자리’ 를 판다. 마케팅 메시지가 ‘건강’ 이나 ‘기능’ 이 아니라 ‘정체성’ 과 ‘자기효능감’ 에 맞춰져 있다.\n\n손님은 Club Soda 에 가는 행위 자체가 자기 정체성의 한 줄을 표현하는 것이다. ‘나는 술을 안 마시는 자리에서도 즐길 수 있는 사람’ 이라는 한 줄. 이 정체성 마케팅이 영국 NA 시장의 차별점이다.\n\n한국에는 아직 이런 정체성 마케팅이 본격화되지 않았다. NA 가 ‘건강’ 이나 ‘맛’ 의 차원에서 마케팅되지만, ‘정체성’ 의 차원에서는 아직 약하다.", "body_html": "<p><strong>Club Soda London.</strong> 영국 NA 전용 바.</p>\n<p>이 바의 가치 제안은 음료가 아니라 ‘경험’ 이다. ‘술을 안 마시는 자기 자신을 위한 자리’ 를 판다. 마케팅 메시지가 ‘건강’ 이나 ‘기능’ 이 아니라 ‘정체성’ 과 ‘자기효능감’ 에 맞춰져 있다.</p>\n<p>손님은 Club Soda 에 가는 행위 자체가 자기 정체성의 한 줄을 표현하는 것이다. ‘나는 술을 안 마시는 자리에서도 즐길 수 있는 사람’ 이라는 한 줄. 이 정체성 마케팅이 영국 NA 시장의 차별점이다.</p>\n<p>한국에는 아직 이런 정체성 마케팅이 본격화되지 않았다. NA 가 ‘건강’ 이나 ‘맛’ 의 차원에서 마케팅되지만, ‘정체성’ 의 차원에서는 아직 약하다.</p>", "plain_len": 344}, {"title": "Page 06 · Heineken", "type": "essay", "rawIndex": 6, "body_md": "**Heineken 0.0.** 글로벌 #1 NA brand.\n\n117개국에서 판매된다. 글로벌 0.0 카테고리의 18% 를 점유한다. 2024년 매출 +10%. 2018년 이후 카테고리 성장의 40% 이상을 Heineken 0.0 이 차지했다 (R-26, R-36).\n\nHeineken 0.0 의 강점은 글로벌 유통망이다. Heineken 의 117개국 유통 인프라가 그대로 0.0 의 유통 인프라가 된다. 신규 NA-only 브랜드는 이 인프라를 만드는 데 수십 년이 걸리지만, Heineken 은 기존 인프라에 0.0 라인 하나를 추가했을 뿐이다.\n\n이 ‘인프라 효과’ 가 일본 모델 (기업 주도) 의 강점과 같다. 한국 3사도 같은 효과를 누리고 있다. 카스 0.0 의 매대 진입은 카스의 매대 인프라 위에서 일어난다.", "body_html": "<p><strong>Heineken 0.0.</strong> 글로벌 #1 NA brand.</p>\n<p>117개국에서 판매된다. 글로벌 0.0 카테고리의 18% 를 점유한다. 2024년 매출 +10%. 2018년 이후 카테고리 성장의 40% 이상을 Heineken 0.0 이 차지했다 (R-26, R-36).</p>\n<p>Heineken 0.0 의 강점은 글로벌 유통망이다. Heineken 의 117개국 유통 인프라가 그대로 0.0 의 유통 인프라가 된다. 신규 NA-only 브랜드는 이 인프라를 만드는 데 수십 년이 걸리지만, Heineken 은 기존 인프라에 0.0 라인 하나를 추가했을 뿐이다.</p>\n<p>이 ‘인프라 효과’ 가 일본 모델 (기업 주도) 의 강점과 같다. 한국 3사도 같은 효과를 누리고 있다. 카스 0.0 의 매대 진입은 카스의 매대 인프라 위에서 일어난다.</p>", "plain_len": 399}], "totalPages": 6}, {"num": "05", "key": "Archive", "label": "Archive", "ko": "아카이브", "short": "AR", "title": "가져올 것·두고 올 것", "pages": [{"title": "Page 01 · Cover", "type": "cover", "rawIndex": 1, "body_md": "해외에서 빌릴 수 있는 5가지.\n\n세 나라의 길에서 한국이 빌릴 수 있는 것과 빌리면 안 되는 것을 분리한다. 단순 모방이 아니라 선택적 차용이 이번 호의 마지막 작업이다.", "body_html": "<p>해외에서 빌릴 수 있는 5가지.</p>\n<p>세 나라의 길에서 한국이 빌릴 수 있는 것과 빌리면 안 되는 것을 분리한다. 단순 모방이 아니라 선택적 차용이 이번 호의 마지막 작업이다.</p>", "plain_len": 95}, {"title": "Page 02 · Bring 1-2", "type": "archive", "rawIndex": 2, "body_md": "빌릴 만한 첫 두 가지.\n\n① **정부의 음주 권고.** 영국·일본 모두 정부가 음주를 줄이라는 권고를 명시적으로 한다. 한국 보건복지부도 비슷한 권고를 하지만, 산업 정책 (NA 산업 진흥) 과 결합되어 있지 않다. 권고와 산업이 결합하면 카테고리 성장의 가속기가 된다.\n\n② **NA 의 자기효능감 마케팅.** 영국 Club Soda 같은 곳의 정체성 마케팅. 한국 NA 마케팅은 아직 ‘기능 (취하지 않는다)’ 이나 ‘건강 (저칼로리)’ 에 머물러 있다. ‘자기 결정권’ 이나 ‘의식적 선택’ 같은 정체성 메시지가 약하다. 빌려와도 좋은 자리다.", "body_html": "<p>빌릴 만한 첫 두 가지.</p>\n<p>① <strong>정부의 음주 권고.</strong> 영국·일본 모두 정부가 음주를 줄이라는 권고를 명시적으로 한다. 한국 보건복지부도 비슷한 권고를 하지만, 산업 정책 (NA 산업 진흥) 과 결합되어 있지 않다. 권고와 산업이 결합하면 카테고리 성장의 가속기가 된다.</p>\n<p>② <strong>NA 의 자기효능감 마케팅.</strong> 영국 Club Soda 같은 곳의 정체성 마케팅. 한국 NA 마케팅은 아직 ‘기능 (취하지 않는다)’ 이나 ‘건강 (저칼로리)’ 에 머물러 있다. ‘자기 결정권’ 이나 ‘의식적 선택’ 같은 정체성 메시지가 약하다. 빌려와도 좋은 자리다.</p>", "plain_len": 298}, {"title": "Page 03 · Bring 3-5", "type": "archive", "rawIndex": 3, "body_md": "빌릴 만한 나머지 세 가지.\n\n③ **0.5% 카테고리 신설.** 일본은 0.00% 와 0.5% 를 분리해서 표기한다. 한국은 0.00% (무알콜) 와 1% 미만 (비알콜) 만 있다. 0.5% 같은 중간 카테고리가 있으면 소비자 선택이 세분화되고, 시장 자체가 자란다.\n\n④ **캠페인 인프라.** 영국 Dry January 같은 캠페인. 한국에 NGO 주도 캠페인이 없는 것은 아니지만, 14년의 누적이 없다. 캠페인의 누적이 인프라가 되기까지는 시간이 필요하다. 지금 시작하면 10년 후에 인프라가 된다.\n\n⑤ **NA-only 신규 브랜드.** 미국 Athletic Brewing 같은 회사. 한국 1세대 수제맥주의 실패가 ‘신규 브랜드는 안 된다’ 의 결론은 아니다. ‘잘못된 모델 (매대 의존, 빠른 확장) 의 신규 브랜드는 안 된다’ 의 결론이다. NA-only 의 새 모델은 아직 한국에 없다. 누군가는 시도할 가치가 있다.", "body_html": "<p>빌릴 만한 나머지 세 가지.</p>\n<p>③ <strong>0.5% 카테고리 신설.</strong> 일본은 0.00% 와 0.5% 를 분리해서 표기한다. 한국은 0.00% (무알콜) 와 1% 미만 (비알콜) 만 있다. 0.5% 같은 중간 카테고리가 있으면 소비자 선택이 세분화되고, 시장 자체가 자란다.</p>\n<p>④ <strong>캠페인 인프라.</strong> 영국 Dry January 같은 캠페인. 한국에 NGO 주도 캠페인이 없는 것은 아니지만, 14년의 누적이 없다. 캠페인의 누적이 인프라가 되기까지는 시간이 필요하다. 지금 시작하면 10년 후에 인프라가 된다.</p>\n<p>⑤ <strong>NA-only 신규 브랜드.</strong> 미국 Athletic Brewing 같은 회사. 한국 1세대 수제맥주의 실패가 ‘신규 브랜드는 안 된다’ 의 결론은 아니다. ‘잘못된 모델 (매대 의존, 빠른 확장) 의 신규 브랜드는 안 된다’ 의 결론이다. NA-only 의 새 모델은 아직 한국에 없다. 누군가는 시도할 가치가 있다.</p>", "plain_len": 453}, {"title": "Page 04 · Leave Behind", "type": "archive", "rawIndex": 4, "body_md": "두고 와야 할 것.\n\n가장 중요한 한 가지는 **단순 흉내** 다.\n\n한국 1세대 수제맥주는 미국 craft beer 의 단순 흉내였다. 미국 시장의 성공 사례를 그대로 가져왔지만, 한국 시장의 맥락 (회식 문화, 매대 의존, 빠른 성장 압박) 에 맞지 않았다. 흉내의 속도가 한국 시장의 흡수 속도를 앞질렀다. 결과적으로 시장이 만들어지기 전에 회사들이 무너졌다.\n\n이번 NA 변화에서 같은 실수를 반복하면 안 된다. Athletic Brewing 의 NA-only 모델, Club Soda 의 정체성 마케팅, Heineken 0.0 의 인프라 효과 — 모두 매력적이지만 그대로 베끼면 위험하다. 한국 시장의 맥락 (5요소 중 GABA 만 빼고 나머지 4요소를 지키려는 한국적 음주 자리의 의미) 에 맞춰서 변형해야 한다.\n\n‘5년 먼저 도착한 길’ 을 본 한국의 의무는 그 길을 그대로 가는 게 아니라, 그 길에서 한국의 자기 길을 만드는 것이다.", "body_html": "<p>두고 와야 할 것.</p>\n<p>가장 중요한 한 가지는 <strong>단순 흉내</strong> 다.</p>\n<p>한국 1세대 수제맥주는 미국 craft beer 의 단순 흉내였다. 미국 시장의 성공 사례를 그대로 가져왔지만, 한국 시장의 맥락 (회식 문화, 매대 의존, 빠른 성장 압박) 에 맞지 않았다. 흉내의 속도가 한국 시장의 흡수 속도를 앞질렀다. 결과적으로 시장이 만들어지기 전에 회사들이 무너졌다.</p>\n<p>이번 NA 변화에서 같은 실수를 반복하면 안 된다. Athletic Brewing 의 NA-only 모델, Club Soda 의 정체성 마케팅, Heineken 0.0 의 인프라 효과 — 모두 매력적이지만 그대로 베끼면 위험하다. 한국 시장의 맥락 (5요소 중 GABA 만 빼고 나머지 4요소를 지키려는 한국적 음주 자리의 의미) 에 맞춰서 변형해야 한다.</p>\n<p>‘5년 먼저 도착한 길’ 을 본 한국의 의무는 그 길을 그대로 가는 게 아니라, 그 길에서 한국의 자기 길을 만드는 것이다.</p>", "plain_len": 468}, {"title": "Page 05 · Bridge", "type": "archive", "rawIndex": 5, "body_md": "다음 날은 논쟁의 자리로 간다.\n\n지금까지 본 모든 변화 — 시장의 자람, 기술의 진화, 문화의 옮김, 업태의 재편, 해외의 거울 — 에 반대편 증거를 함께 놓는다. 진짜 대체인가, 일시적 유행인가. 이 질문에 정직하게 답하는 자리가 토요일이다.\n\n---", "body_html": "<p>다음 날은 논쟁의 자리로 간다.</p>\n<p>지금까지 본 모든 변화 — 시장의 자람, 기술의 진화, 문화의 옮김, 업태의 재편, 해외의 거울 — 에 반대편 증거를 함께 놓는다. 진짜 대체인가, 일시적 유행인가. 이 질문에 정직하게 답하는 자리가 토요일이다.</p>\n<p>---</p>", "plain_len": 140}], "totalPages": 5}]}, {"date": "2026-05-16", "weekday": "토", "weekdayFull": "토요일", "no": "002-06", "titleLine": "진짜 대체인가, 일시적 유행인가", "theme": "진짜 대체인가, 일시적 유행인가", "note_html": "<aside class=\"note-card\"><strong>Note</strong><p>토요일의 역할 토요일은 결론을 미루는 날이다. 일주일 동안 본 모든 것에 반대편 증거를 같이 놓는다. Vol001 영월에서도 비슷한 자리가 있었다 — “위기” 와 “기회” 사이에서 결론을 보류한 자리. Vol002 도 같은 원칙이다.</p></aside>", "sections": [{"num": "01", "key": "Intro", "label": "Intro", "ko": "입구", "short": "IN", "title": "유행이라는 의심", "pages": [{"title": "Page 01 · Cover", "type": "cover", "rawIndex": 1, "body_md": "그 의심이 향하는 곳.\n\n“그래봤자 한 해 유행이지.” 일주일 동안 모은 자료를 친구에게 보여줬을 때 들은 한 줄이다. 그 의심을 진지하게 받아 안기 위해, 반대편 증거를 모은다.", "body_html": "<p>그 의심이 향하는 곳.</p>\n<p>“그래봤자 한 해 유행이지.” 일주일 동안 모은 자료를 친구에게 보여줬을 때 들은 한 줄이다. 그 의심을 진지하게 받아 안기 위해, 반대편 증거를 모은다.</p>", "plain_len": 99}, {"title": "Page 02 · Scene", "type": "essay", "rawIndex": 2, "body_md": "며칠 전 아내와 같이 집에서 카스 올제로 두 캔을 마시면서 이번 호의 가설들을 이야기했다.\n\n아내는 자료를 한참 듣더니 한마디 했다. “근데 이거 진짜야? 무알콜이 진짜로 시장의 주류가 될 만큼 자랄까? 그래봤자 한 시기 유행 아닐까?”\n\n이 한마디가 흥미로웠다. 나도 같은 의심을 한 번 거쳤기 때문이다. 카스 0.0 한 캔에서 시작된 변화가 정말 시장의 곡선까지 이어질까. 한 사람의 한 모금이 한 사회의 한 자리바꿈으로 어떻게 자랐을까. 매대 한 칸의 변화가 정말 카테고리 이름까지 흔들까. 그 의심을 진지하게 받아 안으려면, 내가 모은 ‘성장의 증거’ 와 같은 자리에 ‘유행의 의심’ 의 증거를 놓아야 한다.\n\n이 한마디 이후 오늘은 반대편 데이터를 모은다.", "body_html": "<p>며칠 전 아내와 같이 집에서 카스 올제로 두 캔을 마시면서 이번 호의 가설들을 이야기했다.</p>\n<p>아내는 자료를 한참 듣더니 한마디 했다. “근데 이거 진짜야? 무알콜이 진짜로 시장의 주류가 될 만큼 자랄까? 그래봤자 한 시기 유행 아닐까?”</p>\n<p>이 한마디가 흥미로웠다. 나도 같은 의심을 한 번 거쳤기 때문이다. 카스 0.0 한 캔에서 시작된 변화가 정말 시장의 곡선까지 이어질까. 한 사람의 한 모금이 한 사회의 한 자리바꿈으로 어떻게 자랐을까. 매대 한 칸의 변화가 정말 카테고리 이름까지 흔들까. 그 의심을 진지하게 받아 안으려면, 내가 모은 ‘성장의 증거’ 와 같은 자리에 ‘유행의 의심’ 의 증거를 놓아야 한다.</p>\n<p>이 한마디 이후 오늘은 반대편 데이터를 모은다.</p>", "plain_len": 369}, {"title": "Page 03 · Why", "type": "essay", "rawIndex": 3, "body_md": "그 의심이 향하는 곳을 세 개로 나눠 본다.\n\n첫째, 과거 트렌드의 거짓 성장. 한국에는 ‘반짝 트렌드’ 의 역사가 길다. 수제맥주가 그랬다 (2018년 1,520억 → 2023년 752억). 하이볼이 그랬을 수도 있다. NA 도 같은 운명일 수 있다.\n\n둘째, 절주 후 회귀율. 영국 Dry January 참여자 중 46% 가 1년 내 음주로 회귀했다는 데이터가 있다 (R-31). 절주는 일시적 행동일 수 있다.\n\n셋째, 카테고리 자체 한계. 무알콜 시장 절대 규모가 1조 원 미만이다. 일반 맥주 시장 (수십조 원) 의 1/100 도 안 된다. 작은 카테고리의 빠른 성장률은 큰 카테고리의 작은 변동에 묻힐 수 있다.\n\n이 세 의심을 차례로 본다.", "body_html": "<p>그 의심이 향하는 곳을 세 개로 나눠 본다.</p>\n<p>첫째, 과거 트렌드의 거짓 성장. 한국에는 ‘반짝 트렌드’ 의 역사가 길다. 수제맥주가 그랬다 (2018년 1,520억 → 2023년 752억). 하이볼이 그랬을 수도 있다. NA 도 같은 운명일 수 있다.</p>\n<p>둘째, 절주 후 회귀율. 영국 Dry January 참여자 중 46% 가 1년 내 음주로 회귀했다는 데이터가 있다 (R-31). 절주는 일시적 행동일 수 있다.</p>\n<p>셋째, 카테고리 자체 한계. 무알콜 시장 절대 규모가 1조 원 미만이다. 일반 맥주 시장 (수십조 원) 의 1/100 도 안 된다. 작은 카테고리의 빠른 성장률은 큰 카테고리의 작은 변동에 묻힐 수 있다.</p>\n<p>이 세 의심을 차례로 본다.</p>", "plain_len": 361}, {"title": "Page 04 · Bridge", "type": "essay", "rawIndex": 4, "body_md": "의심을 진지하게 받아 안기 위해서는, 반대편 데이터를 솔직하게 봐야 한다. 반대편 데이터를 무시하면 결론은 한쪽으로 기운다. 두 데이터를 같이 놓을 때 비로소 ‘대체인가 보완인가’ 의 진짜 질문이 나온다.\n\n다음 탭에서 반대편 데이터를 본다.", "body_html": "<p>의심을 진지하게 받아 안기 위해서는, 반대편 데이터를 솔직하게 봐야 한다. 반대편 데이터를 무시하면 결론은 한쪽으로 기운다. 두 데이터를 같이 놓을 때 비로소 ‘대체인가 보완인가’ 의 진짜 질문이 나온다.</p>\n<p>다음 탭에서 반대편 데이터를 본다.</p>", "plain_len": 134}], "totalPages": 4}, {"num": "02", "key": "Issue", "label": "Issue", "ko": "쟁점", "short": "IS", "title": "다시 늘어난 잔들", "pages": [{"title": "Page 01 · Cover", "type": "cover", "rawIndex": 1, "body_md": "반대 신호도 같이 본다.\n\n줄지 않은 잔들이 있다. 늘어난 잔들도 있다. 이 잔들이 ‘성장의 곡선’ 옆에 같이 놓여야 한다.", "body_html": "<p>반대 신호도 같이 본다.</p>\n<p>줄지 않은 잔들이 있다. 늘어난 잔들도 있다. 이 잔들이 ‘성장의 곡선’ 옆에 같이 놓여야 한다.</p>", "plain_len": 68}, {"title": "Page 02 · Paradox", "type": "essay", "rawIndex": 2, "body_md": "수요일에 한 번 봤던 데이터를 다시 본다.\n\nKDCA 국민건강영양조사 2023. 20대 여성 월간폭음률 43.0%. 다른 연령대 중 가장 높았다 (R-03). 이 한 줄이 ‘술이 줄어든다’ 의 가설과 모순된다.\n\n20대 여성 한 세그먼트에서 폭음이 늘었다는 사실은, 전체 절주 트렌드 안에서도 폭음 자리가 강하게 남아있다는 뜻이다. 절주와 폭음이 같은 세대 안에서 양극화로 공존한다. ‘평균’ 의 그래프는 두 극단을 다 가린다.\n\n이 양극화가 만약 지속되면, 전체 시장은 ‘NA 마시는 사람’ 과 ‘폭음 마시는 사람’ 으로 나뉘게 된다. 가운데의 ‘적당히 마시는 사람’ 의 자리가 줄어든다. 양극화 시장은 산업 전략에도 다른 영향을 미친다.", "body_html": "<p>수요일에 한 번 봤던 데이터를 다시 본다.</p>\n<p>KDCA 국민건강영양조사 2023. 20대 여성 월간폭음률 43.0%. 다른 연령대 중 가장 높았다 (R-03). 이 한 줄이 ‘술이 줄어든다’ 의 가설과 모순된다.</p>\n<p>20대 여성 한 세그먼트에서 폭음이 늘었다는 사실은, 전체 절주 트렌드 안에서도 폭음 자리가 강하게 남아있다는 뜻이다. 절주와 폭음이 같은 세대 안에서 양극화로 공존한다. ‘평균’ 의 그래프는 두 극단을 다 가린다.</p>\n<p>이 양극화가 만약 지속되면, 전체 시장은 ‘NA 마시는 사람’ 과 ‘폭음 마시는 사람’ 으로 나뉘게 된다. 가운데의 ‘적당히 마시는 사람’ 의 자리가 줄어든다. 양극화 시장은 산업 전략에도 다른 영향을 미친다.</p>", "plain_len": 355}, {"title": "Page 03 · Whisky Wine", "type": "essay", "rawIndex": 3, "body_md": "다른 반대 신호 — 위스키와 와인의 흐름.\n\n한국 위스키 시장은 ‘프리미엄화’ 의 길을 가고 있다. 매출 절대량은 감소했지만 평균 단가는 올랐다. 한 사람이 마시는 횟수는 줄었지만, 마실 때는 더 비싼 잔을 마신다. 이 패턴은 ‘술이 줄어든다’ 가 아니라 ‘술의 가치 단가가 올라간다’ 의 신호다.\n\n와인은 2020-2021 코로나 시기의 폭증 이후 조정기를 거쳐서 회복 단계에 있다. 일반 맥주만큼 위축되지 않았다. 와인의 회복은 ‘술 자체가 줄어든다’ 의 가설과는 결이 다르다.\n\n이 두 카테고리의 신호는, 한국에서 일어나는 변화가 단순한 ‘술이 줄어드는 변화’ 가 아니라는 사실을 보여준다. ‘마시는 술의 종류가 바뀐다’ 의 변화가 더 정확할 수 있다. 일반 맥주 → 위스키, 일반 맥주 → 와인, 일반 맥주 → 무알콜. 여러 방향으로의 이동이 동시에 일어난다.", "body_html": "<p>다른 반대 신호 — 위스키와 와인의 흐름.</p>\n<p>한국 위스키 시장은 ‘프리미엄화’ 의 길을 가고 있다. 매출 절대량은 감소했지만 평균 단가는 올랐다. 한 사람이 마시는 횟수는 줄었지만, 마실 때는 더 비싼 잔을 마신다. 이 패턴은 ‘술이 줄어든다’ 가 아니라 ‘술의 가치 단가가 올라간다’ 의 신호다.</p>\n<p>와인은 2020-2021 코로나 시기의 폭증 이후 조정기를 거쳐서 회복 단계에 있다. 일반 맥주만큼 위축되지 않았다. 와인의 회복은 ‘술 자체가 줄어든다’ 의 가설과는 결이 다르다.</p>\n<p>이 두 카테고리의 신호는, 한국에서 일어나는 변화가 단순한 ‘술이 줄어드는 변화’ 가 아니라는 사실을 보여준다. ‘마시는 술의 종류가 바뀐다’ 의 변화가 더 정확할 수 있다. 일반 맥주 → 위스키, 일반 맥주 → 와인, 일반 맥주 → 무알콜. 여러 방향으로의 이동이 동시에 일어난다.</p>", "plain_len": 426}, {"title": "Page 04 · UK Return", "type": "essay", "rawIndex": 4, "body_md": "세 번째 반대 신호 — 영국 Dry January 회귀율.\n\nNumerator 의 조사에 따르면, Dry January 2026 참여자 중 46% 가 1년 내 음주로 회귀했다 (R-31). 절반에 가까운 사람들이 캠페인이 끝나면 다시 술을 마신다.\n\n이 회귀율은 NA 시장 자체의 한계를 보여준다. NA 가 절주의 일시적 도구로 사용되고, 그 도구의 사용이 끝나면 알코올로 돌아간다는 패턴. 한국에서도 같은 패턴이 일어날 가능성을 무시할 수 없다.\n\n그러나 같은 데이터는 다른 방향에서도 읽을 수 있다. 46% 가 회귀했다는 것은 54% 가 음주를 유지 또는 감소했다는 뜻이다. 절반 이상이 캠페인의 효과를 1년 이상 유지한다. 이 절반 이상의 누적이 매년 쌓이면 14년 후의 영국 음주 풍경이 만들어진다.\n\n같은 데이터의 두 해석이 토요일의 핵심이다.", "body_html": "<p>세 번째 반대 신호 — 영국 Dry January 회귀율.</p>\n<p>Numerator 의 조사에 따르면, Dry January 2026 참여자 중 46% 가 1년 내 음주로 회귀했다 (R-31). 절반에 가까운 사람들이 캠페인이 끝나면 다시 술을 마신다.</p>\n<p>이 회귀율은 NA 시장 자체의 한계를 보여준다. NA 가 절주의 일시적 도구로 사용되고, 그 도구의 사용이 끝나면 알코올로 돌아간다는 패턴. 한국에서도 같은 패턴이 일어날 가능성을 무시할 수 없다.</p>\n<p>그러나 같은 데이터는 다른 방향에서도 읽을 수 있다. 46% 가 회귀했다는 것은 54% 가 음주를 유지 또는 감소했다는 뜻이다. 절반 이상이 캠페인의 효과를 1년 이상 유지한다. 이 절반 이상의 누적이 매년 쌓이면 14년 후의 영국 음주 풍경이 만들어진다.</p>\n<p>같은 데이터의 두 해석이 토요일의 핵심이다.</p>", "plain_len": 417}], "totalPages": 4}, {"num": "03", "key": "Insight", "label": "Insight", "ko": "통찰", "short": "IT", "title": "두 가설을 나란히 둔다", "pages": [{"title": "Page 01 · Cover", "type": "cover", "rawIndex": 1, "body_md": "결론을 보류하는 자리.\n\n두 가설을 같은 자리에 놓는다. 한쪽을 택하지 않는다. 택하지 않는 자리가 이번 호의 가장 중요한 윤리다.", "body_html": "<p>결론을 보류하는 자리.</p>\n<p>두 가설을 같은 자리에 놓는다. 한쪽을 택하지 않는다. 택하지 않는 자리가 이번 호의 가장 중요한 윤리다.</p>", "plain_len": 72}, {"title": "Page 02 · Hypothesis A", "type": "essay", "rawIndex": 2, "body_md": "가설 A. **대체 (Substitution)** 가설.\n\nNA 가 알코올 시장을 영구적으로 잠식하고 있다. 한국 시장의 무알콜 성장 (3년간 +70%) 과 출고량 감소 (2년 연속 -) 가 같이 일어나는 것은 우연이 아니다. 일본의 15년 경로 — 무알콜이 일반 맥주 매대의 절반까지 자라는 길 — 가 한국에서도 반복될 가능성이 높다.\n\n이 가설의 강점은 구조적 변화의 일관성이다. 음주 인구의 감소 (인구구조 변화), 헬시 플레저 트렌드 (소비자 가치관 변화), NA 양조 기술의 진화 (공급 측 변화) — 세 변화가 같은 방향을 가리킨다. 우연으로 보기에는 신호가 너무 일관적이다.", "body_html": "<p>가설 A. <strong>대체 (Substitution)</strong> 가설.</p>\n<p>NA 가 알코올 시장을 영구적으로 잠식하고 있다. 한국 시장의 무알콜 성장 (3년간 +70%) 과 출고량 감소 (2년 연속 -) 가 같이 일어나는 것은 우연이 아니다. 일본의 15년 경로 — 무알콜이 일반 맥주 매대의 절반까지 자라는 길 — 가 한국에서도 반복될 가능성이 높다.</p>\n<p>이 가설의 강점은 구조적 변화의 일관성이다. 음주 인구의 감소 (인구구조 변화), 헬시 플레저 트렌드 (소비자 가치관 변화), NA 양조 기술의 진화 (공급 측 변화) — 세 변화가 같은 방향을 가리킨다. 우연으로 보기에는 신호가 너무 일관적이다.</p>", "plain_len": 322}, {"title": "Page 03 · Hypothesis B", "type": "essay", "rawIndex": 3, "body_md": "가설 B. **보완 (Complement)** 가설.\n\nNA 는 알코올과 공존하는 추가 옵션이다. 알코올 자체를 대체하는 것이 아니라, 알코올을 마시지 못하는 상황 (운전, 임신, 다음 날 일정) 에서 NA 가 자리를 채운다. 알코올의 핵심 시장 — 회식, 이벤트, 친밀한 모임 — 은 NA 에 의해 잠식되지 않는다.\n\n이 가설의 강점은 인간 사회의 보수성이다. 인류는 수천 년 동안 알코올을 사회적 도구로 사용해왔다. 그 도구의 자리가 50년 안에 완전히 바뀌는 것은 역사적으로 드문 일이다. NA 가 자라는 것은 ‘새 도구가 추가된 것’ 이지 ‘기존 도구가 사라지는 것’ 이 아니다.", "body_html": "<p>가설 B. <strong>보완 (Complement)</strong> 가설.</p>\n<p>NA 는 알코올과 공존하는 추가 옵션이다. 알코올 자체를 대체하는 것이 아니라, 알코올을 마시지 못하는 상황 (운전, 임신, 다음 날 일정) 에서 NA 가 자리를 채운다. 알코올의 핵심 시장 — 회식, 이벤트, 친밀한 모임 — 은 NA 에 의해 잠식되지 않는다.</p>\n<p>이 가설의 강점은 인간 사회의 보수성이다. 인류는 수천 년 동안 알코올을 사회적 도구로 사용해왔다. 그 도구의 자리가 50년 안에 완전히 바뀌는 것은 역사적으로 드문 일이다. NA 가 자라는 것은 ‘새 도구가 추가된 것’ 이지 ‘기존 도구가 사라지는 것’ 이 아니다.</p>", "plain_len": 322}, {"title": "Page 04 · Mixed Signal", "type": "essay", "rawIndex": 4, "body_md": "두 가설은 모순이 아니다. 같은 데이터의 다른 해석이다.\n\n대체 가설은 출고량 감소를 ‘대체의 증거’ 로 본다. 보완 가설은 같은 출고량 감소를 ‘인구 감소·고령화의 결과’ 로 본다. 무알콜 성장을 대체 가설은 ‘새 카테고리의 부상’ 으로 본다. 보완 가설은 ‘기존 카테고리의 보조 옵션 확장’ 으로 본다.\n\n어느 해석이 맞는지는 시점과 세그먼트에 따라 다르다. 20대 여성 세그먼트에서는 폭음 (보완 가설의 증거) 과 NA 관심 (대체 가설의 증거) 가 동시에 자란다. 30대 남성 세그먼트에서는 회식 감소 (대체 가설의 증거) 가 더 뚜렷하다. 한 가설이 모든 세그먼트에서 참인 것은 아니다.", "body_html": "<p>두 가설은 모순이 아니다. 같은 데이터의 다른 해석이다.</p>\n<p>대체 가설은 출고량 감소를 ‘대체의 증거’ 로 본다. 보완 가설은 같은 출고량 감소를 ‘인구 감소·고령화의 결과’ 로 본다. 무알콜 성장을 대체 가설은 ‘새 카테고리의 부상’ 으로 본다. 보완 가설은 ‘기존 카테고리의 보조 옵션 확장’ 으로 본다.</p>\n<p>어느 해석이 맞는지는 시점과 세그먼트에 따라 다르다. 20대 여성 세그먼트에서는 폭음 (보완 가설의 증거) 과 NA 관심 (대체 가설의 증거) 가 동시에 자란다. 30대 남성 세그먼트에서는 회식 감소 (대체 가설의 증거) 가 더 뚜렷하다. 한 가설이 모든 세그먼트에서 참인 것은 아니다.</p>", "plain_len": 331}, {"title": "Page 05 · Reading", "type": "essay", "rawIndex": 5, "body_md": "어느 한 가설을 택하면 자료의 절반이 사라진다.\n\n대체 가설만 택하면 — 20대 폭음, 위스키 프리미엄화, Dry January 회귀율 — 의 자료가 무시된다. 보완 가설만 택하면 — 출고량 감소, NA 시장 두 자릿수 성장, 일본의 15년 경로 — 의 자료가 무시된다. 두 가설을 동시에 두는 자리가 자료 전체를 살리는 자리다.\n\n이 ‘동시에 두는 자리’ 가 이번 호의 가장 중요한 윤리다. Vol001 에서도 같은 자리가 있었다. 영월을 ‘위기 도시’ 로만 보지도 않고, ‘기회 도시’ 로만 보지도 않은 자리. 그 자리에서만 도시의 두께가 보였다.\n\nNA 시장도 마찬가지다. 대체 가설로만 보면 시장은 평면적이다. 보완 가설로만 봐도 평면적이다. 두 가설을 동시에 두는 자리에서 시장의 두께가 보인다.", "body_html": "<p>어느 한 가설을 택하면 자료의 절반이 사라진다.</p>\n<p>대체 가설만 택하면 — 20대 폭음, 위스키 프리미엄화, Dry January 회귀율 — 의 자료가 무시된다. 보완 가설만 택하면 — 출고량 감소, NA 시장 두 자릿수 성장, 일본의 15년 경로 — 의 자료가 무시된다. 두 가설을 동시에 두는 자리가 자료 전체를 살리는 자리다.</p>\n<p>이 ‘동시에 두는 자리’ 가 이번 호의 가장 중요한 윤리다. Vol001 에서도 같은 자리가 있었다. 영월을 ‘위기 도시’ 로만 보지도 않고, ‘기회 도시’ 로만 보지도 않은 자리. 그 자리에서만 도시의 두께가 보였다.</p>\n<p>NA 시장도 마찬가지다. 대체 가설로만 보면 시장은 평면적이다. 보완 가설로만 봐도 평면적이다. 두 가설을 동시에 두는 자리에서 시장의 두께가 보인다.</p>", "plain_len": 391}], "totalPages": 5}, {"num": "04", "key": "Case", "label": "Case", "ko": "사례", "short": "CS", "title": "세 사람, 세 잔", "pages": [{"title": "Page 01 · Cover", "type": "cover", "rawIndex": 1, "body_md": "그 사이를 읽다.\n\n같은 동네에 사는 세 사람. 같은 시기에 다른 잔을 선택했다. 세 잔의 모양을 본다.", "body_html": "<p>그 사이를 읽다.</p>\n<p>같은 동네에 사는 세 사람. 같은 시기에 다른 잔을 선택했다. 세 잔의 모양을 본다.</p>", "plain_len": 57}, {"title": "Page 02 · Person 1", "type": "essay", "rawIndex": 2, "body_md": "세 사람을 본다. 첫 번째는 발행인 본인, 나머지 둘은 가명이다. 가명 두 사람은 동의를 받았다.\n\n첫 번째 사람은 발행인 본인. 30대, 결혼 2년차, 매일 홈트 1217일째.\n\n원래 수제맥주 광이었다. NE DIPA 한 잔이 두 잔이 되고 두 잔이 네 잔이 되는 저녁이 많았다. 결혼 후에 한 두 잔으로 줄였다. 줄인 이유는 건강도 있지만, 더 큰 이유는 자기 결정이었다. “마실 때 기분은 좋지만 취해서 다음 날을 잃고 싶진 않다” 는 톤. 신나게 마시다 필름이 끊긴 적이 몇 번 있었고, 그 다음 날의 숙취가 운동 루틴을 자꾸 깼다.\n\n지금은 한 두 달에 한 번 NE DIPA 를 마시고, 일주일에 두세 번 카스 0.0 이나 카스 올제로 를 마신다. 알콜의 빈도가 줄어든 자리에 무알콜이 자연스럽게 들어왔다. 의식적인 옮김이라기보다는 자연스러운 옮김. 매대에서 본 한 캔이 그 옮김의 시작이었다.\n\n그가 흥미로운 점은, ‘술을 줄이는 것’ 자체가 정체성의 중심이 아니라는 점이다. NE DIPA 는 여전히 좋아한다. 무알콜은 그 사랑의 대안이 아니라 그 사랑과 공존하는 다른 선택이다.", "body_html": "<p>세 사람을 본다. 첫 번째는 발행인 본인, 나머지 둘은 가명이다. 가명 두 사람은 동의를 받았다.</p>\n<p>첫 번째 사람은 발행인 본인. 30대, 결혼 2년차, 매일 홈트 1217일째.</p>\n<p>원래 수제맥주 광이었다. NE DIPA 한 잔이 두 잔이 되고 두 잔이 네 잔이 되는 저녁이 많았다. 결혼 후에 한 두 잔으로 줄였다. 줄인 이유는 건강도 있지만, 더 큰 이유는 자기 결정이었다. “마실 때 기분은 좋지만 취해서 다음 날을 잃고 싶진 않다” 는 톤. 신나게 마시다 필름이 끊긴 적이 몇 번 있었고, 그 다음 날의 숙취가 운동 루틴을 자꾸 깼다.</p>\n<p>지금은 한 두 달에 한 번 NE DIPA 를 마시고, 일주일에 두세 번 카스 0.0 이나 카스 올제로 를 마신다. 알콜의 빈도가 줄어든 자리에 무알콜이 자연스럽게 들어왔다. 의식적인 옮김이라기보다는 자연스러운 옮김. 매대에서 본 한 캔이 그 옮김의 시작이었다.</p>\n<p>그가 흥미로운 점은, ‘술을 줄이는 것’ 자체가 정체성의 중심이 아니라는 점이다. NE DIPA 는 여전히 좋아한다. 무알콜은 그 사랑의 대안이 아니라 그 사랑과 공존하는 다른 선택이다.</p>", "plain_len": 551}, {"title": "Page 03 · Person 2", "type": "essay", "rawIndex": 3, "body_md": "두 번째 사람. 20대 후반, 자유 직업, ‘의식적 음주’ 를 실천한다.\n\n“한 잔만 마셔요. 한 잔이 끝이에요. 두 잔째는 안 시켜요.”\n\n그의 한 잔은 의미가 있다. 비싼 한 잔. 그날 모임의 분위기에 맞는 한 잔. 그 한 잔을 천천히 한 시간 동안 마신다. 그 한 시간이 모임의 클라이맥스다.\n\n그의 가설은 단순하다. ‘양은 안 중요하다. 잔의 의미가 중요하다.’ 다섯 잔을 빨리 마시는 것보다 한 잔을 천천히 마시는 게 더 만족스럽다는 자기 발견. 이 발견이 그의 음주 디자인의 출발점이다.\n\n그가 흥미로운 점은, 그가 절주를 하는 사람이 아니라는 사실이다. 그는 술을 좋아한다. 와인의 미묘한 차이를 안다. 칵테일의 베이스 스피릿이 무엇인지 묻는다. 술을 ‘의식적으로 다루는’ 사람이지, ‘피하는’ 사람이 아니다.", "body_html": "<p>두 번째 사람. 20대 후반, 자유 직업, ‘의식적 음주’ 를 실천한다.</p>\n<p>“한 잔만 마셔요. 한 잔이 끝이에요. 두 잔째는 안 시켜요.”</p>\n<p>그의 한 잔은 의미가 있다. 비싼 한 잔. 그날 모임의 분위기에 맞는 한 잔. 그 한 잔을 천천히 한 시간 동안 마신다. 그 한 시간이 모임의 클라이맥스다.</p>\n<p>그의 가설은 단순하다. ‘양은 안 중요하다. 잔의 의미가 중요하다.’ 다섯 잔을 빨리 마시는 것보다 한 잔을 천천히 마시는 게 더 만족스럽다는 자기 발견. 이 발견이 그의 음주 디자인의 출발점이다.</p>\n<p>그가 흥미로운 점은, 그가 절주를 하는 사람이 아니라는 사실이다. 그는 술을 좋아한다. 와인의 미묘한 차이를 안다. 칵테일의 베이스 스피릿이 무엇인지 묻는다. 술을 ‘의식적으로 다루는’ 사람이지, ‘피하는’ 사람이 아니다.</p>", "plain_len": 400}, {"title": "Page 04 · Person 3", "type": "essay", "rawIndex": 4, "body_md": "세 번째 사람. 30대 초반, 회사원, 0.0 만 마신다.\n\n“회식 자리는 다 가요. 거기서 0.0 만 마셔요. 옛날에는 카스 0.0 한 종류였는데 요즘은 선택지가 많아져서 좋아요.”\n\n그의 시작점은 첫 번째 사람과 비슷하지만 결과가 다르다. 건강 이유로 술을 줄였지만, 회식 문화 자체와 분리되고 싶지는 않았다. 그래서 0.0 으로 옮겼다. 회식의 자리는 지키고, 잔의 내용만 바꿨다.\n\n이 사람은 NA 시장의 가장 명확한 고객이다. 회식이 있을 때마다 0.0 을 시킨다. 매주 1-2번. 1년에 100잔 가까이. 한 사람의 NA 소비량으로는 작지 않다.\n\n그의 정체성은 ‘술을 안 마시는 사람’ 이 아니다. ‘0.0 을 마시는 사람’ 이다. 카테고리의 정체성이 그의 자기 정체성의 한 줄이 되었다.", "body_html": "<p>세 번째 사람. 30대 초반, 회사원, 0.0 만 마신다.</p>\n<p>“회식 자리는 다 가요. 거기서 0.0 만 마셔요. 옛날에는 카스 0.0 한 종류였는데 요즘은 선택지가 많아져서 좋아요.”</p>\n<p>그의 시작점은 첫 번째 사람과 비슷하지만 결과가 다르다. 건강 이유로 술을 줄였지만, 회식 문화 자체와 분리되고 싶지는 않았다. 그래서 0.0 으로 옮겼다. 회식의 자리는 지키고, 잔의 내용만 바꿨다.</p>\n<p>이 사람은 NA 시장의 가장 명확한 고객이다. 회식이 있을 때마다 0.0 을 시킨다. 매주 1-2번. 1년에 100잔 가까이. 한 사람의 NA 소비량으로는 작지 않다.</p>\n<p>그의 정체성은 ‘술을 안 마시는 사람’ 이 아니다. ‘0.0 을 마시는 사람’ 이다. 카테고리의 정체성이 그의 자기 정체성의 한 줄이 되었다.</p>", "plain_len": 388}, {"title": "Page 05 · Reading", "type": "essay", "rawIndex": 5, "body_md": "세 사람의 공통점은 ‘술과의 관계’ 자체가 의식적 디자인의 대상이 되었다는 사실이다.\n\n세 사람 모두 술과의 관계를 ‘자연스럽게 흘러가는 것’ 으로 두지 않았다. 의식적으로 설계했다. 첫 번째 사람은 ‘0잔’ 으로, 두 번째 사람은 ‘1잔의 의미’ 로, 세 번째 사람은 ‘0.0의 자리’ 로. 세 가지 디자인이 같은 동네에서 같은 시기에 공존한다.\n\n이 ‘의식적 디자인’ 이 소버 큐리어스 세대의 진짜 정체다. 술을 마시는가 안 마시는가가 아니라, 술을 어떻게 다루는가의 자기 설계. 그 설계의 결과는 사람마다 다르지만, 설계 자체가 새로운 행위다.\n\n이전 세대는 술과의 관계를 별로 설계하지 않았다. ‘마시면 마시는 거고, 안 마시면 안 마시는 거’ 였다. 지금 세대는 그 관계 자체를 자기 정체성의 한 줄로 다룬다. 이 차이가 ‘대체’ 와 ‘보완’ 의 가설을 넘는 더 본질적인 변화다.", "body_html": "<p>세 사람의 공통점은 ‘술과의 관계’ 자체가 의식적 디자인의 대상이 되었다는 사실이다.</p>\n<p>세 사람 모두 술과의 관계를 ‘자연스럽게 흘러가는 것’ 으로 두지 않았다. 의식적으로 설계했다. 첫 번째 사람은 ‘0잔’ 으로, 두 번째 사람은 ‘1잔의 의미’ 로, 세 번째 사람은 ‘0.0의 자리’ 로. 세 가지 디자인이 같은 동네에서 같은 시기에 공존한다.</p>\n<p>이 ‘의식적 디자인’ 이 소버 큐리어스 세대의 진짜 정체다. 술을 마시는가 안 마시는가가 아니라, 술을 어떻게 다루는가의 자기 설계. 그 설계의 결과는 사람마다 다르지만, 설계 자체가 새로운 행위다.</p>\n<p>이전 세대는 술과의 관계를 별로 설계하지 않았다. ‘마시면 마시는 거고, 안 마시면 안 마시는 거’ 였다. 지금 세대는 그 관계 자체를 자기 정체성의 한 줄로 다룬다. 이 차이가 ‘대체’ 와 ‘보완’ 의 가설을 넘는 더 본질적인 변화다.</p>", "plain_len": 438}], "totalPages": 5}, {"num": "05", "key": "Archive", "label": "Archive", "ko": "아카이브", "short": "AR", "title": "결정되지 않은 자리", "pages": [{"title": "Page 01 · Summary", "type": "archive", "rawIndex": 1, "body_md": "토요일을 세 문장으로 접는다.\n\n첫째, 반대 신호도 함께 본다. 20대 폭음, 위스키 프리미엄화, Dry January 46% 회귀율. 성장의 증거 옆에 같이 놓아야 할 데이터들.\n\n둘째, 대체와 보완 두 가설은 미해결로 둔다. 어느 한 가설을 택하면 자료의 절반이 사라진다. 두 가설을 동시에 두는 자리가 가장 정직한 자리다.\n\n셋째, 세 사람의 공통점은 ‘의식적 디자인’ 이다. 술과의 관계 자체가 자기 설계의 대상이 되었다. 대체와 보완을 넘는 더 본질적인 변화.", "body_html": "<p>토요일을 세 문장으로 접는다.</p>\n<p>첫째, 반대 신호도 함께 본다. 20대 폭음, 위스키 프리미엄화, Dry January 46% 회귀율. 성장의 증거 옆에 같이 놓아야 할 데이터들.</p>\n<p>둘째, 대체와 보완 두 가설은 미해결로 둔다. 어느 한 가설을 택하면 자료의 절반이 사라진다. 두 가설을 동시에 두는 자리가 가장 정직한 자리다.</p>\n<p>셋째, 세 사람의 공통점은 ‘의식적 디자인’ 이다. 술과의 관계 자체가 자기 설계의 대상이 되었다. 대체와 보완을 넘는 더 본질적인 변화.</p>", "plain_len": 259}, {"title": "Page 02 · Open", "type": "archive", "rawIndex": 2, "body_md": "닫지 않은 질문 4개. 일요일의 결론에 미리 던진다.\n\n1. NA 시장이 일본의 15년 경로를 따라가면, 한국에서 ‘NA 매대 점유율 30%’ 의 자리에 도달하는 시점은 언제인가.\n\n2. 1세대 수제맥주의 실패가 NA 신규 브랜드의 시도를 어렵게 만드는가, 아니면 교훈을 주는가.\n\n3. 한국에서 Dry January 같은 캠페인 인프라가 만들어지는 출발점은 어디인가. 정부, NGO, 기업, 매체 중 누가 시작하는가.\n\n4. ‘의식적 디자인’ 의 세대가 40대, 50대가 되었을 때, 한국 음주 풍경은 어떻게 바뀌는가. 그 세대의 자녀 세대는 무엇을 디폴트로 가지는가.\n\n이 질문들은 일요일에 답해지지 않는다. 그러나 질문 자체를 분명히 하는 것이 결론의 한 부분이다.", "body_html": "<p>닫지 않은 질문 4개. 일요일의 결론에 미리 던진다.</p>\n<ol><li>NA 시장이 일본의 15년 경로를 따라가면, 한국에서 ‘NA 매대 점유율 30%’ 의 자리에 도달하는 시점은 언제인가.</li></ol>\n<ol><li>1세대 수제맥주의 실패가 NA 신규 브랜드의 시도를 어렵게 만드는가, 아니면 교훈을 주는가.</li></ol>\n<ol><li>한국에서 Dry January 같은 캠페인 인프라가 만들어지는 출발점은 어디인가. 정부, NGO, 기업, 매체 중 누가 시작하는가.</li></ol>\n<ol><li>‘의식적 디자인’ 의 세대가 40대, 50대가 되었을 때, 한국 음주 풍경은 어떻게 바뀌는가. 그 세대의 자녀 세대는 무엇을 디폴트로 가지는가.</li></ol>\n<p>이 질문들은 일요일에 답해지지 않는다. 그러나 질문 자체를 분명히 하는 것이 결론의 한 부분이다.</p>", "plain_len": 358}, {"title": "Page 03 · Bridge", "type": "archive", "rawIndex": 3, "body_md": "다음 날은 결론의 자리로 간다.\n\n7일을 7문장으로 접는다. 답이 아니라 다음 질문으로 닫는다. ‘한 잔’ 이라는 단위가 흔들리는 자리에서, 무엇이 새로 그려지는가. 이 질문에 천천히 답한다.\n\n---", "body_html": "<p>다음 날은 결론의 자리로 간다.</p>\n<p>7일을 7문장으로 접는다. 답이 아니라 다음 질문으로 닫는다. ‘한 잔’ 이라는 단위가 흔들리는 자리에서, 무엇이 새로 그려지는가. 이 질문에 천천히 답한다.</p>\n<p>---</p>", "plain_len": 110}], "totalPages": 3}]}, {"date": "2026-05-17", "weekday": "일", "weekdayFull": "일요일", "no": "002-07", "titleLine": "한 잔을 다시 묻는다", "theme": "한 잔을 다시 묻는다", "note_html": "<aside class=\"note-card\"><strong>Note</strong><p>일요일의 역할 일요일은 7일을 7문장으로 접는 날이다. 구호 X. 결론은 다음 호의 질문으로 닫는다. Vol001 의 마지막 day “작지만 두꺼운 도시” 와 같은 자리. 빠른 결론을 만들지 않는다.</p></aside>", "sections": [{"num": "01", "key": "Intro", "label": "Intro", "ko": "입구", "short": "IN", "title": "다시 처음 질문 앞에서", "pages": [{"title": "Page 01 · Cover", "type": "cover", "rawIndex": 1, "body_md": "답이 아니라 자리.\n\n7일을 보낸 후 처음 질문 앞에 다시 선다. 답이 생긴 게 아니라, 질문이 다른 모양으로 보인다.", "body_html": "<p>답이 아니라 자리.</p>\n<p>7일을 보낸 후 처음 질문 앞에 다시 선다. 답이 생긴 게 아니라, 질문이 다른 모양으로 보인다.</p>", "plain_len": 65}, {"title": "Page 02 · Return", "type": "essay", "rawIndex": 2, "body_md": "월요일에 본 두 기사 제목을 다시 본다.\n\n“법원, 어메이징브루잉컴퍼니 회생절차 폐지 결정… 파산 수순.”\n“국세청 주류 출고량, 2년 연속 감소.”\n\n7일 전과 같은 두 문장이다. 그러나 7일 동안 본 것들이 그 두 문장 사이에 들어가서, 이제 두 문장이 다른 무게로 읽힌다.\n\n7일 전에는 두 문장이 각각 따로 있었다. 한 회사의 일, 한 나라의 통계. 7일 후에는 두 문장이 같은 변화의 두 얼굴로 읽힌다. 한 회사의 파산은 한 나라의 음주 변화의 미시 단면이고, 한 나라의 통계는 그 미시 단면들의 합이다.", "body_html": "<p>월요일에 본 두 기사 제목을 다시 본다.</p>\n<p>“법원, 어메이징브루잉컴퍼니 회생절차 폐지 결정… 파산 수순.” “국세청 주류 출고량, 2년 연속 감소.”</p>\n<p>7일 전과 같은 두 문장이다. 그러나 7일 동안 본 것들이 그 두 문장 사이에 들어가서, 이제 두 문장이 다른 무게로 읽힌다.</p>\n<p>7일 전에는 두 문장이 각각 따로 있었다. 한 회사의 일, 한 나라의 통계. 7일 후에는 두 문장이 같은 변화의 두 얼굴로 읽힌다. 한 회사의 파산은 한 나라의 음주 변화의 미시 단면이고, 한 나라의 통계는 그 미시 단면들의 합이다.</p>", "plain_len": 284}, {"title": "Page 03 · Changed", "type": "essay", "rawIndex": 3, "body_md": "같은 두 기사가 다르게 읽히는 것의 정체는 무엇인가.\n\n기사 자체는 바뀌지 않았다. 바뀐 것은 그 기사를 읽는 사람이다. 7일 동안 본 자료, 만난 사람, 정리한 가설이 두 기사의 자리를 다른 자리로 옮겼다.\n\n이것이 매거진의 한 가지 효용일 수 있다. 정보를 새로 주는 게 아니라, 같은 정보를 다른 자리에 놓을 수 있는 맥락을 만든다. 정보 자체보다 정보의 자리가 더 중요한 시대에 매거진의 가치다.", "body_html": "<p>같은 두 기사가 다르게 읽히는 것의 정체는 무엇인가.</p>\n<p>기사 자체는 바뀌지 않았다. 바뀐 것은 그 기사를 읽는 사람이다. 7일 동안 본 자료, 만난 사람, 정리한 가설이 두 기사의 자리를 다른 자리로 옮겼다.</p>\n<p>이것이 매거진의 한 가지 효용일 수 있다. 정보를 새로 주는 게 아니라, 같은 정보를 다른 자리에 놓을 수 있는 맥락을 만든다. 정보 자체보다 정보의 자리가 더 중요한 시대에 매거진의 가치다.</p>", "plain_len": 223}, {"title": "Page 04 · Bridge", "type": "essay", "rawIndex": 4, "body_md": "7일 동안 본 것을 정리하기 전에, 처음 질문을 다시 던진다.\n\n“술이 줄어드는 시장에서, 무엇이 새로 그려지고 있는가.”\n\n7일 전과 같은 질문이지만, 답을 만드는 도구가 7일 만에 늘어났다. 다음 탭에서 그 도구들로 답을 만들어 본다.", "body_html": "<p>7일 동안 본 것을 정리하기 전에, 처음 질문을 다시 던진다.</p>\n<p>“술이 줄어드는 시장에서, 무엇이 새로 그려지고 있는가.”</p>\n<p>7일 전과 같은 질문이지만, 답을 만드는 도구가 7일 만에 늘어났다. 다음 탭에서 그 도구들로 답을 만들어 본다.</p>", "plain_len": 131}], "totalPages": 4}, {"num": "02", "key": "Issue", "label": "Issue", "ko": "쟁점", "short": "IS", "title": "일곱 문장으로 접는 한 주", "pages": [{"title": "Page 01 · Cover", "type": "cover", "rawIndex": 1, "body_md": "결론은 천천히.\n\n7일 = 7문장. 한 주를 일곱 문장으로 접는다.", "body_html": "<p>결론은 천천히.</p>\n<p>7일 = 7문장. 한 주를 일곱 문장으로 접는다.</p>", "plain_len": 36}, {"title": "Page 02 · Seven 1-3", "type": "essay", "rawIndex": 2, "body_md": "월요일. **두 곡선이 만났다.** 한국 주류 출고량은 2년 연속 줄었고, 무알콜 시장은 3년간 70% 자랐다. 두 곡선의 만남은 우연이 아니다. 같은 변화의 두 얼굴이다.\n\n화요일. **흉내는 절반까지다.** ‘취한 기분’ 은 5요소의 합이다. 잔, 거품, 향, 자리. 4요소는 무알콜로 흉내낼 수 있다. 마지막 하나 — GABA 작용 — 만 알코올 고유다. 80% 가 충분한 사람의 수가 늘어나면 시장은 자란다.\n\n수요일. **자리만 남았다.** 회식의 새 문법 — “자리는 지키고 잔은 비운다.” 절제가 윤리에서 미학으로 옮겨갔다. 0잔, 1잔, 0.0잔 — 세 가지 의식적 디자인이 같은 동네에서 공존한다.", "body_html": "<p>월요일. <strong>두 곡선이 만났다.</strong> 한국 주류 출고량은 2년 연속 줄었고, 무알콜 시장은 3년간 70% 자랐다. 두 곡선의 만남은 우연이 아니다. 같은 변화의 두 얼굴이다.</p>\n<p>화요일. <strong>흉내는 절반까지다.</strong> ‘취한 기분’ 은 5요소의 합이다. 잔, 거품, 향, 자리. 4요소는 무알콜로 흉내낼 수 있다. 마지막 하나 — GABA 작용 — 만 알코올 고유다. 80% 가 충분한 사람의 수가 늘어나면 시장은 자란다.</p>\n<p>수요일. <strong>자리만 남았다.</strong> 회식의 새 문법 — “자리는 지키고 잔은 비운다.” 절제가 윤리에서 미학으로 옮겨갔다. 0잔, 1잔, 0.0잔 — 세 가지 의식적 디자인이 같은 동네에서 공존한다.</p>", "plain_len": 329}, {"title": "Page 03 · Seven 4-7", "type": "essay", "rawIndex": 3, "body_md": "목요일. **1세대가 졌다.** 어메이징브루잉, 세븐브로이, 제주맥주 — 한국 수제맥주 1세대의 도미노. 매대에 의존하고 자리를 못 만든 회사들의 운명. 다음 술집의 좌표는 자리 위주, 음식 50%+, 페어링·큐레이션, 자리 디자인.\n\n금요일. **세 나라 세 길.** 일본 (기업 주도, 15년), 미국 (운동 주도, NA-only 신규 브랜드), 영국 (캠페인 주도, Dry January). 한국은 일본 모델 기반 + 미국 모델 변동성 + 영국 모델 부재의 조합. 세 길의 단순 모방이 아니라 한국의 자기 길을 만들어야 한다.\n\n토요일. **대체와 보완은 미해결이다.** 20대 폭음과 NA 관심의 양극화. 위스키 프리미엄화, 와인 회복. Dry January 46% 회귀율. 두 가설 (대체, 보완) 을 동시에 두는 자리가 가장 정직한 자리다.\n\n일요일. **한 잔이라는 단위가 흔들린다.** 잔은 양만 정하지 않는다. 자리·시간·관계·정체성을 함께 정한다. 그 약속이 흔들릴 때 흔들리는 것은 음주가 아니라 사회다.", "body_html": "<p>목요일. <strong>1세대가 졌다.</strong> 어메이징브루잉, 세븐브로이, 제주맥주 — 한국 수제맥주 1세대의 도미노. 매대에 의존하고 자리를 못 만든 회사들의 운명. 다음 술집의 좌표는 자리 위주, 음식 50%+, 페어링·큐레이션, 자리 디자인.</p>\n<p>금요일. <strong>세 나라 세 길.</strong> 일본 (기업 주도, 15년), 미국 (운동 주도, NA-only 신규 브랜드), 영국 (캠페인 주도, Dry January). 한국은 일본 모델 기반 + 미국 모델 변동성 + 영국 모델 부재의 조합. 세 길의 단순 모방이 아니라 한국의 자기 길을 만들어야 한다.</p>\n<p>토요일. <strong>대체와 보완은 미해결이다.</strong> 20대 폭음과 NA 관심의 양극화. 위스키 프리미엄화, 와인 회복. Dry January 46% 회귀율. 두 가설 (대체, 보완) 을 동시에 두는 자리가 가장 정직한 자리다.</p>\n<p>일요일. <strong>한 잔이라는 단위가 흔들린다.</strong> 잔은 양만 정하지 않는다. 자리·시간·관계·정체성을 함께 정한다. 그 약속이 흔들릴 때 흔들리는 것은 음주가 아니라 사회다.</p>", "plain_len": 498}, {"title": "Page 04 · Reading", "type": "essay", "rawIndex": 4, "body_md": "일곱 문장의 공통어를 찾아 본다.\n\n‘잔’. ‘인분’. ‘세션’. ‘매대’. ‘카테고리’. 모두 단위의 문제다.\n\n월요일의 두 곡선은 ‘리터’ 라는 단위의 변화다. 화요일의 흉내는 ‘잔’ 이라는 단위 안의 5요소다. 수요일의 자리는 ‘모임’ 이라는 사회적 단위다. 목요일의 술집은 ‘업태’ 라는 분류 단위다. 금요일의 세 나라는 ‘카테고리’ 라는 시장 단위다. 토요일의 두 가설은 ‘대체’ 라는 변화의 단위다. 일요일은 ‘한 잔’ 이라는 단위 자체를 다시 묻는다.\n\n이 변화의 본질은 단위의 재발명이다. ‘한 잔’ 이 무엇을 의미하는지, 그 잔이 어떤 자리에서 마셔지는지, 그 자리가 어떻게 모임이 되고 매출이 되는지 — 모든 단위가 흔들리고 있다.", "body_html": "<p>일곱 문장의 공통어를 찾아 본다.</p>\n<p>‘잔’. ‘인분’. ‘세션’. ‘매대’. ‘카테고리’. 모두 단위의 문제다.</p>\n<p>월요일의 두 곡선은 ‘리터’ 라는 단위의 변화다. 화요일의 흉내는 ‘잔’ 이라는 단위 안의 5요소다. 수요일의 자리는 ‘모임’ 이라는 사회적 단위다. 목요일의 술집은 ‘업태’ 라는 분류 단위다. 금요일의 세 나라는 ‘카테고리’ 라는 시장 단위다. 토요일의 두 가설은 ‘대체’ 라는 변화의 단위다. 일요일은 ‘한 잔’ 이라는 단위 자체를 다시 묻는다.</p>\n<p>이 변화의 본질은 단위의 재발명이다. ‘한 잔’ 이 무엇을 의미하는지, 그 잔이 어떤 자리에서 마셔지는지, 그 자리가 어떻게 모임이 되고 매출이 되는지 — 모든 단위가 흔들리고 있다.</p>", "plain_len": 360}], "totalPages": 4}, {"num": "03", "key": "Insight", "label": "Insight", "ko": "통찰", "short": "IT", "title": "잔은 사회의 약속이다", "pages": [{"title": "Page 01 · Cover", "type": "cover", "rawIndex": 1, "body_md": "단위가 흔들릴 때.\n\n‘한 잔’ 이라는 단위는 어떻게 발명되었는가. 그 발명의 역사가 지금의 흔들림을 이해하는 도구다.", "body_html": "<p>단위가 흔들릴 때.</p>\n<p>‘한 잔’ 이라는 단위는 어떻게 발명되었는가. 그 발명의 역사가 지금의 흔들림을 이해하는 도구다.</p>", "plain_len": 65}, {"title": "Page 02 · History", "type": "essay", "rawIndex": 2, "body_md": "‘한 잔’ 이라는 단위는 인류의 오래된 발명이다.\n\n수렵채집 사회에서는 ‘한 잔’ 이 없었다. 발효된 액체를 그릇에 담아 마셨고, 양은 그릇의 크기로 결정되었다. 농경 사회의 등장 이후 곡물 양조가 안정화되면서 ‘잔’ 이라는 표준 단위가 만들어졌다. 그릇이 아니라 잔 — 손에 들고 마시기 좋은 크기, 한 번에 다 마시기 좋은 양.\n\n이 표준화의 역사적 의미가 크다. ‘한 잔’ 의 등장은 술이 사회적 도구가 된 순간이다. 같은 잔을 들고 같은 양을 마신다는 것은, 같은 자리에 있다는 사회적 합의를 만든다. 잔의 단위가 사회의 단위가 되었다.", "body_html": "<p>‘한 잔’ 이라는 단위는 인류의 오래된 발명이다.</p>\n<p>수렵채집 사회에서는 ‘한 잔’ 이 없었다. 발효된 액체를 그릇에 담아 마셨고, 양은 그릇의 크기로 결정되었다. 농경 사회의 등장 이후 곡물 양조가 안정화되면서 ‘잔’ 이라는 표준 단위가 만들어졌다. 그릇이 아니라 잔 — 손에 들고 마시기 좋은 크기, 한 번에 다 마시기 좋은 양.</p>\n<p>이 표준화의 역사적 의미가 크다. ‘한 잔’ 의 등장은 술이 사회적 도구가 된 순간이다. 같은 잔을 들고 같은 양을 마신다는 것은, 같은 자리에 있다는 사회적 합의를 만든다. 잔의 단위가 사회의 단위가 되었다.</p>", "plain_len": 302}, {"title": "Page 03 · Function", "type": "essay", "rawIndex": 3, "body_md": "잔은 양만 정하지 않는다.\n\n잔은 자리를 정한다. 같은 잔을 받은 사람들이 같은 자리에 있다. 잔이 다르면 자리가 다르다. 위스키 잔과 와인 잔과 맥주 잔이 다른 이유는 단순히 술이 다르기 때문이 아니라, 그 잔이 만드는 자리가 다르기 때문이다.\n\n잔은 시간을 정한다. 한 잔을 마시는 데 걸리는 시간이 모임의 호흡을 만든다. 위스키 한 잔은 천천히, 맥주 한 잔은 빠르게. 시간의 단위가 잔의 단위에 들어 있다.\n\n잔은 관계를 정한다. 누구와 같은 잔을 들고 있는가가 관계의 한 줄이 된다. 동료, 가족, 친구, 연인. 잔의 종류와 자리의 종류가 결합해서 관계의 모양을 만든다.\n\n잔은 정체성을 정한다. ‘나는 무슨 잔을 즐기는 사람인가’ 가 한 사람의 자기 표현이 된다. 와인을 마시는 사람, 위스키를 마시는 사람, 맥주를 마시는 사람, 무알콜을 마시는 사람.", "body_html": "<p>잔은 양만 정하지 않는다.</p>\n<p>잔은 자리를 정한다. 같은 잔을 받은 사람들이 같은 자리에 있다. 잔이 다르면 자리가 다르다. 위스키 잔과 와인 잔과 맥주 잔이 다른 이유는 단순히 술이 다르기 때문이 아니라, 그 잔이 만드는 자리가 다르기 때문이다.</p>\n<p>잔은 시간을 정한다. 한 잔을 마시는 데 걸리는 시간이 모임의 호흡을 만든다. 위스키 한 잔은 천천히, 맥주 한 잔은 빠르게. 시간의 단위가 잔의 단위에 들어 있다.</p>\n<p>잔은 관계를 정한다. 누구와 같은 잔을 들고 있는가가 관계의 한 줄이 된다. 동료, 가족, 친구, 연인. 잔의 종류와 자리의 종류가 결합해서 관계의 모양을 만든다.</p>\n<p>잔은 정체성을 정한다. ‘나는 무슨 잔을 즐기는 사람인가’ 가 한 사람의 자기 표현이 된다. 와인을 마시는 사람, 위스키를 마시는 사람, 맥주를 마시는 사람, 무알콜을 마시는 사람.</p>", "plain_len": 423}, {"title": "Page 04 · Shift", "type": "essay", "rawIndex": 4, "body_md": "이 약속이 흔들릴 때, 흔들리는 것은 음주가 아니라 사회다.\n\n‘한 잔’ 의 의미가 흔들리면 자리의 의미가 흔들린다. 자리의 의미가 흔들리면 모임의 의미가 흔들린다. 모임의 의미가 흔들리면 관계의 의미가 흔들린다. 한 단위의 변화가 여러 층의 의미 변화로 이어진다.\n\n이 흔들림의 끝에 흥미로운 가능성이 하나 있다. 만약 무알콜 맥주의 미각 완성도가 더 자라서, 내가 좋아하는 NE DIPA 의 그 진한 오렌지·홉 향까지 알콜 없이 구현되는 날이 온다면. 더 나아가 AI 의 힘을 빌어, 알콜이 아닌 완전히 새로운 물질로 ‘취한 기분’ 만 정확히 흉내내면서도 숙취가 없고 집에 갈 시간이 되면 마음먹고 즉시 깰 수 있는 안전한 신물질이 개발된다면. 그것이 보편화되는 사회는 어떤 모양일까. 지금은 공상에 가깝지만, 화요일에 본 Sentia Spirits 의 시도가 그 길의 첫 입구이기는 하다.\n\n지금 한국에서 일어나는 ‘무알콜 시장의 성장’ 은 단순한 시장의 변화가 아니다. 단위의 재발명의 신호다. ‘한 잔’ 이 새로운 자리, 새로운 시간, 새로운 관계, 새로운 정체성을 만들 수 있는 가능성. 그 가능성을 시장이 먼저 본 것이고, 사회가 그 다음에 따라간다.", "body_html": "<p>이 약속이 흔들릴 때, 흔들리는 것은 음주가 아니라 사회다.</p>\n<p>‘한 잔’ 의 의미가 흔들리면 자리의 의미가 흔들린다. 자리의 의미가 흔들리면 모임의 의미가 흔들린다. 모임의 의미가 흔들리면 관계의 의미가 흔들린다. 한 단위의 변화가 여러 층의 의미 변화로 이어진다.</p>\n<p>이 흔들림의 끝에 흥미로운 가능성이 하나 있다. 만약 무알콜 맥주의 미각 완성도가 더 자라서, 내가 좋아하는 NE DIPA 의 그 진한 오렌지·홉 향까지 알콜 없이 구현되는 날이 온다면. 더 나아가 AI 의 힘을 빌어, 알콜이 아닌 완전히 새로운 물질로 ‘취한 기분’ 만 정확히 흉내내면서도 숙취가 없고 집에 갈 시간이 되면 마음먹고 즉시 깰 수 있는 안전한 신물질이 개발된다면. 그것이 보편화되는 사회는 어떤 모양일까. 지금은 공상에 가깝지만, 화요일에 본 Sentia Spirits 의 시도가 그 길의 첫 입구이기는 하다.</p>\n<p>지금 한국에서 일어나는 ‘무알콜 시장의 성장’ 은 단순한 시장의 변화가 아니다. 단위의 재발명의 신호다. ‘한 잔’ 이 새로운 자리, 새로운 시간, 새로운 관계, 새로운 정체성을 만들 수 있는 가능성. 그 가능성을 시장이 먼저 본 것이고, 사회가 그 다음에 따라간다.</p>", "plain_len": 592}, {"title": "Page 05 · Reading", "type": "essay", "rawIndex": 5, "body_md": "NA 의 진짜 의미는 새 잔의 등장이 아니다. 잔이라는 단위 자체의 재발명이다.\n\n‘한 잔의 무알콜’ 은 단순히 ‘알코올이 없는 잔’ 이 아니다. 자리·시간·관계·정체성의 모든 단위를 다시 묻는 행위다. 이 잔은 어떤 자리에서 마셔지는가. 이 잔이 만드는 모임은 어떤 모양인가. 이 잔이 표현하는 정체성은 무엇인가.\n\n이 질문들이 새롭게 답해지는 동안, 한국 사회는 천천히 다른 모양이 된다. 그 모양은 지금 결정되지 않았다. 결정되지 않은 자리에 매거진의 자리가 있다.", "body_html": "<p>NA 의 진짜 의미는 새 잔의 등장이 아니다. 잔이라는 단위 자체의 재발명이다.</p>\n<p>‘한 잔의 무알콜’ 은 단순히 ‘알코올이 없는 잔’ 이 아니다. 자리·시간·관계·정체성의 모든 단위를 다시 묻는 행위다. 이 잔은 어떤 자리에서 마셔지는가. 이 잔이 만드는 모임은 어떤 모양인가. 이 잔이 표현하는 정체성은 무엇인가.</p>\n<p>이 질문들이 새롭게 답해지는 동안, 한국 사회는 천천히 다른 모양이 된다. 그 모양은 지금 결정되지 않았다. 결정되지 않은 자리에 매거진의 자리가 있다.</p>", "plain_len": 261}], "totalPages": 5}, {"num": "04", "key": "Case", "label": "Case", "ko": "사례", "short": "CS", "title": "세 가지 다음 잔", "pages": [{"title": "Page 01 · Cover", "type": "cover", "rawIndex": 1, "body_md": "각자의 동선.\n\n세 가지 시나리오를 본다. 술집, 모임, 혼술. 같은 변화가 세 자리에서 어떻게 다르게 나타나는지.", "body_html": "<p>각자의 동선.</p>\n<p>세 가지 시나리오를 본다. 술집, 모임, 혼술. 같은 변화가 세 자리에서 어떻게 다르게 나타나는지.</p>", "plain_len": 63}, {"title": "Page 02 · Bar", "type": "essay", "rawIndex": 2, "body_md": "**술집 시나리오.** 다음 술집의 좌표는 알코올 메뉴 50%↓ / NA 50%↑ / 음식·자리 강화다.\n\n5년 후 살아남은 술집들은 이 좌표 위에 있다. 메뉴판의 절반이 무알콜이고, 매출의 절반이 음식에서 나오고, 자리의 디자인이 알코올 없이도 작동한다. 알코올의 마진을 포기하고 자리·시간·경험에 가치를 옮긴 가게들이다.\n\n이런 가게의 평일 저녁은 옛날 술집의 평일 저녁과 다르다. 더 조용하고, 더 천천히, 더 의식적이다. 술을 마시는 사람도 있고, 무알콜을 마시는 사람도 있고, 식사만 하는 사람도 있다. 한 가게 안에서 세 가지 자리가 공존한다. 자리의 다양성이 가게의 정체성이 된다.", "body_html": "<p><strong>술집 시나리오.</strong> 다음 술집의 좌표는 알코올 메뉴 50%↓ / NA 50%↑ / 음식·자리 강화다.</p>\n<p>5년 후 살아남은 술집들은 이 좌표 위에 있다. 메뉴판의 절반이 무알콜이고, 매출의 절반이 음식에서 나오고, 자리의 디자인이 알코올 없이도 작동한다. 알코올의 마진을 포기하고 자리·시간·경험에 가치를 옮긴 가게들이다.</p>\n<p>이런 가게의 평일 저녁은 옛날 술집의 평일 저녁과 다르다. 더 조용하고, 더 천천히, 더 의식적이다. 술을 마시는 사람도 있고, 무알콜을 마시는 사람도 있고, 식사만 하는 사람도 있다. 한 가게 안에서 세 가지 자리가 공존한다. 자리의 다양성이 가게의 정체성이 된다.</p>", "plain_len": 326}, {"title": "Page 03 · Meeting", "type": "essay", "rawIndex": 3, "body_md": "**모임 시나리오.** “0.0 있는 데” 가 디폴트가 되는 시간.\n\n5년 후 모임의 장소 선택의 1순위가 ‘무알콜 옵션의 유무’ 가 될 수 있다. 지금은 ‘맛있는 곳’, ‘분위기 좋은 곳’, ‘회사 근처’ 가 1순위이고 ‘NA 옵션’ 은 보조 조건이다. 5년 후 그 우선순위가 바뀐다. ‘NA 옵션 있는 곳’ 이 디폴트가 되고, 그 다음에 다른 조건이 따른다.\n\n이 변화의 책임자는 모임의 호스트다. 호스트가 NA 옵션 있는 곳을 디폴트로 잡으면, 모임의 모양이 자연스럽게 바뀐다. ‘술 안 마시는 사람도 있을 거니까’ 가 ‘모두가 자기 잔을 의식적으로 고를 수 있도록’ 으로 옮겨간다. 호스트의 작은 결정이 모임 문화의 큰 변화로 이어진다.", "body_html": "<p><strong>모임 시나리오.</strong> “0.0 있는 데” 가 디폴트가 되는 시간.</p>\n<p>5년 후 모임의 장소 선택의 1순위가 ‘무알콜 옵션의 유무’ 가 될 수 있다. 지금은 ‘맛있는 곳’, ‘분위기 좋은 곳’, ‘회사 근처’ 가 1순위이고 ‘NA 옵션’ 은 보조 조건이다. 5년 후 그 우선순위가 바뀐다. ‘NA 옵션 있는 곳’ 이 디폴트가 되고, 그 다음에 다른 조건이 따른다.</p>\n<p>이 변화의 책임자는 모임의 호스트다. 호스트가 NA 옵션 있는 곳을 디폴트로 잡으면, 모임의 모양이 자연스럽게 바뀐다. ‘술 안 마시는 사람도 있을 거니까’ 가 ‘모두가 자기 잔을 의식적으로 고를 수 있도록’ 으로 옮겨간다. 호스트의 작은 결정이 모임 문화의 큰 변화로 이어진다.</p>", "plain_len": 354}, {"title": "Page 04 · Solo", "type": "essay", "rawIndex": 4, "body_md": "**혼술 시나리오.** ‘잔의 의식’ 으로서 NA. 양이 아니라 시간을 마신다.\n\n혼자 마시는 사람이 무알콜을 선택하는 것의 의미는 모임에서의 선택과 다르다. 모임에서는 ‘다른 사람의 시선’ 이 잔의 종류를 결정하는 한 요인이다. 혼자일 때는 그 요인이 없다.\n\n혼자일 때 무알콜을 선택하는 이유는 ‘잔 자체의 의식’ 이다. 한 잔을 천천히 마시면서 그 잔이 만드는 시간을 즐긴다. 알코올의 효과 (취기) 가 목표가 아니다. 잔을 드는 행위 자체가 목표다. 한 잔의 무알콜 와인을 1시간 동안 마시는 것은, 1시간의 ‘잔이 있는 시간’ 을 자기에게 선물하는 행위다.\n\n이 ‘잔이 있는 시간’ 의 가치는 일반 알코올 시대에는 잘 보이지 않았다. 알코올의 효과가 잔의 시간을 압도했기 때문이다. 무알콜이 등장하면서 비로소 ‘잔이 있는 시간’ 자체의 가치가 분리되어 보인다.", "body_html": "<p><strong>혼술 시나리오.</strong> ‘잔의 의식’ 으로서 NA. 양이 아니라 시간을 마신다.</p>\n<p>혼자 마시는 사람이 무알콜을 선택하는 것의 의미는 모임에서의 선택과 다르다. 모임에서는 ‘다른 사람의 시선’ 이 잔의 종류를 결정하는 한 요인이다. 혼자일 때는 그 요인이 없다.</p>\n<p>혼자일 때 무알콜을 선택하는 이유는 ‘잔 자체의 의식’ 이다. 한 잔을 천천히 마시면서 그 잔이 만드는 시간을 즐긴다. 알코올의 효과 (취기) 가 목표가 아니다. 잔을 드는 행위 자체가 목표다. 한 잔의 무알콜 와인을 1시간 동안 마시는 것은, 1시간의 ‘잔이 있는 시간’ 을 자기에게 선물하는 행위다.</p>\n<p>이 ‘잔이 있는 시간’ 의 가치는 일반 알코올 시대에는 잘 보이지 않았다. 알코올의 효과가 잔의 시간을 압도했기 때문이다. 무알콜이 등장하면서 비로소 ‘잔이 있는 시간’ 자체의 가치가 분리되어 보인다.</p>", "plain_len": 423}, {"title": "Page 05 · Reading", "type": "essay", "rawIndex": 5, "body_md": "세 시나리오의 공통점은 ‘잔이 양보다 자리·시간·관계의 단위로 재정의된다’ 는 것이다.\n\n술집 시나리오의 잔은 자리의 단위다. 모임 시나리오의 잔은 관계의 단위다. 혼술 시나리오의 잔은 시간의 단위다. 세 시나리오 모두 ‘잔이 곧 알코올의 양’ 이라는 옛 등식에서 벗어난다.\n\n이 재정의가 완성되면, 무알콜은 ‘대체재’ 도 아니고 ‘보완재’ 도 아닌 ‘잔의 의미를 회복한 도구’ 가 된다. 알코올의 시대에 잠시 잊혀졌던 잔의 본래 의미 — 자리·시간·관계·정체성의 단위 — 가 무알콜과 함께 돌아온다.\n\n‘비주류의 역습’ 의 진짜 의미는 시장의 자리바꿈이 아니라 단위의 회복이다. 잔이 다시 잔이 되는 시간. 그것이 ‘한 잔을 다시 묻는다’ 는 일요일의 마지막 문장이다.", "body_html": "<p>세 시나리오의 공통점은 ‘잔이 양보다 자리·시간·관계의 단위로 재정의된다’ 는 것이다.</p>\n<p>술집 시나리오의 잔은 자리의 단위다. 모임 시나리오의 잔은 관계의 단위다. 혼술 시나리오의 잔은 시간의 단위다. 세 시나리오 모두 ‘잔이 곧 알코올의 양’ 이라는 옛 등식에서 벗어난다.</p>\n<p>이 재정의가 완성되면, 무알콜은 ‘대체재’ 도 아니고 ‘보완재’ 도 아닌 ‘잔의 의미를 회복한 도구’ 가 된다. 알코올의 시대에 잠시 잊혀졌던 잔의 본래 의미 — 자리·시간·관계·정체성의 단위 — 가 무알콜과 함께 돌아온다.</p>\n<p>‘비주류의 역습’ 의 진짜 의미는 시장의 자리바꿈이 아니라 단위의 회복이다. 잔이 다시 잔이 되는 시간. 그것이 ‘한 잔을 다시 묻는다’ 는 일요일의 마지막 문장이다.</p>", "plain_len": 372}], "totalPages": 5}, {"num": "05", "key": "Archive", "label": "Archive", "ko": "아카이브", "short": "AR", "title": "Volume 002 를 닫으며", "pages": [{"title": "Page 01 · Next", "type": "archive", "rawIndex": 1, "body_md": "Vol003 을 미리 한 줄로 예고한다.\n\n다음 호의 질문은 아직 결정되지 않았다. 지금까지 매거진을 만들면서 본 패턴이 있다. 한 호의 마지막 자리가 다음 호의 첫 자리를 만든다. Vol001 의 마지막 ‘작지만 두꺼운 도시’ 가 Vol002 의 첫 ‘비주류의 역습’ 으로 이어진 것은 우연이 아니다.\n\nVol002 가 ‘단위의 회복’ 으로 닫았다면, Vol003 의 후보 질문은 ‘단위가 바뀐 시대의 회식’, ‘잔이 없는 모임의 자리’, ‘한국 외식의 다음 형태’ 같은 방향이다. 이 중 어느 질문이 다음 호의 입구가 될지는 다음 월요일에 결정된다.\n\n매거진은 답을 만드는 매체가 아니다. 다음 질문을 만드는 매체다.", "body_html": "<p>Vol003 을 미리 한 줄로 예고한다.</p>\n<p>다음 호의 질문은 아직 결정되지 않았다. 지금까지 매거진을 만들면서 본 패턴이 있다. 한 호의 마지막 자리가 다음 호의 첫 자리를 만든다. Vol001 의 마지막 ‘작지만 두꺼운 도시’ 가 Vol002 의 첫 ‘비주류의 역습’ 으로 이어진 것은 우연이 아니다.</p>\n<p>Vol002 가 ‘단위의 회복’ 으로 닫았다면, Vol003 의 후보 질문은 ‘단위가 바뀐 시대의 회식’, ‘잔이 없는 모임의 자리’, ‘한국 외식의 다음 형태’ 같은 방향이다. 이 중 어느 질문이 다음 호의 입구가 될지는 다음 월요일에 결정된다.</p>\n<p>매거진은 답을 만드는 매체가 아니다. 다음 질문을 만드는 매체다.</p>", "plain_len": 344}, {"title": "Page 02 · Sources", "type": "archive", "rawIndex": 2, "body_md": "자료 출처 R-01 ~ R-42 의 전체 리스트는 이 호의 자료 출처 섹션에 있다.\n\n본문에서 R-01 형식으로 인용된 모든 자료는 그 출처와 함께 한 곳에 모았다. 그 리스트는 단순한 참고문헌이 아니다. 이번 호의 ‘바닥’ 이다. 본문의 어떤 한 줄도 그 바닥 없이는 서지 않는다.\n\n매거진의 신뢰는 자료의 신뢰에서 온다. 자료의 신뢰는 출처의 투명성에서 온다. R-01 ~ R-42 의 리스트가 그 투명성의 약속이다.", "body_html": "<p>자료 출처 R-01 ~ R-42 의 전체 리스트는 이 호의 자료 출처 섹션에 있다.</p>\n<p>본문에서 R-01 형식으로 인용된 모든 자료는 그 출처와 함께 한 곳에 모았다. 그 리스트는 단순한 참고문헌이 아니다. 이번 호의 ‘바닥’ 이다. 본문의 어떤 한 줄도 그 바닥 없이는 서지 않는다.</p>\n<p>매거진의 신뢰는 자료의 신뢰에서 온다. 자료의 신뢰는 출처의 투명성에서 온다. R-01 ~ R-42 의 리스트가 그 투명성의 약속이다.</p>", "plain_len": 233}, {"title": "Page 03 · Close", "type": "archive", "rawIndex": 3, "body_md": "마지막 한 문장.\n\n“한 잔이라는 단위가 흔들리는 자리에서, 무엇이 새로 그려지는가.”\n\n이 질문에 7일을 들였다. 답은 한 줄이 아니다. ‘단위의 회복’ 이라고 일요일은 답했지만, 그 답은 또 다른 질문의 입구다.\n\n흥미로운 가설 하나로 닫는다. 지금 무알콜은 ‘비주류’ 다. 매대에서도 4번째 칸, 카테고리 인지도에서도 보조 옵션. 그러나 매대의 곡선과 사회의 곡선이 만나는 자리에서, 이 비주류가 향후 5년에서 10년 사이에 어떤 자리에 도달할지 모른다. 극단까지 상상해 보자. 카스 0.0 이 NE DIPA 수준의 미각 완성도에 도달하고, ‘취한 기분’ 만 깔끔하게 흉내내는 신물질이 안전하게 상용화되고, 도시의 술집들이 알콜 메뉴와 NA 메뉴를 같은 가격대로 같은 위치에 두는 시간. 그 시간에 회식 자리에서 ‘여전히 1차 소맥, 2차 양주’ 를 고집하는 사람은 어떻게 보일까. 5년 전까지는 ‘술도 못 마시는 사람’ 이 사회의 변두리에서 통과 카드를 들어야 했다면, 5년 후에는 ‘취하도록 마시는 사람’ 이 변두리에서 다른 종류의 통과 카드를 들어야 할 수도 있다. ‘비주류’ 가 ‘술자리의 분위기를 즐기되 자기 의지로 루틴과 라이프스타일을 컨트롤하는 힙한 사람’ 으로 인식되고, ‘주류’ 가 ‘주정뱅이’ 의 다른 이름이 되는 사회. 이 가설은 지금은 과장처럼 들리지만, 일본의 15년 경로와 영국의 17.5M Dry January 가 그 가설의 일부를 이미 실현한 풍경이다.\n\n매거진을 만드는 사람과 읽는 사람이 같은 자리에서 그 질문 앞에 선다. 답은 천천히 만들어진다. 그 답을 만드는 작은 자리 중 하나가 다음 주 마트 매대 앞에서, 한 캔의 무알콜을 카트에 넣을지 말지 결정하는 한 사람의 손이다.\n\nVolume 002 를 닫는다. Volume 003 의 자리를 연다.\n\n---", "body_html": "<p>마지막 한 문장.</p>\n<p>“한 잔이라는 단위가 흔들리는 자리에서, 무엇이 새로 그려지는가.”</p>\n<p>이 질문에 7일을 들였다. 답은 한 줄이 아니다. ‘단위의 회복’ 이라고 일요일은 답했지만, 그 답은 또 다른 질문의 입구다.</p>\n<p>흥미로운 가설 하나로 닫는다. 지금 무알콜은 ‘비주류’ 다. 매대에서도 4번째 칸, 카테고리 인지도에서도 보조 옵션. 그러나 매대의 곡선과 사회의 곡선이 만나는 자리에서, 이 비주류가 향후 5년에서 10년 사이에 어떤 자리에 도달할지 모른다. 극단까지 상상해 보자. 카스 0.0 이 NE DIPA 수준의 미각 완성도에 도달하고, ‘취한 기분’ 만 깔끔하게 흉내내는 신물질이 안전하게 상용화되고, 도시의 술집들이 알콜 메뉴와 NA 메뉴를 같은 가격대로 같은 위치에 두는 시간. 그 시간에 회식 자리에서 ‘여전히 1차 소맥, 2차 양주’ 를 고집하는 사람은 어떻게 보일까. 5년 전까지는 ‘술도 못 마시는 사람’ 이 사회의 변두리에서 통과 카드를 들어야 했다면, 5년 후에는 ‘취하도록 마시는 사람’ 이 변두리에서 다른 종류의 통과 카드를 들어야 할 수도 있다. ‘비주류’ 가 ‘술자리의 분위기를 즐기되 자기 의지로 루틴과 라이프스타일을 컨트롤하는 힙한 사람’ 으로 인식되고, ‘주류’ 가 ‘주정뱅이’ 의 다른 이름이 되는 사회. 이 가설은 지금은 과장처럼 들리지만, 일본의 15년 경로와 영국의 17.5M Dry January 가 그 가설의 일부를 이미 실현한 풍경이다.</p>\n<p>매거진을 만드는 사람과 읽는 사람이 같은 자리에서 그 질문 앞에 선다. 답은 천천히 만들어진다. 그 답을 만드는 작은 자리 중 하나가 다음 주 마트 매대 앞에서, 한 캔의 무알콜을 카트에 넣을지 말지 결정하는 한 사람의 손이다.</p>\n<p>Volume 002 를 닫는다. Volume 003 의 자리를 연다.</p>\n<p>---</p>", "plain_len": 888}], "totalPages": 3}]}]}</script>

  function textLayoutEstimate(text, font, width, lineHeight) {
    const clean = String(text || '').replace(/\s+/g, ' ').trim();
    if (!clean || width <= 0) return { lineCount: 0, height: 0, engine: pretextLib ? 'pretext' : 'fallback' };
    if (pretextLib && typeof pretextLib.prepare === 'function' && typeof pretextLib.layout === 'function') {
      try {
        const prepared = pretextLib.prepare(clean, font);
        const result = pretextLib.layout(prepared, width, lineHeight);
        return { lineCount: result.lineCount || Math.ceil((result.height || 0) / lineHeight), height: result.height || 0, engine: 'pretext' };
      } catch (_) {}
    }
    measureCtx.font = font;
    let lineWidth = 0, lines = 1;
    for (const ch of clean) {
      if (ch === '\n') { lines++; lineWidth = 0; continue; }
      const w = measureCtx.measureText(ch).width;
      if (lineWidth > 0 && lineWidth + w > width) { lines++; lineWidth = w; }
      else lineWidth += w;
    }
    return { lineCount: lines, height: lines * lineHeight, engine: 'canvas-fallback' };
  }
  function renderMeterHTML(section, pageIndex) {
    return section.pages.map((_, i) => `<span class="v-dot ${i < pageIndex ? 'is-read' : ''} ${i === pageIndex ? 'active' : ''}"></span>`).join('');
  }
  function requestFrameLayout() {
    cancelAnimationFrame(requestFrameLayout.raf);
    requestFrameLayout.raf = requestAnimationFrame(applyFrameLayout);
  }
  function applyFrameLayout() {
    const article = el.stage.querySelector('.article-page');
    if (!article) return;
    const copy = article.querySelector('.page-copy');
    const pageArt = article.querySelector('.page-art');
    const frame = article.querySelector('.page-frame');
    const main = article.querySelector('.page-main');
    if (!copy || !frame || !main) return;

    const w = article.clientWidth;
    const h = article.clientHeight;
    const pageCount = currentSection().pages.length;
    const compact = h < 760 || w < 370;

    const meterW = Math.round(clampFloat(14 + Math.min(pageCount, 8) * 1.25, compact ? 16 : 18, compact ? 19 : 23));
    const gap = Math.round(clampFloat(w * 0.026, compact ? 6 : 8, compact ? 9 : 13));
    const padL = Math.round(clampFloat(w * 0.052, compact ? 15 : 18, compact ? 18 : 22));
    const padR = Math.round(clampFloat(w * 0.034, compact ? 10 : 12, compact ? 13 : 16));
    const padT = compact ? 14 : 18;
    const padB = compact ? 14 : 18;
    const contentW = Math.max(176, w - padL - padR - meterW - gap);

    article.style.setProperty('--pretext-meter-w', `${meterW}px`);
    article.style.setProperty('--pretext-meter-gap', `${gap}px`);
    article.style.setProperty('--pretext-content-w', `${contentW}px`);
    article.style.setProperty('--pretext-page-pad-t', `${padT}px`);
    article.style.setProperty('--pretext-page-pad-r', `${padR}px`);
    article.style.setProperty('--pretext-page-pad-b', `${padB}px`);
    article.style.setProperty('--pretext-page-pad-l', `${padL}px`);

    // Reset before measuring. Each slide calculates its own text density and visual weight.
    article.classList.remove('no-art');
    article.dataset.overflow = 'false';
    article.style.setProperty('--copy-font-size', compact ? '14.5px' : '16px');
    article.style.setProperty('--copy-line-height', compact ? '1.64' : '1.76');
    article.style.setProperty('--copy-para-gap', compact ? '.62em' : '.82em');
    article.style.setProperty('--copy-mt', compact ? '10px' : '14px');
    article.style.setProperty('--subtitle-size', compact ? '14px' : '15px');
    article.style.setProperty('--subtitle-mt', compact ? '6px' : '8px');
    article.style.setProperty('--title-size', compact ? 'clamp(25px,7.5vw,37px)' : 'clamp(28px,8.4vw,42px)');
    article.style.setProperty('--cover-title-size', compact ? 'clamp(28px,8.7vw,44px)' : 'clamp(32px,10vw,50px)');
    article.style.setProperty('--art-pad-top', compact ? '8px' : '12px');

    const fixedNodes = Array.from(main.children).filter(node => node !== copy && node !== pageArt);
    const fixedH = () => fixedNodes.reduce((sum, node) => sum + node.getBoundingClientRect().height, 0);
    const family = getComputedStyle(copy).fontFamily || 'serif';
    const plain = copy.textContent.replace(/\s+/g, ' ').trim();
    const hasTables = !!copy.querySelector('table, pre, blockquote, .note-card');
    const isCover = article.classList.contains('type-cover');

    const baseTerrain = isCover ? (compact ? 64 : 92) : (compact ? 58 : 82);
    const candidates = [
      {fs: compact ? 14.5 : 16.0, lh: compact ? 1.64 : 1.76, terrain: baseTerrain, para: compact ? .62 : .82, artTop: compact ? 8 : 12, hideArt:false},
      {fs: compact ? 14.1 : 15.4, lh: compact ? 1.60 : 1.68, terrain: compact ? 50 : 66, para:.58, artTop:8, hideArt:false},
      {fs: compact ? 13.7 : 14.8, lh: compact ? 1.56 : 1.62, terrain: compact ? 42 : 54, para:.50, artTop:7, hideArt:false},
      {fs: compact ? 13.4 : 14.3, lh: compact ? 1.54 : 1.58, terrain: compact ? 34 : 42, para:.42, artTop:6, hideArt:false},
      {fs: compact ? 13.2 : 14.0, lh: compact ? 1.52 : 1.56, terrain: 0, para:.38, artTop:0, hideArt:true}
    ];
    let chosen = candidates[candidates.length - 1];
    let measured = {height:0, lineCount:0, engine: pretextLib ? 'pretext' : 'canvas-fallback'};
    for (const cand of candidates) {
      const lineHeightPx = cand.fs * cand.lh;
      const font = `400 ${cand.fs}px ${family}`;
      measured = textLayoutEstimate(plain, font, contentW, lineHeightPx);
      const visualH = cand.hideArt ? 0 : cand.terrain + cand.artTop;
      const nonTextH = fixedH() + visualH;
      const availableForCopy = Math.max(96, h - padT - padB - nonTextH);
      // Tables/preformatted blocks are less predictable than plain text, so leave a little more room.
      const safeFactor = hasTables ? 0.84 : 0.94;
      if (measured.height <= availableForCopy * safeFactor) { chosen = cand; break; }
    }
    article.classList.toggle('no-art', chosen.hideArt);
    article.style.setProperty('--copy-font-size', `${chosen.fs}px`);
    article.style.setProperty('--copy-line-height', `${chosen.lh}`);
    article.style.setProperty('--copy-para-gap', `${chosen.para}em`);
    article.style.setProperty('--pretext-terrain-h', `${chosen.terrain}px`);
    article.style.setProperty('--art-pad-top', `${chosen.artTop}px`);
    article.dataset.layoutEngine = measured.engine;

    // Final pass: if the browser's actual painting still overflows, shrink locally.
    requestAnimationFrame(() => {
      if (!copy.isConnected) return;
      if (copy.scrollHeight > copy.clientHeight + 2) {
        article.classList.add('no-art');
        const now = parseFloat(getComputedStyle(copy).fontSize) || chosen.fs;
        const smaller = Math.max(compact ? 12.8 : 13.5, now - 0.6);
        article.style.setProperty('--copy-font-size', `${smaller}px`);
        article.style.setProperty('--copy-line-height', compact ? '1.50' : '1.54');
        article.style.setProperty('--copy-para-gap', '.34em');
        article.dataset.overflow = copy.scrollHeight > copy.clientHeight + 2 ? 'true' : 'false';
      }
    });
  }

  function currentDay() { return DATA.days[state.day]; }
  function currentSection() { return currentDay().sections[state.section]; }
  function currentPage() { return currentSection().pages[state.page]; }
  function keyOf(d=state.day, s=state.section) { return `${d}:${s}`; }
  function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }
  function pad2(n) { return String(n).padStart(2,'0'); }
  function dayDate(d) { return d.date.slice(-2); }
  function allPagesBefore() {
    let n = 0;
    DATA.days.forEach((d, di) => d.sections.forEach((s, si) => s.pages.forEach((p, pi) => { if (di < state.day || (di === state.day && (si < state.section || (si === state.section && pi <= state.page)))) n++; })));
    return n;
  }
  function totalPages() { return DATA.summary.pageCount; }
  function escapeAttr(s) { return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
  function renderTerrain(day, section, page) {
    const label = `${section.key} · ${day.weekdayFull}`;
    const num = `${day.no}/${pad2(page.rawIndex)}`;
    return `<div class="terrain" aria-hidden="true"><span class="art-label">${escapeAttr(label)}</span><span class="art-no">${escapeAttr(num)}</span><svg viewBox="0 0 320 90" preserveAspectRatio="none"><path d="M0 68 C42 38 74 78 112 46 C146 16 174 56 205 35 C242 11 276 46 320 24" fill="none" stroke="#111" stroke-opacity=".72" stroke-width="1.2"/><path d="M0 78 C38 59 72 82 112 68 C148 56 174 73 214 52 C252 32 290 54 320 41" fill="none" stroke="#111" stroke-opacity=".32" stroke-width="1"/><path d="M0 90 L0 76 C54 58 88 92 132 73 C174 55 211 88 255 63 C284 46 305 50 320 44 L320 90 Z" fill="#111" fill-opacity=".045"/></svg></div>`;
  }
  function renderPage(direction='right') {
    const d = currentDay(), s = currentSection(), p = currentPage();
    const isCover = p.type === 'cover';
    const dayNote = (state.section === 0 && state.page === 0 && d.note_html) ? `<div class="day-note-inline">${d.note_html}</div>` : '';
    const pageTitle = p.title.replace(/^Page\s+\d+\s+·\s*/, '');
    const cls = direction ? `enter-${direction}` : '';
    const countText = `${pad2(state.page+1)} / ${pad2(s.pages.length)}`;
    const html = `
      <article class="article-page type-${p.type} ${isCover?'type-cover':''} ${cls}">
        <div class="page-frame">
          <main class="page-main">
            <header class="page-kicker">
              <div class="kicker-left"><div class="micro">${d.date} · ${d.weekdayFull} · No.${d.no}</div><div class="theme-line">${escapeAttr(d.theme)}</div></div>
              <div class="page-count"><b>${countText}</b>${s.key}</div>
            </header>
            <div class="cover-meta">
              <div class="issue-no">NO.<b>${d.no}</b></div>
              <div class="section-pill">${s.num} ${s.key} · ${s.ko}</div>
            </div>
            <h1 class="article-title">${escapeAttr(isCover ? s.title : pageTitle)}</h1>
            <h2 class="page-subtitle">${escapeAttr(isCover ? pageTitle : s.title)}</h2>
            <div class="page-copy">${p.body_html}${dayNote}</div>
            <div class="page-art">${renderTerrain(d,s,p)}</div>
          </main>
          <aside class="page-meter-lane" aria-hidden="true"><div class="page-meter" data-page-meter>${renderMeterHTML(s, state.page)}</div></aside>
        </div>
      </article>`;
    el.stage.innerHTML = html;
    renderChrome();
    requestFrameLayout();
  }
  function renderChrome() {
    const d = currentDay(), s = currentSection();
    [...el.dayNav.children].forEach((b,i)=>b.classList.toggle('active', i===state.day));
    [...el.rail.children].forEach((b,i)=>b.classList.toggle('active', i===state.section));
    const meter = el.stage.querySelector('[data-page-meter]');
    if (meter) meter.innerHTML = renderMeterHTML(s, state.page);
    el.progress.style.width = `${(allPagesBefore()/totalPages())*100}%`;
    document.title = `${d.weekdayFull} No.${d.no} · ${s.key} · Achmage Society Magazine`;
  }
  function saveLast() { state.lastPages[keyOf()] = state.page; }
  function goDay(i) {
    const old = state.day;
    if (i === old) { state.section = 0; state.page = 0; renderPage('down'); return; }
    saveLast(); state.day = clamp(i,0,DATA.days.length-1); state.section = 0; state.page = state.lastPages[keyOf()] || 0; renderPage(i>old?'right':'left');
  }
  function goSection(i, fromMap=false) {
    if (i === state.section && !fromMap) { state.page = 0; renderPage('down'); return; }
    const old = state.section; saveLast(); state.section = clamp(i,0,currentDay().sections.length-1); state.page = state.lastPages[keyOf()] || 0; renderPage(state.section > old ? 'right' : 'left');
  }
  function goPage(i, dir=null) {
    const old = state.page; state.page = clamp(i,0,currentSection().pages.length-1); renderPage(dir || (state.page>old?'up':'down'));
  }
  function nextPage() { if (state.page < currentSection().pages.length-1) goPage(state.page+1,'up'); else toast('마지막 페이지입니다'); }
  function prevPage() { if (state.page > 0) goPage(state.page-1,'down'); else toast('첫 페이지입니다'); }
  function nextSection() { if (state.section < currentDay().sections.length-1) goSection(state.section+1); else toast('마지막 섹션입니다'); }
  function prevSection() { if (state.section > 0) goSection(state.section-1); else toast('첫 섹션입니다'); }
  function toast(msg) { el.toast.textContent = msg; el.toast.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.toast.classList.remove('show'),900); }
  function initChrome() {
    el.dayNav.innerHTML = DATA.days.map((d,i)=>`<button class="day-btn" type="button" data-day="${i}"><span>${d.weekday}</span><b>${dayDate(d)}</b></button>`).join('');
    el.rail.innerHTML = DATA.sectionOrder.map((k,i)=>`<button class="section-tab" type="button" data-section="${i}" data-ko="${sectionNameKo(k)}">${k}</button>`).join('');
    el.dayNav.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',()=>{ const old=state.day; const ni=Number(b.dataset.day); saveLast(); state.day=ni; state.section=0; state.page=0; renderPage(ni>old?'right':'left'); }));
    el.rail.querySelectorAll('[data-section]').forEach(b=>b.addEventListener('click',()=>goSection(Number(b.dataset.section))));
  }
  function sectionNameKo(k) { return ({Intro:'입구',Issue:'쟁점',Insight:'해석',Case:'사례',Archive:'기록'})[k] || k; }
  function buildDrawer() {
    el.drawerAbout.innerHTML = DATA.front_html;
    el.drawerSources.innerHTML = DATA.sources_html;
    el.issueMap.innerHTML = DATA.days.map((d,di)=>`<div class="map-day"><div class="map-day-head"><div><small>${d.date} · No.${d.no}</small><h3>${d.weekdayFull} · ${escapeAttr(d.theme)}</h3></div><small>${d.sections.reduce((a,s)=>a+s.pages.length,0)}p</small></div><div class="map-section-row">${d.sections.map((s,si)=>`<button class="map-cell ${di===state.day&&si===state.section?'active':''}" data-map-day="${di}" data-map-section="${si}">${s.key} · ${s.pages.length}</button>`).join('')}</div></div>`).join('');
    el.issueMap.querySelectorAll('[data-map-day]').forEach(btn=>btn.addEventListener('click',()=>{ saveLast(); state.day=Number(btn.dataset.mapDay); state.section=Number(btn.dataset.mapSection); state.page=state.lastPages[keyOf()]||0; closeDrawer(); renderPage('right'); }));
  }
  function openDrawer(tab='about') { buildDrawer(); el.drawer.classList.add('open'); selectDrawerTab(tab); }
  function closeDrawer() { el.drawer.classList.remove('open'); }
  function selectDrawerTab(tab) {
    document.querySelectorAll('.drawer-tab').forEach(b=>b.classList.toggle('active', b.dataset.drawerTab===tab));
    document.querySelectorAll('.drawer-section').forEach(s=>s.classList.toggle('active', s.id===`drawer-${tab}`));
  }
  document.querySelectorAll('.drawer-tab').forEach(b=>b.addEventListener('click',()=>selectDrawerTab(b.dataset.drawerTab)));
  el.brandBtn.addEventListener('click',()=>openDrawer('about'));
  el.mapBtn.addEventListener('click',()=>openDrawer('map'));
  el.closeDrawer.addEventListener('click',closeDrawer);
  el.drawer.addEventListener('click',(e)=>{ if(e.target===el.drawer) closeDrawer(); });
  document.addEventListener('keydown',e=>{
    if(el.drawer.classList.contains('open')) { if(e.key==='Escape') closeDrawer(); return; }
    if(e.key==='ArrowRight') nextSection();
    if(e.key==='ArrowLeft') prevSection();
    if(e.key==='ArrowDown' || e.key==='PageDown') nextPage();
    if(e.key==='ArrowUp' || e.key==='PageUp') prevPage();
    if(e.key==='Home') goPage(0,'down');
    if(e.key==='End') goPage(currentSection().pages.length-1,'up');
  });
  const swipeTarget = document.getElementById('app');
  let lastSwipeT = 0;
  function processSwipe(dx, dy) {
    if(el.drawer.classList.contains('open')) return;
    const now = Date.now();
    if(now - lastSwipeT < 220) return;
    const adx = Math.abs(dx), ady = Math.abs(dy);
    if(Math.max(adx,ady) < 42) return;
    lastSwipeT = now;
    if(adx > ady*1.25) { dx<0 ? nextSection() : prevSection(); }
    else { dy<0 ? nextPage() : prevPage(); }
  }
  let pStartX=0, pStartY=0;
  swipeTarget.addEventListener('pointerdown',e=>{ pStartX=e.clientX; pStartY=e.clientY; },{passive:true});
  swipeTarget.addEventListener('pointerup',e=>{ processSwipe(e.clientX-pStartX, e.clientY-pStartY); },{passive:true});
  let tStartX=0, tStartY=0;
  swipeTarget.addEventListener('touchstart',e=>{ const t=e.touches[0]; if(!t) return; tStartX=t.clientX; tStartY=t.clientY; },{passive:true});
  swipeTarget.addEventListener('touchend',e=>{ const t=e.changedTouches[0]; if(!t) return; processSwipe(t.clientX-tStartX, t.clientY-tStartY); },{passive:true});
  function showOnboardingToast() {
    try { if(localStorage.getItem('asc-shell-onboarded') === '1') return; } catch(_) {}
    el.toast.textContent = '↕ 페이지  ·  ↔ 섹션';
    el.toast.classList.add('show');
    setTimeout(()=>el.toast.classList.remove('show'), 5000);
    try { localStorage.setItem('asc-shell-onboarded', '1'); } catch(_) {}
  }
  window.addEventListener('resize', requestFrameLayout, {passive:true});
  if ('ResizeObserver' in window) new ResizeObserver(requestFrameLayout).observe(el.stage);
  initChrome(); buildDrawer(); renderPage('right'); showOnboardingToast();
})();
</script>
</body>
</html>
