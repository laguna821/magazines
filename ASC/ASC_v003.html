근데 '탱크데이'가 꼭 5·18에서 온 거라고 봐야 되나?\"</p>\n<p>이 질문은 매우 점잖아 보인다. 학술적인 신중함 같기도 하다. 하지만 이 질문은 사실 이미 끝난 질문이다.</p>", "plain_len": 87, "type": "cover", "rawIndex": 1}, {"title": "Page 02 · The Trap of Balance", "body_md": "균형은 한국 사회에서 자주 미덕으로 다루어진다. 어떤 의제에서든 \"양쪽 입장을 들어보자\"는 태도가 안전한 위치로 여겨진다.\n\n이 자세는 많은 경우에 맞다. 다만 모든 경우에 맞지는 않다. 어떤 의제는 균형을 시도하는 순간 한쪽 자리를 침범한다. 5·18 부정 발언과 광주의 유족을 같은 자리에 놓는 일이 그렇다. 일베의 비하 밈과 그 밈에 모욕당한 광주를 같은 자리에 놓는 일이 그렇다.\n\n이 화요일의 명제는 단순하다.\n\n> **이 사건은 균형의 자리가 아니다.**", "body_html": "<p>균형은 한국 사회에서 자주 미덕으로 다루어진다. 어떤 의제에서든 \"양쪽 입장을 들어보자\"는 태도가 안전한 위치로 여겨진다.</p>\n<p>이 자세는 많은 경우에 맞다. 다만 모든 경우에 맞지는 않다. 어떤 의제는 균형을 시도하는 순간 한쪽 자리를 침범한다. 5·18 부정 발언과 광주의 유족을 같은 자리에 놓는 일이 그렇다. 일베의 비하 밈과 그 밈에 모욕당한 광주를 같은 자리에 놓는 일이 그렇다.</p>\n<p>이 화요일의 명제는 단순하다.</p>\n<blockquote><p><strong>이 사건은 균형의 자리가 아니다.</strong></p></blockquote>", "plain_len": 193, "type": "the_trap_of_balance", "rawIndex": 2}, {"title": "Page 03 · Why the Question Is Already Closed", "body_md": "\"탱크데이가 정말 5·18 비하인가\"라는 질문은 이미 여러 곳에서 같은 답을 받았다.\n\n스타벅스 코리아 본인이 광고를 내리고 사과했다. 본사가 같은 결론으로 두 번째 사과를 했다. 손정현 코리아 대표가 해임되었다. 신세계그룹이 자체조사 결과 \"사회적 역사성·민감성 부재와 리스크 관리 체계의 심각한 결함\"을 인정했다. 정용진 회장이 피의자로 입건되었다. 서울경찰청 광역수사단이 수사에 착수했다.\n\n가해 측, 책임 측, 수사 측이 모두 같은 결론을 공유한다.\n\n이 상황에서 외부의 해석 균형 시도는 사실상 가해 측보다 더 옹호적인 자리에 서는 일이 된다.", "body_html": "<p>\"탱크데이가 정말 5·18 비하인가\"라는 질문은 이미 여러 곳에서 같은 답을 받았다.</p>\n<p>스타벅스 코리아 본인이 광고를 내리고 사과했다. 본사가 같은 결론으로 두 번째 사과를 했다. 손정현 코리아 대표가 해임되었다. 신세계그룹이 자체조사 결과 \"사회적 역사성·민감성 부재와 리스크 관리 체계의 심각한 결함\"을 인정했다. 정용진 회장이 피의자로 입건되었다. 서울경찰청 광역수사단이 수사에 착수했다.</p>\n<p>가해 측, 책임 측, 수사 측이 모두 같은 결론을 공유한다.</p>\n<p>이 상황에서 외부의 해석 균형 시도는 사실상 가해 측보다 더 옹호적인 자리에 서는 일이 된다.</p>", "plain_len": 234, "type": "why_the_question_is_already_closed", "rawIndex": 3}, {"title": "Page 04 · Bridge", "body_md": "그러면 이제 \"전땅크\"라는 단어를 정확하게 짚고 가야 한다.\n\n이 단어가 일베에서 어떻게 굳어졌는지, 왜 5월 18일과 결합되는 순간 다른 의미로 회수가 불가능한지를 본다.", "body_html": "<p>그러면 이제 \"전땅크\"라는 단어를 정확하게 짚고 가야 한다.</p>\n<p>이 단어가 일베에서 어떻게 굳어졌는지, 왜 5월 18일과 결합되는 순간 다른 의미로 회수가 불가능한지를 본다.</p>", "plain_len": 73, "type": "bridge", "rawIndex": 4}], "totalPages": 4}, {"num": "02", "key": "issue", "label": "ISSUE", "ko": "쟁점", "title": "\"전땅크\"라는 단어", "short": "\"전땅크\"라는 단어", "pages": [{"title": "Page 01 · Cover", "body_md": "\"전땅크\"는 전두환 전 대통령의 별명 중 하나다. 광주에서 군이 시민을 향해 장갑차를 투입한 사실에서 유래했다. 이 별명은 한국 인터넷, 특히 일베라는 극우 커뮤니티에서 오래 반복되며 5·18 비하 슬로건의 핵심 단어가 되었다.", "body_html": "<p>\"전땅크\"는 전두환 전 대통령의 별명 중 하나다. 광주에서 군이 시민을 향해 장갑차를 투입한 사실에서 유래했다. 이 별명은 한국 인터넷, 특히 일베라는 극우 커뮤니티에서 오래 반복되며 5·18 비하 슬로건의 핵심 단어가 되었다.</p>", "plain_len": 97, "type": "cover", "rawIndex": 1}, {"title": "Page 02 · The Lineage", "body_md": "서울신문이 2026년 5월 23일 정리한 보도(R-02)는 이 단어의 계보를 다음과 같이 정리한다.\n\n5월 18일과 탱크의 조합은 소위 \"전땅크 드립\"으로 대표되는 전두환의 별명과 연관된 밈이며, 5·18 민주화운동을 폭동이라고 왜곡하거나 피해자들을 비하하는 등의 극우 성향 커뮤니티 및 단체에서 주로 사용되는 비하 목적의 밈이다.\n\n이 정리는 서울신문 한 매체의 의견이 아니다. 사건 직후 다수의 매체가 거의 같은 문장으로 이 단어를 설명했다. ZDNet Korea의 류승현 기자는 2026년 5월 21일 기사(R-03)에서 같은 단어를 같은 방식으로 설명했고, Korea Herald는 영문 보도에서 이를 \"Ilbe-style expression demeaning the May 18 Gwangju Uprising\"으로 정리했다(R-01).", "body_html": "<p>서울신문이 2026년 5월 23일 정리한 보도(R-02)는 이 단어의 계보를 다음과 같이 정리한다.</p>\n<p>5월 18일과 탱크의 조합은 소위 \"전땅크 드립\"으로 대표되는 전두환의 별명과 연관된 밈이며, 5·18 민주화운동을 폭동이라고 왜곡하거나 피해자들을 비하하는 등의 극우 성향 커뮤니티 및 단체에서 주로 사용되는 비하 목적의 밈이다.</p>\n<p>이 정리는 서울신문 한 매체의 의견이 아니다. 사건 직후 다수의 매체가 거의 같은 문장으로 이 단어를 설명했다. ZDNet Korea의 류승현 기자는 2026년 5월 21일 기사(R-03)에서 같은 단어를 같은 방식으로 설명했고, Korea Herald는 영문 보도에서 이를 \"Ilbe-style expression demeaning the May 18 Gwangju Uprising\"으로 정리했다(R-01).</p>", "plain_len": 330, "type": "the_lineage", "rawIndex": 2}, {"title": "Page 03 · The Word Cannot Be Recovered", "body_md": "한국어에서 어떤 단어들은 한 번 굳어지면 다른 의미로 회수되기 어렵다.\n\n\"전땅크\"가 그런 단어 중 하나다. 이 단어를 다른 맥락에서 쓸 수 있는 사람은 사실상 없다. 마치 어떤 사회에서 어떤 단어들이 특정한 폭력의 기억과 결합한 후로는, 그 단어를 다른 목적으로 사용하는 것 자체가 그 폭력의 자리를 다시 호출하는 일이 되는 것과 같다.\n\n스타벅스 코리아가 5월 18일에 \"탱크데이\"를 광고에 올린 순간, 그 광고는 이 회수 불가능한 단어의 자리 위에 발을 올렸다.", "body_html": "<p>한국어에서 어떤 단어들은 한 번 굳어지면 다른 의미로 회수되기 어렵다.</p>\n<p>\"전땅크\"가 그런 단어 중 하나다. 이 단어를 다른 맥락에서 쓸 수 있는 사람은 사실상 없다. 마치 어떤 사회에서 어떤 단어들이 특정한 폭력의 기억과 결합한 후로는, 그 단어를 다른 목적으로 사용하는 것 자체가 그 폭력의 자리를 다시 호출하는 일이 되는 것과 같다.</p>\n<p>스타벅스 코리아가 5월 18일에 \"탱크데이\"를 광고에 올린 순간, 그 광고는 이 회수 불가능한 단어의 자리 위에 발을 올렸다.</p>", "plain_len": 191, "type": "the_word_cannot_be_recovered", "rawIndex": 3}, {"title": "Page 04 · No Other Reading", "body_md": "회수 불가능한 단어의 특징은 단순하다. 다른 읽기가 가능하지 않다는 것이다.\n\n\"탱크\"가 일반적으로 다른 의미로 사용될 수 있느냐의 문제가 아니다. \"5월 18일 + 탱크\"라는 두 단어의 조합이 한국어 안에서 다른 의미로 읽힐 수 있느냐의 문제다. 그리고 그 답은 명확히 \"아니오\"다.", "body_html": "<p>회수 불가능한 단어의 특징은 단순하다. 다른 읽기가 가능하지 않다는 것이다.</p>\n<p>\"탱크\"가 일반적으로 다른 의미로 사용될 수 있느냐의 문제가 아니다. \"5월 18일 + 탱크\"라는 두 단어의 조합이 한국어 안에서 다른 의미로 읽힐 수 있느냐의 문제다. 그리고 그 답은 명확히 \"아니오\"다.</p>", "plain_len": 120, "type": "no_other_reading", "rawIndex": 4}, {"title": "Page 05 · Bridge", "body_md": "이 답이 명확하기 때문에, 우리는 이 사건을 \"그럴 의도는 아니었을 수도 있는데\"라는 양비론적 자리에서 다룰 필요가 없다.\n\n다음 탭에서는 이 명확함이 왜 이번 호의 핵심 전제인지를 더 짚는다.", "body_html": "<p>이 답이 명확하기 때문에, 우리는 이 사건을 \"그럴 의도는 아니었을 수도 있는데\"라는 양비론적 자리에서 다룰 필요가 없다.</p>\n<p>다음 탭에서는 이 명확함이 왜 이번 호의 핵심 전제인지를 더 짚는다.</p>", "plain_len": 80, "type": "bridge", "rawIndex": 5}], "totalPages": 5}, {"num": "03", "key": "insight", "label": "INSIGHT", "ko": "통찰", "title": "해석의 옵션이 없다", "short": "해석의 옵션이 없다", "pages": [{"title": "Page 01 · Concept", "body_md": "이 사건의 핵심 통찰은 한 문장이다.\n\n> **이 사건에는 해석의 옵션이 없다.**\n\n이 문장은 강해 보인다. 하지만 강함이 이유는 아니다. 이 문장이 강한 이유는, 이미 사실 자료가 강하기 때문이다.", "body_html": "<p>이 사건의 핵심 통찰은 한 문장이다.</p>\n<blockquote><p><strong>이 사건에는 해석의 옵션이 없다.</strong></p></blockquote>\n<p>이 문장은 강해 보인다. 하지만 강함이 이유는 아니다. 이 문장이 강한 이유는, 이미 사실 자료가 강하기 때문이다.</p>", "plain_len": 82, "type": "concept", "rawIndex": 1}, {"title": "Page 02 · The Self-Confession", "body_md": "가장 강한 자료는 가해 측 자신의 인정이다.\n\n신세계그룹은 5월 26일 자체조사 결과를 발표하면서 \"이번 사안은 단순 실무자 과실을 넘어 스타벅스 내부의 사회적 역사성·민감성 부재와 리스크 관리 체계의 심각한 결함을 드러냈다\"고 인정했다(R-15, R-16). 이 문장 안에는 \"사회적 역사성\"이라는 단어가 있다. 이 단어는 곧 \"5·18을 알지 못한 자리에서 광고가 통과되었다\"는 자기 고백이다.\n\n가해 측이 스스로 \"우리는 이 단어가 무엇을 가리키는지를 알지 못했다\"고 인정한 자리에서, 외부 관찰자가 \"그래도 다른 해석이 있을 수 있지 않은가\"를 시도하는 것은 가해 측보다 한 발 더 옹호적인 자리에 서는 일이다.", "body_html": "<p>가장 강한 자료는 가해 측 자신의 인정이다.</p>\n<p>신세계그룹은 5월 26일 자체조사 결과를 발표하면서 \"이번 사안은 단순 실무자 과실을 넘어 스타벅스 내부의 사회적 역사성·민감성 부재와 리스크 관리 체계의 심각한 결함을 드러냈다\"고 인정했다(R-15, R-16). 이 문장 안에는 \"사회적 역사성\"이라는 단어가 있다. 이 단어는 곧 \"5·18을 알지 못한 자리에서 광고가 통과되었다\"는 자기 고백이다.</p>\n<p>가해 측이 스스로 \"우리는 이 단어가 무엇을 가리키는지를 알지 못했다\"고 인정한 자리에서, 외부 관찰자가 \"그래도 다른 해석이 있을 수 있지 않은가\"를 시도하는 것은 가해 측보다 한 발 더 옹호적인 자리에 서는 일이다.</p>", "plain_len": 263, "type": "the_self-confession", "rawIndex": 2}, {"title": "Page 03 · The Police Investigation", "body_md": "서울경찰청 광역수사단 공공범죄수사대가 정용진 회장과 손정현 전 대표를 5·18민주화운동 유족과 광주 시민에 대한 모욕·명예훼손 혐의로 수사 중이다. 한국경제의 최영총 기자가 2026년 5월 21일 보도한 내용이다(R-14).\n\n수사기관이 이 사건을 \"혐의 있음\"으로 보고 정식 수사에 착수한 자리에서도, 외부의 해석 균형 시도는 가해 측보다 더 적극적인 옹호가 된다.", "body_html": "<p>서울경찰청 광역수사단 공공범죄수사대가 정용진 회장과 손정현 전 대표를 5·18민주화운동 유족과 광주 시민에 대한 모욕·명예훼손 혐의로 수사 중이다. 한국경제의 최영총 기자가 2026년 5월 21일 보도한 내용이다(R-14).</p>\n<p>수사기관이 이 사건을 \"혐의 있음\"으로 보고 정식 수사에 착수한 자리에서도, 외부의 해석 균형 시도는 가해 측보다 더 적극적인 옹호가 된다.</p>", "plain_len": 160, "type": "the_police_investigation", "rawIndex": 3}, {"title": "Page 04 · What Balance Costs", "body_md": "균형은 비용이 든다. 어떤 경우에는 그 비용이 가해 측에 청구되지 않고 피해 측에 청구된다.\n\n이번 사건에서 \"탱크가 정말 5·18 비하인가\"를 묻는 자리는, 광주의 유족에게 \"당신이 모욕당했다는 그 인식이 정말 정당한지 다시 한 번 증명해 보라\"고 요구하는 자리가 된다. 알바생에게 \"당신이 일베벅스 알바라는 별명을 부담스러워하는 그 감정이 정말 정당한지 다시 증명해 보라\"고 요구하는 자리가 된다.\n\n균형의 비용이 잘못된 곳에 청구되는 자리는, 균형이라는 단어를 쓸 자리가 아니다.", "body_html": "<p>균형은 비용이 든다. 어떤 경우에는 그 비용이 가해 측에 청구되지 않고 피해 측에 청구된다.</p>\n<p>이번 사건에서 \"탱크가 정말 5·18 비하인가\"를 묻는 자리는, 광주의 유족에게 \"당신이 모욕당했다는 그 인식이 정말 정당한지 다시 한 번 증명해 보라\"고 요구하는 자리가 된다. 알바생에게 \"당신이 일베벅스 알바라는 별명을 부담스러워하는 그 감정이 정말 정당한지 다시 증명해 보라\"고 요구하는 자리가 된다.</p>\n<p>균형의 비용이 잘못된 곳에 청구되는 자리는, 균형이라는 단어를 쓸 자리가 아니다.</p>", "plain_len": 205, "type": "what_balance_costs", "rawIndex": 4}, {"title": "Page 05 · Bridge", "body_md": "이 명제를 받아들이고 나면, 우리는 이제 나머지 5일을 다른 자리에서 시작할 수 있다.\n\n다음 탭에서는 \"그러면 진짜 모르고 했을 수도 있지 않은가\"라는 마지막 형태의 균형 시도에 답한다.", "body_html": "<p>이 명제를 받아들이고 나면, 우리는 이제 나머지 5일을 다른 자리에서 시작할 수 있다.</p>\n<p>다음 탭에서는 \"그러면 진짜 모르고 했을 수도 있지 않은가\"라는 마지막 형태의 균형 시도에 답한다.</p>", "plain_len": 78, "type": "bridge", "rawIndex": 5}], "totalPages": 5}, {"num": "04", "key": "case", "label": "CASE", "ko": "사례", "title": "진짜 모르고 쓴 사례 vs 이번 사건", "short": "진짜 모르고 쓴 사례 vs 이번 사건", "pages": [{"title": "Page 01 · Cover", "body_md": "글로벌 기업이 어떤 사회의 역사적 단어를 모르고 광고에 사용한 사례는 실제로 있다.\n\n이 사례들과 스타벅스 코리아 사건을 정확히 비교하면, 왜 이번 사건이 \"진짜 몰랐을 수도 있다\" 자리에 놓일 수 없는지가 분명해진다.", "body_html": "<p>글로벌 기업이 어떤 사회의 역사적 단어를 모르고 광고에 사용한 사례는 실제로 있다.</p>\n<p>이 사례들과 스타벅스 코리아 사건을 정확히 비교하면, 왜 이번 사건이 \"진짜 몰랐을 수도 있다\" 자리에 놓일 수 없는지가 분명해진다.</p>", "plain_len": 91, "type": "cover", "rawIndex": 1}, {"title": "Page 02 · Two Reference Cases", "body_md": "첫 번째 사례. 2018년 D&G(돌체앤가바나)는 중국 시장 대상 광고에서 중국 모델이 젓가락으로 피자를 먹는 영상과 디자이너의 인종차별적 발언이 결합해 중국 시장 전체에서 보이콧을 당했다. D&G는 중국 시장 사정을 잘 모르는 이탈리아 본사 디자이너의 결재라인에서 사고가 났다. 사후 처리에서 D&G는 책임자를 해임하고, 중국 시장에 직접 사과했다.\n\n두 번째 사례. 같은 해 H&M은 흑인 어린이 모델에게 \"Coolest Monkey in the Jungle\"이라는 문구가 적힌 후드를 입혀 인종차별 항의를 받았다. H&M은 본사가 스웨덴이고, 흑인 사회의 \"monkey\"라는 단어 사용 금기에 대한 감수성이 낮은 상태에서 결재라인이 통과된 것으로 분석되었다.\n\n두 사례 모두 \"본사의 감수성 부재\"가 있었다는 점에서 어느 정도 무지 변호의 여지가 있었다.", "body_html": "<p>첫 번째 사례. 2018년 D&amp;G(돌체앤가바나)는 중국 시장 대상 광고에서 중국 모델이 젓가락으로 피자를 먹는 영상과 디자이너의 인종차별적 발언이 결합해 중국 시장 전체에서 보이콧을 당했다. D&amp;G는 중국 시장 사정을 잘 모르는 이탈리아 본사 디자이너의 결재라인에서 사고가 났다. 사후 처리에서 D&amp;G는 책임자를 해임하고, 중국 시장에 직접 사과했다.</p>\n<p>두 번째 사례. 같은 해 H&amp;M은 흑인 어린이 모델에게 \"Coolest Monkey in the Jungle\"이라는 문구가 적힌 후드를 입혀 인종차별 항의를 받았다. H&amp;M은 본사가 스웨덴이고, 흑인 사회의 \"monkey\"라는 단어 사용 금기에 대한 감수성이 낮은 상태에서 결재라인이 통과된 것으로 분석되었다.</p>\n<p>두 사례 모두 \"본사의 감수성 부재\"가 있었다는 점에서 어느 정도 무지 변호의 여지가 있었다.</p>", "plain_len": 327, "type": "two_reference_cases", "rawIndex": 2}, {"title": "Page 03 · Why Starbucks Korea Is Different", "body_md": "스타벅스 코리아는 위 두 사례와 결정적으로 다르다.\n\n이번 사고의 결재라인은 한국에 있었다. 신세계그룹 자체조사가 확인한 4단계 결재라인 — 팀장, 담당, 본부장, 대표이사 — 은 모두 한국인이다(R-16). 한국에서 한국 시장 대상으로 한국 텀블러를 한국 매장에서 파는 광고를, 한국 결재라인이 5월 18일에 \"탱크데이\"라는 문구로 통과시켰다.\n\nD&G와 H&M의 경우, 결재한 사람이 그 단어의 사회적 무게를 모를 수도 있었다. 스타벅스 코리아의 경우, 결재한 사람이 그 단어의 사회적 무게를 모를 수 없었다. 알 수 있는 자리에 있었고, 알아야 하는 자리에 있었고, 알지 못한 채로 결재했다면 그것 자체가 직무 유기다.", "body_html": "<p>스타벅스 코리아는 위 두 사례와 결정적으로 다르다.</p>\n<p>이번 사고의 결재라인은 한국에 있었다. 신세계그룹 자체조사가 확인한 4단계 결재라인 — 팀장, 담당, 본부장, 대표이사 — 은 모두 한국인이다(R-16). 한국에서 한국 시장 대상으로 한국 텀블러를 한국 매장에서 파는 광고를, 한국 결재라인이 5월 18일에 \"탱크데이\"라는 문구로 통과시켰다.</p>\n<p>D&amp;G와 H&amp;M의 경우, 결재한 사람이 그 단어의 사회적 무게를 모를 수도 있었다. 스타벅스 코리아의 경우, 결재한 사람이 그 단어의 사회적 무게를 모를 수 없었다. 알 수 있는 자리에 있었고, 알아야 하는 자리에 있었고, 알지 못한 채로 결재했다면 그것 자체가 직무 유기다.</p>", "plain_len": 264, "type": "why_starbucks_korea_is_different", "rawIndex": 3}, {"title": "Page 04 · Bridge", "body_md": "여기까지가 양비론에 답하는 자리다.\n\n남은 5일은, 이 자리 위에서 진행되는 광범위한 2차 피해를 본다. 가장 먼저 매장에서 일하는 23,984명의 자리부터.", "body_html": "<p>여기까지가 양비론에 답하는 자리다.</p>\n<p>남은 5일은, 이 자리 위에서 진행되는 광범위한 2차 피해를 본다. 가장 먼저 매장에서 일하는 23,984명의 자리부터.</p>", "plain_len": 68, "type": "bridge", "rawIndex": 4}], "totalPages": 4}, {"num": "05", "key": "archive", "label": "ARCHIVE", "ko": "자료", "title": "매개 보도로 본 일베 밈의 자취", "short": "매개 보도로 본 일베 밈의 자취", "pages": [{"title": "Page 01 · Source List", "body_md": "이 날의 본문에서 인용한 자료는 다음과 같다.\n\n- R-01 Korea Herald, \"'Tank Day' tumbler promo pulls Starbucks Korea into ideological fight\" (2026-05-week 21)\n- R-02 서울신문, \"스타벅스 '탱크데이' 논란에 내부서도 성토\" (이보희 기자, 2026-05-23)\n- R-03 ZDNet Korea, \"스타벅스 '5·18 탱크데이' 논란, SNS서 풍자 넘어 희화화 우려↑\" (류승현 기자, 2026-05-21)\n- R-14 한국경제, \"스타벅스 '탱크데이' 논란, 서울경찰청 수사\" (최영총 기자, 2026-05-21)\n- R-15 전자신문, \"정용진 회장, '스벅 5·18 폄훼' 직접 대국민 사과… '모든 책임은 저에게 있다'\" (윤희석 기자, 2026-05-26)\n- R-16 YTN, \"[뉴스UP] '위기'의 신세계… 정용진, 대국민 사과\" (김지선 기자, 2026-05-26)", "body_html": "<p>이 날의 본문에서 인용한 자료는 다음과 같다.</p>\n<ul><li>R-01 Korea Herald, \"'Tank Day' tumbler promo pulls Starbucks Korea into ideological fight\" (2026-05-week 21)</li><li>R-02 서울신문, \"스타벅스 '탱크데이' 논란에 내부서도 성토\" (이보희 기자, 2026-05-23)</li><li>R-03 ZDNet Korea, \"스타벅스 '5·18 탱크데이' 논란, SNS서 풍자 넘어 희화화 우려↑\" (류승현 기자, 2026-05-21)</li><li>R-14 한국경제, \"스타벅스 '탱크데이' 논란, 서울경찰청 수사\" (최영총 기자, 2026-05-21)</li><li>R-15 전자신문, \"정용진 회장, '스벅 5·18 폄훼' 직접 대국민 사과… '모든 책임은 저에게 있다'\" (윤희석 기자, 2026-05-26)</li><li>R-16 YTN, \"[뉴스UP] '위기'의 신세계… 정용진, 대국민 사과\" (김지선 기자, 2026-05-26)</li></ul>", "plain_len": 399, "type": "source_list", "rawIndex": 1}, {"title": "Page 02 · A Note on the Meme Reference", "body_md": "이 매거진은 일베 커뮤니티의 직접 게시물·캡처·콘텐츠를 본문에 옮기지 않는다.\n\n대신 이번 사건을 다룬 한국 매체들이 같은 단어를 같은 방식으로 설명한 정리(R-02, R-03)를 학술적 매개로 한 차례만 사용한다. 매거진이 일베 표현의 자료를 다시 복사·배포하는 자리가 되지 않기 위한 정책이다.", "body_html": "<p>이 매거진은 일베 커뮤니티의 직접 게시물·캡처·콘텐츠를 본문에 옮기지 않는다.</p>\n<p>대신 이번 사건을 다룬 한국 매체들이 같은 단어를 같은 방식으로 설명한 정리(R-02, R-03)를 학술적 매개로 한 차례만 사용한다. 매거진이 일베 표현의 자료를 다시 복사·배포하는 자리가 되지 않기 위한 정책이다.</p>", "plain_len": 128, "type": "a_note_on_the_meme_reference", "rawIndex": 2}, {"title": "Page 03 · A Reading Note for Future Reference", "body_md": "이번 호의 화요일은 균형 시도에 답하기 위해 마련된 자리다.\n\n이 호 안에서 이 자리가 다시 호출되는 곳은 두 군데다. 목요일의 자기 검열 자리, 그리고 토요일의 기업 윤리 시스템 자리. 두 자리 모두 \"정말 몰랐을 수도 있다\"는 자기 변호가 들어올 때, 화요일의 자료로 돌아와서 답한다.", "body_html": "<p>이번 호의 화요일은 균형 시도에 답하기 위해 마련된 자리다.</p>\n<p>이 호 안에서 이 자리가 다시 호출되는 곳은 두 군데다. 목요일의 자기 검열 자리, 그리고 토요일의 기업 윤리 시스템 자리. 두 자리 모두 \"정말 몰랐을 수도 있다\"는 자기 변호가 들어올 때, 화요일의 자료로 돌아와서 답한다.</p>", "plain_len": 117, "type": "a_reading_note_for_future_reference", "rawIndex": 3}, {"title": "Page 04 · End of Day Two", "body_md": "화요일이 닫혔다. 다음 날부터는 피해의 자리다.\n\n---", "body_html": "<p>화요일이 닫혔다. 다음 날부터는 피해의 자리다.</p>\n<p>---</p>", "plain_len": 24, "type": "end_of_day_two", "rawIndex": 4}], "totalPages": 4}]}, {"date": "2026-05-20", "weekday": "수", "weekdayFull": "수요일", "no": "003", "titleLine": "알바생 1차 피해 (KILLING POINT)", "theme": "알바생 1차 피해 (KILLING POINT)", "note_html": "<div class=\"note-card\"><strong>수요일의 역할</strong><p>수요일은 이 호의 첫 번째 핵심 자리다. 광고 한 건이 결재된 자리에서 가장 먼저 비용을 떠안은 사람들은 광고를 만든 본사가 아니라, 그 광고와 가장 멀리 떨어져 있던 매장의 알바생들이었다. 이 자리의 모든 인용은 매체·기자·발행일·제목 5필드를 본문에 그대로 둔다. 익명 SNS 단독 인용은 사용하지 않는다.</p></div>", "sections": [{"num": "01", "key": "intro", "label": "INTRO", "ko": "도입", "title": "\"오늘부터 일베벅스 알바입니다\"", "short": "\"오늘부터 일베벅스 알바입니다\"", "pages": [{"title": "Page 01 · Cover", "body_md": "논란이 시작되고 이틀이 지난 어느 날, 스타벅스 코리아 매장의 한 파트너가 직원 게시판에 짧은 글을 올렸다.\n\n\"오늘부터 일베벅스 알바입니다.\"", "body_html": "<p>논란이 시작되고 이틀이 지난 어느 날, 스타벅스 코리아 매장의 한 파트너가 직원 게시판에 짧은 글을 올렸다.</p>\n<p>\"오늘부터 일베벅스 알바입니다.\"</p>", "plain_len": 61, "type": "cover", "rawIndex": 1}, {"title": "Page 02 · The Silence Around It", "body_md": "이 한 줄에는 분노가 아니라 자조가 있었다. 자조의 어휘는 한국어에서 가장 견디기 어려운 어휘에 속한다.\n\n이 글이 올라온 시각, 본사의 마케팅 결정에 직접 관여한 사람은 한 명도 그 매장에 없었다. 그 매장에 있었던 사람은 출근한 파트너들이었다. 출근한 알바생들이었다. 그날 손님을 받아야 했던 사람들이었다.\n\n광고 한 건이 결재된 자리에서, 가장 먼저 답해야 했던 사람은 광고를 만든 사람들이 아니라 광고와 가장 멀리 떨어져 있던 사람들이었다.", "body_html": "<p>이 한 줄에는 분노가 아니라 자조가 있었다. 자조의 어휘는 한국어에서 가장 견디기 어려운 어휘에 속한다.</p>\n<p>이 글이 올라온 시각, 본사의 마케팅 결정에 직접 관여한 사람은 한 명도 그 매장에 없었다. 그 매장에 있었던 사람은 출근한 파트너들이었다. 출근한 알바생들이었다. 그날 손님을 받아야 했던 사람들이었다.</p>\n<p>광고 한 건이 결재된 자리에서, 가장 먼저 답해야 했던 사람은 광고를 만든 사람들이 아니라 광고와 가장 멀리 떨어져 있던 사람들이었다.</p>", "plain_len": 186, "type": "the_silence_around_it", "rawIndex": 2}, {"title": "Page 03 · The Question of the Day", "body_md": "수요일의 질문은 이렇게 시작한다.\n\n본사 결정의 비용은 누가 떠안았는가.\n\n매체가 이 질문에 가장 일찍, 가장 정확하게 답하기 시작한 자리는 5월 23일이었다. 그날 하루에만 파이낸셜뉴스, 쿠키뉴스, 서울신문, 지데일리가 거의 동시에 매장 직원·알바생의 성토글을 정면으로 다뤘다.", "body_html": "<p>수요일의 질문은 이렇게 시작한다.</p>\n<p>본사 결정의 비용은 누가 떠안았는가.</p>\n<p>매체가 이 질문에 가장 일찍, 가장 정확하게 답하기 시작한 자리는 5월 23일이었다. 그날 하루에만 파이낸셜뉴스, 쿠키뉴스, 서울신문, 지데일리가 거의 동시에 매장 직원·알바생의 성토글을 정면으로 다뤘다.</p>", "plain_len": 121, "type": "the_question_of_the_day", "rawIndex": 3}, {"title": "Page 04 · The Pattern of the Reporting", "body_md": "네 매체의 보도는 형식적으로 유사했다. 본사 측 입장보다 매장 측 목소리에 우선 자리를 줬다. 한 직원의 성토글을 길게 인용했고, 그 인용을 통해 23,984명 파트너의 자리를 대표하게 했다.\n\n이 매거진의 수요일은 같은 자리에 선다. 본사 측 해명보다 매장 측 목소리에 먼저 자리를 준다. 다만 그 목소리를 인용할 때는, 매체·기자·발행일·제목 5필드를 본문에 그대로 둔다. 그래야 그 목소리가 누구의 어떤 보도를 매개로 우리에게 도달했는지가 흐려지지 않는다.", "body_html": "<p>네 매체의 보도는 형식적으로 유사했다. 본사 측 입장보다 매장 측 목소리에 우선 자리를 줬다. 한 직원의 성토글을 길게 인용했고, 그 인용을 통해 23,984명 파트너의 자리를 대표하게 했다.</p>\n<p>이 매거진의 수요일은 같은 자리에 선다. 본사 측 해명보다 매장 측 목소리에 먼저 자리를 준다. 다만 그 목소리를 인용할 때는, 매체·기자·발행일·제목 5필드를 본문에 그대로 둔다. 그래야 그 목소리가 누구의 어떤 보도를 매개로 우리에게 도달했는지가 흐려지지 않는다.</p>", "plain_len": 195, "type": "the_pattern_of_the_reporting", "rawIndex": 4}, {"title": "Page 05 · Bridge", "body_md": "다음 탭에서 그 성토글의 핵심 문장을 본다.", "body_html": "<p>다음 탭에서 그 성토글의 핵심 문장을 본다.</p>", "plain_len": 18, "type": "bridge", "rawIndex": 5}], "totalPages": 5}, {"num": "02", "key": "issue", "label": "ISSUE", "ko": "쟁점", "title": "\"너 때문에 몇천명 피해\"", "short": "\"너 때문에 몇천명 피해\"", "pages": [{"title": "Page 01 · Cover", "body_md": "파이낸셜뉴스의 성민서 기자가 2026년 5월 23일 보도한 \"당장 연장근무 다 끊겨…스타벅스 내부직원 '탱크데이' 논란에 '참담하다' 성토글\"에는 다음과 같은 인용이 들어 있다(R-04).\n\n> **\"너 때문에 피해를 보는 파트너만 몇 천 명이다. 연장이 필요한 파트너는 연장이 끊겨서 생계가 힘들어지고.\"**\n\n이 한 문장에는 마케팅 회의에서는 전혀 보이지 않았을 다섯 개의 자리가 있다.", "body_html": "<p>파이낸셜뉴스의 성민서 기자가 2026년 5월 23일 보도한 \"당장 연장근무 다 끊겨…스타벅스 내부직원 '탱크데이' 논란에 '참담하다' 성토글\"에는 다음과 같은 인용이 들어 있다(R-04).</p>\n<blockquote><p><strong>\"너 때문에 피해를 보는 파트너만 몇 천 명이다. 연장이 필요한 파트너는 연장이 끊겨서 생계가 힘들어지고.\"</strong></p></blockquote>\n<p>이 한 문장에는 마케팅 회의에서는 전혀 보이지 않았을 다섯 개의 자리가 있다.</p>", "plain_len": 168, "type": "cover", "rawIndex": 1}, {"title": "Page 02 · Five Hidden Seats", "body_md": "다섯 개의 자리를 풀면 이렇다.\n\n- \"너\" — 마케팅을 결재한 누군가\n- \"피해를 보는 파트너\" — 23,984명 중 일부의 직접 피해자\n- \"몇 천 명\" — 그 직접 피해자의 규모\n- \"연장이 필요한 파트너\" — 시급제로 생계를 꾸리는 알바생\n- \"연장이 끊겨서 생계가 힘들어지고\" — 그 끊김의 실시간 결과\n\n이 다섯 개의 자리가 본사 결재 회의실 안에는 한 자리도 들어가 있지 않았다.", "body_html": "<p>다섯 개의 자리를 풀면 이렇다.</p>\n<ul><li>\"너\" — 마케팅을 결재한 누군가</li><li>\"피해를 보는 파트너\" — 23,984명 중 일부의 직접 피해자</li><li>\"몇 천 명\" — 그 직접 피해자의 규모</li><li>\"연장이 필요한 파트너\" — 시급제로 생계를 꾸리는 알바생</li><li>\"연장이 끊겨서 생계가 힘들어지고\" — 그 끊김의 실시간 결과</li></ul>\n<p>이 다섯 개의 자리가 본사 결재 회의실 안에는 한 자리도 들어가 있지 않았다.</p>", "plain_len": 156, "type": "five_hidden_seats", "rawIndex": 2}, {"title": "Page 03 · The Severance", "body_md": "같은 보도에는 또 다른 문장이 있다.\n\n> **\"당장에 (너 때문에) 날아간 모가지만 수십 명.\"**\n\n서울신문의 이보희 기자가 같은 5월 23일 보도한 \"스타벅스 '탱크데이' 논란에 내부서도 성토\"는 같은 글을 조금 다른 부분에서 인용했다(R-06).\n\n> **\"너 때문에 당장 해고된 사람만 수십 명.\"**\n\n수십 명. 광고 한 건이 결재된 다음 며칠 안에, 매장 단위의 인력 조정이 시작되었다는 뜻이다. 매장에 와본 적도 없는 결재자 7명의 회의실 결정이, 매장에서 일하는 수십 명의 생계를 끊었다.", "body_html": "<p>같은 보도에는 또 다른 문장이 있다.</p>\n<blockquote><p><strong>\"당장에 (너 때문에) 날아간 모가지만 수십 명.\"</strong></p></blockquote>\n<p>서울신문의 이보희 기자가 같은 5월 23일 보도한 \"스타벅스 '탱크데이' 논란에 내부서도 성토\"는 같은 글을 조금 다른 부분에서 인용했다(R-06).</p>\n<blockquote><p><strong>\"너 때문에 당장 해고된 사람만 수십 명.\"</strong></p></blockquote>\n<p>수십 명. 광고 한 건이 결재된 다음 며칠 안에, 매장 단위의 인력 조정이 시작되었다는 뜻이다. 매장에 와본 적도 없는 결재자 7명의 회의실 결정이, 매장에서 일하는 수십 명의 생계를 끊었다.</p>", "plain_len": 210, "type": "the_severance", "rawIndex": 3}, {"title": "Page 04 · The Customer Service Cost", "body_md": "쿠키뉴스의 이찬종 기자가 같은 5월 23일 보도한 \"스타벅스 '탱크데이' 논란 속 내부 성토… '현장 근로자에 피해 전가'\"는 알바생이 견뎌야 하는 또 다른 비용에 자리를 줬다(R-05).\n\n> **\"파트너들은 자기가 하지도 않은 일에 눈치를 보며 손님들에게 죄송해하고 있다.\"**\n\n이 자리에서 \"죄송하다\"는 누가 누구에게 하는 말인가. 광고를 결재한 사람이 광주에게 하는 말이 아니라, 광고와 무관한 알바생이 광고를 본 손님에게 하는 말이다. 책임의 방향과 사과의 방향이 정반대다.", "body_html": "<p>쿠키뉴스의 이찬종 기자가 같은 5월 23일 보도한 \"스타벅스 '탱크데이' 논란 속 내부 성토… '현장 근로자에 피해 전가'\"는 알바생이 견뎌야 하는 또 다른 비용에 자리를 줬다(R-05).</p>\n<blockquote><p><strong>\"파트너들은 자기가 하지도 않은 일에 눈치를 보며 손님들에게 죄송해하고 있다.\"</strong></p></blockquote>\n<p>이 자리에서 \"죄송하다\"는 누가 누구에게 하는 말인가. 광고를 결재한 사람이 광주에게 하는 말이 아니라, 광고와 무관한 알바생이 광고를 본 손님에게 하는 말이다. 책임의 방향과 사과의 방향이 정반대다.</p>", "plain_len": 207, "type": "the_customer_service_cost", "rawIndex": 4}, {"title": "Page 05 · The Restructured Plans", "body_md": "지데일리의 손유지 기자가 같은 5월 23일 보도한 \"'너 때문에 몇천명 피해'…스타벅스 내부 혼란 극심\"은 매장 운영 측면의 비용을 추가했다(R-07).\n\n> **\"점장들은 근무계획과 매출 전략을 전면 수정.\"**\n\n연장 끊김, 해고, 자기 책임이 아닌 일에 대한 사과, 근무계획 수정, 매출 전략 수정. 광고 한 건의 비용이 이 다섯 줄로 이어졌다. 본사 회의실 안에서는 한 줄도 보이지 않았던 비용이다.", "body_html": "<p>지데일리의 손유지 기자가 같은 5월 23일 보도한 \"'너 때문에 몇천명 피해'…스타벅스 내부 혼란 극심\"은 매장 운영 측면의 비용을 추가했다(R-07).</p>\n<blockquote><p><strong>\"점장들은 근무계획과 매출 전략을 전면 수정.\"</strong></p></blockquote>\n<p>연장 끊김, 해고, 자기 책임이 아닌 일에 대한 사과, 근무계획 수정, 매출 전략 수정. 광고 한 건의 비용이 이 다섯 줄로 이어졌다. 본사 회의실 안에서는 한 줄도 보이지 않았던 비용이다.</p>", "plain_len": 170, "type": "the_restructured_plans", "rawIndex": 5}, {"title": "Page 06 · Bridge", "body_md": "이 다섯 줄의 비용은 우연히 흐른 것이 아니다. 이 흐름은 한국 기업의 일관된 구조 위에서 흐른다.\n\n다음 탭에서 그 구조를 본다.", "body_html": "<p>이 다섯 줄의 비용은 우연히 흐른 것이 아니다. 이 흐름은 한국 기업의 일관된 구조 위에서 흐른다.</p>\n<p>다음 탭에서 그 구조를 본다.</p>", "plain_len": 52, "type": "bridge", "rawIndex": 6}], "totalPages": 6}, {"num": "03", "key": "insight", "label": "INSIGHT", "ko": "통찰", "title": "본사 결정의 비용을 누가 떠안는 구조인가", "short": "본사 결정의 비용을 누가 떠안는 구조인가", "pages": [{"title": "Page 01 · Concept", "body_md": "이번 사건의 책임 구조는 단순한 형태로 정리된다.\n\n- **결재한 사람**: 4단계 결재라인 안의 7명\n- **비용을 떠안은 사람**: 23,984명 파트너 + 매일 매장에 들어오는 약 1,500만 회원\n\n7 vs 23,984. 비율로 보면 1 대 3,426이다.", "body_html": "<p>이번 사건의 책임 구조는 단순한 형태로 정리된다.</p>\n<ul><li><strong>결재한 사람</strong>: 4단계 결재라인 안의 7명</li><li><strong>비용을 떠안은 사람</strong>: 23,984명 파트너 + 매일 매장에 들어오는 약 1,500만 회원</li></ul>\n<p>7 vs 23,984. 비율로 보면 1 대 3,426이다.</p>", "plain_len": 111, "type": "concept", "rawIndex": 1}, {"title": "Page 02 · The 4-Stage Approval Line", "body_md": "이 비대칭의 본사 측 자리는 신세계그룹이 5월 26일 자체조사 결과로 공식 인정했다. YTN의 김지선 기자가 같은 날 보도한 \"[뉴스UP] '위기'의 신세계… 정용진, 대국민 사과\"는 다음과 같이 정리한다(R-16).\n\n> **\"팀장, 담당, 본부장, 대표이사 총 4단계의 보고 절차를 거쳐 진행되었습니다.\"**\n\n그리고 같은 보도는 한 줄을 더 보탠다.\n\n> **\"행사를 주관한 스타벅스 코리아 마케팅 관련자 7명 중 일부는 해당 마케팅 디자인 시안이 담긴 메일의 첨부파일조차 열지 않고 관행적으로 승인한 것으로 확인되었습니다.\"**", "body_html": "<p>이 비대칭의 본사 측 자리는 신세계그룹이 5월 26일 자체조사 결과로 공식 인정했다. YTN의 김지선 기자가 같은 날 보도한 \"[뉴스UP] '위기'의 신세계… 정용진, 대국민 사과\"는 다음과 같이 정리한다(R-16).</p>\n<blockquote><p><strong>\"팀장, 담당, 본부장, 대표이사 총 4단계의 보고 절차를 거쳐 진행되었습니다.\"</strong></p></blockquote>\n<p>그리고 같은 보도는 한 줄을 더 보탠다.</p>\n<blockquote><p><strong>\"행사를 주관한 스타벅스 코리아 마케팅 관련자 7명 중 일부는 해당 마케팅 디자인 시안이 담긴 메일의 첨부파일조차 열지 않고 관행적으로 승인한 것으로 확인되었습니다.\"</strong></p></blockquote>", "plain_len": 229, "type": "the_4-stage_approval_line", "rawIndex": 2}, {"title": "Page 03 · The Asymmetry", "body_md": "이 두 문장을 같이 읽으면 책임의 비대칭이 분명해진다.\n\n7명이 결재했다. 그중 일부는 첨부파일조차 열지 않았다. 5월 18일에 \"탱크데이\"라는 단어가 광고에 들어간다는 사실을 4단계 결재라인 안의 누구도 멈추지 않았다. 결재라인은 통과되었다.\n\n그러나 그 결재의 비용은 4단계 결재라인이 떠안지 않았다. 그 비용은 결재라인의 한 단계도 책임지지 않은 23,984명에게 흘러갔다. 알바생들의 연장이 끊겼고, 수십 명의 일자리가 사라졌고, 매장 점장들은 매출 계획을 다시 짜야 했고, 매장에 들어온 손님 앞에서 알바생들은 자기가 하지도 않은 일에 사과해야 했다.", "body_html": "<p>이 두 문장을 같이 읽으면 책임의 비대칭이 분명해진다.</p>\n<p>7명이 결재했다. 그중 일부는 첨부파일조차 열지 않았다. 5월 18일에 \"탱크데이\"라는 단어가 광고에 들어간다는 사실을 4단계 결재라인 안의 누구도 멈추지 않았다. 결재라인은 통과되었다.</p>\n<p>그러나 그 결재의 비용은 4단계 결재라인이 떠안지 않았다. 그 비용은 결재라인의 한 단계도 책임지지 않은 23,984명에게 흘러갔다. 알바생들의 연장이 끊겼고, 수십 명의 일자리가 사라졌고, 매장 점장들은 매출 계획을 다시 짜야 했고, 매장에 들어온 손님 앞에서 알바생들은 자기가 하지도 않은 일에 사과해야 했다.</p>", "plain_len": 240, "type": "the_asymmetry", "rawIndex": 3}, {"title": "Page 04 · A Structural Pattern", "body_md": "이 비대칭은 우연이 아니다. 이건 한국의 본사-매장 구조에서 반복되는 패턴이다.\n\n본사의 의사결정은 KPI·매출·브랜드 전략의 언어로 진행된다. 그 결정이 매장에 닿을 때는 이미 결정이 끝난 다음이다. 매장은 결정의 영향을 받는 자리이지, 결정에 참여하는 자리가 아니다. 그래서 본사의 한 번의 사고가 매장의 광범위한 사후 처리로 흘러갈 때, 그 사후 처리의 비용은 본사가 아니라 매장이 부담한다.\n\n이번 사건은 이 구조의 가장 정확한 예시 중 하나가 되었다.", "body_html": "<p>이 비대칭은 우연이 아니다. 이건 한국의 본사-매장 구조에서 반복되는 패턴이다.</p>\n<p>본사의 의사결정은 KPI·매출·브랜드 전략의 언어로 진행된다. 그 결정이 매장에 닿을 때는 이미 결정이 끝난 다음이다. 매장은 결정의 영향을 받는 자리이지, 결정에 참여하는 자리가 아니다. 그래서 본사의 한 번의 사고가 매장의 광범위한 사후 처리로 흘러갈 때, 그 사후 처리의 비용은 본사가 아니라 매장이 부담한다.</p>\n<p>이번 사건은 이 구조의 가장 정확한 예시 중 하나가 되었다.</p>", "plain_len": 193, "type": "a_structural_pattern", "rawIndex": 4}, {"title": "Page 05 · Bridge", "body_md": "이 구조 안에서 알바생들이 실제로 무엇을 말하고 있는지, 다음 탭에서 본다.", "body_html": "<p>이 구조 안에서 알바생들이 실제로 무엇을 말하고 있는지, 다음 탭에서 본다.</p>", "plain_len": 32, "type": "bridge", "rawIndex": 5}], "totalPages": 5}, {"num": "04", "key": "case", "label": "CASE", "ko": "사례", "title": "익명 알바생 네 사람의 목소리", "short": "익명 알바생 네 사람의 목소리", "pages": [{"title": "Page 01 · Cover", "body_md": "이 자리에서는 5월 23일 하루에 매체가 인용한 네 개의 익명 목소리를 정리한다. 모든 인용은 매체가 보도한 그대로다. 이 매거진이 SNS에서 직접 가져온 게시물은 없다.", "body_html": "<p>이 자리에서는 5월 23일 하루에 매체가 인용한 네 개의 익명 목소리를 정리한다. 모든 인용은 매체가 보도한 그대로다. 이 매거진이 SNS에서 직접 가져온 게시물은 없다.</p>", "plain_len": 72, "type": "cover", "rawIndex": 1}, {"title": "Page 02 · Voice One — The Severance Note", "body_md": "파이낸셜뉴스의 성민서 기자가 2026년 5월 23일 보도한 \"당장 연장근무 다 끊겨…스타벅스 내부직원 '탱크데이' 논란에 '참담하다' 성토글\"이 인용한 한 직원의 글(R-04).\n\n> **\"너 때문에 피해를 보는 파트너만 몇 천 명이다. 연장이 필요한 파트너는 연장이 끊겨서 생계가 힘들어지고.\"**\n\n이 한 문장에는 분노가 있다. 그러나 그 분노는 광주 측이 아니라 본사 측에게 향한다. 광고가 결재된 다음 가장 먼저 흔들린 사람의 위치에서 본사로 보내는 분노다.", "body_html": "<p>파이낸셜뉴스의 성민서 기자가 2026년 5월 23일 보도한 \"당장 연장근무 다 끊겨…스타벅스 내부직원 '탱크데이' 논란에 '참담하다' 성토글\"이 인용한 한 직원의 글(R-04).</p>\n<blockquote><p><strong>\"너 때문에 피해를 보는 파트너만 몇 천 명이다. 연장이 필요한 파트너는 연장이 끊겨서 생계가 힘들어지고.\"</strong></p></blockquote>\n<p>이 한 문장에는 분노가 있다. 그러나 그 분노는 광주 측이 아니라 본사 측에게 향한다. 광고가 결재된 다음 가장 먼저 흔들린 사람의 위치에서 본사로 보내는 분노다.</p>", "plain_len": 198, "type": "voice_one_—_the_severance_note", "rawIndex": 2}, {"title": "Page 03 · Voice Two — The Apology Inversion", "body_md": "쿠키뉴스의 이찬종 기자가 같은 날 보도한 \"스타벅스 '탱크데이' 논란 속 내부 성토… '현장 근로자에 피해 전가'\"가 인용한 글(R-05).\n\n> **\"파트너들은 자기가 하지도 않은 일에 눈치를 보며 손님들에게 죄송해하고 있다.\"**\n\n이 문장에서 흥미로운 것은 화살표의 방향이다. 사과해야 할 사람(본사·결재자)이 사과하기 전에, 사과할 이유가 없는 사람(알바생)이 사과하고 있다. 사과의 화살표가 정반대로 꽂혀 있다.", "body_html": "<p>쿠키뉴스의 이찬종 기자가 같은 날 보도한 \"스타벅스 '탱크데이' 논란 속 내부 성토… '현장 근로자에 피해 전가'\"가 인용한 글(R-05).</p>\n<blockquote><p><strong>\"파트너들은 자기가 하지도 않은 일에 눈치를 보며 손님들에게 죄송해하고 있다.\"</strong></p></blockquote>\n<p>이 문장에서 흥미로운 것은 화살표의 방향이다. 사과해야 할 사람(본사·결재자)이 사과하기 전에, 사과할 이유가 없는 사람(알바생)이 사과하고 있다. 사과의 화살표가 정반대로 꽂혀 있다.</p>", "plain_len": 183, "type": "voice_two_—_the_apology_inversion", "rawIndex": 3}, {"title": "Page 04 · Voice Three — The Daily Pressure", "body_md": "서울신문의 이보희 기자가 같은 날 보도한 \"스타벅스 '탱크데이' 논란에 내부서도 성토\"가 인용한 글(R-06).\n\n> **\"너 때문에 피해 보는 파트너만 몇천 명이다. 연장이 필요한 파트너는 연장 끊겨서 생계가 힘들어지고 점장님들은 죄다 근무계획과 매출계획 수정.\"**\n\n이 인용에는 점장의 자리가 추가되어 있다. 알바생만의 자리가 아니라, 매장 운영을 책임지는 점장까지 같은 비용의 자리에 들어와 있다.", "body_html": "<p>서울신문의 이보희 기자가 같은 날 보도한 \"스타벅스 '탱크데이' 논란에 내부서도 성토\"가 인용한 글(R-06).</p>\n<blockquote><p><strong>\"너 때문에 피해 보는 파트너만 몇천 명이다. 연장이 필요한 파트너는 연장 끊겨서 생계가 힘들어지고 점장님들은 죄다 근무계획과 매출계획 수정.\"</strong></p></blockquote>\n<p>이 인용에는 점장의 자리가 추가되어 있다. 알바생만의 자리가 아니라, 매장 운영을 책임지는 점장까지 같은 비용의 자리에 들어와 있다.</p>", "plain_len": 174, "type": "voice_three_—_the_daily_pressure", "rawIndex": 4}, {"title": "Page 05 · Voice Four — The Quiet Reframe", "body_md": "지데일리의 손유지 기자가 같은 날 보도한 \"'너 때문에 몇천명 피해'…스타벅스 내부 혼란 극심\"이 정리한 한 줄(R-07).\n\n> **\"본사의 정책 오류로 인한 현장 직원 사기 저하.\"**\n\n이 문장은 인용이라기보다는 보도가 직접 정리한 한 줄이다. 그래서 톤이 차분하다. 차분한 만큼 분명하다. 본사의 오류 → 현장 직원의 사기 저하. 인과의 방향은 단방향이고, 책임의 자리는 흔들리지 않는다.", "body_html": "<p>지데일리의 손유지 기자가 같은 날 보도한 \"'너 때문에 몇천명 피해'…스타벅스 내부 혼란 극심\"이 정리한 한 줄(R-07).</p>\n<blockquote><p><strong>\"본사의 정책 오류로 인한 현장 직원 사기 저하.\"</strong></p></blockquote>\n<p>이 문장은 인용이라기보다는 보도가 직접 정리한 한 줄이다. 그래서 톤이 차분하다. 차분한 만큼 분명하다. 본사의 오류 → 현장 직원의 사기 저하. 인과의 방향은 단방향이고, 책임의 자리는 흔들리지 않는다.</p>", "plain_len": 167, "type": "voice_four_—_the_quiet_reframe", "rawIndex": 5}, {"title": "Page 06 · Bridge", "body_md": "네 개의 목소리는 같은 자리에서 같은 화살표를 가리킨다. 이 자리의 마지막 탭에서, 이 목소리들이 어떤 규모의 자리에서 나온 것인지를 한 번 더 본다.", "body_html": "<p>네 개의 목소리는 같은 자리에서 같은 화살표를 가리킨다. 이 자리의 마지막 탭에서, 이 목소리들이 어떤 규모의 자리에서 나온 것인지를 한 번 더 본다.</p>", "plain_len": 62, "type": "bridge", "rawIndex": 6}], "totalPages": 6}, {"num": "05", "key": "archive", "label": "ARCHIVE", "ko": "자료", "title": "출처 + 한국 스타벅스 고용 규모", "short": "출처 + 한국 스타벅스 고용 규모", "pages": [{"title": "Page 01 · Source List (1/2)", "body_md": "이 날의 모든 인용은 5필드(매체·기자·발행일·제목·URL)를 본문에 그대로 둔 정책으로 다뤘다.\n\n- R-04 파이낸셜뉴스, 성민서 기자, 2026-05-23, \"당장 연장근무 다 끊겨…스타벅스 내부직원 '탱크데이' 논란에 '참담하다' 성토글\"\n- R-05 쿠키뉴스, 이찬종 기자, 2026-05-23, \"스타벅스 '탱크데이' 논란 속 내부 성토…'현장 근로자에 피해 전가'\"\n- R-06 서울신문, 이보희 기자, 2026-05-23, \"스타벅스 '탱크데이' 논란에 내부서도 성토\"\n\nURL은 다음 페이지 source list 와 함께 매거진 끝 자료 출처 drawer에 모았다.", "body_html": "<p>이 날의 모든 인용은 5필드(매체·기자·발행일·제목·URL)를 본문에 그대로 둔 정책으로 다뤘다.</p>\n<ul><li>R-04 파이낸셜뉴스, 성민서 기자, 2026-05-23, \"당장 연장근무 다 끊겨…스타벅스 내부직원 '탱크데이' 논란에 '참담하다' 성토글\"</li><li>R-05 쿠키뉴스, 이찬종 기자, 2026-05-23, \"스타벅스 '탱크데이' 논란 속 내부 성토…'현장 근로자에 피해 전가'\"</li><li>R-06 서울신문, 이보희 기자, 2026-05-23, \"스타벅스 '탱크데이' 논란에 내부서도 성토\"</li></ul>\n<p>URL은 다음 페이지 source list 와 함께 매거진 끝 자료 출처 drawer에 모았다.</p>", "plain_len": 260, "type": "source_list_(1/2)", "rawIndex": 1}, {"title": "Page 02 · Source List (2/2)", "body_md": "- R-07 지데일리, 손유지 기자, 2026-05-23, \"'너 때문에 몇천명 피해'…스타벅스 내부 혼란 극심\"\n- R-16 YTN, 김지선 기자, 2026-05-26, \"[뉴스UP] '위기'의 신세계…정용진, 대국민 사과\"\n\nR-04~R-07은 동일 날짜(5/23)의 네 매체 동시 보도. 한국 매체가 이 사건의 매장 측 비용을 가장 가시적으로 다룬 자리다.", "body_html": "<ul><li>R-07 지데일리, 손유지 기자, 2026-05-23, \"'너 때문에 몇천명 피해'…스타벅스 내부 혼란 극심\"</li><li>R-16 YTN, 김지선 기자, 2026-05-26, \"[뉴스UP] '위기'의 신세계…정용진, 대국민 사과\"</li></ul>\n<p>R-04~R-07은 동일 날짜(5/23)의 네 매체 동시 보도. 한국 매체가 이 사건의 매장 측 비용을 가장 가시적으로 다룬 자리다.</p>", "plain_len": 160, "type": "source_list_(2/2)", "rawIndex": 2}, {"title": "Page 03 · The Scale of the Korean Operation", "body_md": "한국 스타벅스가 어떤 규모의 운영을 하고 있는지를 알아야 23,984라는 숫자가 어떤 무게인지가 보인다.\n\n- **2026년 4월 기준 국내 매장 수**: 2,131개 (미국 17,049 / 중국 7,689 다음 세계 3위)\n- **2025년 사원수(파트너)**: 23,984명\n- **2025년 매출**: 3조 2,379억 7,948만 원 (국내 커피 프랜차이즈 최초 매출 3조 돌파)\n- **회원 수**: 약 1,500만 명\n\n자료: 코리아비즈리뷰, 나무위키 스타벅스 대한민국, 인크루트 채용 정보 종합(R-19).", "body_html": "<p>한국 스타벅스가 어떤 규모의 운영을 하고 있는지를 알아야 23,984라는 숫자가 어떤 무게인지가 보인다.</p>\n<ul><li><strong>2026년 4월 기준 국내 매장 수</strong>: 2,131개 (미국 17,049 / 중국 7,689 다음 세계 3위)</li><li><strong>2025년 사원수(파트너)</strong>: 23,984명</li><li><strong>2025년 매출</strong>: 3조 2,379억 7,948만 원 (국내 커피 프랜차이즈 최초 매출 3조 돌파)</li><li><strong>회원 수</strong>: 약 1,500만 명</li></ul>\n<p>자료: 코리아비즈리뷰, 나무위키 스타벅스 대한민국, 인크루트 채용 정보 종합(R-19).</p>", "plain_len": 227, "type": "the_scale_of_the_korean_operation", "rawIndex": 3}, {"title": "Page 04 · What the Numbers Mean", "body_md": "2,131 / 23,984 / 3조 / 1,500만.\n\n이 네 개의 숫자가 의미하는 것은 단순하다. 본사 결재라인 안의 7명이 한 번 결정을 내리면, 그 결정은 매일 매일 2,131개 매장에서, 23,984명의 파트너에 의해, 1,500만 회원을 상대로 실행된다.\n\n본사의 한 결정과 매장의 매일이 한 줄로 연결되는 구조 안에서, 본사의 사고는 매일의 사고가 된다.", "body_html": "<p>2,131 / 23,984 / 3조 / 1,500만.</p>\n<p>이 네 개의 숫자가 의미하는 것은 단순하다. 본사 결재라인 안의 7명이 한 번 결정을 내리면, 그 결정은 매일 매일 2,131개 매장에서, 23,984명의 파트너에 의해, 1,500만 회원을 상대로 실행된다.</p>\n<p>본사의 한 결정과 매장의 매일이 한 줄로 연결되는 구조 안에서, 본사의 사고는 매일의 사고가 된다.</p>", "plain_len": 153, "type": "what_the_numbers_mean", "rawIndex": 4}, {"title": "Page 05 · The Day 3 Closing", "body_md": "수요일은 한 자리에서 한 가지를 본 자리다.\n\n> **본사의 한 결정은 매일을 만든다. 본사의 한 사고는 매일의 사고가 된다.**\n\n이 자리에서 우리는 한 줄짜리 결론을 가지고 다음 자리로 넘어간다. 광범위한 1차 피해는 매장의 자리에서 시작했다. 다음 자리는 매장 바깥의 자리, 일반 소비자의 자리다.", "body_html": "<p>수요일은 한 자리에서 한 가지를 본 자리다.</p>\n<blockquote><p><strong>본사의 한 결정은 매일을 만든다. 본사의 한 사고는 매일의 사고가 된다.</strong></p></blockquote>\n<p>이 자리에서 우리는 한 줄짜리 결론을 가지고 다음 자리로 넘어간다. 광범위한 1차 피해는 매장의 자리에서 시작했다. 다음 자리는 매장 바깥의 자리, 일반 소비자의 자리다.</p>", "plain_len": 125, "type": "the_day_3_closing", "rawIndex": 5}, {"title": "Page 06 · End of Day Three", "body_md": "수요일이 닫혔다. 목요일은 이 매거진의 두 번째 핵심 자리다.\n\n---", "body_html": "<p>수요일이 닫혔다. 목요일은 이 매거진의 두 번째 핵심 자리다.</p>\n<p>---</p>", "plain_len": 29, "type": "end_of_day_three", "rawIndex": 6}], "totalPages": 6}]}, {"date": "2026-05-21", "weekday": "목", "weekdayFull": "목요일", "no": "004", "titleLine": "자기 검열 2차 피해 (KILLING POINT)", "theme": "자기 검열 2차 피해 (KILLING POINT)", "note_html": "<div class=\"note-card\"><strong>목요일의 역할</strong><p>목요일은 이 호의 두 번째 핵심 자리다. 매장 안에 있는 알바생의 자리에 이어, 매장 밖에 있는 일반 소비자의 자리를 본다. 이 자리에서 저자는 자기 사례를 가지고 들어온다. 저자 사례 외의 모든 인용은 매개 보도가 익명 처리하거나 매체가 직접 분석한 case 만을 사용한다.</p></div>", "sections": [{"num": "01", "key": "intro", "label": "INTRO", "ko": "도입", "title": "내 연구실 책상 위 드립백", "short": "내 연구실 책상 위 드립백", "pages": [{"title": "Page 01 · Cover", "body_md": "5월 18일 일요일 저녁에 사건을 처음 알았다.\n\n5월 26일 화요일 아침에 나는 내 연구실 책상 위의 스타벅스 드립백 세트를 치웠다.", "body_html": "<p>5월 18일 일요일 저녁에 사건을 처음 알았다.</p>\n<p>5월 26일 화요일 아침에 나는 내 연구실 책상 위의 스타벅스 드립백 세트를 치웠다.</p>", "plain_len": 55, "type": "cover", "rawIndex": 1}, {"title": "Page 02 · The Gift", "body_md": "그 드립백 세트는 며칠 전에 선물로 받은 것이었다. 누가 줬는지, 어떤 자리에서 받았는지는 여기서 구체적으로 적지 않는 게 좋겠다. 다만 그 선물 자체에는 잘못이 없다. 받은 시점에는 사건이 일어나지 않았다.\n\n5월 18일 저녁, 사건을 알고 난 다음 한동안 그 드립백은 책상 위에 그대로 있었다. 멀쩡한 커피였다. 멀쩡한 선물이었다. 치울 이유가 없었다.", "body_html": "<p>그 드립백 세트는 며칠 전에 선물로 받은 것이었다. 누가 줬는지, 어떤 자리에서 받았는지는 여기서 구체적으로 적지 않는 게 좋겠다. 다만 그 선물 자체에는 잘못이 없다. 받은 시점에는 사건이 일어나지 않았다.</p>\n<p>5월 18일 저녁, 사건을 알고 난 다음 한동안 그 드립백은 책상 위에 그대로 있었다. 멀쩡한 커피였다. 멀쩡한 선물이었다. 치울 이유가 없었다.</p>", "plain_len": 148, "type": "the_gift", "rawIndex": 2}, {"title": "Page 03 · The First Discomfort", "body_md": "그런데 며칠이 지나면서 한 가지 생각이 자꾸 들었다.\n\n내일 면담하러 오는 학생이 이 책상을 본다. 다른 교수님이 이 연구실에 들어와서 책상 위를 한 번 본다. 그분들의 눈에는 이 드립백이 어떻게 보일까.\n\n\"안 교수도 일베벅스 측인가.\"\n\n이 한 줄짜리 프레임이 머릿속에서 한 번 떠오른 다음에는 잘 지워지지 않았다.", "body_html": "<p>그런데 며칠이 지나면서 한 가지 생각이 자꾸 들었다.</p>\n<p>내일 면담하러 오는 학생이 이 책상을 본다. 다른 교수님이 이 연구실에 들어와서 책상 위를 한 번 본다. 그분들의 눈에는 이 드립백이 어떻게 보일까.</p>\n<p>\"안 교수도 일베벅스 측인가.\"</p>\n<p>이 한 줄짜리 프레임이 머릿속에서 한 번 떠오른 다음에는 잘 지워지지 않았다.</p>", "plain_len": 129, "type": "the_first_discomfort", "rawIndex": 3}, {"title": "Page 04 · The Calculation", "body_md": "이건 합리적인 우려가 아닐 수도 있다. 학생이 그렇게 빨리 그렇게 좁게 누군가를 분류할 가능성은 사실 낮다. 다른 교수님이 책상 위의 드립백 하나로 동료를 판단할 가능성도 낮다.\n\n다만, 가능성이 낮다는 게 가능성이 없다는 뜻은 아니다. 그리고 어떤 종류의 프레임은 한 번 씌워지면 풀기 어렵다. 풀 수 있더라도 그 풀이의 시간 비용이 든다.\n\n내가 멀쩡한 드립백 한 박스를 책상 위에 두는 대가로 그 시간 비용을 감수해야 하는가. 그 비용을 누가 만들었는가.", "body_html": "<p>이건 합리적인 우려가 아닐 수도 있다. 학생이 그렇게 빨리 그렇게 좁게 누군가를 분류할 가능성은 사실 낮다. 다른 교수님이 책상 위의 드립백 하나로 동료를 판단할 가능성도 낮다.</p>\n<p>다만, 가능성이 낮다는 게 가능성이 없다는 뜻은 아니다. 그리고 어떤 종류의 프레임은 한 번 씌워지면 풀기 어렵다. 풀 수 있더라도 그 풀이의 시간 비용이 든다.</p>\n<p>내가 멀쩡한 드립백 한 박스를 책상 위에 두는 대가로 그 시간 비용을 감수해야 하는가. 그 비용을 누가 만들었는가.</p>", "plain_len": 187, "type": "the_calculation", "rawIndex": 4}, {"title": "Page 05 · The Act", "body_md": "5월 26일 화요일 아침, 나는 그 드립백 세트를 치웠다. 어디로 옮겼는지는 별로 중요하지 않다. 중요한 건 책상 위에서 사라졌다는 것, 그리고 그 사라짐의 이유가 커피 맛이 아니었다는 것이다.\n\n이건 보이콧이 아니다. 나는 그 드립백을 버리지 않았다. 환불도 받지 않았다. 다만 보이는 자리에 두지 않기로 결정했다. 그 결정의 정확한 이름은 자기 검열이다.", "body_html": "<p>5월 26일 화요일 아침, 나는 그 드립백 세트를 치웠다. 어디로 옮겼는지는 별로 중요하지 않다. 중요한 건 책상 위에서 사라졌다는 것, 그리고 그 사라짐의 이유가 커피 맛이 아니었다는 것이다.</p>\n<p>이건 보이콧이 아니다. 나는 그 드립백을 버리지 않았다. 환불도 받지 않았다. 다만 보이는 자리에 두지 않기로 결정했다. 그 결정의 정확한 이름은 자기 검열이다.</p>", "plain_len": 149, "type": "the_act", "rawIndex": 5}, {"title": "Page 06 · Bridge", "body_md": "자기 검열은 누군가가 강제한 행위가 아니다. 하지만 누군가가 만든 환경의 결과다. 다음 탭에서 이 자기 검열이 시작되는 정확한 순간을 정리한다.", "body_html": "<p>자기 검열은 누군가가 강제한 행위가 아니다. 하지만 누군가가 만든 환경의 결과다. 다음 탭에서 이 자기 검열이 시작되는 정확한 순간을 정리한다.</p>", "plain_len": 61, "type": "bridge", "rawIndex": 6}], "totalPages": 6}, {"num": "02", "key": "issue", "label": "ISSUE", "ko": "쟁점", "title": "\"들고 있으면 어떻게 보일까\"", "short": "\"들고 있으면 어떻게 보일까\"", "pages": [{"title": "Page 01 · Cover", "body_md": "스타벅스 사건 이후 며칠 동안, 한국의 일반 소비자가 가장 자주 한 질문은 이것이었다.\n\n\"이걸 들고 있으면 어떻게 보일까.\"", "body_html": "<p>스타벅스 사건 이후 며칠 동안, 한국의 일반 소비자가 가장 자주 한 질문은 이것이었다.</p>\n<p>\"이걸 들고 있으면 어떻게 보일까.\"</p>", "plain_len": 52, "type": "cover", "rawIndex": 1}, {"title": "Page 02 · The Three Responses", "body_md": "이데일리의 신수정 기자가 2026년 5월 19일 보도한 \"불매운동 확산 중인데… '5·18 마케팅 논란' 스타벅스 가보니\"는 매장 르포를 통해 세 가지 반응을 잡아냈다(R-10).\n\n첫 번째는 보이콧이다. 온라인에서 \"당분간 스타벅스에 가지 않겠다\", 앱 삭제 선언, 텀블러·머그잔 폐기 영상.\n\n두 번째는 자기 검열이다. 불매 의사를 표시하면서도 편의성·남은 쿠폰 때문에 계속 이용. 르포에 등장한 직장인 A씨의 말 그대로.\n\n> **\"뉴스를 보고 상당히 불쾌했다… 회사 근처에서 가장 빨리 커피를 받을 수 있는 곳이라 습관처럼 왔다.\"**\n\n세 번째는 무대응이다. 오프라인 매장의 평소와 크게 다르지 않은 분위기.", "body_html": "<p>이데일리의 신수정 기자가 2026년 5월 19일 보도한 \"불매운동 확산 중인데… '5·18 마케팅 논란' 스타벅스 가보니\"는 매장 르포를 통해 세 가지 반응을 잡아냈다(R-10).</p>\n<p>첫 번째는 보이콧이다. 온라인에서 \"당분간 스타벅스에 가지 않겠다\", 앱 삭제 선언, 텀블러·머그잔 폐기 영상.</p>\n<p>두 번째는 자기 검열이다. 불매 의사를 표시하면서도 편의성·남은 쿠폰 때문에 계속 이용. 르포에 등장한 직장인 A씨의 말 그대로.</p>\n<blockquote><p><strong>\"뉴스를 보고 상당히 불쾌했다… 회사 근처에서 가장 빨리 커피를 받을 수 있는 곳이라 습관처럼 왔다.\"</strong></p></blockquote>\n<p>세 번째는 무대응이다. 오프라인 매장의 평소와 크게 다르지 않은 분위기.</p>", "plain_len": 262, "type": "the_three_responses", "rawIndex": 2}, {"title": "Page 03 · The Middle Zone", "body_md": "세 가지 반응 중에서 이번 호가 주목하는 자리는 두 번째다.\n\n보이콧은 명시적이다. 본인의 의사가 분명하고, 그 의사가 행동으로 표현된다. 무대응은 의사 자체가 약하거나 형성되지 않은 경우다. 자기 검열은 그 사이에 있는 자리다. 불쾌함이 분명히 있다. 행동도 일부 있다. 다만 그 행동이 완전한 단절이 되지 못한다.\n\n이데일리 르포의 또 다른 소비자 B씨의 말이 이 중간 지대를 정확히 보여준다.\n\n> **\"마케팅 문구는 명백히 잘못됐다고 본다… 기프티콘이 남아 있고 주변에 매장이 많아 당장 이용을 중단하긴 애매하다.\"**", "body_html": "<p>세 가지 반응 중에서 이번 호가 주목하는 자리는 두 번째다.</p>\n<p>보이콧은 명시적이다. 본인의 의사가 분명하고, 그 의사가 행동으로 표현된다. 무대응은 의사 자체가 약하거나 형성되지 않은 경우다. 자기 검열은 그 사이에 있는 자리다. 불쾌함이 분명히 있다. 행동도 일부 있다. 다만 그 행동이 완전한 단절이 되지 못한다.</p>\n<p>이데일리 르포의 또 다른 소비자 B씨의 말이 이 중간 지대를 정확히 보여준다.</p>\n<blockquote><p><strong>\"마케팅 문구는 명백히 잘못됐다고 본다… 기프티콘이 남아 있고 주변에 매장이 많아 당장 이용을 중단하긴 애매하다.\"</strong></p></blockquote>", "plain_len": 219, "type": "the_middle_zone", "rawIndex": 3}, {"title": "Page 04 · The Mental Cost", "body_md": "이 중간 지대는 명시적인 보이콧보다 덜 보인다. 그래서 통계에 잡히지 않는다. 매출에 곧바로 반영되지 않는다. 다만 이 자리에 있는 사람의 머릿속에서는 매일 한 가지 계산이 돌아간다.\n\n이걸 들고 가면 어떻게 보일까. 이걸 책상 위에 두면 어떻게 보일까. 이걸 사진에 찍어서 SNS에 올리면 어떻게 보일까. 이걸 친구에게 사다 주면 어떻게 보일까.\n\n이 계산은 매일 한 번씩 작동한다. 일주일이 지나면 일곱 번이 된다. 한 달이 지나면 서른 번이 된다. 이 계산의 시간 비용은 매출에 잡히지 않는다.", "body_html": "<p>이 중간 지대는 명시적인 보이콧보다 덜 보인다. 그래서 통계에 잡히지 않는다. 매출에 곧바로 반영되지 않는다. 다만 이 자리에 있는 사람의 머릿속에서는 매일 한 가지 계산이 돌아간다.</p>\n<p>이걸 들고 가면 어떻게 보일까. 이걸 책상 위에 두면 어떻게 보일까. 이걸 사진에 찍어서 SNS에 올리면 어떻게 보일까. 이걸 친구에게 사다 주면 어떻게 보일까.</p>\n<p>이 계산은 매일 한 번씩 작동한다. 일주일이 지나면 일곱 번이 된다. 한 달이 지나면 서른 번이 된다. 이 계산의 시간 비용은 매출에 잡히지 않는다.</p>", "plain_len": 204, "type": "the_mental_cost", "rawIndex": 4}, {"title": "Page 05 · Bridge", "body_md": "이 비용을 누가 만들었는가. 다음 탭에서 그 자리를 본다.", "body_html": "<p>이 비용을 누가 만들었는가. 다음 탭에서 그 자리를 본다.</p>", "plain_len": 24, "type": "bridge", "rawIndex": 5}], "totalPages": 5}, {"num": "03", "key": "insight", "label": "INSIGHT", "ko": "통찰", "title": "제품과 브랜드의 분리는 끝났다", "short": "제품과 브랜드의 분리는 끝났다", "pages": [{"title": "Page 01 · Concept", "body_md": "스타벅스 사건은 한 가지 시점을 한국 시장에서 확정했다.\n\n> **이제 한국에서 스타벅스 제품과 스타벅스 브랜드는 분리되지 않는다.**\n\n이전까지 많은 한국 소비자는 두 가지를 분리해서 사용해왔다. 정용진 회장의 SNS 발언이 마음에 들지 않아도, 매장에서 받는 커피는 별개의 일로 생각했다. 신세계그룹의 다른 의사결정이 불편해도, 텀블러 한 잔은 텀블러 한 잔이었다.\n\n5월 18일 이후, 이 분리가 사실상 끝났다.", "body_html": "<p>스타벅스 사건은 한 가지 시점을 한국 시장에서 확정했다.</p>\n<blockquote><p><strong>이제 한국에서 스타벅스 제품과 스타벅스 브랜드는 분리되지 않는다.</strong></p></blockquote>\n<p>이전까지 많은 한국 소비자는 두 가지를 분리해서 사용해왔다. 정용진 회장의 SNS 발언이 마음에 들지 않아도, 매장에서 받는 커피는 별개의 일로 생각했다. 신세계그룹의 다른 의사결정이 불편해도, 텀블러 한 잔은 텀블러 한 잔이었다.</p>\n<p>5월 18일 이후, 이 분리가 사실상 끝났다.</p>", "plain_len": 176, "type": "concept", "rawIndex": 1}, {"title": "Page 02 · The New Performative Layer", "body_md": "서울신문의 윤태희 기자가 2026년 5월 20일 보도한 \"'스벅 들고 우파 인증'… '불매 확산' 스타벅스, 이념 전쟁터 된 이유\"는 이 변화를 다음과 같이 정리했다(R-09).\n\n> **\"커피 한 잔이 이념적 태도를 드러내는 상징처럼 소비되기 시작한 것.\"**\n\n기사는 보수 성향 일부 이용자가 스타벅스 커피와 텀블러를 들고 사진을 올리는 흐름을 설명한다. \"커피는 스벅이지\", \"우파 미녀의 출근룩\" 같은 표현이 등장했고, \"'멸공커피'라는 해시태그\"가 활용됐다.\n\n이 흐름이 의미하는 것은 단순하다. 스타벅스를 들고 있는 행위가, 들고 있는 사람의 의사와 무관하게, 일종의 정치적 인증으로 읽히기 시작했다는 것이다.", "body_html": "<p>서울신문의 윤태희 기자가 2026년 5월 20일 보도한 \"'스벅 들고 우파 인증'… '불매 확산' 스타벅스, 이념 전쟁터 된 이유\"는 이 변화를 다음과 같이 정리했다(R-09).</p>\n<blockquote><p><strong>\"커피 한 잔이 이념적 태도를 드러내는 상징처럼 소비되기 시작한 것.\"</strong></p></blockquote>\n<p>기사는 보수 성향 일부 이용자가 스타벅스 커피와 텀블러를 들고 사진을 올리는 흐름을 설명한다. \"커피는 스벅이지\", \"우파 미녀의 출근룩\" 같은 표현이 등장했고, \"'멸공커피'라는 해시태그\"가 활용됐다.</p>\n<p>이 흐름이 의미하는 것은 단순하다. 스타벅스를 들고 있는 행위가, 들고 있는 사람의 의사와 무관하게, 일종의 정치적 인증으로 읽히기 시작했다는 것이다.</p>", "plain_len": 267, "type": "the_new_performative_layer", "rawIndex": 2}, {"title": "Page 03 · The Other Side of the Same Coin", "body_md": "뉴스;트리의 김나윤 기자가 2026년 5월 21일 보도한 \"'일베벅스'로 추락한 스타벅스… 극우 아지트되나?\"는 같은 변화를 브랜드 측 자리에서 정리했다(R-08).\n\n> **\"이미지가 전부인 기업인데 극우의 성지로 찍히면 끝난 것.\"**\n>\n> **\"스타벅스가 '극우의 소비 인증 장소'처럼 소비되는 상황 자체가 브랜드 가치를 더욱 훼손.\"**\n>\n> **\"불매운동 자체도 부담이지만, 극우 세력의 공개적 옹호가 브랜드의 중립성과 대중성을 훼손.\"**\n\n브랜드의 중립성·대중성이 훼손되면, 그 브랜드를 평소 무덤덤하게 소비하던 일반 소비자가 가장 먼저 자기 검열의 자리에 들어선다. 우파 인증으로 사용되기 시작한 브랜드를 일반 소비자가 들고 다닐 때, 그 사람은 자기 의사와 무관하게 그 인증의 자리에 끌려 들어간다.", "body_html": "<p>뉴스;트리의 김나윤 기자가 2026년 5월 21일 보도한 \"'일베벅스'로 추락한 스타벅스… 극우 아지트되나?\"는 같은 변화를 브랜드 측 자리에서 정리했다(R-08).</p>\n<blockquote><p><strong>\"이미지가 전부인 기업인데 극우의 성지로 찍히면 끝난 것.\"</strong></p>\n<p><strong>\"스타벅스가 '극우의 소비 인증 장소'처럼 소비되는 상황 자체가 브랜드 가치를 더욱 훼손.\"</strong></p>\n<p><strong>\"불매운동 자체도 부담이지만, 극우 세력의 공개적 옹호가 브랜드의 중립성과 대중성을 훼손.\"</strong></p></blockquote>\n<p>브랜드의 중립성·대중성이 훼손되면, 그 브랜드를 평소 무덤덤하게 소비하던 일반 소비자가 가장 먼저 자기 검열의 자리에 들어선다. 우파 인증으로 사용되기 시작한 브랜드를 일반 소비자가 들고 다닐 때, 그 사람은 자기 의사와 무관하게 그 인증의 자리에 끌려 들어간다.</p>", "plain_len": 311, "type": "the_other_side_of_the_same_coin", "rawIndex": 3}, {"title": "Page 04 · The Speech Act of Drinking", "body_md": "이 변화의 의미는 한 줄로 정리된다.\n\n> **마시는 행위가 화행(話行)이 되었다.**\n\n화행은 말로 하는 행위다. 약속, 사과, 명령, 인증이 화행이다. 평소에는 마시는 일이 화행이 아니었다. 그러나 한 브랜드가 정치적 표지로 굳어지는 순간, 그 브랜드를 마시는 일은 곧 그 정치적 자리에 서는 일이 된다.\n\n매일 마시던 사람이, 어느 날부터 매일 한 번씩 자기 자리를 결정해야 한다. 이 결정은 시간 비용이 든다. 마음 비용이 든다. 관계 비용이 든다.", "body_html": "<p>이 변화의 의미는 한 줄로 정리된다.</p>\n<blockquote><p><strong>마시는 행위가 화행(話行)이 되었다.</strong></p></blockquote>\n<p>화행은 말로 하는 행위다. 약속, 사과, 명령, 인증이 화행이다. 평소에는 마시는 일이 화행이 아니었다. 그러나 한 브랜드가 정치적 표지로 굳어지는 순간, 그 브랜드를 마시는 일은 곧 그 정치적 자리에 서는 일이 된다.</p>\n<p>매일 마시던 사람이, 어느 날부터 매일 한 번씩 자기 자리를 결정해야 한다. 이 결정은 시간 비용이 든다. 마음 비용이 든다. 관계 비용이 든다.</p>", "plain_len": 187, "type": "the_speech_act_of_drinking", "rawIndex": 4}, {"title": "Page 05 · Bridge", "body_md": "이 비용은 사라지지 않는다. 누가 받는가. 환불이 가능한가. 다음 탭에서, 보이콧 소비자가 환불을 받으려면 추가 소비를 해야 하는 구조를 본다.", "body_html": "<p>이 비용은 사라지지 않는다. 누가 받는가. 환불이 가능한가. 다음 탭에서, 보이콧 소비자가 환불을 받으려면 추가 소비를 해야 하는 구조를 본다.</p>", "plain_len": 61, "type": "bridge", "rawIndex": 5}], "totalPages": 5}, {"num": "04", "key": "case", "label": "CASE", "ko": "사례", "title": "세 가지 반응 — 보이콧, 자기 검열, 무대응", "short": "세 가지 반응 — 보이콧, 자기 검열, 무대응", "pages": [{"title": "Page 01 · Cover", "body_md": "이데일리의 신수정 기자가 2026년 5월 19일 보도한 매장 르포는 한국 소비자의 세 가지 반응을 가장 일찍 잡아낸 자리 중 하나다(R-10). 이 자리에서 그 세 가지를 다시 정리한다.", "body_html": "<p>이데일리의 신수정 기자가 2026년 5월 19일 보도한 매장 르포는 한국 소비자의 세 가지 반응을 가장 일찍 잡아낸 자리 중 하나다(R-10). 이 자리에서 그 세 가지를 다시 정리한다.</p>", "plain_len": 78, "type": "cover", "rawIndex": 1}, {"title": "Page 02 · Voice One — Boycott", "body_md": "첫 번째 자리는 보이콧이다.\n\n이 자리는 오프라인 르포보다 온라인에서 더 잘 보였다. 같은 보도와 다른 매체들의 정리에 따르면, 사건 직후부터 다음과 같은 행위가 SNS에 올라왔다.\n\n- 스타벅스 앱 회원 탈퇴 인증\n- 선불 카드 잔액 환불 인증\n- 기프티콘 환불 시도 게시물\n- 텀블러·머그잔을 폐기하거나 파손하는 영상\n- \"탈벅\"(스타벅스 탈퇴) 해시태그\n\n이 자리에 있는 사람들은 의사가 명시적이다. 행동이 분명하다. 비용을 본인이 부담한다.", "body_html": "<p>첫 번째 자리는 보이콧이다.</p>\n<p>이 자리는 오프라인 르포보다 온라인에서 더 잘 보였다. 같은 보도와 다른 매체들의 정리에 따르면, 사건 직후부터 다음과 같은 행위가 SNS에 올라왔다.</p>\n<ul><li>스타벅스 앱 회원 탈퇴 인증</li><li>선불 카드 잔액 환불 인증</li><li>기프티콘 환불 시도 게시물</li><li>텀블러·머그잔을 폐기하거나 파손하는 영상</li><li>\"탈벅\"(스타벅스 탈퇴) 해시태그</li></ul>\n<p>이 자리에 있는 사람들은 의사가 명시적이다. 행동이 분명하다. 비용을 본인이 부담한다.</p>", "plain_len": 186, "type": "voice_one_—_boycott", "rawIndex": 2}, {"title": "Page 03 · Voice Two — Self-Censorship", "body_md": "두 번째 자리는 자기 검열이다.\n\n이데일리 르포의 직장인 A씨와 소비자 B씨의 인용은 이미 앞에서 본 그대로다. 보이콧을 하기 어려운 합리적 이유들이 있다. 회사 근처에 다른 카페가 없다. 기프티콘이 남아 있다. 환불 절차가 번거롭다. 매일의 커피 한 잔을 이념적 자리로 옮기는 것 자체가 피곤하다.\n\n다만, 이 자리에 있는 사람들의 머릿속에서는 매일 한 번씩 계산이 돌아간다. 들고 가도 되는가. 들고 가지 않는 게 나은가. 사 가지고 가는 것과 매장에서 마시는 것은 어떻게 다른가.\n\n저자도 이 자리에 있다. 그래서 이 자리의 비용을 안다.", "body_html": "<p>두 번째 자리는 자기 검열이다.</p>\n<p>이데일리 르포의 직장인 A씨와 소비자 B씨의 인용은 이미 앞에서 본 그대로다. 보이콧을 하기 어려운 합리적 이유들이 있다. 회사 근처에 다른 카페가 없다. 기프티콘이 남아 있다. 환불 절차가 번거롭다. 매일의 커피 한 잔을 이념적 자리로 옮기는 것 자체가 피곤하다.</p>\n<p>다만, 이 자리에 있는 사람들의 머릿속에서는 매일 한 번씩 계산이 돌아간다. 들고 가도 되는가. 들고 가지 않는 게 나은가. 사 가지고 가는 것과 매장에서 마시는 것은 어떻게 다른가.</p>\n<p>저자도 이 자리에 있다. 그래서 이 자리의 비용을 안다.</p>", "plain_len": 222, "type": "voice_two_—_self-censorship", "rawIndex": 3}, {"title": "Page 04 · Voice Three — No Reaction", "body_md": "세 번째 자리는 무대응이다.\n\n이데일리 르포가 묘사한 매장 분위기는 \"평소와 크게 다르지 않다\"였다. 보이콧이 매출을 즉시 흔든 것은 아니라는 뜻이다. 매일 매장에 들어오는 1,500만 회원 중 다수는 같은 시간에 같은 매장에서 같은 커피를 시켰다.\n\n이 자리에 있는 사람들을 비난하는 것은 이 매거진의 자리가 아니다. 무대응은 의사 결여의 표시가 아니다. 그저 매일의 생활을 매일 살아야 하는 사람의 현실이다.\n\n이 매거진이 묻는 것은 무대응 자리에 있는 사람들에 대한 비판이 아니라, 그 자리에 있는 사람들조차 한 번씩 자기 책상 위의 드립백을 다시 보게 만든 회사의 결정에 대한 책임이다.", "body_html": "<p>세 번째 자리는 무대응이다.</p>\n<p>이데일리 르포가 묘사한 매장 분위기는 \"평소와 크게 다르지 않다\"였다. 보이콧이 매출을 즉시 흔든 것은 아니라는 뜻이다. 매일 매장에 들어오는 1,500만 회원 중 다수는 같은 시간에 같은 매장에서 같은 커피를 시켰다.</p>\n<p>이 자리에 있는 사람들을 비난하는 것은 이 매거진의 자리가 아니다. 무대응은 의사 결여의 표시가 아니다. 그저 매일의 생활을 매일 살아야 하는 사람의 현실이다.</p>\n<p>이 매거진이 묻는 것은 무대응 자리에 있는 사람들에 대한 비판이 아니라, 그 자리에 있는 사람들조차 한 번씩 자기 책상 위의 드립백을 다시 보게 만든 회사의 결정에 대한 책임이다.</p>", "plain_len": 245, "type": "voice_three_—_no_reaction", "rawIndex": 4}, {"title": "Page 05 · The Three Responses Share One Cost", "body_md": "이 세 자리는 행동의 외양이 다르다. 그러나 한 가지 비용은 같다. 세 자리 모두 본인이 만들지 않은 사건의 결과를 본인이 매일 처리하고 있다는 점이다.\n\n본사 결재라인의 4단계 7명은 매일 이 사건을 처리하지 않는다. 23,984명의 파트너와 1,500만 회원이 매일 처리한다.", "body_html": "<p>이 세 자리는 행동의 외양이 다르다. 그러나 한 가지 비용은 같다. 세 자리 모두 본인이 만들지 않은 사건의 결과를 본인이 매일 처리하고 있다는 점이다.</p>\n<p>본사 결재라인의 4단계 7명은 매일 이 사건을 처리하지 않는다. 23,984명의 파트너와 1,500만 회원이 매일 처리한다.</p>", "plain_len": 117, "type": "the_three_responses_share_one_cost", "rawIndex": 5}, {"title": "Page 06 · Bridge", "body_md": "매일 처리해야 하는 비용 중에는 환불 약관도 있다. 다음 탭에서 그 구조를 본다.", "body_html": "<p>매일 처리해야 하는 비용 중에는 환불 약관도 있다. 다음 탭에서 그 구조를 본다.</p>", "plain_len": 33, "type": "bridge", "rawIndex": 6}], "totalPages": 6}, {"num": "05", "key": "archive", "label": "ARCHIVE", "ko": "자료", "title": "환불받으려면 추가 소비를 해야 한다", "short": "환불받으려면 추가 소비를 해야 한다", "pages": [{"title": "Page 01 · The 60% Clause", "body_md": "푸드아이콘의 김민 기자가 2026년 5월 22일 보도한 \"[핫이슈] 스타벅스 '5·18 마케팅 논란', 불매 소비자에 추가 소비 강요하나\"는 한국 스타벅스 카드 이용약관의 한 조항을 정리한다(R-11).\n\n> **\"선불 카드 잔액을 돌려받기 위해서는 최종 충전 후 잔액의 60% 이상을 사용해야 한다.\"**\n\n이 조항이 왜 문제인지를 같은 보도가 한 문장으로 정리한다.\n\n> **\"기업의 잘못으로 불매를 결심한 소비자에게도 환불을 받기 위해 원치 않는 추가 소비를 해야 하는 모순이 발생한다.\"**", "body_html": "<p>푸드아이콘의 김민 기자가 2026년 5월 22일 보도한 \"[핫이슈] 스타벅스 '5·18 마케팅 논란', 불매 소비자에 추가 소비 강요하나\"는 한국 스타벅스 카드 이용약관의 한 조항을 정리한다(R-11).</p>\n<blockquote><p><strong>\"선불 카드 잔액을 돌려받기 위해서는 최종 충전 후 잔액의 60% 이상을 사용해야 한다.\"</strong></p></blockquote>\n<p>이 조항이 왜 문제인지를 같은 보도가 한 문장으로 정리한다.</p>\n<blockquote><p><strong>\"기업의 잘못으로 불매를 결심한 소비자에게도 환불을 받기 위해 원치 않는 추가 소비를 해야 하는 모순이 발생한다.\"</strong></p></blockquote>", "plain_len": 212, "type": "the_60%_clause", "rawIndex": 1}, {"title": "Page 02 · The Structural Coercion", "body_md": "이 약관의 의미는 이렇다.\n\n소비자가 본인의 선택으로 스타벅스 사용을 중단하기로 결정했더라도, 본인이 이미 충전한 돈을 돌려받으려면 그 결정과 모순되는 행위(추가 사용)를 해야 한다. 환불의 조건이 거래의 지속이다.\n\n이 조건은 평시에는 합리적인 약관 설계일 수 있다. 그러나 기업의 명백한 잘못으로 인한 불매 상황에서, 이 약관은 소비자에게 추가 비용을 청구하는 구조가 된다.", "body_html": "<p>이 약관의 의미는 이렇다.</p>\n<p>소비자가 본인의 선택으로 스타벅스 사용을 중단하기로 결정했더라도, 본인이 이미 충전한 돈을 돌려받으려면 그 결정과 모순되는 행위(추가 사용)를 해야 한다. 환불의 조건이 거래의 지속이다.</p>\n<p>이 조건은 평시에는 합리적인 약관 설계일 수 있다. 그러나 기업의 명백한 잘못으로 인한 불매 상황에서, 이 약관은 소비자에게 추가 비용을 청구하는 구조가 된다.</p>", "plain_len": 160, "type": "the_structural_coercion", "rawIndex": 2}, {"title": "Page 03 · The Consumer Group Statement", "body_md": "같은 보도가 인용한 한국소비자단체협의회의 입장이 이 자리의 의미를 정리한다(R-11).\n\n> **\"기업의 명백한 잘못으로 소비자가 불매를 원하는 경우에는 사용 금액과 관계없이 선불금 전액을 환급받을 수 있도록 법적·제도적 근거를 마련해야 한다.\"**\n\n이 자리는 한 소비자의 한 잔의 자리가 아니라, 소비자단체가 입법으로 제안하는 자리다. 자기 검열의 비용이 약관의 비용까지 합쳐졌을 때, 비용은 단지 마음의 비용이 아니라 시장 구조의 비용이 된다.", "body_html": "<p>같은 보도가 인용한 한국소비자단체협의회의 입장이 이 자리의 의미를 정리한다(R-11).</p>\n<blockquote><p><strong>\"기업의 명백한 잘못으로 소비자가 불매를 원하는 경우에는 사용 금액과 관계없이 선불금 전액을 환급받을 수 있도록 법적·제도적 근거를 마련해야 한다.\"</strong></p></blockquote>\n<p>이 자리는 한 소비자의 한 잔의 자리가 아니라, 소비자단체가 입법으로 제안하는 자리다. 자기 검열의 비용이 약관의 비용까지 합쳐졌을 때, 비용은 단지 마음의 비용이 아니라 시장 구조의 비용이 된다.</p>", "plain_len": 193, "type": "the_consumer_group_statement", "rawIndex": 3}, {"title": "Page 04 · Day 4 Source List (KILLING POINT)", "body_md": "이 날의 모든 인용은 5필드를 본문에 그대로 둔 정책으로 다뤘다.\n\n- R-08 뉴스;트리, 김나윤 기자, 2026-05-21, \"'일베벅스'로 추락한 스타벅스…극우 아지트되나?\", https://www.newstree.kr/newsView/ntr202605210019\n- R-09 서울신문(브랜드 줌), 윤태희 기자, 2026-05-20, \"'스벅 들고 우파 인증'…'불매 확산' 스타벅스, 이념 전쟁터 된 이유\", https://v.daum.net/v/20260520160306204\n- R-10 이데일리, 신수정 기자, 2026-05-19, \"불매운동 확산 중인데…'5·18 마케팅 논란' 스타벅스 가보니\", https://v.daum.net/v/20260519155617061\n- R-11 푸드아이콘, 김민 기자, 2026-05-22, \"[핫이슈] 스타벅스 '5·18 마케팅 논란', 불매 소비자에 추가 소비 강요하나\", http://www.foodicon.co.kr/news/articleView.html?idxno=33792", "body_html": "<p>이 날의 모든 인용은 5필드를 본문에 그대로 둔 정책으로 다뤘다.</p>\n<ul><li>R-08 뉴스;트리, 김나윤 기자, 2026-05-21, \"'일베벅스'로 추락한 스타벅스…극우 아지트되나?\", https://www.newstree.kr/newsView/ntr202605210019</li><li>R-09 서울신문(브랜드 줌), 윤태희 기자, 2026-05-20, \"'스벅 들고 우파 인증'…'불매 확산' 스타벅스, 이념 전쟁터 된 이유\", https://v.daum.net/v/20260520160306204</li><li>R-10 이데일리, 신수정 기자, 2026-05-19, \"불매운동 확산 중인데…'5·18 마케팅 논란' 스타벅스 가보니\", https://v.daum.net/v/20260519155617061</li><li>R-11 푸드아이콘, 김민 기자, 2026-05-22, \"[핫이슈] 스타벅스 '5·18 마케팅 논란', 불매 소비자에 추가 소비 강요하나\", http://www.foodicon.co.kr/news/articleView.html?idxno=33792</li></ul>", "plain_len": 453, "type": "day_4_source_list_(killing_point)", "rawIndex": 4}, {"title": "Page 05 · End of Day Four", "body_md": "목요일이 닫혔다. 이 자리에서 두 번째 핵심 자리가 끝난다.\n\n23,984명이 1차 비용을 떠안았다. 1,500만 회원 중 자기 검열의 자리에 들어선 사람들이 2차 비용을 떠안고 있다. 그리고 이 두 비용을 만든 4단계 결재라인 안의 7명은, 다음 자리에서 본다. 한 사람의 4년짜리 패턴이 그 7명의 결재라인 안에서 어떻게 정렬되어 있는지.\n\n---", "body_html": "<p>목요일이 닫혔다. 이 자리에서 두 번째 핵심 자리가 끝난다.</p>\n<p>23,984명이 1차 비용을 떠안았다. 1,500만 회원 중 자기 검열의 자리에 들어선 사람들이 2차 비용을 떠안고 있다. 그리고 이 두 비용을 만든 4단계 결재라인 안의 7명은, 다음 자리에서 본다. 한 사람의 4년짜리 패턴이 그 7명의 결재라인 안에서 어떻게 정렬되어 있는지.</p>\n<p>---</p>", "plain_len": 146, "type": "end_of_day_four", "rawIndex": 5}], "totalPages": 5}]}, {"date": "2026-05-22", "weekday": "금", "weekdayFull": "금요일", "no": "005", "titleLine": "정용진 반복 패턴", "theme": "정용진 반복 패턴", "note_html": "<div class=\"note-card\"><strong>금요일의 역할</strong><p>금요일은 한 사람의 4년짜리 패턴을 본다. 이번 사건이 한 번의 사고가 아니라는 사실은, 이 자리에서 확인된다. 이 자리는 한 사람을 비방하는 자리가 아니라, 그 사람의 지위가 만드는 비대칭 권력의 자리를 보는 자리다.</p></div>", "sections": [{"num": "01", "key": "intro", "label": "INTRO", "ko": "도입", "title": "이번이 처음이 아니다", "short": "이번이 처음이 아니다", "pages": [{"title": "Page 01 · Cover", "body_md": "스타벅스 탱크데이 사건이 처음 보도된 다음 날, 한국 인터넷에서 가장 빨리 떠오른 한 줄이 있었다.\n\n\"이번이 처음이 아니다.\"", "body_html": "<p>스타벅스 탱크데이 사건이 처음 보도된 다음 날, 한국 인터넷에서 가장 빨리 떠오른 한 줄이 있었다.</p>\n<p>\"이번이 처음이 아니다.\"</p>", "plain_len": 53, "type": "cover", "rawIndex": 1}, {"title": "Page 02 · Why the Sentence Came First", "body_md": "이 한 줄이 빨리 떠오른 이유는 단순하다. 정용진 신세계그룹 회장의 발언·SNS·결정으로 인한 사회적 논란은, 2026년 5월 이전에도 이미 여러 차례 반복되었기 때문이다.\n\n이 매거진은 한 사람의 인격에 대한 비방을 다루지 않는다. 다만 한 사람의 4년짜리 행위 패턴이 한 기업의 23,984명 파트너와 1,500만 회원에게 반복적으로 비용을 만든다는 사실은, 매거진의 자리에서 다뤄야 할 자료다.", "body_html": "<p>이 한 줄이 빨리 떠오른 이유는 단순하다. 정용진 신세계그룹 회장의 발언·SNS·결정으로 인한 사회적 논란은, 2026년 5월 이전에도 이미 여러 차례 반복되었기 때문이다.</p>\n<p>이 매거진은 한 사람의 인격에 대한 비방을 다루지 않는다. 다만 한 사람의 4년짜리 행위 패턴이 한 기업의 23,984명 파트너와 1,500만 회원에게 반복적으로 비용을 만든다는 사실은, 매거진의 자리에서 다뤄야 할 자료다.</p>", "plain_len": 171, "type": "why_the_sentence_came_first", "rawIndex": 2}, {"title": "Page 03 · The Pattern Has a Name", "body_md": "이 4년짜리 패턴에는 이름을 붙일 수 있다.\n\n> **회장의 개인 화행이 회사의 공적 사고가 되는 패턴.**\n\n이 패턴은 한 번 작동할 때마다 회사의 매장·파트너·회원에게 비용을 만든다. 같은 패턴이 다시 작동할 때마다 같은 비용 구조가 다시 작동한다. 4년이 지나는 동안 이 비용은 누적된다.", "body_html": "<p>이 4년짜리 패턴에는 이름을 붙일 수 있다.</p>\n<blockquote><p><strong>회장의 개인 화행이 회사의 공적 사고가 되는 패턴.</strong></p></blockquote>\n<p>이 패턴은 한 번 작동할 때마다 회사의 매장·파트너·회원에게 비용을 만든다. 같은 패턴이 다시 작동할 때마다 같은 비용 구조가 다시 작동한다. 4년이 지나는 동안 이 비용은 누적된다.</p>", "plain_len": 121, "type": "the_pattern_has_a_name", "rawIndex": 3}, {"title": "Page 04 · Bridge", "body_md": "다음 탭에서 이 패턴의 timeline을 본다.", "body_html": "<p>다음 탭에서 이 패턴의 timeline을 본다.</p>", "plain_len": 21, "type": "bridge", "rawIndex": 4}], "totalPages": 4}, {"num": "02", "key": "issue", "label": "ISSUE", "ko": "쟁점", "title": "2013 → 2021 → 2022 → 2026", "short": "2013 → 2021 → 2022 → 2026", "pages": [{"title": "Page 01 · Cover", "body_md": "정용진 회장 관련 주요 사회적 논란을 시간 순으로 정리하면 네 개의 큰 자리가 보인다.", "body_html": "<p>정용진 회장 관련 주요 사회적 논란을 시간 순으로 정리하면 네 개의 큰 자리가 보인다.</p>", "plain_len": 35, "type": "cover", "rawIndex": 1}, {"title": "Page 02 · 2013 — Labor Surveillance", "body_md": "첫 번째 자리. 2013년 박근혜 정부 당시, 이마트가 노조원에 대한 불법 사찰과 노조 설립 방해 의혹으로 사회적 문제가 되었다. 정용진 당시 부회장은 서울지방고용노동청에 피의자 신분으로 소환 조사를 받았다(R-20, 매개 보도 정리).\n\n이 자리에서 비용을 떠안은 사람들은 이마트 노조원과 그 가족들이었다. 본사 측 결정의 사후 처리 비용은 매장과 직원의 자리로 흘렀다.", "body_html": "<p>첫 번째 자리. 2013년 박근혜 정부 당시, 이마트가 노조원에 대한 불법 사찰과 노조 설립 방해 의혹으로 사회적 문제가 되었다. 정용진 당시 부회장은 서울지방고용노동청에 피의자 신분으로 소환 조사를 받았다(R-20, 매개 보도 정리).</p>\n<p>이 자리에서 비용을 떠안은 사람들은 이마트 노조원과 그 가족들이었다. 본사 측 결정의 사후 처리 비용은 매장과 직원의 자리로 흘렀다.</p>", "plain_len": 158, "type": "2013_—_labor_surveillance", "rawIndex": 2}, {"title": "Page 03 · 2021 — The Finger Gesture", "body_md": "두 번째 자리. 2021년 6월 8일, 정용진 당시 부회장은 본인의 SNS에서 \"안경을 가운데 손가락으로 쓸어올리는 습관\"에 대해 홍보실장으로부터 \"오해받을 일 하지 말아달라\"는 부탁을 받았다고 본인이 직접 밝혔다(R-20).\n\n이 자리는 직접적인 피해 사건은 아니다. 다만 한 가지를 보여준다. 회장의 개인 행동이 회사의 PR 자원을 어떻게 소모하는지, 그리고 그 자리에서 홍보실이 회장에게 \"오해받을 일 하지 말아달라\"고 요청하는 자리에 이미 도달해 있었다는 점.", "body_html": "<p>두 번째 자리. 2021년 6월 8일, 정용진 당시 부회장은 본인의 SNS에서 \"안경을 가운데 손가락으로 쓸어올리는 습관\"에 대해 홍보실장으로부터 \"오해받을 일 하지 말아달라\"는 부탁을 받았다고 본인이 직접 밝혔다(R-20).</p>\n<p>이 자리는 직접적인 피해 사건은 아니다. 다만 한 가지를 보여준다. 회장의 개인 행동이 회사의 PR 자원을 어떻게 소모하는지, 그리고 그 자리에서 홍보실이 회장에게 \"오해받을 일 하지 말아달라\"고 요청하는 자리에 이미 도달해 있었다는 점.</p>", "plain_len": 201, "type": "2021_—_the_finger_gesture", "rawIndex": 3}, {"title": "Page 04 · 2022 — The \"멸공\" Episode", "body_md": "세 번째 자리. 2022년 1월 5일, 정용진 부회장은 인스타그램에 숙취해소제 사진과 함께 \"끝까지 살아남을테다. 멸공!!!\"이라는 글을 올렸다(R-12, 한국정경뉴스 등 매개 보도). 인스타그램이 이를 \"신체적 폭력 및 선동에 관한 가이드라인 위반\"으로 자동 삭제하자, 부회장은 추가로 \"난 공산주의가 싫다\", \"#기사뜸 #노빠꾸 #ㅁㅕㄹㄱㅗㅇ\" 등을 게시했다.\n\n이 자리에서 신세계·이마트 주가가 단기간에 흔들렸고, 한국노총 전국이마트노조가 직접 성명을 발표했다(R-20).\n\n정 부회장의 당시 사과는 짧았다.\n\n> **\"제 자유로 상처받은 분이 있다면 전적으로 제 부족함.\"**", "body_html": "<p>세 번째 자리. 2022년 1월 5일, 정용진 부회장은 인스타그램에 숙취해소제 사진과 함께 \"끝까지 살아남을테다. 멸공!!!\"이라는 글을 올렸다(R-12, 한국정경뉴스 등 매개 보도). 인스타그램이 이를 \"신체적 폭력 및 선동에 관한 가이드라인 위반\"으로 자동 삭제하자, 부회장은 추가로 \"난 공산주의가 싫다\", \"#기사뜸 #노빠꾸 #ㅁㅕㄹㄱㅗㅇ\" 등을 게시했다.</p>\n<p>이 자리에서 신세계·이마트 주가가 단기간에 흔들렸고, 한국노총 전국이마트노조가 직접 성명을 발표했다(R-20).</p>\n<p>정 부회장의 당시 사과는 짧았다.</p>\n<blockquote><p><strong>\"제 자유로 상처받은 분이 있다면 전적으로 제 부족함.\"</strong></p></blockquote>", "plain_len": 257, "type": "2022_—_the_\"멸공\"_episode", "rawIndex": 4}, {"title": "Page 05 · 2026 — The Tank Day", "body_md": "네 번째 자리. 2026년 5월 18일, 스타벅스 코리아의 \"탱크데이\" 마케팅 사고. 이 사건의 직접적인 결정은 정 회장이 한 것이 아니다. 4단계 결재라인은 마케팅팀과 코리아 대표 라인이었다.\n\n다만 5월 24일 정 회장은 피의자 신분으로 입건되었다(R-24, 네이트뉴스 매개 보도). 5월 26일 정 회장은 대국민 사과를 했고, 같은 자리에서 신세계그룹은 자체조사 결과를 발표했다. 이번 사건이 한 마케팅팀의 우연한 사고가 아니라 \"사회적 역사성·민감성 부재와 리스크 관리 체계의 심각한 결함\"의 결과라고 본인들이 인정했다(R-15, R-16).", "body_html": "<p>네 번째 자리. 2026년 5월 18일, 스타벅스 코리아의 \"탱크데이\" 마케팅 사고. 이 사건의 직접적인 결정은 정 회장이 한 것이 아니다. 4단계 결재라인은 마케팅팀과 코리아 대표 라인이었다.</p>\n<p>다만 5월 24일 정 회장은 피의자 신분으로 입건되었다(R-24, 네이트뉴스 매개 보도). 5월 26일 정 회장은 대국민 사과를 했고, 같은 자리에서 신세계그룹은 자체조사 결과를 발표했다. 이번 사건이 한 마케팅팀의 우연한 사고가 아니라 \"사회적 역사성·민감성 부재와 리스크 관리 체계의 심각한 결함\"의 결과라고 본인들이 인정했다(R-15, R-16).</p>", "plain_len": 238, "type": "2026_—_the_tank_day", "rawIndex": 5}, {"title": "Page 06 · The Sum", "body_md": "2013 → 2021 → 2022 → 2026.\n\n네 자리의 형태는 다르다. 노조 사찰, 손가락 습관, 멸공 발언, 탱크데이. 다만 네 자리에서 같은 한 가지가 반복된다. 회장의 개인 행위 또는 회장의 회사 결재 라인에서, 사회적 문제가 발생한다. 그리고 그 문제의 비용은 매장·파트너·고객의 자리로 흐른다.", "body_html": "<p>2013 → 2021 → 2022 → 2026.</p>\n<p>네 자리의 형태는 다르다. 노조 사찰, 손가락 습관, 멸공 발언, 탱크데이. 다만 네 자리에서 같은 한 가지가 반복된다. 회장의 개인 행위 또는 회장의 회사 결재 라인에서, 사회적 문제가 발생한다. 그리고 그 문제의 비용은 매장·파트너·고객의 자리로 흐른다.</p>", "plain_len": 129, "type": "the_sum", "rawIndex": 6}], "totalPages": 6}, {"num": "03", "key": "insight", "label": "INSIGHT", "ko": "통찰", "title": "한 사람의 감각인가, 조직의 무방비인가", "short": "한 사람의 감각인가, 조직의 무방비인가", "pages": [{"title": "Page 01 · Concept", "body_md": "이 자리에서 가장 흔하게 등장하는 한 가지 질문이 있다.\n\n이건 한 사람의 감각 부재인가, 아니면 조직의 검수 시스템 부재인가.\n\n이 질문은 양자택일처럼 보이지만, 사실 두 답은 같은 자리에서 나온다.", "body_html": "<p>이 자리에서 가장 흔하게 등장하는 한 가지 질문이 있다.</p>\n<p>이건 한 사람의 감각 부재인가, 아니면 조직의 검수 시스템 부재인가.</p>\n<p>이 질문은 양자택일처럼 보이지만, 사실 두 답은 같은 자리에서 나온다.</p>", "plain_len": 82, "type": "concept", "rawIndex": 1}, {"title": "Page 02 · Why Both Are True", "body_md": "회장 한 사람의 감각이 사회적 위험 신호를 미리 잡지 못하는 자리에 있을 때, 보통의 조직은 그 자리를 보완하는 검수 시스템을 만든다. SNS 게시 전 검토, 발언 전 사전 협의, 광고 전 사회·역사 감수성 점검 같은 절차다.\n\n정 회장의 4년짜리 패턴이 반복되었다는 사실은 두 가지를 동시에 의미한다.\n\n- 첫 번째, 회장 본인의 감각이 4년 동안 같은 위험 신호를 반복적으로 놓쳤다.\n- 두 번째, 그 사이에 조직이 이 위험을 차단하는 검수 시스템을 만들지 못했다.\n\n두 답은 같이 답이다.", "body_html": "<p>회장 한 사람의 감각이 사회적 위험 신호를 미리 잡지 못하는 자리에 있을 때, 보통의 조직은 그 자리를 보완하는 검수 시스템을 만든다. SNS 게시 전 검토, 발언 전 사전 협의, 광고 전 사회·역사 감수성 점검 같은 절차다.</p>\n<p>정 회장의 4년짜리 패턴이 반복되었다는 사실은 두 가지를 동시에 의미한다.</p>\n<ul><li>첫 번째, 회장 본인의 감각이 4년 동안 같은 위험 신호를 반복적으로 놓쳤다.</li><li>두 번째, 그 사이에 조직이 이 위험을 차단하는 검수 시스템을 만들지 못했다.</li></ul>\n<p>두 답은 같이 답이다.</p>", "plain_len": 198, "type": "why_both_are_true", "rawIndex": 2}, {"title": "Page 03 · The Asymmetric Power of CEO SNS", "body_md": "회장 한 사람의 SNS는 사적인 자리처럼 보인다. 그러나 그 SNS의 모든 게시물은 23,984명 파트너와 1,500만 회원에게 즉시 영향을 준다.\n\n평범한 직장인이 SNS에 비슷한 글을 올리면 본인 한 사람의 자리에서 끝난다. 회장이 같은 자리에 같은 글을 올리면 회사 전체의 자리에서 작동한다. 같은 행위의 비용이 비대칭적이다.\n\n이 비대칭은 회장의 자리가 곧 회사의 자리이기 때문에 발생한다. 그 자리의 비용은 회장 본인이 부담하지 않는다. 회사 전체가 부담한다.", "body_html": "<p>회장 한 사람의 SNS는 사적인 자리처럼 보인다. 그러나 그 SNS의 모든 게시물은 23,984명 파트너와 1,500만 회원에게 즉시 영향을 준다.</p>\n<p>평범한 직장인이 SNS에 비슷한 글을 올리면 본인 한 사람의 자리에서 끝난다. 회장이 같은 자리에 같은 글을 올리면 회사 전체의 자리에서 작동한다. 같은 행위의 비용이 비대칭적이다.</p>\n<p>이 비대칭은 회장의 자리가 곧 회사의 자리이기 때문에 발생한다. 그 자리의 비용은 회장 본인이 부담하지 않는다. 회사 전체가 부담한다.</p>", "plain_len": 198, "type": "the_asymmetric_power_of_ceo_sns", "rawIndex": 3}, {"title": "Page 04 · The Korean Approval Vacuum", "body_md": "한국 대기업에서 회장의 발언·SNS·결정에 사전 브레이크를 걸 수 있는 조직 구조는 사실상 존재하기 어렵다. 검수 시스템은 형식적으로 있더라도, 회장의 자리 위에는 결재할 사람이 없다.\n\n이 구조 안에서 회장의 감각 부재는 조직의 무방비와 정확히 같은 자리를 차지한다. 두 단어가 다르게 보이지만, 자리는 한 자리다.", "body_html": "<p>한국 대기업에서 회장의 발언·SNS·결정에 사전 브레이크를 걸 수 있는 조직 구조는 사실상 존재하기 어렵다. 검수 시스템은 형식적으로 있더라도, 회장의 자리 위에는 결재할 사람이 없다.</p>\n<p>이 구조 안에서 회장의 감각 부재는 조직의 무방비와 정확히 같은 자리를 차지한다. 두 단어가 다르게 보이지만, 자리는 한 자리다.</p>", "plain_len": 134, "type": "the_korean_approval_vacuum", "rawIndex": 4}, {"title": "Page 05 · Bridge", "body_md": "이 자리를 가장 정확하게 짚은 한 자리가 있다. 정 회장 본인의 조직 안에서 나온 자리다. 다음 탭에서 본다.", "body_html": "<p>이 자리를 가장 정확하게 짚은 한 자리가 있다. 정 회장 본인의 조직 안에서 나온 자리다. 다음 탭에서 본다.</p>", "plain_len": 44, "type": "bridge", "rawIndex": 5}], "totalPages": 5}, {"num": "04", "key": "case", "label": "CASE", "ko": "사례", "title": "한국노총 이마트 노조의 한 마디", "short": "한국노총 이마트 노조의 한 마디", "pages": [{"title": "Page 01 · Cover", "body_md": "2022년 멸공 게시물 논란이 한창일 때, 한국노총 전국이마트노조가 성명서 한 장을 발표했다. 성명서 제목은 다음과 같았다(R-20, 매개 보도 정리).\n\n> **\"기업인 용진이형은 멸공도 좋지만 본인이 해온 사업을 먼저 돌아보라.\"**", "body_html": "<p>2022년 멸공 게시물 논란이 한창일 때, 한국노총 전국이마트노조가 성명서 한 장을 발표했다. 성명서 제목은 다음과 같았다(R-20, 매개 보도 정리).</p>\n<blockquote><p><strong>\"기업인 용진이형은 멸공도 좋지만 본인이 해온 사업을 먼저 돌아보라.\"</strong></p></blockquote>", "plain_len": 103, "type": "cover", "rawIndex": 1}, {"title": "Page 02 · The Sentence Inside", "body_md": "성명서의 핵심 문장은 한 줄이다.\n\n> **\"본인이 하고 싶은 말 하는 것은 자유이지만, 그 여파가 수만 명의 신세계, 이마트 직원들과 그 가족들에게도 미치는 것을 고려해야 한다.\"**\n\n이 한 줄은 회장의 SNS 자유와 회사의 광범위한 책임을 같은 자리에서 본다. 자유를 부정하는 자리가 아니라, 자유의 비용 분배를 묻는 자리다.", "body_html": "<p>성명서의 핵심 문장은 한 줄이다.</p>\n<blockquote><p><strong>\"본인이 하고 싶은 말 하는 것은 자유이지만, 그 여파가 수만 명의 신세계, 이마트 직원들과 그 가족들에게도 미치는 것을 고려해야 한다.\"</strong></p></blockquote>\n<p>이 한 줄은 회장의 SNS 자유와 회사의 광범위한 책임을 같은 자리에서 본다. 자유를 부정하는 자리가 아니라, 자유의 비용 분배를 묻는 자리다.</p>", "plain_len": 137, "type": "the_sentence_inside", "rawIndex": 2}, {"title": "Page 03 · Why This Is Important", "body_md": "이 한 줄이 중요한 이유는 자리의 위치다. 이 문장은 외부 비판자가 한 말이 아니다. 정 회장의 회사의 노조가 한 말이다. 내부의 자리에서 외부보다 더 정확하게, 한 사람의 자유와 한 회사의 비용을 같은 자리에 놓고 보았다.\n\n내부의 자리가 이 말을 한 자리에서, 4년 후의 자리에서는 똑같은 패턴이 다시 반복되었다. 이 반복 자체가 한 가지를 증명한다. 내부의 한 자리의 지적이 4년 동안 조직 시스템으로 흡수되지 못했다는 점.", "body_html": "<p>이 한 줄이 중요한 이유는 자리의 위치다. 이 문장은 외부 비판자가 한 말이 아니다. 정 회장의 회사의 노조가 한 말이다. 내부의 자리에서 외부보다 더 정확하게, 한 사람의 자유와 한 회사의 비용을 같은 자리에 놓고 보았다.</p>\n<p>내부의 자리가 이 말을 한 자리에서, 4년 후의 자리에서는 똑같은 패턴이 다시 반복되었다. 이 반복 자체가 한 가지를 증명한다. 내부의 한 자리의 지적이 4년 동안 조직 시스템으로 흡수되지 못했다는 점.</p>", "plain_len": 175, "type": "why_this_is_important", "rawIndex": 3}, {"title": "Page 04 · The \"이형\" Framing", "body_md": "성명서의 호칭은 \"용진이형\"이었다. 이 호칭은 정 회장 본인이 SNS와 인터뷰에서 종종 사용한 친근한 자기 호칭이다. 노조가 이 호칭을 다시 가져와서 성명서 제목에 올린 자리에는 한 가지 의도가 있다.\n\n회장이 본인을 \"이형\"이라고 친근하게 부르는 자리에서, 그 친근함이 회사의 책임 부재로 이어지지 않게 하라는 요청. 자리의 친근함과 책임의 무게는 다른 자리에 있어야 한다는 지적.\n\n이 지적은 2022년에 발화되었고, 2026년에 다시 같은 자리에서 같은 모양으로 반복되었다.", "body_html": "<p>성명서의 호칭은 \"용진이형\"이었다. 이 호칭은 정 회장 본인이 SNS와 인터뷰에서 종종 사용한 친근한 자기 호칭이다. 노조가 이 호칭을 다시 가져와서 성명서 제목에 올린 자리에는 한 가지 의도가 있다.</p>\n<p>회장이 본인을 \"이형\"이라고 친근하게 부르는 자리에서, 그 친근함이 회사의 책임 부재로 이어지지 않게 하라는 요청. 자리의 친근함과 책임의 무게는 다른 자리에 있어야 한다는 지적.</p>\n<p>이 지적은 2022년에 발화되었고, 2026년에 다시 같은 자리에서 같은 모양으로 반복되었다.</p>", "plain_len": 204, "type": "the_\"이형\"_framing", "rawIndex": 4}, {"title": "Page 05 · Bridge", "body_md": "다음 탭에서 정 회장 시기 발언·결정의 chronology를 정리한다. 매개 보도로만, 직접 SNS 캡처 없이.", "body_html": "<p>다음 탭에서 정 회장 시기 발언·결정의 chronology를 정리한다. 매개 보도로만, 직접 SNS 캡처 없이.</p>", "plain_len": 49, "type": "bridge", "rawIndex": 5}], "totalPages": 5}, {"num": "05", "key": "archive", "label": "ARCHIVE", "ko": "자료", "title": "정용진 회장 시기 발언 chronology", "short": "정용진 회장 시기 발언 chronology", "pages": [{"title": "Page 01 · A Note on the Archive", "body_md": "이 chronology는 매개 보도를 종합한 정리다. 정 회장 본인의 SNS 게시물을 직접 캡처해서 옮기지 않는다. 매거진이 본인 SNS를 다시 배포하는 자리가 되지 않기 위한 정책이다.", "body_html": "<p>이 chronology는 매개 보도를 종합한 정리다. 정 회장 본인의 SNS 게시물을 직접 캡처해서 옮기지 않는다. 매거진이 본인 SNS를 다시 배포하는 자리가 되지 않기 위한 정책이다.</p>", "plain_len": 80, "type": "a_note_on_the_archive", "rawIndex": 1}, {"title": "Page 02 · Major Events (Public Reporting Only)", "body_md": "- **2013**: 이마트 노조원 불법 사찰·노조 설립 방해 의혹 → 서울지방고용노동청 피의자 신분 소환 조사\n- **2021-06-08**: SNS에서 \"안경을 가운데 손가락으로 쓸어올리는 습관\"에 대해 홍보실장으로부터 \"오해받을 일 하지 말아달라\" 요청 받았다고 본인 직접 공개\n- **2022-01-05**: 인스타그램 \"끝까지 살아남을테다. 멸공!!!\" 게시 → 인스타그램 자동 삭제 → 추가 게시 (\"난 공산주의가 싫다\", \"#기사뜸 #노빠꾸 #ㅁㅕㄹㄱㅗㅇ\") → 인스타그램 측 \"시스템 오류\" 해명 후 복구\n- **2022-01 후속**: 한국노총 전국이마트노조 성명서 발표\n- **2022 이후**: 인스타그램 소개란 '멸공' 거꾸로 표기 등 재점화 시도 보도\n- **2026-05-18**: 스타벅스 코리아 탱크데이 마케팅 사고 (코리아 4단계 결재라인 책임)\n- **2026-05-24**: 정용진 회장 피의자 신분 입건\n- **2026-05-26**: 대국민 사과, 자체조사 결과 발표", "body_html": "<ul><li><strong>2013</strong>: 이마트 노조원 불법 사찰·노조 설립 방해 의혹 → 서울지방고용노동청 피의자 신분 소환 조사</li><li><strong>2021-06-08</strong>: SNS에서 \"안경을 가운데 손가락으로 쓸어올리는 습관\"에 대해 홍보실장으로부터 \"오해받을 일 하지 말아달라\" 요청 받았다고 본인 직접 공개</li><li><strong>2022-01-05</strong>: 인스타그램 \"끝까지 살아남을테다. 멸공!!!\" 게시 → 인스타그램 자동 삭제 → 추가 게시 (\"난 공산주의가 싫다\", \"#기사뜸 #노빠꾸 #ㅁㅕㄹㄱㅗㅇ\") → 인스타그램 측 \"시스템 오류\" 해명 후 복구</li><li><strong>2022-01 후속</strong>: 한국노총 전국이마트노조 성명서 발표</li><li><strong>2022 이후</strong>: 인스타그램 소개란 '멸공' 거꾸로 표기 등 재점화 시도 보도</li><li><strong>2026-05-18</strong>: 스타벅스 코리아 탱크데이 마케팅 사고 (코리아 4단계 결재라인 책임)</li><li><strong>2026-05-24</strong>: 정용진 회장 피의자 신분 입건</li><li><strong>2026-05-26</strong>: 대국민 사과, 자체조사 결과 발표</li></ul>", "plain_len": 401, "type": "major_events_(public_reporting_only)", "rawIndex": 2}, {"title": "Page 03 · Day 5 Source List", "body_md": "- R-12 한국정경뉴스, \"[단독] 정용진 신세계그룹 회장, '멸공' 문구 또 다시 등장\", https://www.hjnews.co.kr/news/articleView.html?idxno=20760 (매개 정리)\n- R-20 종합 — 나무위키 정용진 항목 + 한국노총 전국이마트노조 성명 매개 보도 다수\n- R-24 네이트뉴스 매개, \"'5·18 탱크데이 논란' 정용진 피의자 입건… '절차상 조치'\", 2026-05-24, https://news.nate.com/view/20260524n15409", "body_html": "<ul><li>R-12 한국정경뉴스, \"[단독] 정용진 신세계그룹 회장, '멸공' 문구 또 다시 등장\", https://www.hjnews.co.kr/news/articleView.html?idxno=20760 (매개 정리)</li><li>R-20 종합 — 나무위키 정용진 항목 + 한국노총 전국이마트노조 성명 매개 보도 다수</li><li>R-24 네이트뉴스 매개, \"'5·18 탱크데이 논란' 정용진 피의자 입건… '절차상 조치'\", 2026-05-24, https://news.nate.com/view/20260524n15409</li></ul>", "plain_len": 238, "type": "day_5_source_list", "rawIndex": 3}, {"title": "Page 04 · End of Day Five", "body_md": "금요일이 닫혔다. 다음 자리는 이 4년짜리 패턴이 4단계 결재라인 안에서 어떻게 정렬되어 있는지, 한국 기업의 검수 시스템 자체를 본다.\n\n---", "body_html": "<p>금요일이 닫혔다. 다음 자리는 이 4년짜리 패턴이 4단계 결재라인 안에서 어떻게 정렬되어 있는지, 한국 기업의 검수 시스템 자체를 본다.</p>\n<p>---</p>", "plain_len": 61, "type": "end_of_day_five", "rawIndex": 4}], "totalPages": 4}]}, {"date": "2026-05-23", "weekday": "토", "weekdayFull": "토요일", "no": "006", "titleLine": "기업 윤리 시스템", "theme": "기업 윤리 시스템", "note_html": "<div class=\"note-card\"><strong>토요일의 역할</strong><p>토요일은 한 사람의 자리에서 한 조직의 자리로 카메라를 옮긴다. 4단계 결재라인 안의 7명이 한 번도 멈추지 않은 자리가, 한국 기업 검수 시스템의 어디에서 만들어졌는지를 본다.</p></div>", "sections": [{"num": "01", "key": "intro", "label": "INTRO", "ko": "도입", "title": "마케팅 팀에는 5·18을 아는 사람이 없었나", "short": "마케팅 팀에는 5·18을 아는 사람이 없었나", "pages": [{"title": "Page 01 · Cover", "body_md": "이번 사건의 가장 단순한 질문은 이렇다.\n\n스타벅스 코리아 마케팅 팀에는 5월 18일이 한국 사회에서 어떤 날짜인지를 아는 사람이 한 명도 없었나.", "body_html": "<p>이번 사건의 가장 단순한 질문은 이렇다.</p>\n<p>스타벅스 코리아 마케팅 팀에는 5월 18일이 한국 사회에서 어떤 날짜인지를 아는 사람이 한 명도 없었나.</p>", "plain_len": 61, "type": "cover", "rawIndex": 1}, {"title": "Page 02 · The Two Possible Answers", "body_md": "이 질문의 답은 두 가지 중 하나일 수 있다.\n\n첫 번째 답: 알았는데 무시했다. 이 경우 그것은 고의이거나 적어도 직무 유기다.\n\n두 번째 답: 진심으로 몰랐다. 이 경우 그것은 한국 시장 대상 마케팅을 책임지는 자리에서 한국 사회의 가장 기본적인 역사 감수성을 갖추지 못했다는 자기 증명이다.\n\n어느 답이든 4단계 결재라인 안의 7명 중 한 명이라도 그 단어 조합을 보고 손을 들었어야 한다는 결론은 같다.", "body_html": "<p>이 질문의 답은 두 가지 중 하나일 수 있다.</p>\n<p>첫 번째 답: 알았는데 무시했다. 이 경우 그것은 고의이거나 적어도 직무 유기다.</p>\n<p>두 번째 답: 진심으로 몰랐다. 이 경우 그것은 한국 시장 대상 마케팅을 책임지는 자리에서 한국 사회의 가장 기본적인 역사 감수성을 갖추지 못했다는 자기 증명이다.</p>\n<p>어느 답이든 4단계 결재라인 안의 7명 중 한 명이라도 그 단어 조합을 보고 손을 들었어야 한다는 결론은 같다.</p>", "plain_len": 164, "type": "the_two_possible_answers", "rawIndex": 2}, {"title": "Page 03 · The Self-Investigation Result", "body_md": "이 두 가지 답 중 신세계그룹이 5월 26일 자체조사 결과로 인정한 자리는 두 번째에 가깝다. YTN의 김지선 기자가 같은 날 보도한 자체조사 결과의 핵심은 두 줄이다(R-16).\n\n> **\"팀장, 담당, 본부장, 대표이사 총 4단계의 보고 절차를 거쳐 진행되었습니다.\"**\n>\n> **\"행사를 주관한 스타벅스 코리아 마케팅 관련자 7명 중 일부는 해당 마케팅 디자인 시안이 담긴 메일의 첨부파일조차 열지 않고 관행적으로 승인한 것으로 확인되었습니다.\"**", "body_html": "<p>이 두 가지 답 중 신세계그룹이 5월 26일 자체조사 결과로 인정한 자리는 두 번째에 가깝다. YTN의 김지선 기자가 같은 날 보도한 자체조사 결과의 핵심은 두 줄이다(R-16).</p>\n<blockquote><p><strong>\"팀장, 담당, 본부장, 대표이사 총 4단계의 보고 절차를 거쳐 진행되었습니다.\"</strong></p>\n<p><strong>\"행사를 주관한 스타벅스 코리아 마케팅 관련자 7명 중 일부는 해당 마케팅 디자인 시안이 담긴 메일의 첨부파일조차 열지 않고 관행적으로 승인한 것으로 확인되었습니다.\"</strong></p></blockquote>", "plain_len": 194, "type": "the_self-investigation_result", "rawIndex": 3}, {"title": "Page 04 · The Confession's Weight", "body_md": "이 자기 인정의 의미는 한 줄로 정리된다.\n\n> **\"우리는 결재했지만, 보지 않았다.\"**\n\n이 자리는 마케팅 사고를 한 사람의 실수로 좁힐 수 없게 만든다. 4명이 보지 못한 자리는 한 사람의 시야 부재가 아니다. 그것은 결재 절차 자체가 형식만 남고 내용이 비어 있는 구조의 결과다.", "body_html": "<p>이 자기 인정의 의미는 한 줄로 정리된다.</p>\n<blockquote><p><strong>\"우리는 결재했지만, 보지 않았다.\"</strong></p></blockquote>\n<p>이 자리는 마케팅 사고를 한 사람의 실수로 좁힐 수 없게 만든다. 4명이 보지 못한 자리는 한 사람의 시야 부재가 아니다. 그것은 결재 절차 자체가 형식만 남고 내용이 비어 있는 구조의 결과다.</p>", "plain_len": 117, "type": "the_confession's_weight", "rawIndex": 4}, {"title": "Page 05 · Bridge", "body_md": "다음 탭에서 이 결재라인의 구체적 구조를 본다.", "body_html": "<p>다음 탭에서 이 결재라인의 구체적 구조를 본다.</p>", "plain_len": 20, "type": "bridge", "rawIndex": 5}], "totalPages": 5}, {"num": "02", "key": "issue", "label": "ISSUE", "ko": "쟁점", "title": "4단계 결재라인 — 어디서 막혔어야 했나", "short": "4단계 결재라인 — 어디서 막혔어야 했나", "pages": [{"title": "Page 01 · Cover", "body_md": "경향신문의 박홍두 기자가 2026년 5월 22일 보도한 \"스타벅스 '탱크데이' 논란, 경찰 수사 스모킹건은 '5단계 결재라인'에 있다?\"는 이 결재라인을 다음과 같이 정리한다(R-13).\n\n> **\"실무팀 내에서의 수정을 거쳐 팀장, 본부장, 그리고 최종적으로 대표이사(CEO)의 재가까지 최소 4~5단계.\"**\n>\n> **\"신세계그룹 차원의 브랜드 관리 부서와의 조율도 거침.\"**", "body_html": "<p>경향신문의 박홍두 기자가 2026년 5월 22일 보도한 \"스타벅스 '탱크데이' 논란, 경찰 수사 스모킹건은 '5단계 결재라인'에 있다?\"는 이 결재라인을 다음과 같이 정리한다(R-13).</p>\n<blockquote><p><strong>\"실무팀 내에서의 수정을 거쳐 팀장, 본부장, 그리고 최종적으로 대표이사(CEO)의 재가까지 최소 4~5단계.\"</strong></p>\n<p><strong>\"신세계그룹 차원의 브랜드 관리 부서와의 조율도 거침.\"</strong></p></blockquote>", "plain_len": 171, "type": "cover", "rawIndex": 1}, {"title": "Page 02 · The Stations of the Approval", "body_md": "이 결재라인을 단계별로 풀면 다음과 같다.\n\n- **1단계 · 실무팀**: 마케팅 카피와 디자인 시안의 초안. 5월 18일과 \"탱크데이\"를 결합한 첫 자리.\n- **2단계 · 팀장**: 초안의 1차 검토. 사회적 위험 신호의 첫 차단 자리.\n- **3단계 · 본부장**: 마케팅 전체 전략 안에서의 검토. 브랜드 일관성과 사회적 맥락의 2차 차단 자리.\n- **4단계 · 대표이사(CEO)**: 최종 재가. 대외 발표 전 마지막 차단 자리.\n- **추가 · 신세계그룹 브랜드 관리 부서**: 그룹 차원의 조율. 코리아 자체 결재라인 이후의 추가 안전망.\n\n이 네 자리에 그룹 안전망까지 더하면 다섯 자리가 된다. 다섯 자리 중 한 자리도 멈추지 않았다.", "body_html": "<p>이 결재라인을 단계별로 풀면 다음과 같다.</p>\n<ul><li><strong>1단계 · 실무팀</strong>: 마케팅 카피와 디자인 시안의 초안. 5월 18일과 \"탱크데이\"를 결합한 첫 자리.</li><li><strong>2단계 · 팀장</strong>: 초안의 1차 검토. 사회적 위험 신호의 첫 차단 자리.</li><li><strong>3단계 · 본부장</strong>: 마케팅 전체 전략 안에서의 검토. 브랜드 일관성과 사회적 맥락의 2차 차단 자리.</li><li><strong>4단계 · 대표이사(CEO)</strong>: 최종 재가. 대외 발표 전 마지막 차단 자리.</li><li><strong>추가 · 신세계그룹 브랜드 관리 부서</strong>: 그룹 차원의 조율. 코리아 자체 결재라인 이후의 추가 안전망.</li></ul>\n<p>이 네 자리에 그룹 안전망까지 더하면 다섯 자리가 된다. 다섯 자리 중 한 자리도 멈추지 않았다.</p>", "plain_len": 270, "type": "the_stations_of_the_approval", "rawIndex": 2}, {"title": "Page 03 · Where It Should Have Stopped", "body_md": "이 다섯 자리 중 어디서 막혔어야 했나.\n\n이 질문에 대한 가장 정확한 답은 모든 자리에서 막혔어야 했다는 것이다. 어느 한 자리만이 책임의 핵심 자리가 아니다. 다섯 자리 모두 사회적 위험 신호를 잡아야 하는 자리였고, 다섯 자리 모두 그 신호를 놓쳤다.\n\n그렇기 때문에 이 사건의 핵심은 \"한 명의 실무자가 잘못했다\"가 아니다. 핵심은 \"다섯 자리 중 한 자리도 작동하지 않았다\"이다. 한 자리의 사고가 아니라 다섯 자리의 동시 부재다.", "body_html": "<p>이 다섯 자리 중 어디서 막혔어야 했나.</p>\n<p>이 질문에 대한 가장 정확한 답은 모든 자리에서 막혔어야 했다는 것이다. 어느 한 자리만이 책임의 핵심 자리가 아니다. 다섯 자리 모두 사회적 위험 신호를 잡아야 하는 자리였고, 다섯 자리 모두 그 신호를 놓쳤다.</p>\n<p>그렇기 때문에 이 사건의 핵심은 \"한 명의 실무자가 잘못했다\"가 아니다. 핵심은 \"다섯 자리 중 한 자리도 작동하지 않았다\"이다. 한 자리의 사고가 아니라 다섯 자리의 동시 부재다.</p>", "plain_len": 179, "type": "where_it_should_have_stopped", "rawIndex": 3}, {"title": "Page 04 · The Smoking Gun Argument", "body_md": "경향신문 보도가 \"스모킹건은 5단계 결재라인에 있다\"고 정리한 자리도 같은 자리에 있다. 단일 행위자를 찾아서 처벌하는 자리가 아니라, 다섯 자리의 동시 부재가 어떻게 가능했는지의 구조를 복원하는 자리.\n\n박홍두 기자의 정리는 다음 한 줄로 마무리된다(R-13).\n\n> **\"결재 라인을 복원하는 것이 핵심.\"**\n\n수사의 핵심이 한 사람의 처벌이 아니라 결재라인의 복원에 있다는 정리는, 사건의 책임이 한 사람의 자리에 있지 않고 구조의 자리에 있다는 점을 가장 정확하게 보여준다.", "body_html": "<p>경향신문 보도가 \"스모킹건은 5단계 결재라인에 있다\"고 정리한 자리도 같은 자리에 있다. 단일 행위자를 찾아서 처벌하는 자리가 아니라, 다섯 자리의 동시 부재가 어떻게 가능했는지의 구조를 복원하는 자리.</p>\n<p>박홍두 기자의 정리는 다음 한 줄로 마무리된다(R-13).</p>\n<blockquote><p><strong>\"결재 라인을 복원하는 것이 핵심.\"</strong></p></blockquote>\n<p>수사의 핵심이 한 사람의 처벌이 아니라 결재라인의 복원에 있다는 정리는, 사건의 책임이 한 사람의 자리에 있지 않고 구조의 자리에 있다는 점을 가장 정확하게 보여준다.</p>", "plain_len": 205, "type": "the_smoking_gun_argument", "rawIndex": 4}, {"title": "Page 05 · The Approval Vacuum Visualized", "body_md": "```text\n1단계 · 실무팀 (초안)\n   └─ 사고 신호: ❌ 잡지 못함\n\n2단계 · 팀장 (1차 검토)\n   └─ 사고 신호: ❌ 잡지 못함\n\n3단계 · 본부장 (2차 검토)\n   └─ 사고 신호: ❌ 잡지 못함\n\n4단계 · 대표이사(CEO) (최종 재가)\n   └─ 사고 신호: ❌ 잡지 못함\n\n추가 · 그룹 브랜드 관리부서\n   └─ 사고 신호: ❌ 잡지 못함\n\n→ 5월 18일 광고 게시\n→ 사회적 사건 폭발\n→ 비용은 23,984명 + 1,500만 회원 자리로 흐름\n```", "body_html": "<pre><code>1단계 · 실무팀 (초안)\n   └─ 사고 신호: ❌ 잡지 못함\n\n2단계 · 팀장 (1차 검토)\n   └─ 사고 신호: ❌ 잡지 못함\n\n3단계 · 본부장 (2차 검토)\n   └─ 사고 신호: ❌ 잡지 못함\n\n4단계 · 대표이사(CEO) (최종 재가)\n   └─ 사고 신호: ❌ 잡지 못함\n\n추가 · 그룹 브랜드 관리부서\n   └─ 사고 신호: ❌ 잡지 못함\n\n→ 5월 18일 광고 게시\n→ 사회적 사건 폭발\n→ 비용은 23,984명 + 1,500만 회원 자리로 흐름</code></pre>", "plain_len": 180, "type": "the_approval_vacuum_visualized", "rawIndex": 5}, {"title": "Page 06 · Bridge", "body_md": "이 다섯 자리의 동시 부재는 우연이 아니다. 한국 기업 구조의 정렬된 결과다. 다음 탭에서 그 정렬을 본다.", "body_html": "<p>이 다섯 자리의 동시 부재는 우연이 아니다. 한국 기업 구조의 정렬된 결과다. 다음 탭에서 그 정렬을 본다.</p>", "plain_len": 44, "type": "bridge", "rawIndex": 6}], "totalPages": 6}, {"num": "03", "key": "insight", "label": "INSIGHT", "ko": "통찰", "title": "한국 기업의 역사 감수성 부재", "short": "한국 기업의 역사 감수성 부재", "pages": [{"title": "Page 01 · Concept", "body_md": "다섯 자리가 동시에 실패하는 일은 어떻게 가능한가.\n\n한 가지 답은 단순하다. 그 다섯 자리가 모두 같은 우선순위 체계 위에서 작동하고 있기 때문이다. 그 우선순위 체계 안에서 사회·역사 감수성은 KPI·매출·캠페인 일정의 뒷자리에 있다.", "body_html": "<p>다섯 자리가 동시에 실패하는 일은 어떻게 가능한가.</p>\n<p>한 가지 답은 단순하다. 그 다섯 자리가 모두 같은 우선순위 체계 위에서 작동하고 있기 때문이다. 그 우선순위 체계 안에서 사회·역사 감수성은 KPI·매출·캠페인 일정의 뒷자리에 있다.</p>", "plain_len": 101, "type": "concept", "rawIndex": 1}, {"title": "Page 02 · The Aligned Priority", "body_md": "한국 대기업 마케팅 결재의 통상적 우선순위는 대략 다음과 같다.\n\n- 1순위: 캠페인 일정 (출시일 맞추기)\n- 2순위: 매출 KPI (전년 대비 증가율)\n- 3순위: 브랜드 일관성 (CI/BI 가이드라인)\n- 4순위: 법무 검토 (저작권·상표권·소비자보호법)\n- 5순위(또는 그 이하): 사회·역사 감수성\n\n5순위가 통과 기준의 마지막 자리에 있을 때, 그 자리는 사실상 검토되지 않는다. 통상적으로 1~4순위가 통과되면 결재는 진행된다. 5순위는 별도의 기능이 아니라, \"1~4순위 안에 자연스럽게 녹아 있다\"고 가정되는 자리다.\n\n이번 사건은 그 가정이 사실이 아니라는 것을 증명했다.", "body_html": "<p>한국 대기업 마케팅 결재의 통상적 우선순위는 대략 다음과 같다.</p>\n<ul><li>1순위: 캠페인 일정 (출시일 맞추기)</li><li>2순위: 매출 KPI (전년 대비 증가율)</li><li>3순위: 브랜드 일관성 (CI/BI 가이드라인)</li><li>4순위: 법무 검토 (저작권·상표권·소비자보호법)</li><li>5순위(또는 그 이하): 사회·역사 감수성</li></ul>\n<p>5순위가 통과 기준의 마지막 자리에 있을 때, 그 자리는 사실상 검토되지 않는다. 통상적으로 1~4순위가 통과되면 결재는 진행된다. 5순위는 별도의 기능이 아니라, \"1~4순위 안에 자연스럽게 녹아 있다\"고 가정되는 자리다.</p>\n<p>이번 사건은 그 가정이 사실이 아니라는 것을 증명했다.</p>", "plain_len": 253, "type": "the_aligned_priority", "rawIndex": 2}, {"title": "Page 03 · The Confession of \"Sociohistorical Sensitivity\"", "body_md": "신세계그룹의 5월 26일 자체조사 결과 보도가 사용한 단어가 이 자리의 정확한 이름을 알려준다.\n\n> **\"스타벅스 내부의 사회적 역사성·민감성 부재와 리스크 관리 체계의 심각한 결함.\"**\n\n\"사회적 역사성·민감성 부재\"라는 표현은 사실 본인들의 결재 우선순위 5순위가 작동하지 않았다는 자기 인정이다. 그리고 \"리스크 관리 체계의 심각한 결함\"이라는 표현은 그 부재를 보완할 별도의 안전망도 작동하지 않았다는 자기 인정이다.\n\n두 자리의 동시 부재는 한 회사의 우연이 아니라, 한국 대기업 검수 구조의 일반적 패턴이다. 이번 사건은 그 패턴이 어디까지 광범위한 비용을 만들 수 있는지를 보여준 자리다.", "body_html": "<p>신세계그룹의 5월 26일 자체조사 결과 보도가 사용한 단어가 이 자리의 정확한 이름을 알려준다.</p>\n<blockquote><p><strong>\"스타벅스 내부의 사회적 역사성·민감성 부재와 리스크 관리 체계의 심각한 결함.\"</strong></p></blockquote>\n<p>\"사회적 역사성·민감성 부재\"라는 표현은 사실 본인들의 결재 우선순위 5순위가 작동하지 않았다는 자기 인정이다. 그리고 \"리스크 관리 체계의 심각한 결함\"이라는 표현은 그 부재를 보완할 별도의 안전망도 작동하지 않았다는 자기 인정이다.</p>\n<p>두 자리의 동시 부재는 한 회사의 우연이 아니라, 한국 대기업 검수 구조의 일반적 패턴이다. 이번 사건은 그 패턴이 어디까지 광범위한 비용을 만들 수 있는지를 보여준 자리다.</p>", "plain_len": 257, "type": "the_confession_of_\"sociohistorical_sensitivity\"", "rawIndex": 3}, {"title": "Page 04 · The Apology Frames the Problem", "body_md": "같은 자체조사 결과에서 헤럴드경제가 정리한 또 다른 한 줄이 있다.\n\n> **\"마케팅 고의성 증거 찾지 못해.\"**(R-22)\n\n이 한 줄의 의미는 두 가지로 갈라진다. 한쪽 의미는 \"고의가 없었으니 도덕적·법적 책임이 줄어든다\"라는 자리다. 다른 한쪽 의미는 \"고의 없이도 거대 사회 비용이 발생할 수 있다는 점에서, 책임의 자리는 오히려 시스템 쪽으로 더 무거워진다\"라는 자리다.\n\n이 매거진은 두 번째 자리에 선다. 고의가 없었다는 점이 책임을 줄이는 자리가 아니라, 책임의 형태를 바꾸는 자리다. 사람의 책임에서 시스템의 책임으로.", "body_html": "<p>같은 자체조사 결과에서 헤럴드경제가 정리한 또 다른 한 줄이 있다.</p>\n<blockquote><p><strong>\"마케팅 고의성 증거 찾지 못해.\"</strong>(R-22)</p></blockquote>\n<p>이 한 줄의 의미는 두 가지로 갈라진다. 한쪽 의미는 \"고의가 없었으니 도덕적·법적 책임이 줄어든다\"라는 자리다. 다른 한쪽 의미는 \"고의 없이도 거대 사회 비용이 발생할 수 있다는 점에서, 책임의 자리는 오히려 시스템 쪽으로 더 무거워진다\"라는 자리다.</p>\n<p>이 매거진은 두 번째 자리에 선다. 고의가 없었다는 점이 책임을 줄이는 자리가 아니라, 책임의 형태를 바꾸는 자리다. 사람의 책임에서 시스템의 책임으로.</p>", "plain_len": 227, "type": "the_apology_frames_the_problem", "rawIndex": 4}, {"title": "Page 05 · Bridge", "body_md": "이런 패턴은 한국만의 패턴이 아니다. 다만 한국의 패턴이 사후 처리되는 방식은 다른 사회와 다른 자리에 있다. 다음 탭에서 두 개의 글로벌 비교 사례를 본다.", "body_html": "<p>이런 패턴은 한국만의 패턴이 아니다. 다만 한국의 패턴이 사후 처리되는 방식은 다른 사회와 다른 자리에 있다. 다음 탭에서 두 개의 글로벌 비교 사례를 본다.</p>", "plain_len": 65, "type": "bridge", "rawIndex": 5}], "totalPages": 5}, {"num": "04", "key": "case", "label": "CASE", "ko": "사례", "title": "글로벌 비교 — 두 가지 유형의 사후 처리", "short": "글로벌 비교 — 두 가지 유형의 사후 처리", "pages": [{"title": "Page 01 · A Note on This Comparison", "body_md": "이 자리는 한국 사회를 글로벌 사례와 비교하기 위한 자리가 아니다. 한국 기업이 같은 종류의 마케팅 사고를 어떻게 사후 처리하는지를 다른 자리와 한 번 비교하기 위한 자리다.\n\n매거진은 글로벌 사례를 매개 보도 없이 인용하지 않는다. 다만 사례의 큰 형태와 사후 처리의 큰 흐름은 공개된 일반 보도 범위 안에 있기 때문에, 일반화된 형태로 비교 자리에만 사용한다.", "body_html": "<p>이 자리는 한국 사회를 글로벌 사례와 비교하기 위한 자리가 아니다. 한국 기업이 같은 종류의 마케팅 사고를 어떻게 사후 처리하는지를 다른 자리와 한 번 비교하기 위한 자리다.</p>\n<p>매거진은 글로벌 사례를 매개 보도 없이 인용하지 않는다. 다만 사례의 큰 형태와 사후 처리의 큰 흐름은 공개된 일반 보도 범위 안에 있기 때문에, 일반화된 형태로 비교 자리에만 사용한다.</p>", "plain_len": 149, "type": "a_note_on_this_comparison", "rawIndex": 1}, {"title": "Page 02 · Type One — The Image with the Word", "body_md": "한 유형은 \"역사적으로 무거운 단어를 의도하지 않게 사용한 경우\"다. 의류 브랜드가 인종·홀로코스트·전쟁 관련 단어나 상징을 패션 아이템에 부주의하게 사용한 사례들이 여기에 속한다.\n\n이 유형의 사후 처리에서 자주 관찰되는 흐름은 다음과 같다.\n\n- 1단계: 사회적 항의 발생 (24시간 안)\n- 2단계: 광고/제품 회수 (48시간 안)\n- 3단계: 해당 결재라인의 책임자 공개 사과 (1주 안)\n- 4단계: 결재라인 구조 자체에 대한 외부 점검 발표 (1개월 안)\n\n이 유형에서 본사가 1~3단계에 그치고 4단계로 가지 않을 때, 다음 사고가 반복될 가능성이 높다는 것이 일반적으로 관찰되는 패턴이다.", "body_html": "<p>한 유형은 \"역사적으로 무거운 단어를 의도하지 않게 사용한 경우\"다. 의류 브랜드가 인종·홀로코스트·전쟁 관련 단어나 상징을 패션 아이템에 부주의하게 사용한 사례들이 여기에 속한다.</p>\n<p>이 유형의 사후 처리에서 자주 관찰되는 흐름은 다음과 같다.</p>\n<ul><li>1단계: 사회적 항의 발생 (24시간 안)</li><li>2단계: 광고/제품 회수 (48시간 안)</li><li>3단계: 해당 결재라인의 책임자 공개 사과 (1주 안)</li><li>4단계: 결재라인 구조 자체에 대한 외부 점검 발표 (1개월 안)</li></ul>\n<p>이 유형에서 본사가 1~3단계에 그치고 4단계로 가지 않을 때, 다음 사고가 반복될 가능성이 높다는 것이 일반적으로 관찰되는 패턴이다.</p>", "plain_len": 253, "type": "type_one_—_the_image_with_the_word", "rawIndex": 2}, {"title": "Page 03 · Type Two — The Local-History Insensitivity", "body_md": "다른 한 유형은 \"특정 국가의 역사 감수성을 본사가 충분히 알지 못하는 경우\"다. 본사가 한 국가에 진출하면서 해당 국가의 역사적으로 무거운 날짜·인물·단어를 마케팅에 사용한 사례들이 여기에 속한다.\n\n이 유형의 사후 처리에서 일반적으로 관찰되는 흐름은 다음과 같다.\n\n- 1단계: 본사가 해당 국가 시장에 직접 사과\n- 2단계: 해당 국가 책임자 교체\n- 3단계: 본사 차원의 글로벌 검수 가이드라인 개정\n- 4단계: 글로벌 검수 가이드라인을 외부 자문에 공개 검증\n\n스타벅스 코리아 사건은 두 번째 유형에 가깝다. 다만 한 가지 다른 점이 있다. 본사(미국)는 사과했지만, 결재라인은 본사가 아니라 코리아 자체에 있었다. 즉 \"본사가 모를 수 있었다\"는 변호의 자리도 사실상 닫혀 있는 사건이다.", "body_html": "<p>다른 한 유형은 \"특정 국가의 역사 감수성을 본사가 충분히 알지 못하는 경우\"다. 본사가 한 국가에 진출하면서 해당 국가의 역사적으로 무거운 날짜·인물·단어를 마케팅에 사용한 사례들이 여기에 속한다.</p>\n<p>이 유형의 사후 처리에서 일반적으로 관찰되는 흐름은 다음과 같다.</p>\n<ul><li>1단계: 본사가 해당 국가 시장에 직접 사과</li><li>2단계: 해당 국가 책임자 교체</li><li>3단계: 본사 차원의 글로벌 검수 가이드라인 개정</li><li>4단계: 글로벌 검수 가이드라인을 외부 자문에 공개 검증</li></ul>\n<p>스타벅스 코리아 사건은 두 번째 유형에 가깝다. 다만 한 가지 다른 점이 있다. 본사(미국)는 사과했지만, 결재라인은 본사가 아니라 코리아 자체에 있었다. 즉 \"본사가 모를 수 있었다\"는 변호의 자리도 사실상 닫혀 있는 사건이다.</p>", "plain_len": 291, "type": "type_two_—_the_local-history_insensitivity", "rawIndex": 3}, {"title": "Page 04 · The Korean Difference", "body_md": "두 유형 모두에서 일반적으로 보이는 사후 처리 단계는 결재라인의 구조적 개정까지 이어진다. 한국에서 이번 사건의 사후 처리가 어디까지 갈지는 5월 26일 기준으로 아직 답이 나와 있지 않다. 사과는 했고, 코리아 대표는 해임되었고, 회장은 피의자로 입건되었다. 그러나 결재라인 자체의 구조적 개정 — 5순위였던 사회·역사 감수성을 어느 자리로 끌어올릴 것인가, 별도의 외부 자문 시스템을 두는가 — 에 대한 약속은 아직 없다.\n\n이 자리가 이번 사건이 단발성으로 끝나느냐 반복되느냐의 분기점이다.", "body_html": "<p>두 유형 모두에서 일반적으로 보이는 사후 처리 단계는 결재라인의 구조적 개정까지 이어진다. 한국에서 이번 사건의 사후 처리가 어디까지 갈지는 5월 26일 기준으로 아직 답이 나와 있지 않다. 사과는 했고, 코리아 대표는 해임되었고, 회장은 피의자로 입건되었다. 그러나 결재라인 자체의 구조적 개정 — 5순위였던 사회·역사 감수성을 어느 자리로 끌어올릴 것인가, 별도의 외부 자문 시스템을 두는가 — 에 대한 약속은 아직 없다.</p>\n<p>이 자리가 이번 사건이 단발성으로 끝나느냐 반복되느냐의 분기점이다.</p>", "plain_len": 210, "type": "the_korean_difference", "rawIndex": 4}], "totalPages": 4}, {"num": "05", "key": "archive", "label": "ARCHIVE", "ko": "자료", "title": "경찰 수사 chronology", "short": "경찰 수사 chronology", "pages": [{"title": "Page 01 · The Investigation Timeline", "body_md": "이번 사건과 관련한 경찰·검찰 수사의 시간 순 정리는 다음과 같다(R-14, R-23, R-24 종합).\n\n- **2026-05-19**: 시민단체 서민민생대책위원회, 정용진 회장·손정현 전 코리아 대표를 5·18민주화운동 유족·광주시민에 대한 모욕·명예훼손 혐의로 고발\n- **2026-05-21**: 강남경찰서에서 서울경찰청 광역수사단 공공범죄수사대로 사건 재배당. 한국경제 최영총 기자 보도\n- **2026-05-24**: 정용진 회장 피의자 신분 입건 (\"절차상 조치\"). 네이트뉴스 매개 보도\n- **2026-05-26**: 정용진 회장 대국민 사과. 같은 날 MBC 보도 \"휴일 광주 원정 조사\"로 광주 측 수사 진행 보도\n- **이후**: 결재라인 복원 수사 진행 중 (기사 작성 시점 종결되지 않음)", "body_html": "<p>이번 사건과 관련한 경찰·검찰 수사의 시간 순 정리는 다음과 같다(R-14, R-23, R-24 종합).</p>\n<ul><li><strong>2026-05-19</strong>: 시민단체 서민민생대책위원회, 정용진 회장·손정현 전 코리아 대표를 5·18민주화운동 유족·광주시민에 대한 모욕·명예훼손 혐의로 고발</li><li><strong>2026-05-21</strong>: 강남경찰서에서 서울경찰청 광역수사단 공공범죄수사대로 사건 재
