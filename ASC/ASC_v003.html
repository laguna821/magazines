<script id="magazine-data" type="application/json">{"summary": {"title": "Achmage Society Magazine", "volume": "Volume 003", "publisher": "Achmage", "concept": "스타벅스는 일베커피인가", "period": "2026-05-18 ~ 2026-05-24", "leadPlace": "스타벅스 코리아 탱크데이 마케팅 논란", "pageCount": 180, "sectionCount": 37}, "front_html": "<h2>스타벅스는 일베커피인가</h2><ul><li><strong>발행인 겸 총괄 매거진 에디터:</strong> Achmage</li><li><strong>발행 형식:</strong> 비정기 모바일 매거진</li><li><strong>기준 주간:</strong> 2026-05-18 월요일 ~ 2026-05-24 일요일</li><li><strong>대상 사건:</strong> 한국 스타벅스 코리아 \"탱크데이\" 마케팅 논란 (5·18 광주민주화운동 기념일)</li><li><strong>핵심 질문:</strong> 한 기업의 무책임한 마케팅 한 건이 사회의 어디까지를 얼마나 두껍게 다치게 하는가?</li><li><strong>편집 입장:</strong> 양비론 거부. 옹호 시그널 차단. 강한 비판은 사실 밀도로 받친다.</li><li><strong>읽기 구조:</strong> 좌우는 `Intro / Issue / Insight / Case / Archive` 이동, 상하는 같은 탭 안의 깊이 읽기</li><li><strong>원고 원칙:</strong> 자료는 정확하게, 인용은 매체·기자·발행일·제목·URL 5필드를 본문에 그대로 둔다, 결론은 사람을 보호하면서 도달한다</li></ul>\n<div class=\"note-card\"><strong>문서 사용법</strong><p>이 문서는 HTML에 바로 넣기 위한 <strong>원고 원본(raw text)</strong>이다. `## 날짜`는 하루 단위, `#### 탭`은 좌우 이동 단위, `##### Page`는 상하 이동 단위다. 실제 HTML에서는 `Day → Section → Page` 순서로 읽으면 된다.</p></div>\n<p>---</p>\n<h2>발행인의 말 · 왜 스타벅스를 이 톤으로 쓰는가</h2><p>지난주 월요일 저녁, 거실에서 저녁을 먹다가 아내가 한 마디를 했다. \"스타벅스가 이상해.\" 처음에는 무슨 말인가 했다. 곧이어 아내가 보여준 화면 안에는 \"탱크데이\"라는 단어가 있었다. 그리고 그 옆에는 \"5월 18일\"이라는 날짜가 있었다.</p>\n<p>이건 길게 설명할 자리가 아니다. 한국 사회에서 5월 18일은 광주에서 벌어진 학살의 날이다. 그리고 \"5월 18일 + 탱크\"는, 어느 정도 한국 인터넷을 본 사람이라면 안다. 일베라는 극우 커뮤니티가 오랫동안 반복해 온 \"전두환 장군님 부릉부릉 탱크 나가신다, 5·18 폭도 제압\" 류 비하 밈의 핵심 단어다. 한국경제는 이를 \"5·18민주화운동을 폭동으로 왜곡하거나 피해자들을 비하하는 극우 성향 커뮤니티의 비하 목적 밈\"이라고 정리했다(R-14).</p>\n<p>그래서 이 호는 이렇게 시작한다.</p>\n<blockquote><p><strong>이 사건에는 해석의 옵션이 없다.</strong></p></blockquote>\n<p>해석의 옵션이 없다는 말은 마케팅을 옹호할 자리가 없다는 뜻이다. \"탱크가 정말 5·18에서 온 건지 따져봐야 하지 않나\" 같은 질문은 이미 며칠 전에 끝났다. 본사도, 신세계도, 5·18 단체도, 경찰도 같은 결론을 공유한다. 이 매거진은 그 결론에서 다시 출발한다.</p>\n<p>그러면 무엇이 남는가. 두 가지가 남는다.</p>\n<p><strong>하나는, 이 사건이 광주에 끼친 1차 피해다.</strong> 이건 다른 자리에서 이미 많은 분들이 더 잘 다루고 있다. 우리는 그 자리를 침해하지 않는다.</p>\n<p><strong>다른 하나는, 이 사건이 만들어 낸 2차 피해의 두께다.</strong> 23,984명의 스타벅스 코리아 파트너가 \"일베벅스 알바\"라는 별명을 떠안았다(R-19). 멀쩡한 소비자들이 자기 책상 위의 스타벅스 드립백을 보며 \"이걸 학생들이 보면 어떻게 생각할까\"를 생각해야 했다. 나도 그중 한 사람이었다. 사흘 후 나는 연구실 책상 위의 선물 받은 스타벅스 드립백 세트를 치웠다.</p>\n<p>이 매거진은 이 두 번째 자리에 대한 일주일짜리 기록이다.</p>\n<blockquote><p><strong>무책임한 기업 한 곳이 한 사회의 신뢰 인프라에 어떤 광범위한 비용을 전가하는가.</strong></p></blockquote>\n<p>이 질문으로 7일을 나눈다. 그리고 7일이 끝난 다음 날, 정용진 회장이 대국민 사과를 했다. 그 사과는 발행 범위 밖에 있다. 하지만 닫고 가야 하는 자리가 있어서 Postscript 한 장을 남긴다.</p>\n<p>---</p>\n<h2>전체 편집 지도</h2><table><thead><tr><th>날짜</th><th>요일</th><th>그날의 주제</th><th>그날의 중심 질문</th><th>주요 자료 축</th></tr></thead><tbody><tr><td>2026-05-18</td><td>월</td><td>발화점</td><td>5월 18일에 \"탱크데이\"가 무엇을 건드렸나</td><td>이벤트 사실, 5·18의 무게, 첫 24시간</td></tr><tr><td>2026-05-19</td><td>화</td><td>밈의 계보</td><td>왜 이 사건에 해석의 옵션이 없는가</td><td>\"전땅크\" 밈 출처, 매개 보도</td></tr><tr><td>2026-05-20</td><td>수</td><td><strong>알바생 1차 피해</strong></td><td>본사 결정의 비용을 누가 떠안았나</td><td>4개 매체 알바생 성토글, 고용 규모</td></tr><tr><td>2026-05-21</td><td>목</td><td><strong>자기 검열 2차 피해</strong></td><td>소비자는 왜 자기 책상을 검열하게 되었나</td><td>자기 사례, 보이콧·자기검열·무대응, 환불 약관</td></tr><tr><td>2026-05-22</td><td>금</td><td>정용진 반복 패턴</td><td>이건 한 사람의 실수인가, 4년의 패턴인가</td><td>2013~2026 timeline, 노조 성명</td></tr><tr><td>2026-05-23</td><td>토</td><td>기업 윤리 시스템</td><td>4단계 결재라인은 왜 한 명도 멈추지 않았나</td><td>5단계 결재라인, 경찰 수사, 자체조사 결과</td></tr><tr><td>2026-05-24</td><td>일</td><td>정행 — 무엇을 마실 것인가</td><td>보이콧 다음에 와야 할 일상의 정치는 무엇인가</td><td>저자의 선택, 큐레이션 메서드</td></tr><tr><td>2026-05-26</td><td>(외)</td><td>Postscript — 사과는 면죄부가 아니다</td><td>\"모든 책임은 저에게\" 다음에 무엇이 와야 하는가</td><td>정용진 사과, 5·18 단체 비판</td></tr></tbody></table>\n<p>---</p>\n<h2>자료 사용 원칙</h2><div class=\"note-card\"><strong>자료와 해석을 나누는 규칙</strong><p>자료는 이 원고의 바닥이다. 하지만 자료가 원고의 주인공은 아니다. 인용은 본문에 매체·기자·발행일·제목 형식을 그대로 두고, 해석은 발행인의 문장으로 따로 쓴다. 일베 커뮤니티의 직접 자료는 단 한 차례, 학술적 매개 보도를 거쳐서만 인용한다. \"주변에 들었다\" 류 전언, 익명 SNS 단독 인용은 사용하지 않는다.</p></div>\n<p>이 원고에서 쓰는 주요 자료는 별도 `research-corpus.md`에 모았다. 본문에서는 호흡을 위해 매체+ , "sections": [{"num": "01", "key": "intro", "label": "INTRO", "ko": "도입", "title": "그날 저녁, 아내가 전해준 한 마디", "short": "그날 저녁, 아내가 전해준 한 마디", "pages": [{"title": "Page 01 · Cover", "body_md": "지난주 월요일 저녁이었다.\n\n거실에서 저녁을 먹다가 아내가 한 마디를 했다.\n\n\"스타벅스가 이상해.\"", "body_html": "<p>지난주 월요일 저녁이었다.</p>\n<p>거실에서 저녁을 먹다가 아내가 한 마디를 했다.</p>\n<p>\"스타벅스가 이상해.\"</p>", "plain_len": 43, "type": "cover", "rawIndex": 1}, {"title": "Page 02 · Scene", "body_md": "처음에는 무슨 말인가 했다. 곧이어 아내가 핸드폰 화면을 내 쪽으로 돌려서 보여주었다. 그 화면 안에는 \"탱크데이\"라는 문구가 있었다. 그리고 그 옆에는 \"5월 18일\"이라는 날짜가 있었다. 텀블러 프로모션 광고였다.\n\n그 두 단어가 같은 화면 안에 있는 것을 본 순간, 머릿속에 떠오른 첫 단어가 있었다. 스타벅스가 제정신인가.\n\n이건 정치적 반응이 아니다. 한국에서 5월 18일을 살아본 사람이라면 자동으로 작동하는 반응이다. 학교에서 배웠고, 뉴스에서 보았고, 영화에서 다시 만났다. 그날에 \"탱크\"라는 단어를 광고에 거는 것은, 마치 어떤 다른 사회에서 다른 단어를 다른 날짜에 거는 것과 같은 종류의 일이다.", "body_html": "<p>처음에는 무슨 말인가 했다. 곧이어 아내가 핸드폰 화면을 내 쪽으로 돌려서 보여주었다. 그 화면 안에는 \"탱크데이\"라는 문구가 있었다. 그리고 그 옆에는 \"5월 18일\"이라는 날짜가 있었다. 텀블러 프로모션 광고였다.</p>\n<p>그 두 단어가 같은 화면 안에 있는 것을 본 순간, 머릿속에 떠오른 첫 단어가 있었다. 스타벅스가 제정신인가.</p>\n<p>이건 정치적 반응이 아니다. 한국에서 5월 18일을 살아본 사람이라면 자동으로 작동하는 반응이다. 학교에서 배웠고, 뉴스에서 보았고, 영화에서 다시 만났다. 그날에 \"탱크\"라는 단어를 광고에 거는 것은, 마치 어떤 다른 사회에서 다른 단어를 다른 날짜에 거는 것과 같은 종류의 일이다.</p>", "plain_len": 261, "type": "scene", "rawIndex": 2}, {"title": "Page 03 · The First Question", "body_md": "그날 저녁에 떠오른 질문은 단순했다.\n\n기업이 어떻게 5월 18일을 모를 수가 있는가.\n\n마케팅을 하는 사람들이 그날의 무게를 모를 리가 없다. 디자이너도, 카피라이터도, 결재한 본부장도. 알면서 했다면 그건 다른 종류의 문제다. 모르고 했다고 해도 그건 또 다른 종류의 문제다. 어느 쪽이든 이건 \"단어 하나 잘못 골랐다\"는 차원의 일이 아니다.", "body_html": "<p>그날 저녁에 떠오른 질문은 단순했다.</p>\n<p>기업이 어떻게 5월 18일을 모를 수가 있는가.</p>\n<p>마케팅을 하는 사람들이 그날의 무게를 모를 리가 없다. 디자이너도, 카피라이터도, 결재한 본부장도. 알면서 했다면 그건 다른 종류의 문제다. 모르고 했다고 해도 그건 또 다른 종류의 문제다. 어느 쪽이든 이건 \"단어 하나 잘못 골랐다\"는 차원의 일이 아니다.</p>", "plain_len": 145, "type": "the_first_question", "rawIndex": 3}, {"title": "Page 04 · The Second Question", "body_md": "곧이어 두 번째 질문이 따라왔다.\n\n그러면 매장에서 일하는 사람들은 지금 무엇을 들으며 출근하고 있을까.\n\n그 질문은 한참 동안 사라지지 않았다. 우리는 그 질문을 며칠 동안 들고 다녔다. 매주 가는 카페에 들어갈 때마다, 책상 위의 드립백을 볼 때마다, 그 질문이 한 단계씩 더 무거워졌다.\n\n이번 호는 그 며칠의 기록이다.", "body_html": "<p>곧이어 두 번째 질문이 따라왔다.</p>\n<p>그러면 매장에서 일하는 사람들은 지금 무엇을 들으며 출근하고 있을까.</p>\n<p>그 질문은 한참 동안 사라지지 않았다. 우리는 그 질문을 며칠 동안 들고 다녔다. 매주 가는 카페에 들어갈 때마다, 책상 위의 드립백을 볼 때마다, 그 질문이 한 단계씩 더 무거워졌다.</p>\n<p>이번 호는 그 며칠의 기록이다.</p>", "plain_len": 132, "type": "the_second_question", "rawIndex": 4}, {"title": "Page 05 · Bridge", "body_md": "먼저 사실부터 정리해야 한다.\n\n무엇이 어디에서, 어떤 단어로, 누구의 결재를 거쳐 광고에 올라갔는가. 이것은 의견의 자리가 아니라 사실의 자리다.\n\n다음 탭으로 넘어가자.", "body_html": "<p>먼저 사실부터 정리해야 한다.</p>\n<p>무엇이 어디에서, 어떤 단어로, 누구의 결재를 거쳐 광고에 올라갔는가. 이것은 의견의 자리가 아니라 사실의 자리다.</p>\n<p>다음 탭으로 넘어가자.</p>", "plain_len": 73, "type": "bridge", "rawIndex": 5}], "totalPages": 5}, {"num": "02", "key": "issue", "label": "ISSUE", "ko": "쟁점", "title": "5월 18일에 \"탱크데이\"였다", "short": "5월 18일에 \"탱크데이\"였다", "pages": [{"title": "Page 01 · Cover", "body_md": "2026년 5월 15일부터 26일까지. 스타벅스 코리아의 \"버디 위크\" 텀블러 프로모션 기간이었다.\n\n이 기간 안에 세 개의 데이가 있었다.\n\n\"단테 데이\", \"탱크 데이\", \"나수 데이\".\n\n그중 \"탱크 데이\"가 5월 18일에 배치되었다.", "body_html": "<p>2026년 5월 15일부터 26일까지. 스타벅스 코리아의 \"버디 위크\" 텀블러 프로모션 기간이었다.</p>\n<p>이 기간 안에 세 개의 데이가 있었다.</p>\n<p>\"단테 데이\", \"탱크 데이\", \"나수 데이\".</p>\n<p>그중 \"탱크 데이\"가 5월 18일에 배치되었다.</p>", "plain_len": 102, "type": "cover", "rawIndex": 1}, {"title": "Page 02 · Data Note", "body_md": "Korea Herald와 다수 국내 매체에 따르면(R-01, R-02), 스타벅스 코리아는 5월 18일을 \"탱크 시리즈\" 텀블러 출시일로 잡고, 공식 앱과 온라인 스토어에 이를 홍보하는 이미지를 올렸다. 이미지 안에는 \"탱크데이\"라는 문구가 5월 18일 아이콘과 함께 배치되었고, 같은 이미지 왼쪽에는 \"책상에 탁!\"이라는 표현도 함께 들어가 있었다.\n\n\"책상에 탁\"이 무엇을 가리키는지는, 한국에서 이 문장을 처음 들은 적 없는 사람을 만나기 어려울 정도로 잘 알려져 있다. 1987년 박종철 열사가 경찰의 물고문으로 숨졌을 때, 강민창 당시 치안본부장이 \"책상을 탁 치니 '억' 하고 쓰러졌다\"고 발표한 그 문장이다. 한국 현대사 교과서가 거의 빠짐없이 다루는 사건이다.", "body_html": "<p>Korea Herald와 다수 국내 매체에 따르면(R-01, R-02), 스타벅스 코리아는 5월 18일을 \"탱크 시리즈\" 텀블러 출시일로 잡고, 공식 앱과 온라인 스토어에 이를 홍보하는 이미지를 올렸다. 이미지 안에는 \"탱크데이\"라는 문구가 5월 18일 아이콘과 함께 배치되었고, 같은 이미지 왼쪽에는 \"책상에 탁!\"이라는 표현도 함께 들어가 있었다.</p>\n<p>\"책상에 탁\"이 무엇을 가리키는지는, 한국에서 이 문장을 처음 들은 적 없는 사람을 만나기 어려울 정도로 잘 알려져 있다. 1987년 박종철 열사가 경찰의 물고문으로 숨졌을 때, 강민창 당시 치안본부장이 \"책상을 탁 치니 '억' 하고 쓰러졌다\"고 발표한 그 문장이다. 한국 현대사 교과서가 거의 빠짐없이 다루는 사건이다.</p>", "plain_len": 291, "type": "data_note", "rawIndex": 2}, {"title": "Page 03 · The Combination", "body_md": "이 사건의 핵심은 단어 하나가 아니다. 단어들의 조합이다.\n\n5월 18일 + 탱크 + 책상에 탁.\n\n세 개의 단어가 한 화면 안에 같이 들어가 있었다. 한국 현대사의 두 개의 거대한 폭력 사건 — 광주 학살과 박종철 고문치사 — 을 동시에 가리키는 조합이다.\n\n이건 단어 하나를 잘못 고른 게 아니다. 두 개의 비극을 한 광고 안에 동시에 호출했다.", "body_html": "<p>이 사건의 핵심은 단어 하나가 아니다. 단어들의 조합이다.</p>\n<p>5월 18일 + 탱크 + 책상에 탁.</p>\n<p>세 개의 단어가 한 화면 안에 같이 들어가 있었다. 한국 현대사의 두 개의 거대한 폭력 사건 — 광주 학살과 박종철 고문치사 — 을 동시에 가리키는 조합이다.</p>\n<p>이건 단어 하나를 잘못 고른 게 아니다. 두 개의 비극을 한 광고 안에 동시에 호출했다.</p>", "plain_len": 137, "type": "the_combination", "rawIndex": 3}, {"title": "Page 04 · What Happened in Hours", "body_md": "이미지가 공개되고 몇 시간 안에 SNS와 온라인 커뮤니티가 움직였다. 5월 18일 저녁부터 5월 19일 새벽까지, 트위터·디시인사이드·뽐뿌·클리앙에 이미지가 캡처되어 올라왔다. 5월 19일 오전부터 매체 보도가 시작되었다.\n\n스타벅스 코리아는 같은 날 안에 사과문을 내고 해당 광고를 내렸다. 본사(미국) 잭 안데르손 대변인은 \"한국에서 5·18 광주민주화운동 기념일과 관련되고, 해당 기념일과 겹쳐 발생한 용납할 수 없는 마케팅 사안에 대해 깊이 사과한다\", \"의도한 것은 아니었지만, 결코 일어나서는 안 되는 일이었다\"고 밝혔다(R-01).", "body_html": "<p>이미지가 공개되고 몇 시간 안에 SNS와 온라인 커뮤니티가 움직였다. 5월 18일 저녁부터 5월 19일 새벽까지, 트위터·디시인사이드·뽐뿌·클리앙에 이미지가 캡처되어 올라왔다. 5월 19일 오전부터 매체 보도가 시작되었다.</p>\n<p>스타벅스 코리아는 같은 날 안에 사과문을 내고 해당 광고를 내렸다. 본사(미국) 잭 안데르손 대변인은 \"한국에서 5·18 광주민주화운동 기념일과 관련되고, 해당 기념일과 겹쳐 발생한 용납할 수 없는 마케팅 사안에 대해 깊이 사과한다\", \"의도한 것은 아니었지만, 결코 일어나서는 안 되는 일이었다\"고 밝혔다(R-01).</p>", "plain_len": 239, "type": "what_happened_in_hours", "rawIndex": 4}, {"title": "Page 05 · Bridge", "body_md": "여기까지가 사실이다.\n\n여기서부터는 의미다. 다음 탭에서는 \"5월 18일\"이라는 날짜가 한국 사회에서 어떤 무게를 가지는지, 그리고 왜 이 사건이 광주에서 멈추지 않고 다른 자리에서도 새 폭발을 일으켰는지를 본다.", "body_html": "<p>여기까지가 사실이다.</p>\n<p>여기서부터는 의미다. 다음 탭에서는 \"5월 18일\"이라는 날짜가 한국 사회에서 어떤 무게를 가지는지, 그리고 왜 이 사건이 광주에서 멈추지 않고 다른 자리에서도 새 폭발을 일으켰는지를 본다.</p>", "plain_len": 92, "type": "bridge", "rawIndex": 5}], "totalPages": 5}, {"num": "03", "key": "insight", "label": "INSIGHT", "ko": "통찰", "title": "한국에서 5월 18일이라는 무게", "short": "한국에서 5월 18일이라는 무게", "pages": [{"title": "Page 01 · Concept", "body_md": "5월 18일은 한국에서 단순한 기념일이 아니다.\n\n이 날짜는 1980년 신군부가 광주에서 시민에게 발포한 날이다. 며칠 동안 시민들이 죽었고, 그 죽음에 대한 책임은 40년이 넘게 정치적·법적 다툼의 대상이었다. 2026년 현재까지도 5·18은 \"끝난 사건\"이 아니다. 유족이 살아 있고, 보상과 명예 회복 절차가 여전히 진행 중이고, 가해자 측의 부정과 왜곡이 여전히 반복된다.\n\n이 날짜에 \"탱크\"라는 단어를 광고에 거는 것은, 그 모든 진행 중인 자리 위에 한 번 더 발을 올리는 일이다.", "body_html": "<p>5월 18일은 한국에서 단순한 기념일이 아니다.</p>\n<p>이 날짜는 1980년 신군부가 광주에서 시민에게 발포한 날이다. 며칠 동안 시민들이 죽었고, 그 죽음에 대한 책임은 40년이 넘게 정치적·법적 다툼의 대상이었다. 2026년 현재까지도 5·18은 \"끝난 사건\"이 아니다. 유족이 살아 있고, 보상과 명예 회복 절차가 여전히 진행 중이고, 가해자 측의 부정과 왜곡이 여전히 반복된다.</p>\n<p>이 날짜에 \"탱크\"라는 단어를 광고에 거는 것은, 그 모든 진행 중인 자리 위에 한 번 더 발을 올리는 일이다.</p>", "plain_len": 207, "type": "concept", "rawIndex": 1}, {"title": "Page 02 · Tank Is Not Just a Tank", "body_md": "5월 18일과 탱크의 조합은, 한국 인터넷의 특정 커뮤니티에서 오래 굳어진 표현이다.\n\n전두환 전 대통령의 별명 중 하나로 \"전땅크\"가 있다. 광주에서 군이 시민을 향해 장갑차를 투입한 사실에서 유래한 별명이다. 이 별명은 일베라는 극우 커뮤니티에서 오래 반복되며 \"전두환 장군님 부릉부릉 탱크 나가신다, 5·18 폭도 제압\" 류 비하 슬로건의 핵심 단어가 되었다.\n\nZDNet Korea의 류승현 기자가 2026년 5월 21일 보도한 \"스타벅스 '5·18 탱크데이' 논란, SNS서 풍자 넘어 희화화 우려↑\"에 따르면(R-03), 사건 직후 SNS에는 전두환 전 대통령이 스타벅스 텀블러를 들고 있는 합성 이미지와 AI 영상이 올라왔다. 보도는 이를 \"단순 풍자나 밈으로 소비하는 수준을 넘어, 희생자와 유가족의 고통을 조롱하는 행위\"로 정리했다.", "body_html": "<p>5월 18일과 탱크의 조합은, 한국 인터넷의 특정 커뮤니티에서 오래 굳어진 표현이다.</p>\n<p>전두환 전 대통령의 별명 중 하나로 \"전땅크\"가 있다. 광주에서 군이 시민을 향해 장갑차를 투입한 사실에서 유래한 별명이다. 이 별명은 일베라는 극우 커뮤니티에서 오래 반복되며 \"전두환 장군님 부릉부릉 탱크 나가신다, 5·18 폭도 제압\" 류 비하 슬로건의 핵심 단어가 되었다.</p>\n<p>ZDNet Korea의 류승현 기자가 2026년 5월 21일 보도한 \"스타벅스 '5·18 탱크데이' 논란, SNS서 풍자 넘어 희화화 우려↑\"에 따르면(R-03), 사건 직후 SNS에는 전두환 전 대통령이 스타벅스 텀블러를 들고 있는 합성 이미지와 AI 영상이 올라왔다. 보도는 이를 \"단순 풍자나 밈으로 소비하는 수준을 넘어, 희생자와 유가족의 고통을 조롱하는 행위\"로 정리했다.</p>", "plain_len": 322, "type": "tank_is_not_just_a_tank", "rawIndex": 2}, {"title": "Page 03 · Why It Spread Beyond Gwangju", "body_md": "이 사건이 광주의 자리에서 끝나지 않은 데에는 또 하나의 이유가 있다.\n\n파이낸셜뉴스가 2026년 5월 22일 보도한 \"스타벅스 '탱크데이' 논란에 국힘 또… 청년혁신위원장 출신 '5·18은 폭동'\"(R-21)에 따르면, 스타벅스 사건 이후 며칠 안에 국민의힘의 한 인사가 \"5·18은 폭동\"이라는 취지의 발언을 다시 꺼냈다. 5·18을 부정하는 발언은 한국 정치에서 주기적으로 등장하지만, 이번에는 스타벅스 마케팅 사고를 따라 다시 정상화되었다.\n\n기업의 한 건이 사회 전반의 5·18 부정 발언을 다시 살린 셈이다.", "body_html": "<p>이 사건이 광주의 자리에서 끝나지 않은 데에는 또 하나의 이유가 있다.</p>\n<p>파이낸셜뉴스가 2026년 5월 22일 보도한 \"스타벅스 '탱크데이' 논란에 국힘 또… 청년혁신위원장 출신 '5·18은 폭동'\"(R-21)에 따르면, 스타벅스 사건 이후 며칠 안에 국민의힘의 한 인사가 \"5·18은 폭동\"이라는 취지의 발언을 다시 꺼냈다. 5·18을 부정하는 발언은 한국 정치에서 주기적으로 등장하지만, 이번에는 스타벅스 마케팅 사고를 따라 다시 정상화되었다.</p>\n<p>기업의 한 건이 사회 전반의 5·18 부정 발언을 다시 살린 셈이다.</p>", "plain_len": 224, "type": "why_it_spread_beyond_gwangju", "rawIndex": 3}, {"title": "Page 04 · The Real Insight", "body_md": "진짜 통찰은 여기에 있다.\n\n> **이 사건은 한 광고의 사고가 아니다. 한 사회가 5·18을 다루는 방식의 사고다.**\n\n기업이 5·18을 모를 수 있는 사회. 모르고도 4단계 결재가 통과되는 사회. 그 사고가 다시 정치권의 부정 발언으로 이어지는 사회. 그 안에서 광주의 유족과 광주 시민이 한 번 더 모욕을 견뎌야 하는 사회.\n\n이 매거진의 첫 번째 결론은 이렇다. 스타벅스는 한 사회의 약한 자리를 정확하게 건드렸다. 그리고 그 사회는 그 자리에서 다시 한 번 흔들렸다.", "body_html": "<p>진짜 통찰은 여기에 있다.</p>\n<blockquote><p><strong>이 사건은 한 광고의 사고가 아니다. 한 사회가 5·18을 다루는 방식의 사고다.</strong></p></blockquote>\n<p>기업이 5·18을 모를 수 있는 사회. 모르고도 4단계 결재가 통과되는 사회. 그 사고가 다시 정치권의 부정 발언으로 이어지는 사회. 그 안에서 광주의 유족과 광주 시민이 한 번 더 모욕을 견뎌야 하는 사회.</p>\n<p>이 매거진의 첫 번째 결론은 이렇다. 스타벅스는 한 사회의 약한 자리를 정확하게 건드렸다. 그리고 그 사회는 그 자리에서 다시 한 번 흔들렸다.</p>", "plain_len": 194, "type": "the_real_insight", "rawIndex": 4}, {"title": "Page 05 · Bridge", "body_md": "이 흔들림은 광주에서만 멈추지 않았다.\n\n방향이 두 갈래로 갈라졌다. 한쪽은 광주 바깥의 일반 시민들의 자리이고, 다른 한쪽은 스타벅스 매장에서 일하는 23,984명의 자리다. 우리는 이번 호에서 그 두 자리를 천천히 본다.\n\n먼저 이번 사건이 첫 24시간 동안 어떻게 퍼졌는지를 정리하자.", "body_html": "<p>이 흔들림은 광주에서만 멈추지 않았다.</p>\n<p>방향이 두 갈래로 갈라졌다. 한쪽은 광주 바깥의 일반 시민들의 자리이고, 다른 한쪽은 스타벅스 매장에서 일하는 23,984명의 자리다. 우리는 이번 호에서 그 두 자리를 천천히 본다.</p>\n<p>먼저 이번 사건이 첫 24시간 동안 어떻게 퍼졌는지를 정리하자.</p>", "plain_len": 122, "type": "bridge", "rawIndex": 5}], "totalPages": 5}, {"num": "04", "key": "case", "label": "CASE", "ko": "사례", "title": "첫 24시간 — 트위터에서 디시까지", "short": "첫 24시간 — 트위터에서 디시까지", "pages": [{"title": "Page 01 · Cover", "body_md": "사건이 공식 광고에 올라간 시각은 정확히 알려지지 않았다. 다만 5월 18일 저녁부터 SNS에 이미지가 캡처되어 올라오기 시작했고, 5월 19일 오전부터 매체 보도가 시작되었다. 24시간 안에 사건은 광고에서 사회 의제로 옮겨졌다.", "body_html": "<p>사건이 공식 광고에 올라간 시각은 정확히 알려지지 않았다. 다만 5월 18일 저녁부터 SNS에 이미지가 캡처되어 올라오기 시작했고, 5월 19일 오전부터 매체 보도가 시작되었다. 24시간 안에 사건은 광고에서 사회 의제로 옮겨졌다.</p>", "plain_len": 100, "type": "cover", "rawIndex": 1}, {"title": "Page 02 · The Spread", "body_md": "이미지가 가장 먼저 활발하게 돈 곳은 트위터(X)였다. 그 다음 디시인사이드, 뽐뿌, 클리앙, 펨코 같은 대형 커뮤니티가 차례로 받았다. 게시물의 형식은 비교적 단순했다. 광고 이미지 캡처 + \"이거 진짜냐?\"의 짧은 코멘트.\n\n캡처가 한 차례 돈 다음부터 반응은 두 갈래로 갈라졌다. 한쪽은 분노였다. 다른 한쪽은, 위에서 본 합성 이미지·AI 영상처럼, 사건 자체를 일베 밈의 새 재료로 만드는 흐름이었다.", "body_html": "<p>이미지가 가장 먼저 활발하게 돈 곳은 트위터(X)였다. 그 다음 디시인사이드, 뽐뿌, 클리앙, 펨코 같은 대형 커뮤니티가 차례로 받았다. 게시물의 형식은 비교적 단순했다. 광고 이미지 캡처 + \"이거 진짜냐?\"의 짧은 코멘트.</p>\n<p>캡처가 한 차례 돈 다음부터 반응은 두 갈래로 갈라졌다. 한쪽은 분노였다. 다른 한쪽은, 위에서 본 합성 이미지·AI 영상처럼, 사건 자체를 일베 밈의 새 재료로 만드는 흐름이었다.</p>", "plain_len": 173, "type": "the_spread", "rawIndex": 2}, {"title": "Page 03 · The Second 24 Hours", "body_md": "다음 날부터 매체가 들어왔다.\n\n서울신문은 5월 23일까지 일주일 동안 사건의 사실관계와 매장 직원들의 성토글까지 일관되게 다뤘다(R-02, R-06). 이데일리의 신수정 기자는 5월 19일 오후 \"불매운동 확산 중인데… '5·18 마케팅 논란' 스타벅스 가보니\"라는 매장 르포를 냈다(R-10). 같은 날 저녁부터 SNS에는 \"스타벅스 앱 탈퇴 인증\", \"기프티콘 환불 인증\", \"텀블러 폐기 영상\"이 올라오기 시작했다.\n\n24시간이 더 지나면서 사건은 SNS의 분노 → 매체의 사실 보도 → 매장 르포 → 알바생의 성토글 → 정치권의 5·18 부정 발언 재점화로 단계별로 넘어갔다.", "body_html": "<p>다음 날부터 매체가 들어왔다.</p>\n<p>서울신문은 5월 23일까지 일주일 동안 사건의 사실관계와 매장 직원들의 성토글까지 일관되게 다뤘다(R-02, R-06). 이데일리의 신수정 기자는 5월 19일 오후 \"불매운동 확산 중인데… '5·18 마케팅 논란' 스타벅스 가보니\"라는 매장 르포를 냈다(R-10). 같은 날 저녁부터 SNS에는 \"스타벅스 앱 탈퇴 인증\", \"기프티콘 환불 인증\", \"텀블러 폐기 영상\"이 올라오기 시작했다.</p>\n<p>24시간이 더 지나면서 사건은 SNS의 분노 → 매체의 사실 보도 → 매장 르포 → 알바생의 성토글 → 정치권의 5·18 부정 발언 재점화로 단계별로 넘어갔다.</p>", "plain_len": 252, "type": "the_second_24_hours", "rawIndex": 3}, {"title": "Page 04 · The Pattern", "body_md": "이런 단계별 확산은 한국 사회의 큰 마케팅 사고에서 반복되는 패턴이다.\n\n다만 이번 사건은 그 패턴 위에 추가된 두 가지가 있었다. 하나는 일베 측의 합성 콘텐츠 생산이고, 다른 하나는 며칠 후 시작된 매장 직원들의 성토글이었다. 후자는 다음 수요일 자리에서 본다.", "body_html": "<p>이런 단계별 확산은 한국 사회의 큰 마케팅 사고에서 반복되는 패턴이다.</p>\n<p>다만 이번 사건은 그 패턴 위에 추가된 두 가지가 있었다. 하나는 일베 측의 합성 콘텐츠 생산이고,
