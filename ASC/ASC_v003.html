 책임을 한 사람의 자리에서 한 회사의 자리에서 한 사회의 자리로 옮긴 자리다. 사건의 비용은 더 광범위해졌다. 그러나 그 비용의 책임 자리는 더 정확해졌다.", "body_html": "<p>토요일이 닫혔다. 한 사건의 책임을 한 사람의 자리에서 한 회사의 자리에서 한 사회의 자리로 옮긴 자리다. 사건의 비용은 더 광범위해졌다. 그러나 그 비용의 책임 자리는 더 정확해졌다.</p>", "plain_len": 77, "type": "the_end_of_day_six", "rawIndex": 3}, {"title": "Page 04 · The Question for Tomorrow", "body_md": "내일은 마지막 자리다.\n\n질문은 단순하다. 이 매거진을 읽은 사람이, 다음 주 월요일 아침에 무엇을 마실 것인가. 보이콧의 자리가 있다. 자기 검열의 자리가 있다. 무대응의 자리가 있다. 우리는 어느 자리에 서는가. 그리고 그 자리는 정행(正行)인가.", "body_html": "<p>내일은 마지막 자리다.</p>\n<p>질문은 단순하다. 이 매거진을 읽은 사람이, 다음 주 월요일 아침에 무엇을 마실 것인가. 보이콧의 자리가 있다. 자기 검열의 자리가 있다. 무대응의 자리가 있다. 우리는 어느 자리에 서는가. 그리고 그 자리는 정행(正行)인가.</p>", "plain_len": 106, "type": "the_question_for_tomorrow", "rawIndex": 4}, {"title": "Page 05 · End", "body_md": "다음 자리에서 본다.\n\n---", "body_html": "<p>다음 자리에서 본다.</p>\n<p>---</p>", "plain_len": 12, "type": "end", "rawIndex": 5}], "totalPages": 5}]}, {"date": "2026-05-24", "weekday": "일", "weekdayFull": "일요일", "no": "007", "titleLine": "정행 — 우리는 무엇을 마실 것인가", "theme": "정행 — 우리는 무엇을 마실 것인가", "note_html": "<div class=\"note-card\"><strong>일요일의 역할</strong><p>일요일은 이 호의 마무리 자리다. 보이콧·자기검열·무대응의 세 자리 중 어디에 설 것인가의 답을 외부에서 가져오지 않는다. 저자 본인이 다음 주 월요일 아침부터 어떤 자리에 서기로 했는지를 보여주는 자리다. 추천이 아니라 메서드. 따라할 것이 아니라, 각자의 자리에서 각자의 결정을 위한 한 가지 예시.</p></div>", "sections": [{"num": "01", "key": "intro", "label": "INTRO", "ko": "도입", "title": "치워진 드립백 자리, 무엇을 놓을까", "short": "치워진 드립백 자리, 무엇을 놓을까", "pages": [{"title": "Page 01 · Cover", "body_md": "7일째 아침이다.\n\n연구실 책상 위에는 빈 자리가 있다. 며칠 전까지 거기에는 선물 받은 스타벅스 드립백 세트가 있었다. 지금은 비어 있다.", "body_html": "<p>7일째 아침이다.</p>\n<p>연구실 책상 위에는 빈 자리가 있다. 며칠 전까지 거기에는 선물 받은 스타벅스 드립백 세트가 있었다. 지금은 비어 있다.</p>", "plain_len": 58, "type": "cover", "rawIndex": 1}, {"title": "Page 02 · The Empty Spot", "body_md": "빈 자리는 신기하게도, 거기에 무엇이 있었는지보다 거기에 무엇이 없는지가 먼저 보인다. 며칠 동안 그 자리에 있던 것의 모양이 책상 위에 잔상처럼 남아 있다.\n\n이 빈 자리에 다음 주에 무엇을 놓을 것인가. 같은 회사의 드립백을 다시 사 와서 놓을 수도 있다. 다른 회사의 드립백을 놓을 수도 있다. 그냥 비워둘 수도 있다. 컵 하나, 식물 하나, 책 한 권을 놓을 수도 있다.\n\n이 결정은 마케팅의 자리가 아니다. 통계의 자리도 아니다. 매일 매일의 자리다.", "body_html": "<p>빈 자리는 신기하게도, 거기에 무엇이 있었는지보다 거기에 무엇이 없는지가 먼저 보인다. 며칠 동안 그 자리에 있던 것의 모양이 책상 위에 잔상처럼 남아 있다.</p>\n<p>이 빈 자리에 다음 주에 무엇을 놓을 것인가. 같은 회사의 드립백을 다시 사 와서 놓을 수도 있다. 다른 회사의 드립백을 놓을 수도 있다. 그냥 비워둘 수도 있다. 컵 하나, 식물 하나, 책 한 권을 놓을 수도 있다.</p>\n<p>이 결정은 마케팅의 자리가 아니다. 통계의 자리도 아니다. 매일 매일의 자리다.</p>", "plain_len": 185, "type": "the_empty_spot", "rawIndex": 2}, {"title": "Page 03 · The Method Question", "body_md": "이 결정을 도와줄 한 가지 메서드가 있다면, 그것은 \"추천 받기\"가 아니다.\n\n추천 받기는 자리를 자기 바깥으로 옮긴다. 누군가가 좋다는 것을 따라가는 자리는, 그 누군가가 다음에 또 다른 것을 추천하면 다시 옮겨야 하는 자리다.\n\n이 매거진의 일요일이 제안하는 메서드는 다른 자리다. 자기에게 묻고, 자기가 답하고, 그 답을 매일 하나씩 점검하는 자리. 작지만 매일이라는 점에서 단단한 자리.", "body_html": "<p>이 결정을 도와줄 한 가지 메서드가 있다면, 그것은 \"추천 받기\"가 아니다.</p>\n<p>추천 받기는 자리를 자기 바깥으로 옮긴다. 누군가가 좋다는 것을 따라가는 자리는, 그 누군가가 다음에 또 다른 것을 추천하면 다시 옮겨야 하는 자리다.</p>\n<p>이 매거진의 일요일이 제안하는 메서드는 다른 자리다. 자기에게 묻고, 자기가 답하고, 그 답을 매일 하나씩 점검하는 자리. 작지만 매일이라는 점에서 단단한 자리.</p>", "plain_len": 164, "type": "the_method_question", "rawIndex": 3}, {"title": "Page 04 · The Three Seats Revisited", "body_md": "목요일에 본 세 자리를 다시 가져온다. 보이콧, 자기검열, 무대응.\n\n이 세 자리 중 정답은 없다. 한 사람이 한 시점에 한 자리에 있는 것이 자연스럽다. 다만 그 자리가 자기가 선택한 자리인지, 아니면 다른 자리가 어려워서 마지막으로 남은 자리인지를 한 번씩 점검할 수 있다.\n\n이 매거진의 저자가 지금 있는 자리는 자기검열이다. 보이콧으로 옮길 수도 있고, 무대응으로 옮길 수도 있다. 어느 자리에 서든, 그 자리는 자기가 선택한 자리여야 한다.", "body_html": "<p>목요일에 본 세 자리를 다시 가져온다. 보이콧, 자기검열, 무대응.</p>\n<p>이 세 자리 중 정답은 없다. 한 사람이 한 시점에 한 자리에 있는 것이 자연스럽다. 다만 그 자리가 자기가 선택한 자리인지, 아니면 다른 자리가 어려워서 마지막으로 남은 자리인지를 한 번씩 점검할 수 있다.</p>\n<p>이 매거진의 저자가 지금 있는 자리는 자기검열이다. 보이콧으로 옮길 수도 있고, 무대응으로 옮길 수도 있다. 어느 자리에 서든, 그 자리는 자기가 선택한 자리여야 한다.</p>", "plain_len": 184, "type": "the_three_seats_revisited", "rawIndex": 4}, {"title": "Page 05 · Bridge", "body_md": "다음 탭에서 이 선택의 자리를 조금 더 본다.", "body_html": "<p>다음 탭에서 이 선택의 자리를 조금 더 본다.</p>", "plain_len": 18, "type": "bridge", "rawIndex": 5}], "totalPages": 5}, {"num": "02", "key": "issue", "label": "ISSUE", "ko": "쟁점", "title": "보이콧 이상의 일상 정치", "short": "보이콧 이상의 일상 정치", "pages": [{"title": "Page 01 · Cover", "body_md": "보이콧은 가장 가시적인 자리다. 가장 빠른 자리다. 다만 가장 단단한 자리는 아닐 수 있다.", "body_html": "<p>보이콧은 가장 가시적인 자리다. 가장 빠른 자리다. 다만 가장 단단한 자리는 아닐 수 있다.</p>", "plain_len": 38, "type": "cover", "rawIndex": 1}, {"title": "Page 02 · The Limit of Boycott", "body_md": "보이콧의 한 가지 한계는 시간이다. 처음에는 강하지만, 시간이 지나면 약해진다. 매출에 단기 충격을 주지만, 회사가 사과하고 인사 조치를 하고 자체조사 결과를 발표하면 보이콧의 동력은 자연스럽게 약해진다.\n\n그래서 보이콧만으로는 4년 후의 다음 사건을 막지 못한다. 보이콧은 한 사건에 대한 즉각 반응이고, 시스템 변화에 대한 장기 압력은 다른 자리에서 만들어져야 한다.\n\n이번 사건의 두 가지 자료가 이 자리를 정확히 보여준다.", "body_html": "<p>보이콧의 한 가지 한계는 시간이다. 처음에는 강하지만, 시간이 지나면 약해진다. 매출에 단기 충격을 주지만, 회사가 사과하고 인사 조치를 하고 자체조사 결과를 발표하면 보이콧의 동력은 자연스럽게 약해진다.</p>\n<p>그래서 보이콧만으로는 4년 후의 다음 사건을 막지 못한다. 보이콧은 한 사건에 대한 즉각 반응이고, 시스템 변화에 대한 장기 압력은 다른 자리에서 만들어져야 한다.</p>\n<p>이번 사건의 두 가지 자료가 이 자리를 정확히 보여준다.</p>", "plain_len": 181, "type": "the_limit_of_boycott", "rawIndex": 2}, {"title": "Page 03 · The Two Signals", "body_md": "첫 번째 신호. 이데일리의 신수정 기자가 2026년 5월 19일 보도한 매장 르포에서 잡힌 매장의 \"평소와 크게 다르지 않은 분위기\"(R-10). 보이콧은 SNS에서는 강했지만, 매장에서는 즉각적으로 매출을 흔들 만큼 강하지는 못했다.\n\n두 번째 신호. 헤럴드경제가 정리한 자체조사 결과의 한 줄, \"마케팅 고의성 증거 찾지 못해\"(R-22). 회사 측이 사고를 시스템 결함으로 인정하는 데까지는 갔지만, 그 결함을 어떻게 구조적으로 바꾸겠다는 약속은 같은 자리에서 발표되지 않았다.\n\n두 신호를 같이 보면, 보이콧 한 자리만으로는 시스템 변화의 압력이 충분하지 않다는 것이 보인다.", "body_html": "<p>첫 번째 신호. 이데일리의 신수정 기자가 2026년 5월 19일 보도한 매장 르포에서 잡힌 매장의 \"평소와 크게 다르지 않은 분위기\"(R-10). 보이콧은 SNS에서는 강했지만, 매장에서는 즉각적으로 매출을 흔들 만큼 강하지는 못했다.</p>\n<p>두 번째 신호. 헤럴드경제가 정리한 자체조사 결과의 한 줄, \"마케팅 고의성 증거 찾지 못해\"(R-22). 회사 측이 사고를 시스템 결함으로 인정하는 데까지는 갔지만, 그 결함을 어떻게 구조적으로 바꾸겠다는 약속은 같은 자리에서 발표되지 않았다.</p>\n<p>두 신호를 같이 보면, 보이콧 한 자리만으로는 시스템 변화의 압력이 충분하지 않다는 것이 보인다.</p>", "plain_len": 250, "type": "the_two_signals", "rawIndex": 3}, {"title": "Page 04 · The Other Seats", "body_md": "그러면 무엇이 필요한가.\n\n보이콧 이상의 자리. 일상의 자리. 매일 한 번씩 작동하는 자리. 한 번의 격렬한 행위가 아니라, 매일의 작은 결정이 누적되는 자리.\n\n이 자리의 이름은 \"일상 정치\"다. 정치라는 단어가 강하게 들리면 \"일상 시민됨\"이라고 바꿔도 된다. 의미는 같다.", "body_html": "<p>그러면 무엇이 필요한가.</p>\n<p>보이콧 이상의 자리. 일상의 자리. 매일 한 번씩 작동하는 자리. 한 번의 격렬한 행위가 아니라, 매일의 작은 결정이 누적되는 자리.</p>\n<p>이 자리의 이름은 \"일상 정치\"다. 정치라는 단어가 강하게 들리면 \"일상 시민됨\"이라고 바꿔도 된다. 의미는 같다.</p>", "plain_len": 116, "type": "the_other_seats", "rawIndex": 4}], "totalPages": 4}, {"num": "03", "key": "insight", "label": "INSIGHT", "ko": "통찰", "title": "마시는 행위가 화행이 된 시대", "short": "마시는 행위가 화행이 된 시대", "pages": [{"title": "Page 01 · Concept", "body_md": "목요일에 본 한 줄을 다시 가져온다.\n\n> **마시는 행위가 화행(話行)이 되었다.**\n\n이 변화는 부담일 수도 있다. 매일 한 번씩 자기 자리를 결정해야 한다는 부담. 다만 이 변화는 한 가지를 가능하게 한다.\n\n매일 한 번씩 자기 자리를 결정하는 사람이 모이면, 그 모임이 곧 시스템 변화의 장기 압력이 된다.", "body_html": "<p>목요일에 본 한 줄을 다시 가져온다.</p>\n<blockquote><p><strong>마시는 행위가 화행(話行)이 되었다.</strong></p></blockquote>\n<p>이 변화는 부담일 수도 있다. 매일 한 번씩 자기 자리를 결정해야 한다는 부담. 다만 이 변화는 한 가지를 가능하게 한다.</p>\n<p>매일 한 번씩 자기 자리를 결정하는 사람이 모이면, 그 모임이 곧 시스템 변화의 장기 압력이 된다.</p>", "plain_len": 126, "type": "concept", "rawIndex": 1}, {"title": "Page 02 · The Citizen of Every Day", "body_md": "한국 사회는 큰 정치적 결정의 시점에서는 시민의 자리를 잘 만들어왔다. 2008년 광우병 촛불, 2016~17년 탄핵 촛불, 그 외 여러 자리에서.\n\n그러나 큰 결정 사이의 작은 시간 — 매일 매일의 시간 — 에서 시민의 자리를 만드는 것은 다른 종류의 일이다. 큰 자리는 강하다. 작은 자리는 자주 약하다.\n\n이 매거진의 일요일이 제안하는 자리는 작은 자리다. 매일 한 잔의 커피 앞에서 자기 자리를 한 번 결정하는 자리. 한 번의 큰 결정이 아니라, 일곱 번의 작은 결정이 모이는 한 주.", "body_html": "<p>한국 사회는 큰 정치적 결정의 시점에서는 시민의 자리를 잘 만들어왔다. 2008년 광우병 촛불, 2016~17년 탄핵 촛불, 그 외 여러 자리에서.</p>\n<p>그러나 큰 결정 사이의 작은 시간 — 매일 매일의 시간 — 에서 시민의 자리를 만드는 것은 다른 종류의 일이다. 큰 자리는 강하다. 작은 자리는 자주 약하다.</p>\n<p>이 매거진의 일요일이 제안하는 자리는 작은 자리다. 매일 한 잔의 커피 앞에서 자기 자리를 한 번 결정하는 자리. 한 번의 큰 결정이 아니라, 일곱 번의 작은 결정이 모이는 한 주.</p>", "plain_len": 198, "type": "the_citizen_of_every_day", "rawIndex": 2}, {"title": "Page 03 · Orthopraxy as a Daily Practice", "body_md": "이 매거진의 저자는 평소에 \"정행(正行, orthopraxy)\"이라는 단어를 사용한다. 정확하게 사는 일. 매일의 행위가 자기가 생각하는 가치와 정렬되는 일.\n\n정행은 큰 행위만의 자리가 아니다. 매일 한 잔의 커피 앞에서 한 가지 결정을 하는 자리도 정행의 자리다. 다음 주 월요일 아침 커피 한 잔의 자리에서, 자기가 무엇을 마시는지를 한 번 의식적으로 결정하는 일.", "body_html": "<p>이 매거진의 저자는 평소에 \"정행(正行, orthopraxy)\"이라는 단어를 사용한다. 정확하게 사는 일. 매일의 행위가 자기가 생각하는 가치와 정렬되는 일.</p>\n<p>정행은 큰 행위만의 자리가 아니다. 매일 한 잔의 커피 앞에서 한 가지 결정을 하는 자리도 정행의 자리다. 다음 주 월요일 아침 커피 한 잔의 자리에서, 자기가 무엇을 마시는지를 한 번 의식적으로 결정하는 일.</p>", "plain_len": 156, "type": "orthopraxy_as_a_daily_practice", "rawIndex": 3}, {"title": "Page 04 · The Small Cost of Daily Choosing", "body_md": "매일 한 번씩 자기 자리를 결정하는 일에는 비용이 든다. 시간 비용. 마음 비용. 평소에는 무의식적으로 처리하던 일을 의식적으로 처리해야 하는 인지 비용.\n\n이 비용은 회사가 만들었다. 결재라인 4단계 안의 7명이 만들었다. 자체조사 결과로 그들의 회사 자신이 인정한 \"사회적 역사성·민감성 부재\"가 만들었다.\n\n이 비용을 다시 그 자리로 돌려보내는 한 가지 방법이 있다. 매일의 결정을 매일 하는 것. 그 결정의 누적이 다음 사건의 예방 비용이 되도록 하는 것.", "body_html": "<p>매일 한 번씩 자기 자리를 결정하는 일에는 비용이 든다. 시간 비용. 마음 비용. 평소에는 무의식적으로 처리하던 일을 의식적으로 처리해야 하는 인지 비용.</p>\n<p>이 비용은 회사가 만들었다. 결재라인 4단계 안의 7명이 만들었다. 자체조사 결과로 그들의 회사 자신이 인정한 \"사회적 역사성·민감성 부재\"가 만들었다.</p>\n<p>이 비용을 다시 그 자리로 돌려보내는 한 가지 방법이 있다. 매일의 결정을 매일 하는 것. 그 결정의 누적이 다음 사건의 예방 비용이 되도록 하는 것.</p>", "plain_len": 192, "type": "the_small_cost_of_daily_choosing", "rawIndex": 4}, {"title": "Page 05 · Bridge", "body_md": "다음 탭에서 저자가 실제로 다음 주에 어떤 결정을 했는지를 본다. 추천이 아니라 한 가지 예시로.", "body_html": "<p>다음 탭에서 저자가 실제로 다음 주에 어떤 결정을 했는지를 본다. 추천이 아니라 한 가지 예시로.</p>", "plain_len": 40, "type": "bridge", "rawIndex": 5}], "totalPages": 5}, {"num": "04", "key": "case", "label": "CASE", "ko": "사례", "title": "내가 다음 주에 실제로 마시기로 한 것", "short": "내가 다음 주에 실제로 마시기로 한 것", "pages": [{"title": "Page 01 · A Note Before the Decision", "body_md": "이 자리에서 적는 결정은 추천이 아니다.\n\n각자의 맥락이 다르다. 회사 근처 카페 선택지가 다르고, 가격 감수성이 다르고, 평소의 루틴이 다르다. 다른 사람이 같은 결정을 따라하는 것은 의미가 없다. 다만 한 사람이 한 자리에서 어떤 메서드로 자기 결정을 했는지를 보는 것은 의미가 있을 수 있다.", "body_html": "<p>이 자리에서 적는 결정은 추천이 아니다.</p>\n<p>각자의 맥락이 다르다. 회사 근처 카페 선택지가 다르고, 가격 감수성이 다르고, 평소의 루틴이 다르다. 다른 사람이 같은 결정을 따라하는 것은 의미가 없다. 다만 한 사람이 한 자리에서 어떤 메서드로 자기 결정을 했는지를 보는 것은 의미가 있을 수 있다.</p>", "plain_len": 122, "type": "a_note_before_the_decision", "rawIndex": 1}, {"title": "Page 02 · The Three Decisions", "body_md": "저자가 다음 주에 실제로 하기로 한 결정은 세 가지다.\n\n첫째. 연구실 책상 위의 빈 자리에는 당분간 책 한 권을 놓는다. 드립백을 다시 사 와서 놓지 않는다.\n\n둘째. 동네 작은 카페와 매주 한 번씩 거래를 만든다. 평소에 가던 매장의 자리를 일부 옮긴다.\n\n셋째. 매주 일요일 저녁에 그 주의 결정을 한 번 점검한다. 이 매거진을 발행하는 자리에서 자연스럽게 함께 점검한다.", "body_html": "<p>저자가 다음 주에 실제로 하기로 한 결정은 세 가지다.</p>\n<p>첫째. 연구실 책상 위의 빈 자리에는 당분간 책 한 권을 놓는다. 드립백을 다시 사 와서 놓지 않는다.</p>\n<p>둘째. 동네 작은 카페와 매주 한 번씩 거래를 만든다. 평소에 가던 매장의 자리를 일부 옮긴다.</p>\n<p>셋째. 매주 일요일 저녁에 그 주의 결정을 한 번 점검한다. 이 매거진을 발행하는 자리에서 자연스럽게 함께 점검한다.</p>", "plain_len": 151, "type": "the_three_decisions", "rawIndex": 2}, {"title": "Page 03 · Why These Three", "body_md": "첫 번째 결정의 이유. 빈 자리는 그 자리에 무엇이 있었는지를 매일 보게 한다. 같은 회사의 드립백을 다시 놓으면 그 빈 자리의 의미가 흐려진다. 책 한 권을 놓으면, 빈 자리가 새로운 의미를 가지게 된다.\n\n두 번째 결정의 이유. 동네 작은 카페와 매주 한 번씩 거래를 만드는 일은, 한 자영업자에게 한 주에 한 번의 손님을 보장하는 일이다. 매장의 알바생 자리를 한 명 더 가능하게 하는 일이다. 큰 회사 한 군데로 모이는 자리를, 여러 작은 자리로 분산하는 일이다.\n\n세 번째 결정의 이유. 일주일에 한 번씩 점검하지 않으면, 결정은 며칠 안에 흐려진다. 자기 검열의 자리에 있는 사람의 가장 큰 적은 시간이다. 시간이 지나면 자기 검열은 자동으로 무대응으로 옮겨진다. 그 옮김을 막는 한 가지 방법이 주간 점검이다.", "body_html": "<p>첫 번째 결정의 이유. 빈 자리는 그 자리에 무엇이 있었는지를 매일 보게 한다. 같은 회사의 드립백을 다시 놓으면 그 빈 자리의 의미가 흐려진다. 책 한 권을 놓으면, 빈 자리가 새로운 의미를 가지게 된다.</p>\n<p>두 번째 결정의 이유. 동네 작은 카페와 매주 한 번씩 거래를 만드는 일은, 한 자영업자에게 한 주에 한 번의 손님을 보장하는 일이다. 매장의 알바생 자리를 한 명 더 가능하게 하는 일이다. 큰 회사 한 군데로 모이는 자리를, 여러 작은 자리로 분산하는 일이다.</p>\n<p>세 번째 결정의 이유. 일주일에 한 번씩 점검하지 않으면, 결정은 며칠 안에 흐려진다. 자기 검열의 자리에 있는 사람의 가장 큰 적은 시간이다. 시간이 지나면 자기 검열은 자동으로 무대응으로 옮겨진다. 그 옮김을 막는 한 가지 방법이 주간 점검이다.</p>", "plain_len": 291, "type": "why_these_three", "rawIndex": 3}, {"title": "Page 04 · The Limit of This Example", "body_md": "이 세 가지 결정은 완벽하지 않다. 동네 카페 한 군데 추가가 한국 커피 시장의 구조를 바꾸지 않는다. 빈 자리에 책 한 권 놓는 것이 스타벅스 코리아 본사 결재라인을 바꾸지 않는다.\n\n다만 한 사람이 매일 자기 자리를 결정하는 일은, 그 한 사람의 자리에서 의미가 있다. 한 사람의 자리가 모이면 그것이 시장의 자리가 된다. 시장의 자리가 모이면 결재라인의 자리가 바뀌어야 하는 시점이 온다.\n\n매일의 결정이 그 시점을 만든다.", "body_html": "<p>이 세 가지 결정은 완벽하지 않다. 동네 카페 한 군데 추가가 한국 커피 시장의 구조를 바꾸지 않는다. 빈 자리에 책 한 권 놓는 것이 스타벅스 코리아 본사 결재라인을 바꾸지 않는다.</p>\n<p>다만 한 사람이 매일 자기 자리를 결정하는 일은, 그 한 사람의 자리에서 의미가 있다. 한 사람의 자리가 모이면 그것이 시장의 자리가 된다. 시장의 자리가 모이면 결재라인의 자리가 바뀌어야 하는 시점이 온다.</p>\n<p>매일의 결정이 그 시점을 만든다.</p>", "plain_len": 173, "type": "the_limit_of_this_example", "rawIndex": 4}, {"title": "Page 05 · Bridge", "body_md": "다음 탭에서, 이 결정을 위한 한 가지 큐레이션 메서드를 정리한다.", "body_html": "<p>다음 탭에서, 이 결정을 위한 한 가지 큐레이션 메서드를 정리한다.</p>", "plain_len": 28, "type": "bridge", "rawIndex": 5}], "totalPages": 5}, {"num": "05", "key": "archive", "label": "ARCHIVE", "ko": "자료", "title": "카페·원두 큐레이션 메서드", "short": "카페·원두 큐레이션 메서드", "pages": [{"title": "Page 01 · A Five-Question Method", "body_md": "매주 한 번씩 자기 커피 결정을 점검하는 한 가지 메서드를 정리한다. 다섯 개의 질문이다.", "body_html": "<p>매주 한 번씩 자기 커피 결정을 점검하는 한 가지 메서드를 정리한다. 다섯 개의 질문이다.</p>", "plain_len": 37, "type": "a_five-question_method", "rawIndex": 1}, {"title": "Page 02 · The Five Questions", "body_md": "1. **이번 주에 나는 어떤 회사·매장에 돈을 지불했는가**: 영수증 또는 앱 결제 내역을 한 번 본다.\n2. **그 회사·매장이 만들어내는 사회적 신호는 무엇인가**: 큰 회사라면 최근 한 달 안의 보도, 작은 매장이라면 직접 매장에서 받는 인상.\n3. **그 신호가 내가 다른 자리에서 지지하는 자리와 정렬되는가**: 평소의 가치와 매주의 결제 내역이 정렬되는지 확인.\n4. **정렬되지 않는다면, 다음 주에 한 가지 결정을 어떻게 바꿀 것인가**: 큰 변화 한 가지가 아니라, 작은 변화 한 가지.\n5. **그 한 가지 변화의 비용은 누가 감수하는가**: 자기가 감수하는 비용인지, 다른 자리에 비용을 떠넘기는 결정인지 확인.\n\n다섯 번째 질문이 가장 중요하다. 매장 알바생에게 비용을 떠넘기는 결정은 정행이 아니다. 자기가 비용을 감수하는 결정만이 정행의 자리에 있을 수 있다.", "body_html": "<ol><li><strong>이번 주에 나는 어떤 회사·매장에 돈을 지불했는가</strong>: 영수증 또는 앱 결제 내역을 한 번 본다.</li><li><strong>그 회사·매장이 만들어내는 사회적 신호는 무엇인가</strong>: 큰 회사라면 최근 한 달 안의 보도, 작은 매장이라면 직접 매장에서 받는 인상.</li><li><strong>그 신호가 내가 다른 자리에서 지지하는 자리와 정렬되는가</strong>: 평소의 가치와 매주의 결제 내역이 정렬되는지 확인.</li><li><strong>정렬되지 않는다면, 다음 주에 한 가지 결정을 어떻게 바꿀 것인가</strong>: 큰 변화 한 가지가 아니라, 작은 변화 한 가지.</li><li><strong>그 한 가지 변화의 비용은 누가 감수하는가</strong>: 자기가 감수하는 비용인지, 다른 자리에 비용을 떠넘기는 결정인지 확인.</li></ol>\n<p>다섯 번째 질문이 가장 중요하다. 매장 알바생에게 비용을 떠넘기는 결정은 정행이 아니다. 자기가 비용을 감수하는 결정만이 정행의 자리에 있을 수 있다.</p>", "plain_len": 330, "type": "the_five_questions", "rawIndex": 2}, {"title": "Page 03 · A Worked Example", "body_md": "저자의 이번 주 답.\n\n1. 스타벅스 한 매장, 동네 카페 한 매장, 편의점 캔커피 두 번, 집에서 직접 드립 매일.\n2. 스타벅스 매장: 이번 주 사건의 회사. 동네 카페: 같은 동네 안에서 6개월 운영 중인 자영업. 편의점 캔커피: 가격 결정. 집 드립: 본인 결정 가장 큰 자리.\n3. 스타벅스 결정이 평소 가치와 정렬되지 않는다는 신호가 이번 주에 분명해졌다. 다른 자리는 일단 유지.\n4. 다음 주: 스타벅스 매장을 한 번 줄이고, 동네 카페를 한 번 늘린다. 집 드립의 원두 출처를 한 번 점검한다.\n5. 비용: 동네 카페 가격이 약간 비쌈. 본인이 감수. 매장 알바생에게 떠넘기는 비용 없음.\n\n이 답이 다음 주 월요일부터 토요일까지 그대로 작동하지 않을 수 있다. 작동하지 않으면 그것 자체가 다음 일요일의 점검 자료가 된다.", "body_html": "<p>저자의 이번 주 답.</p>\n<ol><li>스타벅스 한 매장, 동네 카페 한 매장, 편의점 캔커피 두 번, 집에서 직접 드립 매일.</li><li>스타벅스 매장: 이번 주 사건의 회사. 동네 카페: 같은 동네 안에서 6개월 운영 중인 자영업. 편의점 캔커피: 가격 결정. 집 드립: 본인 결정 가장 큰 자리.</li><li>스타벅스 결정이 평소 가치와 정렬되지 않는다는 신호가 이번 주에 분명해졌다. 다른 자리는 일단 유지.</li><li>다음 주: 스타벅스 매장을 한 번 줄이고, 동네 카페를 한 번 늘린다. 집 드립의 원두 출처를 한 번 점검한다.</li><li>비용: 동네 카페 가격이 약간 비쌈. 본인이 감수. 매장 알바생에게 떠넘기는 비용 없음.</li></ol>\n<p>이 답이 다음 주 월요일부터 토요일까지 그대로 작동하지 않을 수 있다. 작동하지 않으면 그것 자체가 다음 일요일의 점검 자료가 된다.</p>", "plain_len": 297, "type": "a_worked_example", "rawIndex": 3}, {"title": "Page 04 · The End of Week One", "body_md": "이번 호의 마지막 자리다.\n\n한 주 동안 한 사건의 두께를 일곱 자리에서 보았다. 발화점, 밈의 계보, 알바생 1차 피해, 자기 검열 2차 피해, 정용진 반복 패턴, 기업 윤리 시스템, 그리고 정행.\n\n이 일곱 자리는 한 회사 한 마케팅 사고의 직접 책임으로부터 시작해서, 한 사회의 매일의 시민됨에 도착한다. 직접 책임은 한 회사에 있고, 매일의 시민됨은 우리 모두의 자리에 있다.\n\n두 자리를 같이 들고 있는 것이 이 매거진의 자리다.", "body_html": "<p>이번 호의 마지막 자리다.</p>\n<p>한 주 동안 한 사건의 두께를 일곱 자리에서 보았다. 발화점, 밈의 계보, 알바생 1차 피해, 자기 검열 2차 피해, 정용진 반복 패턴, 기업 윤리 시스템, 그리고 정행.</p>\n<p>이 일곱 자리는 한 회사 한 마케팅 사고의 직접 책임으로부터 시작해서, 한 사회의 매일의 시민됨에 도착한다. 직접 책임은 한 회사에 있고, 매일의 시민됨은 우리 모두의 자리에 있다.</p>\n<p>두 자리를 같이 들고 있는 것이 이 매거진의 자리다.</p>", "plain_len": 176, "type": "the_end_of_week_one", "rawIndex": 4}, {"title": "Page 05 · One More Note for Tomorrow", "body_md": "이 매거진의 발행 범위는 5월 18일에서 5월 24일까지였다.\n\n내일은 5월 25일이다. 모레는 5월 26일이고, 그날 정용진 회장이 대국민 사과를 한다. 매거진은 그 사과를 닫고 가지 않는다. 사과는 하나의 사건이고, 사건을 닫고 가는 것은 매거진의 자리가 아니다.\n\n그래서 Postscript 한 장이 따라온다. 사과를 보고 닫는 자리가 아니라, 사과 다음에 무엇이 와야 하는지를 묻는 자리다.\n\n---", "body_html": "<p>이 매거진의 발행 범위는 5월 18일에서 5월 24일까지였다.</p>\n<p>내일은 5월 25일이다. 모레는 5월 26일이고, 그날 정용진 회장이 대국민 사과를 한다. 매거진은 그 사과를 닫고 가지 않는다. 사과는 하나의 사건이고, 사건을 닫고 가는 것은 매거진의 자리가 아니다.</p>\n<p>그래서 Postscript 한 장이 따라온다. 사과를 보고 닫는 자리가 아니라, 사과 다음에 무엇이 와야 하는지를 묻는 자리다.</p>\n<p>---</p>", "plain_len": 171, "type": "one_more_note_for_tomorrow", "rawIndex": 5}], "totalPages": 5}]}, {"date": "2026-05-26", "weekday": "외", "weekdayFull": "외전", "no": "008", "titleLine": "사과는 면죄부가 아니다", "theme": "사과는 면죄부가 아니다", "note_html": "<div class=\"note-card\"><strong>Postscript의 역할</strong><p>5월 26일 정용진 회장의 대국민 사과는 이 매거진의 발행 범위 밖이다. 그러나 그 사과를 그냥 닫고 가면, 이 매거진은 \"사과 이전 시점의 기록\"으로만 남는다. 그래서 한 장이 추가된다. 사과의 진정성·반복 패턴·시스템 변화 부재를 비판적으로 한 번만 짚는다. 이 한 장은 \"그래도 사과는 했으니\"의 자리에 단 한 줄도 양보하지 않는다.</p></div>", "sections": [{"num": "P1", "key": "p1", "label": "POSTSCRIPT", "ko": "후기", "title": "한 주가 지나고", "short": "한 주가 지나고", "pages": [{"title": "Page 01 · The Time and Place", "body_md": "2026년 5월 26일 오전 9시, 서울 강남구 조선팰리스 호텔.\n\n이 자리에서 정용진 신세계그룹 회장이 대국민 사과를 했다. 헤럴드경제의 장연주 기자가 같은 날 보도한 내용이다(R-18).\n\n전자신문의 윤희석 기자가 같은 날 9시 19분에 보도한 사과문 핵심 인용은 다음과 같다(R-15).\n\n> **\"이번 스타벅스 코리아의 부적절한 마케팅으로 많은 분들께서 깊은 아픔과 분노를 느끼셨다.\"**\n>\n> **\"모든 책임은 저에게 있다.\"**\n>\n> **\"말이 아닌 행동으로 실질적인 변화를 만들어 내겠다.\"**", "body_html": "<p>2026년 5월 26일 오전 9시, 서울 강남구 조선팰리스 호텔.</p>\n<p>이 자리에서 정용진 신세계그룹 회장이 대국민 사과를 했다. 헤럴드경제의 장연주 기자가 같은 날 보도한 내용이다(R-18).</p>\n<p>전자신문의 윤희석 기자가 같은 날 9시 19분에 보도한 사과문 핵심 인용은 다음과 같다(R-15).</p>\n<blockquote><p><strong>\"이번 스타벅스 코리아의 부적절한 마케팅으로 많은 분들께서 깊은 아픔과 분노를 느끼셨다.\"</strong></p>\n<p><strong>\"모든 책임은 저에게 있다.\"</strong></p>\n<p><strong>\"말이 아닌 행동으로 실질적인 변화를 만들어 내겠다.\"</strong></p></blockquote>", "plain_len": 219, "type": "the_time_and_place", "rawIndex": 1}, {"title": "Page 02 · The Self-Investigation as the Context", "body_md": "같은 자리에서 신세계그룹은 자체조사 결과를 발표했다. YTN의 김지선 기자가 같은 날 보도한 결과의 핵심은 매거진 본문에서 이미 두 번 인용했다(R-16).\n\n4단계 결재라인, 마케팅 관련자 7명 중 일부의 첨부파일 미열람, 사회적 역사성·민감성 부재, 리스크 관리 체계의 심각한 결함. 회사 측 자기 인정의 핵심 문장들이다.\n\n헤럴드경제가 같은 날 정리한 한 줄도 이 자리에 있다(R-22).\n\n> **\"마케팅 고의성 증거 찾지 못해.\"**", "body_html": "<p>같은 자리에서 신세계그룹은 자체조사 결과를 발표했다. YTN의 김지선 기자가 같은 날 보도한 결과의 핵심은 매거진 본문에서 이미 두 번 인용했다(R-16).</p>\n<p>4단계 결재라인, 마케팅 관련자 7명 중 일부의 첨부파일 미열람, 사회적 역사성·민감성 부재, 리스크 관리 체계의 심각한 결함. 회사 측 자기 인정의 핵심 문장들이다.</p>\n<p>헤럴드경제가 같은 날 정리한 한 줄도 이 자리에 있다(R-22).</p>\n<blockquote><p><strong>\"마케팅 고의성 증거 찾지 못해.\"</strong></p></blockquote>", "plain_len": 187, "type": "the_self-investigation_as_the_context", "rawIndex": 2}, {"title": "Page 03 · Why an Apology Is Not Absolution", "body_md": "이 매거진은 사과를 면죄부로 받지 않는다.\n\n이유는 단순하다. 면죄부가 되려면 두 가지가 같이 와야 한다. 한 가지는 사과의 진정성이고, 다른 한 가지는 사과 다음에 따라오는 시스템 변화의 약속이다. 5월 26일 사과에는 첫 번째 부분이 있었고, 두 번째 부분은 빠져 있었다.\n\n\"말이 아닌 행동으로 실질적인 변화를 만들어 내겠다\"는 약속은 본인이 했다. 그러나 그 행동의 구체적 내용 — 결재라인 구조를 어떻게 바꾸겠다, 사회·역사 감수성 검수를 어느 자리에 두겠다, 외부 자문을 어떻게 운영하겠다 — 은 같은 자리에서 발표되지 않았다.\n\n이 자리에서 이 매거진은 한 발 떨어진 자리를 유지한다.", "body_html": "<p>이 매거진은 사과를 면죄부로 받지 않는다.</p>\n<p>이유는 단순하다. 면죄부가 되려면 두 가지가 같이 와야 한다. 한 가지는 사과의 진정성이고, 다른 한 가지는 사과 다음에 따라오는 시스템 변화의 약속이다. 5월 26일 사과에는 첫 번째 부분이 있었고, 두 번째 부분은 빠져 있었다.</p>\n<p>\"말이 아닌 행동으로 실질적인 변화를 만들어 내겠다\"는 약속은 본인이 했다. 그러나 그 행동의 구체적 내용 — 결재라인 구조를 어떻게 바꾸겠다, 사회·역사 감수성 검수를 어느 자리에 두겠다, 외부 자문을 어떻게 운영하겠다 — 은 같은 자리에서 발표되지 않았다.</p>\n<p>이 자리에서 이 매거진은 한 발 떨어진 자리를 유지한다.</p>", "plain_len": 247, "type": "why_an_apology_is_not_absolution", "rawIndex": 3}], "totalPages": 3}, {"num": "P2", "key": "p2", "label": "POSTSCRIPT", "ko": "후기", "title": "\"모든 책임은 저에게\" 다음에 와야 할 것", "short": "\"모든 책임은 저에게\" 다음에 와야 할 것", "pages": [{"title": "Page 01 · The 5·18 Groups' Response", "body_md": "같은 날 디지털타임스의 양호연 기자가 보도한 \"5·18단체 '형식적인 정용진 사과… 진정성 없이 책임 회피'\"는 5·18 단체들의 반응을 정리했다(R-17).\n\n> **신극정 회장: \"국민을 상대로 돈을 버는 기업이라면 사회적 책임과 역사에 대한 최소한의 존중을 보여야.\"**\n>\n> **윤남식 회장: \"형식적인 사과에 그쳤고 책임을 회피하려는 모습으로 비쳤다.\"**\n>\n> **양재혁 회장: \"경영에서 물러날 정도의 각오 없이 내놓은 사과는 책임 회피로 비칠 수밖에 없다.\"**\n\n이 세 줄은 사과의 자리에서 이 매거진이 한 발 떨어져 있어도 되는 자리를 가장 정확하게 짚어준다. 가해 측이 사과한 자리에서, 가장 직접적인 1차 피해 당사자들이 그 사과의 형식성을 비판한다. 외부 매거진의 거리감보다 더 가까운 자리에서 같은 비판이 나오는 자리다.", "body_html": "<p>같은 날 디지털타임스의 양호연 기자가 보도한 \"5·18단체 '형식적인 정용진 사과… 진정성 없이 책임 회피'\"는 5·18 단체들의 반응을 정리했다(R-17).</p>\n<blockquote><p><strong>신극정 회장: \"국민을 상대로 돈을 버는 기업이라면 사회적 책임과 역사에 대한 최소한의 존중을 보여야.\"</strong></p>\n<p><strong>윤남식 회장: \"형식적인 사과에 그쳤고 책임을 회피하려는 모습으로 비쳤다.\"</strong></p>\n<p><strong>양재혁 회장: \"경영에서 물러날 정도의 각오 없이 내놓은 사과는 책임 회피로 비칠 수밖에 없다.\"</strong></p></blockquote>\n<p>이 세 줄은 사과의 자리에서 이 매거진이 한 발 떨어져 있어도 되는 자리를 가장 정확하게 짚어준다. 가해 측이 사과한 자리에서, 가장 직접적인 1차 피해 당사자들이 그 사과의 형식성을 비판한다. 외부 매거진의 거리감보다 더 가까운 자리에서 같은 비판이 나오는 자리다.</p>", "plain_len": 319, "type": "page", "rawIndex": 1}, {"title": "Page 02 · The Pattern Repeats", "body_md": "이번 호 금요일에 본 4년짜리 패턴을 다시 가져온다.\n\n2013, 2021, 2022, 2026. 같은 패턴이 4년마다 반복되었다. 매번 사과가 있었다. 매번 사과의 문장은 진심에 가까웠다. 매번 그 다음에 시스템 변화는 따라오지 않았다.\n\n5월 26일의 사과가 4년 주기 패턴의 일부가 되지 않으려면, 사과 자체보다 사과 다음 한 달, 사과 다음 6개월, 사과 다음 1년에 무엇이 있을지가 더 중요하다.\n\n그 자리에 무엇이 있는지를 보기 위해서, 이 매거진은 한 발 떨어져서 본다. 다음 호도, 그 다음 호도, 같은 자리에서 한 발 떨어져서 볼 것이다.", "body_html": "<p>이번 호 금요일에 본 4년짜리 패턴을 다시 가져온다.</p>\n<p>2013, 2021, 2022, 2026. 같은 패턴이 4년마다 반복되었다. 매번 사과가 있었다. 매번 사과의 문장은 진심에 가까웠다. 매번 그 다음에 시스템 변화는 따라오지 않았다.</p>\n<p>5월 26일의 사과가 4년 주기 패턴의 일부가 되지 않으려면, 사과 자체보다 사과 다음 한 달, 사과 다음 6개월, 사과 다음 1년에 무엇이 있을지가 더 중요하다.</p>\n<p>그 자리에 무엇이 있는지를 보기 위해서, 이 매거진은 한 발 떨어져서 본다. 다음 호도, 그 다음 호도, 같은 자리에서 한 발 떨어져서 볼 것이다.</p>", "plain_len": 228, "type": "the_pattern_repeats", "rawIndex": 2}, {"title": "Page 03 · The End and the Next", "body_md": "한 주가 지나갔다. 한 호가 끝났다.\n\n이번 호의 한 줄짜리 결론은 이렇다.\n\n> **사과는 사건의 마침표가 아니라, 시스템 변화 시작점의 가장 첫 번째 글자다.**\n\n다음 글자가 무엇인지가 더 중요하다. 그 다음 글자는 회사가 쓴다. 우리는 그 글자를 매주 일요일 저녁에 한 번씩 확인할 것이다.\n\n---", "body_html": "<p>한 주가 지나갔다. 한 호가 끝났다.</p>\n<p>이번 호의 한 줄짜리 결론은 이렇다.</p>\n<blockquote><p><strong>사과는 사건의 마침표가 아니라, 시스템 변화 시작점의 가장 첫 번째 글자다.</strong></p></blockquote>\n<p>다음 글자가 무엇인지가 더 중요하다. 그 다음 글자는 회사가 쓴다. 우리는 그 글자를 매주 일요일 저녁에 한 번씩 확인할 것이다.</p>\n<p>---</p>", "plain_len": 123, "type": "the_end_and_the_next", "rawIndex": 3}], "totalPages": 3}]}], "sectionOrder": ["intro", "issue", "insight", "case", "archive"]}</script>
<script>
(() => {
  const DATA = JSON.parse(document.getElementById('magazine-data').textContent);
  const state = { day: 0, section: 0, page: 0, lastPages: {} };
  const el = {
    dayNav: document.getElementById('dayNav'), rail: document.getElementById('sectionRail'), stage: document.getElementById('stage'), progress: document.getElementById('progressBar'),
    drawer: document.getElementById('drawer'), brandBtn: document.getElementById('brandBtn'), mapBtn: document.getElementById('mapBtn'), closeDrawer: document.getElementById('closeDrawer'), toast: document.getElementById('toast'),
    drawerAbout: document.getElementById('drawer-about'), drawerSources: document.getElementById('drawer-sources'), issueMap: document.getElementById('issueMap')
  };

  let pretextLib = null;
  const measureCanvas = document.createElement('canvas');
  const measureCtx = measureCanvas.getContext('2d');
  import('https://esm.sh/@chenglou/pretext@0.0.7?bundle')
    .then(mod => { pretextLib = mod; requestFrameLayout(); })
    .catch(() => { pretextLib = null; requestFrameLayout(); });

  function numberPx(value, fallback=0) {
    const n = parseFloat(value);
    return Number.isFinite(n) ? n : fallback;
  }
  function clampFloat(n, min, max) { return Math.max(min, Math.min(max, n)); }
  function textLayoutEstimate(text, font, width, lineHeight) {
    const clean = String(text || '').replace(/\s+/g, ' ').trim();
    if (!clean || width <= 0) return { lineCount: 0, height: 0, engine: pretextLib ? 'pretext' : 'fallback' };
    if (pretextLib && typeof pretextLib.prepare === 'function' && typeof pretextLib.layout === 'function') {
      try {
        const prepared = pretextLib.prepare(clean, font);
        const result = pretextLib.layout(prepared, width, lineHeight);
        return { lineCount: result.lineCount || Math.ceil((result.height || 0) / lineHeight), height: result.height || 0, engine: 'pretext' };
      } catch (_) {}
    }
    measureCtx.font = font;
    let lineWidth = 0, lines = 1;
    for (const ch of clean) {
      if (ch === '\n') { lines++; lineWidth = 0; continue; }
      const w = measureCtx.measureText(ch).width;
      if (lineWidth > 0 && lineWidth + w > width) { lines++; lineWidth = w; }
      else lineWidth += w;
    }
    return { lineCount: lines, height: lines * lineHeight, engine: 'canvas-fallback' };
  }
  function renderMeterHTML(section, pageIndex) {
    return section.pages.map((_, i) => `<span class="v-dot ${i < pageIndex ? 'is-read' : ''} ${i === pageIndex ? 'active' : ''}"></span>`).join('');
  }
  function requestFrameLayout() {
    cancelAnimationFrame(requestFrameLayout.raf);
    requestFrameLayout.raf = requestAnimationFrame(applyFrameLayout);
  }
  function applyFrameLayout() {
    const article = el.stage.querySelector('.article-page');
    if (!article) return;
    const copy = article.querySelector('.page-copy');
    const pageArt = article.querySelector('.page-art');
    const frame = article.querySelector('.page-frame');
    const main = article.querySelector('.page-main');
    if (!copy || !frame || !main) return;

    const w = article.clientWidth;
    const h = article.clientHeight;
    const pageCount = currentSection().pages.length;
    const compact = h < 760 || w < 370;

    const meterW = Math.round(clampFloat(14 + Math.min(pageCount, 8) * 1.25, compact ? 16 : 18, compact ? 19 : 23));
    const gap = Math.round(clampFloat(w * 0.026, compact ? 6 : 8, compact ? 9 : 13));
    const padL = Math.round(clampFloat(w * 0.052, compact ? 15 : 18, compact ? 18 : 22));
    const padR = Math.round(clampFloat(w * 0.034, compact ? 10 : 12, compact ? 13 : 16));
    const padT = compact ? 14 : 18;
    const padB = compact ? 14 : 18;
    const contentW = Math.max(176, w - padL - padR - meterW - gap);

    article.style.setProperty('--pretext-meter-w', `${meterW}px`);
    article.style.setProperty('--pretext-meter-gap', `${gap}px`);
    article.style.setProperty('--pretext-content-w', `${contentW}px`);
    article.style.setProperty('--pretext-page-pad-t', `${padT}px`);
    article.style.setProperty('--pretext-page-pad-r', `${padR}px`);
    article.style.setProperty('--pretext-page-pad-b', `${padB}px`);
    article.style.setProperty('--pretext-page-pad-l', `${padL}px`);

    // Reset before measuring. Each slide calculates its own text density and visual weight.
    article.classList.remove('no-art');
    article.dataset.overflow = 'false';
    article.style.setProperty('--copy-font-size', compact ? '14.5px' : '16px');
    article.style.setProperty('--copy-line-height', compact ? '1.64' : '1.76');
    article.style.setProperty('--copy-para-gap', compact ? '.62em' : '.82em');
    article.style.setProperty('--copy-mt', compact ? '10px' : '14px');
    article.style.setProperty('--subtitle-size', compact ? '14px' : '15px');
    article.style.setProperty('--subtitle-mt', compact ? '6px' : '8px');
    article.style.setProperty('--title-size', compact ? 'clamp(25px,7.5vw,37px)' : 'clamp(28px,8.4vw,42px)');
    article.style.setProperty('--cover-title-size', compact ? 'clamp(28px,8.7vw,44px)' : 'clamp(32px,10vw,50px)');
    article.style.setProperty('--art-pad-top', compact ? '8px' : '12px');

    const fixedNodes = Array.from(main.children).filter(node => node !== copy && node !== pageArt);
    const fixedH = () => fixedNodes.reduce((sum, node) => sum + node.getBoundingClientRect().height, 0);
    const family = getComputedStyle(copy).fontFamily || 'serif';
    const plain = copy.textContent.replace(/\s+/g, ' ').trim();
    const hasTables = !!copy.querySelector('table, pre, blockquote, .note-card');
    const isCover = article.classList.contains('type-cover');

    const baseTerrain = isCover ? (compact ? 64 : 92) : (compact ? 58 : 82);
    const candidates = [
      {fs: compact ? 14.5 : 16.0, lh: compact ? 1.64 : 1.76, terrain: baseTerrain, para: compact ? .62 : .82, artTop: compact ? 8 : 12, hideArt:false},
      {fs: compact ? 14.1 : 15.4, lh: compact ? 1.60 : 1.68, terrain: compact ? 50 : 66, para:.58, artTop:8, hideArt:false},
      {fs: compact ? 13.7 : 14.8, lh: compact ? 1.56 : 1.62, terrain: compact ? 42 : 54, para:.50, artTop:7, hideArt:false},
      {fs: compact ? 13.4 : 14.3, lh: compact ? 1.54 : 1.58, terrain: compact ? 34 : 42, para:.42, artTop:6, hideArt:false},
      {fs: compact ? 13.2 : 14.0, lh: compact ? 1.52 : 1.56, terrain: 0, para:.38, artTop:0, hideArt:true}
    ];
    let chosen = candidates[candidates.length - 1];
    let measured = {height:0, lineCount:0, engine: pretextLib ? 'pretext' : 'canvas-fallback'};
    for (const cand of candidates) {
      const lineHeightPx = cand.fs * cand.lh;
      const font = `400 ${cand.fs}px ${family}`;
      measured = textLayoutEstimate(plain, font, contentW, lineHeightPx);
      const visualH = cand.hideArt ? 0 : cand.terrain + cand.artTop;
      const nonTextH = fixedH() + visualH;
      const availableForCopy = Math.max(96, h - padT - padB - nonTextH);
      // Tables/preformatted blocks are less predictable than plain text, so leave a little more room.
      const safeFactor = hasTables ? 0.84 : 0.94;
      if (measured.height <= availableForCopy * safeFactor) { chosen = cand; break; }
    }
    article.classList.toggle('no-art', chosen.hideArt);
    article.style.setProperty('--copy-font-size', `${chosen.fs}px`);
    article.style.setProperty('--copy-line-height', `${chosen.lh}`);
    article.style.setProperty('--copy-para-gap', `${chosen.para}em`);
    article.style.setProperty('--pretext-terrain-h', `${chosen.terrain}px`);
    article.style.setProperty('--art-pad-top', `${chosen.artTop}px`);
    article.dataset.layoutEngine = measured.engine;

    // Final pass: if the browser's actual painting still overflows, shrink locally.
    requestAnimationFrame(() => {
      if (!copy.isConnected) return;
      if (copy.scrollHeight > copy.clientHeight + 2) {
        article.classList.add('no-art');
        const now = parseFloat(getComputedStyle(copy).fontSize) || chosen.fs;
        const smaller = Math.max(compact ? 12.8 : 13.5, now - 0.6);
        article.style.setProperty('--copy-font-size', `${smaller}px`);
        article.style.setProperty('--copy-line-height', compact ? '1.50' : '1.54');
        article.style.setProperty('--copy-para-gap', '.34em');
        article.dataset.overflow = copy.scrollHeight > copy.clientHeight + 2 ? 'true' : 'false';
      }
    });
  }

  function currentDay() { return DATA.days[state.day]; }
  function currentSection() { return currentDay().sections[state.section]; }
  function currentPage() { return currentSection().pages[state.page]; }
  function keyOf(d=state.day, s=state.section) { return `${d}:${s}`; }
  function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }
  function pad2(n) { return String(n).padStart(2,'0'); }
  function dayDate(d) { return d.date.slice(-2); }
  function allPagesBefore() {
    let n = 0;
    DATA.days.forEach((d, di) => d.sections.forEach((s, si) => s.pages.forEach((p, pi) => { if (di < state.day || (di === state.day && (si < state.section || (si === state.section && pi <= state.page)))) n++; })));
    return n;
  }
  function totalPages() { return DATA.summary.pageCount; }
  function escapeAttr(s) { return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
  function renderTerrain(day, section, page) {
    const label = `${section.key} · ${day.weekdayFull}`;
    const num = `${day.no}/${pad2(page.rawIndex)}`;
    return `<div class="terrain" aria-hidden="true"><span class="art-label">${escapeAttr(label)}</span><span class="art-no">${escapeAttr(num)}</span><svg viewBox="0 0 320 90" preserveAspectRatio="none"><path d="M0 68 C42 38 74 78 112 46 C146 16 174 56 205 35 C242 11 276 46 320 24" fill="none" stroke="#111" stroke-opacity=".72" stroke-width="1.2"/><path d="M0 78 C38 59 72 82 112 68 C148 56 174 73 214 52 C252 32 290 54 320 41" fill="none" stroke="#111" stroke-opacity=".32" stroke-width="1"/><path d="M0 90 L0 76 C54 58 88 92 132 73 C174 55 211 88 255 63 C284 46 305 50 320 44 L320 90 Z" fill="#111" fill-opacity=".045"/></svg></div>`;
  }
  function renderPage(direction='right') {
    const d = currentDay(), s = currentSection(), p = currentPage();
    const isCover = p.type === 'cover';
    const dayNote = (state.section === 0 && state.page === 0 && d.note_html) ? `<div class="day-note-inline">${d.note_html}</div>` : '';
    const pageTitle = p.title.replace(/^Page\s+\d+\s+·\s*/, '');
    const cls = direction ? `enter-${direction}` : '';
    const countText = `${pad2(state.page+1)} / ${pad2(s.pages.length)}`;
    const html = `
      <article class="article-page type-${p.type} ${isCover?'type-cover':''} ${cls}">
        <div class="page-frame">
          <main class="page-main">
            <header class="page-kicker">
              <div class="kicker-left"><div class="micro">${d.date} · ${d.weekdayFull} · No.${d.no}</div><div class="theme-line">${escapeAttr(d.theme)}</div></div>
              <div class="page-count"><b>${countText}</b>${s.key}</div>
            </header>
            <div class="cover-meta">
              <div class="issue-no">NO.<b>${d.no}</b></div>
              <div class="section-pill">${s.num} ${s.key} · ${s.ko}</div>
            </div>
            <h1 class="article-title">${escapeAttr(isCover ? s.title : pageTitle)}</h1>
            <h2 class="page-subtitle">${escapeAttr(isCover ? pageTitle : s.title)}</h2>
            <div class="page-copy">${p.body_html}${dayNote}</div>
            <div class="page-art">${renderTerrain(d,s,p)}</div>
          </main>
          <aside class="page-meter-lane" aria-hidden="true"><div class="page-meter" data-page-meter>${renderMeterHTML(s, state.page)}</div></aside>
        </div>
      </article>`;
    el.stage.innerHTML = html;
    renderChrome();
    requestFrameLayout();
  }
  function renderChrome() {
    const d = currentDay(), s = currentSection();
    [...el.dayNav.children].forEach((b,i)=>b.classList.toggle('active', i===state.day));
    [...el.rail.children].forEach((b,i)=>b.classList.toggle('active', i===state.section));
    const meter = el.stage.querySelector('[data-page-meter]');
    if (meter) meter.innerHTML = renderMeterHTML(s, state.page);
    el.progress.style.width = `${(allPagesBefore()/totalPages())*100}%`;
    document.title = `${d.weekdayFull} No.${d.no} · ${s.key} · Achmage Society Magazine`;
  }
  function saveLast() { state.lastPages[keyOf()] = state.page; }
  function goDay(i) {
    const old = state.day;
    if (i === old) { state.section = 0; state.page = 0; renderPage('down'); return; }
    saveLast(); state.day = clamp(i,0,DATA.days.length-1); state.section = 0; state.page = state.lastPages[keyOf()] || 0; renderPage(i>old?'right':'left');
  }
  function goSection(i, fromMap=false) {
    if (i === state.section && !fromMap) { state.page = 0; renderPage('down'); return; }
    const old = state.section; saveLast(); state.section = clamp(i,0,currentDay().sections.length-1); state.page = state.lastPages[keyOf()] || 0; renderPage(state.section > old ? 'right' : 'left');
  }
  function goPage(i, dir=null) {
    const old = state.page; state.page = clamp(i,0,currentSection().pages.length-1); renderPage(dir || (state.page>old?'up':'down'));
  }
  function nextPage() { if (state.page < currentSection().pages.length-1) goPage(state.page+1,'up'); else toast('마지막 페이지입니다'); }
  function prevPage() { if (state.page > 0) goPage(state.page-1,'down'); else toast('첫 페이지입니다'); }
  function nextSection() { if (state.section < currentDay().sections.length-1) goSection(state.section+1); else toast('마지막 섹션입니다'); }
  function prevSection() { if (state.section > 0) goSection(state.section-1); else toast('첫 섹션입니다'); }
  function toast(msg) { el.toast.textContent = msg; el.toast.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.toast.classList.remove('show'),900); }
  function initChrome() {
    el.dayNav.innerHTML = DATA.days.map((d,i)=>`<button class="day-btn" type="button" data-day="${i}"><span>${d.weekday}</span><b>${dayDate(d)}</b></button>`).join('');
    el.rail.innerHTML = DATA.sectionOrder.map((k,i)=>`<button class="section-tab" type="button" data-section="${i}" data-ko="${sectionNameKo(k)}">${k}</button>`).join('');
    el.dayNav.querySelectorAll('[data-day]').forEach(b=>b.addEventListener('click',()=>{ const old=state.day; const ni=Number(b.dataset.day); saveLast(); state.day=ni; state.section=0; state.page=0; renderPage(ni>old?'right':'left'); }));
    el.rail.querySelectorAll('[data-section]').forEach(b=>b.addEventListener('click',()=>goSection(Number(b.dataset.section))));
  }
  function sectionNameKo(k) { return ({Intro:'입구',Issue:'쟁점',Insight:'해석',Case:'사례',Archive:'기록'})[k] || k; }
  function buildDrawer() {
    el.drawerAbout.innerHTML = DATA.front_html;
    el.drawerSources.innerHTML = DATA.sources_html;
    el.issueMap.innerHTML = DATA.days.map((d,di)=>`<div class="map-day"><div class="map-day-head"><div><small>${d.date} · No.${d.no}</small><h3>${d.weekdayFull} · ${escapeAttr(d.theme)}</h3></div><small>${d.sections.reduce((a,s)=>a+s.pages.length,0)}p</small></div><div class="map-section-row">${d.sections.map((s,si)=>`<button class="map-cell ${di===state.day&&si===state.section?'active':''}" data-map-day="${di}" data-map-section="${si}">${s.key} · ${s.pages.length}</button>`).join('')}</div></div>`).join('');
    el.issueMap.querySelectorAll('[data-map-day]').forEach(btn=>btn.addEventListener('click',()=>{ saveLast(); state.day=Number(btn.dataset.mapDay); state.section=Number(btn.dataset.mapSection); state.page=state.lastPages[keyOf()]||0; closeDrawer(); renderPage('right'); }));
  }
  function openDrawer(tab='about') { buildDrawer(); el.drawer.classList.add('open'); selectDrawerTab(tab); }
  function closeDrawer() { el.drawer.classList.remove('open'); }
  function selectDrawerTab(tab) {
    document.querySelectorAll('.drawer-tab').forEach(b=>b.classList.toggle('active', b.dataset.drawerTab===tab));
    document.querySelectorAll('.drawer-section').forEach(s=>s.classList.toggle('active', s.id===`drawer-${tab}`));
  }
  document.querySelectorAll('.drawer-tab').forEach(b=>b.addEventListener('click',()=>selectDrawerTab(b.dataset.drawerTab)));
  el.brandBtn.addEventListener('click',()=>openDrawer('about'));
  el.mapBtn.addEventListener('click',()=>openDrawer('map'));
  el.closeDrawer.addEventListener('click',closeDrawer);
  el.drawer.addEventListener('click',(e)=>{ if(e.target===el.drawer) closeDrawer(); });
  document.addEventListener('keydown',e=>{
    if(el.drawer.classList.contains('open')) { if(e.key==='Escape') closeDrawer(); return; }
    if(e.key==='ArrowRight') nextSection();
    if(e.key==='ArrowLeft') prevSection();
    if(e.key==='ArrowDown' || e.key==='PageDown') nextPage();
    if(e.key==='ArrowUp' || e.key==='PageUp') prevPage();
    if(e.key==='Home') goPage(0,'down');
    if(e.key==='End') goPage(currentSection().pages.length-1,'up');
  });
  const swipeTarget = document.getElementById('app');
  let lastSwipeT = 0;
  function processSwipe(dx, dy) {
    if(el.drawer.classList.contains('open')) return;
    const now = Date.now();
    if(now - lastSwipeT < 220) return;
    const adx = Math.abs(dx), ady = Math.abs(dy);
    if(Math.max(adx,ady) < 42) return;
    lastSwipeT = now;
    if(adx > ady*1.25) { dx<0 ? nextSection() : prevSection(); }
    else { dy<0 ? nextPage() : prevPage(); }
  }
  let pStartX=0, pStartY=0;
  swipeTarget.addEventListener('pointerdown',e=>{ pStartX=e.clientX; pStartY=e.clientY; },{passive:true});
  swipeTarget.addEventListener('pointerup',e=>{ processSwipe(e.clientX-pStartX, e.clientY-pStartY); },{passive:true});
  let tStartX=0, tStartY=0;
  swipeTarget.addEventListener('touchstart',e=>{ const t=e.touches[0]; if(!t) return; tStartX=t.clientX; tStartY=t.clientY; },{passive:true});
  swipeTarget.addEventListener('touchend',e=>{ const t=e.changedTouches[0]; if(!t) return; processSwipe(t.clientX-tStartX, t.clientY-tStartY); },{passive:true});
  function showOnboardingToast() {
    try { if(localStorage.getItem('asc-shell-onboarded') === '1') return; } catch(_) {}
    el.toast.textContent = '↕ 페이지  ·  ↔ 섹션';
    el.toast.classList.add('show');
    setTimeout(()=>el.toast.classList.remove('show'), 5000);
    try { localStorage.setItem('asc-shell-onboarded', '1'); } catch(_) {}
  }
  window.addEventListener('resize', requestFrameLayout, {passive:true});
  if ('ResizeObserver' in window) new ResizeObserver(requestFrameLayout).observe(el.stage);
  initChrome(); buildDrawer(); renderPage('right'); showOnboardingToast();
})();
</script>
</body>
</html>
